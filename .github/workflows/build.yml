name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Manuales-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases (link fijo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Manuales.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Manuales.apk --title "Manuales (última versión)" --notes "Descargar Manuales.apk e instalar." --target "$GITHUB_SHA"
