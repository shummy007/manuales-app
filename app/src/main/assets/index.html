<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Especie<\/th>\n<th>Para qué<\/th>\n<th>Comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Álamo<\/td>\n<td>Leña, tablas, cabos, cortinas rompevientos<\/td>\n<td>Crece muy rápido con riego; leña liviana. Se planta de estaca<\/td>\n<\/tr>\n<tr>\n<td>Sauce (incluido el mimbre)<\/td>\n<td>Leña de turno corto, cestería, estacas<\/td>\n<td>Rebrota de cepa: se corta cada 3 a 5 años y vuelve a crecer<\/td>\n<\/tr>\n<tr>\n<td>Olmo<\/td>\n<td>Leña dura, cortinas<\/td>\n<td>Aguanta sequía y viento; se extiende solo<\/td>\n<\/tr>\n<tr>\n<td>Acacia blanca (robinia)<\/td>\n<td>La mejor leña de turno corto, postes que no se pudren<\/td>\n<td>Rebrota de cepa y aporta nitrógeno al suelo; tiene espinas y se extiende: plantar en un lugar controlado<\/td>\n<\/tr>\n<tr>\n<td>Tamarisco<\/td>\n<td>Leña en suelos salitrosos<\/td>\n<td>Aguanta sal y sequía<\/td>\n<\/tr>\n<tr>\n<td>Frutales<\/td>\n<td>Leña dura de la poda<\/td>\n<td>Lo mejor para la brasa<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Evitar<\/strong> la acacia negra (gleditsia): espinas largas que lastiman personas y animales y una invasión difícil de controlar.<\/p>\n<p><strong>Cuánto:<\/strong> con riego, una cortina o un bosquete de álamos produce mucha madera por año. Como orden de magnitud, entre un cuarto y media hectárea de álamos regados por familia alcanza para la leña de un año en una casa con estufas eficientes, cortando por turnos.<\/p>\n<p><strong>Plantar álamo y sauce de estaca<\/strong><\/p>\n<ol>\n<li>En invierno (julio y agosto), cortar ramas de un año, rectas, del grosor de un dedo pulgar, en estacas de 60 a 80 cm.<\/li>\n<li>Enterrarlas dos tercios en tierra húmeda, en surcos de riego, a 3 × 3 m para leña o en una sola fila para cortina.<\/li>\n<li>Regar todo el primer verano; desmalezar alrededor.<\/li>\n<li>Proteger del ganado y las liebres con malla.<\/li>\n<\/ol>\n<p><strong>Cortar por turnos:<\/strong> dividir el bosquete en tantas parcelas como años tarda en crecer (8 a 12 para álamo, 3 a 5 para sauce y acacia en cepa) y cortar una parcela por año. Así siempre hay leña y el bosque se renueva. Las cortinas de las chacras abandonadas son una reserva enorme, pero también hay que replantarlas.<\/p>\n<p><strong>Secar la leña<\/strong> y cortar con seguridad: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"2\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 3<\/a>.<\/p>"}]},{"t":"Animales peligrosos y jaurías","s":[{"t":"Perros asilvestrados [VITAL]","h":"<h3>Perros asilvestrados <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Cuando las ciudades colapsan, miles de perros quedan sin dueño. En semanas forman <strong>jaurías<\/strong> que matan gallinas, cabras y ovejas, y pueden atacar a chicos y a personas solas. Es uno de los riesgos más subestimados de las crisis largas.<\/p>\n<p><strong>Prevención<\/strong><\/p>\n<ul>\n<li>Cada familia, responsable de sus perros: atados o encerrados de noche, alimentados, castrados si se puede. Un perro suelto con hambre se une a otros.<\/li>\n<li>Gallineros y corrales cerrados de noche (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"6\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 7<\/a>; <span class=\"ref\">►<\/span> Manual de gallinas ponedoras).<\/li>\n<li>Los chicos, en grupo y con un adulto en zonas abiertas y a la hora del atardecer.<\/li>\n<li>Perros guardianes propios, bien criados con los animales de la chacra, son la mejor defensa.<\/li>\n<\/ul>\n<p><strong>Ante una jauría<\/strong><\/p>\n<ul>\n<li><strong>No correr:<\/strong> dispara el instinto de persecución. Quedarse de frente, retroceder despacio hacia un lugar seguro (un árbol, un auto, una casa, un muro).<\/li>\n<li>Hacerse grande, gritar con voz grave, levantar un palo o tirar piedras.<\/li>\n<li>Si atacan: proteger cuello y cara con el antebrazo envuelto en ropa; si se cae, hacerse una bola cubriendo la nuca con las manos.<\/li>\n<li>Mordeduras: <span class=\"ref\">►<\/span> Manual médico T1 4.38 (mordedura de animal y rabia).<\/li>\n<\/ul>\n<p><strong>Como comunidad:<\/strong> registrar las jaurías que aparecen, no alimentarlas, cerrar basurales, y decidir en asamblea cómo se controlan (captura y adopción, o el control con armas descrito en <a class=\"x\" data-b=\"ARM\" data-c=\"0\" data-s=\"0\"><em>Armas, caza y pesca<\/em><\/a>).<\/p>"},{"t":"Otros animales","h":"<h3>Otros animales<\/h3>\n<table>\n<thead>\n<tr>\n<th>Animal<\/th>\n<th>Dónde<\/th>\n<th>Cuidado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Jabalí<\/strong><\/td>\n<td>Islas y costas del río, chacras abandonadas<\/td>\n<td>Rompe cercos y huertas. Peligroso si está herido o con crías: no acercarse. Su carne transmite <strong>triquinosis<\/strong>: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"ARM\" data-c=\"0\" data-s=\"0\"><em>Armas, caza y pesca<\/em><\/a> y Manual médico T1 4.40<\/td>\n<\/tr>\n<tr>\n<td><strong>Zorros<\/strong> (colorado y gris)<\/td>\n<td>Bardas y chacras<\/td>\n<td>Gallinas y corderos: cercos y gallineros cerrados, hilo eléctrico (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"6\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 7<\/a>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Puma<\/strong><\/td>\n<td>Bardas y meseta<\/td>\n<td>Raro en el valle; ataca cabras y ovejas. Corrales cerrados de noche, perros guardianes<\/td>\n<\/tr>\n<tr>\n<td><strong>Yarará ñata<\/strong><\/td>\n<td>Bardas, pedreros, estepa<\/td>\n<td>Única víbora venenosa importante de la zona. Botas y palo al caminar en las bardas, mirar antes de meter la mano entre piedras <span class=\"ref\">►<\/span> Manual médico T1 3.35<\/td>\n<\/tr>\n<tr>\n<td><strong>Arañas<\/strong> (viuda negra, araña de los rincones) y <strong>escorpiones<\/strong><\/td>\n<td>Galpones, leñeras, ropa guardada<\/td>\n<td>Sacudir ropa y calzado antes de ponerse, guantes al mover leña <span class=\"ref\">►<\/span> Manual médico T1 3.36 y 3.37<\/td>\n<\/tr>\n<tr>\n<td><strong>Avispa chaqueta amarilla<\/strong><\/td>\n<td>Todo el valle a fin del verano<\/td>\n<td>Ataca comida y colmenas; picaduras múltiples <span class=\"ref\">►<\/span> Manual médico T1 3.6 (alergia grave) y <a class=\"x\" data-b=\"ABE\" data-c=\"0\" data-s=\"0\"><em>Abejas y miel<\/em><\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Roedores<\/strong><\/td>\n<td>Todo<\/td>\n<td>Hantavirus en la zona <span class=\"ref\">►<\/span> Manual médico T1 bloque 4 y T2 18.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},{"t":"Calendario de riesgos del valle","s":[{"t":"","h":"<table>\n<thead>\n<tr>\n<th>Época<\/th>\n<th>Riesgos<\/th>\n<th>Preparar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Mayo a agosto<\/strong><\/td>\n<td>Canales vacíos; heladas fuertes; humo y monóxido por estufas<\/td>\n<td>Reservas de agua y pozo; leña seca; estufas revisadas; limpieza de canales y desagües<\/td>\n<\/tr>\n<tr>\n<td><strong>Septiembre y octubre<\/strong><\/td>\n<td>Heladas tardías sobre los frutales en flor; vientos fuertes; vuelve el agua a los canales<\/td>\n<td>Cubrir frutales; atar techos e invernaderos; turnos de riego<\/td>\n<\/tr>\n<tr>\n<td><strong>Noviembre a enero<\/strong><\/td>\n<td>Crecidas por deshielo y lluvias en la cordillera; ahogamientos en canales; incendios de pastizal<\/td>\n<td>Ruta a lo alto; vigilar el río; chicos lejos de los canales; cortafuegos<\/td>\n<\/tr>\n<tr>\n<td><strong>Febrero a abril<\/strong><\/td>\n<td>Calor y viento seco; incendios; avispas; cosecha (robos)<\/td>\n<td>Agua y sombra; guardias en la cosecha; trampas de avispas<\/td>\n<\/tr>\n<tr>\n<td><strong>En cualquier época<\/strong><\/td>\n<td>Ceniza volcánica; accidentes químicos; jaurías; sismo (raro en el valle)<\/td>\n<td>Barbijos, tapas para el agua, plan de refugio<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},{"t":"Recursos de la zona: la planilla de la comunidad","s":[{"t":"Por qué","h":"<h3>Por qué<\/h3>\n<p>En una crisis larga, saber <strong>dónde está cada cosa en un radio de 10 a 20 km<\/strong> vale tanto como tenerla. Esta planilla se completa entre todos, recorriendo la zona, y se guarda con la biblioteca. Se actualiza una vez por año.<\/p>"},{"t":"Qué buscar en el Alto Valle","h":"<h3>Qué buscar en el Alto Valle<\/h3>\n<ul>\n<li><strong>Agua:<\/strong> tomas de canales, pozos de agua y perforaciones, molinos de viento, vertientes en las bardas, tramos del río con playa segura.<\/li>\n<li><strong>Tierra y piedra:<\/strong> arcilla para adobe y alfarería (prueba del frasco, <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"4\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 5<\/a>), arena, canto rodado del río, piedra para cimientos, cal.<\/li>\n<li><strong>Madera:<\/strong> cortinas de álamo, aserraderos y fábricas de cajones, chacras abandonadas con frutales.<\/li>\n<li><strong>Instalaciones frutícolas:<\/strong> galpones de empaque (cajones, bins, herramientas, paneles aislantes de las cámaras de frío que sirven para aislar casas y cavas), talleres de maquinaria agrícola, viveros.<\/li>\n<li><strong>Saberes:<\/strong> la estación del INTA Alto Valle (biblioteca, semillas, técnicos), escuelas agrotécnicas, cooperativas, productores con experiencia, herreros, mecánicos, apicultores, veterinarios, parteras.<\/li>\n<li><strong>Animales y semillas:<\/strong> quién tiene gallinas, cabras, colmenas, caballos; quién guarda semillas.<\/li>\n<li><strong>Riesgos:<\/strong> pozos petroleros, piletas, gasoductos, depósitos de agroquímicos, zonas inundables.<\/li>\n<\/ul>"},{"t":"Planilla","h":"<h3>Planilla<\/h3>\n<table>\n<thead>\n<tr>\n<th>Recurso<\/th>\n<th>Dónde (dirección, coordenadas, cómo llegar)<\/th>\n<th>Quién lo maneja o sabe<\/th>\n<th>Notas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agua de consumo segura<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pozo o perforación<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Toma de canal / compuerta<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Zona alta de evacuación<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Arcilla<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Arena y canto rodado<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cal<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Madera y leña<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Frutales abandonados<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Galpón de empaque<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Taller mecánico o herrería<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Vivero o semillero<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Molino harinero o de grano<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Colmenas<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cabras, vacas, caballos<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Médico, enfermera, partera<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Veterinario<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Radioaficionado<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Pozo petrolero, pileta o gasoducto (no acercarse)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Depósito de agroquímicos (no acercarse)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}]},{"id":"ABE","title":"Abejas y miel","sub":"Colmena, calendario, varroa, cosecha, cera","color":"#a8741a","kind":"md","c":[{"t":"Antes de empezar","s":[{"t":"Por qué abejas [VITAL]","h":"<h3>Por qué abejas <span class=\"b vital\">VITAL<\/span><\/h3>\n<ul>\n<li><strong>Miel:<\/strong> el único endulzante que una comunidad puede producir en cantidad sin cultivar caña ni remolacha. Dura años sin estropearse, conserva frutas y sirve para la hidromiel (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"2\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 3<\/a> y 9).<\/li>\n<li><strong>Polinización:<\/strong> sin abejas, los frutales, los zapallos, el girasol, la alfalfa para semilla y muchas verduras dan poco o nada. En el Alto Valle, las chacras alquilan colmenas para la floración: en un colapso, eso deja de existir.<\/li>\n<li><strong>Cera:<\/strong> velas, impermeabilizar telas, untar quesos, lubricar herramientas, cremas.<\/li>\n<li><strong>Propóleo y polen:<\/strong> usos medicinales tradicionales y alimento.<\/li>\n<li><strong>Intercambio:<\/strong> la miel y la cera son de los bienes más valiosos para el trueque.<\/li>\n<\/ul>\n<p>Una colmena bien manejada en el Alto Valle da en un buen año entre 15 y 40 kg de miel para cosechar, después de dejarle a las abejas lo que necesitan para el invierno.<\/p>"},{"t":"Antes de la primera colmena","h":"<h3>Antes de la primera colmena<\/h3>\n<ul>\n<li><strong>Alergia:<\/strong> averiguar si alguien de la familia tuvo reacciones fuertes a picaduras. Una persona alérgica puede morir por una picadura <span class=\"ref\">►<\/span> Manual médico T1 3.6 (alergia grave). Guardar el tratamiento que indica el Manual médico.<\/li>\n<li><strong>Aprender con alguien:<\/strong> una temporada al lado de un apicultor vale más que cualquier libro. En el valle hay apicultores y cooperativas; preguntar en el INTA.<\/li>\n<li><strong>Vecinos:<\/strong> ubicar las colmenas donde no molesten (ver <em>Dónde ponerlas<\/em>).<\/li>\n<li><strong>Empezar con dos colmenas:<\/strong> si una se debilita o pierde la reina, la otra sirve para salvarla.<\/li>\n<\/ul>"},{"t":"La colonia en pocas palabras","h":"<h3>La colonia en pocas palabras<\/h3>\n<table>\n<thead>\n<tr>\n<th>Integrante<\/th>\n<th>Cuántos<\/th>\n<th>Qué hace<\/th>\n<th>Vive<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reina<\/td>\n<td>Una<\/td>\n<td>Pone hasta 1.500 a 2.000 huevos por día en primavera<\/td>\n<td>2 a 4 años<\/td>\n<\/tr>\n<tr>\n<td>Obreras<\/td>\n<td>10.000 en invierno, 50.000 a 60.000 en verano<\/td>\n<td>Limpian, crían, hacen cera, guardan, defienden y pecorean (salen a buscar néctar y polen)<\/td>\n<td>6 semanas en verano; varios meses en invierno<\/td>\n<\/tr>\n<tr>\n<td>Zánganos<\/td>\n<td>Cientos, en primavera y verano<\/td>\n<td>Fecundan reinas de otras colmenas<\/td>\n<td>Se los expulsa en otoño<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>El desarrollo:<\/strong> de huevo a abeja, la reina tarda 16 días, la obrera 21 y el zángano 24. Saberlo sirve para calcular cuándo nacerá una reina nueva o cuándo no queda cría.<\/p>"}]},{"t":"La colmena y el equipo","s":[{"t":"La colmena Langstroth","h":"<h3>La colmena Langstroth<\/h3>\n<p>Es el modelo que se usa en toda la Argentina: cajas de madera con <strong>cuadros móviles<\/strong> que se sacan para revisar sin romper los panales. Usar siempre las medidas estándar: así las piezas son intercambiables con las de cualquier apicultor.<\/p>\n<table>\n<thead>\n<tr>\n<th>Pieza<\/th>\n<th>Qué es<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Piso<\/td>\n<td>Base de madera, con una abertura al frente: la <strong>piquera<\/strong> (entrada)<\/td>\n<\/tr>\n<tr>\n<td>Reductor de piquera<\/td>\n<td>Listón que achica la entrada en invierno y contra el pillaje y las avispas<\/td>\n<\/tr>\n<tr>\n<td>Cámara de cría<\/td>\n<td>Caja de 10 cuadros donde vive la reina y está la cría<\/td>\n<\/tr>\n<tr>\n<td>Alzas o melarios<\/td>\n<td>Cajas que se agregan arriba para la miel<\/td>\n<\/tr>\n<tr>\n<td>Excluidor de reina (opcional)<\/td>\n<td>Rejilla entre la cámara y el alza: pasan las obreras, no la reina<\/td>\n<\/tr>\n<tr>\n<td>Entretapa y techo<\/td>\n<td>Tapan la colmena; el techo, cubierto de chapa<\/td>\n<\/tr>\n<tr>\n<td>Cuadros<\/td>\n<td>Marcos de madera con alambres y una lámina de cera estampada<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Construirla:<\/strong> con madera de álamo o pino de 2 cm, respetando las medidas Langstroth y el \"espacio de abeja\" (alrededor de 8 mm entre cuadros y paredes): si el espacio es mayor, lo rellenan con panal; si es menor, con propóleo. Conseguir un juego de planos o una colmena de modelo y copiarla exacta. Pintar por fuera con pintura al agua o aceite de lino, nunca por dentro.<\/p>"},{"t":"Equipo mínimo","h":"<h3>Equipo mínimo<\/h3>\n<ul>\n<li><strong>Velo o careta<\/strong> y ropa clara, lisa y cerrada en tobillos y muñecas; guantes (al principio).<\/li>\n<li><strong>Ahumador:<\/strong> un tarro con fuelle donde se quema arpillera, cartón corrugado, aserrín, pinocha o bosta seca. El humo frío calma a las abejas.<\/li>\n<li><strong>Palanca de apicultor<\/strong> (una espátula de hierro) para despegar cuadros y cajas.<\/li>\n<li><strong>Cepillo o pluma<\/strong> para sacar abejas de los cuadros.<\/li>\n<li><strong>Alimentadores<\/strong> (un frasco con tapa agujereada, o un alimentador de cuadro).<\/li>\n<li>Guardar ahora <strong>láminas de cera estampada, alambre de acero fino y cuadros de repuesto<\/strong>.<\/li>\n<\/ul>"},{"t":"Dónde ponerlas","h":"<h3>Dónde ponerlas<\/h3>\n<ul>\n<li>Al sol de la mañana y con media sombra en las horas de calor, <strong>reparadas del viento del oeste<\/strong> (detrás de una cortina de álamos o un cerco).<\/li>\n<li>La piquera mirando al este o al norte.<\/li>\n<li>Sobre caballetes o bloques a 30 a 40 cm del suelo, un poco inclinadas hacia adelante para que escurra el agua.<\/li>\n<li>Con <strong>agua cerca:<\/strong> un bebedero con piedritas o palitos donde puedan pararse sin ahogarse (si no, van a la pileta del vecino).<\/li>\n<li>A 10 metros o más de caminos, casas, corrales y lugares donde juegan los chicos, o detrás de un cerco de 2 metros que las obligue a volar alto.<\/li>\n<li>Lejos de chacras que se pulverizan con insecticidas (ver <em>Venenos<\/em>).<\/li>\n<\/ul>"}]},{"t":"Conseguir abejas","s":[{"t":"","h":"<ol>\n<li><strong>Núcleo:<\/strong> una caja chica con 4 o 5 cuadros con abejas, cría y una reina joven, que se compra a un apicultor en primavera. Es lo más seguro.<\/li>\n<li><strong>Paquete de abejas<\/strong> con reina: más barato, más lento para arrancar.<\/li>\n<li><strong>Enjambre:<\/strong> en primavera, las colonias fuertes se dividen y la mitad se va con la reina vieja; se posan unas horas en una rama formando un racimo. Se recogen sacudiendo la rama sobre una caja con cuadros y dejándola en el lugar hasta la tarde. Es gratis, pero la genética es desconocida.<\/li>\n<li><strong>Caja trampa:<\/strong> una caja vieja con olor a cera, un cuadro de panal viejo y unas gotas de cera derretida, colocada a 3 metros de altura en primavera. Los enjambres la eligen solos.<\/li>\n<li><strong>Rescatar colonias<\/strong> de paredes, techos o árboles: requiere experiencia; aprenderlo con un apicultor.<\/li>\n<\/ol>\n<p><strong>Abejas africanizadas:<\/strong> en el norte del país las abejas son muy defensivas por el cruce con la abeja africana. En la Patagonia predominan las europeas, más mansas. Si una colonia es muy agresiva (persigue a las personas lejos de la colmena), cambiarle la reina por una de una colonia mansa.<\/p>"}]},{"t":"El año de la colmena en el Alto Valle","s":[{"t":"","h":"<table>\n<thead>\n<tr>\n<th>Época<\/th>\n<th>En la colmena<\/th>\n<th>Tareas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Junio y julio<\/strong><\/td>\n<td>Invierno: racimo apretado, casi sin cría<\/td>\n<td><strong>No abrir.<\/strong> Revisar desde afuera: techos firmes, peso (levantar desde atrás), piquera reducida, ratones. Tratamiento de varroa con ácido oxálico si corresponde<\/td>\n<\/tr>\n<tr>\n<td><strong>Agosto<\/strong><\/td>\n<td>Empieza la cría con los primeros sauces y almendros<\/td>\n<td>Revisión rápida en un día cálido sin viento (más de 15 °C): reina, cría, reservas. Si hay poca miel, alimentar<\/td>\n<\/tr>\n<tr>\n<td><strong>Septiembre y octubre<\/strong><\/td>\n<td>Crece rápido con la floración de frutales y dientes de león<\/td>\n<td>Revisar cada 10 días. Dar espacio (agregar alza) para evitar la enjambrazón. Polinización de frutales<\/td>\n<\/tr>\n<tr>\n<td><strong>Noviembre y diciembre<\/strong><\/td>\n<td>Colonia en su máximo; enjambrazón<\/td>\n<td>Revisar celdas reales; dividir colonias fuertes; agregar alzas. Empieza la mielada con alfalfa, tréboles, meliloto y cardos<\/td>\n<\/tr>\n<tr>\n<td><strong>Enero y febrero<\/strong><\/td>\n<td>Mielada principal<\/td>\n<td>Alzas; cosechar los cuadros operculados; vigilar avispas y pillaje<\/td>\n<\/tr>\n<tr>\n<td><strong>Marzo<\/strong><\/td>\n<td>Fin de la mielada<\/td>\n<td>Última cosecha <strong>dejando las reservas<\/strong>; control de varroa; reducir piqueras<\/td>\n<\/tr>\n<tr>\n<td><strong>Abril y mayo<\/strong><\/td>\n<td>Se prepara el invierno; expulsa los zánganos<\/td>\n<td>Unir colonias débiles; alimentar si faltan reservas; tapas y techos firmes, piso seco<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Las revisiones","h":"<h3>Las revisiones<\/h3>\n<ul>\n<li>En días tibios, sin viento, entre las 10 y las 16 horas, cuando las pecoreadoras están afuera.<\/li>\n<li>Movimientos lentos, sin golpear; humo suave en la piquera y debajo de la tapa.<\/li>\n<li><strong>Qué mirar:<\/strong> cría compacta (señal de reina buena), huevos (reina presente hace menos de 3 días), reservas de miel y polen, espacio libre, celdas reales, enfermedades.<\/li>\n<li>No más de 15 minutos con la colmena abierta; menos con frío.<\/li>\n<li>Anotar todo en la ficha de cada colmena (cap. 10).<\/li>\n<\/ul>"},{"t":"Reservas para el invierno [VITAL]","h":"<h3>Reservas para el invierno <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>El error que más colmenas mata es cosechar de más. En el Alto Valle, una colmena tiene que entrar al invierno con <strong>al menos 15 a 20 kg de miel<\/strong>: la cámara de cría con 4 a 6 cuadros llenos de miel operculada a los costados y arriba del racimo. Si falta, darle miel propia o jarabe (cap. 6) en marzo y abril, nunca en pleno invierno.<\/p>"}]},{"t":"Enjambrazón, multiplicación y reinas","s":[{"t":"Evitar perder los enjambres","h":"<h3>Evitar perder los enjambres<\/h3>\n<p>En primavera, una colonia fuerte con falta de espacio cría reinas nuevas (las <strong>celdas reales<\/strong>, como maníes colgando en el borde de los cuadros) y se va la mitad. Para evitarlo:<\/p>\n<ul>\n<li>Agregar alzas a tiempo, antes de que estén llenas.<\/li>\n<li>Cambiar cuadros llenos de la cámara por cuadros vacíos con cera.<\/li>\n<li>Reinas jóvenes (de menos de 2 años) enjambran menos.<\/li>\n<li>Si ya hay celdas reales: dividir la colmena (abajo).<\/li>\n<\/ul>"},{"t":"Dividir una colmena (núcleo artificial)","h":"<h3>Dividir una colmena (núcleo artificial)<\/h3>\n<p>Con una colonia fuerte, en noviembre o diciembre:<\/p>\n<ol>\n<li>En una caja nueva poner <strong>4 cuadros<\/strong>: 2 con cría de todas las edades (incluidos huevos) y abejas adheridas, 1 con miel, 1 con polen; completar con cuadros con cera.<\/li>\n<li>Sacudir dentro abejas de otros 2 cuadros (las jóvenes se quedan).<\/li>\n<li>Asegurarse de que <strong>la reina vieja quede en la colmena madre<\/strong>.<\/li>\n<li>Llevar el núcleo a más de 3 km durante una semana, o cerrar la piquera con pasto 48 horas, para que las pecoreadoras no vuelvan a la colmena madre.<\/li>\n<li>Las abejas crían una reina nueva con los huevos: nace en unos 16 días, sale a fecundarse y empieza a poner a las 3 o 4 semanas.<\/li>\n<li>Si a las 5 semanas no hay huevos, la reina se perdió: unir el núcleo a otra colmena o darle un cuadro con huevos.<\/li>\n<\/ol>"},{"t":"Unir colmenas débiles","h":"<h3>Unir colmenas débiles<\/h3>\n<p>En otoño, dos colonias débiles mueren; juntas, pasan el invierno. Sacar la reina de la peor, poner su caja encima de la otra con <strong>una hoja de diario con unos agujeros chicos<\/strong> entre las dos: las abejas comen el papel en dos días y se mezclan sin pelearse.<\/p>"},{"t":"Colmena huérfana","h":"<h3>Colmena huérfana<\/h3>\n<p>Sin cría joven ni huevos, abejas inquietas, ruido \"de lamento\", a veces obreras que ponen varios huevos por celda. Darle un cuadro con huevos de otra colmena para que críe reina, o unirla a otra.<\/p>"}]},{"t":"Alimentación","s":[{"t":"","h":"<ul>\n<li><strong>Lo mejor es su propia miel.<\/strong> Guardar algunos cuadros de miel operculada de la cosecha para dar en otoño o a fines de invierno.<\/li>\n<li><strong>Jarabe de otoño (reservas):<\/strong> 2 partes de azúcar en 1 de agua tibia (no hervida con el azúcar). En marzo y abril.<\/li>\n<li><strong>Jarabe de primavera (estímulo):<\/strong> 1 de azúcar en 1 de agua, en agosto y septiembre, solo si hay poca reserva.<\/li>\n<li><strong>Nunca miel comprada o de otras colmenas desconocidas:<\/strong> puede traer esporas de loque americana.<\/li>\n<li>Alimentar al atardecer y por dentro de la colmena, para no provocar pillaje.<\/li>\n<li><strong>Sin azúcar:<\/strong> cuadros de miel guardados, o arrope muy diluido en emergencias. La mejor estrategia es no cosechar de más.<\/li>\n<li><strong>Polen:<\/strong> si falta en primavera temprana, harina de legumbres o de soja con un poco de miel, en una pasta sobre los cuadros.<\/li>\n<\/ul>"}]},{"t":"Sanidad","s":[{"t":"Varroa: la enfermedad que decide si la colmena vive [VITAL]","h":"<h3>Varroa: la enfermedad que decide si la colmena vive <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Un ácaro rojizo, del tamaño de una cabeza de alfiler, que se alimenta de las larvas y las abejas y les transmite virus. Está en todas las colmenas del país. <strong>Sin control, una colmena muere en uno a tres años.<\/strong><\/p>\n<p><strong>Medir<\/strong> (en primavera y al fin de la cosecha):<\/p>\n<ol>\n<li>Juntar en un frasco unas 300 abejas (media taza) de un cuadro con cría, sin la reina.<\/li>\n<li>Agregar dos cucharadas de <strong>azúcar impalpable<\/strong>, tapar con una malla y agitar 1 minuto; dejar 2 minutos y agitar de nuevo sobre un plato blanco con agua. Los ácaros caen y se ven. Las abejas se devuelven vivas.<\/li>\n<li>Contar: más de <strong>3 ácaros cada 100 abejas<\/strong> = tratar.<\/li>\n<\/ol>\n<p><strong>Tratar sin agroquímicos de síntesis<\/strong><\/p>\n<ul>\n<li><strong>Ácido oxálico:<\/strong> el tratamiento más usado en apicultura orgánica. Funciona sobre las varroas que están sobre las abejas, no las que están dentro de la cría tapada: por eso se usa <strong>cuando no hay cría o hay muy poca<\/strong> (fin de otoño o invierno, o después de \"cortar\" la cría encerrando a la reina). Se aplica goteado en jarabe entre los cuadros. Guardar ácido oxálico dihidratado de calidad y seguir las dosis de un producto registrado o de un instructivo del INTA. Guantes y anteojos: es tóxico y corrosivo.<\/li>\n<li><strong>Timol:<\/strong> productos a base de timol (aceite esencial del tomillo) desarrollados por el INTA y empresas argentinas, que se usan con cría y temperaturas templadas.<\/li>\n<li><strong>Ácido fórmico:<\/strong> eficaz con cría, pero peligroso de manipular y dependiente de la temperatura.<\/li>\n<li><strong>Manejo:<\/strong> cortar la cría (dividir colmenas o encerrar la reina 3 semanas) y tratar cuando no hay cría tapada; trampa de cría de zánganos (un cuadro sin cera estampada que las abejas llenan de celdas de zángano, donde va la varroa; se corta y se tira operculado).<\/li>\n<li><strong>Rotar<\/strong> productos de un año a otro para que la varroa no se haga resistente. Nunca tratar con alzas puestas para cosechar.<\/li>\n<\/ul>"},{"t":"Otras enfermedades y problemas","h":"<h3>Otras enfermedades y problemas<\/h3>\n<table>\n<thead>\n<tr>\n<th>Problema<\/th>\n<th>Señales<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Loque americana<\/strong><\/td>\n<td>Cría salteada, opérculos hundidos, oscuros y perforados; olor a cola de carpintero. Al meter un palito en una larva muerta y sacarlo, sale un hilo marrón elástico de 2 a 3 cm<\/td>\n<td><strong>No tiene cura.<\/strong> Las esporas duran décadas. Cerrar la colmena de noche, matar las abejas, <strong>quemar<\/strong> cuadros, miel y abejas en un pozo, y quemar el interior de la caja con soplete. Nunca compartir material de esa colmena<\/td>\n<\/tr>\n<tr>\n<td><strong>Loque europea<\/strong><\/td>\n<td>Larvas amarillentas, retorcidas, sin hilo elástico<\/td>\n<td>Cambiar reina, dar cuadros con cría sana, fortalecer; cuadros viejos al fuego<\/td>\n<\/tr>\n<tr>\n<td><strong>Cría yesificada<\/strong><\/td>\n<td>Larvas duras, blancas o grises, como tiza, en la piquera<\/td>\n<td>Humedad y frío: colmena más seca, ventilada y al sol; cambiar reina<\/td>\n<\/tr>\n<tr>\n<td><strong>Nosemosis<\/strong><\/td>\n<td>Abejas débiles, manchas de diarrea en el frente de la colmena a fin del invierno<\/td>\n<td>Cambiar cuadros viejos, colmena seca, buena alimentación<\/td>\n<\/tr>\n<tr>\n<td><strong>Polilla de la cera<\/strong><\/td>\n<td>Galerías y telarañas en cuadros guardados o en colmenas débiles<\/td>\n<td>Colonias fuertes; cuadros guardados al frío, en el freezer 2 días, o colgados con luz y aire<\/td>\n<\/tr>\n<tr>\n<td><strong>Pillaje<\/strong><\/td>\n<td>Peleas en la piquera, abejas que entran sin carga y salen pesadas<\/td>\n<td>Reducir la piquera, no dejar miel ni cuadros a la vista, alimentar de noche<\/td>\n<\/tr>\n<tr>\n<td><strong>Avispa chaqueta amarilla<\/strong><\/td>\n<td>A fin del verano atacan las piqueras y se llevan abejas<\/td>\n<td>Reducir piqueras; trampas de botella con un trozo de carne o pescado (las avispas, no las abejas, van a la proteína); destruir los nidos de tierra de noche<\/td>\n<\/tr>\n<tr>\n<td><strong>Ratones<\/strong><\/td>\n<td>Panales roídos en invierno<\/td>\n<td>Reductor de piquera de chapa con agujeros de 8 mm<\/td>\n<\/tr>\n<tr>\n<td><strong>Hormigas<\/strong><\/td>\n<td>Filas hacia la colmena<\/td>\n<td>Patas del caballete en latas con agua y aceite<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Venenos","h":"<h3>Venenos<\/h3>\n<p>Las pulverizaciones de insecticidas en las chacras (sobre todo contra carpocapsa) matan abejas en masa: la colmena amanece con miles de muertas en la piquera. Acordar con los vecinos no fumigar en floración y avisar antes, para cerrar las colmenas un día. En la propia chacra, usar los métodos del capítulo de plagas (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"8\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 9<\/a>).<\/p>"}]},{"t":"Cosecha y procesamiento","s":[{"t":"Cuándo y cuánto","h":"<h3>Cuándo y cuánto<\/h3>\n<ul>\n<li>Solo cuadros con <strong>al menos tres cuartos de las celdas operculadas<\/strong> (tapadas con cera): la miel está madura, con poca agua, y no fermenta.<\/li>\n<li>Sacar solo de las alzas, nunca de la cámara de cría. Dejar siempre las reservas de invierno (cap. 4).<\/li>\n<li>En días de buena mielada, a media mañana. Sacar las abejas con humo y cepillo, o con una entretapa de escape (una salida de una sola mano) puesta el día anterior.<\/li>\n<\/ul>"},{"t":"Extraer sin centrífuga","h":"<h3>Extraer sin centrífuga<\/h3>\n<ol>\n<li><strong>Desopercular:<\/strong> cortar la tapa de cera con un cuchillo caliente o un tenedor, sobre una fuente.<\/li>\n<li><strong>Escurrir:<\/strong> apoyar los cuadros desoperculados inclinados sobre una bandeja, en un cuarto cálido (25 a 30 °C) y cerrado a las abejas, durante un día.<\/li>\n<li><strong>Prensar:<\/strong> si no se quiere devolver los panales, cortar el panal en trozos y aplastarlo en una tela fina colgada sobre un balde; se escurre por gravedad. (La centrífuga deja los panales enteros para reutilizar: si la comunidad puede, conseguir una.)<\/li>\n<li><strong>Filtrar<\/strong> por una tela o un colador fino.<\/li>\n<li><strong>Decantar<\/strong> 3 a 5 días en un balde tapado: las burbujas y restos de cera suben y se sacan con cuchara.<\/li>\n<li><strong>Envasar<\/strong> en frascos de vidrio limpios y secos, bien tapados.<\/li>\n<\/ol>\n<p><strong>Higiene:<\/strong> todo limpio y seco; la miel absorbe agua del aire y fermenta. Nunca recipientes de hierro o zinc sin esmaltar.<\/p>"},{"t":"Guardar la miel","h":"<h3>Guardar la miel<\/h3>\n<ul>\n<li>Tapada, en lugar seco y fresco, <strong>dura años<\/strong>. Su único enemigo es la humedad.<\/li>\n<li>Que se ponga dura (cristalice) es normal y es señal de miel pura: se vuelve líquida a baño María tibio, sin pasar de 40 °C.<\/li>\n<li>Si huele a alcohol o hace espuma, fermentó: sirve para hidromiel o vinagre, o para alimentar a las propias abejas (nunca a otras).<\/li>\n<li><strong>No dar miel a bebés de menos de un año<\/strong> (puede causar botulismo infantil).<\/li>\n<\/ul>"},{"t":"Cera","h":"<h3>Cera<\/h3>\n<ol>\n<li>Juntar opérculos, panales viejos y restos.<\/li>\n<li>Derretir en agua caliente a baño María o en una olla con agua, <strong>nunca a fuego directo<\/strong> (la cera se prende fuego y arde como aceite).<\/li>\n<li>Colar por una tela y dejar enfriar en un recipiente con agua: la cera queda en un disco arriba.<\/li>\n<li>Volver a fundir y colar hasta que quede limpia.<\/li>\n<li><strong>Fundidor solar:<\/strong> una caja de madera con tapa de vidrio y una bandeja de chapa inclinada hacia un recipiente; al sol del verano, la cera se derrite y escurre limpia.<\/li>\n<\/ol>\n<p><strong>Usos:<\/strong> velas (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"2\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 3<\/a>), cera estampada para cuadros (con un molde, o dejar que las abejas hagan el panal desde una tira de cera arriba del cuadro), lustre para madera (cera con aceite), telas enceradas para tapar comida, untar quesos, desodorante y jabón (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"8\" data-s=\"0\"><em>Casa<\/em>, cap. 9<\/a>).<\/p>"},{"t":"Propóleo y polen","h":"<h3>Propóleo y polen<\/h3>\n<ul>\n<li><strong>Propóleo:<\/strong> se raspa de los bordes y las tapas. Macerado 2 semanas en alcohol (una parte en tres), se cuela: la tintura de propóleo es un antiséptico tradicional para heridas chicas y garganta. No reemplaza los tratamientos del Manual médico.<\/li>\n<li><strong>Polen:<\/strong> con una trampa de polen en la piquera (una rejilla que les saca las bolitas de las patas). Secarlo a la sombra y guardarlo en frascos. No sacar más de unas semanas por año: la colmena lo necesita.<\/li>\n<\/ul>"}]},{"t":"Polinización de frutales y cultivos","s":[{"t":"","h":"<ul>\n<li><strong>Frutales:<\/strong> en las chacras del valle se usan entre 2 y 4 colmenas por hectárea en floración. Para una huerta y un monte familiar, 2 colmenas alcanzan.<\/li>\n<li>Llevar las colmenas cuando florece el 5 al 10 % del monte, no antes (si no, se van a otras flores).<\/li>\n<li><strong>Plantar para las abejas:<\/strong> sauces y almendros (primeras flores), frutales, diente de león (dejarlo en los bordes), alfalfa y tréboles en flor, facelia, borraja, lavanda, romero, girasol, zapallos, meliloto en las banquinas. Que haya flores de agosto a abril.<\/li>\n<li>Sin abejas: polinizar a mano zapallos y frutales chicos con un pincel (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"3\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 4<\/a>).<\/li>\n<\/ul>"}]},{"t":"Registros y calendario","s":[{"t":"Ficha de cada colmena","h":"<h3>Ficha de cada colmena<\/h3>\n<table>\n<thead>\n<tr>\n<th>Fecha<\/th>\n<th>Reina (vista, huevos)<\/th>\n<th>Cuadros con cría<\/th>\n<th>Reservas (kg o cuadros)<\/th>\n<th>Varroa (por cada 100)<\/th>\n<th>Hecho (alza, división, tratamiento, cosecha)<\/th>\n<th>Kg cosechados<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Datos de bolsillo","h":"<h3>Datos de bolsillo<\/h3>\n<table>\n<thead>\n<tr>\n<th>Dato<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Desarrollo de huevo a adulto<\/td>\n<td>Reina 16 días, obrera 21, zángano 24<\/td>\n<\/tr>\n<tr>\n<td>La reina nueva pone huevos<\/td>\n<td>3 a 4 semanas después de nacer<\/td>\n<\/tr>\n<tr>\n<td>Reservas para el invierno en el valle<\/td>\n<td>15 a 20 kg de miel por colmena<\/td>\n<\/tr>\n<tr>\n<td>Cosecha aprovechable en buen año<\/td>\n<td>15 a 40 kg por colmena<\/td>\n<\/tr>\n<tr>\n<td>Umbral de varroa para tratar<\/td>\n<td>Más de 3 ácaros cada 100 abejas<\/td>\n<\/tr>\n<tr>\n<td>Jarabe de otoño<\/td>\n<td>2 de azúcar : 1 de agua<\/td>\n<\/tr>\n<tr>\n<td>Jarabe de primavera<\/td>\n<td>1 de azúcar : 1 de agua<\/td>\n<\/tr>\n<tr>\n<td>Miel para guardar<\/td>\n<td>3/4 de las celdas operculadas<\/td>\n<\/tr>\n<tr>\n<td>Colmenas para polinizar frutales<\/td>\n<td>2 a 4 por hectárea<\/td>\n<\/tr>\n<tr>\n<td>Miel a bebés<\/td>\n<td>Nunca antes del año<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}]},{"id":"ARM","title":"Armas, caza y pesca","sub":"Ley, seguridad, caza, pesca, legítima defensa","color":"#4a6a52","kind":"md","c":[{"t":"Antes de empezar","s":[{"t":"Para qué es este libro","h":"<h3>Para qué es este libro<\/h3>\n<p>Esta biblioteca fue pensada para una comunidad ovolactovegetariana y pacífica. Este libro no cambia eso: trata las armas, la caza y la pesca como <strong>herramientas de último recurso<\/strong>, para tres situaciones concretas:<\/p>\n<ol>\n<li><strong>Comer<\/strong> cuando el sistema ovolactovegetariano no alcanza: cazar animales exóticos que son plaga (conejo silvestre, liebre, jabalí, ciervo colorado) y pescar. Es la misma lógica que el manual de <a class=\"x\" data-b=\"CON\" data-c=\"0\" data-s=\"0\"><em>Conejos: cría de último recurso<\/em>, cap. 1<\/a>, y se decide de la misma forma: en asamblea, con respeto a quien no quiere participar.<\/li>\n<li><strong>Proteger los animales y la huerta<\/strong> de jaurías de perros asilvestrados, zorros, pumas y jabalíes (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"RIE\" data-c=\"7\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em>, cap. 8<\/a>).<\/li>\n<li><strong>Defender la vida<\/strong> de personas de la comunidad cuando no queda ninguna otra salida, dentro de lo que la ley llama legítima defensa (cap. 7).<\/li>\n<\/ol>\n<p><strong>Lo que este libro no trata, a propósito:<\/strong> la fabricación o modificación de armas y municiones, la recarga de munición, los explosivos y las tácticas de combate. Son actividades que la ley restringe y que causan más muertes accidentales que vidas salvadas en manos sin formación profesional. Las armas se compran registradas, se aprenden con instructores y se mantienen como dice su fabricante.<\/p>"},{"t":"Una regla para la comunidad","h":"<h3>Una regla para la comunidad<\/h3>\n<p>Un arma en una casa aumenta el riesgo de accidentes, de suicidio y de que una pelea termine en muerte, sobre todo con alcohol, con chicos en la casa o con personas en crisis <span class=\"ref\">►<\/span> Manual médico T1 3.44 y bloque 8. Por eso, antes de tener armas, la comunidad decide por escrito quién puede tenerlas, dónde se guardan y cuándo se usan (cap. 8).<\/p>"}]},{"t":"La ley en Argentina","s":[{"t":"","h":"<div class=\"atencion\">\n<p>Lo que sigue es un resumen orientativo de la situación a fines de 2026. Las normas de armas cambiaron varias veces en los últimos años: confirmar siempre en el RENAR, en un club de tiro o con un abogado antes de comprar, transportar o usar un arma. Este libro no es asesoramiento legal.<\/p>\n<\/div>"},{"t":"El marco","h":"<h3>El marco<\/h3>\n<ul>\n<li>La <strong>Ley Nacional de Armas y Explosivos N.º 20.429<\/strong> y su reglamentación (Decreto 395/75 y modificaciones) regulan todas las armas de fuego y municiones.<\/li>\n<li>El organismo de control es el <strong>Registro Nacional de Armas (RENAR)<\/strong>, que depende del Ministerio de Seguridad Nacional (entre 2015 y 2025 se llamó ANMaC).<\/li>\n<li>Las armas se clasifican en <strong>de uso civil<\/strong> (por ejemplo, escopetas y carabinas o rifles de ciertos calibres) y <strong>de uso civil condicional<\/strong>, con más requisitos. Las de guerra están prohibidas para civiles salvo excepciones.<\/li>\n<\/ul>"},{"t":"Legítimo usuario","h":"<h3>Legítimo usuario<\/h3>\n<p>Para comprar y tener un arma hay que ser <strong>legítimo usuario<\/strong>. Desde diciembre de 2024 la edad mínima es <strong>18 años<\/strong>. Los requisitos generales son:<\/p>\n<ul>\n<li>No tener antecedentes penales ni procesos pendientes.<\/li>\n<li>Certificado de aptitud psicofísica.<\/li>\n<li>Acreditar <strong>idoneidad<\/strong> en el manejo de armas (examen con un instructor habilitado).<\/li>\n<li>Acreditar medios de vida lícitos y domicilio.<\/li>\n<li>El trámite se hace en el RENAR, también en forma digital (\"CLU Digital\", por la plataforma MiRenar).<\/li>\n<\/ul>"},{"t":"Tenencia, portación, transporte y munición","h":"<h3>Tenencia, portación, transporte y munición<\/h3>\n<ul>\n<li><strong>Tenencia:<\/strong> cada arma tiene su credencial de tenencia a nombre del legítimo usuario y se guarda en el domicilio declarado.<\/li>\n<li><strong>Portación<\/strong> (llevar el arma cargada y lista en la calle) es otra autorización, mucho más restringida y excepcional. Tener un arma <strong>no autoriza a portarla<\/strong>.<\/li>\n<li><strong>Transporte:<\/strong> descargada, separada de la munición, en estuche cerrado, con la credencial, y por un motivo justificado (ir al club de tiro, a cazar con licencia, al armero).<\/li>\n<li><strong>Munición:<\/strong> se compra solo para los calibres de las armas registradas y con control de consumo.<\/li>\n<li><strong>Armas heredadas o sin papeles:<\/strong> registrarlas a nombre de un legítimo usuario o entregarlas a la autoridad. Un arma no registrada es un delito.<\/li>\n<\/ul>"},{"t":"Caza y pesca","h":"<h3>Caza y pesca<\/h3>\n<ul>\n<li><strong>Caza:<\/strong> cada provincia otorga licencias y fija especies y temporadas. En Río Negro, la autoridad de fauna permite cazar todo el año y sin cupo especies exóticas invasoras como el <strong>conejo silvestre, el jabalí y el ciervo colorado<\/strong>; la liebre y otras especies tienen reglas propias. <strong>Las especies nativas<\/strong> (guanaco, choique, mara, piche, zorro gris en muchas épocas, aves) están protegidas o reguladas: no se cazan sin autorización.<\/li>\n<li><strong>Pesca:<\/strong> en Río Negro, Neuquén, Chubut y Parques Nacionales rige un <strong>reglamento de pesca deportiva continental patagónico<\/strong> común, con un único permiso. La temporada general va del 1 de noviembre al 1 de mayo, con excepciones por ambiente. Varias especies nativas son de <strong>devolución obligatoria<\/strong>.<\/li>\n<\/ul>\n<p><strong>En un colapso<\/strong> los organismos pueden dejar de funcionar, pero la comunidad sigue las mismas reglas por su cuenta: respetar las especies nativas y las vedas de reproducción es lo que permite que haya caza y pesca el año siguiente.<\/p>"}]},{"t":"Seguridad con armas","s":[{"t":"Las cuatro reglas [VITAL]","h":"<h3>Las cuatro reglas <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Todos los accidentes con armas vienen de romper alguna de estas reglas. Se enseñan antes que cualquier otra cosa y se repiten siempre:<\/p>\n<ol>\n<li><strong>Toda arma está cargada.<\/strong> Siempre, aunque alguien diga que no, aunque uno mismo la haya descargado.<\/li>\n<li><strong>Nunca apuntar a nada que no se quiera destruir.<\/strong> El caño mira siempre en una dirección segura: al suelo lejos de los pies o al cielo, nunca a una persona, ni en broma.<\/li>\n<li><strong>El dedo fuera del gatillo<\/strong> y fuera del guardamonte hasta el momento de disparar.<\/li>\n<li><strong>Estar seguro del blanco y de lo que hay detrás.<\/strong> Una bala de rifle sigue peligrosa a más de 2 km; un perdigón rebota en el agua y las piedras. Nunca disparar a un ruido, a una sombra o a algo que se mueve entre los arbustos.<\/li>\n<\/ol>"},{"t":"Guardar las armas","h":"<h3>Guardar las armas<\/h3>\n<ul>\n<li><strong>Descargadas, bajo llave,<\/strong> en un armario o caja metálica cerrada, con la munición guardada <strong>aparte<\/strong>, también bajo llave.<\/li>\n<li>Las llaves, solo los adultos autorizados; nunca escondidas en un lugar que los chicos puedan encontrar.<\/li>\n<li>Lejos de la humedad: un trapo levemente aceitado sobre las partes de metal y una bolsita de sílica gel o de arroz en la caja.<\/li>\n<li><strong>Nunca<\/strong> un arma cargada en un cajón, bajo la almohada, en el auto o colgada en la pared.<\/li>\n<li>En una crisis, con la casa llena de gente, es cuando más cuidado hace falta: no menos.<\/li>\n<\/ul>"},{"t":"Chicos y armas","h":"<h3>Chicos y armas<\/h3>\n<ul>\n<li>A los chicos chicos se les enseña una sola regla: <strong>\"Si ves un arma: no la toques, alejate y avisale a un adulto.\"<\/strong> Practicarla como juego.<\/li>\n<li>Los adolescentes aprenden las cuatro reglas y, si la comunidad lo decide, a tirar con un instructor, en un club o polígono, siempre supervisados.<\/li>\n<li>Ningún menor accede solo a las armas ni a las llaves.<\/li>\n<\/ul>"},{"t":"Alcohol, crisis y conflictos","h":"<h3>Alcohol, crisis y conflictos<\/h3>\n<ul>\n<li>Nunca manipular armas después de tomar alcohol o con sueño, enojo o tristeza intensa.<\/li>\n<li>Si alguien en la casa atraviesa una crisis, habla de matarse o de matar, o tiene episodios de violencia: <strong>sacar las armas de la casa<\/strong> (llevarlas al armero comunitario, cap. 8) hasta que pase <span class=\"ref\">►<\/span> Manual médico T1 3.44 y 8.9.<\/li>\n<li>Las peleas entre vecinos se resuelven en la asamblea, nunca con un arma en la mano (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 4<\/a>).<\/li>\n<\/ul>"},{"t":"Manejo básico seguro","h":"<h3>Manejo básico seguro<\/h3>\n<ul>\n<li><strong>Al recibir un arma de otra persona:<\/strong> con el caño hacia un lugar seguro, abrir la acción y <strong>verificar con la vista y con el dedo<\/strong> que la recámara y el cargador están vacíos, aunque el otro diga que lo están.<\/li>\n<li><strong>Al cruzar un alambrado o una zanja:<\/strong> descargar el arma, pasarla al otro lado y apoyarla, cruzar, y recién ahí levantarla.<\/li>\n<li><strong>No correr ni trepar<\/strong> con un arma cargada.<\/li>\n<li><strong>Protección:<\/strong> anteojos y protectores auditivos (tapones) siempre que se dispara. La pérdida de audición por disparos es permanente.<\/li>\n<li><strong>Fallas:<\/strong> si el arma no dispara al apretar el gatillo, mantenerla apuntando a lugar seguro 30 segundos antes de abrirla (puede ser un disparo demorado).<\/li>\n<li><strong>Limpieza y mantenimiento:<\/strong> seguir el manual del fabricante; limpiar después de usar, sobre todo después de lluvia o polvo, con el arma descargada y la munición en otra habitación. No modificar mecanismos: un arma modificada puede explotar en las manos o disparar sola.<\/li>\n<\/ul>"},{"t":"Aprender","h":"<h3>Aprender<\/h3>\n<ul>\n<li>Las armas se aprenden con un <strong>instructor habilitado<\/strong>, en un <strong>club de tiro o polígono<\/strong>, no con libros ni videos. Hacer un curso de seguridad y uno de caza antes de la crisis.<\/li>\n<li>Practicar regularmente con la misma arma: un tirador que no practica erra, y un tiro errado en la caza es un animal herido que sufre y en la defensa es un peligro para los propios.<\/li>\n<\/ul>"}]},{"t":"Qué armas sirven en el campo","s":[{"t":"","h":"<table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Para qué<\/th>\n<th>Comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Carabina calibre .22<\/strong><\/td>\n<td>Conejos, liebres, plagas chicas a corta distancia<\/td>\n<td>Poco retroceso y ruido, munición barata y liviana. La más útil para una comunidad. Peligrosa a gran distancia: siempre con un fondo seguro (una barranca de tierra)<\/td>\n<\/tr>\n<tr>\n<td><strong>Escopeta<\/strong> (calibres 12, 16 o 20)<\/td>\n<td>Aves, liebres, zorros a corta distancia; perros asilvestrados en el corral<\/td>\n<td>Muy versátil; con perdigones el alcance peligroso es corto. Pesada de munición<\/td>\n<\/tr>\n<tr>\n<td><strong>Rifle de caza mayor<\/strong> (calibres medianos de uso civil)<\/td>\n<td>Jabalí, ciervo colorado<\/td>\n<td>Exige práctica, buena mira y un fondo seguro. Solo para cazadores formados<\/td>\n<\/tr>\n<tr>\n<td><strong>Aire comprimido<\/strong><\/td>\n<td>Ratas, palomas y plagas muy chicas a pocos metros<\/td>\n<td>Silencioso y barato; no sirve para animales grandes. Consultar las normas según el calibre<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pocas armas, bien elegidas y bien mantenidas,<\/strong> son mejores que muchas. Una comunidad chica se arregla con una o dos carabinas .22 y una escopeta, en manos de dos o tres personas formadas.<\/p>\n<p><strong>Munición:<\/strong> guardarla en su caja original, dentro de un recipiente hermético, en un lugar fresco, seco y bajo llave, lejos del fuego y separada de las armas. Bien guardada dura décadas. Anotar cuánta hay y cuánta se usa.<\/p>"}]},{"t":"Caza de último recurso","s":[{"t":"Ética y principios","h":"<h3>Ética y principios<\/h3>\n<ul>\n<li><strong>Solo especies exóticas o autorizadas<\/strong> (cap. 2) y solo lo que la comunidad va a comer.<\/li>\n<li><strong>Un tiro limpio:<\/strong> disparar solo cuando el animal está quieto, a una distancia que se domina, y en la zona del corazón y los pulmones (detrás de la paleta). Si el tiro no es seguro, no disparar.<\/li>\n<li><strong>Seguir a todo animal herido<\/strong> hasta encontrarlo. Dejar un animal herido es inaceptable.<\/li>\n<li><strong>Respetar las épocas de cría:<\/strong> no cazar hembras preñadas o con crías chicas, aunque sean especies invasoras, si se quiere que haya caza en el futuro.<\/li>\n<li><strong>Nada de venenos<\/strong> ni trampas que matan sin elegir (cebos tóxicos, cepos de dientes): matan perros, aves rapaces, zorros nativos y chicos curiosos.<\/li>\n<\/ul>"},{"t":"Especies de la zona","h":"<h3>Especies de la zona<\/h3>\n<table>\n<thead>\n<tr>\n<th>Especie<\/th>\n<th>Dónde<\/th>\n<th>Notas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Conejo silvestre europeo<\/strong><\/td>\n<td>Bardas y meseta, sobre todo hacia el sur y el oeste; en expansión<\/td>\n<td>Trampas de jaula, lazos y carabina .22. Faena, cocina y conservación <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"7\" data-s=\"0\"><em>Conejos<\/em>, cap. 8<\/a> a 11<\/td>\n<\/tr>\n<tr>\n<td><strong>Liebre europea<\/strong><\/td>\n<td>Campos abiertos, chacras<\/td>\n<td>Carabina .22 o escopeta. Igual que el conejo<\/td>\n<\/tr>\n<tr>\n<td><strong>Jabalí<\/strong><\/td>\n<td>Islas y costas del río, chacras abandonadas<\/td>\n<td>Peligroso: no acercarse a un jabalí herido. <strong>Triquinosis<\/strong> (abajo). Solo cazadores formados<\/td>\n<\/tr>\n<tr>\n<td><strong>Ciervo colorado<\/strong><\/td>\n<td>Zona cordillerana y precordillera<\/td>\n<td>Lejos del valle; caza mayor con rifle<\/td>\n<\/tr>\n<tr>\n<td><strong>Codorniz californiana<\/strong><\/td>\n<td>Matorrales y chacras<\/td>\n<td>Escopeta; caza menor<\/td>\n<\/tr>\n<tr>\n<td><strong>Palomas<\/strong><\/td>\n<td>Chacras y ciudades<\/td>\n<td>Plaga de granos; escopeta o aire comprimido<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Triquinosis: el jabalí y el cerdo [VITAL]","h":"<h3>Triquinosis: el jabalí y el cerdo <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>La carne de jabalí (y de cerdos criados sueltos) puede tener <strong>triquina<\/strong>, un parásito que causa una enfermedad grave y a veces mortal <span class=\"ref\">►<\/span> Manual médico T1 4.40.<\/p>\n<ul>\n<li>Mientras haya laboratorios o veterinarias: <strong>análisis de digestión artificial<\/strong> de una muestra del diafragma antes de comer.<\/li>\n<li>Sin análisis: <strong>cocinar toda la carne hasta que no quede nada rosado<\/strong>, en trozos chicos o bien hervida. Los chacinados, el ahumado, el salado y el secado <strong>no matan la triquina<\/strong> con seguridad: no hacer embutidos ni charqui de jabalí sin análisis.<\/li>\n<\/ul>"},{"t":"Faena de campo de un animal grande","h":"<h3>Faena de campo de un animal grande<\/h3>\n<ol>\n<li>Asegurarse de que está muerto: acercarse por detrás, tocar el ojo con un palo largo; si parpadea, no está muerto.<\/li>\n<li><strong>Desangrar<\/strong> cortando el cuello o el pecho, con la cabeza más baja que el cuerpo.<\/li>\n<li><strong>Eviscerar<\/strong> pronto (en menos de una hora): abrir la panza desde la pelvis al pecho sin perforar los intestinos, sacar las vísceras, separar hígado, corazón y riñones si están sanos (sin manchas, quistes ni abscesos).<\/li>\n<li><strong>Enfriar:<\/strong> abrir bien la cavidad, colgar a la sombra con aire; en verano, faenar al amanecer y llevar la carne a cocinar o conservar en el día.<\/li>\n<li><strong>Vísceras crudas, nunca a los perros:<\/strong> transmiten hidatidosis y otros parásitos <span class=\"ref\">►<\/span> Manual médico T1 4.37. Enterrarlas hondo o quemarlas.<\/li>\n<li><strong>Guantes:<\/strong> los animales silvestres pueden tener enfermedades que pasan a las personas. No tocar ni comer animales que se ven enfermos o que se encontraron muertos.<\/li>\n<\/ol>\n<p>Conservar la carne: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"9\" data-s=\"0\"><em>Conejos<\/em>, cap. 10<\/a> (charqui, envasado a presión) y <a class=\"x\" data-b=\"DES\" data-c=\"3\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 4<\/a> (ahumado y salado).<\/p>"}]},{"t":"Pesca de último recurso","s":[{"t":"Qué hay en los ríos de la zona","h":"<h3>Qué hay en los ríos de la zona<\/h3>\n<ul>\n<li><strong>Exóticas de valor deportivo:<\/strong> truchas (arco iris y marrón), salmones, carpa (invasora, muy abundante en el río Negro) y pejerrey bonaerense.<\/li>\n<li><strong>Nativas:<\/strong> perca (trucha criolla), pejerrey patagónico, bagres, róbalo (cerca de la desembocadura). Varias son de <strong>devolución obligatoria<\/strong> en el reglamento: en una crisis, respetarlo es lo que permite que sigan existiendo.<\/li>\n<li><strong>La carpa<\/strong> es la gran fuente de proteína del río Negro: abundante, fácil de pescar y una especie invasora. Es la primera opción en una pesca de subsistencia.<\/li>\n<\/ul>"},{"t":"Pescar con caña y línea","h":"<h3>Pescar con caña y línea<\/h3>\n<p><strong>Equipo para guardar:<\/strong> líneas de nailon (monofilamento) de 0,20 a 0,40 mm, anzuelos de varios tamaños (muchos: se pierden), plomadas, boyas, destorcedores, y una o dos cañas o un carrete de mano. Es barato y dura años.<\/p>\n<table>\n<thead>\n<tr>\n<th>Especie<\/th>\n<th>Dónde<\/th>\n<th>Carnada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Carpa<\/td>\n<td>Remansos, aguas quietas y turbias, desembocaduras de desagües, fondos de barro<\/td>\n<td>Maíz cocido, masa de harina con queso, papa hervida, pan, lombrices<\/td>\n<\/tr>\n<tr>\n<td>Perca<\/td>\n<td>Pozones con piedras y raíces, costas con corriente suave<\/td>\n<td>Lombrices, grillos, pescaditos, cucharitas<\/td>\n<\/tr>\n<tr>\n<td>Truchas<\/td>\n<td>Correderas y pozones de agua clara y fría<\/td>\n<td>Lombrices, insectos, cucharitas y moscas<\/td>\n<\/tr>\n<tr>\n<td>Pejerrey<\/td>\n<td>Remansos y lagunas, cerca de la superficie<\/td>\n<td>Lombriz chica, masa, trozos de pescado<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Consejos:<\/strong><\/p>\n<ul>\n<li>Las mejores horas son el amanecer y el atardecer.<\/li>\n<li>Después de una crecida, los peces se juntan en los remansos.<\/li>\n<li>Pescar desde la orilla segura, nunca solo en lugares con barranca o corriente fuerte (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"RIE\" data-c=\"3\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em>, cap. 4<\/a>).<\/li>\n<li>Las lombrices se crían en la lombricera (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 1<\/a>).<\/li>\n<\/ul>"},{"t":"Otros métodos de subsistencia","h":"<h3>Otros métodos de subsistencia<\/h3>\n<p>Los métodos siguientes están <strong>prohibidos en la pesca deportiva<\/strong> porque son muy eficaces y pueden vaciar un río. En un colapso, la comunidad decide si los usa, y en ese caso con límites estrictos: cuántos, cuándo, cuántos peces por semana.<\/p>\n<ul>\n<li><strong>Línea de fondo con varios anzuelos (espinel):<\/strong> una cuerda atada en la orilla, con anzuelos cada metro, que se deja de noche y se revisa a la mañana.<\/li>\n<li><strong>Nasa o trampa de pesca:<\/strong> un cono de malla o caña con una entrada en embudo; el pez entra y no encuentra la salida. Con cebo, en remansos. Permite <strong>soltar vivos<\/strong> a los chicos y a las especies nativas.<\/li>\n<li><strong>Red agallera o de arrastre:<\/strong> la más eficaz y la más destructiva. Si se usa, malla grande (para no sacar peces chicos) y en pocos lugares.<\/li>\n<\/ul>\n<p><strong>Nunca:<\/strong> venenos, cal, explosivos ni corriente eléctrica en el agua. Matan todo, contaminan el agua de los vecinos de abajo y son delitos.<\/p>"},{"t":"Del agua a la olla","h":"<h3>Del agua a la olla<\/h3>\n<ol>\n<li><strong>Matar enseguida<\/strong> con un golpe seco en la cabeza: el pescado que agoniza se ablanda y se pudre antes.<\/li>\n<li><strong>Desangrar<\/strong> cortando las agallas y lavar.<\/li>\n<li><strong>Eviscerar:<\/strong> abrir la panza desde el ano a la cabeza, sacar las vísceras y la línea de sangre del espinazo. Las vísceras, a la huerta (enterradas al pie de los frutales) o a las gallinas <strong>cocidas<\/strong>.<\/li>\n<li><strong>Escamar<\/strong> (carpa, perca) raspando de la cola a la cabeza; las truchas no hace falta.<\/li>\n<li><strong>Cocinar el mismo día<\/strong> o conservar. El pescado sin frío se pudre en horas en verano.<\/li>\n<\/ol>\n<p><strong>Parásitos:<\/strong> los peces de agua dulce de la Patagonia pueden tener parásitos que pasan a las personas, como la tenia del pescado. <strong>Siempre cocinar bien<\/strong> (la carne se separa en lajas y no queda translúcida); nada de pescado crudo ni marinado en limón sin congelar antes, y en un colapso no habrá freezer.<\/p>"},{"t":"Conservar pescado sin heladera","h":"<h3>Conservar pescado sin heladera<\/h3>\n<table>\n<thead>\n<tr>\n<th>Método<\/th>\n<th>Cómo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ahumado en caliente<\/strong><\/td>\n<td>Filetes salados 30 minutos en salmuera fuerte, oreados una hora, y ahumados sobre fuego bajo con humo de frutal hasta que estén firmes y cocidos (3 a 6 horas). Dura unos días al fresco <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"3\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 4<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Salado y secado<\/strong><\/td>\n<td>Filetes abiertos, cubiertos con sal gruesa en capas una semana, después secados al viento y al sol a la sombra durante 1 a 3 semanas hasta que estén duros (como el bacalao). Duran meses secos; se desalan en agua cambiada varias veces antes de cocinar<\/td>\n<\/tr>\n<tr>\n<td><strong>Escabeche<\/strong><\/td>\n<td>Pescado frito o hervido cubierto con vinagre, aceite, cebolla y especias. Una semana al fresco<\/td>\n<\/tr>\n<tr>\n<td><strong>Envasado a presión<\/strong><\/td>\n<td>Lo único seguro para frascos. Guía del USDA: <strong>solo frascos de medio litro<\/strong>, 100 minutos a la presión de la tabla <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"2\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 3<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La carpa tiene muchas espinas: cortada en tiras finas, frita o en escabeche, se ablandan; molida, da muy buenas albóndigas.<\/p>"}]},{"t":"Legítima defensa y seguridad de la comunidad","s":[{"t":"Lo primero es no llegar","h":"<h3>Lo primero es no llegar<\/h3>\n<p>La seguridad que más vidas salva es la que evita la violencia: no llamar la atención, estar organizados, vigilar, tener aliados y ceder los bienes antes que arriesgar la vida (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 6<\/a>). Un arma no reemplaza nada de eso, y mal usada multiplica el peligro.<\/p>\n<p><strong>Ante un robo:<\/strong> entregar lo que piden y dejar ir. Ningún objeto, comida o animal vale una vida.<\/p>"},{"t":"Qué dice la ley","h":"<h3>Qué dice la ley<\/h3>\n<p>El Código Penal (art. 34) reconoce la <strong>legítima defensa<\/strong> de la propia persona o de otras cuando se dan, al mismo tiempo:<\/p>\n<ol>\n<li>Una <strong>agresión ilegítima<\/strong>, actual o inminente (no una amenaza pasada ni una venganza).<\/li>\n<li>La <strong>necesidad racional del medio<\/strong> empleado para impedirla o repelerla (proporcionalidad: no se responde a un empujón con un disparo).<\/li>\n<li>La <strong>falta de provocación suficiente<\/strong> por parte de quien se defiende.<\/li>\n<\/ol>\n<p>Cada caso lo juzga un tribunal. Disparar a alguien que huye, a un ladrón que se lleva algo sin amenazar a nadie, o por miedo a algo que no se vio, no es legítima defensa.<\/p>"},{"t":"En la práctica","h":"<h3>En la práctica<\/h3>\n<ul>\n<li>La casa se defiende <strong>demorando y avisando<\/strong>, no saliendo a buscar el peligro: luces, perros, alarmas de latas, puertas y rejas firmes, habitación segura (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"4\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 5<\/a>) y una red de vecinos que acude (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 6<\/a>).<\/li>\n<li>La familia tiene un <strong>plan acordado<\/strong>: dónde se juntan los chicos, quién avisa, quién llama a los vecinos.<\/li>\n<li>Si hubo un hecho con heridos o muertos: primeros auxilios (<span class=\"ref\">►<\/span> Manual médico T1 3.7 y 3.26), dejar constancia escrita de lo que pasó con testigos, avisar a la autoridad que exista, y llevar el hecho a la asamblea.<\/li>\n<\/ul>"}]},{"t":"Armas en la comunidad","s":[{"t":"","h":"<p>Si la comunidad decide tener armas, conviene escribir estas normas y que todos las firmen:<\/p>\n<ol>\n<li><strong>Registro:<\/strong> qué armas hay, de quién, con qué papeles y en qué lugar se guardan. Toda arma de la comunidad está registrada a nombre de un legítimo usuario.<\/li>\n<li><strong>Armero comunitario:<\/strong> un armario o cuarto con llave para las armas de uso común (caza, control de plagas), con un responsable y un suplente que llevan un <strong>libro de entradas y salidas<\/strong>: quién la retira, para qué, cuándo la devuelve y cuánta munición usó.<\/li>\n<li><strong>Quién puede usarlas:<\/strong> solo adultos formados, que cumplan las cuatro reglas y hayan practicado con instructor. Nunca bajo efecto de alcohol.<\/li>\n<li><strong>Para qué:<\/strong> caza autorizada, control de jaurías y plagas, y defensa según el cap. 7. Nunca para amenazar, cobrar deudas ni resolver peleas.<\/li>\n<li><strong>Retiro preventivo:<\/strong> la asamblea puede retirar temporalmente las armas de una persona en crisis o con conductas violentas, y guardarlas en el armero.<\/li>\n<li><strong>Guardias:<\/strong> las guardias nocturnas de la comunidad (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 6<\/a>) se organizan para <strong>ver y avisar<\/strong>; si llevan armas, es una decisión explícita de la asamblea, con personas formadas y reglas escritas.<\/li>\n<li><strong>Revisión anual<\/strong> de las normas, del estado de las armas y de la munición.<\/li>\n<\/ol>"},{"t":"Datos de bolsillo","h":"<h3>Datos de bolsillo<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Las cuatro reglas<\/td>\n<td>Toda arma está cargada · nunca apuntar a lo que no se quiere destruir · dedo fuera del gatillo · conocer el blanco y lo que hay detrás<\/td>\n<\/tr>\n<tr>\n<td>Guardar<\/td>\n<td>Descargada, bajo llave, munición aparte y también bajo llave<\/td>\n<\/tr>\n<tr>\n<td>Regla para chicos<\/td>\n<td>No tocar · alejarse · avisar a un adulto<\/td>\n<\/tr>\n<tr>\n<td>Legítima defensa<\/td>\n<td>Agresión ilegítima + medio racional + sin provocación<\/td>\n<\/tr>\n<tr>\n<td>Jabalí<\/td>\n<td>Análisis de triquina o cocción completa; nada de embutidos sin análisis<\/td>\n<\/tr>\n<tr>\n<td>Vísceras crudas<\/td>\n<td>Nunca a los perros<\/td>\n<\/tr>\n<tr>\n<td>Pescado<\/td>\n<td>Siempre bien cocido; cocinar o conservar en el día<\/td>\n<\/tr>\n<tr>\n<td>Temporada de pesca patagónica<\/td>\n<td>1 de noviembre a 1 de mayo (con excepciones)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}]}]</script>
<script>
(function(){
"use strict";
const BOOKS = JSON.parse(document.getElementById("data").textContent);
const SLUG = {"GUÍA":"guia","MM T1":"mmt1","MM T2":"mmt2","NUT":"nut","GAL":"gal","CAB":"cab","PRO":"pro","DES":"des","CAS":"cas","COM":"com","CON":"con","RIE":"rie","ABE":"abe","ARM":"arm"};
const BY = {}; BOOKS.forEach(b => { BY[b.id] = b; BY[SLUG[b.id]] = b; });
const GROUPS = [
  ["Alimentación", ["NUT"]],
  ["Producir y criar", ["PRO","GAL","CAB","ABE","CON"]],
  ["Casa, despensa y comunidad", ["DES","CAS","COM"]],
  ["La zona y la seguridad", ["RIE","ARM"]],
  ["Para empezar", ["GUÍA"]]
];
const $ = s => document.querySelector(s);
const view = $("#view");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("manuales:"+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("manuales:"+k, JSON.stringify(v)); }catch(e){} }
};
let state = { v:"home" }, stack = [], lastQuery = "", highlight = "";

/* ---------- ajustes ---------- */
let fs = store.get("fs", 17);
function applyFs(){ document.documentElement.style.setProperty("--fs", fs+"px"); }
applyFs();
$("#fs-minus").onclick = () => { fs = Math.max(13, fs-1); applyFs(); store.set("fs", fs); };
$("#fs-plus").onclick = () => { fs = Math.min(26, fs+1); applyFs(); store.set("fs", fs); };
let theme = store.get("theme", null);
function applyTheme(){ if(theme) document.documentElement.setAttribute("data-theme", theme); }
applyTheme();
$("#theme").onclick = () => {
  const dark = theme ? theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = dark ? "light" : "dark"; document.documentElement.setAttribute("data-theme", theme); store.set("theme", theme);
};

/* ---------- navegación ---------- */
function go(s, push=true){
  if(push) stack.push(state);
  state = s; render();
}
$("#back").onclick = () => { if(stack.length){ state = stack.pop(); render(); } else go({v:"home"}, false); };
$("#home").onclick = () => go({v:"home"});
window.__back = () => { if(stack.length){ state = stack.pop(); render(); return true; } if(state.v!=="home"){ go({v:"home"}, false); return true; } return false; };
$("#go-search").onclick = () => go({v:"search", q:lastQuery});
$("#go-marks").onclick = () => go({v:"marks"});

function setHash(h){ try{ if(location.hash !== "#"+h) window.history.replaceState(null,"","#"+h); }catch(e){} }
function fromHash(){
  const h = (location.hash||"").slice(1);
  const m = h.match(/^([a-z0-9]+)(?:-(\d+))?(?:-(\d+))?$/);
  if(m && BY[m[1]]){ const b = BY[m[1]]; return m[2]!==undefined ? {v:"read", b:b.id, c:+m[2], s:+(m[3]||0)} : {v:"book", b:b.id}; }
  if(h==="buscar") return {v:"search", q:""};
  if(h==="marcadores") return {v:"marks"};
  return null;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function color(b){ return b.color; }

/* ---------- vistas ---------- */
function render(){
  $("#fab").hidden = state.v !== "read";
  if(state.v==="home") renderHome();
  else if(state.v==="book") renderBook();
  else if(state.v==="read") renderRead();
  else if(state.v==="search") renderSearch();
  else if(state.v==="marks") renderMarks();
  if(state.v!=="read") window.scrollTo(0,0);
}

function bookCard(b){
  return `<button class="book" data-book="${esc(b.id)}"><span class="spine" style="background:${b.color}"></span><span class="bt"><b>${esc(b.title)}</b><span>${esc(b.sub)}</span></span></button>`;
}
function renderHome(){
  setHash("inicio");
  const last = store.get("last", null);
  let h = `<div class="row" style="margin-top:0">
    <button class="chipbtn" id="h-idx">Índice de temas: ¿qué libro abro?</button>
    <button class="chipbtn" id="h-search">Buscar en todos los libros</button>
    ${last && BY[last.b] ? `<button class="chipbtn" id="h-last">Seguir leyendo: ${esc(BY[last.b].title)}</button>` : ""}
  </div>`;
  GROUPS.forEach(([g, ids]) => {
    h += `<h2 class="sec">${esc(g)}</h2><div class="grid">${ids.filter(i=>BY[i]).map(i=>bookCard(BY[i])).join("")}</div>`;
  });
  h += `<p class="note" style="margin-top:28px">Todo funciona sin internet. El Manual médico no está incluido porque tiene su propia app: las remisiones «► Manual médico» indican el tomo y la entrada para buscarla ahí. Nutrición, Gallinas y Cabras están como texto para buscar y leer; los dibujos y la diagramación exacta solo están en los PDF originales.</p>`;
  view.innerHTML = h;
  $("#h-idx").onclick = () => go({v:"read", b:"GUÍA", c:1, s:0});
  $("#h-search").onclick = () => go({v:"search", q:""});
  if($("#h-last")) $("#h-last").onclick = () => go({v:"read", b:last.b, c:last.c, s:last.s});
  view.querySelectorAll(".book").forEach(el => el.onclick = () => go({v:"book", b:el.dataset.book}));
}

function renderBook(){
  const b = BY[state.b]; setHash(SLUG[b.id]);
  let h = `<div class="head" style="--bc:${b.color}"><div class="k">${esc(b.id==="GUÍA"?"Guía":b.id)}</div><h2>${esc(b.title)}</h2><div class="note">${esc(b.sub)}</div></div>`;
  if(state.sos){
    h += `<div class="row"><button class="sos" id="sos1"><span>Hoja de emergencias del principio del tomo</span></button></div>`;
  }
  h += `<div class="toc">`;
  b.c.forEach((c, ci) => {
    const open = state.sos && c.t.startsWith("Bloque 3");
    const num = b.kind==="md" ? (b.id==="GUÍA" ? "" : (ci+1)) : (ci===0 ? "" : "");
    h += `<details ${open?"open":""}><summary><span class="n">${num}</span><span>${esc(c.t)}</span></summary>`;
    if(b.kind==="md") h += `<button class="chipbtn open-ch" data-c="${ci}" data-s="0">Leer el capítulo completo</button>`;
    h += `<ul>${c.s.map((s, si) => s.t ? `<li><button data-c="${ci}" data-s="${si}">${esc(s.t)}</button></li>` : "").join("")}</ul></details>`;
  });
  h += `</div>`;
  view.innerHTML = h;
  if($("#sos1")) $("#sos1").onclick = () => go({v:"read", b:b.id, c:0, s:0});
  view.querySelectorAll("[data-c]").forEach(el => el.onclick = () => go({v:"read", b:b.id, c:+el.dataset.c, s:+el.dataset.s}));
}

function wrapTables(html){ return html.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, "</table></div>"); }

function markTerms(root, terms){
  if(!terms.length) return null;
  const rx = new RegExp(terms.map(t => t.split("").map(ch => (FOLD[ch] ? "["+FOLD[ch]+"]" : ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))).join("")).join("|"), "gi");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n; while((n = walker.nextNode())) nodes.push(n);
  let first = null;
  nodes.forEach(node => {
    const t = node.nodeValue; rx.lastIndex = 0;
    if(!rx.test(t)) return; rx.lastIndex = 0;
    const frag = document.createDocumentFragment(); let i = 0, m;
    while((m = rx.exec(t))){ frag.appendChild(document.createTextNode(t.slice(i, m.index))); const mk = document.createElement("mark"); mk.textContent = m[0]; frag.appendChild(mk); if(!first) first = mk; i = m.index + m[0].length; if(m[0].length===0) rx.lastIndex++; }
    frag.appendChild(document.createTextNode(t.slice(i))); node.parentNode.replaceChild(frag, node);
  });
  return first;
}
const FOLD = {a:"aáà",e:"eéè",i:"iíì",o:"oóò",u:"uúüù",n:"nñ"};

function renderRead(){
  const b = BY[state.b]; const ci = Math.min(state.c, b.c.length-1); const c = b.c[ci];
  const si = Math.min(state.s||0, c.s.length-1);
  setHash(SLUG[b.id]+"-"+ci+"-"+si);
  store.set("last", {b:b.id, c:ci, s:si});
  const whole = b.kind==="md";
  let body;
  if(whole){
    body = c.s.map((s, i) => `<section id="s${i}">${s.h}</section>`).join("");
  } else {
    const s = c.s[si];
    body = `<h3 id="s${si}">${esc(s.t)}</h3>` + s.h;
  }
  const label = b.kind==="md" ? (b.id==="GUÍA" ? "" : "Capítulo "+(ci+1)) : "";
  let h = `<div class="crumb"><button id="cr-book">${esc(b.title)}</button>${label?`<span>· ${label}</span>`:""}</div>
  <article style="--bc:${b.color}"><h2>${esc(c.t)}</h2>${wrapTables(body)}</article>`;
  // anterior / siguiente
  const prev = step(b, ci, si, -1), next = step(b, ci, si, +1);
  h += `<div class="pager">${prev?`<button id="pv">← Anterior<b>${esc(prev.t)}</b></button>`:"<span></span>"}${next?`<button class="nx" id="nx">Siguiente →<b>${esc(next.t)}</b></button>`:"<span></span>"}</div>`;
  view.innerHTML = h;
  $("#cr-book").onclick = () => go({v:"book", b:b.id});
  if(prev) $("#pv").onclick = () => go({v:"read", b:b.id, c:prev.c, s:prev.s});
  if(next) $("#nx").onclick = () => go({v:"read", b:b.id, c:next.c, s:next.s});
  view.querySelectorAll("a.x").forEach(a => a.onclick = e => { e.preventDefault(); go({v:"read", b:a.dataset.b, c:+a.dataset.c, s:+a.dataset.s}); });
  updateStar();
  let target = null;
  if(highlight){ target = markTerms(view.querySelector("article"), highlight.split(" ").filter(Boolean)); highlight = ""; }
  if(target){ target.scrollIntoView({block:"center"}); }
  else if(whole && si>0){ const el = document.getElementById("s"+si); if(el) el.scrollIntoView({block:"start"}); else window.scrollTo(0,0); }
  else window.scrollTo(0,0);
}
function step(b, ci, si, d){
  if(b.kind==="md"){
    const n = ci + d; if(n<0 || n>=b.c.length) return null;
    return {c:n, s:0, t:b.c[n].t};
  }
  let c = ci, s = si + d;
  if(s < 0){ c--; if(c<0) return null; s = b.c[c].s.length-1; }
  if(s >= b.c[c].s.length){ c++; if(c>=b.c.length) return null; s = 0; }
  return {c, s, t:b.c[c].s[s].t || b.c[c].t};
}

/* ---------- marcadores ---------- */
function curKey(){ return state.b+"|"+state.c+"|"+(BY[state.b].kind==="md"?0:state.s); }
function marks(){ return store.get("marks", []); }
function updateStar(){ const on = marks().some(m => m.k===curKey()); $("#star").textContent = on ? "★ Marcado" : "☆ Marcar"; $("#star").classList.toggle("on", on); }
$("#star").onclick = () => {
  const b = BY[state.b]; const k = curKey(); let ms = marks();
  if(ms.some(m => m.k===k)) ms = ms.filter(m => m.k!==k);
  else { const c = b.c[state.c]; const s = b.kind==="md" ? null : c.s[state.s]; ms.unshift({k, b:b.id, c:state.c, s:b.kind==="md"?0:state.s, t:(s&&s.t)||c.t}); }
  store.set("marks", ms); updateStar();
};
function renderMarks(){
  setHash("marcadores");
  const ms = marks();
  let h = `<div class="head"><div class="k">Guardados</div><h2>Marcadores</h2></div>`;
  if(!ms.length) h += `<p class="note">Todavía no hay marcadores. Mientras leés, tocá «☆ Marcar» abajo a la derecha para guardar una página. Se guardan solo en este dispositivo.</p>`;
  h += ms.map((m, i) => { const b = BY[m.b]; return b ? `<div class="mk"><button class="res" style="--bc:${b.color}" data-i="${i}"><span class="w">${esc(b.title)}</span><b>${esc(m.t)}</b></button><button class="del" data-d="${i}" aria-label="Borrar marcador">✕</button></div>` : ""; }).join("<div style='height:8px'></div>");
  view.innerHTML = h;
  view.querySelectorAll("[data-i]").forEach(el => el.onclick = () => { const m = ms[+el.dataset.i]; go({v:"read", b:m.b, c:m.c, s:m.s}); });
  view.querySelectorAll("[data-d]").forEach(el => el.onclick = () => { ms.splice(+el.dataset.d, 1); store.set("marks", ms); renderMarks(); });
}

/* ---------- búsqueda ---------- */
let INDEX = null;
function fold(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function strip(h){ const d = document.createElement("div"); d.innerHTML = h; return (d.textContent || "").replace(/\s+/g, " "); }
function buildIndex(){
  INDEX = [];
  BOOKS.forEach(b => b.c.forEach((c, ci) => c.s.forEach((s, si) => {
    const text = strip(s.h); INDEX.push({b:b.id, c:ci, s:si, t:s.t || c.t, ct:c.t, text, f:fold(text), ft:fold((s.t||"")+" "+c.t)});
  })));
}
function search(q){
  if(!INDEX) buildIndex();
  const terms = fold(q).split(/\s+/).filter(t => t.length>1);
  if(!terms.length) return [];
  const out = [];
  for(const e of INDEX){
    let score = 0, ok = true, pos = -1;
    for(const t of terms){
      const i = e.f.indexOf(t); const it = e.ft.indexOf(t);
      if(i<0 && it<0){ ok = false; break; }
      if(it>=0) score += 10;
      if(i>=0){ score += 1 + Math.min(5, e.f.split(t).length-1); if(pos<0) pos = i; }
    }
    if(ok) out.push({e, score, pos});
  }
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, 120).map(r => ({...r, terms}));
}
function snippet(r){
  const t = r.e.text, p = Math.max(0, r.pos - 70);
  let s = (p>0?"…":"") + t.slice(p, p + 220) + (p+220<t.length?"…":"");
  s = esc(s);
  r.terms.forEach(term => {
    const rx = new RegExp(term.split("").map(ch => (FOLD[ch] ? "["+FOLD[ch]+"]" : ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))).join(""), "gi");
    s = s.replace(rx, m => "<mark>"+m+"</mark>");
  });
  return s;
}
function renderSearch(){
  setHash("buscar");
  view.innerHTML = `<div class="head"><div class="k">Todos los libros</div><h2>Buscar</h2></div>
  <form class="sbox" id="sf"><label for="q" class="note" style="position:absolute;left:-9999px">Qué buscar</label><input id="q" type="search" autocomplete="off" placeholder="Ej.: lavandina agua, varroa, quemadura" value="${esc(state.q||"")}"><button class="ib" type="submit">Buscar</button></form>
  <div id="rs"></div>`;
  const q = $("#q"); const rs = $("#rs");
  const run = () => {
    const val = q.value.trim(); lastQuery = val; state.q = val;
    if(val.length < 2){ rs.innerHTML = `<p class="note">Escribí una o más palabras. Busca en los 12 libros a la vez, sin importar tildes. Ejemplos: <em>gotas lavandina</em>, <em>quemadura</em>, <em>caldo bordelés</em>, <em>represa</em>.</p>`; return; }
    const res = search(val);
    if(!res.length){ rs.innerHTML = `<p class="note">No encontré «${esc(val)}». Probá con menos palabras o con otra forma de decirlo (por ejemplo, «diarrea» en lugar de «descompostura»).</p>`; return; }
    rs.innerHTML = `<p class="note">${res.length===120?"Más de 120":res.length} resultados</p>` + res.map((r, i) => { const b = BY[r.e.b]; return `<button class="res" style="--bc:${b.color}" data-i="${i}"><span class="w">${esc(b.title)} · ${esc(r.e.ct)}</span><b>${esc(r.e.t)}</b><span class="sn">${snippet(r)}</span></button>`; }).join("");
    rs.querySelectorAll(".res").forEach(el => el.onclick = () => { const r = res[+el.dataset.i]; highlight = r.terms.join(" "); go({v:"read", b:r.e.b, c:r.e.c, s:r.e.s}); });
  };
  let tm; q.oninput = () => { clearTimeout(tm); tm = setTimeout(run, 250); };
  $("#sf").onsubmit = e => { e.preventDefault(); run(); };
  run(); setTimeout(() => q.focus(), 50);
}

window.addEventListener("hashchange", () => { const s = fromHash(); if(s) go(s); });
const start = fromHash(); state = start || {v:"home"}; render();
})();
</script>
</body>
</html>
