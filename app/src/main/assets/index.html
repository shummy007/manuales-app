 la huerta [VITAL] (41)","h":"<h3>Planificar la huerta <span class=\"b vital\">VITAL<\/span> (41)<\/h3>\n<ol>\n<li><strong>Lugar:<\/strong> al menos 6 horas de sol, cerca del agua, protegido del viento (en Patagonia, detrás de una cortina de álamos o de un cerco de cañas).<\/li>\n<li><strong>Canteros:<\/strong> de 1,20 m de ancho (se alcanza el centro desde los dos lados sin pisar) y del largo que se quiera, con pasillos de 40 cm.<\/li>\n<li><strong>Cuatro grupos para rotar<\/strong> (49): dividir la huerta en cuatro sectores y cada año pasar cada grupo al sector siguiente.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Grupo<\/th>\n<th>Ejemplos<\/th>\n<th>Qué le hace al suelo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hojas<\/td>\n<td>Lechuga, acelga, espinaca, repollo, brócoli<\/td>\n<td>Consume mucho nitrógeno<\/td>\n<\/tr>\n<tr>\n<td>Frutos<\/td>\n<td>Tomate, pimiento, berenjena, zapallo, maíz<\/td>\n<td>Consume mucho<\/td>\n<\/tr>\n<tr>\n<td>Raíces y bulbos<\/td>\n<td>Zanahoria, remolacha, cebolla, ajo, papa<\/td>\n<td>Consume poco<\/td>\n<\/tr>\n<tr>\n<td>Legumbres<\/td>\n<td>Poroto, arveja, haba, lenteja<\/td>\n<td>Devuelve nitrógeno al suelo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"4\">\n<li><strong>Asociaciones útiles (48):<\/strong> maíz + poroto + zapallo (el maíz sostiene al poroto, el poroto abona, el zapallo tapa el suelo). Tomate + albahaca. Zanahoria + cebolla (se espantan plagas mutuamente). Caléndula y copete en los bordes atraen insectos útiles.<\/li>\n<li><strong>Siembra escalonada:<\/strong> sembrar lechuga, rúculas o rabanitos de a poco cada 15 días, no todo junto.<\/li>\n<\/ol>"},{"t":"Suelo y canteros elevados [VITAL] (47)","h":"<h3>Suelo y canteros elevados <span class=\"b vital\">VITAL<\/span> (47)<\/h3>\n<p><strong>Doble cavado:<\/strong> sacar 30 cm de tierra, aflojar con la horquilla otros 30 cm abajo sin dar vuelta, y volver a poner la tierra de arriba mezclada con compost. Se hace una sola vez; después no se pisa el cantero.<\/p>\n<p><strong>Cantero elevado:<\/strong> marco de tablas, ladrillos o troncos de 30 a 40 cm de alto, relleno en capas: ramas abajo, después pasto y hojas, después compost y tierra. Sirve en suelos pobres, salitrosos o anegadizos.<\/p>\n<p><strong>Abono verde:<\/strong> sembrar vicia, avena o centeno en el sector que descansa en invierno, y en primavera cortarlo e incorporarlo.<\/p>"},{"t":"Suelo salitroso [AÑOS]","h":"<h3>Suelo salitroso <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Muy común en los valles regados con napa alta, como el Alto Valle.<\/p>\n<p><strong>Cómo se reconoce:<\/strong> costras blancas en la superficie al secarse, manchas donde nada crece, plantas con los bordes de las hojas quemados aunque tengan agua, y charcos que tardan días en secarse.<\/p>\n<p><strong>Qué hacer<\/strong><\/p>\n<ol>\n<li><strong>Drenar:<\/strong> sin drenaje, la sal vuelve a subir. Zanjas de 60 cm a 1 metro alrededor del sector, que lleven el agua hacia un lugar más bajo.<\/li>\n<li><strong>Lavar la sal:<\/strong> con drenaje, uno o dos riegos muy abundantes antes de sembrar arrastran la sal hacia abajo. Regar poco y seguido, en cambio, la deja arriba.<\/li>\n<li><strong>Cubrir siempre el suelo:<\/strong> acolchado de paja u hojas y mucha materia orgánica (compost, estiércol curado). Menos evaporación es menos sal que sube.<\/li>\n<li><strong>Yeso agrícola<\/strong> si el suelo, además, se pone duro como ladrillo y el agua no entra (suelo sódico): medio a un kilo por metro cuadrado, incorporado, y después un riego abundante.<\/li>\n<li><strong>Cultivos que aguantan:<\/strong> remolacha, acelga, espárrago, cebada, centeno, alfalfa ya establecida, zapallo. <strong>Sufren:<\/strong> poroto, haba, frutilla, zanahoria, cebolla, lechuga.<\/li>\n<li><strong>Sembrar al costado del surco,<\/strong> no en la cresta: al regar por surco, la sal se junta en la parte más alta del lomo.<\/li>\n<li>Mientras tanto, cultivar en <strong>canteros elevados<\/strong> rellenos con tierra y compost de otro lugar.<\/li>\n<\/ol>"},{"t":"Compost [VITAL] (42)","h":"<h3>Compost <span class=\"b vital\">VITAL<\/span> (42)<\/h3>\n<p><strong>Ingredientes<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Verdes (húmedos)<\/th>\n<th>Marrones (secos)<\/th>\n<th>Nunca<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Restos de verdura y fruta, yerba, cáscaras de huevo, pasto fresco, estiércol de gallina y cabra<\/td>\n<td>Hojas secas, paja, aserrín, cartón, ramitas picadas<\/td>\n<td>Heces humanas o de perros y gatos, plantas enfermas, aceite<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pasos<\/strong><\/p>\n<ol>\n<li>Elegir un lugar con sombra, sobre tierra (no sobre cemento).<\/li>\n<li>Hacer capas: 1 parte de verdes, 2 de marrones, en volumen. Una palada de tierra cada tanto.<\/li>\n<li>Humedad de esponja escurrida: si al apretar un puñado gotea, agregar marrones; si se desarma seco, regar.<\/li>\n<li>Dar vuelta la pila cada 2 o 3 semanas.<\/li>\n<li>Está listo en 3 a 6 meses, cuando huele a tierra de monte y no se reconocen los restos.<\/li>\n<\/ol>\n<p><strong>Olor a podrido<\/strong> = demasiado verde o mojado: agregar marrones y dar vuelta. <strong>No se calienta<\/strong> = muy seco o muy chico: la pila tiene que tener al menos 1 m³.<\/p>"},{"t":"Lombricompuesto [AÑOS] (43)","h":"<h3>Lombricompuesto <span class=\"b anos\">AÑOS<\/span> (43)<\/h3>\n<p>Con lombriz roja californiana (se consigue en viveros y entre huerteros). Un cajón de madera o un tacho con agujeros abajo, con 10 cm de compost o estiércol viejo de base, las lombrices encima y restos de cocina picados. Taparlo con cartón mojado. A la sombra en verano, protegido de la helada en invierno. Las lombrices se reproducen rápido y sirven también como alimento para las gallinas (habilidad 75).<\/p>"},{"t":"Germinar y almacigar [VITAL] (45, 46)","h":"<h3>Germinar y almacigar <span class=\"b vital\">VITAL<\/span> (45, 46)<\/h3>\n<p>Tomate, pimiento, berenjena, cebolla, repollo, lechuga y brócoli se siembran primero en almaciguera; zanahoria, rabanito, remolacha, arveja, poroto, maíz y zapallo van directo a la tierra.<\/p>\n<ol>\n<li>Bandejas, cajones o envases de yogur con agujeros abajo.<\/li>\n<li>Sustrato: 1 parte de compost tamizado, 1 de tierra, 1 de arena.<\/li>\n<li>Sembrar a una profundidad de 2 o 3 veces el tamaño de la semilla.<\/li>\n<li>Regar con regadera fina o rociador; nunca dejar secar.<\/li>\n<li>En invierno, dentro de casa junto a una ventana al norte, o en un invernadero.<\/li>\n<li><strong>Rustificar:<\/strong> una semana antes de trasplantar, sacar los plantines afuera unas horas por día.<\/li>\n<li>Trasplantar con 4 a 6 hojas, en día nublado o al atardecer, y regar enseguida.<\/li>\n<\/ol>"},{"t":"Riego que ahorra agua [VITAL] (50, 51)","h":"<h3>Riego que ahorra agua <span class=\"b vital\">VITAL<\/span> (50, 51)<\/h3>\n<ul>\n<li><strong>Ollas de barro (riego por olla):<\/strong> una maceta de barro sin esmaltar, con el agujero tapado, enterrada hasta el cuello entre las plantas y llena de agua. Riega por las paredes, sin pérdida.<\/li>\n<li><strong>Botellas:<\/strong> una botella con agujeros finos en la tapa, enterrada boca abajo junto a cada planta grande.<\/li>\n<li><strong>Goteo casero:<\/strong> una manguera con agujeros de alfiler cada 30 cm, conectada a un tambor elevado 1 m.<\/li>\n<li><strong>Acolchado (51):<\/strong> cubrir el suelo con 5 a 10 cm de paja, pasto seco u hojas. Reduce el riego a la mitad, evita malezas y protege del sol y la helada.<\/li>\n<li>Regar temprano a la mañana o al atardecer, al pie de la planta, nunca sobre las hojas a pleno sol.<\/li>\n<\/ul>"},{"t":"Invernadero simple [AÑOS] (52)","h":"<h3>Invernadero simple <span class=\"b anos\">AÑOS<\/span> (52)<\/h3>\n<p>Estructura de cañas, varillas o madera en forma de túnel, cubierta con nylon de 150 a 200 micrones con tratamiento UV. Orientado de este a oeste. Puertas en los dos extremos para ventilar los días de sol: dentro se puede pasar de 40 °C y quemar los plantines. Permite adelantar los almacigos de verano dos meses y tener verdura de hoja en invierno.<\/p>"},{"t":"Plagas sin venenos [VITAL] (53)","h":"<h3>Plagas sin venenos <span class=\"b vital\">VITAL<\/span> (53)<\/h3>\n<p><strong>Prevención primero:<\/strong> suelo vivo, rotación, asociaciones, y recorrer la huerta todos los días mirando el revés de las hojas.<\/p>\n<table>\n<thead>\n<tr>\n<th>Problema<\/th>\n<th>Remedio casero<\/th>\n<th>Dosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pulgones, mosca blanca<\/td>\n<td>Agua con jabón blanco (no detergente)<\/td>\n<td>10 g de jabón rallado por litro, rociar al atardecer<\/td>\n<\/tr>\n<tr>\n<td>Insectos en general<\/td>\n<td>Purín de ortiga<\/td>\n<td>1 kg de ortiga picada en 10 l de agua, fermentar 7 a 14 días revolviendo, colar, diluir 1 en 10<\/td>\n<\/tr>\n<tr>\n<td>Hongos, insectos<\/td>\n<td>Macerado de ajo<\/td>\n<td>100 g de ajo machacado en 1 l de agua 24 h, colar, diluir 1 en 10<\/td>\n<\/tr>\n<tr>\n<td>Hongos (oídio)<\/td>\n<td>Leche<\/td>\n<td>1 parte de leche en 9 de agua, rociar con sol<\/td>\n<\/tr>\n<tr>\n<td>Caracoles y babosas<\/td>\n<td>Trampas con levadura y azúcar en agua, tejas boca abajo donde se juntan de día, barreras de ceniza o cáscara de huevo molida<\/td>\n<td>Juntarlos a mano al amanecer<\/td>\n<\/tr>\n<tr>\n<td>Hormigas cortadoras<\/td>\n<td>Ubicar el hormiguero, cavarlo y echar agua hirviendo; barreras de ceniza o cal alrededor de los canteros; plantas trampa<\/td>\n<td>Constancia: es la plaga más dañina de muchas zonas<\/td>\n<\/tr>\n<tr>\n<td>Pájaros<\/td>\n<td>Redes, cintas brillantes, espantapájaros que se cambien de lugar<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los preparados se prueban primero en una planta: si a los dos días no hay hojas quemadas, se aplican al resto.<\/p>\n<p><span class=\"ref\">►<\/span> <strong>Todo sobre plagas y enfermedades, con tabla de síntomas, recetas, control biológico y calendario: cap. 9.<\/strong><\/p>"},{"t":"Plagas de los repollos y las coles","h":"<h3>Plagas de los repollos y las coles<\/h3>\n<p>Repollo, brócoli, coliflor, kale y repollito de Bruselas tienen sus propias plagas.<\/p>\n<ul>\n<li><strong>Mariposa blanca de la col:<\/strong> pone grupos de huevos amarillos en el revés de las hojas; las orugas verdes comen las hojas hasta dejar solo las nervaduras. <strong>Qué hacer:<\/strong> revisar el revés de las hojas dos veces por semana y aplastar los huevos; juntar las orugas a mano y darlas a las gallinas; cubrir el cantero con tela tul, voile o malla antiinsectos sobre arcos de alambre desde el trasplante.<\/li>\n<li><strong>Polilla de las coles:<\/strong> orugas chicas, verdes claras, que se retuercen al tocarlas y hacen ventanitas en las hojas. Mismo manejo.<\/li>\n<li><strong>Pulgón ceroso:<\/strong> colonias grises como ceniza en el corazón de la planta. Agua con jabón (<span class=\"ref\">►<\/span> tabla de arriba), sacar las hojas más afectadas.<\/li>\n<li><strong>Bacillus thuringiensis (Bt):<\/strong> un insecticida biológico de venta en agronomías que solo afecta a las orugas. Es inofensivo para personas y animales y se guarda bien: conviene tener un frasco.<\/li>\n<li><strong>Asociar<\/strong> con tomate, apio, eneldo, cebolla o caléndula alrededor, que confunden a la mariposa.<\/li>\n<\/ul>"},{"t":"Proteger de las heladas [VITAL] (60)","h":"<h3>Proteger de las heladas <span class=\"b vital\">VITAL<\/span> (60)<\/h3>\n<ul>\n<li><strong>Calendario:<\/strong> no trasplantar tomate, pimiento, zapallo ni maíz hasta que pase la fecha de última helada de la zona.<\/li>\n<li><strong>La noche anterior a una helada:<\/strong> cielo despejado, sin viento, frío al atardecer. Regar bien la tierra (la tierra húmeda guarda más calor), y tapar las plantas con tela antihelada, frazadas viejas, cajones o botellas cortadas. Destapar a la mañana.<\/li>\n<li><strong>Botellas con agua<\/strong> alrededor de cada planta acumulan calor del día.<\/li>\n<li>Si una planta amanece helada, regarla con agua fría antes de que le dé el sol: a veces la salva.<\/li>\n<\/ul>"},{"t":"Otros cultivos [MEJORA] (57, 58, 59)","h":"<h3>Otros cultivos <span class=\"b mejora\">MEJORA<\/span> (57, 58, 59)<\/h3>\n<ul>\n<li><strong>Papas en bolsas o torres (57):<\/strong> una bolsa de arpillera o un aro de malla con 20 cm de tierra y compost, 3 o 4 papas de semilla. A medida que crecen los tallos, se agrega tierra hasta llenar. Cosecha cuando la planta se seca.<\/li>\n<li><strong>Hongos gírgola (58):<\/strong> paja de trigo picada, pasteurizada en agua a 70 °C durante una hora, escurrida, mezclada con semilla de gírgola en bolsas con agujeros, en un lugar oscuro y húmedo. Fructifica en 4 a 6 semanas. La semilla (micélio) se compra a productores; después se puede reproducir.<\/li>\n<li><strong>Huerta en macetas (59):<\/strong> lechuga, acelga, rúcula, rabanito, tomate cherry, aromáticas. Macetas de al menos 20 litros para tomate.<\/li>\n<\/ul>"},{"t":"Estación fría y estación cálida","h":"<h3>Estación fría y estación cálida<\/h3>\n<table>\n<thead>\n<tr>\n<th>Cultivos de estación fría: toleran helada<\/th>\n<th>Cultivos de estación cálida: mueren con helada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ajo, cebolla, habas, arvejas, lechuga, acelga, espinaca, zanahoria, remolacha, repollo, brócoli, coliflor, rabanito, puerro<\/td>\n<td>Tomate, pimiento, berenjena, zapallo, zapallito, pepino, maíz, poroto, melón, sandía, girasol, albahaca<\/td>\n<\/tr>\n<tr>\n<td>Se siembran a fin de verano y otoño, o a fin de invierno<\/td>\n<td>Almacigar con protección 6 a 8 semanas antes de la última helada; trasplantar o sembrar después<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Fechas aproximadas de heladas por región<\/strong> (varían mucho con la altura y el año; confirmar con el INTA o los productores de la zona):<\/p>\n<table>\n<thead>\n<tr>\n<th>Región<\/th>\n<th>Primera helada<\/th>\n<th>Última helada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NEA (Misiones, Corrientes, Chaco, Formosa)<\/td>\n<td>Rara; heladas suaves en julio<\/td>\n<td>Agosto<\/td>\n<\/tr>\n<tr>\n<td>NOA (valles de Tucumán, Salta, Jujuy)<\/td>\n<td>Mayo<\/td>\n<td>Septiembre<\/td>\n<\/tr>\n<tr>\n<td>Pampeana (Buenos Aires, Santa Fe, Córdoba, La Pampa)<\/td>\n<td>Abril a mayo<\/td>\n<td>Septiembre a octubre<\/td>\n<\/tr>\n<tr>\n<td>Cuyo (Mendoza, San Juan, San Luis)<\/td>\n<td>Abril a mayo<\/td>\n<td>Septiembre a octubre<\/td>\n<\/tr>\n<tr>\n<td>Patagonia Norte (Alto Valle, Valle Medio, Neuquén)<\/td>\n<td>Abril<\/td>\n<td>Octubre, con heladas tardías hasta noviembre<\/td>\n<\/tr>\n<tr>\n<td>Patagonia Sur y cordillera<\/td>\n<td>Marzo<\/td>\n<td>Noviembre a diciembre<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>El INTA EEA Valle Inferior publica un calendario de siembra otoño-invierno y primavera-verano para Río Negro; las agencias del INTA de cada zona tienen el suyo.<\/p>\n<p>Calendario detallado mes a mes <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"2\" data-s=\"0\">cap. 3<\/a>. Semillas <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"3\" data-s=\"0\">cap. 4<\/a>. Frutales <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"5\" data-s=\"0\">cap. 6<\/a>.<\/p>"}]},{"t":"Fichas de cultivo","s":[{"t":"","h":"<p>Esta tabla resume cómo sembrar y cuánto rinde cada cultivo de la huerta familiar y del campo. Las cifras son valores de referencia para huerta manual con buen compost; el primer año suele rendir menos. Las fechas exactas dependen de la zona: ver <em>Calendario mes a mes<\/em> en el capítulo siguiente.<\/p>"},{"t":"Cómo leer las fichas","h":"<h3>Cómo leer las fichas<\/h3>\n<ul>\n<li><strong>Estación:<\/strong> <em>fría<\/em> = tolera helada, se siembra a fin de verano, otoño o fin de invierno; <em>cálida<\/em> = muere con helada, se siembra después de la última helada.<\/li>\n<li><strong>Siembra:<\/strong> <em>directa<\/em> = la semilla va al lugar definitivo; <em>almácigo<\/em> = se siembra en bandeja y se trasplanta.<\/li>\n<li><strong>Distancia:<\/strong> entre plantas × entre surcos, en centímetros.<\/li>\n<li><strong>Días a cosecha:<\/strong> desde la siembra (en los de almácigo, desde la siembra del almácigo).<\/li>\n<li><strong>Rinde:<\/strong> kilos por metro cuadrado de cantero, aproximado.<\/li>\n<\/ul>"},{"t":"Hortalizas de hoja y de flor","h":"<h3>Hortalizas de hoja y de flor<\/h3>\n<table>\n<thead>\n<tr>\n<th>Cultivo<\/th>\n<th>Estación<\/th>\n<th>Siembra<\/th>\n<th>Distancia (cm)<\/th>\n<th>Profundidad<\/th>\n<th>Días a cosecha<\/th>\n<th>Rinde (kg/m²)<\/th>\n<th>Semilla propia<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Acelga<\/td>\n<td>Fría y templada, casi todo el año<\/td>\n<td>Directa o almácigo<\/td>\n<td>30 × 40<\/td>\n<td>2 cm<\/td>\n<td>60 (cortes de hojas por meses)<\/td>\n<td>3 a 4<\/td>\n<td>Florece el 2.º año<\/td>\n<\/tr>\n<tr>\n<td>Lechuga<\/td>\n<td>Todo el año, escalonada cada 15 días<\/td>\n<td>Almácigo o directa<\/td>\n<td>25 × 30<\/td>\n<td>0,5 cm<\/td>\n<td>50 a 70<\/td>\n<td>2<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Espinaca<\/td>\n<td>Fría<\/td>\n<td>Directa<\/td>\n<td>10 × 25<\/td>\n<td>2 cm<\/td>\n<td>45 a 60<\/td>\n<td>1 a 1,5<\/td>\n<td>Plantas macho y hembra: dejar varias<\/td>\n<\/tr>\n<tr>\n<td>Repollo<\/td>\n<td>Fría<\/td>\n<td>Almácigo<\/td>\n<td>50 × 60<\/td>\n<td>1 cm<\/td>\n<td>100 a 150<\/td>\n<td>3 a 4<\/td>\n<td>2.º año; se cruza con todas las coles<\/td>\n<\/tr>\n<tr>\n<td>Brócoli y coliflor<\/td>\n<td>Fría<\/td>\n<td>Almácigo<\/td>\n<td>40 × 60<\/td>\n<td>1 cm<\/td>\n<td>90 a 120<\/td>\n<td>1<\/td>\n<td>Difícil: se cruzan con las coles<\/td>\n<\/tr>\n<tr>\n<td>Kale (col rizada)<\/td>\n<td>Fría, resiste mucho la helada<\/td>\n<td>Almácigo<\/td>\n<td>40 × 50<\/td>\n<td>1 cm<\/td>\n<td>60, y cortes por meses<\/td>\n<td>2<\/td>\n<td>2.º año<\/td>\n<\/tr>\n<tr>\n<td>Rúcula<\/td>\n<td>Fría y templada<\/td>\n<td>Directa<\/td>\n<td>Al voleo ralo<\/td>\n<td>0,5 cm<\/td>\n<td>30 a 40<\/td>\n<td>1<\/td>\n<td>Muy fácil<\/td>\n<\/tr>\n<tr>\n<td>Perejil<\/td>\n<td>Todo el año<\/td>\n<td>Directa<\/td>\n<td>10 × 25<\/td>\n<td>1 cm<\/td>\n<td>70 a 90 (germina lento)<\/td>\n<td>1<\/td>\n<td>2.º año<\/td>\n<\/tr>\n<tr>\n<td>Albahaca<\/td>\n<td>Cálida<\/td>\n<td>Almácigo<\/td>\n<td>25 × 30<\/td>\n<td>0,5 cm<\/td>\n<td>60<\/td>\n<td>—<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Hortalizas de fruto","h":"<h3>Hortalizas de fruto<\/h3>\n<table>\n<thead>\n<tr>\n<th>Cultivo<\/th>\n<th>Estación<\/th>\n<th>Siembra<\/th>\n<th>Distancia (cm)<\/th>\n<th>Profundidad<\/th>\n<th>Días a cosecha<\/th>\n<th>Rinde (kg/m²)<\/th>\n<th>Semilla propia<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tomate<\/td>\n<td>Cálida<\/td>\n<td>Almácigo 6 a 8 semanas antes de la última helada<\/td>\n<td>50 × 80, con tutor<\/td>\n<td>0,5 cm<\/td>\n<td>120 a 150<\/td>\n<td>4 a 8<\/td>\n<td>Fácil (fermentar 3 días)<\/td>\n<\/tr>\n<tr>\n<td>Pimiento y ají<\/td>\n<td>Cálida<\/td>\n<td>Almácigo temprano<\/td>\n<td>40 × 60<\/td>\n<td>0,5 cm<\/td>\n<td>130 a 160<\/td>\n<td>2<\/td>\n<td>Separar picantes de dulces<\/td>\n<\/tr>\n<tr>\n<td>Berenjena<\/td>\n<td>Cálida<\/td>\n<td>Almácigo temprano<\/td>\n<td>50 × 70<\/td>\n<td>1 cm<\/td>\n<td>130 a 150<\/td>\n<td>3<\/td>\n<td>Fruto sobremaduro<\/td>\n<\/tr>\n<tr>\n<td>Zapallo anco, plomo o cabutia<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>100 × 150<\/td>\n<td>3 cm<\/td>\n<td>120 a 150<\/td>\n<td>2<\/td>\n<td>Una variedad por especie<\/td>\n<\/tr>\n<tr>\n<td>Zapallo criollo (de guía larga)<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>200 × 200<\/td>\n<td>3 cm<\/td>\n<td>150<\/td>\n<td>2<\/td>\n<td>Igual<\/td>\n<\/tr>\n<tr>\n<td>Zapallito<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>80 × 100<\/td>\n<td>3 cm<\/td>\n<td>50 a 60<\/td>\n<td>3 a 4<\/td>\n<td>Fruto muy maduro<\/td>\n<\/tr>\n<tr>\n<td>Pepino<\/td>\n<td>Cálida<\/td>\n<td>Directa o almácigo<\/td>\n<td>40 × 100, en espaldera<\/td>\n<td>2 cm<\/td>\n<td>60 a 70<\/td>\n<td>3<\/td>\n<td>Fruto amarillo maduro<\/td>\n<\/tr>\n<tr>\n<td>Melón y sandía<\/td>\n<td>Cálida, mucho calor<\/td>\n<td>Directa<\/td>\n<td>100 × 150<\/td>\n<td>2 cm<\/td>\n<td>90 a 110<\/td>\n<td>2 a 3<\/td>\n<td>Una variedad<\/td>\n<\/tr>\n<tr>\n<td>Chaucha<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>10 × 50<\/td>\n<td>3 cm<\/td>\n<td>60 a 70<\/td>\n<td>1 a 1,5<\/td>\n<td>Dejar vainas secar<\/td>\n<\/tr>\n<tr>\n<td>Choclo (maíz dulce)<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>30 × 70<\/td>\n<td>4 cm<\/td>\n<td>80 a 100<\/td>\n<td>0,8 (choclos)<\/td>\n<td>Se cruza con todo maíz<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Raíces, bulbos y tubérculos","h":"<h3>Raíces, bulbos y tubérculos<\/h3>\n<table>\n<thead>\n<tr>\n<th>Cultivo<\/th>\n<th>Estación<\/th>\n<th>Siembra<\/th>\n<th>Distancia (cm)<\/th>\n<th>Profundidad<\/th>\n<th>Días a cosecha<\/th>\n<th>Rinde (kg/m²)<\/th>\n<th>Semilla propia<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Papa<\/td>\n<td>Después de las heladas fuertes; una 2.ª siembra en verano en zonas templadas<\/td>\n<td>Papa semilla entera o en trozos con 2 ojos<\/td>\n<td>30 × 70<\/td>\n<td>10 cm, aporcar<\/td>\n<td>100 a 130<\/td>\n<td>1,5 a 2,5<\/td>\n<td>Guardar papas sanas medianas<\/td>\n<\/tr>\n<tr>\n<td>Batata<\/td>\n<td>Cálida (centro y norte)<\/td>\n<td>Guías o brotes<\/td>\n<td>30 × 80<\/td>\n<td>—<\/td>\n<td>120 a 150<\/td>\n<td>2 a 3<\/td>\n<td>Brotar batatas en agua<\/td>\n<\/tr>\n<tr>\n<td>Zanahoria<\/td>\n<td>Fría y templada<\/td>\n<td>Directa, mezclada con arena<\/td>\n<td>5 × 25<\/td>\n<td>1 cm<\/td>\n<td>90 a 120<\/td>\n<td>3<\/td>\n<td>2.º año<\/td>\n<\/tr>\n<tr>\n<td>Remolacha<\/td>\n<td>Fría y templada<\/td>\n<td>Directa<\/td>\n<td>10 × 30<\/td>\n<td>2 cm<\/td>\n<td>70 a 90<\/td>\n<td>2 a 3<\/td>\n<td>2.º año<\/td>\n<\/tr>\n<tr>\n<td>Cebolla<\/td>\n<td>Fría<\/td>\n<td>Almácigo en otoño, trasplante a fin de invierno<\/td>\n<td>10 × 30<\/td>\n<td>1 cm<\/td>\n<td>180 a 240<\/td>\n<td>3 a 4<\/td>\n<td>2.º año; la semilla dura poco<\/td>\n<\/tr>\n<tr>\n<td>Ajo<\/td>\n<td>Fría<\/td>\n<td>Dientes en otoño<\/td>\n<td>10 × 25<\/td>\n<td>3 a 5 cm<\/td>\n<td>210 a 240<\/td>\n<td>0,8 a 1<\/td>\n<td>Plantar los dientes de las mejores cabezas<\/td>\n<\/tr>\n<tr>\n<td>Puerro<\/td>\n<td>Fría<\/td>\n<td>Almácigo<\/td>\n<td>15 × 30<\/td>\n<td>1 cm<\/td>\n<td>150 a 180<\/td>\n<td>2 a 3<\/td>\n<td>2.º año<\/td>\n<\/tr>\n<tr>\n<td>Rabanito<\/td>\n<td>Todo el año menos pleno verano<\/td>\n<td>Directa<\/td>\n<td>3 × 15<\/td>\n<td>1 cm<\/td>\n<td>25 a 30<\/td>\n<td>1<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Topinambur<\/td>\n<td>Templada<\/td>\n<td>Tubérculos<\/td>\n<td>40 × 80<\/td>\n<td>10 cm<\/td>\n<td>180<\/td>\n<td>2 a 3<\/td>\n<td>Rebrota solo; contenerlo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Granos, legumbres y oleaginosas","h":"<h3>Granos, legumbres y oleaginosas<\/h3>\n<table>\n<thead>\n<tr>\n<th>Cultivo<\/th>\n<th>Estación<\/th>\n<th>Siembra<\/th>\n<th>Distancia (cm)<\/th>\n<th>Profundidad<\/th>\n<th>Días a cosecha<\/th>\n<th>Rinde (kg/m²)<\/th>\n<th>Semilla propia<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Trigo<\/td>\n<td>Fría (otoño-invierno)<\/td>\n<td>Al voleo, 15 a 20 g/m²<\/td>\n<td>Surcos cada 20<\/td>\n<td>3 cm<\/td>\n<td>200 a 220<\/td>\n<td>0,2<\/td>\n<td>Grano entero sin curar<\/td>\n<\/tr>\n<tr>\n<td>Avena y cebada<\/td>\n<td>Fría<\/td>\n<td>Al voleo<\/td>\n<td>Surcos cada 20<\/td>\n<td>3 cm<\/td>\n<td>180 a 200<\/td>\n<td>0,2<\/td>\n<td>Igual<\/td>\n<\/tr>\n<tr>\n<td>Centeno<\/td>\n<td>Fría, suelos pobres<\/td>\n<td>Al voleo<\/td>\n<td>Surcos cada 20<\/td>\n<td>3 cm<\/td>\n<td>200<\/td>\n<td>0,15<\/td>\n<td>Igual<\/td>\n<\/tr>\n<tr>\n<td>Maíz para grano<\/td>\n<td>Cálida<\/td>\n<td>Directa, 2 semillas por golpe<\/td>\n<td>30 × 70<\/td>\n<td>4 a 5 cm<\/td>\n<td>120 a 150<\/td>\n<td>0,3<\/td>\n<td>50 plantas o más, una sola variedad<\/td>\n<\/tr>\n<tr>\n<td>Poroto seco<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>10 × 50<\/td>\n<td>3 a 4 cm<\/td>\n<td>100 a 120<\/td>\n<td>0,15<\/td>\n<td>Muy fácil<\/td>\n<\/tr>\n<tr>\n<td>Arveja seca<\/td>\n<td>Fría<\/td>\n<td>Directa, doble hilera<\/td>\n<td>5 × 50<\/td>\n<td>3 a 4 cm<\/td>\n<td>110 a 130<\/td>\n<td>0,15<\/td>\n<td>Muy fácil<\/td>\n<\/tr>\n<tr>\n<td>Haba<\/td>\n<td>Fría, resiste helada<\/td>\n<td>Directa en otoño<\/td>\n<td>20 × 60<\/td>\n<td>5 cm<\/td>\n<td>150 a 180<\/td>\n<td>0,3 (seca)<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Lenteja<\/td>\n<td>Fría<\/td>\n<td>Directa<\/td>\n<td>3 × 25<\/td>\n<td>3 cm<\/td>\n<td>120 a 150<\/td>\n<td>0,1 a 0,15<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Garbanzo<\/td>\n<td>Fría a templada, suelo seco<\/td>\n<td>Directa<\/td>\n<td>10 × 40<\/td>\n<td>4 cm<\/td>\n<td>130 a 150<\/td>\n<td>0,1 a 0,15<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Soja<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>5 × 50<\/td>\n<td>3 cm<\/td>\n<td>120 a 140<\/td>\n<td>0,2<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Girasol<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>30 × 70<\/td>\n<td>4 cm<\/td>\n<td>110 a 130<\/td>\n<td>0,15 de semilla<\/td>\n<td>Cabezas secas tapadas de los pájaros<\/td>\n<\/tr>\n<tr>\n<td>Quinoa<\/td>\n<td>Templada a fría, seca<\/td>\n<td>Directa, rala<\/td>\n<td>20 × 50<\/td>\n<td>1 cm<\/td>\n<td>120 a 150<\/td>\n<td>0,1 a 0,2<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Amaranto<\/td>\n<td>Cálida<\/td>\n<td>Directa<\/td>\n<td>30 × 60<\/td>\n<td>0,5 cm<\/td>\n<td>100 a 120<\/td>\n<td>0,1 a 0,2<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<tr>\n<td>Lino<\/td>\n<td>Fría<\/td>\n<td>Al voleo denso<\/td>\n<td>—<\/td>\n<td>1 cm<\/td>\n<td>100 a 120<\/td>\n<td>0,1 de semilla<\/td>\n<td>Fácil<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Asociaciones y rotación en una línea","h":"<h3>Asociaciones y rotación en una línea<\/h3>\n<ul>\n<li><strong>Se llevan bien:<\/strong> maíz + poroto + zapallo; tomate + albahaca + cebolla; zanahoria + cebolla o puerro; lechuga entre hileras de cultivos lentos; habas + papa.<\/li>\n<li><strong>Se llevan mal:<\/strong> poroto y arveja junto a cebolla o ajo; papa junto a tomate (comparten enfermedades); hinojo junto a casi todo.<\/li>\n<li><strong>No repetir en el mismo lugar<\/strong> papa, tomate, pimiento y berenjena antes de 3 o 4 años: son de la misma familia y acumulan enfermedades en el suelo.<\/li>\n<\/ul>"}]},{"t":"Plan de producción familiar y calendario mes a mes","s":[{"t":"","h":"<p>La tierra que hace falta se calcula primero y se siembra después: improvisar lleva a tener cien lechugas en diciembre y nada en julio. Este capítulo da un plan para una familia de cuatro y un calendario de tareas para Patagonia Norte (Alto Valle, Valle Medio, valles de Neuquén), que se adapta a otras zonas corriendo las fechas según las heladas.<\/p>"},{"t":"Cuánta tierra para una familia de cuatro","h":"<h3>Cuánta tierra para una familia de cuatro<\/h3>\n<p>Cifras orientativas, con trabajo manual, riego y compost. Una hectárea regada del Alto Valle, bien trabajada, puede alimentar a decenas de personas <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"6\" data-s=\"0\">Nutrición §6<\/a>; una familia necesita mucho menos, pero bien organizada.<\/p>\n<table>\n<thead>\n<tr>\n<th>Uso<\/th>\n<th>Superficie<\/th>\n<th>Qué da<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Huerta intensiva de verduras<\/td>\n<td>200 a 400 m²<\/td>\n<td>Verdura fresca todo el año y excedente para conservar<\/td>\n<\/tr>\n<tr>\n<td>Papa<\/td>\n<td>200 m²<\/td>\n<td>300 a 500 kg por año<\/td>\n<\/tr>\n<tr>\n<td>Zapallos (anco, criollo)<\/td>\n<td>100 m²<\/td>\n<td>200 kg que se guardan hasta el invierno<\/td>\n<\/tr>\n<tr>\n<td>Legumbres secas (poroto, arveja, haba, lenteja, garbanzo)<\/td>\n<td>1.000 m²<\/td>\n<td>120 a 150 kg<\/td>\n<\/tr>\n<tr>\n<td>Maíz para grano y para las gallinas<\/td>\n<td>1.000 m²<\/td>\n<td>300 kg<\/td>\n<\/tr>\n<tr>\n<td>Trigo o avena<\/td>\n<td>1.500 a 2.000 m²<\/td>\n<td>300 a 400 kg de grano<\/td>\n<\/tr>\n<tr>\n<td>Girasol para aceite y para las aves<\/td>\n<td>500 m²<\/td>\n<td>75 kg de semilla (20 a 25 litros de aceite)<\/td>\n<\/tr>\n<tr>\n<td>Frutales y frutos secos<\/td>\n<td>500 a 1.000 m²<\/td>\n<td>Fruta fresca, seca y nueces<\/td>\n<\/tr>\n<tr>\n<td>Gallinero y parque<\/td>\n<td>150 a 300 m²<\/td>\n<td>Huevos <span class=\"ref\">►<\/span> Manual de gallinas ponedoras<\/td>\n<\/tr>\n<tr>\n<td>Cabras (2 o 3)<\/td>\n<td>1.000 a 2.000 m² de pastura o forraje equivalente<\/td>\n<td>Leche y queso <span class=\"ref\">►<\/span> Manual de cabras lecheras y queso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En total, para que una familia de cuatro se autoabastezca de casi todo, hace falta del orden de media hectárea a una hectárea con agua de riego. Con menos tierra, la prioridad es: <strong>huerta, papa, zapallo, legumbres y gallinas<\/strong>; el trigo y el aceite se intercambian con quien tenga campo.<\/p>"},{"t":"Prioridades si la tierra o las manos son pocas","h":"<h3>Prioridades si la tierra o las manos son pocas<\/h3>\n<ol>\n<li>Huerta de hojas y raíces (rinde mucho por m² y da vitaminas).<\/li>\n<li>Papa (la que más calorías da por m² y por hora de trabajo).<\/li>\n<li>Zapallo (se guarda meses sin heladera).<\/li>\n<li>Porotos y otras legumbres (proteína y abono para el suelo).<\/li>\n<li>Gallinas (convierten restos y bichos en huevos).<\/li>\n<li>Maíz.<\/li>\n<li>Cereales de invierno y girasol.<\/li>\n<\/ol>"},{"t":"Calendario mes a mes (Patagonia Norte)","h":"<h3>Calendario mes a mes (Patagonia Norte)<\/h3>\n<p>Orientativo. Las últimas heladas pueden llegar en octubre y aun en noviembre; las primeras, en abril. En el NEA y el NOA se adelanta todo uno a dos meses en primavera y se atrasa en otoño; en la Patagonia sur y la cordillera, al revés. Confirmar con el calendario del INTA de cada zona.<\/p>\n<table>\n<thead>\n<tr>\n<th>Mes<\/th>\n<th>Sembrar y plantar<\/th>\n<th>Cosechar<\/th>\n<th>Otras tareas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Enero<\/td>\n<td>Acelga, lechuga a media sombra, zanahoria, remolacha, chaucha tardía; almácigos de repollo, brócoli y kale para el otoño<\/td>\n<td>Tomate, zapallito, chaucha, pepino, papa temprana, ajo (si no se cosechó), trigo<\/td>\n<td>Riego y acolchado; guardar semillas de lechuga, arveja y haba; secar fruta y tomate<\/td>\n<\/tr>\n<tr>\n<td>Febrero<\/td>\n<td>Almácigo de puerro y coles; espinaca, rúcula y rabanito a fin de mes<\/td>\n<td>Tomate, pimiento, berenjena, maíz, poroto, zapallo, girasol<\/td>\n<td>Conservas; curado de cebollas y ajos; semillas de tomate, pimiento y poroto<\/td>\n<\/tr>\n<tr>\n<td>Marzo<\/td>\n<td>Ajo, habas, arvejas, espinaca, lechuga, rabanito; almácigo de cebolla; abonos verdes (vicia, avena)<\/td>\n<td>Zapallos, maíz, poroto seco, papa, nueces<\/td>\n<td>Curar zapallos al sol; guardar papa en lugar oscuro; servicio de las cabras<\/td>\n<\/tr>\n<tr>\n<td>Abril<\/td>\n<td>Ajo, habas, arvejas; trigo, avena y centeno; trasplante de coles<\/td>\n<td>Últimos tomates verdes (para encurtir), papas, membrillos, manzanas tardías<\/td>\n<td>Primeras heladas: proteger lo que queda; sótano y despensa<\/td>\n<\/tr>\n<tr>\n<td>Mayo<\/td>\n<td>Trigo y avena (hasta junio); plantación de frutales y frutillas<\/td>\n<td>Coles, acelga, espinaca, puerro, zanahoria<\/td>\n<td>Limpiar y aceitar herramientas; leña para el invierno siguiente ya cortada<\/td>\n<\/tr>\n<tr>\n<td>Junio<\/td>\n<td>Plantar frutales a raíz desnuda<\/td>\n<td>Coles, acelga, puerro, zanahoria y remolacha del suelo<\/td>\n<td>Poda de frutales de pepita; plan de huerta del año; inventario de semillas y prueba de germinación<\/td>\n<\/tr>\n<tr>\n<td>Julio<\/td>\n<td>Trasplante de cebolla; almácigos de tomate, pimiento y berenjena bajo cubierta (fin de mes)<\/td>\n<td>Lo mismo<\/td>\n<td>Injertos de púa (fin de julio y agosto); poda de vid; reparar invernadero<\/td>\n<\/tr>\n<tr>\n<td>Agosto<\/td>\n<td>Arvejas, lechuga, zanahoria, remolacha, espinaca; papa temprana en zonas protegidas; almácigos de verano<\/td>\n<td>Coles, puerro, primeras habas verdes<\/td>\n<td>Injertos; esquejes de sauce, vid, membrillo, higuera; parición de cabras<\/td>\n<\/tr>\n<tr>\n<td>Septiembre<\/td>\n<td>Papa, acelga, zanahoria, remolacha, lechuga; almácigos de zapallo y pepino bajo cubierta<\/td>\n<td>Habas verdes, arvejas tempranas, espinaca<\/td>\n<td>Rustificar plantines; estar atentos a las heladas tardías sobre frutales en flor<\/td>\n<\/tr>\n<tr>\n<td>Octubre<\/td>\n<td>A partir de pasada la última helada local: tomate, pimiento, berenjena; maíz, poroto, zapallo, zapallito, girasol<\/td>\n<td>Arvejas, habas, lechuga, espinaca<\/td>\n<td>Tapar plantines las noches frías; esquila<\/td>\n<\/tr>\n<tr>\n<td>Noviembre<\/td>\n<td>Maíz, porotos, zapallos, chauchas, pepino, melón y sandía; segunda siembra escalonada de todo<\/td>\n<td>Habas secas, arvejas, ajo verde, primeras cerezas<\/td>\n<td>Acolchar toda la huerta antes del calor; cosechar miel en buen año<\/td>\n<\/tr>\n<tr>\n<td>Diciembre<\/td>\n<td>Chauchas, maíz tardío, lechuga y acelga en media sombra<\/td>\n<td>Ajo, arvejas secas, papa temprana, frutillas, damascos; trigo a fin de mes o en enero<\/td>\n<td>Vigilancia de incendios; riego de noche; secar ajos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"El cuaderno de la huerta","h":"<h3>El cuaderno de la huerta<\/h3>\n<p>Cada familia lleva un cuaderno con: plano de los canteros, qué se sembró, cuándo y con qué semilla; fechas de primera y última helada; cosecha de cada cultivo en kilos; plagas y qué funcionó contra ellas. Después de dos o tres años, ese cuaderno vale más que cualquier manual, porque describe la tierra propia. Hay una planilla para fotocopiar en el libro <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\"><em>Familia y comunidad<\/em><\/a>.<\/p>"}]},{"t":"Semillas: guardar la vida de la huerta","s":[{"t":"","h":"<p>Sin semillas propias, la huerta dura una temporada. Es la habilidad más importante de este libro y la que menos se improvisa: hay que empezar a guardar desde la primera cosecha. <span class=\"b vital\">VITAL<\/span> (44)<\/p>"},{"t":"Qué semillas se pueden guardar","h":"<h3>Qué semillas se pueden guardar<\/h3>\n<ul>\n<li><strong>Sí:<\/strong> variedades de polinización abierta y criollas. Sus hijos salen iguales a los padres. El ProHuerta del INTA reparte este tipo de semillas, y las ferias de semillas y los huerteros de la zona las intercambian.<\/li>\n<li><strong>No:<\/strong> las híbridas (el sobre dice <em>F1<\/em> o <em>híbrido<\/em>). Dan hijos distintos y casi siempre peores. Sirven para una temporada, no para guardar.<\/li>\n<li><strong>Conseguir ya:<\/strong> un kit completo de semillas de polinización abierta por familia, más legumbres secas de almacén (porotos, lentejas, garbanzos y arvejas enteras germinan casi siempre) y papas para semilla.<\/li>\n<\/ul>"},{"t":"Cuatro cosas que deciden si la semilla sirve","h":"<h3>Cuatro cosas que deciden si la semilla sirve<\/h3>\n<ol>\n<li><strong>Que no se cruce.<\/strong> Algunas especies se polinizan solas (poroto, arveja, lechuga, tomate); otras se cruzan con plantas de la misma especie que estén cerca (zapallo, maíz, coles, zanahoria, cebolla). Ver la tabla.<\/li>\n<li><strong>Que venga de muchas plantas.<\/strong> Guardar semilla de una sola planta empobrece la variedad en pocos años. Mínimo: 5 a 10 plantas en las que se autopolinizan, 20 a 50 en las que se cruzan, y 100 o más en el maíz.<\/li>\n<li><strong>Que venga de las mejores plantas.<\/strong> Elegir las más sanas, productivas, resistentes a la helada o a la sequía y de buen sabor, no los primeros frutos ni los que sobraron. Marcarlas con una cinta en la huerta y no cosecharlas para comer.<\/li>\n<li><strong>Que esté madura y seca.<\/strong> Semilla cosechada verde no germina o dura poco.<\/li>\n<\/ol>"},{"t":"Distancias y cuidados por especie","h":"<h3>Distancias y cuidados por especie<\/h3>\n<table>\n<thead>\n<tr>\n<th>Especie<\/th>\n<th>Cómo se poliniza<\/th>\n<th>Distancia para que no se cruce<\/th>\n<th>Plantas mínimas<\/th>\n<th>Cómo cosechar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Poroto, arveja, haba, lenteja, garbanzo<\/td>\n<td>Sola (la haba algo cruzada por abejas)<\/td>\n<td>5 a 10 m entre variedades (haba: 100 m)<\/td>\n<td>10 a 20<\/td>\n<td>Vainas secas en la planta; trillar en bolsa<\/td>\n<\/tr>\n<tr>\n<td>Lechuga<\/td>\n<td>Sola<\/td>\n<td>5 m<\/td>\n<td>10<\/td>\n<td>Tallos florales cuando la mitad tiene pelusa; sacudir en bolsa<\/td>\n<\/tr>\n<tr>\n<td>Tomate<\/td>\n<td>Sola<\/td>\n<td>3 a 5 m<\/td>\n<td>5 a 10<\/td>\n<td>Fruto muy maduro: semillas con su gel, fermentar 3 días con un poco de agua, lavar y secar<\/td>\n<\/tr>\n<tr>\n<td>Pimiento y ají<\/td>\n<td>Sola, pero los insectos cruzan<\/td>\n<td>20 a 50 m<\/td>\n<td>5 a 10<\/td>\n<td>Fruto rojo maduro<\/td>\n<\/tr>\n<tr>\n<td>Zapallos y zapallitos<\/td>\n<td>Por insectos<\/td>\n<td>500 m o polinización a mano<\/td>\n<td>10 a 20<\/td>\n<td>Fruto muy maduro (dejar 3 semanas más después de cosechado)<\/td>\n<\/tr>\n<tr>\n<td>Pepino y melón<\/td>\n<td>Por insectos<\/td>\n<td>500 m o a mano<\/td>\n<td>10<\/td>\n<td>Fruto amarillo, pasado<\/td>\n<\/tr>\n<tr>\n<td>Maíz<\/td>\n<td>Por viento<\/td>\n<td>300 a 500 m, o sembrar variedades separadas un mes<\/td>\n<td>100 o más<\/td>\n<td>Mazorcas secas en la planta<\/td>\n<\/tr>\n<tr>\n<td>Repollo, brócoli, kale, coliflor<\/td>\n<td>Por insectos; todas se cruzan entre sí<\/td>\n<td>500 m; una sola por temporada<\/td>\n<td>20<\/td>\n<td>2.º año: vainas secas<\/td>\n<\/tr>\n<tr>\n<td>Zanahoria<\/td>\n<td>Por insectos; se cruza con la zanahoria silvestre<\/td>\n<td>500 m<\/td>\n<td>20 a 50<\/td>\n<td>2.º año: umbelas secas<\/td>\n<\/tr>\n<tr>\n<td>Cebolla y puerro<\/td>\n<td>Por insectos<\/td>\n<td>500 m<\/td>\n<td>20 a 50<\/td>\n<td>2.º año: cabezas florales con semillas negras visibles<\/td>\n<\/tr>\n<tr>\n<td>Acelga y remolacha<\/td>\n<td>Por viento; se cruzan entre sí<\/td>\n<td>500 m o más<\/td>\n<td>20<\/td>\n<td>2.º año: tallos secos<\/td>\n<\/tr>\n<tr>\n<td>Girasol<\/td>\n<td>Por insectos<\/td>\n<td>500 m<\/td>\n<td>20<\/td>\n<td>Cabezas secas, tapadas con tela de los pájaros<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Polinizar a mano zapallos y zapallitos","h":"<h3>Polinizar a mano zapallos y zapallitos<\/h3>\n<p>Permite tener varias variedades sin que se crucen.<\/p>\n<ol>\n<li>A la tarde, buscar flores macho (tallo fino, sin zapallito abajo) y flores hembra (con un zapallito chico abajo) que se vayan a abrir al día siguiente: están amarillas e hinchadas.<\/li>\n<li>Cerrarlas con una cinta o una bolsita de papel para que no entren insectos.<\/li>\n<li>Temprano a la mañana, cortar la flor macho, sacarle los pétalos y frotar el polen sobre el centro de la flor hembra.<\/li>\n<li>Volver a cerrar la flor hembra y marcar el tallo con una cinta: ese fruto es para semilla.<\/li>\n<\/ol>"},{"t":"Las bianuales: zanahoria, cebolla, remolacha, coles","h":"<h3>Las bianuales: zanahoria, cebolla, remolacha, coles<\/h3>\n<p>Dan semilla recién al segundo año. Dos formas:<\/p>\n<ul>\n<li><strong>En el lugar:<\/strong> dejar en la tierra las plantas elegidas durante el invierno (con acolchado en zonas muy frías). En primavera florecen y en verano dan semilla.<\/li>\n<li><strong>Guardadas y replantadas:<\/strong> cosechar las mejores raíces o cabezas en otoño, guardarlas en arena húmeda en el sótano y replantarlas a fin de invierno.<\/li>\n<\/ul>"},{"t":"Secar, guardar y probar","h":"<h3>Secar, guardar y probar<\/h3>\n<ol>\n<li>Secar a la sombra, extendidas en papel o en tela, 1 o 2 semanas. Una semilla seca se quiebra, no se dobla.<\/li>\n<li>Limpiar de restos: soplando, con zaranda o con viento.<\/li>\n<li><strong>Sobres de papel rotulados<\/strong> con especie, variedad, año, de qué plantas y de qué huerta.<\/li>\n<li>Dentro de frascos de vidrio cerrados, con una bolsita de arroz tostado o leche en polvo para absorber humedad.<\/li>\n<li>Lugar fresco, seco y oscuro. Cada 5 °C menos y cada punto menos de humedad alargan su vida.<\/li>\n<li><strong>Gorgojos en legumbres:<\/strong> 3 días en el freezer si hay, o mezclar con ceniza fina antes de guardar.<\/li>\n<\/ol>\n<p><strong>Duración aproximada:<\/strong> cebolla, puerro y perejil 1 a 2 años; zanahoria, maíz, poroto y pimiento 2 a 3; lechuga, tomate, zapallo, pepino, repollo y remolacha 3 a 5. Renovar antes de que venzan, sembrando y volviendo a guardar.<\/p>\n<p><strong>Prueba de germinación:<\/strong> 10 semillas en un papel húmedo doblado, dentro de una bolsa, en lugar tibio. A la semana, contar cuántas germinaron. Menos de 7: sembrar más denso o renovar.<\/p>"},{"t":"El banco de semillas de la comunidad","h":"<h3>El banco de semillas de la comunidad<\/h3>\n<ul>\n<li>Cada familia guarda sus semillas y además entrega una parte a un banco común guardado en otra casa, por si hay incendio, inundación o robo.<\/li>\n<li>Una persona responsable y un suplente llevan el registro: qué hay, cuánto, de qué año, quién lo produjo y la última prueba de germinación.<\/li>\n<li>Cada variedad la \"custodia\" una familia distinta, que se encarga de renovarla cada pocos años.<\/li>\n<li>El banco presta semilla en primavera y la familia devuelve el doble de lo que recibió después de la cosecha.<\/li>\n<li>Intercambiar con otras comunidades refresca las variedades y es la mejor protección contra una mala temporada.<\/li>\n<\/ul>"}]},{"t":"Cereales, legumbres y oleaginosas: la comida de base","s":[{"t":"","h":"<p>La huerta da vitaminas, pero las calorías y las proteínas de todo el año vienen de cereales, legumbres, papa y aceite. Para alimentar a un adulto hace falta, como orden de magnitud, entre 1.500 y 2.500 m² de cultivos de base, además de la huerta. <span class=\"b vital\">VITAL<\/span><\/p>"},{"t":"Cuánto sembrar por adulto y por año","h":"<h3>Cuánto sembrar por adulto y por año<\/h3>\n<p>Cifras orientativas con trabajo manual y suelo de fertilidad media. El primer año rinde menos: sembrar un 50 % más.<\/p>\n<table>\n<thead>\n<tr>\n<th>Cultivo<\/th>\n<th>Consumo por adulto al año<\/th>\n<th>Rinde aproximado a mano<\/th>\n<th>Superficie por adulto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Trigo<\/td>\n<td>100 kg<\/td>\n<td>0,2 kg por m²<\/td>\n<td>500 m²<\/td>\n<\/tr>\n<tr>\n<td>Maíz<\/td>\n<td>60 kg<\/td>\n<td>0,3 kg por m²<\/td>\n<td>200 m²<\/td>\n<\/tr>\n<tr>\n<td>Papa<\/td>\n<td>100 kg<\/td>\n<td>1,5 a 2,5 kg por m²<\/td>\n<td>50 m²<\/td>\n<\/tr>\n<tr>\n<td>Legumbres (poroto, garbanzo, lenteja, arveja)<\/td>\n<td>30 kg<\/td>\n<td>0,1 a 0,15 kg por m²<\/td>\n<td>250 m²<\/td>\n<\/tr>\n<tr>\n<td>Girasol (para aceite)<\/td>\n<td>15 l de aceite ≈ 50 kg de semilla<\/td>\n<td>0,15 kg por m²<\/td>\n<td>350 m²<\/td>\n<\/tr>\n<tr>\n<td>Zapallo (calorías que se guardan)<\/td>\n<td>50 kg<\/td>\n<td>2 kg por m²<\/td>\n<td>25 m²<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La papa da más calorías por metro cuadrado que cualquier cereal: en una comunidad con poca tierra o pocas manos, es el primer cultivo de base.<\/p>"},{"t":"Trigo y otros cereales de invierno [AÑOS]","h":"<h3>Trigo y otros cereales de invierno <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Trigo, cebada, avena y centeno se siembran en otoño o comienzo del invierno y se cosechan a comienzos del verano.<\/p>\n<p><strong>Siembra:<\/strong> suelo trabajado y sin malezas. Al voleo, unos 15 a 20 g de semilla por m², y tapar pasando el rastrillo. O en surcos cada 20 cm. La semilla puede ser trigo de un acopio o de un molino, siempre que sea grano entero y no esté curado con fungicida (los tratados vienen teñidos de colores: <strong>no se comen<\/strong>).<\/p>\n<p><strong>Cosecha a mano<\/strong><\/p>\n<ol>\n<li>Cosechar cuando la espiga está dorada, el grano duro (no se marca con la uña) y el tallo seco.<\/li>\n<li>Cortar con hoz o guadaña a media altura, en días secos.<\/li>\n<li>Atar en gavillas y pararlas en grupos (parvas) para que terminen de secar una semana.<\/li>\n<li><strong>Trillar:<\/strong> golpear las espigas con un palo (mayal) sobre una lona, o hacerlas pisar.<\/li>\n<li><strong>Aventar:<\/strong> en día de viento, dejar caer el grano desde la altura del pecho sobre una lona. La paja vuela, el grano cae.<\/li>\n<li>Secar el grano al sol 2 o 3 días y guardar en tambores o bidones herméticos <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 1<\/a>.<\/li>\n<\/ol>\n<p><strong>Variedades de trigo.<\/strong> Para pan se siembra trigo pan; el trigo candeal (más duro y amarillo) es mejor para fideos y sémola. Conviene conseguir semilla de variedades que ya se siembren en la zona: preguntar en el INTA, en cooperativas, molinos y productores de granos. El trigo no es híbrido: la semilla de la propia cosecha sirve para el año siguiente (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"3\" data-s=\"0\">cap. 4<\/a>). Para la Patagonia norte, las variedades de ciclo largo se siembran en otoño e invierno (mayo y junio); las de ciclo corto pueden sembrarse hasta agosto, con algo menos de rinde.<\/p>\n<p><strong>Cornezuelo: revisar siempre el centeno <span class=\"b vital\">VITAL<\/span>.<\/strong> El cornezuelo es un hongo que reemplaza algunos granos de la espiga por cuerpos <strong>negros o violáceos, alargados y curvos como un espolón<\/strong>, más grandes que el grano. Ataca sobre todo al centeno, y a veces al trigo y la cebada, en años húmedos. <strong>Es muy tóxico<\/strong>: comido en la harina provoca envenenamiento (ergotismo) con alucinaciones, convulsiones, gangrena de manos y pies y abortos <span class=\"ref\">►<\/span> Manual médico T1 3.33. Qué hacer:<\/p>\n<ol>\n<li>Antes de cosechar, recorrer el cultivo y arrancar a mano las espigas con cornezuelo.<\/li>\n<li>Después de trillar, revisar el grano sobre una lona clara y sacar todo cuerpo negro.<\/li>\n<li><strong>Limpieza en salmuera:<\/strong> volcar el grano en agua con mucha sal (200 g por litro) y revolver: el cornezuelo flota y se saca con un colador; enjuagar el grano en agua limpia y secarlo al sol enseguida.<\/li>\n<li>Nunca sembrar semilla de un lote con cornezuelo, y no repetir centeno en el mismo lugar al año siguiente.<\/li>\n<li>Si se encuentra cornezuelo en harina ya molida, <strong>esa harina no se come<\/strong> ni se da a los animales.<\/li>\n<\/ol>"},{"t":"Maíz [AÑOS]","h":"<h3>Maíz <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Es el cereal más fácil de cultivar y cosechar a mano. Siembra después de la última helada, a 4 o 5 cm de hondo, 2 semillas cada 30 cm en surcos separados 70 cm. Pide mucho abono y agua cuando florece. Se cosecha en mazorca seca en la planta y se guarda en espiga colgada o desgranado.<\/p>\n<p><strong>Nixtamalizar: indispensable si se come mucho maíz.<\/strong> Una dieta basada en maíz sin este tratamiento puede producir pelagra, una enfermedad por falta de niacina. Los pueblos de América lo resolvieron así:<\/p>\n<ol>\n<li>1 kg de maíz seco, 3 litros de agua y 1 cucharada sopera colmada (unos 15 g) de cal hidratada (de corralón, sin aditivos, o cal de construcción apta alimentos).<\/li>\n<li>Hervir 30 a 45 minutos y dejar reposar toda la noche.<\/li>\n<li>Lavar frotando hasta que se suelte la cáscara del grano.<\/li>\n<li>Moler húmedo: la masa sirve para tortillas, tamales y humita.<\/li>\n<\/ol>"},{"t":"Legumbres [VITAL]","h":"<h3>Legumbres <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Son la proteína principal de una comunidad ovolactovegetariana y además abonan el suelo.<\/p>\n<table>\n<thead>\n<tr>\n<th>Legumbre<\/th>\n<th>Estación<\/th>\n<th>Comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Poroto (pallares, alubia, negro)<\/td>\n<td>Cálida<\/td>\n<td>El más fácil; variedades enanas o de enrame<\/td>\n<\/tr>\n<tr>\n<td>Arveja<\/td>\n<td>Fría<\/td>\n<td>Siembra de otoño o fin de invierno<\/td>\n<\/tr>\n<tr>\n<td>Haba<\/td>\n<td>Fría<\/td>\n<td>Muy resistente al frío; se come verde o seca. Algunas personas tienen una intolerancia hereditaria a las habas <span class=\"ref\">►<\/span> Manual médico T1 6.19<\/td>\n<\/tr>\n<tr>\n<td>Garbanzo<\/td>\n<td>Fría a templada<\/td>\n<td>Prefiere suelo seco<\/td>\n<\/tr>\n<tr>\n<td>Lenteja<\/td>\n<td>Fría<\/td>\n<td>Se cultiva en la región pampeana; pide suelo suelto<\/td>\n<\/tr>\n<tr>\n<td>Soja<\/td>\n<td>Cálida<\/td>\n<td>Para tofu y leche de soja; pide muchos días de calor<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Cosechar cuando las vainas están secas y suenan. Trillar dentro de una bolsa golpeando con un palo, aventar, secar al sol y guardar.<\/p>"},{"t":"Quinoa y amaranto [MEJORA]","h":"<h3>Quinoa y amaranto <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Ambos crecen bien en suelos pobres y secos, y su grano tiene proteína de buena calidad. La quinoa se lava frotándola en varias aguas hasta que no haga espuma (la espuma es saponina, amarga e irritante). El amaranto (que crece también como maleza: el yuyo colorado) da hojas comestibles y grano.<\/p>"},{"t":"Moler granos [VITAL] (39)","h":"<h3>Moler granos <span class=\"b vital\">VITAL<\/span> (39)<\/h3>\n<ul>\n<li><strong>Molino manual de discos<\/strong> (tipo Corona): el mejor recurso. Comprar uno ahora y discos de repuesto. Muele maíz, trigo y legumbres.<\/li>\n<li><strong>Mortero de piedra o madera:<\/strong> para cantidades chicas.<\/li>\n<li><strong>Piedra de moler (conana o metate):<\/strong> una piedra plana y otra de mano, lo usado en el norte argentino durante siglos.<\/li>\n<li>Tamizar con un colador fino o tela: lo que pasa es harina blanca, lo que queda es salvado (alimento de gallinas o se mezcla con la harina integral).<\/li>\n<li>Moler lo que se usa en la semana: la harina integral se pone rancia en un mes; el grano entero dura años.<\/li>\n<\/ul>"},{"t":"Molino de piedra casero [AÑOS]","h":"<h3>Molino de piedra casero <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Si no se consiguió un molino de discos, o se rompió, un molino de mano de dos piedras (como los que se usaron durante miles de años) muele 1 a 2 kg de harina por hora.<\/p>\n<ol>\n<li><strong>Las piedras:<\/strong> dos discos de 40 a 50 cm de diámetro y 8 a 10 cm de espesor, de piedra dura y granulosa (basalto, arenisca dura, granito). Se pueden <strong>moldear de hormigón<\/strong> rico en cemento (1 de cemento por 2 de arena gruesa y piedra partida chica) en un molde de chapa, curados húmedos dos semanas.<\/li>\n<li><strong>Piedra de abajo (fija):<\/strong> apenas abombada hacia arriba en el centro, con un eje vertical de hierro o madera dura clavado en el centro.<\/li>\n<li><strong>Piedra de arriba (gira):<\/strong> apenas cóncava, para que calce sobre la de abajo. Un agujero central de 6 a 8 cm (el ojo) por donde se echa el grano, cruzado por una planchuela con un hoyo que apoya en la punta del eje. Un mango vertical cerca del borde para girarla.<\/li>\n<li><strong>Picado:<\/strong> las dos caras que se tocan llevan surcos rectos que salen del centro hacia el borde, de 3 a 5 mm de hondo, tallados con cortafrío. Los surcos cortan el grano y sacan la harina hacia afuera. Se vuelven a picar cuando la piedra se alisa.<\/li>\n<li><strong>Finura:<\/strong> se regula con arandelas o cuñas bajo la planchuela, que separan apenas las piedras. Más separadas, harina gruesa o sémola; más juntas, harina fina.<\/li>\n<li>Un cajón o una lona alrededor junta la harina que sale por el borde.<\/li>\n<\/ol>\n<p><strong>Mortero de tronco (pilón):<\/strong> un tronco ahuecado y un palo pesado sirven para descascarar arroz y cebada, quebrar maíz y moler legumbres secas.<\/p>"},{"t":"Prensa de aceite casera [AÑOS]","h":"<h3>Prensa de aceite casera <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>La forma más simple y fuerte es con un <strong>gato hidráulico de botella<\/strong> de auto o camión (de 10 a 20 toneladas).<\/p>\n<ol>\n<li><strong>Marco:<\/strong> dos tirantes horizontales de madera dura o perfiles de hierro, unidos por dos varillas roscadas gruesas (de 16 mm o más) con tuercas. El gato empuja entre los dos travesaños.<\/li>\n<li><strong>Cilindro:<\/strong> un caño de hierro de 10 a 12 cm de diámetro y 20 cm de alto, con agujeros de 2 a 3 mm cada 1 cm por todo el costado, apoyado en una bandeja con pico de salida.<\/li>\n<li><strong>Pistón:<\/strong> un disco de madera dura o hierro que entra justo en el caño, con un taco encima para que el gato empuje.<\/li>\n<li><strong>Preparar la semilla:<\/strong> girasol pelado (o con cáscara, rinde menos), nuez, maní, lino o colza, quebrada en el molino y <strong>calentada a unos 60 °C<\/strong> (tibia, que se pueda tocar) en una olla, revolviendo. En frío rinde mucho menos.<\/li>\n<li><strong>Prensar:<\/strong> cargar la semilla en una bolsa de tela fuerte dentro del cilindro, poner el pistón y bombear el gato despacio. Esperar un minuto entre bombeadas para que el aceite escurra.<\/li>\n<li><strong>Rinde<\/strong> entre la mitad y dos tercios del aceite que tiene la semilla: alrededor de 1 litro por cada 3 o 4 kg de girasol.<\/li>\n<li>Decantar y guardar como dice <em>Aceite casero<\/em> (arriba). La torta que queda es alimento de gallinas.<\/li>\n<\/ol>"},{"t":"Aceite [AÑOS]","h":"<h3>Aceite <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>En una dieta sin carne, el aceite y la manteca son la grasa del año, y además se necesitan para el jabón y las lámparas.<\/p>\n<p><strong>Opciones, de más a menos práctica<\/strong><\/p>\n<ol>\n<li><strong>Guardar aceite comprado:<\/strong> dura 1 a 2 años en envase cerrado, a oscuras y fresco. Es lo primero para la despensa.<\/li>\n<li><strong>Prensa manual de tornillo:<\/strong> las hay de fabricación casera y comerciales. Con girasol, maíz, maní, nuez o sésamo da aproximadamente 1 litro por cada 3 a 4 kg de semilla. El residuo (torta) es buen alimento para gallinas y cabras.<\/li>\n<li><strong>Nuez:<\/strong> romper y separar la pulpa, molerla hasta pasta, calentar suavemente con un poco de agua y prensar en una tela. Rinde poco pero no necesita máquina.<\/li>\n<li><strong>Oliva (Cuyo, NOA, algunas zonas de Río Negro):<\/strong> moler las aceitunas con carozo, batir la pasta con agua tibia, dejar reposar: el aceite sube y se recoge con cucharón.<\/li>\n<li><strong>Manteca y manteca clarificada (ghee):<\/strong> la grasa de la leche de cabra o vaca (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"4\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 5<\/a> y 8, y cap. 7 de este libro).<\/li>\n<\/ol>\n<p><strong>Aceite casero:<\/strong> dejarlo decantar 2 semanas en botellas oscuras, trasvasar sin la borra y guardar al fresco. Se pone rancio más rápido que el industrial: hacer cantidades para pocos meses.<\/p>"},{"t":"Endulzantes [MEJORA]","h":"<h3>Endulzantes <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>El azúcar no es necesaria para vivir, pero sí para conservar frutas en mermelada y para el ánimo.<\/p>\n<table>\n<thead>\n<tr>\n<th>Fuente<\/th>\n<th>Dónde crece<\/th>\n<th>Cómo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Miel<\/td>\n<td>Todo el país<\/td>\n<td>Ver <em>Animales: abejas<\/em><\/td>\n<\/tr>\n<tr>\n<td>Remolacha azucarera<\/td>\n<td>Climas templados y fríos (Patagonia, Pampeana)<\/td>\n<td>Lavar, cortar en rodajas finas, hervir 1 hora, prensar en una tela, y reducir el jugo a fuego lento hasta jarabe espeso. 10 kg dan alrededor de 1 kg de jarabe<\/td>\n<\/tr>\n<tr>\n<td>Sorgo dulce<\/td>\n<td>Zonas cálidas y templadas<\/td>\n<td>Exprimir los tallos maduros con un trapiche o maza de madera, hervir el jugo espumando hasta melaza<\/td>\n<\/tr>\n<tr>\n<td>Arrope de uva, tuna o chañar<\/td>\n<td>Cuyo, NOA, Centro<\/td>\n<td>Hervir el jugo de fruta muy madura durante horas, espumando, hasta que quede espeso y oscuro<\/td>\n<\/tr>\n<tr>\n<td>Fruta seca<\/td>\n<td>Todo el país<\/td>\n<td>Higos, pasas, ciruelas, orejones <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"3\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 4<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Herramientas de labranza [AÑOS]","h":"<h3>Herramientas de labranza <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p><strong>Herramientas manuales básicas por familia:<\/strong> pala ancha, pala de punta, azada, horquilla de 4 dientes, rastrillo, guadaña, hoz, carretilla, piedra de afilar. Comprar repuestos de cabo ahora.<\/p>\n<p><strong>Guadaña:<\/strong> corta pasto y cereal rápido si está bien afilada. Se mueve con el giro de la cintura, no con los brazos, con la hoja paralela al suelo y rozando. Se afila cada media hora con piedra.<\/p>\n<p>Animales de tiro (caballo, burro, bueyes) <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"6\" data-s=\"0\">cap. 7<\/a>.<\/p>"}]},{"t":"Frutales y frutos secos","s":[{"t":"","h":"<p>Un frutal plantado hoy da fruta durante treinta años o más, pero tarda de tres a cinco en empezar: se planta el primer invierno, no cuando ya hace falta. En el Alto Valle la ventaja es enorme: hay chacras, viveros y gente que sabe de manzanas y peras como en pocos lugares del mundo.<\/p>"},{"t":"Qué frutales elegir [AÑOS]","h":"<h3>Qué frutales elegir <span class=\"b anos\">AÑOS<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th>Frutal<\/th>\n<th>Empieza a producir<\/th>\n<th>Distancia de plantación<\/th>\n<th>Cosecha (Patagonia Norte)<\/th>\n<th>Comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Manzano<\/td>\n<td>3 a 5 años<\/td>\n<td>4 × 5 m (pie vigoroso)<\/td>\n<td>Febrero a abril<\/td>\n<td>Necesita otra variedad cerca para polinizar. Las tardías se guardan meses<\/td>\n<\/tr>\n<tr>\n<td>Peral<\/td>\n<td>4 a 6 años<\/td>\n<td>4 × 5 m<\/td>\n<td>Enero a marzo<\/td>\n<td>También pide polinizador. Cosechar firme y madurar adentro<\/td>\n<\/tr>\n<tr>\n<td>Membrillo<\/td>\n<td>3 a 4 años<\/td>\n<td>4 × 4 m<\/td>\n<td>Marzo a abril<\/td>\n<td>Muy rústico; dulce, jalea y pectina para mermeladas. Se multiplica por estaca<\/td>\n<\/tr>\n<tr>\n<td>Durazno y pelón<\/td>\n<td>2 a 3 años<\/td>\n<td>4 × 4 m<\/td>\n<td>Diciembre a marzo<\/td>\n<td>Vida corta (15 a 20 años); muy sensible a las heladas tardías en flor<\/td>\n<\/tr>\n<tr>\n<td>Ciruelo<\/td>\n<td>3 a 4 años<\/td>\n<td>4 × 5 m<\/td>\n<td>Enero a marzo<\/td>\n<td>Ciruela seca: el mejor dulce natural<\/td>\n<\/tr>\n<tr>\n<td>Damasco<\/td>\n<td>3 a 4 años<\/td>\n<td>5 × 5 m<\/td>\n<td>Diciembre a enero<\/td>\n<td>Florece muy temprano: la helada se lleva la cosecha muchos años<\/td>\n<\/tr>\n<tr>\n<td>Cerezo<\/td>\n<td>4 a 6 años<\/td>\n<td>5 × 5 m<\/td>\n<td>Noviembre a diciembre<\/td>\n<td>Pide polinizador y protección de los pájaros<\/td>\n<\/tr>\n<tr>\n<td>Vid<\/td>\n<td>2 a 3 años<\/td>\n<td>1,5 m en hilera, o parral<\/td>\n<td>Febrero a abril<\/td>\n<td>Uva, pasas, jugo, vino y vinagre. Se multiplica por estaca<\/td>\n<\/tr>\n<tr>\n<td>Higuera<\/td>\n<td>2 a 3 años<\/td>\n<td>Contra una pared al norte<\/td>\n<td>Enero a marzo<\/td>\n<td>Sufre con heladas fuertes; protegerla de joven. Higos secos<\/td>\n<\/tr>\n<tr>\n<td>Nogal<\/td>\n<td>6 a 8 años (injertado, menos)<\/td>\n<td>10 × 10 m<\/td>\n<td>Marzo a abril<\/td>\n<td>Nuez: grasa, proteína y omega 3. Árbol grande<\/td>\n<\/tr>\n<tr>\n<td>Almendro<\/td>\n<td>3 a 4 años<\/td>\n<td>5 × 6 m<\/td>\n<td>Febrero a marzo<\/td>\n<td>Florece muy temprano: plantarlo en el lugar menos helador<\/td>\n<\/tr>\n<tr>\n<td>Avellano<\/td>\n<td>4 a 5 años<\/td>\n<td>4 × 4 m<\/td>\n<td>Marzo<\/td>\n<td>Prefiere zonas más húmedas y frescas<\/td>\n<\/tr>\n<tr>\n<td>Frutilla<\/td>\n<td>Al año<\/td>\n<td>30 × 40 cm<\/td>\n<td>Noviembre a enero<\/td>\n<td>Se multiplica por estolones; renovar cada 3 años<\/td>\n<\/tr>\n<tr>\n<td>Frambuesa, zarzamora sin espinas, grosella, corinto, sauco<\/td>\n<td>1 a 2 años<\/td>\n<td>1 m en hilera<\/td>\n<td>Diciembre a febrero<\/td>\n<td>Rinden en poco espacio; mermeladas y jugos<\/td>\n<\/tr>\n<tr>\n<td>Rosa mosqueta<\/td>\n<td>2 años<\/td>\n<td>Cerco<\/td>\n<td>Marzo a mayo<\/td>\n<td>Cerco vivo con espinas y vitamina C <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"3\" data-s=\"0\">Nutrición §3<\/a><\/td>\n<\/tr>\n<tr>\n<td>Olivo<\/td>\n<td>4 a 5 años<\/td>\n<td>6 × 6 m<\/td>\n<td>Abril a junio<\/td>\n<td>En Cuyo, NOA y zonas templadas sin heladas fuertes<\/td>\n<\/tr>\n<tr>\n<td>Cítricos<\/td>\n<td>3 a 4 años<\/td>\n<td>5 × 5 m<\/td>\n<td>Otoño e invierno<\/td>\n<td>NEA, NOA, Litoral y zonas sin heladas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Plantar un frutal","h":"<h3>Plantar un frutal<\/h3>\n<ol>\n<li><strong>Cuándo:<\/strong> en pleno invierno, con el árbol sin hojas (junio a agosto), a raíz desnuda o en maceta.<\/li>\n<li><strong>Pozo:<\/strong> de 60 × 60 × 60 cm, separando la tierra de arriba (negra) de la de abajo.<\/li>\n<li>Mezclar la tierra de arriba con dos baldes de compost maduro (nunca estiércol fresco junto a las raíces).<\/li>\n<li>Recortar las raíces rotas, armar un montículo en el fondo y apoyar las raíces abiertas encima.<\/li>\n<li><strong>El injerto<\/strong> (el abultamiento en el tronco) queda 10 cm <strong>por encima<\/strong> del suelo.<\/li>\n<li>Tapar, apretar con el pie, armar una taza alrededor y regar con dos baldes aunque llueva.<\/li>\n<li>Tutor clavado del lado del viento predominante, atado con una tira blanda en forma de ocho.<\/li>\n<li>Recortar la vara a 60 a 80 cm del suelo para que ramifique bajo.<\/li>\n<li>Acolchar el pie y protegerlo de liebres, cabras y gallinas con un tubo de malla.<\/li>\n<\/ol>"},{"t":"Multiplicar sin vivero: estacas e injertos [AÑOS] (54, 56)","h":"<h3>Multiplicar sin vivero: estacas e injertos <span class=\"b anos\">AÑOS<\/span> (54, 56)<\/h3>\n<p><strong>Estacas (56):<\/strong> en invierno, cortar varas de 20 a 25 cm, del grosor de un lápiz, de membrillo, higuera, vid, grosella, sauco, sauce o álamo. Enterrar dos tercios en tierra suelta y mantener húmedo; en primavera brotan. Un vivero de estacas en un cantero sombreado da plantas para toda la comunidad.<\/p>\n<p><strong>Pies para injertar:<\/strong> se obtienen sembrando semillas de manzanas, peras, duraznos o ciruelas criollas en otoño (las de manzana y pera necesitan pasar el invierno en arena húmeda y fría), o de los retoños que salen al pie de los árboles viejos.<\/p>\n<p><strong>Injerto de púa en hendidura (54)<\/strong><\/p>\n<ol>\n<li>A fin de invierno, antes de que broten, cortar púas de 3 o 4 yemas de un árbol sano y bueno. Se pueden guardar unas semanas envueltas en papel húmedo dentro de una bolsa, en el lugar más fresco.<\/li>\n<li>Cortar el pie a 20 cm del suelo y hacerle una hendidura de 4 cm con un cuchillo.<\/li>\n<li>Tallar la base de la púa en cuña de dos caras.<\/li>\n<li>Insertarla de modo que la corteza de la púa coincida con la del pie de un lado: es por ahí que pasa la savia.<\/li>\n<li>Atar firme con cinta o rafia y sellar todo con cera, barro o masilla.<\/li>\n<li>Desatar cuando la púa haya crecido 30 cm.<\/li>\n<\/ol>\n<p><strong>Injerto de yema (escudete):<\/strong> en verano (enero y febrero), con la corteza que se despega fácil. Se saca una yema con un trozo de corteza en forma de escudo, se mete bajo un corte en T del pie y se ata. Rinde más que la púa porque usa una sola yema.<\/p>\n<p><strong>Compatibilidad:<\/strong> manzano sobre manzano; peral sobre peral o membrillo; durazno, ciruelo, damasco y almendro entre sí; cerezo sobre cerezo.<\/p>"},{"t":"Podar [AÑOS] (55)","h":"<h3>Podar <span class=\"b anos\">AÑOS<\/span> (55)<\/h3>\n<ul>\n<li><strong>En invierno<\/strong>, con tijera afilada y limpia (pasarla por alcohol o lavandina diluida entre árboles enfermos y sanos).<\/li>\n<li><strong>Orden:<\/strong> sacar primero lo seco, lo enfermo y lo quebrado; después las ramas que se cruzan o crecen hacia adentro; después los chupones (ramas verticales muy vigorosas).<\/li>\n<li><strong>Forma de vaso<\/strong> para carozos (durazno, ciruelo, damasco): tres o cuatro ramas principales abiertas, centro libre al sol.<\/li>\n<li><strong>Eje central<\/strong> para manzanos y perales: un tronco que sigue hacia arriba con pisos de ramas.<\/li>\n<li>Los manzanos y perales fructifican en ramitas cortas de dos años o más (dardos y lamburdas): no rebajarlos.<\/li>\n<li>Los duraznos fructifican en las ramas del año anterior: renovarlas cada año.<\/li>\n<li>Cortes limpios justo encima de una yema que mire hacia afuera; cortes grandes sellados con cera o pintura al agua.<\/li>\n<\/ul>"},{"t":"Heladas tardías: el gran enemigo","h":"<h3>Heladas tardías: el gran enemigo<\/h3>\n<p>En Patagonia Norte una helada de septiembre u octubre sobre la flor puede llevarse toda la cosecha.<\/p>\n<ul>\n<li>Plantar los frutales que florecen temprano (damasco, almendro, durazno) en la parte más alta del terreno: el aire frío baja y se acumula en los bajos.<\/li>\n<li>La noche anterior a una helada, regar bien el suelo debajo de los árboles.<\/li>\n<li>En árboles chicos: cubrir con tela antihelada o frazadas viejas.<\/li>\n<li>Fuegos de rastrojo o tachos con fuego entre las hileras (como en las chacras antes del riego por aspersión), cuidando el riesgo de incendio.<\/li>\n<\/ul>"},{"t":"Plagas de los frutales","h":"<h3>Plagas de los frutales<\/h3>\n<table>\n<thead>\n<tr>\n<th>Plaga<\/th>\n<th>Señal<\/th>\n<th>Qué hacer sin agroquímicos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Carpocapsa (gusano de la manzana, pera y nuez)<\/td>\n<td>Fruta con agujero y aserrín marrón; fruta caída antes de tiempo<\/td>\n<td>Juntar y destruir todos los días la fruta caída; bandas de cartón corrugado en el tronco desde diciembre, que se sacan y queman cada dos semanas con las larvas adentro; embolsar frutos chicos en bolsitas de papel; gallinas bajo los árboles<\/td>\n<\/tr>\n<tr>\n<td>Pulgones<\/td>\n<td>Hojas enruladas, pegajosas<\/td>\n<td>Agua con jabón blanco; favorecer vaquitas de San Antonio<\/td>\n<\/tr>\n<tr>\n<td>Grafolita (del durazno)<\/td>\n<td>Brotes que se secan en la punta<\/td>\n<td>Cortar y quemar los brotes dañados<\/td>\n<\/tr>\n<tr>\n<td>Pájaros<\/td>\n<td>Fruta picoteada<\/td>\n<td>Redes sobre los árboles chicos, cosechar apenas está lista<\/td>\n<\/tr>\n<tr>\n<td>Hongos (sarna del manzano, torque del durazno)<\/td>\n<td>Manchas, hojas deformadas<\/td>\n<td>Juntar y quemar hojas caídas en otoño; pulverizar caldo bordelés (sulfato de cobre y cal) en invierno, mientras se consiga<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><span class=\"ref\">►<\/span> <strong>Más plagas de los frutales del Alto Valle, aceite de invierno, caldo bordelés y calendario sanitario: cap. 9.<\/strong><\/p>"},{"t":"Frutos secos","h":"<h3>Frutos secos<\/h3>\n<ul>\n<li><strong>Nuez:<\/strong> cosechar cuando la cáscara verde se abre, sacarla (mancha las manos: guantes), lavar y secar a la sombra 2 a 3 semanas. Con cáscara dura un año; pelada, se enrancia en meses.<\/li>\n<li><strong>Almendra:<\/strong> cosechar cuando la cáscara se abre en el árbol, secar al sol y guardar con cáscara.<\/li>\n<li><strong>Piñón y avellana:<\/strong> igual, siempre secos y en lugar fresco.<\/li>\n<li>Los frutos secos son la grasa y el omega 3 de la despensa ovolacto: guardar como semilla las nueces de los mejores árboles.<\/li>\n<\/ul>\n<p>Para secar, hacer dulces y guardar la fruta <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em><\/a>, capítulos 3 a 5.<\/p>"}]},{"t":"Animales: huevos, leche, miel, lana y trabajo","s":[{"t":"","h":"<p>Sin suplementos, los huevos y la leche son la única fuente propia de vitamina B12 de una comunidad ovolactovegetariana <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"3\" data-s=\"0\">Nutrición §3<\/a>; además convierten restos, pasto y bichos en comida, y abonan la huerta. La cría de gallinas y de cabras tiene sus propios manuales en esta biblioteca, mucho más completos que este capítulo: aquí va lo esencial para decidir, y lo que esos manuales no tratan. <span class=\"b vital\">VITAL<\/span><\/p>\n<div class=\"atencion\">\n<p><strong>Una decisión que la comunidad tiene que tomar antes de empezar.<\/strong> La mitad de los pollitos que nacen son machos, y una cabra o una vaca solo dan leche si paren una vez por año. Los manuales de gallinas y de cabras, pensados para una granja común, proponen faenar esos animales. En una comunidad ovolactovegetariana las opciones son: incubar solo lo necesario y usar razas autosexantes (la Negra INTA permite separar machos y hembras al nacer por el color), criar pocos machos y castrar los chivos para usarlos como animales de carga y de limpieza de malezas, o intercambiarlos con otras comunidades. Decidirlo antes evita conflictos y hambre después.<\/p>\n<\/div>\n<p><strong>Si la dieta vegetariana se vuelve imposible.<\/strong> Si una crisis muy larga deja a la comunidad sin la proteína y la vitamina B12 que dan las legumbres, los huevos y la leche, la cría de conejos para carne es la opción de menor costo y más rápida. Está en un manual aparte, <a class=\"x\" data-b=\"CON\" data-c=\"0\" data-s=\"0\"><em>Conejos: cría de último recurso<\/em><\/a>, pensado para usar solo si llega el caso.<\/p>"},{"t":"Gallinas ponedoras: lo esencial [VITAL] (61 a 64)","h":"<h3>Gallinas ponedoras: lo esencial <span class=\"b vital\">VITAL<\/span> (61 a 64)<\/h3>\n<p><span class=\"ref\">►<\/span> Manual completo de cría de gallinas ponedoras: planificación, razas, gallinero, recría, alimentación, sanidad, incubación, planillas.<\/p>\n<ul>\n<li><strong>Cuántas:<\/strong> para un huevo diario por persona todo el año, contando la baja del invierno y de las gallinas viejas, 4 a 6 gallinas por persona <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"6\" data-s=\"0\">Nutrición §6<\/a>.<\/li>\n<li><strong>Raza:<\/strong> las ponedoras del ProHuerta (Negra y Rubia INTA) y las criollas o camperas, más rústicas que las híbridas de granja. Las criollas se encluecan e incuban solas: tener algunas.<\/li>\n<li><strong>Gallinero:<\/strong> seco, cerrado de noche contra zorros, comadrejas y perros, con ponederos oscuros, palos para dormir y un rincón de tierra con ceniza para el baño de tierra.<\/li>\n<li><strong>Comida sin balanceado comprado:<\/strong> ver la tabla de abajo. Calcio a voluntad (cáscara de huevo secada al horno y molida, o conchilla).<\/li>\n<li><strong>Pocas horas de luz en invierno = pocos huevos.<\/strong> Es normal; los huevos del verano se guardan en agua de cal <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"4\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 5<\/a>.<\/li>\n<li><strong>Gallinas que dejaron de poner (64):<\/strong> siguen comiendo bichos y caracoles, dan abono, crían pollitos y avisan de los predadores. Sueltas en el monte frutal y en la huerta en descanso compiten menos por grano. El total de aves lo tiene que poder alimentar la comunidad: planificar la incubación con eso en mente.<\/li>\n<\/ul>\n<p><strong>Alimento casero para aves (69, 75)<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Ingrediente<\/th>\n<th>Proporción aproximada<\/th>\n<th>Aporta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Maíz partido<\/td>\n<td>50 %<\/td>\n<td>Energía<\/td>\n<\/tr>\n<tr>\n<td>Trigo, avena o cebada<\/td>\n<td>20 %<\/td>\n<td>Energía<\/td>\n<\/tr>\n<tr>\n<td>Torta de girasol (lo que queda al prensar aceite) o legumbres <strong>cocidas<\/strong><\/td>\n<td>20 %<\/td>\n<td>Proteína<\/td>\n<\/tr>\n<tr>\n<td>Salvado<\/td>\n<td>10 %<\/td>\n<td>Fibra<\/td>\n<\/tr>\n<tr>\n<td>Verde picado, restos de huerta, lombrices, insectos<\/td>\n<td>A voluntad<\/td>\n<td>Vitaminas y proteína<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las legumbres crudas son tóxicas para las aves: siempre cocidas. Sin harinas de carne ni de pescado. Las lombrices de una lombricera son el mejor suplemento de proteína, sobre todo para pollitos.<\/p>"},{"t":"Codornices [MEJORA] (68)","h":"<h3>Codornices <span class=\"b mejora\">MEJORA<\/span> (68)<\/h3>\n<p>Ponen a las 6 o 7 semanas de nacidas, entre 250 y 300 huevos por año, y comen apenas 25 a 30 g por día. Ideales en espacios chicos o en ciudad, y como respaldo si se pierde el gallinero.<\/p>\n<ul>\n<li>Jaulas con piso de malla inclinado para que el huevo ruede, 150 a 200 cm² por ave, bajo techo y sin corrientes.<\/li>\n<li>Alimento con más proteína que las gallinas (alrededor de 24 %): más legumbre cocida, torta de girasol o lombrices.<\/li>\n<li>5 huevos de codorniz equivalen aproximadamente a 1 de gallina.<\/li>\n<li>Rara vez se encluecan: se incuban en incubadora, 17 a 18 días a 37,5 °C.<\/li>\n<li>Ponen mejor con 14 a 16 horas de luz: sin electricidad, la postura baja en invierno igual que en las gallinas.<\/li>\n<\/ul>"},{"t":"Cabras lecheras: lo esencial [VITAL] (67)","h":"<h3>Cabras lecheras: lo esencial <span class=\"b vital\">VITAL<\/span> (67)<\/h3>\n<p><span class=\"ref\">►<\/span> Cabras lecheras y queso: guía práctica completa: razas, instalaciones, alimentación, parto, chivitos, ordeñe, sanidad, leche segura, quesería y recetas.<\/p>\n<ul>\n<li><strong>Nunca una sola:<\/strong> son animales de manada. Mínimo dos.<\/li>\n<li><strong>Cuánta leche:<\/strong> de medio litro (criolla) a 3 o 4 litros (Saanen buena) por día en el pico, durante 8 a 10 meses.<\/li>\n<li><strong>Compromiso:<\/strong> se ordeña cada 12 horas todos los días; un solo ordeñe diario es posible perdiendo 20 a 30 % de leche.<\/li>\n<li><strong>Cerco alto<\/strong> (1,2 a 1,5 m), refugio seco, sal mineral siempre, pezuñas recortadas cada 2 o 3 meses.<\/li>\n<li><strong>Peligro:<\/strong> nunca soltarlas con hambre en alfalfa húmeda o trébol (se hinchan y mueren en horas); revisar que no haya laurel rosa (adelfa), tejo ni ligustro al alcance.<\/li>\n<li><strong>Leche cruda:<\/strong> puede transmitir brucelosis y tuberculosis. Siempre hervida o pasteurizada <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"8\" data-s=\"0\">Nutrición §8<\/a>.<\/li>\n<li><strong>B12:<\/strong> la leche de cabra tiene mucho menos vitamina B12 que la de vaca <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"3\" data-s=\"0\">Nutrición §3<\/a>.<\/li>\n<\/ul>\n<p><strong>Banco de ordeñe.<\/strong> Ordeñar a la altura de la cintura, con la cabra trabada y comiendo, cuida la espalda y la leche.<\/p>\n<ul>\n<li><strong>Plataforma:<\/strong> de 40 a 50 cm de alto, 1,1 a 1,2 m de largo y 45 a 50 cm de ancho, de tablones de madera dura sin astillas, atornillados.<\/li>\n<li><strong>Cabecera:<\/strong> dos tablas verticales de 1,1 m de alto; una fija y otra que gira en un perno abajo y se traba arriba con un pasador, dejando el espacio del cuello. La cabra mete la cabeza para comer y queda trabada sin lastimarse.<\/li>\n<li><strong>Comedero<\/strong> del otro lado de la cabecera, con la ración del ordeñe: la cabra sube sola cuando aprende que ahí come.<\/li>\n<li><strong>Escalón o rampa<\/strong> en la parte de atrás; un banquito para quien ordeña, a un costado.<\/li>\n<li>Ubicarlo bajo techo, sobre piso que se pueda lavar, y lavarlo después de cada ordeñe.<\/li>\n<\/ul>"},{"t":"Vaca lechera [AÑOS]","h":"<h3>Vaca lechera <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Una vaca da de 10 a 20 litros por día, mucho más que cualquier cabra, y su leche tiene más vitamina B12; pero come 10 a 15 kg de pasto seco o su equivalente por día y bebe 50 litros o más de agua. Tiene sentido entre varias familias, con pastura regada o mucho forraje.<\/p>\n<ul>\n<li><strong>Raza:<\/strong> una cruza lechera rústica (Holando con criolla, Jersey) es más fácil de mantener que una Holando pura de tambo.<\/li>\n<li><strong>Superficie:<\/strong> del orden de media a una hectárea de buena pastura regada por vaca, más fardos para el invierno.<\/li>\n<li><strong>Ordeñe:<\/strong> igual que la cabra pero a mayor escala, dos veces por día. La higiene de la ubre, el balde y el filtrado son lo mismo.<\/li>\n<li><strong>Parto y ternero:<\/strong> la vaca debe parir una vez por año (gestación de unos 9 meses). El ternero puede mamar una parte de la leche (ordeñe con ternero al pie), lo que resuelve el problema de los días en que no se puede ordeñar.<\/li>\n<li><strong>Machos:<\/strong> el mismo dilema que con los chivos; un novillo castrado y amansado es un buey de trabajo (abajo).<\/li>\n<li><strong>Leche segura:<\/strong> hervida o pasteurizada, siempre.<\/li>\n<\/ul>"},{"t":"Ovejas para lana [AÑOS]","h":"<h3>Ovejas para lana <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>La lana se esquila de ovejas vivas una vez por año, en primavera; no requiere faena. Abriga, se hila, se teje, se hace fieltro, y es un producto excelente para intercambiar <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"7\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 8<\/a>.<\/p>\n<ul>\n<li><strong>Raza:<\/strong> Merino y Corriedale son las clásicas de la Patagonia; la Corriedale es más rústica y da lana más gruesa, buena para abrigo.<\/li>\n<li><strong>Cuántas:<\/strong> una oveja da de 3 a 5 kg de vellón sucio por año (la mitad o menos una vez lavado). Con 4 a 6 ovejas hay lana para los abrigos de una familia.<\/li>\n<li><strong>Comida:<\/strong> pasto. Unas 6 a 10 ovejas por hectárea de pastura regada; muchas menos en campo seco.<\/li>\n<li><strong>Cuidados:<\/strong> esquila anual (aprenderla de un esquilador), recorte de pezuñas, desparasitación según el veterinario, y protección de perros sueltos y zorros, que son su principal amenaza.<\/li>\n<li>También dan leche (poca, pero muy rica en grasa) si se las ordeña después del destete del cordero.<\/li>\n<\/ul>"},{"t":"Abejas [AÑOS] (65, 66)","h":"<h3>Abejas <span class=\"b anos\">AÑOS<\/span> (65, 66)<\/h3>\n<p>Una colmena da miel, cera para velas y ungüentos, y poliniza los frutales y la huerta: los rindes de zapallo, tomate y frutales suben mucho con abejas cerca.<\/p>\n<p><strong>Para empezar:<\/strong> comprar uno o dos núcleos a un apicultor de la zona y aprender con él. Equipo: colmena tipo Langstroth, careta, guantes, ahumador, palanca, y un traje claro.<\/p>\n<ul>\n<li><strong>Ubicación:<\/strong> sol de mañana, protegida del viento, con agua cerca, lejos de caminos, de corrales y de donde juegan los chicos.<\/li>\n<li><strong>Manejo:<\/strong> en días de sol, al mediodía, con humo suave en la piquera y movimientos lentos.<\/li>\n<li><strong>Varroa:<\/strong> el ácaro que más colmenas mata en Argentina. Aprender del apicultor a controlarla.<\/li>\n<li><strong>Cosecha (66):<\/strong> solo cuadros con la miel operculada (tapada con cera). En zonas frías dejar a cada colmena 15 a 20 kg de miel para el invierno.<\/li>\n<li><strong>Extraer sin centrífuga:<\/strong> cortar los panales, aplastarlos y dejarlos escurrir en un colador con tela, en lugar tibio y cerrado a las abejas. Lo que queda es cera: se derrite en agua caliente, se deja enfriar y se saca el disco de cera de arriba.<\/li>\n<li><strong>Multiplicar:<\/strong> en primavera, cuando la colmena está fuerte, se divide en dos (con cuadros de cría y abejas en cada mitad); la que queda sin reina cría una nueva.<\/li>\n<li><strong>Nunca dar miel a menores de un año<\/strong> (botulismo infantil).<\/li>\n<\/ul>\n<p><span class=\"ref\">►<\/span> <strong>Todo sobre apicultura en la Patagonia norte: manual <a class=\"x\" data-b=\"ABE\" data-c=\"0\" data-s=\"0\"><em>Abejas y miel<\/em><\/a>.<\/strong><\/p>"},{"t":"Animales de trabajo [AÑOS]","h":"<h3>Animales de trabajo <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Un caballo, un burro, una mula o una yunta de bueyes multiplican por diez la tierra que puede trabajar una persona y el peso que se puede mover, y su trabajo no choca con el criterio ovolacto.<\/p>\n<ul>\n<li>Conseguir animales ya amansados: entrenar uno lleva meses y un animal mal entrenado es peligroso.<\/li>\n<li>El arreo bien ajustado (collera o yugo del tamaño del animal): un arreo mal puesto lastima y el animal deja de tirar.<\/li>\n<li>Herramientas: arado de mancera, rastra de dientes, carro, rastra para troncos.<\/li>\n<li>Un caballo de trabajo necesita alrededor de media hectárea de pastura o el equivalente en fardos, más grano en temporada de trabajo duro. El burro come mucho menos y es más rústico.<\/li>\n<li>Herrar o recortar los cascos según el terreno: buscar a un herrador de la zona.<\/li>\n<li>Buscar a la
