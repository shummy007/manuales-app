gente mayor que aró con caballos o bueyes: es un saber que todavía existe en el campo argentino.<\/li>\n<\/ul>"},{"t":"Perros y gatos que trabajan","h":"<h3>Perros y gatos que trabajan<\/h3>\n<ul>\n<li><strong>Perro guardián:<\/strong> avisa antes que nadie y protege gallineros y majadas. Uno grande come como una persona chica: calcularlo en la despensa (restos de cocina, suero, huevos rotos, legumbres cocidas con grasa).<\/li>\n<li><strong>Gatos:<\/strong> el mejor control de ratas y lauchas en la despensa y el galpón de granos.<\/li>\n<li><strong>Perros sueltos ajenos<\/strong> son la primera causa de muerte de gallinas, ovejas y cabras en zonas pobladas: cercos firmes y acuerdos con los vecinos.<\/li>\n<\/ul>\n<p><strong>Perros asilvestrados:<\/strong> cuando colapsan las ciudades, las jaurías atacan gallinas y cabras. Cómo prevenirlas y qué hacer <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"RIE\" data-c=\"7\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em>, cap. 8<\/a>.<\/p>"},{"t":"Corrales, cercos y salud de los animales [AÑOS] (70, 71)","h":"<h3>Corrales, cercos y salud de los animales <span class=\"b anos\">AÑOS<\/span> (70, 71)<\/h3>\n<ul>\n<li><strong>Postes y alambre:<\/strong> postes de madera dura o eucalipto cada 3 a 5 m, alambre tensado con torniquetes. Revisar el cerco cada semana.<\/li>\n<li><strong>Observar todos los días:<\/strong> un animal que no come, se aísla, tiene los ojos opacos o diarrea, se separa enseguida a un corral aparte.<\/li>\n<li><strong>Parásitos:<\/strong> rotar los corrales para cortar el ciclo; no sobrepoblar.<\/li>\n<li><strong>Heridas:<\/strong> limpiar con agua hervida y jabón, cubrir si hay moscas.<\/li>\n<li><strong>Registro:<\/strong> fecha de nacimiento, partos, enfermedades y producción de cada animal en el cuaderno.<\/li>\n<li><strong>Enfermedades que pasan a las personas:<\/strong> leche cruda, abortos de cabras y vacas, perros con rabia, garrapatas <span class=\"ref\">►<\/span> Manual médico T1 bloque 4 (enfermedades que vienen de animales).<\/li>\n<li>Un veterinario o un productor con experiencia en la comunidad vale más que cualquier manual: buscarlo antes de que haga falta.<\/li>\n<\/ul>\n<p><strong>Cerco eléctrico.<\/strong> Muy útil contra zorros y perros alrededor del gallinero, y para que las cabras no salten.<\/p>\n<ul>\n<li><strong>Equipo:<\/strong> un electrificador (boyero) de 12 voltios a batería con un panel solar chico, alambre liso o cinta electrificada, aisladores en cada poste y una <strong>jabalina de tierra<\/strong> (caño o hierro de 1 a 2 metros clavado en suelo húmedo, unido al electrificador). Sin buena tierra, el cerco no pica.<\/li>\n<li><strong>Altura de los hilos:<\/strong> contra zorros, un hilo a 15 o 20 cm del piso por fuera del tejido del gallinero y otro arriba; para cabras, tres o cuatro hilos a 20, 40, 60 y 90 cm.<\/li>\n<li><strong>Mantenimiento:<\/strong> cortar el pasto debajo (si toca el hilo, descarga), revisar con un probador o con un tallo verde, y cartel visible para los chicos: no mata, pero duele.<\/li>\n<li><strong>Que no dependa de él:<\/strong> el día que la batería falla, el cerco físico tiene que seguir conteniendo. El hilo eléctrico va siempre sobre un cerco que ya aguanta solo.<\/li>\n<li>Los animales aprenden a respetarlo en pocos días; las cabras lo prueban seguido: no dejarlo apagado.<\/li>\n<\/ul>"},{"t":"Reservas de forraje para el invierno: heno y ensilado [AÑOS]","h":"<h3>Reservas de forraje para el invierno: heno y ensilado <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>En invierno casi no crece pasto. Las cabras, la vaca, las ovejas y los conejos comen lo que se guardó en primavera y verano.<\/p>\n<p><strong>Heno: la reserva principal<\/strong><\/p>\n<ol>\n<li>Cortar alfalfa, trébol, avena o pasto <strong>al empezar a florecer<\/strong>, en días secos y con pronóstico de varios días sin lluvia.<\/li>\n<li>Dejarlo extendido al sol y darlo vuelta con horquilla o rastrillo una o dos veces por día, 2 a 4 días.<\/li>\n<li>Está listo cuando los tallos crujen al doblarlos pero las hojas no se caen (la alfalfa se recoge temprano a la mañana, con un poco de rocío, para no perder la hoja).<\/li>\n<li>Guardar bajo techo, sobre tarimas, en parvas o fardos atados. <strong>Heno húmedo se calienta, se enmohece y puede prenderse fuego solo:<\/strong> si al meter la mano en la parva está caliente, desarmarla y volver a secar.<\/li>\n<li><strong>Cuánto:<\/strong> una cabra come en invierno unos 2 kg de heno por día; contar los días sin pasto y sumar un tercio de reserva.<\/li>\n<\/ol>\n<p><strong>Ensilado: solo con cuidado<\/strong><\/p>\n<p>El ensilado es forraje picado y fermentado sin aire, como un chucrut para animales. <strong>El manual de cabras desaconseja hacerlo en escala casera para las cabras lecheras:<\/strong> un ensilado mal hecho transmite listeriosis, que mata cabras y ovejas y pasa a la leche, y trae bacterias que arruinan el queso <span class=\"ref\">►<\/span> Cabras lecheras y queso, alimentación. Por eso, en esta biblioteca la reserva de invierno es el heno. El ensilado queda para cuando no se puede hacer heno (primaveras lluviosas) y para animales que no se ordeñan.<\/p>\n<ul>\n<li><strong>Qué:<\/strong> maíz de planta entera con el grano pastoso, sorgo, o avena y cebada verdes. Picado en trozos de 1 a 2 cm, ni mojado ni seco (al apretar un puñado no gotea).<\/li>\n<li><strong>Cómo:<\/strong> en bolsas de plástico grueso de 50 a 100 litros o en tambores con tapa, de a capas, <strong>apisonando<\/strong> fuerte cada capa para sacar todo el aire; cerrar hermético y guardar a la sombra, lejos de ratas. Se abre a las 4 a 6 semanas y dura un año cerrado.<\/li>\n<li><strong>Solo se da si<\/strong> está verde amarillento y huele ácido agradable, como a chucrut. Con moho, olor a podrido, a amoníaco o a manteca rancia, o barroso: <strong>no darlo<\/strong>.<\/li>\n<li>Abrir de a una bolsa y usarla en uno o dos días; empezar de a poco y no pasar de la mitad de la ración.<\/li>\n<li><strong>Nunca<\/strong> a conejos ni gallinas.<\/li>\n<\/ul>"}]},{"t":"Plantas silvestres comestibles y tóxicas","s":[{"t":"","h":"<p>En el campo, las banquinas y los baldíos de casi todo el país crecen verduras que nadie siembra, y también plantas que matan con un solo bocado. La regla de este capítulo es simple: <strong>solo se come lo que se identificó con total seguridad, mostrado por alguien que lo conoce.<\/strong> <span class=\"b anos\">AÑOS<\/span> (72)<\/p>"},{"t":"Reglas de recolección","h":"<h3>Reglas de recolección<\/h3>\n<ol>\n<li>Identificar cada planta por al menos tres rasgos (hoja, flor, tallo, olor, lugar donde crece), no por una foto ni por uno solo.<\/li>\n<li><strong>Nunca comer plantas silvestres de la familia de la zanahoria y el perejil<\/strong> (flores blancas en forma de paraguas) salvo con un experto al lado: ahí está la cicuta.<\/li>\n<li>Desconfiar de toda planta con látex blanco (leche al cortarla), salvo las que se conocen bien (diente de león, cerraja).<\/li>\n<li>Que un animal la coma no quiere decir que sea segura para personas.<\/li>\n<li>La \"prueba universal de comestibilidad\" que aparece en manuales de supervivencia (frotar, probar de a poco) no es segura con plantas muy tóxicas: no usarla.<\/li>\n<li>No juntar al borde de rutas (plomo y combustibles), en chacras fumigadas, en zanjas con aguas servidas ni cerca de basurales.<\/li>\n<li><strong>No recolectar hongos silvestres.<\/strong> En Argentina crece la <em>Amanita phalloides<\/em> (en bosques de pinos y robles, parques y plazas), que causa muertes cada año y se confunde con hongos comestibles.<\/li>\n<li>Probar una planta nueva en poca cantidad la primera vez, aunque se sepa que es comestible.<\/li>\n<\/ol>"},{"t":"Comestibles comunes","h":"<h3>Comestibles comunes<\/h3>\n<table>\n<thead>\n<tr>\n<th>Planta<\/th>\n<th>Dónde crece<\/th>\n<th>Qué se come y cómo<\/th>\n<th>Cuidado con<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Verdolaga<\/td>\n<td>Todo el país, huertas y veredas<\/td>\n<td>Hojas y tallos crudos o cocidos<\/td>\n<td>Las lechetreznas (<em>Euphorbia<\/em>), parecidas y rastreras, largan leche blanca al cortarlas: la verdolaga no<\/td>\n<\/tr>\n<tr>\n<td>Diente de león y achicoria silvestre<\/td>\n<td>Todo el país<\/td>\n<td>Hojas jóvenes crudas o hervidas, flores, raíz tostada como café<\/td>\n<td>Amargas en verano: hervir y tirar la primera agua<\/td>\n<\/tr>\n<tr>\n<td>Cerraja<\/td>\n<td>Todo el país<\/td>\n<td>Hojas tiernas crudas o hervidas<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Malva<\/td>\n<td>Todo el país<\/td>\n<td>Hojas y flores en sopas y guisos<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Ortiga<\/td>\n<td>Todo el país, lugares húmedos<\/td>\n<td>Hojas tiernas hervidas (pierden lo urticante)<\/td>\n<td>Juntar con guantes<\/td>\n<\/tr>\n<tr>\n<td>Yuyo colorado y quinoa blanca (amaranto y quenopodio)<\/td>\n<td>Todo el país, huertas y campos<\/td>\n<td>Hojas como espinaca, hervidas; semillas como cereal<\/td>\n<td>Tienen oxalatos: hervir y tirar el agua; no comer crudas en cantidad<\/td>\n<\/tr>\n<tr>\n<td>Llantén<\/td>\n<td>Todo el país<\/td>\n<td>Hojas tiernas hervidas<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Berro<\/td>\n<td>Arroyos y acequias de agua limpia<\/td>\n<td>Hojas<\/td>\n<td>Puede transmitir parásitos si el agua pasa por campos con ganado: cocinarlo<\/td>\n<\/tr>\n<tr>\n<td>Cardo de Castilla<\/td>\n<td>Región pampeana y otras<\/td>\n<td>Pencas (tallos de las hojas) peladas y hervidas; flores como cuajo<\/td>\n<td>Espinas: guantes<\/td>\n<\/tr>\n<tr>\n<td>Tuna (nopal)<\/td>\n<td>Centro, Cuyo, NOA<\/td>\n<td>Frutos pelados; pencas tiernas sin espinas, hervidas<\/td>\n<td>Las espinitas finas de la cáscara: pelar con guantes o pasar por el fuego<\/td>\n<\/tr>\n<tr>\n<td>Moras y zarzamora<\/td>\n<td>Todo el país<\/td>\n<td>Frutos maduros<\/td>\n<td>Espinas<\/td>\n<\/tr>\n<tr>\n<td>Rosa mosqueta<\/td>\n<td>Patagonia andina y valles<\/td>\n<td>Frutos en té, mermelada, secos<\/td>\n<td>Sacar semillas y pelos internos (irritan)<\/td>\n<\/tr>\n<tr>\n<td>Calafate<\/td>\n<td>Patagonia<\/td>\n<td>Frutos azulados<\/td>\n<td>Espinas<\/td>\n<\/tr>\n<tr>\n<td>Maqui<\/td>\n<td>Bosque andino patagónico<\/td>\n<td>Frutos oscuros<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Piñón de araucaria<\/td>\n<td>Neuquén, zona andina<\/td>\n<td>Semillas hervidas o asadas, harina<\/td>\n<td>Respetar los derechos y las normas de recolección de las comunidades mapuche y de los parques<\/td>\n<\/tr>\n<tr>\n<td>Algarrobo blanco y negro<\/td>\n<td>Chaco, NOA, Cuyo, Centro, norte de Patagonia<\/td>\n<td>Vainas maduras secas: harina (patay), bebida (añapa)<\/td>\n<td>Juntarlas del árbol o del suelo seco, sin moho<\/td>\n<\/tr>\n<tr>\n<td>Chañar<\/td>\n<td>Centro, NOA, Cuyo, norte de Patagonia<\/td>\n<td>Frutos maduros, arrope<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Mistol<\/td>\n<td>Chaco, NOA<\/td>\n<td>Frutos, arrope, harina<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Totora (<em>Typha<\/em>)<\/td>\n<td>Bañados y lagunas<\/td>\n<td>Brotes tiernos, base blanca de los tallos, rizomas (harina)<\/td>\n<td>Solo de aguas limpias<\/td>\n<\/tr>\n<tr>\n<td>Vinagrillo (<em>Oxalis<\/em>)<\/td>\n<td>Todo el país<\/td>\n<td>Hojas y flores en ensalada<\/td>\n<td>Poca cantidad (oxalatos)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Plantas tóxicas que hay que enseñar a reconocer a todos","h":"<h3>Plantas tóxicas que hay que enseñar a reconocer a todos<\/h3>\n<table>\n<thead>\n<tr>\n<th>Planta<\/th>\n<th>Cómo es<\/th>\n<th>Peligro<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cicuta (<em>Conium maculatum<\/em>)<\/td>\n<td>Hasta 2 m, tallo con manchas violetas, flores blancas en paraguas, olor fuerte desagradable al estrujarla<\/td>\n<td><strong>Mortal.<\/strong> Se confunde con hinojo, perejil y zanahoria silvestre<\/td>\n<\/tr>\n<tr>\n<td>Chamico (<em>Datura<\/em>)<\/td>\n<td>Flor grande blanca o violeta en trompeta, fruto espinoso con muchas semillas negras<\/td>\n<td>Muy tóxico, todas sus partes<\/td>\n<\/tr>\n<tr>\n<td>Ricino<\/td>\n<td>Arbusto de hojas grandes en forma de mano, frutos espinosos con semillas jaspeadas<\/td>\n<td>Las semillas pueden matar<\/td>\n<\/tr>\n<tr>\n<td>Laurel de jardín (adelfa)<\/td>\n<td>Arbusto ornamental de hojas largas y duras, flores rosas, blancas o rojas<\/td>\n<td>Mortal: hojas, flores, y el humo al quemarlo. No usar sus ramas como pinchos para cocinar<\/td>\n<\/tr>\n<tr>\n<td>Duraznillo negro (<em>Cestrum parqui<\/em>)<\/td>\n<td>Arbusto de olor feo, flores amarillo verdosas en racimos, frutitos negros<\/td>\n<td>Tóxico para personas y ganado<\/td>\n<\/tr>\n<tr>\n<td>Tabaco cimarrón (<em>Nicotiana glauca<\/em>)<\/td>\n<td>Arbusto o arbolito de hojas gris azuladas, flores tubulares amarillas<\/td>\n<td>Hubo intoxicaciones graves por confundir sus hojas con verduras<\/td>\n<\/tr>\n<tr>\n<td>Tejo<\/td>\n<td>Ornamental de hojas como agujas planas, frutos rojos<\/td>\n<td>Hojas y semillas mortales<\/td>\n<\/tr>\n<tr>\n<td>Saüo<\/td>\n<td>Arbusto de flores blancas en ramos planos, frutos negros<\/td>\n<td>Frutos verdes, hojas y tallos tóxicos; los frutos maduros solo cocidos<\/td>\n<\/tr>\n<tr>\n<td>Hongos silvestres<\/td>\n<td>—<\/td>\n<td>Ver regla 7: no recolectar<\/td>\n<\/tr>\n<tr>\n<td>Papa verde o brotada<\/td>\n<td>Partes verdes y brotes de la papa<\/td>\n<td>Cortarlas y tirarlas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Enseñarles a los chicos","h":"<h3>Enseñarles a los chicos<\/h3>\n<ul>\n<li>No comer nada del campo, del jardín ni de la plaza sin mostrarlo antes a un adulto.<\/li>\n<li>Salidas de reconocimiento en familia: buscar juntos las plantas buenas y las peligrosas, nombrarlas, dibujarlas en un cuaderno.<\/li>\n<li>Las plantas tóxicas que crecen cerca de la casa o de la escuela, arrancarlas con guantes y quemarlas lejos (salvo la adelfa: enterrarla).<\/li>\n<\/ul>\n<p>Para aprender bien, sumarse a salidas con botánicos, guardaparques, huerteros del INTA o personas mayores del lugar que conocen el monte: ningún cuadro reemplaza ver la planta viva.<\/p>\n<p>Para profundizar: <em>Malezas comestibles del Cono Sur<\/em> (Rapoport, Marzocca y Drausal, INTA), con 237 especies <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"9\" data-s=\"0\">Nutrición §9<\/a>. Plantas medicinales y tabla completa de plantas tóxicas que se confunden <span class=\"ref\">►<\/span> Manual médico T2 bloque 17 y 17.6.<\/p>"}]},{"t":"Plagas y enfermedades de la huerta y los frutales","s":[{"t":"","h":"<p>Sin agroquímicos comprados, la sanidad de la huerta se sostiene con cuatro cosas: <strong>mirar todos los días, cortar el problema cuando es chico, cuidar a los insectos que comen plagas y tener un suelo vivo.<\/strong> Los venenos de amplio espectro matan también a esos aliados y, a la temporada siguiente, la plaga vuelve más fuerte.<\/p>\n<p>Este capítulo junta todo lo de plagas y enfermedades: la tabla de remedios caseros del cap. 1 y la de frutales del cap. 6 lo resumen; acá está el detalle. Las plagas de la casa (cucarachas, chinches, polillas de la ropa) están en <a class=\"x\" data-b=\"CAS\" data-c=\"1\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 2<\/a>; las de la despensa, en <a class=\"x\" data-b=\"DES\" data-c=\"4\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 5<\/a>; las de los animales, en sus manuales.<\/p>"},{"t":"Primero, saber qué es: tabla de síntomas [VITAL]","h":"<h3>Primero, saber qué es: tabla de síntomas <span class=\"b vital\">VITAL<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th>Lo que se ve<\/th>\n<th>Lo más probable<\/th>\n<th>Ver<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Plantitas recién trasplantadas cortadas al ras del suelo, de noche<\/td>\n<td>Gusano cortador o grillo topo<\/td>\n<td>Gusanos cortadores<\/td>\n<\/tr>\n<tr>\n<td>Hojas comidas con agujeros y rastro brillante<\/td>\n<td>Caracoles y babosas<\/td>\n<td>cap. 1, tabla de plagas<\/td>\n<\/tr>\n<tr>\n<td>Hojas de coles comidas hasta las nervaduras<\/td>\n<td>Orugas de la mariposa de la col<\/td>\n<td>cap. 1, plagas de las coles<\/td>\n<\/tr>\n<tr>\n<td>Hojas enruladas, pegajosas, con bichitos verdes, negros o grises<\/td>\n<td>Pulgón<\/td>\n<td>Pulgones<\/td>\n<\/tr>\n<tr>\n<td>Nubecita blanca al mover la planta<\/td>\n<td>Mosca blanca<\/td>\n<td>Mosca blanca<\/td>\n<\/tr>\n<tr>\n<td>Hojas punteadas de amarillo, con telita fina debajo, en verano seco<\/td>\n<td>Arañuela<\/td>\n<td>Arañuelas<\/td>\n<\/tr>\n<tr>\n<td>Hojas plateadas o con manchitas blancas, puntos negros (cebolla, poroto, tomate)<\/td>\n<td>Trips<\/td>\n<td>Trips<\/td>\n<\/tr>\n<tr>\n<td>Galerías transparentes en las hojas del tomate, frutos agujereados<\/td>\n<td>Polilla del tomate<\/td>\n<td>Polilla del tomate<\/td>\n<\/tr>\n<tr>\n<td>Manchas marrones grandes con borde claro en hojas de papa y tomate, tras lluvia o rocío<\/td>\n<td>Tizón (peronóspora)<\/td>\n<td>Hongos<\/td>\n<\/tr>\n<tr>\n<td>Polvillo blanco sobre las hojas<\/td>\n<td>Oídio<\/td>\n<td>Hongos<\/td>\n<\/tr>\n<tr>\n<td>Pústulas color óxido en hojas de poroto o ajo<\/td>\n<td>Roya<\/td>\n<td>Hongos<\/td>\n<\/tr>\n<tr>\n<td>Plantines que se doblan en la base y mueren en el almácigo<\/td>\n<td>Mal de los almácigos<\/td>\n<td>Hongos<\/td>\n<\/tr>\n<tr>\n<td>Tomate o pimiento con mancha negra y seca en la punta<\/td>\n<td>Podredumbre apical (no es plaga)<\/td>\n<td>Problemas que no son plagas<\/td>\n<\/tr>\n<tr>\n<td>Raíces con bultos como cuentas, plantas que se marchitan con el suelo húmedo<\/td>\n<td>Nematodos<\/td>\n<td>Nematodos<\/td>\n<\/tr>\n<tr>\n<td>Hojas viejas amarillas parejas<\/td>\n<td>Falta de nitrógeno<\/td>\n<td>Carencias<\/td>\n<\/tr>\n<tr>\n<td>Hojas nuevas amarillas con nervaduras verdes (durazno, peral, frutilla)<\/td>\n<td>Falta de hierro (clorosis)<\/td>\n<td>Carencias<\/td>\n<\/tr>\n<tr>\n<td>Manzana o pera con agujero y aserrín marrón<\/td>\n<td>Carpocapsa<\/td>\n<td>Frutales<\/td>\n<\/tr>\n<tr>\n<td>Brote de durazno seco en la punta<\/td>\n<td>Grafolita<\/td>\n<td>Frutales<\/td>\n<\/tr>\n<tr>\n<td>Ramas con costras grises chicas, como escamas<\/td>\n<td>Cochinilla o piojo de San José<\/td>\n<td>Frutales<\/td>\n<\/tr>\n<tr>\n<td>Hojas del peral pegajosas y negras (fumagina)<\/td>\n<td>Psílido del peral<\/td>\n<td>Frutales<\/td>\n<\/tr>\n<tr>\n<td>Masas algodonosas blancas en ramas y raíces del manzano<\/td>\n<td>Pulgón lanígero<\/td>\n<td>Frutales<\/td>\n<\/tr>\n<tr>\n<td>Canteros con montículos de tierra y raíces comidas<\/td>\n<td>Tuco-tuco o cuis<\/td>\n<td>Roedores<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cuando no se sabe qué es:<\/strong> sacar una hoja o una planta enferma, meterla en un frasco, y recorrer la huerta de noche con linterna: muchas plagas comen de noche. Anotar en el cuaderno qué se vio, cuándo y qué se hizo.<\/p>"},{"t":"Los aliados: control biológico [VITAL]","h":"<h3>Los aliados: control biológico <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Una huerta con flores todo el año y sin venenos tiene más bichos que comen plagas que plagas.<\/p>\n<table>\n<thead>\n<tr>\n<th>Aliado<\/th>\n<th>Qué come<\/th>\n<th>Cómo atraerlo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vaquitas de San Antonio (mariquitas) y sus larvas (alargadas, oscuras con manchas naranjas)<\/td>\n<td>Pulgones, cochinillas, arañuelas<\/td>\n<td>No fumigar; dejar algunas plantas con pulgón como \"criadero\" en un rincón<\/td>\n<\/tr>\n<tr>\n<td>Crisopas (bichitos verdes de alas transparentes)<\/td>\n<td>Pulgones, mosca blanca, huevos de polillas<\/td>\n<td>Flores de hinojo, eneldo, cilantro, zanahoria en flor<\/td>\n<\/tr>\n<tr>\n<td>Sírfidos (moscas rayadas que se quedan quietas en el aire)<\/td>\n<td>Sus larvas comen pulgones<\/td>\n<td>Flores chicas: caléndula, aliso de mar, facelia, mostaza<\/td>\n<\/tr>\n<tr>\n<td>Avispitas parasitoides (chicas, no pican)<\/td>\n<td>Ponen huevos dentro de pulgones, orugas y larvas de carpocapsa<\/td>\n<td>Flores de umbelíferas; pulgones \"momificados\" (hinchados, dorados) son señal de que están trabajando: no sacarlos<\/td>\n<\/tr>\n<tr>\n<td>Arañas y chinches predatoras<\/td>\n<td>De todo<\/td>\n<td>Acolchado y rincones sin limpiar<\/td>\n<\/tr>\n<tr>\n<td>Sapos, lagartijas, aves insectívoras<\/td>\n<td>Babosas, orugas, insectos<\/td>\n<td>Un charquito o un balde enterrado con agua, piedras, cercos vivos, cajas nido para golondrinas y horneros<\/td>\n<\/tr>\n<tr>\n<td>Gallinas<\/td>\n<td>Orugas, babosas, larvas del suelo, fruta caída con carpocapsa<\/td>\n<td>Sueltas en la huerta solo después de la cosecha o bajo los frutales <span class=\"ref\">►<\/span> Manual de gallinas ponedoras<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Regla:<\/strong> antes de aplicar cualquier preparado, mirar si ya hay aliados trabajando. Si los hay, esperar unos días.<\/p>"},{"t":"Preparados caseros: recetas y dosis [AÑOS]","h":"<h3>Preparados caseros: recetas y dosis <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Siempre: probar primero en una planta y esperar 2 días; aplicar al atardecer, nunca a pleno sol ni con más de 30 °C; mojar bien el revés de las hojas; repetir cada 5 a 7 días mientras haga falta. Guantes y anteojos con los que llevan cobre, azufre o cal.<\/p>\n<table>\n<thead>\n<tr>\n<th>Preparado<\/th>\n<th>Cómo se hace<\/th>\n<th>Para qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Agua con jabón<\/strong><\/td>\n<td>10 a 20 g de jabón blanco de lavar rallado (no detergente) por litro de agua tibia<\/td>\n<td>Pulgón, mosca blanca, cochinilla joven, arañuela<\/td>\n<\/tr>\n<tr>\n<td><strong>Aceite emulsionado de verano<\/strong><\/td>\n<td>10 ml de aceite vegetal + 5 g de jabón rallado por litro, batido<\/td>\n<td>Pulgón, mosca blanca, arañuela, cochinilla. Nunca con calor ni sobre plantas estresadas<\/td>\n<\/tr>\n<tr>\n<td><strong>Aceite de invierno<\/strong> (frutales sin hojas)<\/td>\n<td>25 ml de aceite (mineral o vegetal) por litro de agua, con jabón para emulsionar<\/td>\n<td>Huevos de arañuela, piojo de San José, cochinillas y psílido, sobre el tronco y las ramas, en julio y agosto, antes de que hinchen las yemas<\/td>\n<\/tr>\n<tr>\n<td><strong>Purín de ortiga<\/strong><\/td>\n<td>1 kg de ortiga picada en 10 l de agua, fermentar 7 a 14 días; usar diluido 1 en 10<\/td>\n<td>Fortalece la planta; insectos chupadores<\/td>\n<\/tr>\n<tr>\n<td><strong>Macerado de ajo<\/strong><\/td>\n<td>100 g de ajo machacado en 1 l de agua 24 h, colar, diluir 1 en 10<\/td>\n<td>Hongos e insectos<\/td>\n<\/tr>\n<tr>\n<td><strong>Leche<\/strong><\/td>\n<td>1 parte de leche en 9 de agua, con sol<\/td>\n<td>Oídio<\/td>\n<\/tr>\n<tr>\n<td><strong>Bicarbonato<\/strong><\/td>\n<td>5 g (una cucharadita) de bicarbonato + 5 g de jabón por litro<\/td>\n<td>Oídio y otros hongos de hoja, preventivo<\/td>\n<\/tr>\n<tr>\n<td><strong>Azufre en polvo<\/strong><\/td>\n<td>Espolvorear fino sobre las hojas húmedas de rocío, o 5 g de azufre mojable por litro<\/td>\n<td>Oídio, arañuela. <strong>No con más de 30 °C<\/strong> (quema las hojas) ni junto con aceite<\/td>\n<\/tr>\n<tr>\n<td><strong>Caldo bordelés al 1 %<\/strong><\/td>\n<td>100 g de sulfato de cobre disueltos en 5 l de agua (en balde de plástico) y 100 g de cal disuelta en otros 5 l; volcar el cobre sobre la cal, nunca al revés. Un clavo limpio sumergido 1 minuto no tiene que quedar cobrizo; si queda, agregar cal<\/td>\n<td>Tizón, roya, torque del durazno, sarna del manzano. Preventivo: antes de las lluvias y en invierno sobre frutales. Usar en el día. Mucho cobre envenena el suelo: no más de 3 o 4 aplicaciones por año<\/td>\n<\/tr>\n<tr>\n<td><strong>Ceniza de leña<\/strong><\/td>\n<td>Espolvorear seca alrededor de las plantas<\/td>\n<td>Barrera contra babosas y gusanos; cuando se moja deja de servir<\/td>\n<\/tr>\n<tr>\n<td><strong>Tierra de diatomeas<\/strong><\/td>\n<td>Polvo fino espolvoreado seco<\/td>\n<td>Babosas, hormigas, pulgones, chinches; no respirar el polvo<\/td>\n<\/tr>\n<tr>\n<td><strong>Bacillus thuringiensis (Bt)<\/strong><\/td>\n<td>Comprado en agronomías, según la etiqueta<\/td>\n<td>Solo orugas: de la col, polilla del tomate, gusano del choclo. Inofensivo para personas, animales y abejas: tener un frasco guardado<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>No usar<\/strong> tabaco hervido ni frutos de paraíso: son venenos fuertes para personas y animales, y matan a los aliados.<\/p>"},{"t":"Gusanos cortadores y grillo topo [VITAL]","h":"<h3>Gusanos cortadores y grillo topo <span class=\"b vital\">VITAL<\/span><\/h3>\n<ul>\n<li><strong>Gusano cortador:<\/strong> oruga gris o marrón, gorda, que se enrolla al tocarla; de día está enterrada a 2 o 3 cm junto a la planta cortada. <strong>Qué hacer:<\/strong> a la mañana, escarbar alrededor de la planta cortada y sacarlo; recorrer con linterna de noche; poner un <strong>collar de cartón o de botella<\/strong> de 5 cm de alto alrededor de cada plantín trasplantado, enterrado 2 cm; Bt en el suelo húmedo al atardecer.<\/li>\n<li><strong>Grillo topo:<\/strong> insecto marrón con patas delanteras de topo que hace galerías y corta raíces. <strong>Qué hacer:<\/strong> echar agua con jabón (un balde con 50 g de jabón) en la boca de la galería: sale a la superficie y se junta; trampas de frascos enterrados al ras con un poco de agua; las gallinas los buscan cuando se remueve la tierra.<\/li>\n<\/ul>"},{"t":"Tucuras y langostas","h":"<h3>Tucuras y langostas<\/h3>\n<p>En la meseta y las bardas de Río Negro hay años de explosión de <strong>tucuras<\/strong> (saltamontes): bajan a las chacras y comen todo lo verde. La <strong>langosta voladora<\/strong> viaja en mangas desde el norte del país y llega rara vez a la Patagonia.<\/p>\n<ul>\n<li><strong>Otoño e invierno:<\/strong> las tucuras ponen los huevos en paquetes bajo tierra, en suelos duros y banquinas. Remover la tierra en esos lugares los expone al frío y a los pájaros.<\/li>\n<li><strong>Primavera:<\/strong> las crías saltan pero no vuelan. Es el momento de controlarlas: <strong>gallinas, pavos y patos<\/strong> sueltos en los bordes de la huerta se comen miles; barreras de nylon de 50 cm con una zanja al pie donde caen y se juntan; recolección a mano o con una red a la mañana temprano, cuando el frío las tiene lentas.<\/li>\n<li><strong>Proteger lo más valioso:<\/strong> tela antiinsectos o tul sobre los canteros y plantas jóvenes.<\/li>\n<li><strong>Mangas de langosta:<\/strong> avisar a todas las comunidades vecinas y a la autoridad sanitaria si existe; cubrir lo que se pueda y cosechar antes de que lleguen.<\/li>\n<li>Las tucuras secas y molidas son un buen alimento proteico para las gallinas.<\/li>\n<\/ul>"},{"t":"Pulgones, mosca blanca, arañuelas y trips [AÑOS]","h":"<h3>Pulgones, mosca blanca, arañuelas y trips <span class=\"b anos\">AÑOS<\/span><\/h3>\n<ul>\n<li><strong>Pulgones:<\/strong> aparecen en primavera en brotes tiernos. Chorro de agua fuerte, agua con jabón, cortar los brotes muy atacados. Mucho pulgón suele venir de exceso de abono nitrogenado fresco. Las hormigas que suben a las plantas los cuidan: cortar el paso con un anillo de grasa vegetal o cinta pegajosa en los tallos de los frutales.<\/li>\n<li><strong>Mosca blanca:<\/strong> en tomate, zapallito y poroto, sobre todo en invernadero. Trampas amarillas (cartón o plástico amarillo untado con aceite o grasa) a la altura de las plantas; agua con jabón o aceite emulsionado en el revés de las hojas; ventilar el invernadero.<\/li>\n<li><strong>Arañuelas:<\/strong> ácaros diminutos que proliferan con calor seco y polvo (veredas, caminos de tierra). <strong>Mojar el follaje<\/strong> con agua al atardecer en olas de calor las frena mucho; azufre (sin calor extremo) o aceite emulsionado; en frutales, aceite de invierno.<\/li>\n<li><strong>Trips:<\/strong> insectos alargados muy chicos que raspan las hojas (cebolla, ajo, poroto, tomate) y transmiten virus al tomate y al pimiento. Trampas azules o amarillas pegajosas, riego por aspersión en los días de calor, sacar malezas de los bordes donde se refugian, agua con jabón.<\/li>\n<\/ul>"},{"t":"Polilla del tomate y gusano del choclo [AÑOS]","h":"<h3>Polilla del tomate y gusano del choclo <span class=\"b anos\">AÑOS<\/span><\/h3>\n<ul>\n<li><strong>Polilla del tomate:<\/strong> larvas chiquitas que hacen galerías transparentes en las hojas y agujeros en los frutos. Revisar seguido y sacar las hojas con galerías (a las gallinas o enterradas hondo), Bt cada 7 días en verano, no dejar plantas viejas de tomate al final de la temporada: arrancar y compostar en el centro de la pila caliente, o quemar. Rotar el tomate de lugar cada año.<\/li>\n<li><strong>Gusano del choclo:<\/strong> entra por la punta de la espiga. Unas gotas de aceite vegetal en los \"pelos\" de cada choclo cuando empiezan a secarse lo frenan; cortar la punta comida al cosechar.<\/li>\n<\/ul>"},{"t":"Hongos y enfermedades de las plantas [VITAL]","h":"<h3>Hongos y enfermedades de las plantas <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Los hongos necesitan hojas mojadas durante horas. <strong>Lo más eficaz es no mojar las hojas:<\/strong> regar al pie, a la mañana, plantas con aire entre ellas, y sacar enseguida hojas y frutos enfermos (no al compost: enterrar hondo o quemar).<\/p>\n<table>\n<thead>\n<tr>\n<th>Enfermedad<\/th>\n<th>Dónde<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tizón tardío (peronóspora)<\/strong><\/td>\n<td>Papa y tomate, con días húmedos y frescos<\/td>\n<td>Manchas que avanzan rápido y pudren hojas, tallos, papas y frutos. Preventivo con caldo bordelés antes de rachas de lluvia; sacar las plantas enfermas enseguida; no guardar papas con manchas; no plantar papa y tomate juntos ni seguidos en el mismo lugar<\/td>\n<\/tr>\n<tr>\n<td><strong>Tizón temprano (alternaria)<\/strong><\/td>\n<td>Tomate y papa, hojas de abajo<\/td>\n<td>Manchas con anillos concéntricos. Sacar hojas bajas, acolchado para que la tierra no salpique, bordelés<\/td>\n<\/tr>\n<tr>\n<td><strong>Oídio<\/strong><\/td>\n<td>Zapallo, zapallito, pepino, arveja, vid, manzano<\/td>\n<td>Leche, bicarbonato o azufre; sacar las hojas más atacadas; variedades resistentes<\/td>\n<\/tr>\n<tr>\n<td><strong>Roya<\/strong><\/td>\n<td>Poroto, ajo, puerro<\/td>\n<td>Sacar hojas afectadas, no mojar el follaje, bordelés preventivo, rotación<\/td>\n<\/tr>\n<tr>\n<td><strong>Mal de los almácigos<\/strong><\/td>\n<td>Plantines de todas las especies<\/td>\n<td>Tierra de almácigo <strong>pasteurizada<\/strong> (calentada húmeda en una olla tapada 30 minutos o al horno), poco riego, aire, sembrar ralo; espolvorear ceniza fina o canela sobre la tierra<\/td>\n<\/tr>\n<tr>\n<td><strong>Botritis (moho gris)<\/strong><\/td>\n<td>Frutilla, tomate en invernadero, poroto<\/td>\n<td>Ventilar, cosechar seguido, sacar frutos con moho<\/td>\n<\/tr>\n<tr>\n<td><strong>Virus<\/strong> (hojas con mosaicos amarillos y verdes, deformadas, plantas enanas)<\/td>\n<td>Tomate, pimiento, zapallo, papa<\/td>\n<td>No tienen cura: arrancar la planta, controlar pulgones y trips que los llevan, no guardar semilla de plantas enfermas, papa semilla sana<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Nematodos","h":"<h3>Nematodos<\/h3>\n<p>Gusanitos microscópicos del suelo. Raíces con bultos como cuentas (tomate, zanahoria, poroto) y plantas que se marchitan con el suelo húmedo. Rotación larga sin cultivos sensibles, mucha materia orgánica, intercalar <strong>tagetes (copete)<\/strong> y dejarlos todo el verano, y solarizar el cantero en enero: regar bien, tapar con nylon transparente bien sellado 4 a 6 semanas.<\/p>"},{"t":"Problemas que no son plagas: carencias y podredumbre apical [AÑOS]","h":"<h3>Problemas que no son plagas: carencias y podredumbre apical <span class=\"b anos\">AÑOS<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th>Señal<\/th>\n<th>Qué le falta<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hojas viejas amarillas parejas, planta pálida y chica<\/td>\n<td>Nitrógeno<\/td>\n<td>Compost, estiércol curado, purín de ortiga, orina diluida 1 en 10, abono verde de vicia<\/td>\n<\/tr>\n<tr>\n<td>Hojas con tonos violáceos o rojizos, crecimiento lento con frío<\/td>\n<td>Fósforo<\/td>\n<td>Harina de hueso, compost, gallinaza curada; en primavera fría se corrige solo al calentar<\/td>\n<\/tr>\n<tr>\n<td>Bordes de las hojas viejas secos y quemados<\/td>\n<td>Potasio<\/td>\n<td>Ceniza de leña (un puñado por m², no en suelo salitroso), compost<\/td>\n<\/tr>\n<tr>\n<td>Hojas nuevas amarillas con nervaduras verdes (clorosis)<\/td>\n<td>Hierro, frecuente en suelos calcáreos del valle<\/td>\n<td>Materia orgánica y acolchado; no echar cal ni ceniza; regar sin encharcar; en frutales, pozos alrededor con compost<\/td>\n<\/tr>\n<tr>\n<td>Hojas viejas amarillas entre las nervaduras<\/td>\n<td>Magnesio<\/td>\n<td>Compost; sulfato de magnesio (sal de Epsom) de farmacia, una cucharada por litro<\/td>\n<\/tr>\n<tr>\n<td>Mancha negra y seca en la punta del tomate, el pimiento o la sandía<\/td>\n<td><strong>Podredumbre apical<\/strong>: falta de calcio por <strong>riego irregular<\/strong><\/td>\n<td>Regar parejo (nunca dejar secar del todo y después inundar), acolchar, cáscara de huevo molida o cal al preparar el cantero. Los frutos ya manchados se cortan y se comen<\/td>\n<\/tr>\n<tr>\n<td>Bordes de las hojas de lechuga quemados por dentro<\/td>\n<td>Calcio, con calor y riego irregular<\/td>\n<td>Media sombra, riego parejo<\/td>\n<\/tr>\n<tr>\n<td>Frutos rajados (tomate, zanahoria, repollo)<\/td>\n<td>Lluvia o riego fuerte después de seca<\/td>\n<td>Riego parejo y acolchado<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Frutales del Alto Valle [AÑOS]","h":"<h3>Frutales del Alto Valle <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Las plagas que más pesan en la región son carpocapsa, grafolita, cochinilla harinosa y piojo de San José. Las chacras abandonadas se vuelven criaderos de carpocapsa para los vecinos: en una comunidad, cuidar también los árboles que nadie atiende o cortarlos.<\/p>\n<table>\n<thead>\n<tr>\n<th>Plaga o enfermedad<\/th>\n<th>Señal<\/th>\n<th>Manejo sin agroquímicos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Carpocapsa<\/strong> (manzana, pera, membrillo, nuez)<\/td>\n<td>Fruta con agujero y aserrín marrón, fruta que cae antes de tiempo<\/td>\n<td>Juntar la fruta caída todos los días (a las gallinas o hervida); bandas de cartón corrugado en el tronco desde fines de noviembre, que se sacan y queman cada 15 días; ralear dejando un fruto por ramillete y sacando los picados; embolsar frutos chicos con bolsitas de papel; raspar la corteza suelta del tronco en invierno; gallinas bajo los árboles<\/td>\n<\/tr>\n<tr>\n<td><strong>Grafolita<\/strong> (durazno, también manzano y membrillo)<\/td>\n<td>Puntas de brotes que se marchitan con una gotita de goma; frutos con galerías<\/td>\n<td>Cortar y quemar los brotes dañados apenas se ven; juntar fruta caída; trampas de botella con jugo de fruta fermentado<\/td>\n<\/tr>\n<tr>\n<td><strong>Piojo de San José y cochinillas<\/strong><\/td>\n<td>Costras grises chicas en ramas y frutos (con un punto rojizo en la fruta); ramas que se debilitan<\/td>\n<td>Podar y quemar las ramas muy atacadas; cepillar el tronco; <strong>aceite de invierno<\/strong> en julio y agosto<\/td>\n<\/tr>\n<tr>\n<td><strong>Psílido del peral<\/strong><\/td>\n<td>Hojas pegajosas con melaza que se pone negra; frutos manchados<\/td>\n<td>Aceite de invierno; trampas amarillas; lavar con agua y jabón; cuidar a los aliados (es una plaga que los venenos empeoran)<\/td>\n<\/tr>\n<tr>\n<td><strong>Pulgón lanígero<\/strong> (manzano)<\/td>\n<td>Colonias algodonosas blancas en heridas de poda, ramas y cuello<\/td>\n<td>Cepillar con agua y jabón; pintar heridas de poda; la avispita que lo parasita aparece si no se fumiga<\/td>\n<\/tr>\n<tr>\n<td><strong>Arañuelas<\/strong><\/td>\n<td>Hojas bronceadas en verano<\/td>\n<td>Aceite de invierno; regar y mojar los caminos para bajar el polvo<\/td>\n<\/tr>\n<tr>\n<td><strong>Sarna del manzano y del peral<\/strong><\/td>\n<td>Manchas oscuras sarnosas en hojas y frutos<\/td>\n<td>Juntar y enterrar las hojas caídas en otoño; caldo bordelés en yema hinchada y después de lluvias de primavera<\/td>\n<\/tr>\n<tr>\n<td><strong>Torque del durazno<\/strong><\/td>\n<td>Hojas enruladas, rojizas y gruesas en primavera<\/td>\n<td>Caldo bordelés <strong>una sola vez a fin de invierno<\/strong>, cuando hinchan las yemas; después ya no sirve<\/td>\n<\/tr>\n<tr>\n<td><strong>Oídio del manzano<\/strong><\/td>\n<td>Brotes con polvillo blanco<\/td>\n<td>Cortar los brotes blancos en la poda; azufre<\/td>\n<\/tr>\n<tr>\n<td><strong>Bicho de cesto<\/strong><\/td>\n<td>Bolsitas colgadas de ramas hechas de hojas secas<\/td>\n<td>Sacarlas a mano en invierno y quemarlas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"atencion\">\n<p><strong>Mosca de los frutos.<\/strong> Los valles de la Patagonia norte (Alto Valle, Valle Medio, Río Colorado) son área libre de mosca de los frutos, y eso protege la fruta de la región. <strong>Nunca entrar fruta del norte del país<\/strong> (cítricos, duraznos, ciruelas) aunque falten controles: un solo cajón con larvas puede traer la plaga. Si aparecen frutas con larvas blancas que saltan, juntarlas en bolsa cerrada al sol, enterrar hondo y avisar a toda la comunidad y las vecinas.<\/p>\n<\/div>"},{"t":"Roedores y liebres en la huerta [AÑOS]","h":"<h3>Roedores y liebres en la huerta <span class=\"b anos\">AÑOS<\/span><\/h3>\n<ul>\n<li><strong>Tuco-tuco y cuis:<\/strong> el tuco-tuco vive bajo tierra y deja montículos sin agujero visible; el cuis corre por la superficie y come hojas tiernas. Canteros con <strong>malla de alambre enterrada en el fondo<\/strong> (a 30 cm) o cajones con piso de malla; trampas en las galerías; gatos y perros de trabajo (cap. 7).<\/li>\n<li><strong>Liebres y conejos silvestres:<\/strong> cerco de malla de gallinero de 60 cm de alto, con 15 cm enterrados o doblados hacia afuera; protector de malla o plástico alrededor del tronco de cada frutal joven. Cazarlos para comer es posible: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"10\" data-s=\"0\"><em>Conejos<\/em>, cap. 11<\/a>.<\/li>\n<li><strong>Ratas y ratones:<\/strong> <span class=\"ref\">►<\/span> Manual médico T2 18.9 y <a class=\"x\" data-b=\"DES\" data-c=\"4\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 5<\/a>.<\/li>\n<\/ul>"},{"t":"Calendario sanitario del Alto Valle","h":"<h3>Calendario sanitario del Alto Valle<\/h3>\n<table>\n<thead>\n<tr>\n<th>Época<\/th>\n<th>En la huerta<\/th>\n<th>En los frutales<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Junio a agosto<\/strong><\/td>\n<td>Limpiar restos de cultivos enfermos; planificar la rotación; pasteurizar la tierra de almácigos<\/td>\n<td>Poda (sacar ramas con cochinillas o cestos); raspar troncos; quemar las bandas de cartón; <strong>aceite de invierno<\/strong>; juntar hojas y momias de fruta<\/td>\n<\/tr>\n<tr>\n<td><strong>Septiembre y octubre<\/strong><\/td>\n<td>Collares contra gusano cortador en trasplantes; babosas con lluvias; primeros pulgones<\/td>\n<td><strong>Caldo bordelés en yema hinchada<\/strong> (torque, sarna); vigilar heladas en flor; anillos contra hormigas<\/td>\n<\/tr>\n<tr>\n<td><strong>Noviembre y diciembre<\/strong><\/td>\n<td>Pulgón, trips y polilla del tomate; acolchar; Bt en coles<\/td>\n<td>Raleo de frutos; <strong>bandas de cartón<\/strong> contra carpocapsa desde fin de noviembre; juntar fruta caída todos los días; cortar brotes con grafolita<\/td>\n<\/tr>\n<tr>\n<td><strong>Enero y febrero<\/strong><\/td>\n<td>Arañuela y mosca blanca con calor; mojar follaje al atardecer; oídio en zapallos; tizón si llueve<\/td>\n<td>Segunda generación de carpocapsa; seguir con bandas y fruta caída; arañuela<\/td>\n<\/tr>\n<tr>\n<td><strong>Marzo a mayo<\/strong><\/td>\n<td>Sacar plantas de tomate viejas; semillas solo de plantas sanas; babosas y caracoles con el otoño<\/td>\n<td>Juntar y enterrar hojas caídas (sarna); última fruta del suelo; cartones afuera<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}]},{"id":"DES","title":"Despensa y cocina","sub":"Conservas, fermentos, pan, lácteos, recetas","color":"#a8522e","kind":"md","c":[{"t":"La despensa de la familia: qué guardar y cuánto","s":[{"t":"","h":"<p>La despensa compra tiempo hasta que la producción propia alcanza, y es la que sostiene a la familia en un invierno malo o una cosecha perdida. Las cantidades y las razones nutricionales están en el libro <em>Nutrición ovolactovegetariana en escenario de colapso<\/em>; este capítulo las repite resumidas para que la despensa se pueda armar con este libro en la mano.<\/p>"},{"t":"Las reglas que mandan sobre todo el libro","h":"<h3>Las reglas que mandan sobre todo el libro<\/h3>\n<p>Del libro de Nutrición (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"1\" data-s=\"0\">Nutrición §1<\/a>), en pocas palabras:<\/p>\n<ol>\n<li>Guardar <strong>vitamina B12, vitamina D y sal yodada<\/strong>: son lo que la comida ovolactovegetariana no cubre con seguridad.<\/li>\n<li><strong>Vitamina C fresca todas las semanas<\/strong> (rosa mosqueta, brotes, papa, chucrut): sin ella el escorbuto llega en dos o tres meses.<\/li>\n<li><strong>Cereal y legumbre todos los días<\/strong>, unas 3 partes de cereal por 1 de legumbre en peso seco, más huevo y lácteos.<\/li>\n<li><strong>Huevos y leche primero para embarazadas, bebés y niños.<\/strong><\/li>\n<li><strong>Seguridad antes que nutrición:<\/strong> una conserva mal hecha mata antes que cualquier carencia (cap. 2 de este libro).<\/li>\n<\/ol>"},{"t":"Despensa por adulto y por año","h":"<h3>Despensa por adulto y por año<\/h3>\n<p>Las cifras son las del libro de Nutrición (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"5\" data-s=\"0\">Nutrición §5<\/a>), que parten de la base clásica de almacenamiento y la ajustan para una dieta sin carne. Para los chicos de 1 a 10 años, calcular aproximadamente la mitad; para los adolescentes, como un adulto.<\/p>\n<table>\n<thead>\n<tr>\n<th>Alimento<\/th>\n<th>Cantidad por adulto por año<\/th>\n<th>Cómo guardarlo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Granos: trigo, arroz blanco, maíz seco, avena, fideos<\/td>\n<td>180 kg<\/td>\n<td>Baldes o tambores alimentarios bien cerrados, en lugar fresco y seco; con humedad del grano menor al 12 %<\/td>\n<\/tr>\n<tr>\n<td>Legumbres secas: lentejas, porotos, garbanzos, arvejas partidas<\/td>\n<td>40 a 50 kg<\/td>\n<td>Igual que los granos<\/td>\n<\/tr>\n<tr>\n<td>Leche en polvo (la descremada dura mucho más)<\/td>\n<td>25 a 35 kg<\/td>\n<td>Lata o bolsa sellada, oscuro y fresco<\/td>\n<\/tr>\n<tr>\n<td>Aceite<\/td>\n<td>10 a 12 litros<\/td>\n<td>Oscuro y fresco; rotar cada 1 a 2 años<\/td>\n<\/tr>\n<tr>\n<td>Azúcar o miel<\/td>\n<td>27 kg<\/td>\n<td>Seco y cerrado; no vence<\/td>\n<\/tr>\n<tr>\n<td>Sal yodada<\/td>\n<td>5 kg<\/td>\n<td>Frasco hermético y oscuro (la luz y la humedad le sacan el yodo)<\/td>\n<\/tr>\n<tr>\n<td>Semillas para brotes (lenteja, poroto mung, alfalfa, trigo)<\/td>\n<td>5 a 10 kg<\/td>\n<td>Fresco y seco<\/td>\n<\/tr>\n<tr>\n<td>Lino y chía<\/td>\n<td>3 a 5 kg<\/td>\n<td>Enteros; moler en el momento<\/td>\n<\/tr>\n<tr>\n<td>Frutos secos y semillas<\/td>\n<td>5 a 10 kg<\/td>\n<td>Con cáscara, fresco<\/td>\n<\/tr>\n<tr>\n<td>Suplementos: B12, vitamina D, vitamina C; prenatal si hay mujeres en edad fértil<\/td>\n<td>Para todo el año<\/td>\n<td>Oscuro y seco <span class=\"ref\">►<\/span> Manual médico T2 16.13<\/td>\n<\/tr>\n<tr>\n<td>Yerba, té, cacao, café<\/td>\n<td>Según costumbre<\/td>\n<td>Sirven también para intercambiar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Herramientas que hacen comestible la despensa:<\/strong> molino manual de granos (sin él, el trigo vale poco), olla a presión (ahorra mucho combustible en legumbres), una forma de cocinar sin red (cap. 6) y recipientes herméticos.<\/p>"},{"t":"Cuánto dura cada cosa bien guardada","h":"<h3>Cuánto dura cada cosa bien guardada<\/h3>\n<p>Vidas útiles aproximadas de los estudios de almacenamiento citados en <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"5\" data-s=\"0\">Nutrición §5<\/a>, siempre que se mantengan por debajo de 20 °C, secos, a oscuras y sin aire.<\/p>\n<table>\n<thead>\n<tr>\n<th>Alimento<\/th>\n<th>Duración aproximada<\/th>\n<th>Comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sal, azúcar, miel<\/td>\n<td>Indefinida<\/td>\n<td>La miel se cristaliza: se recupera a baño María tibio<\/td>\n<\/tr>\n<tr>\n<td>Trigo, arroz blanco y maíz en grano<\/td>\n<td>10 a 30 años<\/td>\n<td>Molerlos de a poco<\/td>\n<\/tr>\n<tr>\n<td>Avena<\/td>\n<td>Muchos años si está sellada<\/td>\n<td>Abierta, 1 a 2 años<\/td>\n<\/tr>\n<tr>\n<td>Legumbres secas<\/td>\n<td>10 años o más<\/td>\n<td>Con los años se ponen duras: olla a presión y una pizca de bicarbonato<\/td>\n<\/tr>\n<tr>\n<td>Fideos secos<\/td>\n<td>Muchos años sellados<\/td>\n<td>Abiertos, 2 años<\/td>\n<\/tr>\n<tr>\n<td>Harina blanca<\/td>\n<td>1 año<\/td>\n<td>La integral, 3 a 6 meses: mejor guardar grano<\/td>\n<\/tr>\n<tr>\n<td>Arroz integral<\/td>\n<td>6 a 12 meses<\/td>\n<td>Se enrancia<\/td>\n<\/tr>\n<tr>\n<td>Leche en polvo descremada<\/td>\n<td>15 a 20 años sellada al vacío<\/td>\n<td>La entera, menos de 1 año<\/td>\n<\/tr>\n<tr>\n<td>Aceite<\/td>\n<td>1 a 2 años<\/td>\n<td>Rancio = descartar<\/td>\n<\/tr>\n<tr>\n<td>Conservas industriales en lata<\/td>\n<td>2 a 5 años<\/td>\n<td>Descartar latas abolladas en la costura, hinchadas u oxidadas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"La rotación y el inventario","h":"<h3>La rotación y el inventario<\/h3>\n<ul>\n<li><strong>Lo primero que entra es lo primero que sale.<\/strong> Lo nuevo va atrás o abajo. Cada envase con fecha.<\/li>\n<li><strong>Inventario mensual<\/strong> en el cuaderno: cuánto hay de cada cosa y a qué ritmo se gasta. Si algo se termina en menos de tres meses, es lo primero que se produce, se intercambia o se raciona.<\/li>\n<li><strong>Despensa repartida:<\/strong> una parte en otra casa de confianza o escondida, por incendio, inundación o robo <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 6<\/a>.<\/li>\n<li><strong>Racionar a tiempo:<\/strong> recortar primero extras y azúcar, nunca legumbres, huevos y leche de los chicos <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"7\" data-s=\"0\">Nutrición §7<\/a> y Manual médico T2 16.11.<\/li>\n<\/ul>"}]},{"t":"Seguridad de los alimentos y botulismo","s":[{"t":"","h":"<p>La cosecha llega toda junta y hay que comerla durante todo el año: conservar bien es lo que convierte un buen verano en un invierno sin hambre. La regla de oro de este capítulo es una sola: <strong>una conserva mal hecha puede matar a toda una familia sin cambiar de olor ni de sabor.<\/strong><\/p>"},{"t":"Botulismo: lo que hay que saber antes de envasar nada [VITAL]","h":"<h3>Botulismo: lo que hay que saber antes de envasar nada <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>La bacteria del botulismo vive en la tierra y crece dentro de frascos cerrados, sin aire, con alimentos poco ácidos. Su toxina no se ve, no se huele y no tiene gusto. En Argentina hubo casos con conservas de tomate, escabeches, ajo en aceite, y también con alimentos vegetarianos como hummus, pasta de maní y \"quesos\" de semillas.<\/p>\n<p><strong>Reglas que no se discuten<\/strong><\/p>\n<ol>\n<li><strong>Solo se envasa al baño María lo que es ácido:<\/strong> frutas, mermeladas, tomate <strong>acidificado<\/strong>, encurtidos en vinagre y fermentos ácidos.<\/li>\n<li><strong>Las verduras poco ácidas no se envasan al baño María<\/strong> (choclo, arvejas, chauchas, porotos cocidos, zapallo, berenjena sin vinagre, hongos, ají sin vinagre). O se envasan con una envasadora a presión con manómetro siguiendo las tablas de tiempo y presión de la guía USDA (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"2\" data-s=\"0\">cap. 3<\/a>, <em>Envasado a presión<\/em>), o se secan, se fermentan, se encurten en vinagre o se comen frescas. La olla a presión de cocina común <strong>no sirve<\/strong> para esto <span class=\"ref\">►<\/span> Manual médico T2 15.15.<\/li>\n<li><strong>Nunca ajo, hierbas ni verduras crudas en aceite<\/strong> guardados fuera de la heladera.<\/li>\n<li>Hacer conservas en cantidades chicas y en frascos chicos.<\/li>\n<li>Rotular cada frasco con contenido, fecha y lote.<\/li>\n<li><strong>Descartar sin probar<\/strong> todo frasco con la tapa abombada, con pérdidas, óxido, burbujas que suben, líquido turbio, o que largue gas o salpique al abrirlo. Tirarlo envuelto, donde no lo coman animales.<\/li>\n<li><strong>Antes de comer una conserva casera, hervirla:<\/strong> llevar el contenido a 80 °C o más durante 10 a 20 minutos destruye la toxina. Lo más simple: hervir 10 minutos en una olla antes de servir.<\/li>\n<\/ol>\n<p>La seguridad de los alimentos en general (leche cruda, huevos, agua, granos con moho, porotos crudos, papa verde, plantas silvestres) <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"8\" data-s=\"0\">Nutrición §8<\/a> y Manual médico T2 18.8 y 16.10.<\/p>"}]},{"t":"Conservas en frasco","s":[{"t":"","h":"<p>Las frutas, el tomate acidificado y los encurtidos se envasan al baño María; las verduras y legumbres, solo con envasadora a presión. Mismas reglas y tiempos que <span class=\"ref\">►<\/span> Manual médico T2 15.15.<\/p>"},{"t":"Frascos y baño María [VITAL] (9, 10)","h":"<h3>Frascos y baño María <span class=\"b vital\">VITAL<\/span> (9, 10)<\/h3>\n<p><strong>Esterilizar frascos (10):<\/strong> lavar con agua y detergente, poner en una olla cubiertos de agua y hervir 10 minutos. Sacarlos con pinza y dejarlos boca abajo sobre un repasador limpio. Las tapas, en lo posible nuevas; si se reutilizan, sin óxido y con el sellado intacto.<\/p>\n<p><strong>Baño María (9)<\/strong><\/p>\n<ol>\n<li>Llenar los frascos calientes con la preparación caliente, dejando 1 a 2 cm libres arriba.<\/li>\n<li>Pasar un cuchillo limpio por dentro para sacar burbujas. Limpiar el borde.<\/li>\n<li>Tapar firme, sin forzar.<\/li>\n<li>Poner un trapo en el fondo de la olla, los frascos parados sin tocarse, y agua caliente hasta 3 cm sobre las tapas.<\/li>\n<li>Contar el tiempo <strong>desde que el agua hierve<\/strong> (tabla de abajo). Mantener el hervor todo el tiempo.<\/li>\n<li>Sacar los frascos sin inclinarlos y dejarlos enfriar 24 horas sin tocarlos.<\/li>\n<li><strong>Control de vacío:<\/strong> la tapa tiene que quedar hundida y no hacer \"clic\" al apretarla. Si hace clic, ese frasco no selló: guardarlo como fresco y consumirlo en pocos días.<\/li>\n<li>No envolver los frascos en diarios, trapos ni cartones para que \"se enfríen despacio\": esa costumbre mantiene la temperatura ideal para el botulismo.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Preparación<\/th>\n<th>Frasco de 1/2 litro<\/th>\n<th>Frasco de 1 litro<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mermeladas y dulces<\/td>\n<td>10 min<\/td>\n<td>15 min<\/td>\n<\/tr>\n<tr>\n<td>Frutas en almíbar<\/td>\n<td>20 min<\/td>\n<td>25 min<\/td>\n<\/tr>\n<tr>\n<td>Tomate triturado o entero, acidificado<\/td>\n<td>35 min<\/td>\n<td>45 min<\/td>\n<\/tr>\n<tr>\n<td>Encurtidos en vinagre<\/td>\n<td>10 min<\/td>\n<td>15 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tiempos para menos de 300 m de altura (Villa Regina y el Alto Valle). De 300 a 900 m, sumar 5 minutos; de 900 a 1.800 m, 10 minutos; más arriba, 15 minutos.<\/p>"},{"t":"Tomate en conserva [VITAL]","h":"<h3>Tomate en conserva <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>El tomate parece ácido pero no siempre alcanza: <strong>siempre hay que acidificarlo<\/strong>.<\/p>\n<ul>\n<li>Tomates sanos, maduros, sin podredumbre ni partes blandas.<\/li>\n<li><strong>Acidificar en cada frasco<\/strong>, antes de llenarlo: 1 cucharada de jugo de limón o 1/4 de cucharadita de ácido cítrico por frasco de 1/2 litro; el doble por frasco de 1 litro. Por lote: 20 g de ácido cítrico o 400 cm³ de vinagre cada 10 kg de tomate.<\/li>\n<li>Escaldar 1 minuto en agua hirviendo, pelar, cortar o triturar, hervir 5 minutos y envasar caliente.<\/li>\n<li>Baño María según la tabla.<\/li>\n<\/ul>"},{"t":"Mermeladas y frutas en almíbar [VITAL] (11, 14)","h":"<h3>Mermeladas y frutas en almíbar <span class=\"b vital\">VITAL<\/span> (11, 14)<\/h3>\n<p><strong>Mermelada sin pectina comprada (11).<\/strong> Las frutas con mucha pectina natural (membrillo, manzana verde, ciruela, cascaritas de cítricos) espesan solas. Las que tienen poca (frutilla, durazno, pera) se mezclan con un 20 % de manzana rallada o membrillo.<\/p>\n<ol>\n<li>1 kg de fruta limpia y picada, 600 a 800 g de azúcar, el jugo de un limón.<\/li>\n<li>Macerar 2 horas con el azúcar.<\/li>\n<li>Hervir revolviendo, a fuego medio, espumando.<\/li>\n<li><strong>Punto:<\/strong> una gota sobre un plato frío que, al inclinarlo, no corre. O que la cuchara deje un surco que tarda en cerrarse.<\/li>\n<li>Envasar hirviendo y hacer baño María.<\/li>\n<\/ol>\n<p>Con menos de 50 % de azúcar la mermelada no conserva: se tiene que comer pronto. El dulce de membrillo y el de batata, cocidos hasta pasta firme, se guardan en moldes sin frasco.<\/p>\n<p><strong>Frutas en almíbar (14).<\/strong> Almíbar liviano: 1 parte de azúcar en 3 de agua. Fruta pelada en mitades, frascos llenos sin apretar, cubrir con almíbar caliente, baño María.<\/p>"},{"t":"Fruta en conserva sin azúcar [VITAL]","h":"<h3>Fruta en conserva sin azúcar <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>El azúcar va a ser de lo primero que falte. La fruta se puede envasar igual <strong>sin azúcar<\/strong>: lo que la conserva es el baño María, no el dulce. Sirve para durazno, pera, damasco, ciruela, cereza, manzana y membrillo.<\/p>\n<ol>\n<li><strong>Líquido:<\/strong> agua sola, o jugo de manzana o de uva colado (endulza sin azúcar), o un almíbar muy liviano con miel si hay.<\/li>\n<li><strong>Preparar la fruta:<\/strong> pelar si hace falta, sacar carozos y corazones, cortar en mitades o gajos y dejarla en agua con jugo de limón (2 cucharadas por litro) para que no se oscurezca.<\/li>\n<li><strong>Envasado en caliente (recomendado):<\/strong> hervir la fruta 2 a 5 minutos en el líquido, llenar los frascos calientes con la fruta, cubrir con el líquido hirviendo dejando 1 cm libre, sacar las burbujas con una cuchara, limpiar el borde y tapar.<\/li>\n<li><strong>Baño María<\/strong> con agua hirviendo 2 cm por encima de las tapas, contando desde que vuelve a hervir:<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Fruta<\/th>\n<th>Frasco de ½ litro<\/th>\n<th>Frasco de 1 litro<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Durazno, damasco, pera, ciruela, cereza (en caliente)<\/td>\n<td>20 minutos<\/td>\n<td>25 minutos<\/td>\n<\/tr>\n<tr>\n<td>Manzana y membrillo en gajos (en caliente)<\/td>\n<td>20 minutos<\/td>\n<td>20 minutos<\/td>\n<\/tr>\n<tr>\n<td>Fruta cruda en frasco, cubierta con líquido hirviendo<\/td>\n<td>25 minutos<\/td>\n<td>30 minutos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tiempos para menos de 300 m de altura (Alto Valle); más arriba, ajustar como en la tabla del baño María.<\/p>\n<p><strong>No sirve<\/strong> para higos, tomate, melón ni zapallo: son poco ácidos y necesitan otro tratamiento (tomate: acidificar, cap. 3; zapallo: solo seco o a presión). Sin azúcar, la fruta abierta dura menos: guardar al fresco y comer en pocos días.<\/p>"},{"t":"Arrope: dulce sin azúcar comprada [AÑOS]","h":"<h3>Arrope: dulce sin azúcar comprada <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Jugo de fruta concentrado al fuego hasta jarabe espeso. Es tradicional en Cuyo y el NOA (arrope de uva, de tuna, de chañar) y en el Alto Valle se hace igual con uva, manzana o pera. Endulza mate, postres y yogur, y es la base de dulces de fruta sin azúcar.<\/p>\n<ol>\n<li><strong>Jugo:<\/strong> moler o pisar la fruta madura (uva sin escobajo, manzana o pera rallada), prensar en una tela y colar.<\/li>\n<li><strong>Reducir:<\/strong> en una olla ancha, a fuego bajo y parejo, sin tapar, espumando. Revolver cada vez más seguido a medida que espesa: al final se quema fácil.<\/li>\n<li><strong>Punto:<\/strong> una gota en un plato frío forma un hilo grueso y no se corre. Queda entre un cuarto y un quinto del volumen de jugo: de 10 litros de jugo salen 2 a 2,5 litros de arrope.<\/li>\n<li><strong>Envasar<\/strong> hirviendo en botellas o frascos esterilizados (cap. 3), tapar enseguida. Muy concentrado, dura más de un año sin abrir.<\/li>\n<\/ol>\n<p><strong>Dulce de arrope:<\/strong> zapallo, membrillo, higos o peras en trozos, cocinados en arrope hasta que estén tiernos y brillantes. Se envasa como la mermelada.<\/p>"},{"t":"Pectina casera [MEJORA]","h":"<h3>Pectina casera <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>La pectina hace que la mermelada cuaje. Las manzanas verdes o ácidas y los membrillos tienen mucha, sobre todo en la cáscara y el corazón; frutillas, duraznos, cerezas y peras tienen poca.<\/p>\n<ol>\n<li>1 kg de cáscaras, corazones y manzanas o membrillos verdes picados, con 1 litro de agua.<\/li>\n<li>Hervir tapado 30 a 40 minutos, hasta que esté todo blando.<\/li>\n<li>Colar por una tela <strong>sin apretar<\/strong> (si se aprieta, queda turbia). Hervir el líquido hasta reducirlo a la mitad.<\/li>\n<li><strong>Prueba:<\/strong> una cucharadita en un plato frío forma una gelatina floja.<\/li>\n<li><strong>Uso:<\/strong> 150 a 250 ml por kilo de fruta pobre en pectina; la mermelada cuaja en la mitad de tiempo y con menos azúcar.<\/li>\n<li><strong>Guardar:<\/strong> envasar hirviendo y baño María 10 minutos.<\/li>\n<\/ol>\n<p>Una mermelada con menos azúcar que la receta del cap. 3 <strong>siempre<\/strong> va a baño María y, abierta, se come en una o dos semanas.<\/p>"},{"t":"Encurtidos en vinagre [VITAL] (2)","h":"<h3>Encurtidos en vinagre <span class=\"b vital\">VITAL<\/span> (2)<\/h3>\n<ul>\n<li>Vinagre de al menos 5 % de acidez (el de supermercado lo dice en la etiqueta). Nunca diluirlo con más agua que vinagre.<\/li>\n<li>Pepinos, cebollitas, zanahoria, coliflor, morrones, berenjenas: blanquear 2 o 3 minutos las duras.<\/li>\n<li>Líquido: 1 parte de agua, 1 de vinagre, 1 cucharada de sal por litro. Hervir con especias (laurel, pimienta, ajo, orégano).<\/li>\n<li>Llenar frascos con la verdura, cubrir con el líquido hirviendo y hacer baño María.<\/li>\n<li><strong>Berenjenas en escabeche:<\/strong> primero en vinagre, después se escurren y se cubren con aceite. Siempre la berenjena tiene que haber estado 24 horas en vinagre puro antes del aceite, y consumirse en semanas. El INTA tiene una cartilla específica de conserva segura de berenjenas.<\/li>\n<\/ul>"},{"t":"Chutney [MEJORA]","h":"<h3>Chutney <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Conserva agridulce de fruta con cebolla, vinagre y especias, que acompaña quesos, legumbres y arroz. Aprovecha la fruta pasada, las manzanas golpeadas y el tomate verde del final de la temporada.<\/p>\n<p><strong>Para unos 4 frascos de medio litro:<\/strong> 1 kg de fruta picada (manzana, membrillo, durazno, ciruela, pera o tomate verde), 250 g de cebolla picada, 2 dientes de ajo, 300 ml de vinagre comercial de 5 %, 250 g de azúcar o de miel, 1 cucharadita de sal y especias a gusto (pimienta, clavo de olor, canela, jengibre seco, ají molido, semillas de mostaza).<\/p>\n<ol>\n<li>Poner todo en una olla de acero o enlozada (no de aluminio, que reacciona con el vinagre).<\/li>\n<li>Hervir a fuego bajo, revolviendo seguido, de 1 a 1½ horas, hasta que esté espeso y al pasar la cuchara por el fondo quede una raya que tarda en cerrarse.<\/li>\n<li>Envasar hirviendo en frascos calientes, dejando 1 cm libre, tapar y hacer <strong>baño María 10 minutos<\/strong> (frascos de hasta medio litro).<\/li>\n<li>Esperar un mes antes de abrirlo: se asientan los sabores. Dura un año en la despensa; abierto, guardarlo en lugar fresco y comerlo en pocas semanas.<\/li>\n<\/ol>\n<p><strong>Para que sea seguro:<\/strong> no poner más cebolla ni ajo que la receta (son poco ácidos), no rebajar el vinagre y no reemplazar el vinagre comercial por casero (cap. 9).<\/p>"},{"t":"Aceitunas en salmuera [AÑOS] (4)","h":"<h3>Aceitunas en salmuera <span class=\"b anos\">AÑOS<\/span> (4)<\/h3>\n<p>Recomendado seguir la cartilla del INTA <em>¿Cómo preparar tus propias conservas de aceitunas?<\/em>. Método básico en agua:<\/p>\n<ol>\n<li>Aceitunas sanas, sin golpes. Hacerles un corte o aplastarlas levemente.<\/li>\n<li>Cubrirlas con agua y <strong>cambiar el agua todos los días<\/strong> durante 2 a 4 semanas, hasta que no estén amargas.<\/li>\n<li>Pasarlas a salmuera de 80 a 100 g de sal por litro, con limón, ajo, orégano y laurel.<\/li>\n<li>Siempre cubiertas de salmuera. Esperar 2 semanas antes de comerlas.<\/li>\n<\/ol>"},{"t":"Envasado a presión: verduras y legumbres en frasco [AÑOS]","h":"<h3>Envasado a presión: verduras y legumbres en frasco <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Es la única forma segura de envasar en frasco verduras poco ácidas, legumbres cocidas y caldos, porque el baño María no supera los 100 °C y las esporas del botulismo resisten esa temperatura. Hace falta una <strong>envasadora a presión<\/strong> (olla grande para conservas con manómetro o con regulador de peso), no la olla a presión de cocina común <span class=\"ref\">►<\/span> Manual médico T2 15.15.<\/p>\n<p><strong>Lo que hace falta<\/strong><\/p>\n<ul>\n<li>Envasadora a presión con manómetro (reloj de presión) calibrado o con regulador de peso, junta de goma en buen estado y válvulas limpias.<\/li>\n<li>Frascos de vidrio para conservas y tapas nuevas.<\/li>\n<li>La guía <em>Complete Guide to Home Canning<\/em> del USDA (descarga gratuita, <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"9\" data-s=\"0\">Nutrición §9<\/a>) impresa: tiene los tiempos probados para cada alimento.<\/li>\n<\/ul>\n<p><strong>Presión según la altura del lugar<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Altura del lugar<\/th>\n<th>Envasadora con manómetro<\/th>\n<th>Envasadora con regulador de peso<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hasta 300 m (Villa Regina, Alto Valle)<\/td>\n<td>11 libras por pulgada cuadrada (psi)<\/td>\n<td>10 psi<\/td>\n<\/tr>\n<tr>\n<td>300 a 600 m<\/td>\n<td>11 psi<\/td>\n<td>15 psi<\/td>\n<\/tr>\n<tr>\n<td>600 a 1.200 m<\/td>\n<td>12 psi<\/td>\n<td>15 psi<\/td>\n<\/tr>\n<tr>\n<td>1.200 a 1.800 m<\/td>\n<td>13 psi<\/td>\n<td>15 psi<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tiempos para algunos alimentos (a la presión de la tabla)<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Alimento y preparación<\/th>\n<th>Frasco de 1/2 litro<\/th>\n<th>Frasco de 1 litro<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chauchas en trozos<\/td>\n<td>20 min<\/td>\n<td>25 min<\/td>\n<\/tr>\n<tr>\n<td>Zanahoria en rodajas<\/td>\n<td>25 min<\/td>\n<td>30 min<\/td>\n<\/tr>\n<tr>\n<td>Remolacha<\/td>\n<td>30 min<\/td>\n<td>35 min<\/td>\n<\/tr>\n<tr>\n<td>Papa en cubos, pelada<\/td>\n<td>35 min<\/td>\n<td>40 min<\/td>\n<\/tr>\n<tr>\n<td>Arvejas frescas<\/td>\n<td>40 min<\/td>\n<td>40 min<\/td>\n<\/tr>\n<tr>\n<td>Choclo desgranado<\/td>\n<td>55 min<\/td>\n<td>85 min<\/td>\n<\/tr>\n<tr>\n<td>Zapallo en cubos (nunca en puré)<\/td>\n<td>55 min<\/td>\n<td>90 min<\/td>\n<\/tr>\n<tr>\n<td>Porotos o garbanzos secos, remojados y precocidos<\/td>\n<td>75 min<\/td>\n<td>90 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Valores de la guía USDA; ante cualquier duda, seguir la guía impresa, que es la fuente.<\/p>\n<p><strong>Pasos<\/strong><\/p>\n<ol>\n<li>Preparar el alimento según la guía, llenar los frascos calientes dejando 2,5 cm libres arriba, sacar burbujas, limpiar el borde y tapar.<\/li>\n<li>Poner 5 a 8 cm de agua caliente en la envasadora y la rejilla del fondo. Acomodar los frascos sin que se toquen.<\/li>\n<li>Cerrar la tapa dejando la válvula abierta. Calentar hasta que salga un chorro firme de vapor y <strong>dejarlo salir 10 minutos<\/strong> (si queda aire adentro, la temperatura no llega).<\/li>\n<li>Cerrar la válvula o poner el regulador. Cuando el manómetro llega a la presión de la tabla, empezar a contar el tiempo. Mantener la presión pareja, sin bajar nunca; si baja, volver a contar desde cero.<\/li>\n<li>Al terminar, apagar y <strong>dejar que baje sola<\/strong> a cero. Nunca enfriarla con agua ni abrirla con presión.<\/li>\n<li>Esperar 10 minutos más, abrir la tapa hacia el lado contrario a la cara, sacar los frascos sin inclinarlos y dejarlos enfriar 24 horas.<\/li>\n<li>Control de vacío igual que en el baño María. Rotular con fecha.<\/li>\n<\/ol>\n<p><strong>Aun así:<\/strong> toda conserva casera de verduras o legumbres se hierve 10 minutos antes de comerla (20 minutos por encima de 2.000 m de altura).<\/p>"}]},{"t":"Fermentar, secar, ahumar y salar","s":[{"t":"","h":"<p>Fermentar, secar, ahumar y salar son las formas de conservar que no necesitan frascos al vacío ni tanto combustible.<\/p>"},{"t":"Fermentos [VITAL] (1)","h":"<h3>Fermentos <span class=\"b vital\">VITAL<\/span> (1)<\/h3>\n<p>La fermentación con sal produce ácido láctico, que conserva la verdura y le suma vitaminas. No necesita fuego ni azúcar.<\/p>\n<p><strong>Chucrut (repollo fermentado)<\/strong><\/p>\n<ol>\n<li>Pesar el repollo cortado en tiras finas. Por cada kilo, <strong>20 g de sal<\/strong> (una cucharada sopera rasa y media), sin yodo si se consigue, aunque la yodada también funciona.<\/li>\n<li>Mezclar y apretar con las manos 10 minutos hasta que largue su jugo.<\/li>\n<li>Meterlo bien apretado en un frasco o balde de vidrio, cerámica o plástico apto alimentos. El jugo tiene que cubrir la verdura; si no alcanza, agregar salmuera al 2 % (20 g de sal por litro de agua).<\/li>\n<li>Poner un peso encima (una bolsa con agua, un plato con una piedra limpia) para que nada quede afuera del líquido.<\/li>\n<li>Tapar con un trapo. Fermentar a 18 a 22 °C de 3 a 6 semanas. Probarlo desde la segunda semana.<\/li>\n<li>Está bien si huele ácido y agradable. Si hay moho arriba, sacarlo; si la verdura de abajo está blanda, rosada oscura o huele a podrido, tirar todo.<\/li>\n<\/ol>\n<p><strong>Otras verduras en salmuera:<\/strong> zanahoria, coliflor, pepino, ají, remolacha. Salmuera al 3 a 5 % (30 a 50 g de sal por litro), mismo método.<\/p>\n<p><strong>Kimchi (sin pescado)<\/strong><\/p>\n<p>Es el fermento coreano: col fermentada con ajo y ají. La técnica es la del chucrut; cambian el corte y los condimentos.<\/p>\n<ol>\n<li><strong>Salar:<\/strong> 1 kg de repollo (o repollo chino) cortado en trozos de 4 cm, sumergido 2 a 3 horas en salmuera fuerte (100 g de sal por litro), dando vuelta cada tanto, hasta que las hojas se doblen sin quebrarse. Enjuagar tres veces en agua fría y escurrir bien.<\/li>\n<li><strong>Pasta:<\/strong> 4 dientes de ajo y un trozo de jengibre (si hay) machacados, 2 a 4 cucharadas de ají molido o pimentón picante, 1 cucharada de azúcar o miel, y 1 cucharadita de sal. Para que se pegue, mezclar con 2 cucharadas de harina (de arroz o de trigo) cocida unos minutos en medio vaso de agua y enfriada.<\/li>\n<li><strong>Mezclar<\/strong> el repollo con la pasta y con 1 zanahoria y 1 nabo o rabanito en tiras finas, y 3 o 4 cebollas de verdeo cortadas. Guantes: el ají quema.<\/li>\n<li><strong>Envasar<\/strong> bien apretado en frascos, aplastando hasta que el jugo cubra todo, dejando 3 cm libres arriba.<\/li>\n<li><strong>Fermentar<\/strong> 1 a 3 días a temperatura ambiente (abrir la tapa una vez por día para que salga el gas y aplastar), y después pasar al lugar más fresco de la casa o al sótano. Se come desde la semana; mejora durante un mes y dura varios meses al fresco.<\/li>\n<\/ol>\n<p>Las señales de que salió bien o mal son las mismas que en el chucrut (arriba).<\/p>\n<p><strong>Picante fermentado (salsa de ají)<\/strong><\/p>\n<p>Conserva la cosecha de ají todo el año y da sabor a legumbres y guisos sin carne.<\/p>\n<ol>\n<li>500 g de ajíes picantes (con o sin semillas, según el picor que se quiera), 4 dientes de ajo y, si se quiere, una zanahoria o un morrón para suavizar. Picar grueso. Guantes.<\/li>\n<li>Pasar a un frasco y cubrir con salmuera al 3 % (30 g de sal por litro). Peso encima para que todo quede sumergido.<\/li>\n<li>Fermentar a temperatura ambiente <strong>1 a 3 semanas<\/strong>, abriendo cada uno o dos días para que salga el gas. Está listo cuando huele ácido y el líquido se puso turbio.<\/li>\n<li>Licuar o moler en el mortero con un poco de la salmuera y medio vaso de vinagre. Colar si se quiere una salsa lisa.<\/li>\n<li>Embotellar y guardar al fresco: dura meses.<\/li>\n<\/ol>"},{"t":"Tomates secos con sal [VITAL] (3)","h":"<h3>Tomates secos con sal <span class=\"b vital\">VITAL<\/span> (3)<\/h3>\n<p>En zonas secas y soleadas como Cuyo, el NOA o el Alto Valle es uno de los mejores métodos.<\/p>\n<ol>\n<li>Tomates perita bien maduros, cortados a lo largo por la mitad.<\/li>\n<li>Espolvorear con sal fina (1 cucharadita cada kilo) y poner con el corte hacia arriba sobre malla o cañas.<\/li>\n<li>Secar al sol 4 a 7 días, tapados con tul contra las moscas, entrándolos a la noche.<\/li>\n<li>Están listos cuando quedan como cuero, flexibles y sin humedad al apretar.<\/li>\n<li>Guardarlos <strong>secos<\/strong> en frascos o bolsas de tela, en lugar seco. Para comer, hidratarlos en agua caliente.<\/li>\n<\/ol>\n<p>No guardarlos en aceite fuera de la heladera.<\/p>"},{"t":"Verduras y hierbas en sal [AÑOS]","h":"<h3>Verduras y hierbas en sal <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Una conserva vieja del campo europeo que no necesita frío, fuego ni frascos al vacío: la sal en alta proporción impide que crezca nada. Cada cucharada reemplaza a la sal en sopas, guisos y salsas, y les da el gusto de la verdura fresca en pleno invierno.<\/p>\n<ol>\n<li>Picar fino 1 kg de verduras y hierbas mezcladas: puerro, apio con hojas, perejil, cebolla de verdeo, zanahoria rallada, cilantro, ciboulette.<\/li>\n<li>Mezclar con <strong>200 g de sal gruesa<\/strong> (una parte de sal cada cinco de verdura) en una fuente, y dejar una hora hasta que larguen jugo.<\/li>\n<li>Llenar frascos apretando bien, hasta que el jugo cubra todo. Tapar.<\/li>\n<li>Guardar en lugar fresco y oscuro. Dura de 6 meses a un año.<\/li>\n<\/ol>\n<p><strong>Al usarla:<\/strong> no agregar más sal a la olla; una cucharada sopera por litro de sopa.<\/p>"},{"t":"Secado y deshidratado [VITAL] (7, 8, 15)","h":"<h3>Secado y deshidratado <span class=\"b vital\">VITAL<\/span> (7, 8, 15)<\/h3>\n<p><strong>Secadero solar:<\/strong> una caja de madera inclinada hacia el norte, con fondo pintado de negro, bandejas de malla mosquitera, tapa de vidrio o nylon, y aberturas con malla abajo (entra aire) y arriba (sale aire caliente). Seca en la mitad de tiempo que al aire libre y protege de moscas y lluvia.<\/p>\n<table>\n<thead>\n<tr>\n<th>Alimento<\/th>\n<th>Preparación<\/th>\n<th>Está seco cuando<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Manzana, pera, membrillo<\/td>\n<td>Rodajas de 5 mm, pasar por agua con limón<\/td>\n<td>Flexible, sin jugo<\/td>\n<\/tr>\n<tr>\n<td>Durazno, damasco, ciruela<\/td>\n<td>En mitades sin carozo<\/td>\n<td>Como cuero<\/td>\n<\/tr>\n<tr>\n<td>Uva<\/td>\n<td>Entera, escaldada 30 segundos<\/td>\n<td>Pasa<\/td>\n<\/tr>\n<tr>\n<td>Higos<\/td>\n<td>Enteros o en mitades<\/td>\n<td>Pegajosos por fuera, secos por dentro<\/td>\n<\/tr>\n<tr>\n<td>Zapallo, zanahoria, chauchas, repollo<\/td>\n<td>Cortar fino y <strong>blanquear 2 o 3 minutos<\/strong> en agua hirviendo<\/td>\n<td>Quebradizos<\/td>\n<\/tr>\n<tr>\n<td>Pimientos y ajíes<\/td>\n<td>Cortados o enteros colgados en ristra<\/td>\n<td>Quebradizos (se muelen para pimentón)<\/td>\n<\/tr>\n<tr>\n<td>Hierbas (orégano, tomillo, menta, laurel)<\/td>\n<td>Ramitos colgados boca abajo a la sombra<\/td>\n<td>Las hojas se desarman<\/td>\n<\/tr>\n<tr>\n<td>Maíz dulce (choclo)<\/td>\n<td>Desgranar el choclo cocido<\/td>\n<td>Grano duro<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Sopas instantáneas caseras (8):<\/strong> verduras secas molidas gruesas, mezcladas con harina de legumbres (lenteja o arveja) y sal. Una taza en un litro de agua hirviendo, 15 minutos. Guardar en frascos secos.<\/p>\n<p><strong>Las hierbas (15)<\/strong> se guardan enteras y se trituran al usarlas: duran más aromáticas.<\/p>\n<p><strong>Cuero de fruta.<\/strong> Puré de fruta secado en lámina fina: aprovecha la fruta golpeada o muy madura, no lleva azúcar y es una golosina para los chicos.<\/p>\n<ol>\n<li>Pisar o licuar la fruta (manzana y pera cocidas, durazno, damasco, ciruela, uva sin semillas, frutilla) y colar si tiene piel dura. Si es muy ácida, una cucharada de miel por taza.<\/li>\n<li>Extender en 3 a 5 mm sobre bandejas forradas con nylon o papel manteca aceitado.<\/li>\n<li>Secar al sol cubierto con tul o en el secadero solar, 1 a 2 días, hasta que el centro no se pegue al dedo y se despegue entero.<\/li>\n<li>Enrollar con su papel, cortar en tiras y guardar en frascos secos. Dura meses en lugar seco y fresco.<\/li>\n<\/ol>"},{"t":"Ahumado [MEJORA] (5, 6)","h":"<h3>Ahumado <span class=\"b mejora\">MEJORA<\/span> (5, 6)<\/h3>\n<p>En una cocina vegetariana, el ahumado sirve sobre todo para dar sabor y para conservar quesos y pimientos.<\/p>\n<ul>\n<li><strong>Ahumado en frío (5):<\/strong> el humo pasa por un caño de 2 a 3 m desde un fogón hasta un cajón o tambor, y llega frío (menos de 30 °C). Para quesos estacionados y ajos. Varias horas a días.<\/li>\n<li><strong>Ahumado en caliente (6):<\/strong> el alimento sobre el fuego tapado, con aserrín de madera dura o de frutal húmedo. Para pimientos (pimentón ahumado), ajíes y tofu.<\/li>\n<li>Usar solo maderas de frutales, roble o algarrobo, nunca pino, eucalipto ni maderas pintadas o tratadas.<\/li>\n<\/ul>"},{"t":"Sal [VITAL]","h":"<h3>Sal <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Sin sal no hay chucrut, aceitunas, quesos ni tomates secos, y el cuerpo la necesita. Es lo más barato y lo que nunca vence: comprar ahora.<\/p>\n<ul>\n<li><strong>Cuánto guardar:<\/strong> entre 5 y 10 kg por persona por año contando las conservas.<\/li>\n<li><strong>Que sea yodada<\/strong> (en Argentina la sal de mesa es yodada por ley): la falta de yodo produce bocio y, en embarazadas, daño al desarrollo del bebé. Guardarla en recipientes cerrados y oscuros para que el yodo no se pierda.<\/li>\n<li><strong>De dónde sale en Argentina:<\/strong> salinas de Jujuy y Salta (Salinas Grandes), Córdoba, La Pampa, y en Río Negro la Salina del Gualicho, cerca de San Antonio Oeste. Las comunidades cercanas a salinas tendrán algo valioso para intercambiar.<\/li>\n<li><strong>Sacar sal de agua salada:<\/strong> filtrar el agua por tela, evaporarla en bandejas al sol o hervirla hasta que queden cristales. Esa sal no tiene yodo.<\/li>\n<\/ul>"},{"t":"Harina de legumbres (19)","h":"<h3>Harina de legumbres (19)<\/h3>\n<p>tostar legumbres secas en una sartén hasta que doren apenas, moler fino y tamizar. Sirve para faina, rebozar, espesar sopas y para la sopa instantánea.<\/p>"}]},{"t":"Guardar sin heladera","s":[{"t":"","h":"<p>Sin heladera, el frío y la oscuridad del subsuelo, la evaporación y la grasa clarificada hacen el trabajo. Para guardar medicamentos en frío <span class=\"ref\">►<\/span> Manual médico T2 15.13.<\/p>"},{"t":"Guardar sin heladera: frío natural [AÑOS] (16, 17)","h":"<h3>Guardar sin heladera: frío natural <span class=\"b anos\">AÑOS<\/span> (16, 17)<\/h3>\n<p><strong>Sótano o pozo frío.<\/strong> Bajo tierra, la temperatura se mantiene entre 5 y 15 °C casi todo el año. Un pozo de 1,5 a 2 m con techo, puerta aislada y un caño de ventilación, o un cuarto semienterrado con paredes de barro y techo cubierto de tierra.<\/p>\n<table>\n<thead>\n<tr>\n<th>Producto<\/th>\n<th>Cómo guardarlo<\/th>\n<th>Duración aproximada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Papa<\/td>\n<td>Oscuridad total (al sol se ponen verdes: la parte verde es tóxica, se corta), en cajones, lejos de las manzanas<\/td>\n<td>4 a 6 meses<\/td>\n<\/tr>\n<tr>\n<td>Zanahoria, remolacha, nabo<\/td>\n<td>Sin hojas, enterradas en cajones con arena apenas húmeda (16)<\/td>\n<td>4 a 6 meses<\/td>\n<\/tr>\n<tr>\n<td>Zapallo anco y criollo<\/td>\n<td>Con el cabo, curado 10 días al sol, en estantes sin tocarse<\/td>\n<td>6 a 10 meses<\/td>\n<\/tr>\n<tr>\n<td>Cebolla y ajo<\/td>\n<td>Secados al sol, trenzados o en redes, colgados en lugar seco<\/td>\n<td>6 a 9 meses<\/td>\n<\/tr>\n<tr>\n<td>Manzana y pera<\/td>\n<td>Envueltas una por una en papel, en cajones, separadas de las verduras<\/td>\n<td>3 a 6 meses<\/td>\n<\/tr>\n<tr>\n<td>Repollo<\/td>\n<td>Con raíz, colgado boca abajo<\/td>\n<td>2 a 4 meses<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Silo de papas a campo:<\/strong> sobre un lecho de paja, un montón de papas tapado con 20 cm de paja y 20 cm de tierra, con un tubo de paja arriba para que respire. Sirve donde la tierra no se congela profundo.<\/p>\n<p><strong>Heladera de barro (zeer, 17):<\/strong> una vasija de barro sin esmaltar dentro de otra más grande, con arena húmeda entre las dos y un trapo mojado arriba. El agua que se evapora enfría el interior. Funciona en clima seco y con viento (muy bien en Cuyo y Patagonia), mal en clima húmedo. Se moja la arena dos veces por día.<\/p>"},{"t":"Huevos sin heladera [AÑOS] (18)","h":"<h3>Huevos sin heladera <span class=\"b anos\">AÑOS<\/span> (18)<\/h3>\n<ul>\n<li>Los huevos de las propias gallinas, <strong>sin lavar<\/strong> (la cáscara tiene una película que los protege), duran 2 a 3 semanas a temperatura fresca de ambiente.<\/li>\n<li><strong>En agua de cal<\/strong>, hasta 8 meses: en un balde de plástico o vidrio, disolver 30 g de cal hidratada por litro de agua. Poner huevos limpios sin lavar, sin fisuras, con la punta hacia abajo. Tapar y guardar al fresco. Al usarlos, enjuagarlos y romperlos de a uno en una taza antes de usarlos.<\/li>\n<li>Para saber si un huevo está fresco: en un vaso de agua, el fresco queda acostado en el fondo; el que flota, se tira.<\/li>\n<\/ul>"},{"t":"Manteca clarificada (ghee) [AÑOS] (13)","h":"<h3>Manteca clarificada (ghee) <span class=\"b anos\">AÑOS<\/span> (13)<\/h3>\n<p>Dura meses sin heladera, a diferencia de la manteca. Derretir manteca a fuego muy bajo, sin revolver, 20 a 30 minutos, hasta que la espuma de arriba se aclare y los sólidos del fondo se doren apenas. Colar por una tela a frascos limpios y secos. Usar siempre una cuchara seca: el agua la arruina.<\/p>"},{"t":"Plagas de la despensa [VITAL]","h":"<h3>Plagas de la despensa <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Una plaga puede perder en un mes la mitad del grano de un año.<\/p>\n<table>\n<thead>\n<tr>\n<th>Plaga<\/th>\n<th>Señal<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gorgojos y polillas del grano<\/td>\n<td>Bichitos, telitas, grano agujereado, harina apelmazada<\/td>\n<td>Calentar el grano en horno a 60 °C durante 30 minutos, o 4 días en freezer si hay. Envases herméticos. Tierra de diatomeas apta alimentos mezclada con el grano<\/td>\n<\/tr>\n<tr>\n<td>Ratas y lauchas<\/td>\n<td>Cacas negras, bolsas roídas<\/td>\n<td>Todo en recipientes de metal o plástico duro con tapa; trampas; un gato; nada de comida en el piso; tapar agujeros con malla y cemento<\/td>\n<\/tr>\n<tr>\n<td>Hormigas<\/td>\n<td>Caminos de hormigas<\/td>\n<td>Patas de los estantes en latas con agua<\/td>\n<\/tr>\n<tr>\n<td>Humedad y moho<\/td>\n<td>Olor a humedad, manchas<\/td>\n<td>Ventilar, secar el grano al sol; lo enmohecido no se come ni se da a los animales<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Revisar la despensa una vez por semana. Separar enseguida lo infestado para que no pase al resto.<\/p>"}]},{"t":"Cocinar sin red","s":[{"t":"","h":"<p>Con harina, legumbres, leche, huevos y verdura se arma una cocina completa, si se aprende a hacer el pan, el queso y las legumbres con poco combustible. Las recetas de este capítulo usan cantidades para una familia de 4.<\/p>"},{"
