as). Si salpica en la piel: mucha agua corriente 15 minutos. En los ojos: agua corriente 15 a 20 minutos sin parar <span class=\"ref\">►<\/span> Manual médico T1 3.25. Si alguien la toma <span class=\"ref\">►<\/span> T1 3.33. Guardar la soda con candado, rotulada, lejos de alimentos.<\/p>\n<\/div>"},{"t":"Jabón de aceite vegetal [VITAL] (150, 175)","h":"<h3>Jabón de aceite vegetal <span class=\"b vital\">VITAL<\/span> (150, 175)<\/h3>\n<p><strong>La cuenta.<\/strong> Cada aceite necesita una cantidad exacta de soda para convertirse en jabón. Se calcula con su índice de saponificación y se usa un 7 % menos para que sobre un poco de aceite y el jabón no sea agresivo:<\/p>\n<div class=\"formula\">soda (gramos) = aceite (gramos) × índice de soda × 0,93<\/div>\n\n<table>\n<thead>\n<tr>\n<th>Grasa o aceite<\/th>\n<th>Índice de soda (g de soda por g de aceite)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Girasol<\/td>\n<td>0,134<\/td>\n<\/tr>\n<tr>\n<td>Maíz<\/td>\n<td>0,136<\/td>\n<\/tr>\n<tr>\n<td>Soja<\/td>\n<td>0,135<\/td>\n<\/tr>\n<tr>\n<td>Oliva<\/td>\n<td>0,135<\/td>\n<\/tr>\n<tr>\n<td>Coco<\/td>\n<td>0,183<\/td>\n<\/tr>\n<tr>\n<td>Manteca de leche<\/td>\n<td>0,162<\/td>\n<\/tr>\n<tr>\n<td>Cera de abeja (hasta 5 % de la receta)<\/td>\n<td>0,069<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Receta A — Jabón de girasol (blando, para ropa y limpieza)<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Ingrediente<\/th>\n<th>Cantidad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Aceite de girasol (nuevo o usado y filtrado)<\/td>\n<td>1.000 g<\/td>\n<\/tr>\n<tr>\n<td>Soda cáustica en escamas, pura<\/td>\n<td>125 g<\/td>\n<\/tr>\n<tr>\n<td>Agua (de lluvia, hervida o sin cloro)<\/td>\n<td>330 g<\/td>\n<\/tr>\n<tr>\n<td>Sal fina (lo endurece un poco)<\/td>\n<td>10 g<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Receta B — Jabón más duro, para el cuerpo<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Ingrediente<\/th>\n<th>Cantidad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Aceite de girasol<\/td>\n<td>700 g<\/td>\n<\/tr>\n<tr>\n<td>Aceite de coco<\/td>\n<td>300 g<\/td>\n<\/tr>\n<tr>\n<td>Soda cáustica<\/td>\n<td>138 g<\/td>\n<\/tr>\n<tr>\n<td>Agua<\/td>\n<td>330 g<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Para cambiar la receta, recalcular la soda con la fórmula y la tabla. <strong>Pesar siempre con balanza, nunca con tazas.<\/strong><\/p>\n<p><strong>Pasos (método en frío)<\/strong><\/p>\n<ol>\n<li>Equiparse (guantes, antiparras) y trabajar afuera.<\/li>\n<li>Pesar el agua en un recipiente de plástico duro. Echar la soda de a poco revolviendo con una cuchara de acero o madera. Se calienta mucho y larga vapores: no respirarlos. Dejar enfriar hasta 40 a 45 °C.<\/li>\n<li>Si el aceite es usado: filtrarlo por una tela, y para sacarle el olor hervirlo 10 minutos con el mismo volumen de agua y un puñado de sal, dejar enfriar y separar el aceite de arriba.<\/li>\n<li>Calentar el aceite a 40 a 45 °C.<\/li>\n<li>Volcar despacio la soda disuelta sobre el aceite revolviendo, y seguir batiendo (con cuchara, con batidor, o con mixer) hasta la <strong>traza<\/strong>: la mezcla se espesa como una crema pastelera y una gota que cae deja marca en la superficie. Puede tardar de 10 minutos a una hora.<\/li>\n<li>Volcar en moldes (cajas de cartón forradas con nylon, envases de plástico). Tapar y abrigar con una frazada 24 a 48 horas.<\/li>\n<li>Desmoldar con guantes y cortar en panes.<\/li>\n<li><strong>Curar 4 a 6 semanas<\/strong> en un lugar seco y aireado, dando vuelta cada tanto. Antes de eso todavía puede irritar.<\/li>\n<\/ol>\n<p><strong>¿Está bien hecho?<\/strong> Un jabón curado hace espuma, no pica en la piel húmeda y no tiene gotas aceitosas ni cristales blancos duros. Si pica o tiene cristales, tiene exceso de soda: no usarlo en el cuerpo, rallarlo para lavar pisos.<\/p>\n<p><strong>Jabón con hierbas y aroma.<\/strong> El perfume no limpia más, pero hace el jabón más agradable y más fácil de intercambiar. Cuatro formas, que se pueden combinar:<\/p>\n<ul>\n<li><strong>Aceite macerado:<\/strong> llenar un frasco con hierbas bien secas (lavanda, romero, caléndula, menta, eucalipto), cubrir con el aceite de la receta y dejar 2 a 4 semanas al sol, agitando cada día. Colar y usar ese aceite en la receta. Las hierbas tienen que estar <strong>secas<\/strong>: con humedad, el aceite se enmohece.<\/li>\n<li><strong>Infusión en lugar de agua:<\/strong> hacer un té fuerte con las hierbas, colarlo, dejarlo enfriar del todo y pesarlo como el agua de la receta antes de disolver la soda. La soda oscurece casi todos los tés: el jabón sale amarillento o marrón, pero funciona igual.<\/li>\n<li><strong>Hierbas molidas a la traza:<\/strong> una cucharada sopera de hierbas secas bien molidas por kilo de aceite, mezclada justo al llegar a la traza. Dan textura exfoliante y pintitas; la lavanda y el romero son las que mejor conservan algo de aroma.<\/li>\n<li><strong>Aceites esenciales,<\/strong> si se consiguen: 20 a 30 g por kilo de aceite, a la traza. Son lo único que deja un perfume que dura meses.<\/li>\n<\/ul>\n<p><strong>Color natural:<\/strong> pimentón dulce o cúrcuma (anaranjado), arcilla (rosado o verde), carbón vegetal molido muy fino (gris). Una cucharadita por kilo, disuelta en un poco de aceite antes de agregarla a la traza.<\/p>"},{"t":"Lejía de cenizas y jabón blando [AÑOS] (179)","h":"<h3>Lejía de cenizas y jabón blando <span class=\"b anos\">AÑOS<\/span> (179)<\/h3>\n<p>Cuando se termina la soda cáustica, la ceniza de leña da una lejía que hace jabón blando (en pasta o líquido), como se hizo durante siglos.<\/p>\n<p><strong>Hacer la lejía<\/strong><\/p>\n<ol>\n<li>Ceniza blanca y fina de leña dura bien quemada, tamizada. Sin restos de plástico, papel impreso ni maderas pintadas.<\/li>\n<li>Un balde o barril con agujeros en el fondo, sobre otro recipiente. En el fondo, una capa de piedras y otra de paja.<\/li>\n<li>Llenar con ceniza y echar agua de lluvia de a poco, lentamente, para que pase a través.<\/li>\n<li>Lo que gotea, marrón, es la lejía. Volver a pasarla por la ceniza para concentrarla.<\/li>\n<li><strong>Prueba de fuerza tradicional:<\/strong> un huevo fresco flota mostrando una parte del tamaño de una moneda. Si se hunde, está floja: hervirla para concentrarla. Si flota mucho, está muy fuerte: agregar agua.<\/li>\n<\/ol>\n<p>Es tan cáustica como la soda: mismos cuidados.<\/p>\n<p><strong>Jabón blando:<\/strong> en una olla de hierro o acero inoxidable, 1 parte de aceite o manteca y 2 partes de lejía, hervir a fuego bajo revolviendo varias horas, agregando lejía de a poco, hasta que quede una pasta translúcida y espesa que no se separa. Se guarda en frascos. Sirve para lavar ropa, platos y pisos.<\/p>"},{"t":"Detergente y jabón líquido caseros [MEJORA] (176)","h":"<h3>Detergente y jabón líquido caseros <span class=\"b mejora\">MEJORA<\/span> (176)<\/h3>\n<ul>\n<li><strong>Jabón líquido o gel:<\/strong> 100 g de jabón rallado en 2 litros de agua caliente, revolver hasta disolver, dejar enfriar. Se pone en gel. Sirve para platos, ropa y manos.<\/li>\n<li><strong>Para ollas quemadas:<\/strong> ceniza fina o arena con un poco de agua, como pulidor.<\/li>\n<li><strong>Vinagre:<\/strong> limpia sarro, olores y vidrios; diluido 1 en 1 con agua.<\/li>\n<\/ul>"},{"t":"Desinfectar superficies y alimentos [VITAL] (151)","h":"<h3>Desinfectar superficies y alimentos <span class=\"b vital\">VITAL<\/span> (151)<\/h3>\n<p>Tabla completa de diluciones, alcohol y esterilización de material <span class=\"ref\">►<\/span> Manual médico T2 15.4 y 15.5.<\/p>\n<table>\n<thead>\n<tr>\n<th>Uso<\/th>\n<th>Preparación con lavandina común<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mesadas, baño, picaportes<\/td>\n<td>1 cucharada sopera (10 ml) en 1 litro de agua. Preparar en el día: pierde fuerza<\/td>\n<\/tr>\n<tr>\n<td>Pisos<\/td>\n<td>Medio pocillo de café (50 ml) en un balde de 5 litros<\/td>\n<\/tr>\n<tr>\n<td>Verduras que se comen crudas<\/td>\n<td>Lavarlas primero con agua segura; después remojar unos minutos en agua con las mismas gotas que se usan para potabilizar (2 a 4 por litro) y enjuagar<\/td>\n<\/tr>\n<tr>\n<td>Bidones y recipientes de agua<\/td>\n<td>1 cucharada en 1 litro, agitar, tirar y enjuagar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Nunca mezclar lavandina con detergente, vinagre, amoníaco ni otros limpiadores:<\/strong> larga gases tóxicos.<\/p>"},{"t":"Lavar ropa a mano [VITAL] (172)","h":"<h3>Lavar ropa a mano <span class=\"b vital\">VITAL<\/span> (172)<\/h3>\n<ol>\n<li><strong>Separar:<\/strong> blanca, de color, muy sucia (de trabajo), pañales.<\/li>\n<li><strong>Remojo:<\/strong> toda la noche en agua con un poco de jabón. Ahorra la mitad del refregado.<\/li>\n<li><strong>Refregar<\/strong> sobre una tabla de lavar (una tabla con estrías o una chapa acanalada) con jabón en barra, insistiendo en cuellos, puños y rodillas.<\/li>\n<li><strong>Enjuagar<\/strong> en dos aguas. El agua del segundo enjuague puede usarse para el primer remojo de la tanda siguiente; el resto, para riego (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"1\" data-s=\"0\">cap. 2<\/a>).<\/li>\n<li><strong>Escurrir<\/strong> torciendo entre dos personas, o con un rodillo.<\/li>\n<li><strong>Secar al sol<\/strong>, que desinfecta. En invierno, cerca de la estufa pero nunca encima.<\/li>\n<\/ol>\n<p><strong>Lavarropas manual:<\/strong> un balde de 20 litros con tapa con un agujero, y un desatascador de inodoro (sopapa) nuevo que se mueve arriba y abajo a través del agujero. Es mucho menos cansador que refregar todo.<\/p>"},{"t":"Higiene personal sin red (149)","h":"<h3>Higiene personal sin red (149)<\/h3>\n<ul>\n<li><strong>Lavarse las manos<\/strong> con jabón después del baño, antes de cocinar y de comer, y después de tocar animales: es la regla que más enfermedades corta. Una estación de lavado en cada lugar clave: un bidón con canilla, un jabón atado con una media y un balde abajo.<\/li>\n<li><strong>Baño con poca agua:<\/strong> palangana y jarro, de arriba hacia abajo, empezando por la cara y terminando por los pies. Agua tibia del calefón solar o de la olla.<\/li>\n<li><strong>Dientes:<\/strong> cepillo de dientes de repuesto para cada persona (guardar varios); si se terminan, una ramita masticada en la punta hasta que quede como pincel. Bicarbonato o sal fina en lugar de pasta. Lo médico <span class=\"ref\">►<\/span> Manual médico T1 bloque 9.<\/li>\n<li><strong>Ropa de cama:<\/strong> airear al sol todas las semanas.<\/li>\n<li>Piojos, sarna y paspaduras <span class=\"ref\">►<\/span> Manual médico T1 4.60, 4.61 y 5.13.<\/li>\n<\/ul>\n<p><strong>Desodorante casero.<\/strong> En una comunidad que vive apretada y con poca agua, el olor corporal genera roces. Lo primero es lavar las axilas con agua y jabón todos los días; después, cualquiera de estos:<\/p>\n<ul>\n<li><strong>Piedra de alumbre:<\/strong> se moja y se pasa por la piel limpia. Una piedra dura años y es el mismo alumbre que se usa para teñir lana y curtir pieles: comprar ahora.<\/li>\n<li><strong>Polvo:<\/strong> 2 partes de almidón de maíz y 1 de bicarbonato, en un frasco, aplicado con un trapito o los dedos. Si irrita, menos bicarbonato o solo almidón.<\/li>\n<li><strong>Barra:<\/strong> derretir a baño María 2 cucharadas de cera de abeja con 3 de aceite, sacar del fuego y agregar 3 cucharadas de almidón y 1 o 2 de bicarbonato. Volcar en un envase viejo de desodorante o en un frasquito y dejar endurecer.<\/li>\n<li><strong>Rociador:<\/strong> vinagre (de manzana o común) con la misma cantidad de agua, o alcohol fino diluido a la mitad, con unas hojas de romero o salvia maceradas una semana.<\/li>\n<\/ul>\n<p>La ropa de algodón o lana, lavada seguido y secada al sol, retiene mucho menos olor que la sintética.<\/p>"}]}]},{"id":"COM","title":"Familia y comunidad","sub":"72 horas, niños, escuela, organización, seguridad","color":"#6a4a8a","kind":"md","c":[{"t":"Las primeras 72 horas y el primer mes","s":[{"t":"","h":"<p>En los primeros tres días el orden es siempre el mismo: agua segura, calor y refugio, comida que no se eche a perder, y saber con quién se cuenta. Lo que se haga en esos días define cuánto alcanzan las reservas.<\/p>"},{"t":"Orden de prioridades","h":"<h3>Orden de prioridades<\/h3>\n<ol>\n<li><strong>Agua.<\/strong> Llenar todo recipiente limpio mientras la canilla todavía tenga presión: bañera, bidones, ollas, el tanque. Cerrar la llave de paso de la calle si hay riesgo de contaminación de la red. Calcular 4 litros por persona por día (beber y cocinar) y 2 más para higiene mínima.<\/li>\n<li><strong>Calor y refugio.<\/strong> Juntar a toda la familia en el ambiente más chico y fácil de calentar. En invierno, tapar ventanas con frazadas o cartón y dormir juntos.<\/li>\n<li><strong>Comida del freezer y la heladera primero.<\/strong> Sin luz, la heladera aguanta unas 4 horas cerrada y un freezer lleno unas 48. Comer primero lo perecedero, después lo fresco y por último los secos.<\/li>\n<li><strong>Inventario.<\/strong> Contar todo lo que hay (ver la tabla de abajo). Sin números no se puede racionar.<\/li>\n<li><strong>Personas.<\/strong> Saber dónde está cada miembro de la familia y acordar un punto de encuentro. Hablar con los vecinos: quién tiene pozo, quién tiene niños chicos, quién sabe de qué.<\/li>\n<li><strong>Fuego seguro.<\/strong> Si se cocina o calefacciona con fuego dentro de la casa, ventilar siempre. El monóxido de carbono no tiene olor y mata durmiendo.<\/li>\n<\/ol>"},{"t":"Inventario del primer día","h":"<h3>Inventario del primer día<\/h3>\n<table>\n<thead>\n<tr>\n<th>Rubro<\/th>\n<th>Qué contar<\/th>\n<th>Unidad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agua<\/td>\n<td>Litros guardados y fuente más cercana<\/td>\n<td>litros<\/td>\n<\/tr>\n<tr>\n<td>Secos<\/td>\n<td>Arroz, fideos, harina, legumbres, azúcar, sal, leche en polvo<\/td>\n<td>kg<\/td>\n<\/tr>\n<tr>\n<td>Grasas<\/td>\n<td>Aceite, manteca<\/td>\n<td>litros / kg<\/td>\n<\/tr>\n<tr>\n<td>Combustible<\/td>\n<td>Gas en garrafa, leña, querosene, nafta<\/td>\n<td>kg / litros / m³<\/td>\n<\/tr>\n<tr>\n<td>Luz<\/td>\n<td>Pilas, velas, linternas, fósforos y encendedores<\/td>\n<td>unidades<\/td>\n<\/tr>\n<tr>\n<td>Higiene<\/td>\n<td>Jabón, lavandina, papel, toallitas, pañales<\/td>\n<td>unidades / litros<\/td>\n<\/tr>\n<tr>\n<td>Semillas<\/td>\n<td>Sobres de semillas y legumbres secas que se puedan sembrar<\/td>\n<td>variedad y gramos<\/td>\n<\/tr>\n<tr>\n<td>Herramientas<\/td>\n<td>Pala, azada, hacha, serrucho, cuchillos, baldes<\/td>\n<td>unidades<\/td>\n<\/tr>\n<tr>\n<td>Personas<\/td>\n<td>Edades, embarazos, bebés, ancianos, necesidades especiales<\/td>\n<td>lista<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Primer mes: qué tiene que estar funcionando","h":"<h3>Primer mes: qué tiene que estar funcionando<\/h3>\n<ul>\n<li>☐ Una fuente de agua que no dependa de la red, y un método para potabilizarla <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 1<\/a>.<\/li>\n<li>☐ Un baño seco o letrina lejos del agua <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"1\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 2<\/a>.<\/li>\n<li>☐ Un fuego para cocinar que gaste poca leña (estufa rocket o caja térmica).<\/li>\n<li>☐ La huerta sembrada, aunque sea chica, según la estación.<\/li>\n<li>☐ Raciones calculadas por persona y por semana <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"7\" data-s=\"0\">Nutrición §7<\/a> y <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 1<\/a>.<\/li>\n<li>☐ Una rutina diaria para los chicos (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\">cap. 2<\/a>).<\/li>\n<li>☐ Una reunión semanal con vecinos para repartir tareas (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">cap. 4<\/a>).<\/li>\n<li>☐ Un cuaderno de registro con el inventario actualizado.<\/li>\n<\/ul>"},{"t":"Errores frecuentes del primer mes","h":"<h3>Errores frecuentes del primer mes<\/h3>\n<ul>\n<li><strong>Comer normal la primera semana.<\/strong> Racionar desde el día uno: es más fácil aflojar después que ajustar tarde.<\/li>\n<li><strong>Gastar el combustible en comodidad.<\/strong> El gas de la garrafa se reserva para hervir agua y cocinar legumbres.<\/li>\n<li><strong>Esconder todo de los vecinos.<\/strong> Las experiencias de crisis reales muestran que sobrevive mejor quien tiene red, no quien tiene más cosas.<\/li>\n<li><strong>No contarles nada a los chicos.<\/strong> Saben que algo pasa; explicarles con palabras simples baja el miedo.<\/li>\n<\/ul>"},{"t":"Cómo reacciona la gente en un desastre [VITAL]","h":"<h3>Cómo reacciona la gente en un desastre <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>La investigación sobre sobrevivientes de desastres muestra que casi todos pasan por tres etapas: <strong>negación<\/strong> (\"no puede ser\", seguir como si nada), <strong>deliberación<\/strong> (juntarse a hablar, buscar qué hacen los demás) y el <strong>momento decisivo<\/strong>, en el que se actúa o uno se paraliza. El pánico descontrolado es mucho más raro que la parálisis: lo común es que la gente se demore.<\/p>\n<p><strong>Qué hacer con eso<\/strong><\/p>\n<ul>\n<li><strong>Acortar la negación:<\/strong> acordar de antemano señales concretas que disparan la acción (\"si el agua del canal llega a tal poste, evacuamos\"; \"si el humo viene hacia el pueblo, salimos\"). No discutir en el momento: aplicar lo acordado.<\/li>\n<li><strong>Acortar la deliberación:<\/strong> decidir hoy quién decide, a dónde se va y por qué camino.<\/li>\n<li><strong>Evitar la parálisis: practicar.<\/strong> El cuerpo hace bajo estrés lo que ya hizo antes. Por eso cada plan de esta biblioteca se ensaya con toda la familia, chicos incluidos.<\/li>\n<\/ul>\n<p><strong>Simulacros por familia, dos veces por año<\/strong> (los de salud, con casos para practicar <span class=\"ref\">►<\/span> Manual médico T2 20.3 a 20.5)<\/p>\n<ul>\n<li>☐ Salida de la casa por incendio, de día y de noche, con punto de encuentro.<\/li>\n<li>☐ Evacuación con mochilas: en cuánto tiempo están todos listos en la puerta.<\/li>\n<li>☐ Un día entero sin luz, gas ni agua de red, usando solo lo guardado.<\/li>\n<li>☐ Volver a casa caminando desde el trabajo o la escuela.<\/li>\n<\/ul>"},{"t":"Quedarse o irse","h":"<h3>Quedarse o irse<\/h3>\n<p><strong>Quedarse en casa (lo más frecuente)<\/strong> cuando la casa está sana, no hay amenaza directa (inundación, incendio, derrumbe) y las reservas están ahí. Es más seguro que salir a la ruta con todos los demás.<\/p>\n<p><strong>Irse<\/strong> cuando hay una amenaza directa que la casa no resiste, cuando las autoridades lo ordenan, o cuando el agua o la comida se van a terminar sin reposición posible. Salir temprano, de día, con un destino concreto (familiares, otra comunidad) y dos rutas posibles.<\/p>\n<p><strong>En la ciudad<\/strong> el agua, la basura y el saneamiento son el problema principal: sin bombeo no sube el agua a los pisos altos y los inodoros no funcionan. Si se queda, guardar más agua, tener el baño seco listo desde el primer día y organizarse por edificio o manzana.<\/p>"},{"t":"Si el problema te agarra lejos de casa","h":"<h3>Si el problema te agarra lejos de casa<\/h3>\n<ul>\n<li>Acordar en familia: quién busca a los chicos en la escuela, y qué hace cada uno si no hay teléfono.<\/li>\n<li><strong>Punto de encuentro<\/strong> fuera de la casa (por si la casa no se puede usar) y un <strong>contacto lejos<\/strong> (un familiar en otra ciudad) a quien todos avisan dónde están.<\/li>\n<li>En el trabajo, tener calzado cómodo, una muda abrigada, agua, algo de comida, linterna y un mapa en papel con la ruta a casa a pie.<\/li>\n<li>Caminando, ir de día, por calles conocidas, mejor en grupo.<\/li>\n<\/ul>"},{"t":"Mochila de evacuación [VITAL]","h":"<h3>Mochila de evacuación <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Una mochila por persona, lista para salir en 5 minutos, con lo necesario para 72 horas. Pesar no más de un quinto del peso de quien la lleva. Revisarla cada seis meses (cambio de estación): agua, comida, ropa del talle actual de los chicos, pilas.<\/p>\n<table>\n<thead>\n<tr>\n<th>Rubro<\/th>\n<th>Contenido<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agua<\/td>\n<td>2 a 3 litros por persona, más pastillas potabilizadoras o un gotero con lavandina apta y un filtro portátil<\/td>\n<\/tr>\n<tr>\n<td>Comida<\/td>\n<td>Para 3 días, que no necesite cocción: galleta marinera, frutos secos, fruta seca, chocolate, barras de cereal, leche en polvo<\/td>\n<\/tr>\n<tr>\n<td>Abrigo<\/td>\n<td>Una muda completa, campera impermeable, gorro, guantes, medias de lana extra; frazada o bolsa de dormir liviana; manta térmica<\/td>\n<\/tr>\n<tr>\n<td>Refugio<\/td>\n<td>Un nylon grande o lona, 15 m de cuerda<\/td>\n<\/tr>\n<tr>\n<td>Fuego<\/td>\n<td>Encendedores, fósforos en frasco, varilla de ferrocerio, yesca<\/td>\n<\/tr>\n<tr>\n<td>Luz<\/td>\n<td>Linterna frontal y pilas de repuesto<\/td>\n<\/tr>\n<tr>\n<td>Herramientas<\/td>\n<td>Cuchillo o navaja, cinta adhesiva gruesa, una olla chica de metal<\/td>\n<\/tr>\n<tr>\n<td>Higiene<\/td>\n<td>Jabón, papel higiénico, toallas femeninas o copa, pañales si hay bebé<\/td>\n<\/tr>\n<tr>\n<td>Botiquín<\/td>\n<td>Según el <span class=\"ref\">►<\/span> Manual médico T1 bloque 10, con medicación crónica para 2 semanas<\/td>\n<\/tr>\n<tr>\n<td>Comunicación<\/td>\n<td>Radio a pilas o a manivela, silbato, cargador solar o batería externa, lista de teléfonos en papel<\/td>\n<\/tr>\n<tr>\n<td>Documentos y dinero<\/td>\n<td>Copias de DNI y documentos importantes en bolsa hermética, algo de efectivo en billetes chicos<\/td>\n<\/tr>\n<tr>\n<td>Para los chicos<\/td>\n<td>Un juguete o peluche, un lápiz y un cuaderno, la tarjeta con su nombre y el punto de encuentro<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Ancianos y personas con discapacidad:<\/strong> medicación, anteojos y audífonos de repuesto, bastón o silla; una persona designada para acompañarlos. <strong>Bebés:<\/strong> pañales, fórmula si toman, un portabebé (fular o mochila) para tener las manos libres.<\/p>"},{"t":"Mascotas y animales en una emergencia (197)","h":"<h3>Mascotas y animales en una emergencia (197)<\/h3>\n<ul>\n<li>Comida y agua para 3 días en la mochila familiar, collar con identificación, correa, y una caja transportadora para gatos.<\/li>\n<li>No dejarlas encerradas en una casa que se evacúa por inundación o incendio.<\/li>\n<li>Los animales de granja (gallinas, cabras) no se pueden llevar en una evacuación rápida: decidir de antemano si se abren los corrales para que puedan escapar.<\/li>\n<li>En una crisis larga, un perro grande come como una persona chica: calcularlo en la despensa. Un buen perro guardián vale lo que come (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\">cap. 6<\/a>).<\/li>\n<\/ul>"}]},{"t":"Niños en el colapso","s":[{"t":"","h":"<p>En las emergencias, los chicos son los primeros en enfermar, desnutrirse y sufrir; también son los que mejor se adaptan si los adultos les dan comida segura, rutina, verdad y tareas con sentido. Este capítulo cubre todo lo que no es salud: alimentación por edad, pañales, ropa, sueño, emociones, juego, escuela, tareas y seguridad. Fiebre, diarrea, heridas, deshidratación y medicación <span class=\"ref\">►<\/span> Manual médico T1 bloque 5 y T2 12.14. <span class=\"b vital\">VITAL<\/span><\/p>"},{"t":"Qué guardar hoy si hay chicos en la casa","h":"<h3>Qué guardar hoy si hay chicos en la casa<\/h3>\n<ul>\n<li>☐ Si hay un bebé que toma fórmula o se espera uno: fórmula infantil para varios meses, tazas y mamaderas extra, una olla solo para hervirlas.<\/li>\n<li>☐ Pañales de tela (24 a 30 por bebé) y cobertores impermeables, aunque hoy se usen descartables.<\/li>\n<li>☐ Calzado y ropa en los dos o tres talles siguientes de cada chico.<\/li>\n<li>☐ Suplementos que indique el pediatra (B12, hierro, vitamina D) para por lo menos un año.<\/li>\n<li>☐ Medicación crónica de cualquier chico (asma, epilepsia, diabetes) <span class=\"ref\">►<\/span> Manual médico T2 bloque 11 y 14.6.<\/li>\n<li>☐ Libros de lectura, de matemática y de ciencias de la escuela primaria y secundaria; cuadernos, lápices, gomas.<\/li>\n<li>☐ Juegos de mesa, pelotas, sogas, mazos de cartas.<\/li>\n<li>☐ Una tarjeta plastificada para cada chico con su nombre, el de sus padres y el punto de encuentro.<\/li>\n<\/ul>"},{"t":"Alimentación por edad","h":"<h3>Alimentación por edad<\/h3>\n<p>Lo nutricional está en <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"7\" data-s=\"0\">Nutrición §7<\/a> y Manual médico T1 5.11; lo médico (diarrea, deshidratación, desnutrición, fiebre) en <span class=\"ref\">►<\/span> Manual médico T1 bloque 5. Aquí, lo práctico para el día a día.<\/p>\n<p><strong>Bebés de 0 a 6 meses:<\/strong> solo leche materna, a demanda. Es el alimento de emergencia más seguro: no necesita agua segura, combustible ni compras. Apoyar a la madre que amamanta: ración extra (unas 500 kcal más por día: un plato más de guiso o pan con queso), agua siempre a mano, prioridad en huevos, leche, legumbres y B12, y descanso: la comunidad le saca otras tareas los primeros meses.<\/p>\n<p><strong>Si la madre no puede amamantar,<\/strong> en este orden <span class=\"ref\">►<\/span> Manual médico T1 5.11: otra mujer sana que amamanta (nodriza), relactación (la madre, o una abuela que amamantó antes, vuelve a producir leche con succión frecuente), fórmula infantil preparada con seguridad. Lo demás, solo como último recurso según el Manual médico.<\/p>\n<p><strong>Lo que NUNCA se le da a un bebé menor de 6 meses:<\/strong> leche de vaca o de cabra entera o \"aguada\", leches vegetales, caldos, agua con azúcar, té o mate; miel hasta el año (botulismo infantil); fórmula más diluida de lo que indica el envase \"para que rinda\".<\/p>\n<p><strong>Preparar fórmula sin agua de red<\/strong><\/p>\n<ol>\n<li>Lavarse las manos.<\/li>\n<li>Agua hervida a borbotones, enfriada tapada hasta tibia. Para bebés, nunca agua solo clorada sin hervir.<\/li>\n<li>Medir exactamente lo que indica el envase: polvo al ras, sin apretar.<\/li>\n<li>Una toma por vez; lo que sobra se tira a la hora.<\/li>\n<li><strong>Mejor taza que mamadera:<\/strong> se lava y desinfecta mucho más fácil, y los bebés aprenden a tomar a sorbos desde recién nacidos. Si se usa mamadera, hervirla 5 minutos con la tetina después de cada uso.<\/li>\n<\/ol>\n<p><strong>De 6 a 12 meses:<\/strong> la leche sigue siendo la base y se suman purés espesos (zapallo, papa, legumbres bien pisadas, yema y clara bien cocidas, cereal cocido con una cucharadita de aceite o manteca), y a partir de los 9 meses trocitos blandos que agarran con la mano. Sin sal ni azúcar agregadas; leche de vaca o cabra hervida como bebida principal recién desde el año.<\/p>\n<p><strong>De 1 a 5 años:<\/strong> 3 comidas y 2 colaciones, densas (guiso espeso con aceite, polenta con huevo, puré con queso): las sopas aguadas llenan sin alimentar. Todos los días leche o yogur, un huevo, legumbre, verdura y fruta. <strong>Riesgo de atragantamiento hasta los 4 o 5 años:<\/strong> maní, nueces y almendras enteras, uvas enteras, pochoclo, zanahoria cruda en rodajas <span class=\"ref\">►<\/span> Manual médico T1 3.1.<\/p>\n<p><strong>Escolares y adolescentes:<\/strong> un adolescente puede comer tanto como un adulto que trabaja; no recortarle la ración por ser \"chico\". Las chicas, desde que menstrúan, necesitan más hierro.<\/p>\n<p><strong>Regla de racionamiento:<\/strong> cuando falta, los chicos, las embarazadas y quienes amamantan son los últimos en recibir menos, y los huevos y la leche van primero para ellos.<\/p>"},{"t":"Pañales e higiene del bebé [VITAL]","h":"<h3>Pañales e higiene del bebé <span class=\"b vital\">VITAL<\/span><\/h3>\n<p><strong>Pañales de tela.<\/strong> Cuadrados de 60 a 70 cm de toalla vieja, franela o gasa doble, doblados en triángulo o en rectángulo, y un cobertor impermeable encima (de nylon, hule, o un pantalón de lana tejida, que repele el agua y respira). Para un bebé hacen falta 24 a 30 pañales para lavar cada uno o dos días.<\/p>\n<p><strong>Lavado<\/strong><\/p>\n<ol>\n<li>La caca se tira en el baño seco o la letrina.<\/li>\n<li>Los pañales sucios van a un balde con tapa, con agua y un chorro de vinagre, hasta el día de lavado.<\/li>\n<li>Lavar con jabón en agua lo más caliente posible, enjuagar bien (el jabón que queda irrita la piel).<\/li>\n<li><strong>Secar al sol:<\/strong> desinfecta y blanquea.<\/li>\n<li>Lavarse las manos después.<\/li>\n<\/ol>\n<p><strong>Toallitas:<\/strong> pañitos de tela con agua tibia, lavados con los pañales. <strong>Paspaduras:<\/strong> dejar al bebé con la cola al aire un rato varias veces por día; si no mejora <span class=\"ref\">►<\/span> Manual médico T1 5.13.<\/p>\n<p><strong>Dejar el pañal:<\/strong> sin pañales descartables, conviene empezar antes. Desde el año, sentarlo en una pelela después de cada comida y al despertar. Desde los 2 años la mayoría puede dejar el pañal de día con paciencia.<\/p>\n<p><strong>Higiene menstrual para adolescentes y mujeres.<\/strong> Toallas de tela de algodón doble con alas que se abrochan, lavadas en agua fría primero y después con jabón y secadas al sol. Las copas menstruales duran años: guardar una por mujer y adolescente. Que ninguna chica falte a la escuela comunitaria por no tener con qué.<\/p>"},{"t":"Dormir [VITAL]","h":"<h3>Dormir <span class=\"b vital\">VITAL<\/span><\/h3>\n<ul>\n<li><strong>Bebés:<\/strong> siempre boca arriba, sobre superficie firme, sin almohadas ni frazadas sueltas sobre la cara, sin sobreabrigar (la nuca tibia, no transpirada). Si duermen en la cama de los padres, nunca en un sillón ni con un adulto que haya tomado alcohol o esté muy agotado o medicado.<\/li>\n<li><strong>Todos:<\/strong> horario fijo de dormir y despertarse, aunque no haya escuela. En invierno, sin luz, se duerme temprano: está bien.<\/li>\n<li>Contra el frío: gorro, medias de lana, bolsas de agua caliente (no hirviendo, envueltas en tela), varios chicos juntos.<\/li>\n<li>Un ritual corto antes de dormir: un cuento, una canción, repasar lo bueno del día.<\/li>\n<\/ul>"},{"t":"Miedo, estrés y duelo [VITAL]","h":"<h3>Miedo, estrés y duelo <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Los chicos perciben todo. Lo que más los protege es un adulto calmo que les diga la verdad con palabras simples y que mantenga una rutina.<\/p>\n<p><strong>Qué decirles<\/strong><\/p>\n<ul>\n<li>La verdad, en tamaño de su edad: \"Se cortó la luz y no hay negocios abiertos por un tiempo. Nosotros tenemos un plan y te vamos a cuidar.\"<\/li>\n<li>No prometer lo que no se sabe (\"mañana vuelve todo\"). Sí prometer lo que se puede cumplir (\"vamos a estar juntos\", \"siempre vas a saber dónde estoy\").<\/li>\n<li>Dejar que pregunten, y contestar lo preguntado, sin agregar detalles que asusten.<\/li>\n<li>Evitar que escuchen conversaciones de adultos llenas de miedo o violencia.<\/li>\n<\/ul>\n<p><strong>Señales de que un chico la está pasando mal<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Edad<\/th>\n<th>Señales frecuentes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0 a 2 años<\/td>\n<td>Llanto que no se calma, rechazo de la comida, se pega al adulto, duerme mal<\/td>\n<\/tr>\n<tr>\n<td>3 a 6 años<\/td>\n<td>Vuelve a mojar la cama, habla como bebé, berrinches, miedo a separarse, juega una y otra vez a lo que pasó<\/td>\n<\/tr>\n<tr>\n<td>7 a 12 años<\/td>\n<td>Dolores de panza o cabeza, pesadillas, miedo, culpa, problemas de atención, peleas<\/td>\n<\/tr>\n<tr>\n<td>Adolescentes<\/td>\n<td>Aislamiento, enojo, conductas de riesgo, desinterés, o se hacen cargo de todo como adultos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Qué ayuda<\/strong><\/p>\n<ul>\n<li>Rutina diaria fija (abajo).<\/li>\n<li>Contacto físico, abrazo, dormir cerca.<\/li>\n<li>Juego: es la forma en que los chicos procesan lo que viven. Dejar que jueguen a \"la crisis\" sin retarlos.<\/li>\n<li>Tareas reales: sentirse útil baja la angustia.<\/li>\n<li>Dibujar o contar lo que sienten.<\/li>\n<li>Paciencia con las regresiones: pasan con seguridad y tiempo.<\/li>\n<li>Si las señales duran más de un mes, empeoran, o el chico habla de hacerse daño <span class=\"ref\">►<\/span> Manual médico T1 3.44 y bloque 8, y un adulto de confianza que lo acompañe de cerca.<\/li>\n<\/ul>\n<p><strong>Duelo.<\/strong> Si muere alguien cercano o un animal querido, decirlo con palabras claras (\"murió\", no \"se durmió\" ni \"se fue\"), dejar que participe en una despedida si quiere, y aceptar que el duelo de un chico va y viene: puede llorar y al rato jugar.<\/p>"},{"t":"Rutina diaria tipo","h":"<h3>Rutina diaria tipo<\/h3>\n<table>\n<thead>\n<tr>\n<th>Hora<\/th>\n<th>Actividad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Al amanecer<\/td>\n<td>Levantarse, higiene, desayuno juntos<\/td>\n<\/tr>\n<tr>\n<td>Mañana temprano<\/td>\n<td>Tareas de la casa y del campo según la edad (gallinas, agua, huerta)<\/td>\n<\/tr>\n<tr>\n<td>Media mañana<\/td>\n<td>Escuela comunitaria: 2 a 3 horas<\/td>\n<\/tr>\n<tr>\n<td>Mediodía<\/td>\n<td>Almuerzo, descanso<\/td>\n<\/tr>\n<tr>\n<td>Tarde<\/td>\n<td>Juego libre, aprender un oficio con un adulto, tareas livianas<\/td>\n<\/tr>\n<tr>\n<td>Atardecer<\/td>\n<td>Juntar leña, cerrar gallinero, cena<\/td>\n<\/tr>\n<tr>\n<td>Noche<\/td>\n<td>Cuento o charla, a dormir temprano<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Tareas por edad","h":"<h3>Tareas por edad<\/h3>\n<p>Los chicos que colaboran se sienten parte, aprenden y alivian a los adultos. Siempre con un adulto cerca al principio.<\/p>\n<table>\n<thead>\n<tr>\n<th>Edad<\/th>\n<th>Puede hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2 a 3 años<\/td>\n<td>Juntar huevos con ayuda, llevar cosas livianas, regar con regadera chica, guardar juguetes<\/td>\n<\/tr>\n<tr>\n<td>4 a 6 años<\/td>\n<td>Dar de comer a las gallinas, juntar astillas, desgranar choclos y porotos, poner la mesa, sacar malezas grandes, cuidar el almacigo<\/td>\n<\/tr>\n<tr>\n<td>7 a 9 años<\/td>\n<td>Sembrar, regar, juntar fruta, barrer, lavar platos, cuidar a un hermano menor un rato con un adulto cerca, ayudar a amasar, ordenar la despensa<\/td>\n<\/tr>\n<tr>\n<td>10 a 12 años<\/td>\n<td>Cocinar recetas simples con supervisión de fuego, ordeñar con enseñanza, cuidar el compost, coser botones, llevar el registro de huevos, hacer recados en el barrio<\/td>\n<\/tr>\n<tr>\n<td>13 a 15 años<\/td>\n<td>Partir leña con hacha (con enseñanza), cocinar solo, trabajar con herramientas, cuidar animales, enseñar a los más chicos, aprendiz de un oficio<\/td>\n<\/tr>\n<tr>\n<td>16 años en adelante<\/td>\n<td>Trabajo de adulto, guardias acompañados de adultos, responsabilidad de un área (gallinero, semillas, agua)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lo que ningún chico hace sin un adulto al lado:<\/strong> manejar soda cáustica, lavandina pura o combustibles; meterse en pozos o tanques; usar motosierra o guadaña; acercarse a colmenas o al chivo macho; cuidar solo de un bebé.<\/p>"},{"t":"Ropa y calzado que se achican","h":"<h3>Ropa y calzado que se achican<\/h3>\n<ul>\n<li><strong>Ropero comunitario:<\/strong> la ropa que deja de servir a un chico pasa al siguiente. Llevar un registro de qué talles hay.<\/li>\n<li><strong>Coser con margen:<\/strong> dobladillos y costuras anchas que se puedan soltar; tiradores en lugar de cintura justa.<\/li>\n<li><strong>Calzado:<\/strong> es lo más difícil de reponer. Guardar talles grandes; hacer sandalias con suela de cubierta y tiras (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"7\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 8<\/a>); alpargatas de lona; medias de lana gruesas.<\/li>\n<li><strong>Descalzos:<\/strong> en verano y en pasto limpio está bien. Nunca descalzos cerca de corrales, del baño seco ni de la pila de compost (parásitos que entran por la piel), ni donde hay vidrios o chapas.<\/li>\n<\/ul>"},{"t":"Seguridad de los chicos [VITAL]","h":"<h3>Seguridad de los chicos <span class=\"b vital\">VITAL<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th>Riesgo<\/th>\n<th>Prevención<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ahogamiento<\/td>\n<td>Los chicos chicos se ahogan en 20 cm de agua: tambores, baldes, piletas y bebederos siempre tapados o vacíos. Pozos y aljibes con tapa pesada. Canales y ríos: nunca solos, aprender a nadar<\/td>\n<\/tr>\n<tr>\n<td>Fuego y quemaduras<\/td>\n<td>Zona de cocina marcada donde los chicos chicos no entran; ollas con mangos hacia adentro; velas fuera de su alcance<\/td>\n<\/tr>\n<tr>\n<td>Venenos<\/td>\n<td>Lavandina, soda cáustica, combustibles y venenos de plagas en lo alto y con candado. <strong>Nunca en botellas de bebida.<\/strong> Rotular todo<\/td>\n<\/tr>\n<tr>\n<td>Herramientas<\/td>\n<td>Hachas, cuchillos, guadañas y sierras guardadas fuera del alcance<\/td>\n<\/tr>\n<tr>\n<td>Animales<\/td>\n<td>Lejos del chivo macho, de las colmenas, de perros desconocidos y de caballos por detrás<\/td>\n<\/tr>\n<tr>\n<td>Plantas tóxicas<\/td>\n<td>Enseñar a no comer nada del campo sin mostrarlo a un adulto (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"7\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 8<\/a>)<\/td>\n<\/tr>\n<tr>\n<td>Perderse<\/td>\n<td>Silbato colgado, punto de encuentro conocido, tarjeta con nombre; enseñar a quedarse quieto y tocar el silbato si se pierde<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Protección contra el abuso.<\/strong> En las crisis aumenta el riesgo de que alguien se aproveche de un chico. Reglas simples para la comunidad:<\/p>\n<ul>\n<li>En las actividades con chicos (escuela, juegos, aprendizajes) siempre hay por lo menos dos adultos, o la puerta abierta y otros adultos cerca.<\/li>\n<li>Enseñar a los chicos los nombres correctos de las partes del cuerpo, que su cuerpo es suyo, que pueden decir que no, y la diferencia entre una sorpresa (que se cuenta después) y un secreto que un adulto les pide guardar (que siempre se cuenta).<\/li>\n<li>Escuchar y creerle al chico que cuenta algo. Ponerlo a salvo primero.<\/li>\n<li>La comunidad acuerda de antemano qué hace si un adulto lastima a un chico (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">cap. 4<\/a>).<\/li>\n<\/ul>"},{"t":"Chicos sin sus padres","h":"<h3>Chicos sin sus padres<\/h3>\n<p>Si un chico queda solo, una familia de la comunidad lo recibe enseguida y se anota en el registro comunitario: nombre, edad, de dónde viene, quién lo cuida. Se busca a sus familiares por todos los medios disponibles. Ningún chico queda a cargo solo de un adulto que la comunidad no conoce.<\/p>"},{"t":"Chicos con discapacidad o enfermedades crónicas","h":"<h3>Chicos con discapacidad o enfermedades crónicas<\/h3>\n<p>Planificar con tiempo: medicación de reserva, equipos (sillas de ruedas, audífonos con pilas de repuesto, anteojos de repuesto), y quién los ayuda en una evacuación. Incluirlos en las tareas que puedan hacer: también necesitan sentirse útiles. Lo médico <span class=\"ref\">►<\/span> Manual médico T2 12.16.<\/p>"}]},{"t":"Escuela comunitaria","s":[{"t":"","h":"<p>Aprender no puede cortarse: un chico que deja de leer dos años pierde mucho más que dos años, y una comunidad que no enseña desaparece en una generación. La escuela comunitaria no copia la escuela de antes: enseña a leer, escribir y calcular con lo que la comunidad hace todos los días, y forma a los que van a sostener los oficios. <span class=\"b anos\">AÑOS<\/span> (199)<\/p>"},{"t":"Organización","h":"<h3>Organización<\/h3>\n<ul>\n<li><strong>Grupos por edad:<\/strong> 4 a 6 años (juego y primeras letras), 6 a 9 (lectura, escritura y cuentas), 9 a 12 (todo lo anterior aplicado a la huerta, la cocina y el taller), 12 a 16 (aprendices de oficio y ayudantes de maestro).<\/li>\n<li><strong>Horario:<\/strong> 2 a 3 horas por día, cinco días por semana, a la mañana, después de las tareas tempranas. En invierno, más horas; en cosecha, menos.<\/li>\n<li><strong>Maestros:<\/strong> adultos que se turnan, cada uno enseña lo que sabe. Los adolescentes enseñan a los chicos chicos: es la mejor forma de que ellos mismos aprendan.<\/li>\n<li><strong>Lugar:<\/strong> una habitación con luz de día, una pizarra (madera pintada de negro mate y tiza, o carbón sobre tabla blanca) y una mesa larga.<\/li>\n<li><strong>Biblioteca escolar:<\/strong> guardar ahora manuales de primaria y secundaria de lengua, matemática, ciencias naturales y sociales, diccionario, mapas y atlas, libros de cuentos y novelas para cada edad. En papel: no dependen de la luz.<\/li>\n<\/ul>"},{"t":"Qué enseñar en cada etapa","h":"<h3>Qué enseñar en cada etapa<\/h3>\n<table>\n<thead>\n<tr>\n<th>Edad<\/th>\n<th>Lengua<\/th>\n<th>Matemática<\/th>\n<th>Ciencias y mundo<\/th>\n<th>Oficios y vida práctica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4 a 6<\/td>\n<td>Cuentos leídos en voz alta, canciones, letras del propio nombre<\/td>\n<td>Contar objetos, formas, más y menos<\/td>\n<td>Plantas, animales, el tiempo, el día y la noche<\/td>\n<td>Ayudar en la huerta, juntar huevos, guardar las cosas<\/td>\n<\/tr>\n<tr>\n<td>6 a 9<\/td>\n<td>Leer y escribir oraciones y textos cortos, dictados, cartas<\/td>\n<td>Las cuatro operaciones, tablas, medir con cinta, el reloj<\/td>\n<td>Semillas y germinación, partes de la planta, ciclo del agua, los animales de la granja<\/td>\n<td>Sembrar, regar, alimentar gallinas, coser un botón, nudos simples<\/td>\n<\/tr>\n<tr>\n<td>9 a 12<\/td>\n<td>Leer libros enteros, escribir el cuaderno de la huerta y del tiempo, ortografía<\/td>\n<td>Fracciones, porcentajes, peso y volumen, áreas de canteros, raciones, reglas de tres<\/td>\n<td>Suelo y compost, insectos útiles y plagas, fermentación, el cuerpo y la higiene, las estrellas y la orientación, historia y geografía argentinas<\/td>\n<td>Cocinar recetas simples, ordeñar con enseñanza, hacer pan, nudos, cestería, primeros auxilios básicos <span class=\"ref\">►<\/span> Manual médico T2 20.4<\/td>\n<\/tr>\n<tr>\n<td>12 a 16<\/td>\n<td>Redactar actas, inventarios e informes; leer manuales técnicos; enseñar a otros<\/td>\n<td>Proporciones de recetas y conservas, cálculo de jabón, presupuesto e intercambio, geometría para construir<\/td>\n<td>Química de la cocina y del jabón, electricidad de 12 V, máquinas simples, mapas topográficos, el clima de la zona<\/td>\n<td>Aprendiz de un oficio con un maestro: herrería, carpintería, quesería, apicultura, semillas, salud <span class=\"ref\">►<\/span> Manual médico T2 bloque 20<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Matemática con lo que hay","h":"<h3>Matemática con lo que hay<\/h3>\n<ul>\n<li>Contar y registrar los huevos de cada día y sacar el promedio de la semana.<\/li>\n<li>Medir un cantero, calcular su área y cuántas plantas entran según la ficha de cultivo.<\/li>\n<li>Pesar la cosecha y calcular cuántas raciones da.<\/li>\n<li>Duplicar o dividir una receta.<\/li>\n<li>Calcular la soda de una tanda de jabón con la fórmula (siempre con un adulto).<\/li>\n<li>Llevar las cuentas de un intercambio en la feria.<\/li>\n<\/ul>"},{"t":"Lectura y escritura con lo que hay","h":"<h3>Lectura y escritura con lo que hay<\/h3>\n<ul>\n<li>Cada chico lleva un cuaderno propio: lo que aprendió, dibujos, el tiempo de cada día.<\/li>\n<li>Los chicos más grandes escriben el diario de la comunidad y leen en voz alta las actas a quienes no leen bien.<\/li>\n<li>Leer los libros de la biblioteca en voz alta es parte de la escuela: así toda la comunidad conoce lo que contienen.<\/li>\n<li>Escribir cartas a otras comunidades, que lleva el mensajero.<\/li>\n<\/ul>"},{"t":"Sin papel","h":"<h3>Sin papel<\/h3>\n<p>Cuando los cuadernos se terminan: pizarras individuales de madera pintada, tablitas con arena para escribir con el dedo, carbón sobre tablas, papel reciclado hecho en la escuela (pulpa de papel viejo en agua, colada en un marco con malla y secada al sol). Los lápices duran mucho: guardar cajas enteras. Tinta casera <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">cap. 4<\/a>.<\/p>"},{"t":"Registro y evaluación","h":"<h3>Registro y evaluación<\/h3>\n<p>Un cuaderno por chico donde el maestro anota, cada mes, qué sabe leer, qué operaciones domina y qué oficios practica. Cuando las escuelas vuelvan a abrir, ese registro sirve para que el chico retome en el nivel que le corresponde.<\/p>"},{"t":"Juegos y juguetes sin pantallas","h":"<h3>Juegos y juguetes sin pantallas<\/h3>\n<table>\n<thead>\n<tr>\n<th>Edad<\/th>\n<th>Juegos y juguetes caseros<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bebés<\/td>\n<td>Sonajeros (botella con porotos bien cerrada), cucharas y ollas, telas de colores, canciones<\/td>\n<\/tr>\n<tr>\n<td>1 a 3 años<\/td>\n<td>Bloques de madera, cajas para meter y sacar, pelota de trapo, masa de sal (harina, sal y agua)<\/td>\n<\/tr>\n<tr>\n<td>4 a 7 años<\/td>\n<td>Rayuela, escondidas, mancha, soga, muñecos de trapo, títeres de media, barro y agua<\/td>\n<\/tr>\n<tr>\n<td>8 a 12 años<\/td>\n<td>Bolitas, trompo, barrilete, ta-te-tí, cartas (truco, chinchón), damas y ajedrez hechos en madera, fútbol<\/td>\n<\/tr>\n<tr>\n<td>Adolescentes<\/td>\n<td>Juegos de mesa, deportes, música con instrumentos caseros, teatro, construir cosas de verdad<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Una tarde por semana de juego o fiesta de toda la comunidad hace mucho por el ánimo de chicos y grandes.<\/p>"}]},{"t":"Organizar la comunidad","s":[{"t":"","h":"<p>Ninguna familia sola sabe todos los oficios, puede hacer guardia de noche y trabajar de día, ni aguanta sola una enfermedad o un mal año de cosecha. Las comunidades que sobreviven a una crisis larga no son las que más cosas tienen, sino las que deciden bien, resuelven sus conflictos y reparten el trabajo. La experiencia argentina de 2001 lo mostró: no hubo un \"fin del mundo\", sino años de inflación, delito y escasez en los que se arreglaron mejor quienes tenían oficio y red. <span class=\"b vital\">VITAL<\/span><\/p>"},{"t":"Elegir dónde [VITAL]","h":"<h3>Elegir dónde <span class=\"b vital\">VITAL<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th>Factor<\/th>\n<th>Qué buscar<\/th>\n<th>Qué evitar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agua<\/td>\n<td>Una fuente que no dependa de bombas eléctricas: río, canal, napa a poca profundidad, lluvia suficiente<\/td>\n<td>Depender de un solo pozo o de la red<\/td>\n<\/tr>\n<tr>\n<td>Suelo<\/td>\n<td>Tierra cultivable, aunque sea poca, y lugar para huerta y animales<\/td>\n<td>Suelos salitrosos, inundables o contaminados<\/td>\n<\/tr>\n<tr>\n<td>Amenazas<\/td>\n<td>Terreno alto, lejos de laderas inestables<\/td>\n<td>Zonas inundables (mirar las marcas de crecidas viejas), bordes de monte seco con riesgo de incendio, cerca de plantas químicas o depósitos de combustible<\/td>\n<\/tr>\n<tr>\n<td>Leña<\/td>\n<td>Monte, cortinas de álamos, poda de frutales a distancia caminable<\/td>\n<td>Lugares sin árboles en climas fríos<\/td>\n<\/tr>\n<tr>\n<td>Gente<\/td>\n<td>Vecinos con oficios y conocimiento del lugar; un pueblo chico o un barrio unido<\/td>\n<td>Aislarse por completo<\/td>\n<\/tr>\n<tr>\n<td>Acceso<\/td>\n<td>Caminos para intercambiar y evacuar, pero no sobre una ruta principal muy transitada<\/td>\n<td>Ser el paso obligado de todos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En general conviene <strong>quedarse donde uno ya conoce a la gente y el lugar<\/strong>, y organizarse ahí, antes que mudarse a un lugar \"ideal\" donde se es extraño.<\/p>"},{"t":"Tamaño y primeros pasos","h":"<h3>Tamaño y primeros pasos<\/h3>\n<ul>\n<li><strong>De 5 a 15 familias<\/strong> es un tamaño en el que todos se conocen y se pueden tomar decisiones en una reunión.<\/li>\n<li><strong>Primera reunión:<\/strong> hacer el inventario común de saberes (quién sabe de qué), de recursos (pozos, herramientas, animales, vehículos) y de necesidades (bebés, ancianos, enfermos crónicos).<\/li>\n<li><strong>Acordar por escrito<\/strong> pocas reglas claras y la forma de cambiarlas.<\/li>\n<\/ul>"},{"t":"Tomar decisiones","h":"<h3>Tomar decisiones<\/h3>\n<ul>\n<li><strong>Asamblea semanal<\/strong> de adultos, a día y hora fijos, con un orden del día y alguien que anote lo decidido en el libro de actas.<\/li>\n<li><strong>Responsables por área<\/strong>, elegidos por la asamblea por un tiempo fijo (por ejemplo, seis meses) y con un suplente: agua, huerta y semillas, animales, despensa común, salud (con el Manual médico), escuela, seguridad, registro.<\/li>\n<li><strong>Decisiones del día a día<\/strong> las toma el responsable del área; las grandes (expulsar a alguien, recibir familias nuevas, gastar reservas comunes, mudarse), la asamblea.<\/li>\n<li>Rotar a quienes coordinan evita que se armen jefes permanentes y reparte el cansancio.<\/li>\n<li>Que los adolescentes participen y opinen: es su comunidad también.<\/li>\n<\/ul>"},{"t":"Normas básicas que conviene escribir","h":"<h3>Normas básicas que conviene escribir<\/h3>\n<ol>\n<li>Cómo se reparte lo que se produce en común y qué es de cada familia.<\/li>\n<li>Cuántas horas de trabajo comunitario aporta cada adulto por semana.<\/li>\n<li>Cómo se cuida a quien no puede trabajar (ancianos, enfermos, embarazadas, chicos solos).<\/li>\n<li>Qué se hace si alguien roba, lastima a otra persona o pone en riesgo a la comunidad.<\/li>\n<li><strong>Protección de los chicos:<\/strong> nunca un adulto solo con chicos que no son suyos; qué se hace si un adulto lastima a un chico (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\">cap. 2<\/a>).<\/li>\n<li>Cómo se recibe a gente nueva.<\/li>\n<li>Cómo se resuelven los conflictos (abajo).<\/li>\n<\/ol>"},{"t":"Recibir a gente nueva [VITAL]","h":"<h3>Recibir a gente nueva <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Después de un colapso llegan familias que buscan un lugar. Decidir cómo se las recibe <strong>antes<\/strong> de que golpeen la puerta evita peleas, contagios y decisiones de pánico.<\/p>\n<p><strong>Lo que la asamblea decide antes<\/strong><\/p>\n<ul>\n<li>Cuántas personas más se pueden sumar sin poner en riesgo el agua y la comida del año (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 1<\/a>, y <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 1<\/a>).<\/li>\n<li>Qué se ofrece siempre, aunque no se pueda recibir a nadie: agua, una comida y orientación para seguir viaje.<\/li>\n<li>Quiénes son las dos personas que reciben, y un lugar de encuentro fuera de la zona de las casas.<\/li>\n<\/ul>\n<p><strong>El día que llegan<\/strong><\/p>\n<ol>\n<li><strong>Recibir afuera,<\/strong> de día, siempre de a dos o más. Escuchar: quiénes son, de dónde vienen, qué les pasó.<\/li>\n<li><strong>Preguntar por la salud:<\/strong> fiebre, diarrea, tos, manchas en la piel, heridas. Si alguien está enfermo, se lo atiende aparte <span class=\"ref\">►<\/span> Manual médico T2 18.10.<\/li>\n<li><strong>Qué saben hacer y qué traen:<\/strong> oficios, herramientas, semillas, animales. No es una condición para ayudar, pero ordena el trabajo después.<\/li>\n<li><strong>Explicar las normas por escrito<\/strong> y preguntar si las aceptan. Las armas y herramientas peligrosas se tratan como la comunidad haya decidido.<\/li>\n<\/ol>\n<p><strong>Las primeras semanas<\/strong><\/p>\n<ul>\n<li><strong>Cuarentena de 7 a 14 días<\/strong> en un lugar apartado, con agua, letrina y lavamanos propios, sin compartir vajilla. Es por la salud de todos, se explica así y se cumple con todos, sin excepción.<\/li>\n<li><strong>Una familia madrina<\/strong> que los acompaña, les muestra el lugar y responde preguntas.<\/li>\n<li><strong>Período de prueba<\/strong> (uno a tres meses) con los mismos derechos y obligaciones que el resto; al final, la asamblea confirma.<\/li>\n<li><strong>Chicos que llegan solos:<\/strong> <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\">cap. 2<\/a>, <em>Chicos sin sus padres<\/em>.<\/li>\n<\/ul>\n<p><strong>Si no se puede recibir:<\/strong> decirlo con claridad y respeto, dar agua y comida para el camino, y si se sabe, indicar otra comunidad que reciba gente.<\/p>"},{"t":"Resolver conflictos","h":"<h3>Resolver conflictos<\/h3>\n<p>Los conflictos van a aparecer: por comida, por trabajo, por animales que se meten en la huerta ajena, por cansancio. Lo que destruye una comunidad no es el conflicto sino dejarlo crecer.<\/p>\n<ol>\n<li><strong>Hablarlo pronto<\/strong> entre las personas involucradas, en privado, describiendo hechos (\"tus cabras entraron tres veces a la huerta esta semana\") y no ataques (\"sos un desastre\").<\/li>\n<li>Si no se resuelve, <strong>un mediador<\/strong> aceptado por ambos escucha a cada uno por separado y después juntos, y ayuda a encontrar un acuerdo concreto.<\/li>\n<li>Anotar el acuerdo y revisarlo en dos semanas.<\/li>\n<li>Si sigue, <strong>la asamblea<\/strong> decide. Las sanciones posibles se acuerdan antes de que haga falta usarlas (trabajo extra, reparar el daño, en casos graves la salida de la comunidad).<\/li>\n<li><strong>Violencia contra personas:<\/strong> se separa enseguida a quien la ejerce, se protege a la víctima y la asamblea decide. Si existen autoridades funcionando, se recurre a ellas.<\/li>\n<\/ol>"},{"t":"Repartir el trabajo y los oficios","h":"<h3>Repartir el trabajo y los oficios<\/h3>\n<ul>\n<li><strong>Planilla semanal<\/strong> de tareas comunes (agua, guardias, gallinero, cocina comunitaria si la hay, escuela) con nombres y turnos, en una cartelera visible.<\/li>\n<li><strong>Cada habilidad VITAL en al menos dos personas,<\/strong> y cada oficio con un aprendiz adolescente.<\/li>\n<li><strong>Registro de horas<\/strong> para que nadie sienta que trabaja por otros. Quien está enfermo o cuida un bebé cuenta como trabajando.<\/li>\n<li>Ritmo sostenible: un día de descanso por semana para todos. El agotamiento lleva a errores, accidentes y peleas.<\/li>\n<\/ul>"},{"t":"Trabajo pesado sin lesionarse [AÑOS]","h":"<h3>Trabajo pesado sin lesionarse <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Sin máquinas, todo se carga, se cava y se acarrea a mano. Una espalda lastimada saca a una persona del trabajo por semanas, y en una comunidad chica eso pesa.<\/p>\n<ul>\n<li><strong>Levantar con las piernas:<\/strong> pies separados, la carga <strong>pegada al cuerpo<\/strong>, espalda derecha, subir estirando las rodillas. <strong>Nunca girar el tronco con peso:<\/strong> girar con los pies.<\/li>\n<li><strong>Pesos razonables:<\/strong> hasta unos 25 kg un adulto entrenado, menos para quien no está acostumbrado, embarazadas, mayores y adolescentes. Lo que pesa más se carga entre dos o se divide.<\/li>\n<li><strong>Herramientas que multiplican:<\/strong> carretilla, carro, palanca, rodillos, poleas (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"6\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 7<\/a>); mangos largos y herramientas afiladas cansan mucho menos.<\/li>\n<li><strong>Rotar tareas<\/strong> cada una o dos horas (cavar, después sembrar, después acarrear) y hacer pausas cortas seguido, antes del cansancio.<\/li>\n<li><strong>Calor:<\/strong> el trabajo duro, temprano a la mañana y al atardecer; agua a mano y sombra; vigilar a los compañeros (mareo, confusión, dejar de sudar <span class=\"ref\">►<\/span> Manual médico).<\/li>\n<li><strong>Manos y pies:<\/strong> guantes, calzado firme, curar enseguida ampollas y cortes.<\/li>\n<li><strong>Acostumbrarse de a poco:<\/strong> quien viene de la ciudad necesita semanas para hacer una jornada completa de trabajo físico. Empezar con medias jornadas.<\/li>\n<li>Dolor de espalda <span class=\"ref\">►<\/span> Manual médico T1 4.76.<\/li>\n<\/ul>"},{"t":"Celebraciones, cultura y memoria [AÑOS]","h":"<h3>Celebraciones, cultura y memoria <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Las comunidades que sobreviven crisis largas no solo comen: también festejan, cantan y recuerdan. La rutina sin alegría desgasta tanto como el hambre <span class=\"ref\">►<\/span> Manual médico T2 18.13.<\/p>\n<ul>\n<li><strong>Un calendario propio:<\/strong> fiesta de la siembra en primavera, de la cosecha y la vendimia a fin del verano, de la primera nevada o el solsticio de invierno, cumpleaños de los chicos. Fechas fijas que todos esperan.<\/li>\n<li><strong>Comida compartida<\/strong> una vez por semana o por mes, donde cada familia lleva algo.<\/li>\n<li><strong>Música y relatos:<\/strong> guardar instrumentos y cuerdas de repuesto, enseñar canciones y bailes, noches de cuentos alrededor del fuego. Los mayores cuentan cómo era antes; los chicos inventan.<\/li>\n<li><strong>Juegos y deportes<\/strong> para todas las edades (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\">cap. 2<\/a> y 3).<\/li>\n<li><strong>Ritos de paso:<\/strong> dar la bienvenida a los recién nacidos y a los que llegan, despedir a los que mueren con una ceremonia acordada (<span class=\"ref\">►<\/span> Manual médico T2 bloque 19), reconocer cuando un chico aprende un oficio.<\/li>\n<li><strong>La memoria:<\/strong> un cuaderno o libro de la comunidad donde se escribe lo que pasó cada año, con nombres, fechas, cosechas, nacimientos y muertes (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"7\" data-s=\"0\">cap. 8<\/a>, libro de actas). Es la historia que van a leer los que vengan.<\/li>\n<li>Respetar las creencias y la religión de cada familia; las celebraciones comunes, que sean de todos.<\/li>\n<\/ul>"},{"t":"Huerta comunitaria [AÑOS]","h":"<h3>Huerta comunitaria <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Una huerta grande trabajada entre varias familias produce más con menos esfuerzo, siempre que las reglas estén claras desde el primer día.<\/p>\n<p><strong>Elegir el modelo<\/strong><\/p>\n<ul>\n<li><strong>Parcelas familiares<\/strong> dentro de un mismo cerco: cada familia cultiva lo suyo, se comparten el agua, el cerco, el compost y las herramientas. Menos conflictos.<\/li>\n<li><strong>Huerta común:<\/strong> todos trabajan todo y se reparte la cosecha. Rinde más en cultivos grandes (papa, maíz, zapallo, trigo, porotos).<\/li>\n<li><strong>Lo más usado:<\/strong> las dos cosas. Verduras de hoja y aromáticas en parcelas familiares; granos, papa, zapallo y legumbres en común.<\/li>\n<\/ul>\n<p><strong>El lugar:<\/strong> cerca del agua (acequia, pozo o cisterna), con buen sol, cercado contra animales y fácil de vigilar. Organización del espacio y calendario: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 1<\/a> y 3.<\/p>\n<p><strong>Reglas que conviene escribir<\/strong><\/p>\n<ol>\n<li><strong>Responsables por cultivo o por sector,<\/strong> que deciden cuándo sembrar, regar y cosechar.<\/li>\n<li><strong>Turnos de riego y de guardia<\/strong> en una planilla visible (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"7\" data-s=\"0\">cap. 8<\/a>, <em>Turnos de tareas y guardias<\/em>). En época de cosecha, la guardia es de noche también.<\/li>\n<li><strong>Registro de horas trabajadas<\/strong> por familia.<\/li>\n<li><strong>Reparto:<\/strong> una parte según las horas trabajadas, y una parte fija para quienes no pueden trabajar (ancianos, enfermos, embarazadas, chicos solos). Una parte para semilla del año siguiente y otra para la despensa común, <strong>antes<\/strong> de repartir.<\/li>\n<li><strong>Nadie cosecha solo en lo común:<\/strong> la cosecha se hace en días fijos, entre varios, y se anota.<\/li>\n<li><strong>Herramientas en un pañol<\/strong> con cuaderno de préstamo; quien la rompe, la arregla o avisa.<\/li>\n<li><strong>Semillas<\/strong> al banco común (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"3\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 4<\/a>).<\/li>\n<li>Los conflictos se llevan a la asamblea, no se resuelven en el surco (<span class=\"ref\">►<\/span> <em>Resolver conflictos<\/em>).<\/li>\n<\/ol>\n<p><strong>Los chicos<\/strong> en la huerta común tienen tareas a su medida (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\">cap. 2<\/a>, <em>Tareas por edad<\/em>) y su propio cantero: es la mejor escuela.<\/p>"},{"t":"Cuidar a los que más lo necesitan","h":"<h3>Cuidar a los que más lo necesitan<\/h3>\n<ul>\n<li><strong>Censo comunitario:<\/strong> ancianos, personas con discapacidad, enfermos crónicos, embarazadas, bebés, chicos solos.<\/li>\n<li>Cada persona vulnerable tiene a alguien asignado que la visita todos los días.<\/li>\n<li>Su ración y su leña están garantizadas por la comunidad.<\/li>\n<li>Los ancianos son la memoria de cómo se hacían las cosas sin supermercado: darles el lugar de maestros.<\/li>\n<\/ul>"},{"t":"Salud y convivencia del grupo (200)","h":"<h3>Salud y convivencia del grupo (200)<\/h3>\n<p>La salud mental del grupo, las reacciones al estrés, el alcohol, la violencia y la organización sanitaria (zona de atención, aislamiento, brotes, parásitos, vacunas) están en <span class=\"ref\">►<\/span> Manual médico T1 bloque 8 y T2 bloque 18. Lo que corresponde a la organización: rutina, trabajo con sentido, un día de descanso por semana, alguna fiesta, y que nadie cargue solo una pérdida.<\/p>"},{"t":"Registro, conocimiento y medidas (195, 196, 199)","h":"<h3>Registro, conocimiento y medidas (195, 196, 199)<\/h3>\n<ul>\n<li><strong>Libro de la comunidad:<\/strong> actas de asamblea, inventario común, nacimientos y muertes, quién vive en cada casa, qué se sembró y cuánto se cosechó, qué funcionó y qué no.<\/li>\n<li><strong>Documentos (196):<\/strong> copias en papel de DNI, escrituras y partidas de nacimiento de cada familia, en bolsa hermética; una copia guardada en otra casa.<\/li>\n<li><strong>Biblioteca común:<\/strong> todos los libros de esta biblioteca impresos, las cartillas del INTA, libros escolares, recetarios, manuales de oficios.<\/li>\n<li><strong>Papel y tinta:<\/strong> guardar cuadernos y lápices (un lápiz escribe kilómetros y no se seca). Tinta casera: cáscaras verdes de nuez hervidas varias horas y coladas, o hollín fino mezclado con un poco de miel o resina y agua.<\/li>\n<li><strong>Medidas de referencia:<\/strong> guardar una balanza de platillos y pesas, una cinta métrica y un recipiente de un litro marcado. Un litro de agua pesa un kilo: sirve para controlar cualquier balanza.<\/li>\n<li><strong>Calendario y hora:<\/strong> un almanaque en papel de varios años, y un reloj de sol simple (un palo vertical y marcas de las horas en el suelo, calibradas con un reloj mientras funcione).<\/li>\n<li><strong>Enseñar (199):<\/strong> cada adulto enseña lo que sabe; cada oficio se pasa a la generación siguiente. Una comunidad que deja de enseñar, desaparece en una generación.<\/li>\n<\/ul>"}]},{"t":"Economía, trueque y oficios","s":[{"t":"","h":"<p>Las crisis económicas argentinas enseñaron que el dinero pierde valor rápido pero no desaparece, que convivían varias monedas y que florecieron los clubes de trueque. Un oficio vale más que cualquier reserva.<\/p>"},{"t":"Dinero, inflación y trueque (192, 194)","h":"<h3>Dinero, inflación y trueque (192, 194)<\/h3>\n<p>En las crisis argentinas el dinero no desapareció de golpe: perdió valor rápido, hubo varias monedas a la vez y florecieron los clubes de trueque.<\/p>\n<ul>\n<li><strong>Mientras el dinero valga:<\/strong> convertirlo pronto en cosas que no se pudren y que sirven (herramientas, semillas, sal, jabón, legumbres), sin endeudarse.<\/li>\n<li><strong>Ferias de intercambio<\/strong> periódicas con otras comunidades, en un lugar neutral y con reglas acordadas.<\/li>\n<li><strong>Lo que mejor se intercambia:<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Rubro<\/th>\n<th>Ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Consumo que siempre falta<\/td>\n<td>Sal, azúcar, yerba, fósforos, velas, jabón, lavandina, aceite<\/td>\n<\/tr>\n<tr>\n<td>Para producir<\/td>\n<td>Semillas de polinización abierta, plantines, pollitos y huevos fértiles, herramientas, clavos, alambre, cuerdas<\/td>\n<\/tr>\n<tr>\n<td>Para la casa<\/td>\n<td>Pilas, linternas, pañales de tela, agujas e hilo, ropa y calzado de chicos<\/td>\n<\/tr>\n<tr>\n<td>Elaborados<\/td>\n<td>Pan, queso, conservas bien hechas, miel, mermeladas, jabón, velas, tejidos<\/td>\n<\/tr>\n<tr>\n<td>Servicios y oficios<\/td>\n<td>Afilado, arreglo de bicicletas, costura, herrería, carpintería, enseñanza, cuidado de chicos, esquila<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Un oficio vale más que cualquier reserva:<\/strong> las reservas se terminan; el oficio se cobra todas las semanas.<\/p>"}]},{"t":"Seguridad y comunicaciones","s":[{"t":"Seguridad sin armas [VITAL] (191)","h":"<h3>Seguridad sin armas <span class=\"b vital\">VITAL<\/span> (191)<\/h3>\n<p>Esta sección no trata armas (están en <a class=\"x\" data-b=\"ARM\" data-c=\"0\" data-s=\"0\"><em>Armas, caza y pesca<\/em><\/a>). La seguridad que más protege es la que evita que el problema llegue: <strong>disuadir, demorar y estar organizados.<\/strong><\/p>\n<p><strong>No llamar la atención<\/strong><\/p>\n<ul>\n<li>No mostrar ni comentar lo que se tiene guardado fuera de la comunidad. El olor a pan recién horneado o la única casa con luz en un barrio a oscuras también \"hablan\".<\/li>\n<li>Vestir y moverse como todos. Ir en grupo y de día.<\/li>\n<li><strong>Despensa repartida:<\/strong> no todo en un solo lugar. Una parte escondida, otra parte en otra casa de confianza.<\/li>\n<\/ul>\n<p><strong>Atención y aviso<\/strong><\/p>\n<ul>\n<li>Conocer a los vecinos y saber quién es de la zona.<\/li>\n<li>Observar: autos o personas que pasan varias veces, preguntas sobre quién vive dónde o qué se tiene.<\/li>\n<li><strong>Perros:<\/strong> un buen perro guardián avisa antes que nadie.<\/li>\n<li><strong>Guardias nocturnas<\/strong> por turnos de 2 a 3 horas, siempre de a dos, con silbato o campana para avisar.<\/li>\n<li><strong>Señal de alarma<\/strong> conocida por todos (diferente de la de incendio) y punto de reunión.<\/li>\n<\/ul>\n<p><strong>Demorar el acceso<\/strong><\/p>\n<ul>\n<li>Cercos, portones con cadena, cercos vivos de plantas espinosas (rosa mosqueta, zarzamora, tuna, espinillo) alrededor de huertas y corrales.<\/li>\n<li>Puertas macizas con buenas trabas, rejas en ventanas bajas, iluminación o ruido (latas colgadas) en los accesos.<\/li>\n<li><strong>Habitación segura:<\/strong> un cuarto con puerta reforzada donde la familia pueda encerrarse y avisar.<\/li>\n<\/ul>\n<p><strong>Alianzas<\/strong><\/p>\n<ul>\n<li>Acuerdos de ayuda mutua con las comunidades vecinas: avisarse de peligros, de incendios y de enfermedades, intercambiar, y responder juntos.<\/li>\n<li>Ante un grupo hostil más fuerte, la vida vale más que las cosas: entregar y alejarse es una opción válida.<\/li>\n<\/ul>\n<p><span class=\"ref\">►<\/span> <strong>Si la comunidad decide tener armas para caza, control de plagas o defensa:<\/strong> marco legal, seguridad, guarda y normas comunitarias en <a class=\"x\" data-b=\"ARM\" data-c=\"0\" data-s=\"0\"><em>Armas, caza y pesca<\/em><\/a>.<\/p>"},{"t":"Comunicaciones (186, 187)","h":"<h3>Comunicaciones (186, 187)<\/h3>\n<ul>\n<li><strong>Radio receptora a pilas o a manivela<\/strong> en cada familia, para escuchar noticias de AM y FM. La AM llega más lejos de noche.<\/li>\n<li><strong>Equipos de mano (walkie-talkies):<\/strong> sirven entre casas y para las guardias, a 1 a 5 km según el terreno. Guardar pilas recargables y un cargador solar.<\/li>\n<li><strong>Radioaficionados:<\/strong> con equipos de HF se habla con otras provincias sin ninguna infraestructura. En Argentina hace falta licencia del ENACOM; conviene que alguien de la comunidad la saque y aprenda ahora. Los radioclubes locales enseñan y suelen sostener las comunicaciones en emergencias.<\/li>\n<li><strong>Sin aparatos:<\/strong> mensajeros en bicicleta con rondas fijas, una cartelera comunitaria, señales con campana o silbato.<\/li>\n<li><strong>Señales de auxilio (187):<\/strong> tres de cualquier cosa (tres fuegos en triángulo, tres pitadas, tres destellos) significan auxilio. SOS en Morse: tres cortos, tres largos, tres cortos. Un espejo refleja el sol hasta muchos kilómetros. En el suelo, letras grandes hechas con piedras o ramas: <strong>SOS<\/strong>.<\/li>\n<\/ul>"}]},{"t":"Orientación, clima y riesgos naturales","s":[{"t":"","h":"<p>Saber dónde se está, qué tiempo viene y qué amenazas naturales tiene la zona permite anticiparse en lugar de reaccionar. Incendios <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"3\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 4<\/a>.<\/p>"},{"t":"Orientarse sin GPS (184, 185)","h":"<h3>Orientarse sin GPS (184, 185)<\/h3>\n<ul>\n<li><strong>Mapas en papel<\/strong> de la zona: cartas topográficas del Instituto Geográfico Nacional y mapas viales. Imprimirlos hoy y guardarlos en bolsa hermética, con una brújula.<\/li>\n<li><strong>El sol:<\/strong> en Argentina, al mediodía el sol está hacia el norte. Sale por el este y se pone por el oeste.<\/li>\n<li><strong>Método de la sombra:<\/strong> clavar un palo derecho, marcar la punta de su sombra, esperar 15 minutos y marcar otra vez. La línea de la primera marca a la segunda va de oeste a este.<\/li>\n<li><strong>Cruz del Sur:<\/strong> de noche, prolongar el eje largo de la cruz unas 4 veces y media su largo; ese punto, bajado en vertical al horizonte, indica el sur.<\/li>\n<\/ul>"},{"t":"Reloj de sol [MEJORA]","h":"<h3>Reloj de sol <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Cuando se acaban las pilas de los relojes, la comunidad necesita una hora común para turnos, guardias y la escuela.<\/p>\n<p><strong>El más simple: palo y marcas<\/strong><\/p>\n<ol>\n<li>Clavar un palo bien vertical (con plomada) en un lugar con sol todo el día, sobre piso plano y firme.<\/li>\n<li>Mientras quede algún reloj con hora, marcar con piedras pintadas o estacas dónde cae la punta de la sombra en cada hora en punto.<\/li>\n<li>Las marcas cambian un poco con las estaciones: repetir la marcación en cada equinoccio y solsticio, con un color distinto, y usar la más cercana a la fecha.<\/li>\n<\/ol>\n<p><strong>Reloj ecuatorial (anda todo el año)<\/strong><\/p>\n<ol>\n<li>Un disco de madera o chapa con 24 rayas, cada 15°, marcado de los dos lados.<\/li>\n<li>Una varilla que atraviesa el centro del disco, perpendicular a él.<\/li>\n<li>Orientar la varilla en dirección norte-sur (<span class=\"ref\">►<\/span> <em>Orientarse sin GPS<\/em>), con la punta de arriba <strong>hacia el sur<\/strong>, inclinada sobre el horizonte un ángulo igual a la latitud del lugar (Villa Regina y el Alto Valle: unos 39°).<\/li>\n<li>La sombra de la varilla sobre el disco avanza una raya por hora. De septiembre a marzo la sombra cae en la cara de arriba; de marzo a septiembre, en la de abajo.<\/li>\n<li>La raya del mediodía es la de la sombra más corta del día (la que apunta derecho hacia abajo del disco).<\/li>\n<\/ol>\n<p><strong>Hora solar y hora oficial:<\/strong> el mediodía del sol no coincide con las 12 del reloj oficial. En el Alto Valle el sol pasa por lo más alto alrededor de las 13:30, con una diferencia de hasta 15 minutos según la época del año. Para la vida de la comunidad, alcanza con usar la hora del sol.<\/p>"},{"t":"Leer el tiempo (188)","h":"<h3>Leer el tiempo (188)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Señal<\/th>\n<th>Suele anunciar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nubes altas y finas como pinceladas que avanzan y se espesan<\/td>\n<td>Cambio de tiempo o lluvia en 1 o 2 días<\/td>\n<\/tr>\n<tr>\n<td>Nubes que crecen en torres oscuras por la tarde<\/td>\n<td>Tormenta, granizo, viento fuerte en horas<\/td>\n<\/tr>\n<tr>\n<td>Halo alrededor del sol o la luna<\/td>\n<td>Humedad en altura; posible lluvia<\/td>\n<\/tr>\n<tr>\n<td>Noche despejada, sin viento, frío al atardecer<\/td>\n<td>Helada (tapar la huerta)<\/td>\n<\/tr>\n<tr>\n<td>El viento cambia de golpe y baja la temperatura<\/td>\n<td>Entrada de un frente frío<\/td>\n<\/tr>\n<tr>\n<td>Barómetro que baja rápido<\/td>\n<td>Mal tiempo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Llevar un cuaderno del tiempo de cada día: después de un año, la comunidad conoce su propio clima.<\/p>"},{"t":"Preparar la casa para inundaciones, sequías y calor (189, 190)","h":"<h3>Preparar la casa para inundaciones, sequías y calor (189, 190)<\/h3>\n<p><strong>Inundación:<\/strong> saber hasta dónde llegó el agua en crecidas anteriores. Semillas, despensa, documentos y herramientas en alto. Bolsas de arpillera o nylon llenas de tierra para frenar el agua en las puertas. Cortar luz y gas si el agua entra. Después: no tomar ni cocinar con agua que no se haya tratado, y desinfectar todo lo que tocó el agua de la inundación (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"1\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 2<\/a>, <em>Limpiar la casa después de una inundación<\/em>).<\/p>\n<p><strong>Sequía y ola de calor:<\/strong> cosechar y guardar toda el agua posible antes; acolchado grueso en la huerta; media sombra; regar de noche. Trabajar de madrugada y al atardecer, siesta en las horas de calor, agua siempre a mano, y vigilar a bebés, ancianos y animales. Ventanas cerradas y tapadas de día, abiertas de noche.<\/p>\n<p><span class=\"ref\">►<\/span> <strong>Riesgos propios del Alto Valle<\/strong> (represas y crecidas, canales de riego, ceniza volcánica, petróleo y gas, jaurías): <a class=\"x\" data-b=\"RIE\" data-c=\"0\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em><\/a>.<\/p>"},{"t":"Viento fuerte, Zonda y tormentas de polvo [VITAL]","h":"<h3>Viento fuerte, Zonda y tormentas de polvo <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>En el norte de la Patagonia los vientos del oeste soplan fuerte en primavera, y en Cuyo y el oeste el Zonda llega caliente y seco. Arrancan chapas, voltean árboles, rompen invernaderos y propagan incendios.<\/p>\n<p><strong>Antes (en tiempo tranquilo)<\/strong><\/p>\n<ul>\n<li><strong>Techos:<\/strong> chapas con tornillos, no clavos (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"4\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 5<\/a>). En los techos livianos, alambres o planchuelas pasados por arriba y atados a estacas o \"muertos\" enterrados.<\/li>\n<li><strong>Árboles:<\/strong> podar ramas secas o quebradas que caen sobre casas, corrales o cables. Las cortinas de álamo de las chacras son el mejor rompevientos: cuidarlas y replantarlas.<\/li>\n<li><strong>Invernaderos y mallas:<\/strong> nylon bien tenso y sujeto con listones (no con clavos solos), estructura anclada al piso, puertas con traba.<\/li>\n<li><strong>Todo lo suelto,<\/strong> atado o guardado: chapas, tablas, bidones, nylon, sillas.<\/li>\n<li>Tapas trabadas en tanques, cisternas y pozos.<\/li>\n<\/ul>\n<p><strong>Durante<\/strong><\/p>\n<ul>\n<li>Quedarse adentro, lejos de ventanas y de paredes que dan al viento. Si una ventana se rompe, cerrar la puerta de ese cuarto.<\/li>\n<li>No salir a buscar lo que se vuela: las chapas sueltas cortan como cuchillos.<\/li>\n<li><strong>Fuego apagado<\/strong> afuera y cuidado extremo adentro: con viento seco, una chispa incendia el campo (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"3\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 4<\/a>).<\/li>\n<li>Animales encerrados en su refugio, con agua.<\/li>\n<li><strong>Polvo:<\/strong> pañuelo húmedo sobre nariz y boca, anteojos, ventanas cerradas y trapos mojados en las rendijas. Tapar el agua de beber y los alimentos.<\/li>\n<li><strong>Zonda:<\/strong> calor y sequedad extremos. Tomar agua aunque no haya sed, sobre todo bebés, ancianos y quienes trabajan afuera; paños mojados colgados en el cuarto humedecen el aire. Es normal que la gente esté irritable: evitar discusiones importantes ese día.<\/li>\n<\/ul>\n<p><strong>Después<\/strong><\/p>\n<ul>\n<li>Recorrer con luz de día: chapas flojas, árboles quebrados que pueden caer, cables caídos (tratar todo cable como si tuviera corriente).<\/li>\n<li>Revisar el agua: tanques destapados o con tierra se limpian antes de usarlos.<\/li>\n<li>Reparar lo dañado antes del próximo viento.<\/li>\n<\/ul>"},{"t":"Terremoto [VITAL]","h":"<h3>Terremoto <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Río Negro y el Alto Valle tienen poca actividad sísmica, pero Mendoza, San Juan, Neuquén cerca de la cordillera y el NOA tienen sismos fuertes.<\/p>\n<p><strong>Prevención<\/strong><\/p>\n<ul>\n<li>Fijar a la pared estantes, roperos y tanques. Lo pesado, abajo.<\/li>\n<li><strong>Despensa:<\/strong> frascos de conserva en estantes con baranda o listón al frente, nunca apilados.<\/li>\n<li>Saber dónde están las llaves de gas y agua y cómo se cierran.<\/li>\n<li>Casas de adobe: refuerzos de madera, tamaño de vanos y techo liviano (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"4\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 5<\/a>).<\/li>\n<li>Elegir en cada cuarto un \"lugar seguro\" (bajo una mesa firme, junto a una pared interior) y practicarlo con los chicos.<\/li>\n<\/ul>\n<p><strong>Durante<\/strong><\/p>\n<ul>\n<li><strong>Agacharse, cubrirse y sujetarse:<\/strong> bajo una mesa firme, tomado de una pata, o junto a una pared interior protegiendo la cabeza y la nuca con los brazos.<\/li>\n<li><strong>No correr hacia afuera mientras tiembla:<\/strong> la mayoría de los heridos son por cosas que caen al salir (vidrios, mampostería, chapas).<\/li>\n<li>En la cama, quedarse y cubrirse la cabeza con la almohada.<\/li>\n<li>Afuera, alejarse de paredes, árboles, postes y cables.<\/li>\n<\/ul>\n<p><strong>Después<\/strong><\/p>\n<ol>\n<li>Revisar heridos <span class=\"ref\">►<\/span> Manual médico T1 (bloque 3).<\/li>\n<li><strong>Olor a gas:<\/strong> cerrar la llave, no prender fuego ni fósforos, ventilar.<\/li>\n<li><strong>Mirar la casa antes de entrar:<\/strong> grietas en diagonal o en X en paredes, techo o vigas desplazados, paredes fuera de plomo → no entrar hasta que alguien con experiencia la revise.<\/li>\n<li><strong>Chimeneas y estufas:<\/strong> revisarlas antes de volver a prender fuego; una chimenea rajada provoca incendios y monóxido.<\/li>\n<li><strong>Agua:<\/strong> pozos y cisternas pueden enturbiarse o rajarse: tratar toda el agua hasta revisarlos.<\/li>\n<li>Esperar réplicas: las primeras horas, dormir afuera o en la parte más segura de la casa.<\/li>\n<li>Los chicos se asustan durante días: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\">cap. 2<\/a>, <em>Miedo, estrés y duelo<\/em>.<\/li>\n<\/ol>"}]},{"t":"Plantillas para fotocopiar","s":[{"t":"","h":"<p>Cada plantilla está en una página aparte para fotocopiarla o copiarla a mano en un cuaderno. Conviene tener una carpeta por tema y guardar los originales sin escribir. Las plantillas de salud (fichas de pacientes, botiquín, partos) están en <span class=\"ref\">►<\/span> Manual médico T1 y T2, <em>Plantillas para fotocopiar<\/em>; las de gallinas y cabras, en sus propios manuales.<\/p>\n<div style=\"page-break-before:always\"><\/div>"},{"t":"Ficha de la familia","h":"<h3>Ficha de la familia<\/h3>\n<p>Familia: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>_  Casa / lugar: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>_  Fecha: <strong><em>_<\/em><\/strong>_____<\/p>\n<table>\n<thead>\n<tr>\n<th>Nombre<\/th>\n<th>Ed
