e cemento o tierra.<\/li>\n<li><strong>Lejos de las paredes exteriores<\/strong> y de las ventanas, contra una pared interior.<\/li>\n<li><strong>Colchón de relleno:<\/strong> una funda de lona o arpillera rellena de chala de maíz, paja o lana. Se airea al sol una vez por semana y el relleno se cambia cada pocos meses. Debajo, varias capas de cartón.<\/li>\n<li><strong>Cama cerrada:<\/strong> tres lados con tablas o frazadas colgadas y un techo de tela; el calor del cuerpo queda adentro. Es lo que se usaba en el campo antes de la calefacción.<\/li>\n<li><strong>Calor extra:<\/strong> bolsas de agua caliente o botellas de vidrio grueso envueltas en tela, ladrillos calentados al lado del fuego y envueltos en una toalla. Nunca brasas ni estufas sin tiraje cerca de la cama.<\/li>\n<li><strong>Juntos:<\/strong> dormir varios en la misma cama o con los colchones juntos ahorra calor. Los bebés: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 2<\/a> (dormir seguro).<\/li>\n<\/ul>"},{"t":"Refugio de emergencia (113)","h":"<h3>Refugio de emergencia (113)<\/h3>\n<p>Si la casa no se puede usar: una lona o nylon de 200 micrones atada entre dos árboles a 1 m de altura, con un lado hasta el piso del lado del viento. Debajo, una cama de ramas o paja de 20 cm: se pierde más calor hacia el suelo que hacia el aire. Fuego delante del lado abierto, con una pared de troncos o piedras detrás del fuego que refleje el calor hacia el refugio.<\/p>"},{"t":"Carbón vegetal [AÑOS]","h":"<h3>Carbón vegetal <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Lo necesitan la fragua, los filtros de agua y la cocina sin humo.<\/p>\n<p><strong>Método del tambor (retorta)<\/strong><\/p>\n<ol>\n<li>Tambor de 200 litros con tapa, con 3 o 4 agujeros de 2 cm en la base.<\/li>\n<li>Llenarlo con leña seca cortada en trozos parejos, bien apretada.<\/li>\n<li>Apoyarlo sobre ladrillos y hacer fuego abajo y alrededor.<\/li>\n<li>El humo sale por los agujeros: primero blanco y espeso (es agua), después amarillento, por último casi transparente o azulado.<\/li>\n<li>Cuando el humo se vuelve transparente, sacar el fuego, tapar los agujeros con barro y cubrir el tambor con tierra.<\/li>\n<li>Dejar enfriar 24 horas sin abrir. Si entra aire en caliente, el carbón se quema.<\/li>\n<\/ol>\n<p>Rinde alrededor de un quinto del peso de leña. Los gases del paso 4 son inflamables y tóxicos: hacerlo al aire libre, lejos de las casas.<\/p>"},{"t":"Luz sin red (158, 159)","h":"<h3>Luz sin red (158, 159)<\/h3>\n<p><strong>Velas de cera de abeja.<\/strong> Derretir cera a baño María (nunca directo al fuego: se inflama). Pabilo de algodón trenzado, mojado primero en cera y enderezado. Sumergirlo varias veces dejando enfriar entre cada baño, o colarla en moldes de caño. Pabilo fino para velas finas: uno grueso hace humo. La cera de soja o la parafina sirven igual.<\/p>\n<p><strong>Lámpara de aceite vegetal.<\/strong> Un frasco con 3 cm de aceite de cocina usado, una mecha de cordón de algodón sostenida por un alambre doblado que la deja asomar 3 mm sobre el aceite. Da luz como una vela y no explota. Mecha más alta = más humo, no más luz.<\/p>\n<p><strong>Ahorro:<\/strong> cenar y hacer las tareas con luz de día. En invierno, la noche es para dormir.<\/p>"}]},{"t":"Prevenir y combatir incendios","s":[{"t":"","h":"<p>Sin bomberos, un incendio puede llevarse en una hora la casa, la despensa y las semillas de un año. Con fuego encendido todos los días para cocinar y calentar, la prevención tiene que ser una rutina de la comunidad, no una preocupación ocasional. <span class=\"b vital\">VITAL<\/span><\/p>"},{"t":"Prevención en la casa","h":"<h3>Prevención en la casa<\/h3>\n<ul>\n<li><strong>Chimeneas:<\/strong> la leña húmeda deja creosota (hollín pegajoso) que se prende fuego adentro del caño. Deshollinar cada mes en invierno con un cepillo o una bolsa con cadenas que se sube y baja con una soga. Si el caño ruge y sale fuego por arriba, cerrar el tiraje y echar sal gruesa en el fuego.<\/li>\n<li><strong>Cenizas:<\/strong> a un balde de metal con tapa, afuera, sobre tierra, durante 3 días. Las cenizas \"apagadas\" guardan brasas hasta 72 horas.<\/li>\n<li><strong>Distancias:<\/strong> nada que arda a menos de 1 metro de una estufa. Leñera a más de 3 metros de la casa.<\/li>\n<li><strong>Velas y lámparas:<\/strong> sobre un plato con arena o agua, nunca solas en un cuarto, nunca cerca de cortinas ni en el cuarto donde duermen los chicos.<\/li>\n<li><strong>Combustibles:<\/strong> nafta, querosene y garrafas fuera de la casa, en un lugar con sombra y ventilado.<\/li>\n<li><strong>Cocina:<\/strong> nunca dejar aceite caliente solo. Mango de las ollas hacia adentro.<\/li>\n<\/ul>"},{"t":"Equipo mínimo por casa","h":"<h3>Equipo mínimo por casa<\/h3>\n<table>\n<thead>\n<tr>\n<th>Elemento<\/th>\n<th>Dónde<\/th>\n<th>Para qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tambor de 200 l lleno de agua y 2 baldes<\/td>\n<td>Junto a la casa, sin tapa con candado<\/td>\n<td>Primer ataque<\/td>\n<\/tr>\n<tr>\n<td>Balde con arena seca y pala<\/td>\n<td>Junto a la cocina<\/td>\n<td>Aceite y combustibles<\/td>\n<\/tr>\n<tr>\n<td>Frazada de lana mojable<\/td>\n<td>Cocina<\/td>\n<td>Tapar ollas, ahogar fuego, envolver a una persona<\/td>\n<\/tr>\n<tr>\n<td>Batefuego (palo con goma o lona en la punta)<\/td>\n<td>Galería<\/td>\n<td>Pastos y monte<\/td>\n<\/tr>\n<tr>\n<td>Matafuegos (mientras duren)<\/td>\n<td>Cocina y dormitorios<\/td>\n<td>Fuego chico, dentro de los primeros segundos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Cómo apagar según qué se quema","h":"<h3>Cómo apagar según qué se quema<\/h3>\n<table>\n<thead>\n<tr>\n<th>Qué se quema<\/th>\n<th>Sí<\/th>\n<th>Nunca<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Madera, papel, tela, pasto<\/td>\n<td>Agua, tierra, arena<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Aceite de cocina<\/td>\n<td>Tapar la olla con una tapa o frazada mojada y apagar el fuego de abajo<\/td>\n<td>Agua: hace estallar el aceite en llamas<\/td>\n<\/tr>\n<tr>\n<td>Nafta, querosene<\/td>\n<td>Arena, tierra, frazada<\/td>\n<td>Agua (el combustible flota y se esparce)<\/td>\n<\/tr>\n<tr>\n<td>Instalación eléctrica (si hay generador o paneles)<\/td>\n<td>Cortar la corriente, después tierra o arena<\/td>\n<td>Agua con la corriente conectada<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Si el fuego pasa del tamaño de un balde o llega al techo, <strong>no se pelea: se sale<\/strong>. Primero las personas, después las semillas, después lo demás.<\/p>"},{"t":"Si hay humo en la casa","h":"<h3>Si hay humo en la casa<\/h3>\n<ul>\n<li>Salir agachado o gateando: el aire limpio está a 30 cm del piso.<\/li>\n<li>Tocar las puertas con el dorso de la mano antes de abrirlas. Si quema, no abrir: buscar otra salida.<\/li>\n<li>Punto de encuentro fijo afuera, y contar a todos. Nadie vuelve a entrar a buscar cosas.<\/li>\n<li>A una persona con la ropa en llamas: que se tire al suelo y ruede, o envolverla en una frazada <span class=\"ref\">►<\/span> Manual médico T1 3.27 y 4.52.<\/li>\n<li>Practicar la salida con los chicos dos veces por año, de día y de noche.<\/li>\n<\/ul>"},{"t":"Incendios de pastizal y monte","h":"<h3>Incendios de pastizal y monte<\/h3>\n<p>En verano, con viento, un fuego de pastizal avanza más rápido de lo que corre una persona. En Patagonia y en las sierras, además, sube rápido por las laderas.<\/p>\n<p><strong>Franja de protección alrededor de la casa<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Distancia de la casa<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0 a 10 m<\/td>\n<td>Tierra desnuda, huerta regada o pasto corto y verde. Nada de leña, pasto seco ni ramas sobre el techo<\/td>\n<\/tr>\n<tr>\n<td>10 a 30 m<\/td>\n<td>Árboles podados hasta 2 m de altura, separados entre sí. Pasto cortado antes del verano<\/td>\n<\/tr>\n<tr>\n<td>Canaletas y techo<\/td>\n<td>Limpiar hojas secas cada mes en temporada<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Combatirlo<\/strong><\/p>\n<ul>\n<li>Solo se combate un fuego de pastizal chico, desde el costado o desde atrás, nunca de frente ni cuesta arriba del fuego.<\/li>\n<li>Batefuegos para golpear las llamas bajas, palas para echar tierra, rastrillos para abrir una línea de tierra desnuda delante del avance.<\/li>\n<li>Siempre con una ruta de escape detrás, hacia una zona ya quemada, arada o con agua.<\/li>\n<li>Si el viento cambia o las llamas pasan la altura de una persona, abandonar.<\/li>\n<\/ul>\n<p><strong>Evacuar a tiempo<\/strong><\/p>\n<ul>\n<li>Decidir antes cuál es la ruta y dónde se juntan todos.<\/li>\n<li>Salir apenas se ve que el humo viene hacia el pueblo, no cuando ya se ven las llamas.<\/li>\n<li>Tener lista una caja con semillas, documentos, el cuaderno de registro y los remedios.<\/li>\n<\/ul>"},{"t":"Organización comunitaria","h":"<h3>Organización comunitaria<\/h3>\n<ul>\n<li>Una brigada de 6 a 10 personas adultas, con un responsable y un reemplazo.<\/li>\n<li>Una señal de alarma conocida por todos (campana, silbato con tres pitadas largas, golpe en una llanta).<\/li>\n<li>Una práctica al inicio de cada verano: señal, juntarse, armar la cadena de baldes, revisar el agua guardada.<\/li>\n<li>Prohibición de quemas al aire libre los días de viento, en toda la comunidad.<\/li>\n<\/ul>"}]},{"t":"Construcción con lo que hay","s":[{"t":"","h":"<p>Cuando no hay corralón, se construye con tierra, paja, piedra, caña, madera y cal, como se construyó en el país durante siglos. Una casa de tierra bien hecha dura generaciones si cumple la regla de los viejos constructores: <strong>buenas botas y buen sombrero<\/strong>, es decir, cimiento alto que no deje subir la humedad y aleros anchos que no dejen que la lluvia moje los muros.<\/p>\n<div class=\"atencion\">\n<p><strong>Zonas sísmicas.<\/strong> En buena parte de Cuyo, el NOA y zonas de Neuquén hay riesgo de terremotos. Un muro de adobe sin refuerzo puede derrumbarse sobre quienes están adentro. Allí, construir solo con estructura de madera o de hormigón armado, vigas de encadenado arriba de los muros y asesoramiento de alguien que sepa de construcción sismorresistente. La quincha, por su estructura flexible, se comporta mejor que el adobe.<\/p>\n<\/div>"},{"t":"Conocer la tierra: prueba del frasco y del chorizo","h":"<h3>Conocer la tierra: prueba del frasco y del chorizo<\/h3>\n<ol>\n<li><strong>Frasco:<\/strong> un frasco de vidrio lleno un tercio con tierra del lugar (sin la capa negra de arriba, que tiene materia orgánica), completar con agua y una pizca de sal, agitar fuerte y dejar 24 horas. Se separan capas: abajo arena, en el medio limo, arriba arcilla. Para adobe y revoque sirve una tierra con entre un 15 y un 30 % de arcilla.<\/li>\n<li><strong>Chorizo:<\/strong> amasar tierra húmeda en un chorizo de 2 cm de grosor y empujarlo por el borde de la mano. Si se corta antes de 5 cm, tiene poca arcilla (agregar tierra arcillosa); si aguanta más de 15 cm, tiene mucha (agregar arena).<\/li>\n<\/ol>"},{"t":"Qué construir primero [VITAL]","h":"<h3>Qué construir primero <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Con pocas manos y pocos materiales, el orden importa más que la técnica.<\/p>\n<ol>\n<li><strong>Agua y baño:<\/strong> juntar y guardar agua; baño seco o letrina; lavamanos (cap. 1 y 2).<\/li>\n<li><strong>Techo sano en una habitación<\/strong> donde dormir todos en invierno, con la mejor aislación posible (cap. 3).<\/li>\n<li><strong>Una forma de cocinar y calentar sin humo<\/strong> dentro de la casa: rocket o estufa con buen tiraje (cap. 3).<\/li>\n<li><strong>Cerco de la huerta y gallinero cerrado<\/strong> contra zorros y perros (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"6\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 7<\/a>).<\/li>\n<li><strong>Despensa seca y a prueba de ratas<\/strong> (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 1<\/a> y 5).<\/li>\n<li><strong>Leñera<\/strong> con la leña del invierno siguiente.<\/li>\n<li><strong>Cisterna, invernadero, horno de barro, taller:<\/strong> cuando lo anterior funciona.<\/li>\n<\/ol>\n<p>Reparar lo que hay rinde más que construir de nuevo: arreglar un techo existente cuesta la décima parte de levantar una pieza.<\/p>"},{"t":"Rescatar materiales de casas y galpones abandonados [AÑOS]","h":"<h3>Rescatar materiales de casas y galpones abandonados <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Después de un colapso habrá construcciones vacías: son el corralón que queda. Antes de tocar nada, <strong>la comunidad decide qué se rescata y de quién es<\/strong> (puede volver el dueño o una familia que lo necesite más) y se anota en el registro (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 4<\/a>).<\/p>\n<p><strong>Qué vale más<\/strong><\/p>\n<ul>\n<li>Chapas, tirantes, tablas, machimbre, aberturas completas (puertas y ventanas con marco), vidrios.<\/li>\n<li>Caños de agua y de gas, canillas, tanques, canaletas.<\/li>\n<li>Cables eléctricos (el cobre sirve para todo), llaves, lámparas, baterías.<\/li>\n<li>Ladrillos (se limpian a golpe de cuchara), tejas, bloques, bolsas de cemento sin endurecer.<\/li>\n<li>Clavos, tornillos, bulones, bisagras, alambre, rejas, mallas.<\/li>\n<li>Colchones secos, telas, cortinas, frazadas: abrigo y aislación.<\/li>\n<\/ul>\n<p><strong>Con cuidado<\/strong><\/p>\n<ul>\n<li><strong>No entrar<\/strong> si hay paredes rajadas, techos hundidos o vigas caídas. De a dos, de día, con casco o gorra gruesa, guantes y calzado de suela firme (los clavos en el piso son la herida más común <span class=\"ref\">►<\/span> Manual médico T1, tétanos).<\/li>\n<li><strong>Chapas y tanques de fibrocemento viejos<\/strong> (los grises con fibras, comunes en techos de galpones y tanques de antes de los años 2000) pueden tener <strong>asbesto<\/strong>: no romperlos, cortarlos ni lijarlos en seco. Si hay que sacarlos, mojarlos y desatornillarlos enteros.<\/li>\n<li><strong>Electricidad:<\/strong> aunque no haya red, puede haber generadores o paneles conectados. Tratar todo cable como si tuviera corriente hasta comprobarlo.<\/li>\n<li><strong>Gas:<\/strong> cerrar la llave de entrada antes de desarmar caños.<\/li>\n<li><strong>Productos químicos<\/strong> (venenos, combustibles, pinturas viejas): no mezclar ni quemar; guardarlos aparte, rotulados.<\/li>\n<li>Desarmar de arriba hacia abajo, al revés de cómo se construyó.<\/li>\n<\/ul>"},{"t":"Adobe [AÑOS] (96)","h":"<h3>Adobe <span class=\"b anos\">AÑOS<\/span> (96)<\/h3>\n<p><strong>Mezcla:<\/strong> tierra con la arcilla justa, agua y paja picada de 5 a 10 cm (o bosta seca de caballo o de vaca, que también da fibra). Se pisa con los pies o con un caballo hasta que quede como barro espeso y parejo. Dejar \"podrir\" 2 o 3 días tapado: queda más plástico.<\/p>\n<p><strong>Moldeo<\/strong><\/p>\n<ol>\n<li>Molde de madera sin fondo de 40 × 20 × 10 cm (o 30 × 15 × 10), mojado y espolvoreado con arena.<\/li>\n<li>Llenar apretando bien en las esquinas, alisar arriba y levantar el molde.<\/li>\n<li>Secar a la sombra los primeros días (al sol fuerte se agrietan), y después parados de canto. Total: 2 a 4 semanas.<\/li>\n<li><strong>Prueba:<\/strong> un adobe seco dejado caer desde la altura de la cintura sobre tierra no se rompe.<\/li>\n<\/ol>\n<p><strong>Muro:<\/strong> sobre un cimiento de piedra o de hormigón que sobresalga al menos 30 a 40 cm del suelo, con una capa que corte la humedad (nylon grueso o brea). Asentar los adobes trabados con mortero de la misma mezcla. Muros de al menos 30 cm de espesor. Arriba, una viga de madera o encadenado que ate todo.<\/p>"},{"t":"Quincha [AÑOS] (98)","h":"<h3>Quincha <span class=\"b anos\">AÑOS<\/span> (98)<\/h3>\n<p>Una estructura de postes y vigas de madera, con cañas o varas entretejidas o clavadas horizontalmente cada 10 a 15 cm, rellenada y revocada con barro con paja de ambos lados. Es liviana, rápida, usa poca tierra y se mueve sin caerse con los sismos. Es la técnica tradicional del NOA y de Cuyo.<\/p>"},{"t":"Fardos de paja [AÑOS] (99)","h":"<h3>Fardos de paja <span class=\"b anos\">AÑOS<\/span> (99)<\/h3>\n<p>Muros de fardos de paja de trigo o de avena (no de pasto, que se pudre), bien secos y apretados, apilados trabados sobre un cimiento elevado, con estacas de madera o caña que los atraviesan. Se revocan con barro y cal en varias capas. Aíslan muy bien del frío: ideales para la Patagonia y la llanura. Su enemigo es la humedad: alero ancho y cimiento alto, sin excepción.<\/p>"},{"t":"Bloques de suelo-cemento [MEJORA] (97)","h":"<h3>Bloques de suelo-cemento <span class=\"b mejora\">MEJORA<\/span> (97)<\/h3>\n<p>Mientras haya cemento: 1 parte de cemento cada 8 a 12 de tierra arenosa, humedecida apenas, prensada en una prensa manual de bloques. Curar los bloques a la sombra, mojados, 7 días. Son más resistentes al agua que el adobe.<\/p>"},{"t":"Revoque de barro [AÑOS] (100)","h":"<h3>Revoque de barro <span class=\"b anos\">AÑOS<\/span> (100)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Capa<\/th>\n<th>Mezcla (en volumen)<\/th>\n<th>Espesor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Grueso<\/td>\n<td>1 de tierra arcillosa, 2 a 3 de arena, paja picada corta<\/td>\n<td>1,5 a 3 cm<\/td>\n<\/tr>\n<tr>\n<td>Fino<\/td>\n<td>1 de tierra arcillosa tamizada, 2 de arena fina, fibra muy corta o bosta tamizada<\/td>\n<td>0,5 cm<\/td>\n<\/tr>\n<tr>\n<td>Terminación<\/td>\n<td>Pintura a la cal (ver abajo) o barro fino con un poco de cal<\/td>\n<td>Varias manos finas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Mojar el muro antes de revocar. Tirar la mezcla con fuerza y alisar con llana de madera. Si se agrieta mucho, tiene demasiada arcilla.<\/p>"},{"t":"Cal: fabricarla y usarla [AÑOS] (101)","h":"<h3>Cal: fabricarla y usarla <span class=\"b anos\">AÑOS<\/span> (101)<\/h3>\n<p>La cal sirve para morteros, revoques, pintura, desinfección de gallineros, nixtamalizar maíz y conservar huevos.<\/p>\n<p><strong>Fabricarla<\/strong><\/p>\n<ol>\n<li>Materia prima: piedra caliza, conchilla o caracoles marinos. Se reconoce porque burbujea con unas gotas de vinagre.<\/li>\n<li>Partir en trozos del tamaño de un puño y quemarla en un horno de piedra o ladrillo con mucha leña, al rojo vivo, durante 1 a 3 días.<\/li>\n<li>Lo que sale es <strong>cal viva:<\/strong> pesa menos y se deshace en polvo. Es muy peligrosa: quema la piel y puede dejar ciego.<\/li>\n<li><strong>Apagar la cal:<\/strong> con guantes, antiparras y manga larga, echar los terrones de a poco en un tacho con el triple de agua (nunca el agua sobre la cal). Hierve y salpica. Revolver con un palo largo.<\/li>\n<li>Dejar estacionar la pasta de cal bajo agua: cuanto más tiempo (meses), mejor.<\/li>\n<\/ol>\n<p><strong>Usarla<\/strong><\/p>\n<ul>\n<li><strong>Mortero de cal:<\/strong> 1 parte de pasta de cal, 3 de arena. Fragua lento, durante semanas.<\/li>\n<li><strong>Pintura a la cal (101):<\/strong> 1 kg de cal apagada en 4 o 5 litros de agua, más un puñado de sal. Aplicar 3 o 4 manos finas con brocha sobre la pared mojada. Repite cada año. Es desinfectante y deja respirar los muros de tierra.<\/li>\n<\/ul>"},{"t":"Horno de barro [AÑOS] (104)","h":"<h3>Horno de barro <span class=\"b anos\">AÑOS<\/span> (104)<\/h3>\n<ol>\n<li><strong>Base:<\/strong> una mesada de ladrillo, piedra o troncos rellenos de tierra, de 80 a 90 cm de alto.<\/li>\n<li><strong>Aislación del piso:<\/strong> una capa de botellas de vidrio acostadas, cubiertas con arena y barro, debajo del piso de ladrillos. Así el piso no pierde el calor.<\/li>\n<li><strong>Piso:<\/strong> ladrillos comunes asentados en arena, bien nivelados. Será el piso donde se hornea.<\/li>\n<li><strong>Molde:<\/strong> sobre el piso, una cúpula de arena húmeda del tamaño del horno (un horno familiar: 80 a 100 cm de diámetro y 40 a 45 cm de alto), cubierta con papel mojado.<\/li>\n<li><strong>Bóveda:<\/strong> cubrir el molde con una capa de 8 a 10 cm de barro con mucha arena y poca paja, apretando bien. Después, una segunda capa aislante de barro con mucha paja o aserrín.<\/li>\n<li><strong>Boca:<\/strong> su altura debe ser cerca de dos tercios de la altura interior de la cúpula; si es más alta, se escapa el calor. Una puerta de chapa o madera forrada.<\/li>\n<li>Dejar secar una semana, sacar la arena por la boca, y hacer fuegos chicos durante varios días antes del primer fuego fuerte.<\/li>\n<li>Techito o revoque con cal arriba para la lluvia.<\/li>\n<\/ol>"},{"t":"Ladrillos cocidos y alfarería [AÑOS]","h":"<h3>Ladrillos cocidos y alfarería <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p><strong>Preparar la arcilla:<\/strong> disolver tierra arcillosa en mucha agua, pasar por un colador, dejar decantar y sacar el agua de arriba. Secar hasta que se pueda amasar. Amasar mucho para sacar el aire (el aire hace explotar las piezas en el fuego).<\/p>\n<p><strong>Ladrillos cocidos:<\/strong> se moldean como el adobe, sin paja, se secan bien, y se queman apilados en un horno de campaña (los mismos ladrillos dejan canales para el fuego y se cubren con barro) durante 24 a 48 horas de fuego fuerte. Requiere mucha leña: es tarea de la comunidad.<\/p>\n<p><strong>Vasijas y ollas<\/strong><\/p>\n<ol>\n<li>Arcilla mezclada con un 20 % de arena fina o cerámica molida (así no se raja al fuego).<\/li>\n<li>Modelar con rollos (chorizos) superpuestos, alisando por dentro y por fuera.<\/li>\n<li>Secar a la sombra muy despacio: 1 o 2 semanas. Totalmente secas antes de quemar.<\/li>\n<li><strong>Quema en pozo:<\/strong> calentar las piezas cerca del fuego unas horas, después cubrirlas con leña y bosta seca y mantener fuego fuerte varias horas. Dejar enfriar dentro de las cenizas.<\/li>\n<li>Las ollas de barro sin esmaltar sirven para cocinar y guardar secos, para el riego por olla y para la heladera de barro.<\/li>\n<\/ol>\n<p><strong>Nunca usar esmaltes o vidriados con plomo<\/strong> en piezas para comida: el plomo pasa a los alimentos y envenena de a poco.<\/p>"},{"t":"Hormigón, ladrillos y cimientos [MEJORA] (111, 112, 115)","h":"<h3>Hormigón, ladrillos y cimientos <span class=\"b mejora\">MEJORA<\/span> (111, 112, 115)<\/h3>\n<p>Mientras quede cemento (en la bolsa se endurece con la humedad en pocos meses: guardarlo en bolsas de nylon cerradas y en lugar seco).<\/p>\n<table>\n<thead>\n<tr>\n<th>Uso<\/th>\n<th>Mezcla en volumen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hormigón para bases y losas<\/td>\n<td>1 de cemento, 2 de arena, 3 de piedra partida, agua justa (la mezcla tiene que quedar como masa espesa, no chirle)<\/td>\n<\/tr>\n<tr>\n<td>Mortero para ladrillos<\/td>\n<td>1/4 de cemento, 1 de cal, 4 de arena; o 1 de cal y 3 de arena sin cemento<\/td>\n<\/tr>\n<tr>\n<td>Hormigón ciclópeo para cimientos<\/td>\n<td>Hormigón común con piedras grandes agregadas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Curar el hormigón:<\/strong> mantenerlo mojado y tapado 7 días. Si se seca rápido, queda débil.<\/li>\n<li><strong>Cimientos (115):<\/strong> zanja hasta encontrar tierra firme (60 a 80 cm, más si el suelo es blando), rellenada con piedras y mortero u hormigón ciclópeo. Arriba, el sobrecimiento con una capa aisladora de humedad.<\/li>\n<li><strong>Pared de ladrillos (112):<\/strong> trabar las hiladas (cada junta vertical en el medio del ladrillo de abajo), un hilo tenso como guía de cada hilada, nivel de burbuja o manguera con agua para nivelar, y plomada (un peso colgado de un hilo) para que suba derecha. Mojar los ladrillos antes de asentarlos.<\/li>\n<\/ul>"},{"t":"Techos y goteras [AÑOS] (110, 180)","h":"<h3>Techos y goteras <span class=\"b anos\">AÑOS<\/span> (110, 180)<\/h3>\n<ul>\n<li><strong>Chapa:<\/strong> fijar con tornillos con arandela de goma en la parte alta de la onda, nunca en el valle. Reemplazar clavos que se aflojan.<\/li>\n<li><strong>Goteras:<\/strong> buscar desde adentro con lluvia, marcar, y desde afuera sellar con brea, membrana o un parche de chapa sobre la zona. El agua suele entrar más arriba de donde gotea.<\/li>\n<li><strong>Techo de barro y paja (torta de barro):<\/strong> sobre cañas y ramas, una capa de paja y una de barro con paja de 10 cm, con pendiente. Requiere mantenimiento después de cada temporada de lluvias. Funciona en zonas secas.<\/li>\n<li><strong>Aleros:<\/strong> al menos 50 cm en casas de tierra.<\/li>\n<\/ul>"},{"t":"Cisterna de ferrocemento [AÑOS] (109)","h":"<h3>Cisterna de ferrocemento <span class=\"b anos\">AÑOS<\/span> (109)<\/h3>\n<p>Un tanque de 5 a 15 mil litros que se arma con cemento, arena y alambre, y dura décadas. Para la lluvia del techo (<span class=\"ref\">►<\/span> <em>Juntar agua de lluvia<\/em>) o para guardar el agua del turno de riego. Conviene hacerla <strong>antes<\/strong> de que falten el cemento y la malla.<\/p>\n<p><strong>Para unos 10.000 litros:<\/strong> cilindro de 2,5 metros de diámetro y 2 metros de alto, apoyado en el suelo o semienterrado.<\/p>\n<p><strong>Pasos<\/strong><\/p>\n<ol>\n<li><strong>Base:<\/strong> nivelar, compactar 10 cm de ripio y hacer una losa de hormigón de 10 cm con una malla de hierro, 20 cm más ancha que el tanque. Dejar salir las puntas de los hierros de la malla para atar la pared.<\/li>\n<li><strong>Armadura de la pared:<\/strong> un cilindro de malla de hierro (tipo sima, 15 × 15 cm) atado a las puntas de la base, o alambre de 4 mm en espiral cada 10 cm sobre parantes verticales. Forrar por dentro y por fuera con malla de gallinero o metal desplegado, bien atados entre sí.<\/li>\n<li><strong>Mortero:<\/strong> 1 parte de cemento por 2 a 3 de arena fina lavada, con la menor cantidad de agua posible (que se pueda aplicar sin que chorree).<\/li>\n<li><strong>Revocar:<\/strong> con un tablero de chapa o tablas sostenido del otro lado, aplicar el mortero apretándolo para que pase entre las mallas. Espesor total: 4 a 6 cm. La pared entera se hace <strong>en un mismo día<\/strong> para que no queden juntas que pierdan.<\/li>\n<li><strong>Curar:<\/strong> cubrir con arpillera mojada y mantenerla húmeda <strong>de 7 a 14 días<\/strong>, regando varias veces por día. Si se seca antes, se raja. Es el paso que más se saltea y el que decide si la cisterna sirve.<\/li>\n<li><strong>Impermeabilizar:<\/strong> por dentro, una última mano de cemento puro con agua, alisada con cuchara.<\/li>\n<li><strong>Tapa:<\/strong> losa o domo de ferrocemento con una boca de 60 cm con tapa trabada (un chico que cae adentro se ahoga). Caño de entrada con filtro, caño de rebalse con tela mosquitera, y una canilla o bomba de mano.<\/li>\n<\/ol>\n<p><strong>Primer llenado:<\/strong> de a poco, a lo largo de una semana. Una pérdida chica suele cerrarse sola con el tiempo; una grieta se pica en V y se rellena con mortero rico en cemento.<\/p>\n<p><strong>Cisterna de ladrillo:<\/strong> igual, con pared de ladrillo común revocada por dentro con dos capas de mortero rico en cemento con hidrófugo. Necesita más materiales y es más difícil que no pierda.<\/p>"},{"t":"Habitación segura [AÑOS]","h":"<h3>Habitación segura <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Un cuarto de la casa preparado para resguardarse en un temporal, un sismo o ante una amenaza, con lo necesario para pasar horas adentro.<\/p>\n<ul>\n<li><strong>Cuál:<\/strong> un ambiente interior, con pocas o ninguna ventana a la calle, paredes de material y techo firme. Si hay ventana, chica y enrejada por dentro.<\/li>\n<li><strong>Puerta:<\/strong> maciza (no placa hueca), marco atornillado a la pared, tres bisagras, un pasador o cerrojo fuerte y una tranca de madera con soportes de hierro.<\/li>\n<li><strong>Siempre una segunda salida<\/strong> o una ventana que se pueda abrir desde adentro: un encierro sin salida es una trampa en un incendio.<\/li>\n<li><strong>Adentro:<\/strong> agua (2 litros por persona), linterna y pilas, botiquín, balde con tapa, abrigo, radio, comida para un día, y un listado de qué hacer.<\/li>\n<li><strong>Que todos sepan:<\/strong> cuándo se usa, quién cierra y quién cuenta a los chicos. Practicarlo una vez como juego (<span class=\"ref\">►<\/span> Manual médico T2 20.3).<\/li>\n<li>Para seguridad frente a personas: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 6<\/a>. Para sismo y viento: cap. 7 del mismo libro.<\/li>\n<\/ul>"}]},{"t":"Herramientas y oficios","s":[{"t":"","h":"<p>Sin ferretería, cada herramienta rota es una herramienta perdida si nadie sabe afilarla, encabarla o forjarla de nuevo. Una comunidad necesita al menos una persona en cada oficio: afilador, carpintero, herrero, mecánico de bicicletas, cordelero.<\/p>"},{"t":"Afilar [VITAL] (116, 117)","h":"<h3>Afilar <span class=\"b vital\">VITAL<\/span> (116, 117)<\/h3>\n<p><strong>Piedras:<\/strong> una de grano grueso para dar forma y una de grano fino para terminar. Se usan mojadas con agua (o aceite, según la piedra). Si no hay piedra, el fondo sin esmaltar de una taza de cerámica sirve para un cuchillo.<\/p>\n<table>\n<thead>\n<tr>\n<th>Herramienta<\/th>\n<th>Ángulo de cada lado<\/th>\n<th>Con qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cuchillo de cocina<\/td>\n<td>15 a 20°<\/td>\n<td>Piedra gruesa y fina<\/td>\n<\/tr>\n<tr>\n<td>Navaja y cuchillo de trabajo<\/td>\n<td>20 a 25°<\/td>\n<td>Piedra<\/td>\n<\/tr>\n<tr>\n<td>Hacha<\/td>\n<td>25 a 30°, filo levemente convexo<\/td>\n<td>Lima y piedra<\/td>\n<\/tr>\n<tr>\n<td>Azada y pala<\/td>\n<td>30 a 45°, de un solo lado<\/td>\n<td>Lima<\/td>\n<\/tr>\n<tr>\n<td>Guadaña y hoz<\/td>\n<td>Muy fino<\/td>\n<td>Piedra de guadaña cada media hora; martillado del filo de vez en cuando<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pasos para un cuchillo<\/strong><\/p>\n<ol>\n<li>Apoyar la hoja sobre la piedra con el ángulo indicado (para 20°: el lomo levantado más o menos la altura de dos monedas apiladas en un cuchillo común).<\/li>\n<li>Pasar la hoja como si se quisiera cortar una feta fina de la piedra, de la base a la punta, siempre con el mismo ángulo.<\/li>\n<li>Hacerlo de un lado hasta que se forme una rebaba (un filo doblado que se siente con el dedo del otro lado). Después del otro lado.<\/li>\n<li>Terminar en la piedra fina con pasadas alternadas y livianas, y sacar la rebaba pasando el filo sobre madera o cartón.<\/li>\n<\/ol>\n<p><strong>Serrucho:<\/strong> con lima triangular, diente por diente, siguiendo el ángulo original; cada tanto hay que volver a abrir los dientes (triscar). Es un trabajo de paciencia que conviene aprender de un carpintero.<\/p>"},{"t":"Cabos y mangos [VITAL] (118)","h":"<h3>Cabos y mangos <span class=\"b vital\">VITAL<\/span> (118)<\/h3>\n<ul>\n<li>Madera dura, de veta recta que corra a lo largo del cabo, sin nudos, bien seca.<\/li>\n<li>Tallar el ojo del cabo para que entre ajustado en la herramienta, meterlo a golpes, cortar lo que sobresale y clavar una cuña de madera dura (o metálica) en la ranura de arriba para abrirlo.<\/li>\n<li>Si se afloja, cambiar la cuña. No dejar la herramienta en agua \"para que se hinche\": la madera se pudre y queda más floja al secarse.<\/li>\n<li>Guardar cabos de repuesto para pala, azada, hacha y martillo.<\/li>\n<\/ul>"},{"t":"Madera: secar, trabajar, proteger [AÑOS] (119 a 130)","h":"<h3>Madera: secar, trabajar, proteger <span class=\"b anos\">AÑOS<\/span> (119 a 130)<\/h3>\n<ul>\n<li><strong>Secar la madera (126):<\/strong> troncos aserrados en tablas, apilados bajo techo con varillas separadoras cada 50 cm para que circule aire, y con peso arriba para que no se tuerzan. Cuenta tradicional: un año por cada 2,5 cm de espesor.<\/li>\n<li><strong>Cortar tablas a mano (125):<\/strong> con serrucho de dos personas o, mejor, partiendo troncos rectos con cuñas y hacha y después cepillando.<\/li>\n<li><strong>Banco de trabajo (119):<\/strong> una tabla gruesa (al menos 5 cm) a la altura de la muñeca con los brazos colgando, sobre patas robustas con travesaños. Una prensa de tornillo en la esquina. Es la primera obra del carpintero.<\/li>\n<li><strong>Uniones sin clavos (120):<\/strong> caja y espiga (un extremo tallado entra justo en un hueco del otro, y se traba con una clavija de madera), media madera, y espigas redondas (tarugos) encoladas. Duran más que los clavos y no dependen de comprar nada.<\/li>\n<li><strong>Muebles simples (121), escaleras (129), cajones (130):<\/strong> empezar por bancos, estantes, cajones para la despensa y camas elevadas para el invierno.<\/li>\n<li><strong>Utensilios (122, 128):<\/strong> cucharas, palas de amasar, tablas, cuencos. Madera verde de frutales o sauce, tallada con hacha chica y cuchillo de gancho, secada despacio. Torno de pértiga (123): un torno movido por un pedal y una vara flexible que hace girar la pieza; se puede construir con madera y una cuerda.<\/li>\n<li><strong>Aceite de lino (127):<\/strong> protege la madera de la intemperie. <strong>Peligro:<\/strong> los trapos con aceite de lino pueden prenderse fuego solos mientras se secan. Extenderlos abiertos afuera, o sumergirlos en agua, nunca hechos un bollo.<\/li>\n<\/ul>"},{"t":"Torno de pértiga [AÑOS]","h":"<h3>Torno de pértiga <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Un torno de madera movido con el pie, sin electricidad. Hace mangos, patas de silla, cucharones, cuencos, husos, ejes y bolillos.<\/p>\n<p><strong>Cómo funciona:<\/strong> una vara flexible (la pértiga) atada arriba hace de resorte. De su punta baja una cuerda que da dos vueltas a la pieza de madera y termina en un pedal. Al pisar, la pieza gira hacia uno y se corta; al soltar, la pértiga sube y la pieza gira al revés sin cortar.<\/p>\n<p><strong>Cómo armarlo<\/strong><\/p>\n<ol>\n<li><strong>Bancada:<\/strong> dos tirantes paralelos, separados 4 o 5 cm, sobre cuatro patas firmes a la altura de la cintura.<\/li>\n<li><strong>Cabezales:<\/strong> dos tacos que se paran sobre la bancada, uno fijo y uno que se corre y se traba con una cuña. Cada uno lleva una punta de hierro afilada (un bulón o un clavo grueso limado) a la misma altura: entre las dos puntas se sostiene la pieza.<\/li>\n<li><strong>Apoyo de herramienta:<\/strong> una tabla o barra a lo largo de la pieza, a 1 cm de ella, donde se apoya la gubia.<\/li>\n<li><strong>Pértiga:<\/strong> una vara de 2,5 a 3 metros de sauce, álamo joven o caña gruesa, atada al techo o a un poste, con la punta libre sobre el torno.<\/li>\n<li><strong>Pedal:<\/strong> una tabla articulada en el piso.<\/li>\n<\/ol>\n<p><strong>Cómo tornear:<\/strong> madera verde (recién cortada) se trabaja mucho más fácil que la seca. Apoyar la gubia en el apoyo, cortar solo cuando la pieza gira hacia uno, y mantener las herramientas muy afiladas (<span class=\"ref\">►<\/span> <em>Afilar<\/em>). Las gubias y formones se forjan (<span class=\"ref\">►<\/span> <em>Herrería básica<\/em>).<\/p>"},{"t":"Restaurar herramientas [AÑOS] (124, 178)","h":"<h3>Restaurar herramientas <span class=\"b anos\">AÑOS<\/span> (124, 178)<\/h3>\n<ul>\n<li><strong>Óxido:<\/strong> remojar en vinagre 12 a 24 horas, frotar con lana de acero o cepillo de alambre, enjuagar, secar y aceitar.<\/li>\n<li><strong>Guardarlas:<\/strong> limpias, secas y aceitadas, colgadas. Un balde con arena y un poco de aceite usado para clavar las palas y azadas al terminar el día las limpia y protege.<\/li>\n<li><strong>Reciclar (178):<\/strong> antes de tirar cualquier cosa, preguntarse qué parte sirve: tornillos, alambre, resortes, telas, cámaras de bicicleta (sirven como gomas elásticas), frascos, bidones.<\/li>\n<\/ul>"},{"t":"Herrería básica [AÑOS] (131)","h":"<h3>Herrería básica <span class=\"b anos\">AÑOS<\/span> (131)<\/h3>\n<p><strong>Fragua:<\/strong> un hogar de ladrillo o una llanta de camión con un caño en el fondo por donde entra aire de un fuelle (o de un ventilador manual). Combustible: carbón vegetal (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"2\" data-s=\"0\">cap. 3<\/a>). <strong>Yunque:<\/strong> un trozo de riel de ferrocarril o un bloque de acero. Martillo de 1 a 1,5 kg y tenazas.<\/p>\n<p><strong>De dónde sacar buen acero:<\/strong> elásticos de autos y camiones, limas viejas, discos de arado, resortes. Es acero con mucho carbono, que se puede templar.<\/p>\n<p><strong>Hacer una herramienta con filo (cuchillo, formón, punta)<\/strong><\/p>\n<ol>\n<li>Calentar al rojo naranja y forjar a golpes hasta la forma. Recalentar seguido: golpear en frío rompe el acero.<\/li>\n<li>Dejar enfriar despacio en ceniza (así queda blando para limar).<\/li>\n<li>Limar y dar forma final.<\/li>\n<li><strong>Templar:<\/strong> calentar parejo hasta que un imán deje de pegarse (rojo cereza) y enfriar de golpe en aceite vegetal (cuidado: se inflama; tener tapa a mano).<\/li>\n<li><strong>Revenir:<\/strong> el acero templado es duro pero quebradizo. Limpiar la pieza hasta que brille y calentarla despacio (al fuego o en el horno) mirando los colores: cuando el filo toma color paja o bronce, enfriar. Así queda duro y resistente.<\/li>\n<\/ol>\n<p><strong>Soldadura (132):<\/strong> la eléctrica depende de generador y electrodos; aprovecharla mientras dure para reparar estructuras y herramientas grandes. La soldadura en fragua (calentar dos piezas casi a blanco y martillarlas juntas con bórax) es la alternativa sin electricidad.<\/p>"},{"t":"Soldar sin electricidad [AÑOS] (132)","h":"<h3>Soldar sin electricidad <span class=\"b anos\">AÑOS<\/span> (132)<\/h3>\n<p><strong>Soldadura en fragua (caldeado)<\/strong><\/p>\n<p>Sirve para hierro dulce y acero de poco carbono: alambre grueso, hierro redondo, planchuelas. No sirve para fundición ni para aluminio.<\/p>\n<ol>\n<li><strong>Preparar las puntas:<\/strong> engrosarlas a golpes (recalcar) y biselarlas, para que una se apoye sobre la otra.<\/li>\n<li><strong>Calentar las dos piezas juntas<\/strong> en un fuego profundo de carbón limpio, con buen aire, hasta el color <strong>amarillo casi blanco<\/strong>, cuando empiezan a saltar chispas como de bengala.<\/li>\n<li><strong>Fundente:<\/strong> a media calentada, espolvorear bórax (de droguería) o arena silícea muy fina. Disuelve la cascarilla y deja el metal limpio.<\/li>\n<li><strong>Unir:<\/strong> sacar las piezas, apoyar una sobre otra en el yunque y golpear enseguida, liviano y rápido, desde el centro hacia los bordes. Hay 3 o 4 segundos.<\/li>\n<li>Recalentar al mismo color y golpear de nuevo para cerrar la unión y darle forma.<\/li>\n<\/ol>\n<p>Es difícil: practicar primero con dos alambres gruesos y probar doblando la unión. Si se separa, faltó temperatura o el metal estaba sucio.<\/p>\n<p><strong>Soldadura blanda (estaño)<\/strong><\/p>\n<p>Para chapas, latas, ollas y canaletas que no van al fuego. Un soldador de cobre (un bloque de cobre en un mango de hierro) se calienta en las brasas; la zona se lija hasta que brille, se pone pasta de soldar y se pasa el cobre caliente con estaño. Guardar estaño y pasta: no se pueden fabricar.<\/p>\n<p><strong>Sin soldar:<\/strong> muchas reparaciones se hacen con remaches (de clavo cortado y achatado), bulones, abrazaderas de chapa y ataduras de alambre. Guardar una caja de bulones y remaches surtidos.<\/p>"},{"t":"Cuerdas y nudos [VITAL] (133, 134)","h":"<h3>Cuerdas y nudos <span class=\"b vital\">VITAL<\/span> (133, 134)<\/h3>\n<p><strong>Hacer cuerda (133):<\/strong> con fibras largas y fuertes: hojas de totora o junco, cortezas internas, ortiga seca, lino, chala de maíz, o tiras de bolsas plásticas.<\/p>\n<ol>\n<li>Tomar un manojo y doblarlo en el medio.<\/li>\n<li>Retorcer cada mitad en el mismo sentido (por ejemplo, hacia la derecha) y después cruzar una sobre otra en el sentido contrario.<\/li>\n<li>Seguir alternando, agregando fibras nuevas escalonadas para que la cuerda sea larga y pareja.<\/li>\n<\/ol>\n<p><strong>Seis nudos que hay que saber<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Nudo<\/th>\n<th>Para qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>As de guía<\/td>\n<td>Una lazada fija que no se corre: atar a una persona, colgar un balde<\/td>\n<\/tr>\n<tr>\n<td>Ballestrinque<\/td>\n<td>Atar rápido a un poste o un árbol<\/td>\n<\/tr>\n<tr>\n<td>Nudo llano (o rizo)<\/td>\n<td>Unir dos cuerdas del mismo grosor, atar paquetes<\/td>\n<\/tr>\n<tr>\n<td>Vuelta de braza<\/td>\n<td>Arrastrar troncos, atar a algo redondo<\/td>\n<\/tr>\n<tr>\n<td>Nudo de camionero<\/td>\n<td>Tensar fuerte una carga o una lona, con efecto polea<\/td>\n<\/tr>\n<tr>\n<td>Nudo en ocho<\/td>\n<td>Tope al final de una cuerda para que no se escape<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Practicarlos con los chicos hasta que se puedan hacer a oscuras.<\/p>"},{"t":"Cestería [MEJORA] (177)","h":"<h3>Cestería <span class=\"b mejora\">MEJORA<\/span> (177)<\/h3>\n<p>Canastos para cosechas, huevos y leña con varas de sauce o mimbre (cortadas en invierno, sin hojas), junco o totora.<\/p>\n<ol>\n<li>Remojar las varas secas un día para que se doblen sin quebrarse.<\/li>\n<li><strong>Base:<\/strong> cruzar 4 varas sobre otras 4 en forma de cruz y entretejer una vara fina por arriba y por abajo, en espiral.<\/li>\n<li><strong>Paredes:<\/strong> clavar varas gruesas (los parantes) en la base, doblarlas hacia arriba y entretejer varas finas entre ellas.<\/li>\n<li><strong>Borde:<\/strong> doblar cada parante hacia abajo pasándolo por detrás de los siguientes.<\/li>\n<\/ol>"},{"t":"Motosierra [MEJORA] (135)","h":"<h3>Motosierra <span class=\"b mejora\">MEJORA<\/span> (135)<\/h3>\n<p>Útil mientras haya nafta, aceite de cadena y cadenas de repuesto. Afilar la cadena con lima redonda del diámetro indicado cada vez que se carga combustible. <strong>Seguridad:<\/strong> antiparras, protectores auditivos, guantes, calzado firme y nunca cortar con la punta (rebota hacia la cara). Ningún chico ni adolescente la usa.<\/p>"}]},{"t":"Energía, máquinas y transporte","s":[{"t":"","h":"<p>La red eléctrica, el gas y el combustible se terminan; el sol, el viento, el agua que baja, los animales y la fuerza humana bien multiplicada, no. Este capítulo junta lo que mueve cosas y da energía sin red.<\/p>"},{"t":"Energía solar y baterías [MEJORA] (160, 161, 162, 163)","h":"<h3>Energía solar y baterías <span class=\"b mejora\">MEJORA<\/span> (160, 161, 162, 163)<\/h3>\n<p>Sirven mientras duren el equipo y las baterías; no se pueden fabricar ni reparar sin industria. Útiles para radio, linternas, cargar teléfonos y una bomba de agua chica.<\/p>\n<ul>\n<li>Un panel de 100 W con un regulador de carga y una batería de 12 V alcanza para luz LED y cargar teléfonos de una familia.<\/li>\n<li>Las baterías de plomo duran mucho más si nunca se descargan por debajo de la mitad.<\/li>\n<li>El grupo electrógeno, solo al aire libre y lejos de ventanas (monóxido). Usarlo para tareas puntuales: es lo primero que se queda sin combustible.<\/li>\n<\/ul>"},{"t":"Calcular un equipo solar de 12 voltios [MEJORA]","h":"<h3>Calcular un equipo solar de 12 voltios <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Un equipo chico de 12 V (panel, regulador, batería, luces LED) es seguro de armar y alcanza para luz, radio y cargar teléfonos y linternas. Se calcula en tres pasos.<\/p>\n<p><strong>1. Cuánta energía se usa por día (en vatios-hora, Wh)<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Aparato<\/th>\n<th>Potencia<\/th>\n<th>Horas por día<\/th>\n<th>Energía por día<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4 lámparas LED de 12 V<\/td>\n<td>5 W cada una<\/td>\n<td>4 h<\/td>\n<td>80 Wh<\/td>\n<\/tr>\n<tr>\n<td>Radio<\/td>\n<td>3 W<\/td>\n<td>3 h<\/td>\n<td>9 Wh<\/td>\n<\/tr>\n<tr>\n<td>Cargar 2 teléfonos<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>30 Wh<\/td>\n<\/tr>\n<tr>\n<td>Cargar linternas y pilas recargables<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>20 Wh<\/td>\n<\/tr>\n<tr>\n<td>Bomba de agua chica de 12 V (si hay)<\/td>\n<td>50 W<\/td>\n<td>1 h<\/td>\n<td>50 Wh<\/td>\n<\/tr>\n<tr>\n<td><strong>Total del ejemplo<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><strong>unos 190 Wh<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>2. Panel:<\/strong> dividir el consumo diario por las horas de sol pleno del peor mes (en Patagonia Norte, en invierno, unas 2 a 3) y sumar 30 % de pérdidas. Ejemplo: 190 ÷ 2,5 × 1,3 ≈ <strong>100 W de panel<\/strong>. Orientarlo al norte, inclinado unos 50° en invierno (más parado) y 25° en verano.<\/p>\n<p><strong>3. Batería:<\/strong> para tener 3 días sin sol y no descargarla nunca más de la mitad (las de plomo mueren rápido si se vacían): consumo diario × 3 ÷ 0,5 ÷ 12. Ejemplo: 190 × 3 ÷ 0,5 ÷ 12 ≈ <strong>95 amperes-hora (Ah)<\/strong>: una batería de 100 Ah de ciclo profundo (o de auto, que dura menos).<\/p>\n<p><strong>Instalación:<\/strong> panel → regulador de carga → batería → consumos, con un fusible cerca del borne positivo de la batería. Cables cortos y gruesos. La batería ventilada, fuera de los dormitorios (larga gas al cargar) y fuera del alcance de los chicos.<\/p>"},{"t":"Bomba de soga [AÑOS]","h":"<h3>Bomba de soga <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Sube agua de un pozo de hasta 20 o 30 metros con una manivela, sin electricidad. Es la bomba manual más barata y fácil de reparar que existe; se arma con materiales de corralón y de bicicletería.<\/p>\n<p><strong>Cómo funciona:<\/strong> una soga sin fin lleva atados cada metro unos discos (pistones) apenas más chicos que el caño. La soga sube por dentro de un caño que llega al fondo del pozo, arrastrando el agua hacia arriba, y baja por fuera hasta una guía en el fondo que la vuelve a meter en el caño.<\/p>\n<p><strong>Materiales para un pozo de 10 a 15 metros<\/strong><\/p>\n<ul>\n<li>Caño de PVC de 1 pulgada (25 mm) de largo igual a la profundidad más 1 metro. Para más de 20 metros, caño de 3/4.<\/li>\n<li>Soga de polipropileno de 5 o 6 mm: dos veces la profundidad, más 3 metros.<\/li>\n<li>Discos de goma o de plástico duro (cortados de una suela o de una tapa de bidón) 1 a 2 mm más chicos que el diámetro interior del caño, uno por metro de soga, sujetos con un nudo arriba y otro abajo.<\/li>\n<li><strong>Guía del fondo:<\/strong> un codo de PVC o una pieza de hormigón con forma de U, con peso para que no flote, que recibe la soga y la mete en el caño sin que roce.<\/li>\n<li><strong>Rueda:<\/strong> una llanta de bicicleta rodado 26 con una cubierta vieja cortada al medio a lo largo y atornillada en la llanta, abierta hacia afuera, para que la soga no patine. Eje con rulemanes sobre un soporte de caño o madera dura, y una manivela.<\/li>\n<li>Arriba, una T en el caño con un caño de salida hacia el balde o el tanque.<\/li>\n<\/ul>\n<p><strong>Uso y cuidados<\/strong><\/p>\n<ul>\n<li>Girar siempre para el mismo lado, parejo. Rinde aproximadamente medio litro a un litro por segundo a 10 metros, más de lo que saca un balde.<\/li>\n<li>La soga se gasta: tener una de repuesto con los discos ya atados.<\/li>\n<li>Tapar el pozo alrededor de la bomba para que no caiga suciedad ni animales.<\/li>\n<li>Antes del colapso conviene ver una funcionando y copiar las medidas; las organizaciones de desarrollo rural tienen planos libres que vale la pena imprimir.<\/li>\n<\/ul>"},{"t":"Ariete hidráulico [AÑOS] (88)","h":"<h3>Ariete hidráulico <span class=\"b anos\">AÑOS<\/span> (88)<\/h3>\n<p>Sube agua de un arroyo, canal o vertiente a un tanque más alto <strong>sin motor ni combustible<\/strong>, día y noche. Usa el golpe del agua que baja por un caño para empujar una parte hacia arriba.<\/p>\n<p><strong>Qué hace falta:<\/strong> un caudal que no se corte y al menos 1 metro de caída entre la toma y el ariete.<\/p>\n<p><strong>Partes<\/strong><\/p>\n<ol>\n<li><strong>Toma:<\/strong> un tacho o un pequeño dique con rejilla, más arriba que el ariete.<\/li>\n<li><strong>Caño de impulso:<\/strong> rígido (hierro galvanizado o PVC reforzado), recto y sin curvas, de 1 a 2 pulgadas, de 6 a 12 metros de largo. Si es flexible, el golpe se pierde.<\/li>\n<li><strong>Válvula de impulso<\/strong> (al final del caño): se abre y se cierra sola con el agua; cuando se cierra de golpe, la presión sube.<\/li>\n<li><strong>Válvula de retención:<\/strong> deja pasar ese golpe hacia la cámara de aire y no lo deja volver.<\/li>\n<li><strong>Cámara de aire:<\/strong> un caño de 3 o 4 pulgadas de 1 metro, tapado arriba. El aire comprimido convierte los golpes en un chorro continuo.<\/li>\n<li><strong>Caño de salida:<\/strong> de ½ pulgada, hasta el tanque de arriba.<\/li>\n<\/ol>\n<p><strong>Cuánta agua sube:<\/strong> litros elevados ≈ 0,6 × litros que pasan × metros de caída ÷ metros a subir. Ejemplo: si pasan 20 litros por minuto con 2 metros de caída y se sube a 10 metros, llegan unos 2,4 litros por minuto: <strong>unos 3.500 litros por día<\/strong>. El resto del agua sale por la válvula de impulso y vuelve al arroyo.<\/p>\n<p><strong>Puesta en marcha:<\/strong> llenar todo de agua y empujar la válvula de impulso con la mano unas veces hasta que golpee sola (un \"toc\" cada segundo, más o menos). Ajustar el recorrido de la válvula: golpes más lentos suben más agua pero a menos altura.<\/p>\n<div class=\"atencion\">\n<p>En el Alto Valle, el agua de los canales de riego tiene dueño y turnos: cualquier toma se acuerda con el consorcio de regantes o con la comunidad.<\/p>\n<\/div>"},{"t":"Calefón solar [MEJORA] (107)","h":"<h3>Calefón solar <span class=\"b mejora\">MEJORA<\/span> (107)<\/h3>\n<p>Un tambor o bidón pintado de negro mate, dentro de una caja con fondo de telgopor y tapa de vidrio o nylon, orientado al norte. Por la tarde da agua tibia para bañar a los chicos. Variante: 50 metros de manguera negra en espiral sobre el techo.<\/p>"},{"t":"Máquinas simples y molinos [AÑOS]","h":"<h3>Máquinas simples y molinos <span class=\"b anos\">AÑOS<\/span><\/h3>\n<ul>\n<li><strong>Palanca:<\/strong> un palo largo y una piedra como apoyo mueven rocas y troncos que no mueven cuatro personas.<\/li>\n<li><strong>Polea y aparejo:<\/strong> con dos poleas (una fija arriba, una móvil en la carga) se levanta el doble de peso con la misma fuerza. Para sacar agua, subir techos o cargar carros.<\/li>\n<li><strong>Plano inclinado y rodillos:<\/strong> para subir cargas pesadas a un carro o a un techo.<\/li>\n<li><strong>Carro y carretilla:<\/strong> la rueda multiplica lo que se transporta. Guardar rulemanes, ejes y ruedas de bicicleta y de carretilla de repuesto.<\/li>\n<li><strong>Molino de viento (los multipala del campo argentino):<\/strong> bombea agua sin combustible. Mantenimiento: engrasar la caja, revisar la cola y la varilla, y cambiar los \"cueros\" del pistón de la bomba. Esos cueros son tradicionalmente de cuero vacuno: buscar repuestos de goma o neopreno y guardarlos ahora.<\/li>\n<li><strong>Rueda hidráulica:<\/strong> donde hay un arroyo con desnivel, una rueda de paletas puede mover un molino de grano o un aserradero. Es una obra comunitaria importante.<\/li>\n<\/ul>"},{"t":"Rueda hidráulica [AÑOS]","h":"<h3>Rueda hidráulica <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Donde hay un arroyo o un canal con desnivel, una rueda de paletas da fuerza todo el día para moler grano, bombear agua, aserrar o mover un torno.<\/p>\n<p><strong>Tipos<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Dónde<\/th>\n<th>Rendimiento<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>De corriente (el agua empuja abajo)<\/td>\n<td>Arroyos y canales sin caída<\/td>\n<td>Bajo: necesita mucha agua<\/td>\n<\/tr>\n<tr>\n<td>De pecho (el agua entra a media altura)<\/td>\n<td>Caídas de 1 a 2 metros<\/td>\n<td>Medio<\/td>\n<\/tr>\n<tr>\n<td>De cangilones (el agua cae arriba y llena baldes)<\/td>\n<td>Caídas mayores que el diámetro de la rueda<\/td>\n<td>El mejor: más de la mitad de la fuerza del agua<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cuánta fuerza da:<\/strong> potencia útil (en watts) ≈ 5 × litros por segundo × metros de caída. Ejemplo: 50 litros por segundo con 2 metros de caída dan unos 500 watts, lo que hacen dos o tres personas pedaleando todo el día sin cansarse.<\/p>\n<p><strong>Construcción:<\/strong> eje de madera dura o caño grueso sobre rulemanes o bujes de madera dura engrasados; dos discos de madera o hierro con las paletas o cangilones de chapa entre ellos; una compuerta en la toma para regular o cortar el agua; un canal de madera o chapa que lleva el agua a la rueda. La fuerza se saca por el eje con correas, cadenas de bicicleta o engranajes de madera.<\/p>\n<p><strong>Antes de empezar:<\/strong> el agua de los canales de riego tiene turnos y dueños; acordar con el consorcio de regantes o la comunidad. Es una obra comunitaria, para hacer con quien tenga experiencia en carpintería y mecánica.<\/p>"},{"t":"Electricidad de viento, agua o pedal [MEJORA]","h":"<h3>Electricidad de viento, agua o pedal <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Cuando no hay paneles o no alcanzan, se puede cargar baterías de 12 V con un generador movido a mano, a pedal, por agua o por viento.<\/p>\n<ul>\n<li><strong>Qué usar como generador:<\/strong> lo más práctico son los <strong>motores de imanes permanentes recuperados<\/strong> (cintas de correr, lavarropas de transmisión directa, motores de bicicleta o monopatín eléctrico, motores de corriente continua de máquinas): dan corriente a pocas vueltas. El <strong>alternador de auto<\/strong> también sirve, pero necesita muchas vueltas (más de 1.500 por minuto) y consume parte de la carga para excitarse: va bien con una rueda hidráulica rápida o con una bicicleta con mucha multiplicación.<\/li>\n<li><strong>Cuánto da:<\/strong> una persona pedaleando sostiene de 50 a 100 watts: una hora de pedaleo carga radios, linternas y teléfonos, pero no una heladera. Un buen salto de agua o un viento parejo dan energía las 24 horas.<\/li>\n<li><strong>Siempre con regulador de carga y fusible<\/strong> entre el generador y la batería, y un diodo que impida que la batería haga girar el generador cuando está quieto (<span class=\"ref\">►<\/span> <em>Calcular un equipo solar de 12 voltios<\/em>, arriba).<\/li>\n<li><strong>Viento:<\/strong> en el valle el viento es fuerte pero irregular, con ráfagas que rompen aspas caseras. Un molino eléctrico necesita mástil firme y arriostrado, cola que lo saque del viento cuando sopla demasiado, y freno. Es una obra para quien sabe de mecánica.<\/li>\n<li><strong>Agua:<\/strong> con una rueda hidráulica (arriba) o una turbina chica en un salto de canal, es la fuente más pareja. Respetar los turnos y dueños del agua (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"RIE\" data-c=\"1\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em>, cap. 2<\/a>).<\/li>\n<\/ul>"},{"t":"Biogás: gas para cocinar con estiércol [MEJORA]","h":"<h3>Biogás: gas para cocinar con estiércol <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Un <strong>biodigestor<\/strong> es una bolsa o tanque cerrado donde el estiércol mezclado con agua fermenta sin aire y produce biogás (sobre todo metano), que arde como el gas de garrafa. Lo que sale del otro lado (el <strong>biol<\/strong>) es un abono líquido excelente.<\/p>\n<p><strong>Biodigestor tubular (el más simple)<\/strong><\/p>\n<ol>\n<li>Una <strong>zanja<\/strong> de 1 m de ancho, 1 m de hondo y 6 a 10 m de largo, con las paredes lisas y sin piedras, en un lugar al sol.<\/li>\n<li>Una <strong>manga de polietileno<\/strong> de 200 a 300 micrones, doble (una dentro de otra), del largo de la zanja más 1 m.<\/li>\n<li>En cada punta, un <strong>caño de PVC<\/strong> de 10 cm atado firme a la manga con tiras de cámara de bicicleta: uno de entrada, más alto, y otro de salida, más bajo, inclinados hacia afuera.<\/li>\n<li>En el medio de la parte de arriba, una <strong>salida de gas<\/strong>: un caño de ½ pulgada pasado por una arandela de goma y ajustado con tuercas.<\/li>\n<li>Del gas a la cocina: una manguera, una <strong>válvula de seguridad<\/strong> (una botella con agua donde el caño entra 10 a 15 cm: si la presión sube, el gas burbujea afuera), un <strong>filtro<\/strong> (un tramo de caño con virulana oxidada, que saca el ácido sulfhídrico que corroe y huele mal) y un <strong>reservorio<\/strong> (una segunda bolsa de nylon cerca de la cocina).<\/li>\n<li>Llenar la manga hasta tres cuartos con <strong>estiércol fresco y agua<\/strong> (1 parte de estiércol de vaca en 3 o 4 de agua; el de cabra, oveja o conejo, más diluido y picado; el de gallina, mezclado con otros porque es muy fuerte). El primer gas tarda 2 a 4 semanas en salir: tirar el primero, que tiene aire.<\/li>\n<li><strong>Cargar todos los días<\/strong> un balde de mezcla por la entrada: sale la misma cantidad de biol por la salida.<\/li>\n<\/ol>\n<p><strong>Cuánto da:<\/strong> depende mucho de la temperatura. En verano, el estiércol de 2 o 3 vacas o de unas 10 cabras alcanza para cocinar una parte importante de las comidas de una familia. <strong>En el invierno patagónico casi no produce<\/strong>: rinde mucho más dentro de un invernadero o bajo una cubierta de nylon con paja alrededor.<\/p>\n<p><strong>Seguridad<\/strong><\/p>\n<ul>\n<li>El biogás es <strong>explosivo<\/strong> mezclado con aire y el ácido sulfhídrico que trae es tóxico (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"RIE\" data-c=\"5\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em>, cap. 6<\/a>): nunca el biodigestor ni el reservorio dentro de la casa ni en un lugar cerrado; nada de fuego cerca de la manga.<\/li>\n<li>Cercarlo: las patas de los animales y las espinas lo pinchan.<\/li>\n<li><strong>Biol:<\/strong> diluido 1 en 5 a 10 con agua, al pie de las plantas, no sobre hojas que se comen crudas.<\/li>\n<\/ul>"},{"t":"Alcohol: desinfectante y combustible [MEJORA]","h":"<h3>Alcohol: desinfectante y combustible <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Con fruta pasada, orujo de uva, sidra o vino agrio, o granos malteados, se puede destilar alcohol para <strong>desinfectar<\/strong> (heridas, manos, instrumental <span class=\"ref\">►<\/span> Manual médico T2 15.4) y como <strong>combustible<\/strong> de lámparas y calentadores.<\/p>\n<ol>\n<li><strong>Fermentar:<\/strong> el jugo o el mosto, con levadura, en un bidón con la manguerita de la sidra (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"8\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 9<\/a>), hasta que deja de burbujear.<\/li>\n<li><strong>Alambique simple:<\/strong> una olla grande con tapa ajustada, un caño de cobre o acero inoxidable que sale de la tapa y baja en espiral (el serpentín) dentro de un balde con agua fría, y un frasco que recibe lo que gotea. Calentar suave, a baño María o con brasas, nunca a fuego fuerte.<\/li>\n<li><strong>Descartar la \"cabeza\":<\/strong> lo primero que sale (alrededor de 50 a 100 ml por cada 20 litros de mosto), de olor fuerte a solvente, <strong>tiene metanol, que causa ceguera y muerte.<\/strong> Se tira o se usa solo para encender fuego.<\/li>\n<li><strong>El \"corazón\"<\/strong> es el alcohol útil. Cuando lo que sale empieza a oler a vinagre o a quemado (la \"cola\"), cortar.<\/li>\n<li><strong>Segunda destilación:<\/strong> volver a destilar el corazón para llegar a 70 % o más. Medir con un <strong>alcoholímetro<\/strong> (se consigue en casas de enología): es la única forma segura de saber la graduación.<\/li>\n<li><strong>Desinfectante:<\/strong> alcohol al <strong>70 %<\/strong> (no más concentrado: desinfecta peor). Se prepara mezclando con agua hervida.<\/li>\n<\/ol>\n<p><strong>Seguridad:<\/strong> los vapores de alcohol se prenden fuego: destilar al aire libre, con la llama lejos del frasco colector, y <strong>nunca con el caño tapado<\/strong> (la olla puede explotar). Este alcohol casero no es para tomar.<\/p>"},{"t":"Bicicleta, vehículos y combustible [AÑOS] (173, 174)","h":"<h3>Bicicleta, vehículos y combustible <span class=\"b anos\">AÑOS<\/span> (173, 174)<\/h3>\n<p><strong>La bicicleta es el vehículo de una crisis larga:<\/strong> no necesita combustible y se arregla con pocas piezas.<\/p>\n<ul>\n<li><strong>Repuestos para guardar:<\/strong> cámaras, parches y pegamento, cubiertas, cadena, cables y zapatas de freno, rayos, aceite.<\/li>\n<li><strong>Saber hacer:<\/strong> emparchar una cámara, cambiar una cubierta, ajustar frenos, tensar y engrasar la cadena, centrar una rueda.<\/li>\n<li><strong>Carrito o remolque<\/strong> de bicicleta para llevar cargas de 30 a 50 kg.<\/li>\n<\/ul>\n<p><strong>Auto y combustible (174)<\/strong><\/p>\n<ul>\n<li>La nafta comienza a degradarse en 3 a 6 meses; con estabilizador de combustible dura alrededor de un año. El gasoil, alrededor de un año. Rotar el combustible guardado.<\/li>\n<li>Guardar combustible solo en bidones aprobados, fuera de la casa, a la sombra.<\/li>\n<li>Mecánica básica que vale la pena saber: cambiar una rueda, revisar aceite y agua, cambiar correas y filtros, limpiar los bornes de la batería.<\/li>\n<li>Un auto parado también sirve: batería para luz de 12 V, asientos, chapas, alambres, espejos.<\/li>\n<\/ul>"},{"t":"Mecánica básica del auto y de la camioneta [MEJORA]","h":"<h3>Mecánica básica del auto y de la camioneta <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Mientras haya combustible, un vehículo funcionando vale mucho para la comunidad. Lo que conviene saber hacer y tener:<\/p>\n<ul>\n<li><strong>Todos los meses:<\/strong> presión de los neumáticos (la que dice la etiqueta en la puerta), nivel de aceite con la varilla (motor frío y en plano), líquido refrigerante en el depósito, líquido de frenos, agua del limpiaparabrisas.<\/li>\n<li><strong>Batería:<\/strong> bornes limpios (agua con bicarbonato y un cepillo) y ajustados. Si el auto va a estar parado, desconectar el borne negativo; un panel solar chico la mantiene cargada.<\/li>\n<li><strong>Arrancar con cables:<\/strong> rojo al positivo de la batería descargada, rojo al positivo de la buena, negro al negativo de la buena y el último negro a un metal del motor de la descargada, lejos de la batería.<\/li>\n<li><strong>Arrancar empujando:<\/strong> solo autos con caja manual: contacto, segunda marcha, embrague apretado, empujar, soltar el embrague de golpe a velocidad de paso rápido.<\/li>\n<li><strong>Cambiar una rueda:<\/strong> aflojar las tuercas antes de levantar, gato en el punto de apoyo, nunca meterse debajo de un auto sostenido solo por el gato.<\/li>\n<li><strong>Repuestos que conviene tener:<\/strong> filtros de aceite, aire y combustible, correas, fusibles, lámparas, aceite, bujías (nafta), un juego de llaves y un multímetro.<\/li>\n<li><strong>Mangueras y correas:<\/strong> si una manguera pierde, abrazadera nueva o cinta de reparación; una correa que chilla se tensa o se cambia.<\/li>\n<li><strong>Preferir lo simple:<\/strong> los motores diésel viejos sin electrónica y los autos con carburador se arreglan con menos repuestos.<\/li>\n<li><strong>Auto parado mucho tiempo:<\/strong> tanque lleno con estabilizador, batería desconectada, ruedas sobre tacos o infladas de más, y arrancarlo una vez por mes si se puede.<\/li>\n<\/ul>"},{"t":"Electricidad y plomería básicas [MEJORA] (164, 165, 166)","h":"<h3>Electricidad y plomería básicas <span class=\"b mejora\">MEJORA<\/span> (164, 165, 166)<\/h3>\n<ul>\n<li><strong>Nunca tocar cables de la red pública,<\/strong> aunque no haya luz: puede volver en cualquier momento.<\/li>\n<li><strong>Generador:<\/strong> nunca enchufarlo directo a un tomacorriente de la casa sin una llave de transferencia instalada por alguien que sepa. La corriente vuelve hacia la red y puede matar a quien esté trabajando en los cables.<\/li>\n<li><strong>Sistema de 12 V<\/strong> (batería, panel solar, luces LED): es mucho menos peligroso que 220 V y lo puede armar cualquier persona con cuidado.<\/li>\n<li><strong>Plomería:<\/strong> saber dónde están las llaves de paso, cambiar un cuerito de canilla, sellar roscas con cinta de teflón. Guardar cueritos, cinta y abrazaderas.<\/li>\n<li><strong>Destapar sin químicos (166):<\/strong> sopapa; un alambre con gancho; agua muy caliente con un puñado de bicarbonato y un vaso de vinagre, tapar 30 minutos y enjuagar.<\/li>\n<\/ul>"}]},{"t":"Ropa, textiles y calzado","s":[{"t":"","h":"<p>La ropa que hay alcanza para un par de años si se cuida y se remienda; después hay que producir fibra, hilarla y tejerla. Argentina tiene una ventaja: la Patagonia es país de lana, y el NEA y el NOA producen algodón.<\/p>"},{"t":"Kit de costura por familia [VITAL]","h":"<h3>Kit de costura por familia <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Agujas de varios tamaños (incluidas de lana y de colchón), hilo fuerte de algodón y de poliéster en colores básicos, dedal, tijera buena solo para tela, alfileres, cinta métrica, botones surtidos, elástico, tiza de sastre, una lezna para coser cosas gruesas. Si se consigue: <strong>una máquina de coser a pedal<\/strong>, que vale oro en una comunidad.<\/p>"},{"t":"Coser a mano [VITAL] (167)","h":"<h3>Coser a mano <span class=\"b vital\">VITAL<\/span> (167)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Puntada<\/th>\n<th>Cómo<\/th>\n<th>Para qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hilván<\/td>\n<td>Puntadas largas, entrando y saliendo<\/td>\n<td>Unir provisoriamente antes de coser<\/td>\n<\/tr>\n<tr>\n<td>Pespunte<\/td>\n<td>Cada puntada vuelve hasta la mitad de la anterior<\/td>\n<td>Costuras fuertes, como a máquina<\/td>\n<\/tr>\n<tr>\n<td>Punto escondido<\/td>\n<td>Toma un hilo de la tela de afuera y se esconde en el dobladillo<\/td>\n<td>Dobladillos<\/td>\n<\/tr>\n<tr>\n<td>Punto de festón<\/td>\n<td>Lazadas sobre el borde<\/td>\n<td>Bordes que se deshilachan, frazadas, ojales<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Patrones:<\/strong> desarmar con cuidado una prenda vieja que quede bien, plancharla y usar las piezas como molde (sumando 1 o 2 cm de costura). Guardar los moldes en papel rotulados por talle.<\/p>"},{"t":"Remendar [VITAL] (168)","h":"<h3>Remendar <span class=\"b vital\">VITAL<\/span> (168)<\/h3>\n<ul>\n<li><strong>Parche:<\/strong> un trozo de tela del mismo grosor, por dentro o por fuera, con los bordes doblados y cosido con punto escondido o pespunte. Las rodillas y los codos de la ropa de los chicos, reforzarlos antes de que se rompan.<\/li>\n<li><strong>Zurcido de medias y tejidos:<\/strong> meter una lamparita, un huevo de madera o una papa dentro de la media. Tejer con aguja e hilo de lana una trama: primero hilos paralelos sobre el agujero, después otros cruzados pasando por arriba y por abajo.<\/li>\n<li><strong>Ropa de adultos a ropa de chicos:<\/strong> de un pantalón grande sale uno chico; de una camisa, una remera o una bata.<\/li>\n<li><strong>Lo último:<\/strong> la ropa que ya no sirve pasa a trapos, a relleno de almohadas, a pañales o a tiras para trenzar alfombras.<\/li>\n<\/ul>"},{"t":"Lana: de la oveja al ovillo [AÑOS] (170)","h":"<h3>Lana: de la oveja al ovillo <span class=\"b anos\">AÑOS<\/span> (170)<\/h3>\n<p>La lana se saca de ovejas vivas, una vez por año, en primavera: es compatible con el criterio de esta biblioteca. Si la comunidad no tiene ovejas, la lana se intercambia con productores de la Patagonia o de la Puna.<\/p>\n<ol>\n<li><strong>Esquila:<\/strong> con tijera de esquilar, sacando el vellón entero sin lastimar al animal. Es un oficio: aprenderlo de un esquilador.<\/li>\n<li><strong>Lavar el vellón:<\/strong> en agua tibia con jabón, sin refregar ni agitar (si se agita, se apelmaza en fieltro). Enjuagar en agua a la misma temperatura y secar a la sombra.<\/li>\n<li><strong>Cardar:<\/strong> peinar la lana con cardas (dos tablitas con dientes de alambre) o con un peine de dientes gruesos, hasta que las fibras queden sueltas y paralelas.<\/li>\n<li><strong>Hilar con huso:<\/strong> el huso es un palito de 30 cm con un disco de madera o barro (tortero) cerca de la punta. Atar un poco de lana, hacer girar el huso colgando y dejar que la torsión suba por la lana mientras la otra mano la va estirando de a poco. Cuando el huso llega al piso, enrollar lo hilado y seguir.<\/li>\n<li><strong>Torcer en dos cabos:<\/strong> dos hilos simples retorcidos juntos en sentido contrario forman un hilo más fuerte y parejo.<\/li>\n<li><strong>Madeja y fijado:<\/strong> hacer una madeja, lavarla en agua caliente y colgarla con un peso para que fije la torsión.<\/li>\n<\/ol>\n<p><strong>Teñir con plantas.<\/strong> Primero hervir la lana una hora en agua con alumbre (de farmacia o droguería; ayuda a que el color se fije). Después hervirla con el material:<\/p>\n<table>\n<thead>\n<tr>\n<th>Material<\/th>\n<th>Color<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cáscara de cebolla<\/td>\n<td>Amarillo a naranja<\/td>\n<\/tr>\n<tr>\n<td>Cáscara verde de nuez<\/td>\n<td>Marrón (no necesita alumbre)<\/td>\n<\/tr>\n<tr>\n<td>Yerba mate usada<\/td>\n<td>Verde amarillento<\/td>\n<\/tr>\n<tr>\n<td>Remolacha<\/td>\n<td>Rosado débil, se va con el sol<\/td>\n<\/tr>\n<tr>\n<td>Raspadura de corteza de árboles con tanino<\/td>\n<td>Marrones y grises<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Tejer [AÑOS] (169)","h":"<h3>Tejer <span class=\"b anos\">AÑOS<\/span> (169)<\/h3>\n<ul>\n<li><strong>Dos agujas:<\/strong> los puntos básicos son el derecho y el revés. Con eso solo se tejen bufandas, gorros, medias, pulóveres y frazadas. Agujas de madera se hacen con ramitas lijadas.<\/li>\n<li><strong>Crochet:<\/strong> una sola aguja con gancho, más rápido para gorros, chalecos y mantas de cuadrados.<\/li>\n<li><strong>Telar de marco:<\/strong> un marco de madera con clavos arriba y abajo para tensar los hilos (urdimbre); la trama se pasa por arriba y por abajo con una tablita. Hace telas, ponchos, mantas y fajas. El telar criollo tradicional del NOA y de la Patagonia es una evolución de esto: buscar tejedoras de la zona que enseñen.<\/li>\n<\/ul>"},{"t":"Telar de marco paso a paso [AÑOS]","h":"<h3>Telar de marco paso a paso <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Hace paños de 40 a 60 cm de ancho que se cosen entre sí para mantas, ponchos, bolsos y fajas.<\/p>\n<p><strong>Armado<\/strong><\/p>\n<ol>\n<li>Un marco rectangular de listones de madera de 2 × 4 cm, de 50 × 80 cm, con las esquinas atornilladas y reforzadas con una escuadra: tiene que aguantar mucha tensión sin torcerse.<\/li>\n<li>En los travesaños de arriba y abajo, clavos sin cabeza cada 1 cm, alineados.<\/li>\n<li><strong>Urdimbre:<\/strong> un hilo fuerte y continuo (algodón, lana bien torcida, hilo de bolsa) que va de un clavo de arriba al de abajo, en zigzag, siempre con la misma tensión. Son los hilos fijos.<\/li>\n<li><strong>Lizo:<\/strong> una tabla plana y lisa que se pasa alternando por arriba y por abajo de los hilos de la urdimbre. Al pararla de canto, abre un espacio (la calada) para pasar la trama.<\/li>\n<li><strong>Lanzadera:<\/strong> una tablita con muescas en las puntas donde se enrolla el hilo de la trama.<\/li>\n<li><strong>Peine:<\/strong> un tenedor grande o una tabla con dientes para apretar cada pasada.<\/li>\n<\/ol>\n<p><strong>Tejer<\/strong><\/p>\n<ol>\n<li>Primeras pasadas con hilo grueso para hacer un borde firme.<\/li>\n<li>Parar el lizo, pasar la trama de un lado a otro, bajar el lizo y apretar con el peine.<\/li>\n<li>En la pasada de vuelta, el hilo va por arriba de los hilos por los que pasó por abajo: se levantan con los dedos o con un segundo lizo de hilos (lazos de hilo que levantan los hilos impares).<\/li>\n<li><strong>No tirar la trama en los bordes:<\/strong> dejarla en arco antes de apretar; si se tira, el paño se angosta (se \"encintura\").<\/li>\n<li>Para terminar, cortar la urdimbre de a pares y anudar los flecos.<\/li>\n<\/ol>\n<p><strong>Telar criollo:<\/strong> el de las tejedoras del NOA y la Patagonia es un telar de cuatro palos clavados en el piso, que permite tejer piezas grandes. Aprenderlo de quien lo usa.<\/p>"},{"t":"Algodón: de la planta al hilo [MEJORA]","h":"<h3>Algodón: de la planta al hilo <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p><strong>Dónde crece:<\/strong> necesita un verano largo y caluroso sin heladas (unos 6 meses). Se cultiva en el Chaco, Formosa, Santiago del Estero y Santa Fe. En la Patagonia norte rinde mal: ahí la lana y el lino son las fibras de la comunidad.<\/p>\n<ol>\n<li><strong>Cosechar<\/strong> los capullos abiertos y secos, sin hojas ni tierra.<\/li>\n<li><strong>Desmotar<\/strong> (sacar la semilla): a mano, de a uno, o con un desmotador de dos rodillos de madera lisos, muy juntos, que giran en sentido contrario: la fibra pasa y la semilla queda.<\/li>\n<li><strong>Abrir la fibra:<\/strong> golpearla con varillas finas sobre una manta, o cardarla como la lana.<\/li>\n<li><strong>Hilar:<\/strong> el algodón es fibra corta y pide mucha torsión. Se usa un huso chico y liviano apoyado en un cuenco (huso de apoyo), estirando de a muy poco.<\/li>\n<li><strong>Descrudar:<\/strong> hervir las madejas una hora con jabón o lejía de ceniza para sacar la cera natural; así toman el tinte y absorben el agua.<\/li>\n<\/ol>\n<p>La semilla de algodón tiene una sustancia tóxica (gosipol): no se come ni se da en cantidad a los animales.<\/p>"},{"t":"Fieltro [AÑOS]","h":"<h3>Fieltro <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Con lana suelta, agua caliente, jabón y fricción se hace una tela gruesa sin tejer: plantillas, botas de interior, gorros, forros de calzado, colchonetas.<\/p>\n<ol>\n<li>Poner capas finas de lana cardada, cada una cruzada con la anterior, sobre una esterilla o una tela.<\/li>\n<li>Mojar con agua caliente jabonosa.<\/li>\n<li>Frotar con las manos, primero suave y después fuerte, 20 a 30 minutos, dando vuelta. Después enrollar en la esterilla y hacerla rodar muchas veces.<\/li>\n<li>Enjuagar en agua fría: se encoge y se endurece. Secar estirado.<\/li>\n<\/ol>"},{"t":"Bolsa de dormir casera [VITAL]","h":"<h3>Bolsa de dormir casera <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Una bolsa abriga más que la misma cantidad de frazadas sueltas porque no deja escapar el aire caliente.<\/p>\n<p><strong>Con frazadas (en una tarde)<\/strong><\/p>\n<ol>\n<li>Poner dos frazadas una sobre otra y doblarlas al medio a lo largo: queda un rectángulo de unos 2 metros por 80 cm, de cuatro capas.<\/li>\n<li>Coser con hilo grueso, puntadas de 1 cm, todo el pie y el costado abierto hasta dos tercios del largo. El tercio de arriba queda abierto para entrar.<\/li>\n<li>Agregar un lazo o botones para cerrar arriba y una capucha de tela o un gorro aparte.<\/li>\n<li>Si es posible, hacerla más angosta en los pies (55 cm) que en los hombros: menos aire que calentar.<\/li>\n<\/ol>\n<p><strong>Acolchada con relleno<\/strong><\/p>\n<ol>\n<li>Dos telas de algodón o lona liviana del mismo tamaño, cosidas como una funda.<\/li>\n<li>Rellenar con lana cardada, vellón de oveja o plumas lavadas de gallina, repartidos parejo.<\/li>\n<li><strong>Pespuntear en cuadros de 20 × 20 cm<\/strong> atravesando las dos telas: si no, el relleno se corre y quedan zonas sin abrigo.<\/li>\n<li>Coserla como la de frazadas.<\/li>\n<\/ol>\n<p><strong>Para usarla bien<\/strong><\/p>\n<ul>\n<li>Debajo, siempre aislación del piso: cartones, una colchoneta de goma espuma, paja o ramas. Sin eso, la mejor bolsa no alcanza.<\/li>\n<li>Una funda exterior de lona o nylon grueso la protege de la humedad cuando se duerme afuera.<\/li>\n<li>Dormir con gorro y medias secas; nunca con la ropa húmeda del día.<\/li>\n<li>Airearla al sol a la mañana: la humedad del cuerpo le quita abrigo noche a noche.<\/li>\n<\/ul>"},{"t":"Máquina de coser a pedal: conseguirla y mantenerla [AÑOS]","h":"<h3>Máquina de coser a pedal: conseguirla y mantenerla <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>No se fabrica en casa, pero dura un siglo si se cuida. Las Singer, Godeco y Necchi a pedal todavía aparecen en casas de familia, ferias y remates: es una de las compras más útiles para una comunidad.<\/p>\n<ul>\n<li><strong>Aceitar:<\/strong> unas gotas de aceite de máquina de coser (o vaselina líquida) en cada agujero de aceitado y en las piezas que rozan, una vez por semana de uso. <strong>Nunca aceite de cocina:<\/strong> se pone pegajoso y traba la máquina.<\/li>\n<li><strong>Limpiar<\/strong> la pelusa de debajo de la placa y de la bobina con un pincel cada vez que se aceita.<\/li>\n<li><strong>Agujas:<\/strong> comprar ahora varias cajas del sistema que lleve la máquina (la mayoría de las domésticas usa 15×1 o 130/705). Una aguja despuntada rompe hilos y saltea puntadas.<\/li>\n<li><strong>Correa:<\/strong> la de cuero se reemplaza por una correa redonda de goma o de cordón trenzado, cerrada con un gancho de alambre.<\/li>\n<li><strong>Cabezal eléctrico en mueble a pedal:<\/strong> muchas máquinas domésticas viejas tienen el mismo cabezal que las de pedal; se puede pasar el cabezal a un mueble con pedal o ponerle una manivela.<\/li>\n<li><strong>Tensión del hilo:<\/strong> si la puntada se ve floja abajo, ajustar la rueda de tensión de arriba; si se ve floja arriba, el tornillo de la bobina, de a un cuarto de vuelta.<\/li>\n<\/ul>"},{"t":"Otras fibras [MEJORA]","h":"<h3>Otras fibras <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<ul>\n<li><strong>Lino:<\/strong> se siembra muy denso a fin de invierno; se arranca entero cuando amarillea; se deja \"enriar\" (pudrir la parte blanda) en el pasto mojado de rocio 2 o 3 semanas; se seca, se quiebra (agramado), se golpea (espadado) y se peina hasta sacar las fibras largas. Es mucho trabajo pero da tela fresca y fuerte.<\/li>\n<li><strong>Algodón:<\/strong> en el NEA y el NOA. Se cosechan los capullos, se sacan las semillas a mano o con un desmotador de rodillos y se hila con huso.<\/li>\n<li><strong>Plásticos:<\/strong> bolsas cortadas en tiras se tejen o trenzan para hacer bolsos, cuerdas y esteras.<\/li>\n<\/ul>"},{"t":"Calzado sin cuero [VITAL] (171)","h":"<h3>Calzado sin cuero <span class=\"b vital\">VITAL<\/span> (171)<\/h3>\n<p>Es lo más difícil de reponer. Guardar ahora calzado firme en varios talles, sobre todo para los chicos.<\/p>\n<p><strong>Sandalias de cubierta<\/strong><\/p>\n<ol>\n<li>Pisar sobre un trozo de cubierta de auto o de bicicleta y marcar el contorno del pie con un margen de 1 cm.<\/li>\n<li>Cortar con cuchilla afilada o sierra. Mojar la cuchilla con agua y jabón facilita el corte.<\/li>\n<li>Hacer agujeros a los costados y en la punta, y pasar tiras de cámara, de lona doble o cuerda trenzada para atarlas al pie y al tobillo.<\/li>\n<\/ol>\n<p><strong>Alpargatas:<\/strong> suela de cuerda de yute o de fibra trenzada en espiral y cosida apretada (o una suela de cubierta), con capellada de lona cosida alrededor. Son el calzado tradicional del campo argentino.<\/p>\n<p><strong>Botas de invierno:<\/strong> un botín de fieltro grueso o tejido doble de lana, con suela de cubierta cosida o pegada. Para la nieve y el barro, cubrir con una bolsa de nylon grueso entre dos medias.<\/p>\n<p><strong>Zuecos de madera:<\/strong> suela de madera tallada con tira de lona: sirven para el corral y el barro.<\/p>\n<p><strong>Mantener lo que hay:<\/strong> secar el calzado mojado lejos del fuego (con papel adentro), engrasar con un poco de aceite o cera, coser las suelas despegadas con lezna e hilo encerado, y guardar pegamento de contacto mientras exista.<\/p>"}]},{"t":"Jabón, limpieza y lavado","s":[{"t":"","h":"<p>El jabón y el lavado de manos cortan más enfermedades que cualquier remedio, y el jabón se puede fabricar con aceite vegetal y soda cáustica o con lejía de cenizas. Este capítulo da recetas <strong>calculadas<\/strong>, coherentes con <span class=\"ref\">►<\/span> Manual médico T2 15.6, que trae también plantas que limpian: muchas recetas que circulan tienen soda de más y dan un jabón que quema la piel.<\/p>\n<div class=\"atencion\">\n<p><strong>Soda cáustica: seguridad.<\/strong> Guantes de goma, antiparras, manga larga, al aire libre o con ventana abierta, sin chicos ni animales cerca. <strong>Siempre la soda sobre el agua, nunca el agua sobre la soda<\/strong> (salpica y hierve). Recipientes de plástico duro, vidrio o acero inoxidable; nunca aluminio (reacciona y larga g
