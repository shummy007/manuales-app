t":"Ahorrar combustible: caja térmica, cocina solar, olla de hierro [VITAL] (29, 30, 31)","h":"<h3>Ahorrar combustible: caja térmica, cocina solar, olla de hierro <span class=\"b vital\">VITAL<\/span> (29, 30, 31)<\/h3>\n<p><strong>Caja térmica (31).<\/strong> Ahorra entre la mitad y dos tercios del combustible al cocinar guisos, arroz, legumbres y sopas.<\/p>\n<ol>\n<li>Un cajón, una conservadora de telgopor o un balde grande, forrado por dentro con 10 cm de aislante: frazadas, almohadones, lana, paja seca, bolitas de telgopor.<\/li>\n<li>Llevar la olla a hervor fuerte y mantenerlo el tiempo indicado abajo.<\/li>\n<li>Con la tapa puesta, meter la olla rápido en la caja, rodearla de aislante y taparla.<\/li>\n<li>Dejar el tiempo indicado. Si al abrir la comida no está lista, dar otro hervor y volver a meterla.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Comida<\/th>\n<th>Hervor en el fuego<\/th>\n<th>Tiempo en la caja<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Arroz blanco<\/td>\n<td>5 min<\/td>\n<td>1 h<\/td>\n<\/tr>\n<tr>\n<td>Guiso de verduras<\/td>\n<td>10 min<\/td>\n<td>2 h<\/td>\n<\/tr>\n<tr>\n<td>Lentejas<\/td>\n<td>10 min<\/td>\n<td>2 h<\/td>\n<\/tr>\n<tr>\n<td>Porotos y garbanzos remojados<\/td>\n<td>15 min<\/td>\n<td>4 a 6 h (o toda la noche)<\/td>\n<\/tr>\n<tr>\n<td>Trigo o maíz partido<\/td>\n<td>15 min<\/td>\n<td>toda la noche<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cocina solar (29).<\/strong> Una caja con interior pintado de negro mate, tapa de vidrio, aislada por fuera y con un reflector de papel de aluminio. En días de sol llega a 100 a 130 °C: cocina arroz, verduras, legumbres ya hervidas, pan, y pasteuriza agua. Cocina lento (2 a 4 horas) y hay que reorientarla al sol cada hora. En la Patagonia y Cuyo, con muchos días despejados, rinde muy bien de primavera a otoño.<\/p>\n<p><strong>Olla de hierro con tapa (30).<\/strong> Sobre brasas, con brasas también sobre la tapa, funciona como un horno chico: pan, tortas, guisos. Mantener engrasada y seca para que no se oxide.<\/p>"},{"t":"Legumbres [VITAL] (32)","h":"<h3>Legumbres <span class=\"b vital\">VITAL<\/span> (32)<\/h3>\n<p>Son la carne de esta cocina. Bien cocinadas, son fáciles de digerir y rinden mucho.<\/p>\n<ol>\n<li><strong>Limpiar:<\/strong> extender en una bandeja y sacar piedritas y granos rotos.<\/li>\n<li><strong>Remojar<\/strong> en abundante agua: porotos y garbanzos de 8 a 12 horas; lentejas y arvejas partidas no necesitan, o 2 horas. <strong>Tirar el agua de remojo.<\/strong><\/li>\n<li><strong>Hervor fuerte al principio.<\/strong> Los porotos, sobre todo los rojos, tienen una sustancia tóxica que se destruye solo hirviendo fuerte al menos 10 minutos. Nunca cocinarlos solo a fuego suave, ni en caja térmica o cocina solar sin ese hervor previo, ni comerlos crudos o germinados.<\/li>\n<li><strong>Tiempos aproximados:<\/strong> lentejas 25 a 40 min; arvejas partidas 40 min; porotos 1 a 2 h; garbanzos 1,5 a 2,5 h. En olla a presión, un tercio.<\/li>\n<li>La sal y lo ácido (tomate, vinagre) se agregan al final: al principio endurecen el grano.<\/li>\n<\/ol>\n<p><strong>Proteína completa:<\/strong> legumbre + cereal en el mismo día (lentejas con arroz, porotos con maíz, garbanzos con pan, guiso de trigo y arvejas). Con huevo o queso, todavía mejor.<\/p>"},{"t":"Usar el horno de barro [AÑOS] (28)","h":"<h3>Usar el horno de barro <span class=\"b anos\">AÑOS<\/span> (28)<\/h3>\n<p>Calentarlo con leña fina 1 a 2 horas, hasta que la bóveda, ennegrecida al principio, se ponga blanca. Correr las brasas a un costado o sacarlas, pasar un trapo húmedo por el piso y hornear. Aprovechar el calor que baja en este orden: pan y pizza (calor fuerte), tartas y empanadas, verduras y legumbres en olla de barro, y al final, toda la noche, frutas para secar. Hornear entre varias familias el mismo día ahorra mucha leña. Para construirlo <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"4\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 5<\/a>.<\/p>\n<p>Luz y calor sin incendios ni monóxido <span class=\"ref\">►<\/span> Manual médico T2 15.18 y <a class=\"x\" data-b=\"CAS\" data-c=\"2\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 3<\/a>.<\/p>"}]},{"t":"Pan, masas y pastas","s":[{"t":"","h":"<p>El pan, las tortillas, la galleta y la pasta convierten el grano de la despensa en comida de todos los días. Para moler el grano <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"4\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 5<\/a>.<\/p>"},{"t":"Pan de masa madre [VITAL] (21, 22, 38)","h":"<h3>Pan de masa madre <span class=\"b vital\">VITAL<\/span> (21, 22, 38)<\/h3>\n<p><strong>Hacer la masa madre (22).<\/strong><\/p>\n<ol>\n<li>Día 1: en un frasco, 50 g de harina (mejor integral o de centeno) y 50 g de agua sin cloro (hervida y fría, o dejada 24 h destapada). Mezclar, tapar con un trapo.<\/li>\n<li>Días 2 a 7: tirar la mitad y agregar otros 50 g de harina y 50 g de agua, una vez por día, a 20 a 25 °C.<\/li>\n<li>Está lista cuando duplica su volumen en 4 a 8 horas después de alimentarla y huele ácida y agradable.<\/li>\n<li><strong>Mantenerla:<\/strong> alimentarla una vez por día si se usa todos los días; en lugar fresco, cada 3 o 4 días. Tener siempre dos frascos, uno de reserva. Si se pone un líquido gris arriba, tiene hambre: volcarlo y alimentar. Si aparece moho rosado o naranja, tirarla.<\/li>\n<\/ol>\n<p><strong>Iniciador con frutas (38):<\/strong> si la masa madre no arranca, en un frasco con 1/2 litro de agua, un puñado de pasas de uva o una manzana picada y 1 cucharada de azúcar. A los 4 a 7 días burbujea: usar esa agua en vez de agua común para empezar la masa madre.<\/p>\n<p><strong>Pan (21), para dos panes medianos<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Ingrediente<\/th>\n<th>Cantidad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Harina 000 o mezcla con integral<\/td>\n<td>1 kg<\/td>\n<\/tr>\n<tr>\n<td>Agua tibia<\/td>\n<td>650 a 700 ml<\/td>\n<\/tr>\n<tr>\n<td>Masa madre activa<\/td>\n<td>200 g<\/td>\n<\/tr>\n<tr>\n<td>Sal<\/td>\n<td>20 g<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol>\n<li>Mezclar harina y agua, reposar 30 minutos.<\/li>\n<li>Agregar la masa madre y la sal. Amasar 10 minutos, o hacer 4 series de pliegues cada media hora.<\/li>\n<li>Leudar tapado de 4 a 8 horas (según la temperatura) hasta que crezca la mitad.<\/li>\n<li>Formar dos bollos y leudar 2 a 3 horas más, o toda la noche en lugar fresco.<\/li>\n<li>Hornear: 230 a 250 °C los primeros 15 minutos, con un recipiente con agua adentro, y 200 °C otros 25 a 30 minutos. Está cocido si suena hueco al golpear la base.<\/li>\n<\/ol>"},{"t":"Tortas fritas, tortillas y galleta [VITAL] (23)","h":"<h3>Tortas fritas, tortillas y galleta <span class=\"b vital\">VITAL<\/span> (23)<\/h3>\n<p><strong>Tortas fritas (sin grasa vacuna):<\/strong> 500 g de harina, 1 cucharadita de sal, 50 g de manteca o 4 cucharadas de aceite, 250 ml de agua tibia, 1 cucharadita de polvo de hornear si hay. Amasar, reposar 30 min, estirar 1 cm, cortar y freír en aceite caliente.<\/p>\n<p><strong>Tortillas a la plancha:<\/strong> 500 g de harina, 1 cucharadita de sal, 3 cucharadas de aceite y 250 ml de agua. Bollitos estirados muy finos, a la plancha o sobre chapa caliente 1 minuto por lado. No necesitan horno ni leudante.<\/p>\n<p><strong>Galleta marinera (dura años).<\/strong> 1 kg de harina, 20 g de sal, 400 a 450 ml de agua. Masa dura, estirada a 1 cm, cortada en cuadrados de 8 cm y pinchada con tenedor de lado a lado. Hornear a 180 °C 30 minutos por lado y después dejar secar horas en horno apagado o al sol hasta que esté totalmente seca. Guardar en lata o frasco hermético. Se come remojada en mate cocido, leche o sopa.<\/p>"},{"t":"Pasta casera [MEJORA] (40)","h":"<h3>Pasta casera <span class=\"b mejora\">MEJORA<\/span> (40)<\/h3>\n<p>100 g de harina por huevo (para 4 personas: 400 g y 4 huevos). Sin huevos: 100 g de harina y 50 ml de agua tibia con una pizca de sal. Amasar 10 minutos, reposar 30, estirar fino con palo, cortar. Se seca colgada o en nidos 1 o 2 días y se guarda en frascos.<\/p>"}]},{"t":"Leche: yogur, quesos y manteca","s":[{"t":"","h":"<p>La leche se echa a perder en horas sin frío; el yogur, el kéfir, el queso, la manteca y el dulce de leche la hacen durar de días a meses. Para cabras y quesería en profundidad <span class=\"ref\">►<\/span> Manual de cabras lecheras y queso.<\/p>"},{"t":"Yogur, ricota, quesos y manteca [VITAL] (24, 25, 26, 27)","h":"<h3>Yogur, ricota, quesos y manteca <span class=\"b vital\">VITAL<\/span> (24, 25, 26, 27)<\/h3>\n<p>Toda la leche que se use para consumo y para estos productos se <strong>hierve o se pasteuriza antes<\/strong> <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"6\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 7<\/a>. Para quesos con cuajo, mejor pasteurizar (63 °C durante 30 minutos) que hervir: la leche hervida cuaja mal.<\/p>\n<p><strong>Yogur (26)<\/strong><\/p>\n<ol>\n<li>1 litro de leche hervida, enfriada a 43 a 45 °C (se aguanta el dedo dentro unos segundos).<\/li>\n<li>Agregar 2 cucharadas de yogur natural de la tanda anterior.<\/li>\n<li>Tapar y abrigar con un repasador y una frazada, o meter en la caja térmica, 6 a 10 horas.<\/li>\n<li>Guardar siempre un poco como iniciador. Si se pierde, conseguir yogur de un vecino.<\/li>\n<\/ol>\n<p><strong>Ricota (27)<\/strong> — sin cuajo.<\/p>\n<ol>\n<li>2 litros de leche (o suero de queso con un litro de leche) a 85 a 90 °C, justo antes de hervir.<\/li>\n<li>Apagar y agregar 3 o 4 cucharadas de vinagre o jugo de limón, revolviendo suave.<\/li>\n<li>Dejar reposar 10 minutos: se separan copos blancos.<\/li>\n<li>Recoger con espumadera en un colador con tela y escurrir 1 hora. Salar a gusto. Dura 3 o 4 días en fresco.<\/li>\n<\/ol>\n<p><strong>Queso blanco de limón (tipo paneer).<\/strong> Igual que la ricota pero con leche entera hirviendo y prensando la cuajada envuelta en tela bajo un peso 2 horas. Queda un queso firme que se corta, se fríe o se mete en guisos. Es el queso más fácil sin cuajo.<\/p>\n<p><strong>Queso fresco con cuajo (25)<\/strong><\/p>\n<p><em>Sobre el cuajo:<\/em> el cuajo tradicional se saca del estómago de terneros, por eso no es apto en esta biblioteca. Alternativas aptas:<\/p>\n<ul>\n<li><strong>Cuajo microbiano<\/strong> comprado (pastillas o líquido). Guardar varios envases: duran años en heladera y meses fuera. Leer la etiqueta: debe decir microbiano o vegetal.<\/li>\n<li><strong>Cuajo de cardo:<\/strong> el cardo de Castilla (<em>Cynara cardunculus<\/em>), el mismo que crece como maleza en buena parte de la región pampeana y del que deriva el alcaucil, coagula la leche. Juntar las flores violetas en verano, secar a la sombra los pelos violetas (estigmas) y guardar en frasco. Para usar: macerar alrededor de 1 g de flores secas por litro de leche en un poco de agua tibia durante 12 a 24 horas, machacar y colar. Da quesos cremosos de sabor algo amargo. Hacer una prueba chica con cada tanda, porque la fuerza varía.<\/li>\n<\/ul>\n<p><em>Pasos (para 5 litros de leche, da alrededor de 600 g de queso)<\/em><\/p>\n<ol>\n<li>Leche pasteurizada, llevada a 35 a 37 °C.<\/li>\n<li>Agregar el cuajo en la dosis del envase (o el macerado de cardo), revolver 1 minuto y dejar quieto y tapado.<\/li>\n<li>A los 40 a 60 minutos se forma una cuajada firme: al meter un cuchillo y levantarlo, se parte limpia.<\/li>\n<li>Cortar en cubos de 2 cm y revolver suave 10 minutos.<\/li>\n<li>Pasar la cuajada a un molde con agujeros o a un colador con tela, y dejar escurrir. Dar vuelta varias veces.<\/li>\n<li>Salar: frotar sal por fuera, o sumergir en salmuera de 200 g de sal por litro durante 1 hora por kilo de queso.<\/li>\n<li>Queso fresco: se come en 5 a 7 días, en el lugar más fresco de la casa.<\/li>\n<\/ol>\n<p>Para quesos estacionados que duran meses hacen falta fermentos, prensas y un lugar fresco y húmedo de 10 a 14 °C (un sótano). Es una habilidad para aprender con un quesero de la zona.<\/p>\n<p><strong>El suero<\/strong> que sobra sirve para hacer ricota, para amasar pan, para regar frutales diluido y para las gallinas y las cabras.<\/p>\n<p><strong>Manteca (24)<\/strong><\/p>\n<ol>\n<li>Juntar la crema que sube cuando la leche fresca reposa 12 a 24 horas en lugar fresco.<\/li>\n<li>Batirla en un frasco cerrado (llenado hasta la mitad), sacudiéndolo, o con batidor, 10 a 20 minutos. Primero se hace crema batida, después se corta: aparecen granos amarillos y un líquido (suero de manteca).<\/li>\n<li>Colar y lavar la manteca amasándola en agua muy fría hasta que el agua salga clara. Si queda suero, se pone rancia.<\/li>\n<li>Salar si se quiere (1 a 2 %). Guardar en fresco y a oscuras. Para guardar meses: hacer ghee (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"4\" data-s=\"0\">cap. 5<\/a>).<\/li>\n<\/ol>"},{"t":"Kéfir [MEJORA]","h":"<h3>Kéfir <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>El kéfir alarga la leche y no necesita calor: es la forma más fácil de tener un lácteo fermentado sin combustible.<\/p>\n<ol>\n<li>Conseguir <strong>granos de kéfir de leche<\/strong> (unas bolitas blancas gelatinosas): se regalan entre vecinos, porque se multiplican solos.<\/li>\n<li>Poner una cucharada de granos en un frasco con 250 a 500 ml de leche hervida y fría (o pasteurizada).<\/li>\n<li>Tapar con una tela y dejar a temperatura ambiente 24 horas (más en invierno, menos en verano).<\/li>\n<li>Colar con un colador plástico. Lo líquido se toma; los granos van a otro frasco con leche nueva.<\/li>\n<li>Si se quiere pausar, guardar los granos en leche en el lugar más fresco y cambiarla cada semana.<\/li>\n<\/ol>\n<p>Colgado en una tela 12 horas con una pizca de sal, el kéfir o el yogur se convierten en un queso untable (labneh). Guardarlo en el lugar más fresco y comerlo en pocos días; no envasarlo cubierto de aceite fuera de la heladera.<\/p>"},{"t":"Labneh en aceite [MEJORA]","h":"<h3>Labneh en aceite <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Una forma de conservar el yogur unas semanas más sin heladera.<\/p>\n<ol>\n<li>Mezclar 1 kg de yogur natural con 1 cucharadita de sal.<\/li>\n<li>Colgarlo en una tela limpia sobre un bol, en lugar fresco, <strong>24 a 48 horas<\/strong>, hasta que esté firme como un queso untable. El suero que cae sirve para la limonada de suero o para el pan.<\/li>\n<li>Con las manos aceitadas, formar bolitas del tamaño de una nuez y dejarlas orear 2 a 3 horas sobre una tela.<\/li>\n<li>Ponerlas en un frasco limpio y cubrirlas <strong>completamente<\/strong> con aceite, con hierbas secas (orégano, tomillo, ají molido) si se quiere.<\/li>\n<li>Guardar en el lugar más fresco de la casa y comerlas en <strong>2 a 4 semanas<\/strong>. Si una bolita queda fuera del aceite, se come primero.<\/li>\n<\/ol>"},{"t":"Crema y dulce de leche [MEJORA]","h":"<h3>Crema y dulce de leche <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p><strong>Crema:<\/strong> la leche fresca entera de vaca, dejada 12 a 24 horas en lugar fresco en un recipiente ancho, junta crema arriba; se saca con cuchara. La leche de cabra casi no separa crema.<\/p>\n<p><strong>Dulce de leche<\/strong> (dura semanas fuera de la heladera bien tapado, y es una forma de guardar leche y energía)<\/p>\n<table>\n<thead>\n<tr>\n<th>Ingrediente<\/th>\n<th>Cantidad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Leche entera (de vaca o de cabra)<\/td>\n<td>2 litros<\/td>\n<\/tr>\n<tr>\n<td>Azúcar<\/td>\n<td>500 g<\/td>\n<\/tr>\n<tr>\n<td>Bicarbonato de sodio<\/td>\n<td>1/2 cucharadita<\/td>\n<\/tr>\n<tr>\n<td>Esencia de vainilla o una chaucha<\/td>\n<td>Opcional<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol>\n<li>En una olla ancha y de fondo grueso, llevar la leche y el azúcar a hervor revolviendo.<\/li>\n<li>Disolver el bicarbonato en un poco de leche fría y agregarlo con el fuego bajo (sube espuma).<\/li>\n<li>Cocinar a fuego bajo revolviendo seguido, cada vez más a menudo a medida que espesa, 2 a 3 horas.<\/li>\n<li>Está listo cuando una gota en un plato frío no corre y la cuchara deja ver el fondo de la olla.<\/li>\n<li>Envasar caliente en frascos limpios. Rinde unos 800 g.<\/li>\n<\/ol>"},{"t":"Más quesos y el manual de cabras","h":"<h3>Más quesos y el manual de cabras<\/h3>\n<p>El libro <em>Cabras lecheras y queso<\/em> trae el método completo de quesería (temperaturas, fermentos, cloruro de calcio, cuajada, salado, estacionamiento) y recetas probadas: yogur y labneh, chèvre, ricota de suero, queso de campo, feta, quesos para estacionar y dulce de leche de cabra, con una tabla de problemas y soluciones. Sirve igual para leche de vaca, que rinde algo más queso por litro. Lo único que hay que cambiar para una cocina ovolactovegetariana es el <strong>cuajo<\/strong>: usar cuajo microbiano o de quimosina por fermentación, o el cuajo de cardo de este capítulo, nunca el cuajo de estómago de animal.<\/p>"},{"t":"Cava para madurar quesos sin electricidad [MEJORA]","h":"<h3>Cava para madurar quesos sin electricidad <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>El manual de cabras propone una heladera vieja con termostato a 10–13 °C y 85–90 % de humedad. Sin electricidad, se busca lo mismo con la tierra:<\/p>\n<ul>\n<li><strong>Sótano o pozo hondo:<\/strong> a 2 metros de profundidad la tierra queda casi a la temperatura media del año, que en el Alto Valle ronda los 13 a 15 °C. Alcanza para madurar quesos de otoño a primavera. En verano conviene hacer quesos frescos, en salmuera (tipo feta) o para comer jóvenes.<\/li>\n<li><strong>Construcción:<\/strong> un pozo de 1,5 × 1,5 m y 2 m de hondo, con paredes revocadas o de ladrillo, piso de tierra o ripio, tapa aislada (tablas con 20 cm de paja o tierra encima), una escalera y dos caños de ventilación: uno que llega cerca del piso y otro que sale arriba.<\/li>\n<li><strong>Humedad:<\/strong> piso de tierra mojado, un balde con agua, arpillera húmeda colgada. Si el queso se seca y se raja, falta humedad; si aparece moho negro o pegajoso, sobra: ventilar más.<\/li>\n<li><strong>Estantes de madera<\/strong> sin pintar, separados de la pared; dar vuelta los quesos y limpiar los mohos como indica el manual de cabras.<\/li>\n<li><strong>Control:<\/strong> un termómetro de los de pared; anotar la temperatura a la mañana y a la tarde la primera semana. Si pasa de 16 °C, el lugar no sirve para quesos de estacionamiento largo.<\/li>\n<li>Una cueva excavada en una barranca, o el rincón más fresco de un sótano de la casa, funcionan igual. El mismo pozo sirve de <strong>despensa fría<\/strong> para papas, manzanas y conservas (cap. 5).<\/li>\n<\/ul>"}]},{"t":"Proteínas vegetales, brotes y bebidas","s":[{"t":"","h":"<p>Legumbres, soja, gluten y semillas dan proteína en formas que rompen la monotonía; los brotes dan vitamina C fresca en pleno invierno <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"3\" data-s=\"0\">Nutrición §3<\/a>.<\/p>"},{"t":"Tofu casero [MEJORA] (74)","h":"<h3>Tofu casero <span class=\"b mejora\">MEJORA<\/span> (74)<\/h3>\n<ol>\n<li>500 g de soja seca, remojada 12 horas (duplica su tamaño).<\/li>\n<li>Moler con 3 litros de agua (licuadora, molino de discos o mortero) y colar exprimiendo por una tela. El líquido es leche de soja; lo que queda (okara) se usa en hamburguesas, pan o para las gallinas.<\/li>\n<li><strong>Hervir la leche de soja 10 minutos<\/strong> revolviendo para que no se pegue. Cruda no se toma.<\/li>\n<li>Bajar el fuego hasta que deje de hervir (unos 80 °C) y agregar el coagulante disuelto en una taza de agua tibia, de a poco: 4 cucharadas de jugo de limón o vinagre, o 2 cucharaditas de sulfato de magnesio (sal de Epsom, de farmacia).<\/li>\n<li>Esperar 15 minutos: se separan cuajos blancos.<\/li>\n<li>Pasar a un molde con tela y prensar con un peso de 2 a 3 kg durante 30 a 60 minutos.<\/li>\n<li>Guardar en agua fría, cambiándola todos los días. Dura 3 a 4 días.<\/li>\n<\/ol>\n<p><strong>Miso, tempeh y koji: cultivos para guardar<\/strong><\/p>\n<p>Son de las mejores proteínas fermentadas del mundo (soja, porotos, cebada, arroz, garbanzo), pero dependen de <strong>hongos que hay que tener vivos<\/strong>: no se pueden empezar de cero.<\/p>\n<ul>\n<li><strong>Koji:<\/strong> arroz o cebada cocidos al vapor e inoculados con el hongo <em>Aspergillus oryzae<\/em>, a 30 °C durante dos días. Es la base del miso y de la salsa de soja.<\/li>\n<li><strong>Miso:<\/strong> porotos de soja (o garbanzos, o porotos comunes) cocidos y pisados, mezclados con koji y 12 % de sal, apretados en un recipiente con peso, fermentados de 6 meses a 2 años. Una pasta salada y muy sabrosa que dura años sin frío.<\/li>\n<li><strong>Tempeh:<\/strong> soja descascarada y cocida, inoculada con el hongo <em>Rhizopus<\/em>, envuelta en bolsas perforadas a 30 °C durante 24 a 48 horas: se forma un bloque firme, blanco, que se corta y se fríe.<\/li>\n<\/ul>\n<p><strong>Qué hacer hoy:<\/strong> si se quiere tener estas técnicas, comprar ahora esporas de koji y de tempeh (se venden secas, en sobres, en tiendas de fermentación y por internet), aprender con un manual específico y mantener el cultivo. <strong>Para no perderlo:<\/strong> del tempeh, dejar que una pieza forme esporas negras, secarla y molerla como iniciador; del koji, guardar en un frasco un poco de arroz con koji bien secado. Sin esos cultivos, el tofu (arriba) es la proteína de soja que se puede hacer siempre.<\/p>"},{"t":"Seitán casero [MEJORA] (33)","h":"<h3>Seitán casero <span class=\"b mejora\">MEJORA<\/span> (33)<\/h3>\n<p>Se hace con el gluten (la proteína) de la harina de trigo. Rinde poco: de 1 kg de harina salen 250 a 300 g de seitán crudo. Usarlo como algo especial, no como base.<\/p>\n<ol>\n<li>1 kg de harina 000 y 600 ml de agua: amasar 10 minutos y dejar 1 hora bajo agua.<\/li>\n<li>Lavar la masa bajo agua, apretándola, hasta que el agua salga casi clara y quede una masa elástica. El agua con almidón se guarda: decantada, sirve para espesar o como engrudo.<\/li>\n<li>Cortar en trozos y hervir 45 minutos en caldo con salsa de soja si hay, cebolla, ajo, laurel y sal.<\/li>\n<\/ol>"},{"t":"Hamburguesas y embutidos vegetales [MEJORA] (34)","h":"<h3>Hamburguesas y embutidos vegetales <span class=\"b mejora\">MEJORA<\/span> (34)<\/h3>\n<p><strong>Hamburguesas de legumbres:<\/strong> 2 tazas de legumbre cocida y pisada, 1 taza de avena o pan rallado o arroz cocido, 1 cebolla y 1 zanahoria rallada, 1 huevo, sal y especias. Formar medallones y cocinar a la plancha o al horno. Sirven con okara, lenteja, poroto o garbanzo. Comer en 2 días.<\/p>\n<p><strong>Embutido vegetal:<\/strong> seitán crudo amasado con pimentón, ajo, orégano, ají y sal, enrollado en forma de chorizo, envuelto en tela o papel manteca bien atado y hervido 45 minutos. Después se dora a la plancha.<\/p>"},{"t":"Pastas de maní y semillas [MEJORA] (35)","h":"<h3>Pastas de maní y semillas <span class=\"b mejora\">MEJORA<\/span> (35)<\/h3>\n<p>Maní, girasol pelado o sésamo tostados en sartén 10 minutos, molidos en molino o mortero hasta pasta, con sal. <strong>Seguridad:<\/strong> la pasta hecha solo con semillas tostadas y sin agua es estable. En cambio, el hummus, las pastas con agua, ajo, verduras o limón, y los \"quesos\" de semillas se comen en 2 o 3 días y <strong>nunca se envasan en frasco cerrado<\/strong> fuera de la heladera.<\/p>"},{"t":"Brotes y microverdes [MEJORA] (73)","h":"<h3>Brotes y microverdes <span class=\"b mejora\">MEJORA<\/span> (73)<\/h3>\n<p>Dan verdura fresca en pleno invierno con semillas de la despensa.<\/p>\n<ul>\n<li><strong>Brotes:<\/strong> lenteja, poroto mung, garbanzo, alfalfa, trigo o rabanito en un frasco con tela en la boca. Remojar 8 a 12 horas, escurrir, y enjuagar con agua segura dos veces por día, frasco inclinado boca abajo. Listos en 3 a 5 días. Tirar si huelen mal. <strong>No hacer brotes de porotos comunes ni de soja para comer crudos.<\/strong><\/li>\n<li><strong>Microverdes:<\/strong> en una bandeja con 3 cm de tierra, sembrar muy denso rúcula, mostaza, rabanito, arveja o girasol. Cortar con tijera a los 10 a 15 días.<\/li>\n<\/ul>"},{"t":"Vinagre, sidra y vino [MEJORA] (36, 37)","h":"<h3>Vinagre, sidra y vino <span class=\"b mejora\">MEJORA<\/span> (36, 37)<\/h3>\n<p><strong>Sidra (37):<\/strong> jugo de manzanas maduras (rallar y prensar en una tela). En un bidón limpio, con un tapón que deje salir el gas pero no entrar aire (una manguerita que termina en un vaso con agua). A 15 a 20 °C, fermenta en 2 a 4 semanas. Trasvasar sin el fondo. El vino se hace igual con uva molida y escurrida a los 5 a 7 días. Clarificar con una clara de huevo batida cada 50 litros (no gelatina). Los mejores maestros de esto en el Alto Valle y Cuyo son los vecinos que ya lo hacen.<\/p>\n<p><strong>Vinagre (36):<\/strong> dejar sidra o vino en un frasco ancho tapado con un trapo, en lugar tibio y oscuro, de 4 a 8 semanas. Se forma una capa gelatinosa arriba (la madre), que sirve para empezar la próxima tanda. <strong>Para conservas seguras, usar vinagre comercial de 5 %:<\/strong> la acidez del vinagre casero no se puede saber sin medirla. El casero va para ensaladas y cocina.<\/p>"},{"t":"Kombucha [MEJORA]","h":"<h3>Kombucha <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Té fermentado, ácido y apenas gasificado. No es imprescindible: gasta azúcar, que en un colapso es escasa, y aporta poco que no den el vinagre o los fermentos de verdura. Se incluye porque es fácil, es una bebida agradable cuando no hay otras y el cultivo se regala y se intercambia.<\/p>\n<p><strong>Qué hace falta:<\/strong> un <strong>cultivo madre<\/strong> (el disco gelatinoso, también llamado scoby u \"hongo\") con un vaso del líquido de una tanda anterior. Se consigue de alguien que ya la haga; se reproduce solo: cada tanda forma un disco nuevo.<\/p>\n<p><strong>Para 2 litros<\/strong><\/p>\n<ol>\n<li>Hervir 2 litros de agua, apagar y poner 2 cucharadas de té negro o verde, o 2 de yerba mate. Dejar 10 minutos y colar.<\/li>\n<li>Disolver 140 a 160 g de azúcar (70 a 80 g por litro) y dejar enfriar <strong>del todo<\/strong>: el calor mata el cultivo.<\/li>\n<li>Pasar a un frasco de vidrio ancho, agregar el vaso de kombucha anterior (o 2 cucharadas de vinagre comercial si es la primera vez) y apoyar el disco arriba.<\/li>\n<li>Tapar con un trapo y una banda elástica (tiene que respirar; nada de tapas de metal).<\/li>\n<li>Dejar a 18 a 26 °C, a la sombra, <strong>7 a 14 días<\/strong>. Probar desde el día 7 con una pajita por el costado: cuando está ácida y apenas dulce, está lista.<\/li>\n<li>Sacar el disco con el vaso de líquido para la próxima tanda y embotellar el resto.<\/li>\n<\/ol>\n<p><strong>Segunda fermentación (con gas):<\/strong> en botellas que aguanten presión, agregar fruta picada o jugo (un 10 %), tapar y dejar 2 o 3 días a temperatura ambiente, abriendo una vez por día para que no exploten. Después, al fresco.<\/p>\n<p><strong>Seguridad<\/strong><\/p>\n<ul>\n<li><strong>Moho:<\/strong> manchas peludas, verdes, negras o azules arriba del disco = tirar todo, disco incluido, y lavar el frasco con agua hirviendo. Hilos marrones y burbujas son normales.<\/li>\n<li>Siempre vidrio y utensilios limpios; nunca recipientes de metal ni de cerámica con esmalte dudoso (el ácido disuelve el plomo).<\/li>\n<li>Tiene un poco de alcohol y es muy ácida: no darla a bebés ni a chicos chicos, y con moderación en embarazadas.<\/li>\n<li>Si se pasa de ácida, sirve como vinagre suave para ensaladas, no para conservas.<\/li>\n<\/ul>"},{"t":"Kvass de pan [MEJORA]","h":"<h3>Kvass de pan <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Bebida fermentada del este de Europa hecha con pan duro, que de otro modo se tira. Apenas alcohólica (alrededor del 1 %), ácida y refrescante.<\/p>\n<ol>\n<li>Tostar bien 500 g de pan integral o negro seco, hasta que esté oscuro (no quemado).<\/li>\n<li>Ponerlo en una olla o balde y cubrir con 4 litros de agua hirviendo. Tapar y dejar 6 a 8 horas.<\/li>\n<li>Colar apretando el pan. Disolver en el líquido tibio 100 a 150 g de azúcar o miel.<\/li>\n<li>Agregar una cucharadita de levadura o dos cucharadas de masa madre, y si hay, unas hojas de menta y unas pasas.<\/li>\n<li>Tapar con un trapo y dejar 8 a 12 horas en un lugar tibio, hasta que haga espuma.<\/li>\n<li>Embotellar en botellas que aguanten presión, con dos o tres pasas en cada una. Dejar 1 o 2 días a temperatura ambiente, abriendo una vez por día para soltar gas, y pasar al fresco. Tomar en una semana.<\/li>\n<\/ol>\n<p>El pan que queda se da a las gallinas.<\/p>"},{"t":"Otras bebidas fermentadas tradicionales [MEJORA]","h":"<h3>Otras bebidas fermentadas tradicionales <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Tienen alcohol: no para chicos ni embarazadas. Útiles para celebraciones y para intercambiar.<\/p>\n<ul>\n<li><strong>Hidromiel:<\/strong> 1 kg de miel disuelta en 3 litros de agua tibia (300 g por litro), una cucharadita de levadura (de vino o de pan) y un puñado de pasas como alimento de la levadura. En un bidón con la manguerita de la sidra (arriba), 4 a 8 semanas hasta que deja de burbujear; trasvasar sin el fondo y dejar madurar meses en botellas. Solo con miel y agua: no necesita azúcar comprada.<\/li>\n<li><strong>Chicha de maíz:<\/strong> maíz germinado 3 a 5 días (como los brotes, cap. 9), secado al sol y molido; hervido con agua varias horas, colado, y fermentado 2 a 5 días en tinaja tapada con un trapo. Es la bebida de las fiestas del NOA desde antes de la colonia.<\/li>\n<li><strong>Aloja:<\/strong> vainas de algarrobo maduras machacadas, en agua, fermentadas 1 a 3 días hasta que hacen espuma. Bebida tradicional del monte del norte y Cuyo, donde hay algarrobos.<\/li>\n<\/ul>"}]},{"t":"Recetario de la despensa","s":[{"t":"","h":"<p>Recetas pensadas para lo que hay en una despensa ovolactovegetariana y una huerta argentina, con poco combustible. Cantidades para 4 personas adultas. Las legumbres van siempre remojadas y con hervor fuerte al principio (cap. 6); la caja térmica sirve para casi todos los guisos.<\/p>"},{"t":"Guisos y platos principales","h":"<h3>Guisos y platos principales<\/h3>\n<p><strong>Locro de zapallo, maíz y porotos (sin carne)<\/strong><\/p>\n<ul>\n<li>250 g de maíz blanco partido y 200 g de porotos, remojados por separado toda la noche.<\/li>\n<li>1 kg de zapallo en cubos, 1 cebolla, 1 morrón o pimentón, 2 dientes de ajo, comino, sal.<\/li>\n<li>3 cucharadas de aceite o manteca; para servir, salsa picante de pimentón en aceite.<\/li>\n<\/ul>\n<p>Hervir fuerte el maíz y los porotos 15 minutos en 3 litros de agua y seguir 1 hora a fuego bajo (o 4 horas en caja térmica). Agregar el zapallo, la cebolla rehogada con el ajo y las especias, y cocinar hasta que el zapallo se deshaga y espese. Sal al final.<\/p>\n<p><strong>Guiso de lentejas con arroz<\/strong><\/p>\n<ul>\n<li>300 g de lentejas, 150 g de arroz, 1 cebolla, 1 zanahoria, 1 papa, 1 tomate o 3 cucharadas de salsa de tomate en conserva, pimentón, laurel, aceite.<\/li>\n<\/ul>\n<p>Rehogar cebolla y zanahoria, agregar lentejas, papa, tomate, especias y 1,5 litros de agua. Hervir 10 minutos y seguir 25 en el fuego o 2 horas en la caja térmica. Agregar el arroz a mitad de cocción (o cocinarlo aparte). Lentejas con arroz = proteína completa.<\/p>\n<p><strong>Porotos con trigo (guiso de campo)<\/strong><\/p>\n<ul>\n<li>300 g de porotos remojados, 200 g de trigo entero remojado, 1 cebolla, ajo, zapallo, ají molido, sal.<\/li>\n<\/ul>\n<p>Hervir fuerte 15 minutos porotos y trigo, rehogar la cebolla con el ajo y el ají, juntar todo con el zapallo y dejar 4 a 6 horas en la caja térmica o hasta que estén tiernos.<\/p>\n<p><strong>Polenta con salsa y queso<\/strong><\/p>\n<ul>\n<li>400 g de harina de maíz, 1,6 litros de agua o mitad leche, sal, 2 cucharadas de manteca, salsa de tomate, queso.<\/li>\n<\/ul>\n<p>Hervir el líquido con sal, echar la harina en lluvia revolviendo y cocinar 10 a 30 minutos según el molido. Servir con salsa y queso, o dejar enfriar en una fuente, cortar y dorar.<\/p>\n<p><strong>Humita en olla<\/strong><\/p>\n<ul>\n<li>12 choclos rallados (o 600 g de maíz nixtamalizado molido), 1 cebolla, 1 morrón, 1 cucharada de pimentón, 250 ml de leche, 2 cucharadas de manteca, albahaca, sal, azúcar a gusto.<\/li>\n<\/ul>\n<p>Rehogar cebolla y morrón con el pimentón, agregar el choclo y la leche y cocinar 20 minutos revolviendo hasta que espese. Con queso fresco arriba.<\/p>\n<p><strong>Tamales de nixtamal<\/strong><\/p>\n<p>Masa: 1 kg de maíz nixtamalizado molido (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"4\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 5<\/a>), 150 ml de aceite o manteca derretida, caldo de verduras tibio hasta que la masa quede blanda, sal. Relleno: zapallo, cebolla y queso, o porotos pisados con comino. Envolver porciones en chalas de maíz remojadas, atar y cocinar al vapor 1 hora.<\/p>\n<p><strong>Tortilla de papa<\/strong><\/p>\n<ul>\n<li>1 kg de papas en rodajas finas, 1 cebolla, 6 huevos, aceite, sal.<\/li>\n<\/ul>\n<p>Freír papas y cebolla a fuego medio en abundante aceite (sin dorar), escurrir, mezclar con los huevos batidos y cuajar en sartén de los dos lados.<\/p>\n<p><strong>Tarta de acelga o de verduras de estación<\/strong><\/p>\n<p>Masa: 300 g de harina, 100 ml de aceite, 120 ml de agua, sal. Relleno: 1 kg de acelga hervida y picada (o espinaca, kale, zapallito), 1 cebolla rehogada, 3 huevos, queso o ricota. Horno o caja de hierro con brasas arriba, 40 minutos.<\/p>\n<p><strong>Empanadas de verdura o humita<\/strong><\/p>\n<p>Masa: 500 g de harina, 100 g de manteca o 6 cucharadas de aceite, 250 ml de agua tibia con sal. Relleno: acelga y queso, humita espesa, o cebolla y huevo duro con aceitunas. Cerrar con repulgue y hornear o freír.<\/p>\n<p><strong>Ñoquis de papa<\/strong><\/p>\n<ul>\n<li>1 kg de papas hervidas con cáscara, peladas y hechas puré, 250 a 300 g de harina, 1 huevo, sal.<\/li>\n<\/ul>\n<p>Amasar sin trabajar de más, hacer rollos, cortar y hervir en agua con sal hasta que floten. Con salsa o manteca y queso.<\/p>\n<p><strong>Faina de garbanzo<\/strong><\/p>\n<ul>\n<li>250 g de harina de garbanzo (cap. 4), 750 ml de agua, 5 cucharadas de aceite, sal.<\/li>\n<\/ul>\n<p>Mezclar y dejar reposar 2 horas o más. Volcar en asadera bien aceitada en capa fina y hornear muy caliente 15 a 20 minutos.<\/p>\n<p><strong>Pastel de papa y lentejas<\/strong><\/p>\n<p>Lentejas cocidas con cebolla, morrón y especias en la base; puré de papa con leche y manteca arriba; gratinar en el horno o bajo una tapa con brasas.<\/p>"},{"t":"Sopas","h":"<h3>Sopas<\/h3>\n<p><strong>Sopa de verduras secas y fideos<\/strong><\/p>\n<p>Una taza de mezcla de verduras secas molidas y harina de legumbre (cap. 4) por litro de agua hirviendo, 15 minutos; agregar un puñado de fideos o arroz y un chorrito de aceite.<\/p>\n<p><strong>Sopa crema de zapallo<\/strong><\/p>\n<p>1 kg de zapallo, 1 cebolla, 1 papa, 1 litro de agua, 250 ml de leche, nuez moscada si hay, sal. Hervir todo hasta tierno, pisar o pasar por colador, agregar la leche y no dejar que hierva más.<\/p>\n<p><strong>Sopa de arvejas partidas<\/strong><\/p>\n<p>300 g de arvejas partidas, 1 cebolla, 1 zanahoria, 1 papa, laurel, 2 litros de agua. Hervir fuerte 10 minutos y 40 a fuego bajo (o 2 horas en caja térmica) hasta que se deshagan.<\/p>"},{"t":"Panes y masas","h":"<h3>Panes y masas<\/h3>\n<p>Pan de masa madre, tortas fritas, tortillas, galleta marinera y pasta están en el capítulo 7.<\/p>\n<p><strong>Pan de maíz<\/strong><\/p>\n<p>300 g de harina de maíz, 200 g de harina de trigo, 2 huevos, 400 ml de leche, 4 cucharadas de aceite, 1 cucharadita de sal, 2 de polvo de hornear (o bicarbonato con una cucharada de vinagre). Mezclar y hornear en molde aceitado 35 a 40 minutos.<\/p>\n<p><strong>Panqueques<\/strong><\/p>\n<p>250 g de harina, 2 huevos, 500 ml de leche, una pizca de sal. Batir, reposar 30 minutos y cocinar en sartén aceitada en capas finas. Con dulce de leche o rellenos salados.<\/p>"},{"t":"Postres y dulces","h":"<h3>Postres y dulces<\/h3>\n<p><strong>Arroz con leche<\/strong><\/p>\n<p>150 g de arroz, 1 litro de leche, 120 g de azúcar, cáscara de limón o naranja, canela. Cocinar el arroz en la leche a fuego bajo revolviendo, 35 a 45 minutos, agregar el azúcar al final.<\/p>\n<p><strong>Mazamorra<\/strong><\/p>\n<p>250 g de maíz blanco pisado remojado toda la noche. Hervir en 2 litros de agua 2 a 3 horas (o caja térmica toda la noche) hasta que esté tierno, agregar 1 litro de leche y 150 g de azúcar o miel, y cocinar 20 minutos más.<\/p>\n<p><strong>Budín de pan<\/strong><\/p>\n<p>300 g de pan viejo remojado en 750 ml de leche, 3 huevos, 150 g de azúcar, pasas o fruta seca, caramelo de azúcar en el molde. Cocinar a baño María en el horno o tapado sobre fuego bajo 1 hora.<\/p>\n<p><strong>Dulce de membrillo<\/strong><\/p>\n<p>Membrillos lavados, cocidos enteros hasta tiernos, pelados y sin corazón, hechos puré. Por cada kg de puré, 800 g de azúcar. Cocinar revolviendo 1 a 2 horas hasta que se despegue del fondo de la olla y tome color. Volcar en moldes, dejar secar unos días y guardar envuelto en lugar fresco. Dura meses.<\/p>\n<p><strong>Fruta seca con nueces<\/strong><\/p>\n<p>Higos, pasas, orejones y ciruelas secas picados, mezclados con nueces y miel, compactados en barritas y secados al sol envueltos en tul: la golosina de la despensa.<\/p>"},{"t":"Para untar y acompañar","h":"<h3>Para untar y acompañar<\/h3>\n<p><strong>Hummus de garbanzo<\/strong> (comer en el día o al otro: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"1\" data-s=\"0\">cap. 2<\/a> sobre botulismo)<\/p>\n<p>300 g de garbanzos cocidos, 2 cucharadas de pasta de sésamo o aceite, jugo de 1 limón, 1 diente de ajo, sal, agua de la cocción. Pisar todo hasta crema.<\/p>\n<p><strong>Salsa de pimentón (para locro y guisos)<\/strong><\/p>\n<p>4 cucharadas de aceite calentadas sin humear, apagar el fuego y agregar 1 cucharada de pimentón, ají molido y comino. Usar en el día.<\/p>\n<p><strong>Ensalada de brotes y repollo<\/strong><\/p>\n<p>Repollo picado fino, brotes de lenteja (cap. 9), zanahoria rallada, aceite, vinagre y sal: la vitamina C cruda del invierno.<\/p>"},{"t":"Bebidas","h":"<h3>Bebidas<\/h3>\n<p><strong>Té de rosa mosqueta:<\/strong> dos cucharadas de fruto seco, sin semillas ni pelos, por taza de agua caliente (no hirviendo, para cuidar la vitamina C), 10 minutos. Se endulza con miel.<\/p>\n<p><strong>Mate cocido con leche:<\/strong> desayuno base; tomarlo lejos de las comidas principales para no frenar la absorción del hierro <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"3\" data-s=\"0\">Nutrición §3<\/a>.<\/p>\n<p><strong>Limonada de suero:<\/strong> el suero que sobra del queso, con jugo de limón y miel, frío: refresca y aprovecha proteína que se tiraría.<\/p>"}]}]},{"id":"CAS","title":"Casa, agua, energía y oficios","sub":"Agua, fuego, construcción, taller, energía, textiles, jabón","color":"#2f6a8f","kind":"md","c":[{"t":"Agua","s":[{"t":"","h":"<p>Toda agua que no venga de una red funcionando se trata como contaminada hasta que se la filtre y se la desinfecte. En los asentamientos de emergencia, las diarreas por agua sucia y letrinas mal ubicadas matan más que el hambre.<\/p>\n<p>Este capítulo trata cómo conseguir, filtrar y guardar el agua; las dosis para potabilizar coinciden con <span class=\"ref\">►<\/span> Manual médico T2 15.2, y el agua para un grupo grande con <span class=\"ref\">►<\/span> T2 18.4.<\/p>"},{"t":"Cuánta agua hace falta [VITAL]","h":"<h3>Cuánta agua hace falta <span class=\"b vital\">VITAL<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th>Uso<\/th>\n<th>Litros por persona por día<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beber (adulto, clima templado)<\/td>\n<td>2 a 3<\/td>\n<\/tr>\n<tr>\n<td>Cocinar<\/td>\n<td>1 a 2<\/td>\n<\/tr>\n<tr>\n<td>Higiene mínima (manos, cara, platos)<\/td>\n<td>2 a 5<\/td>\n<\/tr>\n<tr>\n<td>Lavado de ropa y baño completo<\/td>\n<td>15 a 20<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En verano o con trabajo físico duro, la necesidad de beber se duplica. Un bebé que toma mamadera necesita agua segura para cada toma <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 2<\/a>.<\/p>"},{"t":"Juntar agua de lluvia [VITAL] (habilidades 76, 77, 78)","h":"<h3>Juntar agua de lluvia <span class=\"b vital\">VITAL<\/span> (habilidades 76, 77, 78)<\/h3>\n<p><strong>La cuenta:<\/strong> 1 mm de lluvia sobre 1 m² de techo da 1 litro. Se pierde alrededor de un 20 %, así que se calcula 0,8 litros por mm y por m².<\/p>\n<p><em>Ejemplo:<\/em> un techo de 60 m² con una lluvia de 10 mm junta unos 480 litros.<\/p>\n<p><strong>Ojo en zonas secas.<\/strong> En el Alto Valle y la Patagonia llueve poco, del orden de 200 mm por año. Allí la lluvia es un complemento: la fuente principal será el río, los canales de riego o un pozo. En el NEA o la Pampa húmeda la lluvia puede ser la fuente principal.<\/p>\n<p><strong>Materiales:<\/strong> canaletas, un caño de bajada, un tanque o tambor con tapa, malla mosquitera.<\/p>\n<p><strong>Pasos<\/strong><\/p>\n<ol>\n<li>Limpiar el techo y las canaletas. Los techos de chapa o teja sirven; los de fibrocemento viejo, de asfalto o pintados con pinturas de plomo, no sirven para beber.<\/li>\n<li>Poner malla en la boca de la canaleta para frenar hojas.<\/li>\n<li><strong>Desviador de primeras lluvias:<\/strong> un caño vertical cerrado abajo que se llena primero con el agua más sucia (polvo, excremento de pájaros). Cuando está lleno, el agua limpia pasa al tanque. Tamaño: aproximadamente 1 litro por cada m² de techo. Se vacía después de cada lluvia por un tapón en la base.<\/li>\n<li>El tanque, tapado y opaco, para que no crezcan algas ni mosquitos.<\/li>\n<li>Esta agua igual se filtra y se desinfecta antes de tomarla.<\/li>\n<\/ol>"},{"t":"Agua de río, canal o arroyo [VITAL]","h":"<h3>Agua de río, canal o arroyo <span class=\"b vital\">VITAL<\/span><\/h3>\n<ul>\n<li>Sacarla de una corriente, no de un charco quieto, y aguas arriba de donde se lava o hay animales.<\/li>\n<li>Dejarla reposar en un balde 12 a 24 horas para que decante el barro, y pasar solo la parte de arriba.<\/li>\n<li><strong>Canales de riego en zonas frutícolas:<\/strong> pueden traer restos de agroquímicos. Hervir y clorar no los elimina; el carbón activado los reduce en parte. Preferir tomas aguas arriba de las chacras y, si se puede, pozo o lluvia para beber.<\/li>\n<\/ul>"},{"t":"Filtro de arena y carbón [VITAL] (79, 85)","h":"<h3>Filtro de arena y carbón <span class=\"b vital\">VITAL<\/span> (79, 85)<\/h3>\n<p>Un filtro casero saca barro, olor y buena parte de los gérmenes, pero <strong>no reemplaza la desinfección<\/strong>.<\/p>\n<p><strong>Materiales:<\/strong> un balde o tambor con una canilla abajo, piedras, ripio, arena gruesa, arena fina y carbón vegetal molido. Arena lavada de corralón o de río.<\/p>\n<p><strong>Capas, de abajo hacia arriba<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Capa<\/th>\n<th>Espesor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Piedras (2 a 4 cm) alrededor de la canilla<\/td>\n<td>5 cm<\/td>\n<\/tr>\n<tr>\n<td>Ripio fino<\/td>\n<td>5 cm<\/td>\n<\/tr>\n<tr>\n<td>Arena gruesa<\/td>\n<td>10 cm<\/td>\n<\/tr>\n<tr>\n<td>Carbón vegetal molido (tamaño arroz)<\/td>\n<td>10 cm<\/td>\n<\/tr>\n<tr>\n<td>Arena fina<\/td>\n<td>20 a 30 cm<\/td>\n<\/tr>\n<tr>\n<td>Un plato o tela arriba, para que el agua no cave la arena<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Uso:<\/strong> lavar cada capa antes de armarla. Tirar los primeros 20 litros. Echar el agua de a poco, sin remover la arena.<\/p>\n<p><strong>Filtro biológico lento (80).<\/strong> Si el filtro se usa todos los días y la arena fina queda siempre 5 cm bajo agua, en dos o tres semanas se forma arriba una capa viva que come gérmenes. Es el filtro más eficaz que se puede hacer en casa, pero solo funciona si el agua circula seguido y despacio.<\/p>\n<p><strong>Carbón activado casero (85).<\/strong> Carbón vegetal de leña dura, molido, se calienta al rojo en una lata tapada con un agujero chico durante una hora y se enfría tapado. Mejora sabor y olor. Cambiarlo cada 2 o 3 meses de uso.<\/p>"},{"t":"Desinfectar [VITAL] (81, 82, 83)","h":"<h3>Desinfectar <span class=\"b vital\">VITAL<\/span> (81, 82, 83)<\/h3>\n<p><strong>Hervir.<\/strong> Hervor fuerte, a borbotones, durante 1 a 3 minutos (3 minutos por encima de 2.000 m de altura), y dejar enfriar tapada. Es el método más seguro contra gérmenes. Para pasar el gusto chato, trasvasar de un recipiente a otro varias veces.<\/p>\n<p><strong>Lavandina.<\/strong> La dosis depende de la concentración que dice la etiqueta, y la lavandina tiene que decir <em>apta para desinfectar agua<\/em>, sin perfume ni aditivos.<\/p>\n<table>\n<thead>\n<tr>\n<th>Lavandina (según la etiqueta)<\/th>\n<th>Agua clara<\/th>\n<th>Agua turbia, después de dejarla asentar y filtrarla<\/th>\n<th>Reposo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Concentrada (55 a 60 g de cloro por litro)<\/td>\n<td>2 gotas por litro<\/td>\n<td>4 gotas por litro<\/td>\n<td>30 minutos<\/td>\n<\/tr>\n<tr>\n<td>Común (25 g de cloro por litro)<\/td>\n<td>4 gotas por litro<\/td>\n<td>8 gotas por litro<\/td>\n<td>30 minutos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Son las mismas dosis del <span class=\"ref\">►<\/span> Manual médico T2 15.2, que trae además la tintura de yodo y los límites de cada método.<\/p>\n<p>El agua tiene que quedar con un olor leve a cloro. Si no huele, repetir la dosis y esperar 15 minutos más. La lavandina pierde fuerza con el tiempo y el calor: revisar el vencimiento y guardarla a oscuras.<\/p>\n<p><strong>Desinfectar un tanque:<\/strong> llenarlo hasta la mitad, agregar 1 litro de lavandina por cada 1.000 litros de capacidad, terminar de llenar y dejar reposar 3 horas antes de usar.<\/p>\n<p><strong>Sol (SODIS).<\/strong> Botellas de PET transparente de hasta 2 litros, sin etiqueta, con agua clara. Acostarlas sobre chapa o un techo al sol durante 6 horas de sol pleno, o 2 días seguidos si está nublado. No sirve con agua turbia ni con botellas de color o rayadas. Es el recurso cuando no hay leña ni lavandina.<\/p>\n<p><strong>Destilador solar (84).<\/strong> Un pozo en la tierra o una bandeja negra con agua sucia, un vaso en el centro y un nylon transparente tensado arriba con una piedra en el medio. El vapor se condensa y gotea en el vaso. Da poco, del orden de medio a un litro por día por m², pero saca sal y químicos.<\/p>"},{"t":"Guardar agua [VITAL] (86, 87)","h":"<h3>Guardar agua <span class=\"b vital\">VITAL<\/span> (86, 87)<\/h3>\n<ul>\n<li>Bidones de plástico apto alimentos, limpios y desinfectados (1 cucharada de lavandina en un litro de agua, tapar, agitar, enjuagar).<\/li>\n<li>Tapados, a la sombra y lejos de combustibles y venenos.<\/li>\n<li>Rotar: el agua clorada guardada se renueva cada 6 meses. Marcar la fecha en el bidón.<\/li>\n<li>Sacar el agua con un jarro limpio que se use solo para eso, o mejor por canilla. Nunca meter las manos.<\/li>\n<\/ul>"},{"t":"Transportar agua sin contaminarla [VITAL]","h":"<h3>Transportar agua sin contaminarla <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Cuando no hay canilla, el agua viaja todos los días, y el viaje es donde más se ensucia y donde más espaldas se rompen.<\/p>\n<ul>\n<li><strong>Recipientes marcados:<\/strong> unos para agua cruda (de río, canal o pozo) y otros solo para agua ya tratada, con cinta o pintura de color distinto. Nunca se mezclan ni se cambian de uso.<\/li>\n<li><strong>Con tapa y boca chica:<\/strong> bidones con tapa a rosca, no baldes abiertos. Llenarlos sumergiendo el bidón o con un jarro limpio, sin meter las manos.<\/li>\n<li><strong>Peso que se puede llevar:<\/strong> un litro pesa un kilo. Bidones de 10 litros para adultos y de 5 litros para chicos de más de 10 años; los de 20 litros solo en carro.<\/li>\n<li><strong>Llevar mejor, no más fuerte:<\/strong> carretilla, carrito de dos ruedas, bicicleta con alforjas o remolque (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"6\" data-s=\"0\">cap. 7<\/a>), o un palo al hombro con un balde tapado en cada punta. Cargar con la espalda derecha y las piernas dobladas.<\/li>\n<li><strong>De a dos:<\/strong> a la fuente y en los trayectos largos, nunca un chico solo (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 2<\/a>).<\/li>\n<li><strong>Lavado de los recipientes:<\/strong> una vez por semana, con agua y lavandina (1 cucharada por litro), agitar, vaciar y dejar secar boca abajo. Si aparece limo verde por dentro, refregar con arena y enjuagar.<\/li>\n<li><strong>En casa,<\/strong> el agua tratada se sirve con canilla o con un jarro que se usa solo para eso.<\/li>\n<\/ul>"},{"t":"Agua de nieve, hielo y escarcha [VITAL]","h":"<h3>Agua de nieve, hielo y escarcha <span class=\"b vital\">VITAL<\/span><\/h3>\n<ul>\n<li><strong>Nunca comer nieve ni hielo sin derretir:<\/strong> enfría el cuerpo, gasta energía y empeora la hipotermia. Se derrite primero.<\/li>\n<li><strong>No es agua segura:<\/strong> la nieve y el hielo de ríos y lagunas tienen los mismos gérmenes que el agua de donde vienen. Una vez derretida se trata como cualquier agua dudosa: hervir 1 a 3 minutos o clorar (<span class=\"ref\">►<\/span> <em>Desinfectar<\/em>, arriba).<\/li>\n<li><strong>Rinde poco:<\/strong> de 10 a 20 litros de nieve sale alrededor de 1 litro de agua; el hielo rinde mucho más. Si hay donde elegir, juntar hielo o nieve vieja y compacta.<\/li>\n<li><strong>Cómo derretir:<\/strong> poner primero un poco de agua en la olla y agregar la nieve de a poco; la nieve sola en olla seca se pega y quema la olla y el gusto. Un bidón negro con nieve al sol, apoyado sobre una piedra, también derrite.<\/li>\n<li>No usar nieve sucia, amarillenta o rosada, ni la que está al costado de caminos.<\/li>\n<\/ul>"},{"t":"Trampa solar de condensación y bolsa de transpiración [MEJORA]","h":"<h3>Trampa solar de condensación y bolsa de transpiración <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Sirven para sacar unos vasos de agua donde no hay ninguna otra fuente. <strong>Rinden muy poco:<\/strong> no reemplazan a una fuente de agua y no conviene gastar en ellas el sudor que cuestan con calor.<\/p>\n<p><strong>Pozo solar<\/strong><\/p>\n<ol>\n<li>Cavar un pozo de 1 metro de ancho y 60 cm de hondo en tierra húmeda, al sol (fondo de un bajo, cauce seco).<\/li>\n<li>Poner en el centro un recipiente limpio. Alrededor, plantas verdes picadas o un bidón con agua salada o sucia (no orina, que se puede usar mejor regando).<\/li>\n<li>Tapar el pozo con un nylon transparente, sellar los bordes con tierra y poner una piedra chica en el centro del nylon, justo arriba del recipiente, para que forme un cono.<\/li>\n<li>El sol evapora la humedad, el vapor se condensa debajo del nylon y gotea en el recipiente. Rinde entre medio vaso y un litro por día.<\/li>\n<\/ol>\n<p><strong>Bolsa de transpiración:<\/strong> una bolsa de nylon transparente atada sobre una rama con muchas hojas, al sol, con una piedrita en el fondo para que el agua junte en una punta. Rinde de medio vaso a un vaso por bolsa y por día. Nunca sobre plantas tóxicas como el laurel rosa (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"7\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 8<\/a>).<\/p>\n<p><strong>Destilador de agua salada o contaminada:<\/strong> una caja de madera pintada de negro por dentro, con una bandeja con agua y una tapa de vidrio inclinada; el agua se evapora, se condensa en el vidrio y corre hacia una canaleta en el borde bajo que la lleva a un bidón. Es la única de estas técnicas que saca sal, químicos y metales. Rinde 2 a 4 litros por metro cuadrado de vidrio en un día de verano.<\/p>"},{"t":"Pozo y agua subterránea [VITAL] (88, 89)","h":"<h3>Pozo y agua subterránea <span class=\"b vital\">VITAL<\/span> (88, 89)<\/h3>\n<p><strong>Dónde buscar:<\/strong> lugares bajos, cerca de vegetación verde en temporada seca (sauces, juncos, cortaderas), y donde los vecinos ya tienen pozo. Preguntar a quien tiene perforación a qué profundidad está la napa. La radiestesia (varillas o péndulo) no tiene base comprobada: no gastar trabajo en ella.<\/p>\n<p><strong>Seguridad al cavar a mano<\/strong><\/p>\n<ul>\n<li>Nunca bajar solo. Siempre con cuerda atada a la cintura y alguien arriba.<\/li>\n<li>Pasados los 1,5 metros, entibar las paredes (anillos de cemento, tablas o ladrillos) para que no se derrumben.<\/li>\n<li>En pozos hondos puede acumularse gas sin olor. Bajar antes una vela encendida atada a un hilo: si se apaga, no bajar.<\/li>\n<li>Tapar siempre el pozo. Los chicos y los animales caen en pozos abiertos.<\/li>\n<\/ul>\n<p><strong>Ubicación:<\/strong> al menos 30 metros de cualquier letrina, corral o pozo ciego, y más arriba en la pendiente.<\/p>\n<p><strong>Bomba manual o ariete (88).<\/strong> Una bomba de mano tipo palanca sube agua desde hasta unos 7 metros. El ariete hidráulico sube agua de un arroyo con desnivel sin ningún motor: usa el golpe del agua que baja para empujar una parte hacia arriba. Requiere al menos 1 metro de caída (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"6\" data-s=\"0\">cap. 7<\/a>, <em>Ariete hidráulico<\/em>).<\/p>"},{"t":"Cómo darse cuenta de que el agua está contaminada [VITAL] (95)","h":"<h3>Cómo darse cuenta de que el agua está contaminada <span class=\"b vital\">VITAL<\/span> (95)<\/h3>\n<ul>\n<li>Olor a podrido, a combustible o a químico, espuma, manchas de aceite.<\/li>\n<li>Animales muertos o excremento cerca de la fuente, aguas arriba.<\/li>\n<li>Algas verdes en capas espesas (pueden ser tóxicas aun hervidas).<\/li>\n<li>Casos de diarrea en quienes la tomaron.<\/li>\n<li><strong>Lo que no se ve:<\/strong> el agua clara puede tener gérmenes y el agua de pozo puede tener nitratos o arsénico (hay zonas del país con arsénico natural en las napas). Ante diarreas en varios chicos a la vez, cambiar de fuente enseguida <span class=\"ref\">►<\/span> Manual médico T1 5.3 y T2 18.10.<\/li>\n<\/ul>"},{"t":"Cálculo de consumo (93)","h":"<h3>Cálculo de consumo (93)<\/h3>\n<p>Anotar en el cuaderno, cada semana: litros usados, litros juntados y litros en reserva. Si la reserva baja dos semanas seguidas, cortar primero el agua de lavado de ropa, después la del baño completo, nunca la de beber y lavarse las manos.<\/p>"}]},{"t":"Saneamiento: baño seco, aguas grises y residuos","s":[{"t":"","h":"<p>Sin cloacas ni agua para descargar inodoros, las heces mal manejadas contaminan el agua y la comida en pocos días. Letrinas, residuos y lavado de manos para un grupo grande <span class=\"ref\">►<\/span> Manual médico T2 18.5 a 18.7.<\/p>"},{"t":"Baño seco [VITAL] (92)","h":"<h3>Baño seco <span class=\"b vital\">VITAL<\/span> (92)<\/h3>\n<p>Sin agua para descargar inodoros, el baño seco evita enfermedades y produce abono a largo plazo.<\/p>\n<p><strong>Materiales:<\/strong> dos baldes de 20 litros con tapa, un asiento de inodoro o un cajón con agujero, aserrín, ceniza, tierra seca u hojas secas picadas.<\/p>\n<p><strong>Pasos<\/strong><\/p>\n<ol>\n<li>Separar la orina si se puede (un embudo adelante que lleva a otro bidón). Sin orina, el balde huele mucho menos.<\/li>\n<li>Después de cada uso, cubrir con una taza de material seco.<\/li>\n<li>Cuando el balde se llena, vaciarlo en una pila de compostaje exclusiva, cercada y tapada, lejos de la huerta y del agua.<\/li>\n<li>Esa pila no se toca durante un año como mínimo, idealmente dos. Después se usa solo en árboles frutales y plantas que no se comen crudas, nunca en verduras de hoja.<\/li>\n<li>La orina, diluida en 10 partes de agua, sirve como abono para frutales y maíz.<\/li>\n<\/ol>\n<p><strong>Lavado de manos:<\/strong> al lado del baño, siempre, un bidón con canilla y jabón. Este es el punto donde más se cortan las enfermedades.<\/p>\n<p><strong>Letrina de pozo:<\/strong> si no hay baldes, <span class=\"ref\">►<\/span> <em>Letrina de pozo con caseta<\/em>, más abajo.<\/p>"},{"t":"Aguas grises [AÑOS] (91)","h":"<h3>Aguas grises <span class=\"b anos\">AÑOS<\/span> (91)<\/h3>\n<p>El agua de lavar platos, ropa o manos sirve para regar si se usa jabón casero o neutro.<\/p>\n<ul>\n<li>Pasarla por un balde con paja o arena para retener grasa.<\/li>\n<li>Regar al pie de frutales, arbustos y maíz. No mojar hojas de verduras que se comen crudas.<\/li>\n<li>No guardarla más de 24 horas: se pudre.<\/li>\n<\/ul>"},{"t":"Letrina de pozo con caseta [AÑOS] (92)","h":"<h3>Letrina de pozo con caseta <span class=\"b anos\">AÑOS<\/span> (92)<\/h3>\n<p>Cuando hay muchas personas o el baño seco no alcanza.<\/p>\n<p><strong>Dónde:<\/strong> a 30 metros como mínimo de pozos de agua, acequias y canales, y más abajo en la pendiente; a 6 metros o más de la casa. <strong>No en suelos con napa alta:<\/strong> el fondo del pozo tiene que quedar a 1,5 o 2 metros del agua de la napa. En los valles con napa cerca (el Alto Valle, por ejemplo, en muchas zonas), usar baño seco en lugar de letrina.<\/p>\n<p><strong>El pozo:<\/strong> de 80 cm a 1 m de lado y 2 a 3 metros de hondo. En tierra floja, revestir los primeros 50 cm con ladrillos o tablas para que el borde no se desmorone.<\/p>\n<p><strong>La losa:<\/strong> de madera dura, tablones bien unidos o una losa de hormigón con malla, que apoye 30 cm sobre tierra firme a cada lado. Agujero de 20 × 30 cm con tapa. Los chicos usan una tapa reductora o una pelela.<\/p>\n<p><strong>La caseta:<\/strong> 4 postes enterrados en las esquinas, paredes de chapa, tablas, caña o lona, techo con pendiente y una puerta. Un banco o cajón con agujero si hay ancianos o personas con dificultad para agacharse.<\/p>\n<p><strong>Caño de ventilación:<\/strong> un caño de 10 cm que sale de la losa hasta 50 cm sobre el techo, pintado de negro y con tela mosquitera arriba. El sol calienta el caño, el aire sube y se lleva el olor; las moscas que entran al pozo van hacia la luz del caño y quedan atrapadas en la tela. Con la tapa del agujero puesta, casi no hay olor ni moscas.<\/p>\n<p><strong>Uso:<\/strong> una taza de ceniza o cal después de cada uso. Lavamanos con bidón y jabón al lado de la puerta (<span class=\"ref\">►<\/span> Manual médico T2 18.5 y 18.7).<\/p>\n<p><strong>Cuando faltan 50 cm para llenarse:<\/strong> rellenar con tierra, plantar un árbol y mudar la caseta a un pozo nuevo.<\/p>"},{"t":"Limpiar la casa después de una inundación [VITAL]","h":"<h3>Limpiar la casa después de una inundación <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>El agua de una inundación trae cloacas, animales muertos y químicos: todo lo que tocó se trata como contaminado.<\/p>\n<ol>\n<li><strong>Entrar con cuidado:<\/strong> solo cuando el agua bajó, de día, con botas y guantes. Antes de entrar, mirar si hay paredes rajadas o techos hundidos. Si había instalación eléctrica, cortar la llave general antes de pisar agua.<\/li>\n<li><strong>Tirar lo que no se puede salvar:<\/strong> alimentos que tocó el agua (también frascos de conserva con tapa de rosca y bolsas cerradas), colchones, almohadas, peluches, cartón y aglomerado hinchado. Las latas sanas, sin abolladuras, se lavan, se sumergen 1 minuto en agua con lavandina y se secan.<\/li>\n<li><strong>Sacar el barro<\/strong> con pala y escoba antes de lavar.<\/li>\n<li><strong>Lavar<\/strong> paredes, pisos, muebles, ollas y juguetes con agua y jabón o detergente, y después <strong>desinfectar<\/strong> con lavandina: 1 vaso (200 ml) de lavandina común o medio vaso de concentrada en un balde de 10 litros. Dejar actuar 10 minutos y enjuagar lo que va a tocar comida o la boca de los chicos.<\/li>\n<li><strong>Ollas y vajilla:<\/strong> lavar y hervir 10 minutos, o sumergir en la solución anterior.<\/li>\n<li><strong>Secar rápido:<\/strong> puertas y ventanas abiertas varios días. El moho negro que aparece se refriega con la misma solución; si se cubre una pared entera, tirar ese revoque.<\/li>\n<li><strong>Ropa:<\/strong> lavar en agua caliente con jabón y secar al sol.<\/li>\n<li><strong>Excrementos de ratones o ratas:<\/strong> mojarlos primero con la solución de lavandina, esperar 10 minutos y recién ahí juntar con trapo (nunca barrer en seco) <span class=\"ref\">►<\/span> Manual médico T1 bloque 4 (hantavirus).<\/li>\n<li><strong>El agua:<\/strong> pozos, cisternas y tanques que se inundaron se vacían, se limpian y se desinfectan antes de volver a usarlos; mientras tanto, toda el agua se hierve.<\/li>\n<li>Vigilar diarreas y fiebre las semanas siguientes <span class=\"ref\">►<\/span> Manual médico T2 18.10.<\/li>\n<\/ol>"},{"t":"Residuos","h":"<h3>Residuos<\/h3>\n<ul>\n<li>Separar: restos de comida al compost o a las gallinas; papel y cartón para encender fuego; vidrio, latas y plásticos limpios para reutilizar (frascos, bidones, alambre).<\/li>\n<li>Lo que no sirve, a un pozo de basura tapado con tierra cada semana, lejos del agua y de la huerta, y nunca quemar plásticos cerca de las casas.<\/li>\n<li>Pañales y apósitos con sangre: enterrar o quemar <span class=\"ref\">►<\/span> Manual médico T2 18.6.<\/li>\n<\/ul>"},{"t":"Plagas de la casa [AÑOS]","h":"<h3>Plagas de la casa <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Ratas, ratones, mosquitos, vinchucas, garrapatas y moscas como problema de salud del grupo: <span class=\"ref\">►<\/span> Manual médico T2 18.9. Acá, las que arruinan la casa, la ropa y el descanso.<\/p>\n<table>\n<thead>\n<tr>\n<th>Plaga<\/th>\n<th>Señal<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cucarachas<\/strong><\/td>\n<td>Excrementos como pimienta negra en cajones y detrás de la heladera; aparecen de noche<\/td>\n<td>Comida tapada, nada de agua a disposición de noche (secar la pileta), tapar grietas con revoque o masilla. <strong>Cebo:<\/strong> 1 parte de ácido bórico en 2 de harina con azúcar y unas gotas de agua, en bolitas dentro de tapitas, <strong>siempre fuera del alcance de chicos y animales<\/strong> (el ácido bórico es tóxico si se traga). Tierra de diatomeas en las rendijas<\/td>\n<\/tr>\n<tr>\n<td><strong>Chinches de cama<\/strong><\/td>\n<td>Picaduras en fila al despertar, manchitas negras y de sangre en el colchón y las costuras<\/td>\n<td>Lavar sábanas y ropa en agua hirviendo o a más de 60 °C; dejar colchones, frazadas y almohadas al <strong>sol fuerte del verano<\/strong> varias horas, dados vuelta; pasar plancha caliente o agua hirviendo por las costuras y las juntas de la cama; diatomeas en las grietas. Revisar la ropa y las bolsas de quien llega (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 4<\/a>, <em>Recibir a gente nueva<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Pulgas<\/strong><\/td>\n<td>Picaduras en tobillos; perros y gatos rascándose<\/td>\n<td>Barrer y lavar el piso seguido, lavar camas de los animales en agua caliente, sal o diatomeas en alfombras unos días y barrer. Bañar a los animales con agua y jabón<\/td>\n<\/tr>\n<tr>\n<td><strong>Polillas de la ropa<\/strong><\/td>\n<td>Agujeros chicos en lana y fieltro<\/td>\n<td>Lana guardada <strong>limpia<\/strong> (la suciedad las atrae), en bolsas cerradas o cajas, con ramitas de lavanda, cedro, eucalipto o romero; airear al sol en verano y sacudir<\/td>\n<\/tr>\n<tr>\n<td><strong>Moscas<\/strong><\/td>\n<td>—<\/td>\n<td>Basura y compost tapados, letrina con tapa (<span class=\"ref\">►<\/span> <em>Letrina de pozo con caseta<\/em>), tela mosquitera en ventanas, trampa de botella con agua, azúcar y vinagre colgada afuera<\/td>\n<\/tr>\n<tr>\n<td><strong>Termitas y carcoma<\/strong><\/td>\n<td>Polvillo de madera debajo de vigas y muebles; caminos de barro en las paredes<\/td>\n<td>La madera de construcción, separada del suelo con piedra o cimiento; sacar y quemar la madera atacada; aceite o creosota vegetal en las cabezas de las vigas. Las termitas son raras en la Patagonia y comunes en el centro y el norte del país<\/td>\n<\/tr>\n<tr>\n<td><strong>Vinchucas<\/strong><\/td>\n<td>Bichos marrones con borde rayado en paredes de barro, techos de paja y gallineros<\/td>\n<td>Revoque liso sin grietas, techos sin paja suelta, gallineros lejos de la casa <span class=\"ref\">►<\/span> Manual médico T2 18.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},{"t":"Fuego, calor y luz","s":[{"t":"","h":"<p>El fuego cocina, hierve el agua, calienta y alumbra; sin red de gas ni luz, la leña pasa a ser el recurso que más trabajo cuesta. La regla es gastar poca: estufas eficientes, ambientes chicos y bien aislados, cocción con caja térmica.<\/p>\n<div class=\"atencion\">\n<p><strong>Monóxido de carbono.<\/strong> Brasero, estufa sin tiraje, grupo electrógeno o garrafa encendidos en un ambiente cerrado matan sin aviso. Síntomas: dolor de cabeza, mareo, sueño, náuseas en varias personas a la vez. Siempre dejar una entrada y una salida de aire. Nunca dormir con brasas encendidas en el cuarto.<\/p>\n<\/div>"},{"t":"Hacer fuego [VITAL] (156)","h":"<h3>Hacer fuego <span class=\"b vital\">VITAL<\/span> (156)<\/h3>\n<p>El fuego necesita tres cosas en este orden: <strong>yesca<\/strong> (prende con una chispa), <strong>astillas<\/strong> (del grosor de un lápiz) y <strong>leña<\/strong> (de a poco más gruesa).<\/p>\n<p><strong>Yesca que funciona<\/strong><\/p>\n<ul>\n<li>Algodón untado en vaselina, guardado en un frasco: prende con una chispa y arde 2 minutos. Hacer cien ahora.<\/li>\n<li>Pasto seco frotado entre las manos hasta que quede como pelusa.<\/li>\n<li>Corteza interna de álamo o sauce seca, deshilachada.<\/li>\n<li>Piñas y pinocha de pino, papel, cartón, viruta de madera seca.<\/li>\n<\/ul>\n<p><strong>Formas de encenderlo, de la más fácil a la más difícil<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Método<\/th>\n<th>Qué hace falta<\/th>\n<th>Comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fósforos y encendedores<\/td>\n<td>Stock guardado en frascos cerrados<\/td>\n<td>Comprar ahora en cantidad: son lo primero que falta<\/td>\n<\/tr>\n<tr>\n<td>Varilla de ferrocerio<\/td>\n<td>Varilla y una hoja de acero<\/td>\n<td>Da miles de encendidos, funciona mojada. Imprescindible en la reserva<\/td>\n<\/tr>\n<tr>\n<td>Lupa o lente<\/td>\n<td>Sol fuerte<\/td>\n<td>Solo de día despejado<\/td>\n<\/tr>\n<tr>\n<td>Pila y lana de acero<\/td>\n<td>Pila de 9 V o dos de 1,5 V y virulana fina<\/td>\n<td>La lana de acero se pone al rojo al tocar los polos<\/td>\n<\/tr>\n<tr>\n<td>Pedernal y eslabón<\/td>\n<td>Piedra dura y acero al carbono<\/td>\n<td>Chispa débil, necesita yesca muy buena (hongo yesquero, tela carbonizada)<\/td>\n<\/tr>\n<tr>\n<td>Arco de fricción<\/td>\n<td>Madera seca blanda, cordón, práctica<\/td>\n<td>Lleva semanas aprenderlo. Último recurso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tela carbonizada:<\/strong> recortes de algodón en una lata con un agujero de clavo, al fuego hasta que deja de salir humo. Toma cualquier chispa.<\/p>"},{"t":"Encender con lupa, lente o espejo [AÑOS]","h":"<h3>Encender con lupa, lente o espejo <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Sirve en días despejados, entre media mañana y media tarde.<\/p>\n<ol>\n<li>Preparar antes el nido (pasto seco, corteza deshilachada) y una yesca oscura que tome la luz: tela carbonizada, hongo yesquero seco, carbón molido o papel tiznado. La luz no prende fácil sobre lo blanco.<\/li>\n<li>Ponerse de espaldas al viento y orientar la lente perpendicular al sol.<\/li>\n<li>Acercar y alejar la lente hasta que el punto de luz sea <strong>lo más chico posible<\/strong>. Sostenerla quieta, apoyando las manos en las rodillas o en una piedra.<\/li>\n<li>Cuando la yesca hace humo y aparece un punto rojo, dejar de enfocar, envolverla en el nido y soplar suave y parejo hasta la llama.<\/li>\n<\/ol>\n<p><strong>Qué sirve como lente:<\/strong> lupas de más de 5 cm, anteojos de lectura (de los que agrandan; los de miope no sirven), el reflector de una linterna, una bolsa de nylon transparente llena de agua y bien redonda, o el fondo cóncavo de una lata de gaseosa pulido con pasta dental hasta que brille como espejo (la yesca va en el punto donde se junta la luz, a 2 o 3 cm del fondo).<\/p>"},{"t":"Arco de fricción paso a paso [MEJORA]","h":"<h3>Arco de fricción paso a paso <span class=\"b mejora\">MEJORA<\/span><\/h3>\n<p>Es el último recurso: lleva semanas de práctica y mucha fuerza. Aprenderlo con buen tiempo, no cuando hace falta.<\/p>\n<p><strong>Las piezas<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Pieza<\/th>\n<th>Cómo es<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tabla base<\/td>\n<td>Madera blanda y bien seca (álamo, sauce, tilo, raíz de sauce): 2 cm de grosor, 4 dedos de ancho<\/td>\n<\/tr>\n<tr>\n<td>Huso<\/td>\n<td>De la misma madera o un poco más dura: recto, 20 a 25 cm de largo y 2 cm de grosor, redondeado abajo y en punta arriba<\/td>\n<\/tr>\n<tr>\n<td>Empuñadura<\/td>\n<td>Una piedra con un hueco, un hueso, o un trozo de madera dura con un hoyo; el hoyo engrasado con jabón, cera o aceite para que gire sin frenar<\/td>\n<\/tr>\n<tr>\n<td>Arco<\/td>\n<td>Una rama firme, un poco curva, del largo del brazo, con un cordón resistente (cordón de zapato, cordel de nylon) atado con algo de flojedad<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pasos<\/strong><\/p>\n<ol>\n<li>Hacer un hoyo chico en la tabla, a 1,5 cm del borde, con la punta del cuchillo.<\/li>\n<li>Dar una vuelta del cordón alrededor del huso: tiene que quedar tenso.<\/li>\n<li>Pisar la tabla con el pie izquierdo (diestros), arrodillado sobre la pierna derecha, el brazo izquierdo apoyado en la rodilla con la empuñadura, firme contra la pierna.<\/li>\n<li>Mover el arco con pasadas largas y parejas, usando todo el cordón, hasta que el hoyo se queme y quede negro y redondo.<\/li>\n<li>Tallar una muesca en V desde el borde de la tabla hasta el centro del hoyo, como un octavo de una torta. Ahí se junta el polvo que se convierte en brasa.<\/li>\n<li>Poner una hoja o un trozo de corteza debajo de la muesca.<\/li>\n<li>Volver a girar: primero parejo hasta que salga mucho humo, después más rápido y con más presión unas 20 pasadas.<\/li>\n<li>Cuando la muesca está llena de polvo marrón oscuro que sigue humeando solo, levantar la tabla con cuidado. Abanicar suave esa brasa, pasarla al nido y soplar.<\/li>\n<\/ol>\n<p><strong>Si no sale:<\/strong> polvo claro = poca velocidad o poca presión; polvo que no humea = madera húmeda; el huso salta = falta firmeza en la muñeca.<\/p>"},{"t":"Mantener el fuego [VITAL] (157)","h":"<h3>Mantener el fuego <span class=\"b vital\">VITAL<\/span> (157)<\/h3>\n<ul>\n<li>A la noche, juntar las brasas en un montón y cubrirlas con ceniza. A la mañana se destapan, se sopla y se agrega astilla. Así se ahorran encendidos.<\/li>\n<li>Pasar brasas al vecino en una lata con tierra: una comunidad puede mantener un fuego común.<\/li>\n<\/ul>"},{"t":"Leña [VITAL] (105, 106)","h":"<h3>Leña <span class=\"b vital\">VITAL<\/span> (105, 106)<\/h3>\n<p><strong>Secado:<\/strong> la leña verde rinde la mitad y llena de hollín la chimenea. Cortar en primavera y verano, partir, apilar con techo arriba y aire a los costados, y quemarla al invierno siguiente (6 a 12 meses de estacionamiento). Leña seca: suena hueca al golpear dos trozos y tiene grietas en las puntas.<\/p>\n<p><strong>Qué rinde más:<\/strong> las maderas duras (algarrobo, quebracho, espinillo, frutales de poda como manzano y peral) dan brasa larga. Álamo, sauce y pino arden rápido: sirven para encender y para hornear rápido. En el Alto Valle, las cortinas de álamo y la poda de frutales son la fuente principal; replantar lo que se corta.<\/p>\n<p><strong>Hachar con seguridad (106)<\/strong><\/p>\n<ul>\n<li>Partir sobre un tronco ancho, nunca sobre el piso (el hacha rebota contra el pie).<\/li>\n<li>Piernas abiertas, el tronco a partir apenas delante. Si el golpe falla, el hacha tiene que terminar en el tronco base, no en la canilla.<\/li>\n<li>Nadie a menos de dos largos de hacha alrededor, menos los chicos.<\/li>\n<li>Hacha afilada: una sin filo rebota y lastima más (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"5\" data-s=\"0\">cap. 6<\/a>).<\/li>\n<\/ul>\n<p><strong>Leñera (105):<\/strong> techo de chapa, piso elevado del suelo con palets, abierta a los costados. Ubicarla cerca de la puerta pero a más de 3 metros de la casa (las pilas de leña atraen roedores y son riesgo de incendio).<\/p>"},{"t":"Estufa rocket [VITAL] (103)","h":"<h3>Estufa rocket <span class=\"b vital\">VITAL<\/span> (103)<\/h3>\n<p>Quema ramas finas y poda con muy poco humo y mucho calor, porque la combustión es completa dentro de un tubo aislado. Para cocinar, una rocket chica gasta un tercio o menos de la leña de un fogón abierto.<\/p>\n<p><strong>Rocket de ladrillos para cocinar (sin cemento)<\/strong><\/p>\n<ol>\n<li>Base firme de ladrillos en el piso o sobre una mesa de tierra.<\/li>\n<li>Con ladrillos comunes, armar una L: una entrada horizontal de unos 15 × 15 cm y 30 cm de largo, que gira hacia arriba en una chimenea interna de 15 × 15 cm y 40 a 60 cm de alto.<\/li>\n<li>Rellenar el espacio alrededor de la chimenea interna con aislante: ceniza, arena con perlita, o barro mezclado con aserrín. Cuanto mejor aislada, menos humo.<\/li>\n<li>Arriba, tres ladrillos o un soporte de hierro dejan 3 a 4 cm de luz entre la boca y la olla, para que salgan los gases.<\/li>\n<li>Una chapa a media altura en la entrada separa la leña (arriba) del aire (abajo).<\/li>\n<\/ol>\n<p><strong>Uso:<\/strong> ramas del grosor de un dedo, empujadas a medida que se queman. Si sale humo por la entrada, la chimenea interna está fría o mal aislada.<\/p>\n<p><strong>Rocket para calefaccionar:<\/strong> una versión más grande cuyo humo recorre un banco de barro y piedra antes de salir por la chimenea; el banco acumula calor y lo entrega durante horas. Es una obra de construcción: pedirla en la comunidad a quien ya haya armado una y respetar la salida de humos al exterior.<\/p>"},{"t":"Estufa rocket para calefaccionar [AÑOS]","h":"<h3>Estufa rocket para calefaccionar <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>La que calienta la casa es una rocket grande cuyo humo, en lugar de salir enseguida, recorre un banco de barro donde deja el calor. Con unos kilos de ramas por día, el banco queda tibio toda la noche.<\/p>\n<p><strong>Partes (sistema de 15 cm, el más común para una casa)<\/strong><\/p>\n<ol>\n<li><strong>Alimentador:<\/strong> una boca vertical de 15 × 15 cm donde se paran las ramas, que se queman desde abajo.<\/li>\n<li><strong>Túnel de quemado:<\/strong> horizontal, de la misma sección, de 30 a 40 cm de largo.<\/li>\n<li><strong>Columna caliente:<\/strong> sube 1 metro a 1,2 metros, de la misma sección, muy bien aislada (ladrillo refractario o caño de hierro forrado con 5 cm de perlita con barro). Ahí se completa la combustión.<\/li>\n<li><strong>Campana:<\/strong> un tambor de 200 litros dado vuelta sobre la columna, dejando 5 cm de luz arriba. Irradia calor enseguida.<\/li>\n<li><strong>Conducto en el banco:<\/strong> el humo baja entre el tambor y la columna y entra en un caño de 15 cm que recorre el banco (de 4 a 8 metros de recorrido como máximo) antes de salir a la chimenea.<\/li>\n<li><strong>Banco:<\/strong> el caño se cubre con piedra, ladrillo y barro mezclado con arena y paja, de 20 a 30 cm alrededor. Es la masa que acumula el calor.<\/li>\n<li><strong>Chimenea:<\/strong> sale al exterior y sube por encima del techo.<\/li>\n<\/ol>\n<p><strong>Reglas que no se discuten<\/strong><\/p>\n<ul>\n<li>La sección del humo <strong>nunca se achica<\/strong> en ningún punto del recorrido: si se achica, el humo vuelve a la casa.<\/li>\n<li>Una tapa de limpieza en cada curva del caño: la ceniza se junta y tapa el tiraje.<\/li>\n<li>Probar el tiraje antes de terminar el banco, con papel encendido en el alimentador: la llama tiene que meterse hacia adentro.<\/li>\n<li>Nunca dejarla tapada ni con una llave cerrada en la chimenea. Ante dolor de cabeza o mareo de varias personas, abrir todo y salir <span class=\"ref\">►<\/span> Manual médico T1 3.32.<\/li>\n<li>Copiar las medidas de un plano probado; improvisar las proporciones es la causa más común de estufas que humean.<\/li>\n<\/ul>"},{"t":"Aislar y calentar sin gastar (102, 108, 114)","h":"<h3>Aislar y calentar sin gastar (102, 108, 114)<\/h3>\n<ul>\n<li>Vivir y dormir en la habitación más chica, con menos ventanas y del lado norte (en el hemisferio sur el sol de invierno entra por el norte).<\/li>\n<li>Cerrar el resto de la casa.<\/li>\n<li>Ventanas: durante el día abiertas al sol del norte; a la noche, cortinas gruesas o frazadas colgadas. Nylon tensado sobre el marco funciona como doble vidrio.<\/li>\n<li>Burletes caseros: tubos de tela rellenos de arena al pie de las puertas.<\/li>\n<li>Pisos de cemento o cerámica: alfombras, cartones, frazadas viejas.<\/li>\n<li>Techo: es por donde se pierde la mayor parte del calor. Una capa de paja, lana de oveja o cartón sobre el cielorraso ayuda mucho.<\/li>\n<li>Ventilar 5 minutos dos veces por día, con todo abierto de golpe, es mejor que una rendija todo el día (salvo cuando hay fuego encendido: ahí la entrada de aire es obligatoria).<\/li>\n<li>Dormir con gorro, medias de lana y bolsas de agua caliente. Varios en una cama o colchones juntos en el piso, sobre cartones.<\/li>\n<\/ul>"},{"t":"Aislar el techo [AÑOS]","h":"<h3>Aislar el techo <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>Por el techo se va la mayor parte del calor, y en verano entra la mayor parte del calor. Es la mejora que más rinde.<\/p>\n<ol>\n<li><strong>Si hay cielorraso:<\/strong> subir por la boca de inspección y cubrir todo el cielorraso con 10 a 15 cm de aislante, sin dejar huecos, sobre todo en los bordes.<\/li>\n<li><strong>Si no hay:<\/strong> armar uno con tablas, cañas, machimbre o arpillera tensada bajo las vigas, y poner el aislante encima.<\/li>\n<li><strong>Debajo del aislante,<\/strong> del lado de la casa, un nylon de 100 a 200 micrones (barrera de vapor): evita que la humedad del aire de adentro moje el aislante y gotee como si fuera una gotera.<\/li>\n<li><strong>Arriba del aislante,<\/strong> debajo de la chapa, que quede circulando aire.<\/li>\n<\/ol>\n<p><strong>Qué usar como aislante<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Material<\/th>\n<th>Comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lana de oveja lavada<\/td>\n<td>Muy buena, no se prende fuego con facilidad; espolvorear con ceniza o cal contra las polillas<\/td>\n<\/tr>\n<tr>\n<td>Viruta o aserrín con cal (10 partes de viruta por 1 de cal)<\/td>\n<td>Barato; la cal aleja insectos y ratones y retarda el fuego<\/td>\n<\/tr>\n<tr>\n<td>Paja o chala seca<\/td>\n<td>Funciona, pero atrae ratones y arde: lejos de chimeneas, mezclada con barro liviano si se puede<\/td>\n<\/tr>\n<tr>\n<td>Cartón en varias capas<\/td>\n<td>Mejor que nada; se arruina con humedad<\/td>\n<\/tr>\n<tr>\n<td>Telgopor, lana de vidrio<\/td>\n<td>Si se consiguen, son los mejores<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Chimeneas y caños de estufa:<\/strong> dejar 15 cm sin aislante alrededor, con una chapa o ladrillo de separación. Es la causa más común de incendios de techo (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"3\" data-s=\"0\">cap. 4<\/a>).<\/p>\n<p><strong>En verano:<\/strong> pintar la chapa por fuera con cal (lechada de cal con un poco de sal) refleja el sol y baja mucho la temperatura de adentro.<\/p>"},{"t":"Cama abrigada para el invierno [VITAL]","h":"<h3>Cama abrigada para el invierno <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Se pierde más calor hacia el piso que hacia el aire: una buena cama abriga más que una frazada extra.<\/p>\n<ul>\n<li><strong>Elevada:<\/strong> a 40 cm o más del piso, sobre palets, cajones o una tarima de tablas. Nunca directamente sobr
