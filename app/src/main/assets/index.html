n class=\"blank\"><\/span><\/td>\n<td><span class=\"blank\"><\/span><\/td>\n<td><span class=\"blank\"><\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><span class=\"blank\"><\/span><\/td>\n<td><span class=\"blank\"><\/span><\/td>\n<td><span class=\"blank\"><\/span><\/td>\n<td><span class=\"blank\"><\/span><\/td>\n<td><span class=\"blank\"><\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}]},{"id":"CON","title":"Conejos: cría de último recurso","sub":"Cría, sanidad, faena, curtido, conservación","color":"#8a5a2b","kind":"md","c":[{"t":"Antes de empezar: un manual para cuando no queda otra","s":[{"t":"","h":"<p>Esta biblioteca está pensada para una comunidad ovolactovegetariana: huevos, leche, miel, legumbres, granos y huerta. Ese sistema alcanza para vivir sano durante años si hay tierra, agua, animales y semillas (<span class=\"ref\">►<\/span> Nutrición, completo).<\/p>\n<p>Este manual existe para otra situación: <strong>cuando ese sistema falla<\/strong> y la comunidad corre el riesgo de pasar hambre o de quedarse sin proteína y sin vitamina B12. No es una invitación a cambiar de dieta. Es una herramienta guardada en un cajón, como un extintor.<\/p>"},{"t":"Por qué el conejo","h":"<h3>Por qué el conejo<\/h3>\n<ul>\n<li><strong>Rápido:<\/strong> una coneja pare a los 31 días y sus crías se comen a las 10 o 12 semanas. En tres o cuatro meses desde que se arma el plantel ya hay carne.<\/li>\n<li><strong>Come lo que la gente no come:<\/strong> pasto, alfalfa, hojas de frutales, malezas, restos de la huerta. No compite con las personas por el grano.<\/li>\n<li><strong>Chico:<\/strong> se cría en jaulas bajo un techo, en un patio, sin campo. Un conejo se come en una o dos comidas familiares, así que no hace falta heladera para conservar la carne de un animal grande.<\/li>\n<li><strong>Silencioso:<\/strong> no canta ni bala. En tiempos inseguros, no llama la atención.<\/li>\n<li><strong>Abona:<\/strong> su estiércol es de los mejores para la huerta y se puede usar sin compostar.<\/li>\n<li><strong>Rinde:<\/strong> de una coneja bien manejada salen en un año entre 20 y 35 kg de carne limpia.<\/li>\n<\/ul>"},{"t":"Cuándo considerar este manual","h":"<h3>Cuándo considerar este manual<\/h3>\n<p>Son señales de que la dieta ovolactovegetariana <strong>no se está pudiendo sostener<\/strong>, no de que haya que dejarla:<\/p>\n<ol>\n<li>Las legumbres, los huevos y los lácteos juntos no alcanzan para dar a cada persona la proteína diaria (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"2\" data-s=\"0\">Nutrición §2<\/a>) durante varias semanas seguidas.<\/li>\n<li>Se perdieron las gallinas o las cabras (enfermedad, robo, falta de alimento) y no hay forma de reponerlas pronto.<\/li>\n<li>No hay vitamina B12 de suplementos, ni huevos y leche suficientes, y aparecen signos de carencia, sobre todo en embarazadas, bebés y chicos (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"3\" data-s=\"0\">Nutrición §3<\/a>; Manual médico T2 16.6 y 16.13).<\/li>\n<li>Chicos que no crecen o adelgazan a pesar de comer lo que hay (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 2<\/a>).<\/li>\n<\/ol>\n<p>Antes de llegar acá, revisar las alternativas en este orden: racionar y redistribuir mejor (<span class=\"ref\">►<\/span> Manual médico T2 16.11), sembrar legumbres y granos de ciclo corto, aumentar las gallinas (<span class=\"ref\">►<\/span> Manual de gallinas ponedoras), intercambiar con otras comunidades (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"4\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 5<\/a>).<\/p>"},{"t":"Cómo decidirlo en comunidad","h":"<h3>Cómo decidirlo en comunidad<\/h3>\n<ul>\n<li><strong>Lo decide la asamblea,<\/strong> después de mirar la despensa y el estado de salud de todos, no una persona sola (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 4<\/a>).<\/li>\n<li><strong>Se respeta a quien no quiere comer carne<\/strong> ni participar de la faena: nadie está obligado. Lo que se pide es que no se impida a otros comer.<\/li>\n<li><strong>Prioridad para los más vulnerables:<\/strong> si la carne es poca, va primero a embarazadas, mujeres que amamantan, chicos en crecimiento y enfermos.<\/li>\n<li><strong>Se fija cuándo se vuelve atrás:<\/strong> por ejemplo, cuando las gallinas vuelvan a poner lo necesario o la cosecha de legumbres esté guardada.<\/li>\n<li><strong>Responsables con oficio:<\/strong> una o dos personas aprenden bien la cría y la faena, para que se hagan siempre igual, rápido y sin sufrimiento para el animal.<\/li>\n<\/ul>\n<p><span class=\"ref\">►<\/span> <strong>Pesca y caza<\/strong> como otras fuentes de proteína de último recurso: <a class=\"x\" data-b=\"ARM\" data-c=\"4\" data-s=\"0\"><em>Armas, caza y pesca<\/em>, cap. 5<\/a> y 6.<\/p>"},{"t":"Preparar ahora sin criar","h":"<h3>Preparar ahora sin criar<\/h3>\n<p>No hace falta tener conejos hoy para estar listos. Lo que conviene hacer ahora:<\/p>\n<ul>\n<li>Leer este manual completo y guardarlo con la biblioteca.<\/li>\n<li>Saber dónde hay criaderos en la zona (en la Patagonia norte y el Alto Valle hay productores chicos) y conocer a algún cunicultor.<\/li>\n<li>Juntar o comprar materiales para 4 a 6 jaulas: malla de alambre galvanizado, alambre de atar, comederos, bebederos.<\/li>\n<li>Sembrar alfalfa en un rincón: además sirve para las cabras y las gallinas.<\/li>\n<li>Guardar sal fina, alumbre (para curtir pieles) y un buen cuchillo.<\/li>\n<\/ul>\n<div class=\"atencion\">\n<p><strong>Nunca soltar conejos.<\/strong> El conejo silvestre europeo es una de las peores especies invasoras de la Patagonia: se come los pastos y los cultivos y erosiona el suelo. Un conejo que se escapa o se libera puede empezar una población salvaje. Jaulas cerradas, conejeras con malla enterrada, y ningún animal largado \"para que viva libre\".<\/p>\n<\/div>"}]},{"t":"Razas y cómo armar el plantel","s":[{"t":"Qué razas conviene criar","h":"<h3>Qué razas conviene criar<\/h3>\n<table>\n<thead>\n<tr>\n<th>Raza<\/th>\n<th>Peso adulto<\/th>\n<th>Para qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Neozelandés blanco<\/td>\n<td>4 a 5 kg<\/td>\n<td>La más difundida para carne en el país. Buena madre, camadas grandes, crece rápido<\/td>\n<\/tr>\n<tr>\n<td>Californiano<\/td>\n<td>3,5 a 4,5 kg<\/td>\n<td>Blanco con nariz, orejas, patas y cola oscuras. Más compacto, buen rendimiento de carne y come un poco menos<\/td>\n<\/tr>\n<tr>\n<td>Cruza neozelandés × californiano<\/td>\n<td>4 a 4,5 kg<\/td>\n<td>La más recomendada por los criadores: más rústica y más productiva que las razas puras<\/td>\n<\/tr>\n<tr>\n<td>Leonado de Borgoña, Chinchilla, American Blue<\/td>\n<td>3,5 a 5 kg<\/td>\n<td>Buenas razas de carne, de color. Útiles para variar la sangre<\/td>\n<\/tr>\n<tr>\n<td>Conejos \"de campo\" o criollos (cruzas sin raza)<\/td>\n<td>2,5 a 4 kg<\/td>\n<td>Más chicos y más lentos, pero muy resistentes y buenos para criar con pasto<\/td>\n<\/tr>\n<tr>\n<td>Gigante de Flandes y otros gigantes<\/td>\n<td>6 kg o más<\/td>\n<td>Comen mucho y maduran tarde: no convienen<\/td>\n<\/tr>\n<tr>\n<td>Enanos y de mascota<\/td>\n<td>1 a 2 kg<\/td>\n<td>No sirven para carne<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Consejo práctico:<\/strong> empezar con lo que haya en la zona, mejor si viene de un criadero que alimenta con pasto y heno. Un conejo acostumbrado al balanceado sufre el cambio.<\/p>"},{"t":"Elegir reproductores","h":"<h3>Elegir reproductores<\/h3>\n<ul>\n<li><strong>Hembras:<\/strong> de madres que tuvieron camadas grandes y las criaron bien; cuerpo largo, ancho en los cuartos traseros, ocho pezones o más, mansas.<\/li>\n<li><strong>Macho:<\/strong> activo, de buen tamaño, de otra línea que las hembras (que no sean hermanos ni primos).<\/li>\n<li><strong>Revisar siempre:<\/strong> ojos limpios, nariz seca (sin mocos en las patas delanteras, que es donde se limpian), orejas sin costras, dientes que cierran bien, patas sin llagas, cola limpia sin diarrea. Un animal con mocos no se compra aunque lo regalen: contagia a todo el plantel (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"6\" data-s=\"0\">cap. 7<\/a>).<\/li>\n<\/ul>"},{"t":"Cuántos animales para una familia","h":"<h3>Cuántos animales para una familia<\/h3>\n<table>\n<thead>\n<tr>\n<th>Si se quiere<\/th>\n<th>Plantel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Un conejo por semana (1 a 1,4 kg de carne limpia) para una familia de 4<\/td>\n<td>1 macho y 3 hembras<\/td>\n<\/tr>\n<tr>\n<td>Un conejo cada dos semanas<\/td>\n<td>1 macho y 2 hembras<\/td>\n<\/tr>\n<tr>\n<td>Para una comunidad de 30 personas, unos 200 g de carne por persona por semana<\/td>\n<td>2 machos y 10 a 12 hembras<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Un macho alcanza para 8 a 10 hembras, pero conviene tener siempre <strong>dos<\/strong>: si se enferma o muere el único, la producción se corta.<\/p>"},{"t":"Si no se consiguen conejos domésticos","h":"<h3>Si no se consiguen conejos domésticos<\/h3>\n<p>En Río Negro, Neuquén y Mendoza el conejo silvestre europeo y la liebre europea son especies exóticas y su caza está permitida por las autoridades de fauna (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"10\" data-s=\"0\">cap. 11<\/a>). Se pueden cazar para comer, pero <strong>no conviene criarlos en jaulas<\/strong>: son nerviosos, no se reproducen bien encerrados y escapan. Los conejos domésticos y los silvestres son la misma especie y se pueden cruzar, pero sus crías heredan el carácter salvaje.<\/p>"}]},{"t":"La conejera: jaulas, nidos y techo","s":[{"t":"El lugar","h":"<h3>El lugar<\/h3>\n<ul>\n<li><strong>Bajo techo, a la sombra y con aire:<\/strong> el calor es lo que más conejos mata. Un galpón abierto de los costados, una galería o un tinglado bajo árboles. En el Alto Valle, con veranos de más de 35 °C, la sombra es obligatoria.<\/li>\n<li><strong>Protegido del viento, la lluvia y los depredadores:<\/strong> perros, gatos, zorros, hurones, ratas y aves de rapiña. De noche, los perros sueltos son el mayor peligro: pueden matar a los conejos dentro de la jaula de miedo.<\/li>\n<li><strong>Lejos de la casa pero a la vista:<\/strong> el olor a orina se nota y atrae moscas en verano.<\/li>\n<li><strong>Cerca del agua y de la huerta:<\/strong> el estiércol se usa todos los días.<\/li>\n<\/ul>"},{"t":"Jaulas colgantes de alambre","h":"<h3>Jaulas colgantes de alambre<\/h3>\n<p>Son las más higiénicas: el estiércol y la orina caen al piso y los conejos no los pisan. Así se evitan la diarrea y la coccidiosis, que son las enfermedades que más bajas causan.<\/p>\n<table>\n<thead>\n<tr>\n<th>Jaula<\/th>\n<th>Largo × ancho × alto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hembra con nido y crías<\/td>\n<td>80 a 90 × 60 a 70 × 40 a 45 cm<\/td>\n<\/tr>\n<tr>\n<td>Macho<\/td>\n<td>60 a 70 × 50 a 60 × 40 a 45 cm<\/td>\n<\/tr>\n<tr>\n<td>Engorde (6 a 8 gazapos después del destete)<\/td>\n<td>80 × 60 × 40 cm<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Malla:<\/strong> alambre galvanizado. Piso de malla de 1,3 × 7,5 cm o de 1,9 × 1,9 cm, de alambre de 2 mm (más fino lastima las patas); paredes y techo con malla más abierta.<\/li>\n<li><strong>Altura:<\/strong> las jaulas colgadas o sobre caballetes a 70 u 80 cm del suelo, para trabajar parado y que el estiércol se junte abajo.<\/li>\n<li><strong>Puerta<\/strong> grande al frente o arriba, con traba que el conejo no pueda abrir.<\/li>\n<li><strong>Reposapatas:<\/strong> una tablita de madera de 20 × 25 cm en el piso de cada jaula de adultos, para descansar las patas del alambre (evita llagas, <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"6\" data-s=\"0\">cap. 7<\/a>).<\/li>\n<li><strong>Debajo:<\/strong> una cama de paja o aserrín que se saca cada semana al compost, o directamente una cama de lombrices (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 1<\/a>, lombricompuesto).<\/li>\n<\/ul>"},{"t":"Conejeras de madera y colonias en el piso","h":"<h3>Conejeras de madera y colonias en el piso<\/h3>\n<p>Si no hay malla, se puede criar en conejeras de madera con piso de listones separados 1,5 cm, o en un corral de piso con cama de paja.<\/p>\n<ul>\n<li><strong>La madera la roen:<\/strong> forrar los bordes con chapa.<\/li>\n<li><strong>En el piso:<\/strong> cemento o ladrillo, nunca tierra (los conejos cavan y escapan, y la tierra húmeda acumula parásitos). Cama de paja seca que se cambia seguido.<\/li>\n<li><strong>Colonias:<\/strong> varias hembras juntas en un corral grande se pelean, se matan las crías entre ellas y contagian enfermedades más rápido. Funcionan solo para los gazapos de engorde. Las hembras de cría y los machos van siempre en jaulas individuales.<\/li>\n<\/ul>"},{"t":"El nido","h":"<h3>El nido<\/h3>\n<ul>\n<li>Un cajón de madera de 30 × 40 cm y 30 cm de alto, con un borde de 10 a 15 cm al frente para que los gazapos no salgan antes de tiempo, y un piso con agujeros chicos para que no se junte orina.<\/li>\n<li>Se pone en la jaula de la hembra <strong>a los 27 o 28 días de la monta<\/strong>, lleno de paja seca o viruta limpia. La hembra lo arregla y lo forra con pelo que se arranca del pecho y la panza poco antes de parir.<\/li>\n<li>En invierno, nido más profundo, con más paja y protegido del viento.<\/li>\n<\/ul>"},{"t":"Comederos y bebederos","h":"<h3>Comederos y bebederos<\/h3>\n<ul>\n<li><strong>Heno y pasto:<\/strong> en un pesebre de malla o una rejilla sobre la jaula, nunca en el piso (se pisa y se ensucia).<\/li>\n<li><strong>Grano y restos:<\/strong> comederos de lata o barro pesados, que no se puedan dar vuelta, o tolvas de chapa por fuera de la jaula.<\/li>\n<li><strong>Agua:<\/strong> bebedero de chupete con un bidón, o un recipiente de barro pesado y bajo. Lavarlos cada día: el agua sucia es causa de diarrea.<\/li>\n<\/ul>"},{"t":"Frío y calor","h":"<h3>Frío y calor<\/h3>\n<ul>\n<li><strong>Frío:<\/strong> el conejo adulto aguanta bien el frío seco si tiene reparo del viento y cama seca. Los gazapos en el nido necesitan mucho pelo y paja.<\/li>\n<li><strong>Calor:<\/strong> por arriba de 28 a 30 °C sufren; a más de 33 °C pueden morir en horas, sobre todo las hembras preñadas y los machos grandes. Ver <em>Golpe de calor<\/em> (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"6\" data-s=\"0\">cap. 7<\/a>).<\/li>\n<li><strong>Techo aislado<\/strong> (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"2\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 3<\/a>) y paredes que se puedan abrir en verano y cerrar en invierno.<\/li>\n<\/ul>"}]},{"t":"Alimentación sin balanceado","s":[{"t":"Cómo come un conejo","h":"<h3>Cómo come un conejo<\/h3>\n<p>El conejo es herbívoro: su aparato digestivo funciona con mucha fibra (pasto, heno, hojas). Los granos y el pan en exceso le provocan diarrea y muerte. Además, de noche come una parte de su propio excremento blando (cecotrofos), que es como volver a digerir: es normal y necesario, no hay que impedirlo.<\/p>\n<p><strong>Las tres reglas<\/strong><\/p>\n<ol>\n<li><strong>Heno o pasto seco siempre a disposición.<\/strong> Es la base de la dieta.<\/li>\n<li><strong>Agua limpia siempre.<\/strong> Un conejo sin agua deja de comer.<\/li>\n<li><strong>Cualquier cambio de comida, de a poco,<\/strong> a lo largo de una semana.<\/li>\n<\/ol>"},{"t":"Qué darle","h":"<h3>Qué darle<\/h3>\n<table>\n<thead>\n<tr>\n<th>Alimento<\/th>\n<th>Cómo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Heno de alfalfa, trébol o pasto<\/td>\n<td>Siempre disponible. Es lo principal<\/td>\n<\/tr>\n<tr>\n<td>Pasto fresco y alfalfa verde<\/td>\n<td>Oreados unas horas al sol (sin rocío), nunca recalentados en una pila<\/td>\n<\/tr>\n<tr>\n<td>Malezas de la huerta y del campo<\/td>\n<td>Diente de león, cerraja, llantén, trébol, ortiga oreada, verdolaga, achicoria, gramilla, malva<\/td>\n<\/tr>\n<tr>\n<td>Hojas y ramas de frutales y árboles<\/td>\n<td>Manzano, peral, membrillo, vid, morera, sauce, álamo. Las ramas además les gastan los dientes<\/td>\n<\/tr>\n<tr>\n<td>Restos de huerta<\/td>\n<td>Hojas de zanahoria, remolacha, acelga, repollo, coliflor y brócoli (poco de a vez), cáscaras de zapallo, zanahoria<\/td>\n<\/tr>\n<tr>\n<td>Granos<\/td>\n<td>Avena, cebada o maíz partido: un puñado por día para hembras con cría y gazapos en engorde<\/td>\n<\/tr>\n<tr>\n<td>Pan duro<\/td>\n<td>Poco y seco, como premio<\/td>\n<\/tr>\n<tr>\n<td>Sal<\/td>\n<td>Un trozo de piedra de sal a disposición o una pizca de sal fina en el grano<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Qué no darle nunca","h":"<h3>Qué no darle nunca<\/h3>\n<ul>\n<li><strong>Laurel rosa (adelfa), tejo, ligustro, ricino, cicuta, palta (hojas y fruta), hojas de tomate y de papa, papa verde o con brotes, ruibarbo, hojas de cebolla y de ajo en cantidad.<\/strong> Más plantas tóxicas: <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"7\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 8<\/a>.<\/li>\n<li>Pasto o alfalfa mojados, fermentados o recalentados en una pila, que provocan hinchazón.<\/li>\n<li>Comida con moho.<\/li>\n<li>Restos de comida de personas con grasa, sal, condimentos o azúcar.<\/li>\n<li>Plantas de ornamentales que no se conocen, y cualquier planta fumigada.<\/li>\n<\/ul>"},{"t":"Cuánto come","h":"<h3>Cuánto come<\/h3>\n<table>\n<thead>\n<tr>\n<th>Animal<\/th>\n<th>Por día, aproximadamente<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Adulto en mantenimiento (macho, hembra vacía)<\/td>\n<td>Heno a voluntad y 300 a 500 g de verde, o 1 kg de verde solo; un puñado chico de grano<\/td>\n<\/tr>\n<tr>\n<td>Hembra preñada<\/td>\n<td>Lo mismo, con un poco más de grano en la última semana<\/td>\n<\/tr>\n<tr>\n<td>Hembra con cría<\/td>\n<td><strong>Todo lo que quiera<\/strong> de heno y verde, y 100 a 150 g de grano<\/td>\n<\/tr>\n<tr>\n<td>Gazapo de engorde (6 a 12 semanas)<\/td>\n<td>Heno y verde a voluntad, y 30 a 60 g de grano<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Agua:<\/strong> un adulto toma de un tercio a medio litro por día; una hembra con cría, más de un litro en verano.<\/p>\n<p><strong>Si la hembra con cría pierde peso,<\/strong> falta comida: más heno de alfalfa y grano. Si los gazapos tienen la panza muy hinchada o diarrea, sobra grano o verde: dejar solo heno por dos días.<\/p>"},{"t":"Cuánta tierra hace falta para alimentarlos","h":"<h3>Cuánta tierra hace falta para alimentarlos<\/h3>\n<ul>\n<li>Una coneja con todas sus crías del año come el forraje de unos <strong>200 a 300 m² de alfalfa regada<\/strong>, o el de un terreno bastante más grande de pasto natural y malezas.<\/li>\n<li>Hacer heno en primavera y verano para el invierno: cortar la alfalfa en floración, orear 2 o 3 días dándola vuelta, y guardar bajo techo cuando cruje pero las hojas no se caen.<\/li>\n<li>Las gallinas comen lo que los conejos dejan en el piso, y los conejos la mitad de lo que la huerta descarta: los tres sistemas juntos aprovechan casi todo.<\/li>\n<\/ul>"}]},{"t":"Reproducción y crianza de los gazapos","s":[{"t":"Ciclo en números","h":"<h3>Ciclo en números<\/h3>\n<table>\n<thead>\n<tr>\n<th>Dato<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primera monta, hembra<\/td>\n<td>4½ a 5 meses (cuando pesa el 75 % del peso adulto)<\/td>\n<\/tr>\n<tr>\n<td>Primer servicio, macho<\/td>\n<td>5 a 6 meses<\/td>\n<\/tr>\n<tr>\n<td>Celo<\/td>\n<td>La coneja no tiene ciclo como otras hembras: ovula cuando la monta el macho, en cualquier época<\/td>\n<\/tr>\n<tr>\n<td>Gestación<\/td>\n<td>30 a 32 días (31 en promedio)<\/td>\n<\/tr>\n<tr>\n<td>Gazapos por parto<\/td>\n<td>6 a 10 (en razas de carne, 8 de promedio)<\/td>\n<\/tr>\n<tr>\n<td>Ojos abiertos<\/td>\n<td>10 a 12 días<\/td>\n<\/tr>\n<tr>\n<td>Salen del nido<\/td>\n<td>18 a 21 días<\/td>\n<\/tr>\n<tr>\n<td>Destete<\/td>\n<td>4 a 6 semanas<\/td>\n<\/tr>\n<tr>\n<td>Partos por año<\/td>\n<td>4 a 6 con alimentación a pasto y heno; más es agotador para la hembra<\/td>\n<\/tr>\n<tr>\n<td>Vida útil de una coneja<\/td>\n<td>2 a 3 años de cría<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"La monta","h":"<h3>La monta<\/h3>\n<ol>\n<li><strong>Llevar siempre la hembra a la jaula del macho,<\/strong> nunca al revés: la hembra defiende su jaula y puede atacarlo.<\/li>\n<li>Si está receptiva, levanta la cola y la monta ocurre en minutos. El macho cae de costado después de servir.<\/li>\n<li>Si a los 5 minutos no hay monta, o la hembra se defiende, volver a intentar al día siguiente.<\/li>\n<li>Llevarla de vuelta a su jaula. Algunos criadores hacen una segunda monta a las 6 horas.<\/li>\n<li><strong>Anotar la fecha<\/strong> en la ficha de la hembra (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"11\" data-s=\"0\">cap. 12<\/a>).<\/li>\n<li><strong>Un macho, no más de 3 o 4 montas por semana,<\/strong> y no más de una por día.<\/li>\n<\/ol>\n<p><strong>En verano<\/strong> el calor deja a los machos sin fertilidad por semanas: hacer las montas temprano a la mañana y no programar partos en enero y febrero.<\/p>"},{"t":"Saber si está preñada","h":"<h3>Saber si está preñada<\/h3>\n<p><strong>Palpación, a los 10 a 14 días de la monta:<\/strong> con la hembra tranquila sobre una mesa, la mano izquierda en las orejas y el lomo, la derecha suave bajo la panza, entre las patas traseras. Se sienten unas bolitas como de uva, alineadas, que se deslizan entre los dedos. Sin apretar. Es una técnica que se aprende viéndola hacer: un error puede hacer abortar. Si no se siente nada, volver a servirla.<\/p>"},{"t":"El parto","h":"<h3>El parto<\/h3>\n<ul>\n<li><strong>A los 27 o 28 días<\/strong> poner el nido.<\/li>\n<li>La coneja suele parir de noche o temprano a la mañana, sola, en 15 a 30 minutos. <strong>No molestarla.<\/strong><\/li>\n<li><strong>Al día siguiente,<\/strong> cuando la madre come, revisar el nido con la mano frotada antes en la paja de la jaula: sacar gazapos muertos, placentas y paja manchada. Contar los vivos.<\/li>\n<li>Si la madre parió fuera del nido o sobre el alambre, juntar los gazapos enseguida, entibiarlos con las manos y ponerlos en el nido con pelo de la madre.<\/li>\n<\/ul>"},{"t":"La lactancia","h":"<h3>La lactancia<\/h3>\n<ul>\n<li><strong>La coneja amamanta una o dos veces por día,<\/strong> solo unos minutos, y muchas veces de noche. Es normal que no se la vea con las crías.<\/li>\n<li><strong>Gazapos bien alimentados:<\/strong> panza redonda y piel tirante, duermen juntos y quietos. <strong>Mal alimentados:<\/strong> piel arrugada, chillan, se mueven mucho.<\/li>\n<li><strong>Si la camada es muy grande<\/strong> (más de 8 o 9) o la madre tiene poca leche, pasar los gazapos que sobran a otra coneja que haya parido el mismo día o uno antes, con pocas crías. Frotarlos con la paja del nido nuevo.<\/li>\n<li><strong>Gazapos huérfanos:<\/strong> muy difíciles de criar a mano. Si no hay otra madre, leche de cabra entera con un poco de crema, tibia, con gotero, dos veces por día. Sobrevive una parte.<\/li>\n<li><strong>Coneja que mata o abandona las crías:<\/strong> suele ser por miedo (perros, ruidos de noche, ratas), falta de agua o de comida, o primeriza. Darle otra oportunidad; si se repite dos veces, no se usa más para cría.<\/li>\n<\/ul>"},{"t":"Destete y nueva monta","h":"<h3>Destete y nueva monta<\/h3>\n<ul>\n<li><strong>Destete a las 5 o 6 semanas,<\/strong> cuando los gazapos comen bien solos. Se saca a la madre y se deja a los gazapos unos días en la jaula conocida.<\/li>\n<li>Pasar a jaulas de engorde, sin cambiar la comida de golpe: es el momento de mayor riesgo de diarrea.<\/li>\n<li><strong>Nueva monta:<\/strong> con alimentación a pasto y heno, conviene volver a servir a la coneja <strong>de 2 a 4 semanas después del parto<\/strong>. Los criaderos con balanceado lo hacen a los 10 días, pero sin balanceado eso agota a las hembras.<\/li>\n<\/ul>"},{"t":"Evitar la consanguinidad","h":"<h3>Evitar la consanguinidad<\/h3>\n<ul>\n<li>Los hijos y nietos de un mismo macho no se cruzan con él.<\/li>\n<li><strong>Cambiar el macho cada 1 o 2 años,<\/strong> con uno traído de otra comunidad o criadero, o intercambiar machos con otra comunidad.<\/li>\n<li>Con dos o tres líneas de hembras (familias) y rotando el macho entre ellas, un plantel chico se sostiene años.<\/li>\n<li><strong>Señales de consanguinidad:<\/strong> camadas cada vez más chicas, gazapos débiles, dientes que no cierran, malformaciones. Ahí hay que traer sangre nueva.<\/li>\n<\/ul>"},{"t":"Reponer las hembras","h":"<h3>Reponer las hembras<\/h3>\n<p>Elegir las hembras de reposición de las mejores madres (camadas grandes, buenos destetes, mansas), a las 10 a 12 semanas, en lugar de comerlas. Renovar un tercio de las hembras cada año.<\/p>"}]},{"t":"Engorde y cuánta carne se obtiene","s":[{"t":"Engorde","h":"<h3>Engorde<\/h3>\n<ul>\n<li>Los gazapos destetados van en grupos de 6 a 8 por jaula, con heno, verde y un poco de grano.<\/li>\n<li><strong>Edad de faena: 10 a 14 semanas,<\/strong> con 2 a 2,5 kg de peso vivo en razas de carne. Con pasto solo crecen más despacio: pueden necesitar 14 a 16 semanas.<\/li>\n<li>Separar machos y hembras a partir de las 10 semanas: los machos se pelean y empiezan a montar.<\/li>\n<li>Pasada la edad de faena, el conejo sigue comiendo mucho y engorda poco: no conviene esperar.<\/li>\n<\/ul>"},{"t":"Rendimiento","h":"<h3>Rendimiento<\/h3>\n<table>\n<thead>\n<tr>\n<th>Paso<\/th>\n<th>Cuánto queda<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Conejo vivo de 2,3 kg<\/td>\n<td>100 %<\/td>\n<\/tr>\n<tr>\n<td>Carcasa limpia, sin cuero, cabeza, patas ni vísceras<\/td>\n<td>1,2 a 1,3 kg (55 a 58 %)<\/td>\n<\/tr>\n<tr>\n<td>Hígado, corazón y riñones<\/td>\n<td>100 a 120 g<\/td>\n<\/tr>\n<tr>\n<td>Cuero con pelo<\/td>\n<td>250 a 350 g<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por coneja y por año:<\/strong> con pasto y heno, alrededor de 25 a 30 gazapos destetados; vendidos o comidos a 1,2 kg de carne cada uno, unos <strong>30 kg de carne limpia<\/strong>.<\/p>\n<p><strong>Cálculo para el plantel:<\/strong> comidas de conejo por semana × 52 ÷ 25 = cantidad de hembras. Sumar un macho cada 8 hembras y uno de repuesto.<\/p>"}]},{"t":"Sanidad","s":[{"t":"Prevenir vale más que curar","h":"<h3>Prevenir vale más que curar<\/h3>\n<p>En una situación de colapso no hay veterinario ni antibióticos para los conejos. La sanidad se basa en:<\/p>\n<ol>\n<li><strong>Higiene:<\/strong> jaulas de piso de alambre, estiércol retirado, comederos y bebederos limpios todos los días.<\/li>\n<li><strong>Ventilación sin corrientes:<\/strong> aire que se renueva, sin olor a amoníaco (si pica en los ojos, falta ventilación o limpieza).<\/li>\n<li><strong>Comida y agua sanas,<\/strong> cambios de comida de a poco.<\/li>\n<li><strong>Cuarentena:<\/strong> todo animal nuevo pasa 3 semanas en una jaula aparte, lejos del plantel.<\/li>\n<li><strong>Mirar todos los días<\/strong> a cada animal: si come, cómo están el excremento, los ojos, la nariz, las orejas y las patas.<\/li>\n<li><strong>Eliminar a tiempo:<\/strong> un conejo con mocos crónicos, sarna que no cura o diarrea que no para contagia a todos. Es mejor sacrificarlo (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"7\" data-s=\"0\">cap. 8<\/a>) que perder el plantel.<\/li>\n<li><strong>Desinfectar las jaulas vacías:<\/strong> quemar el pelo con un soplete o una llama de antorcha de papel, lavar con agua con lavandina (1 vaso de lavandina común en un balde de 10 litros) y dejar al sol.<\/li>\n<\/ol>"},{"t":"Problemas más comunes","h":"<h3>Problemas más comunes<\/h3>\n<table>\n<thead>\n<tr>\n<th>Problema<\/th>\n<th>Señales<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Diarrea (enteritis)<\/strong><\/td>\n<td>Excremento pastoso o líquido, cola sucia, panza hinchada, sobre todo en gazapos al destete<\/td>\n<td>Sacar grano y verde, dejar solo heno y agua limpia. Separar al enfermo. Muchos mueren: prevenir con destete tranquilo y cambios de comida lentos<\/td>\n<\/tr>\n<tr>\n<td><strong>Coccidiosis<\/strong><\/td>\n<td>Diarrea, adelgazamiento, panza grande; al faenar, manchas blancas en el hígado<\/td>\n<td>Higiene estricta y piso de alambre. Si se consiguen, sulfamidas o toltrazurilo en el agua según indicación veterinaria. Descartar los hígados con manchas<\/td>\n<\/tr>\n<tr>\n<td><strong>Hinchazón (timpanismo)<\/strong><\/td>\n<td>Panza dura como tambor, no come, quieto<\/td>\n<td>Ayuno de grano, heno seco, movimiento suave. Suele venir de pasto mojado o fermentado<\/td>\n<\/tr>\n<tr>\n<td><strong>Pasteurelosis (resfrío, \"romadizo\")<\/strong><\/td>\n<td>Estornudos, mocos blancos, patas delanteras sucias de limpiarse la nariz, ojos con lagaña. A veces abscesos, otitis (cabeza torcida) o neumonía<\/td>\n<td>Aislar enseguida. Si se consigue, antibiótico indicado por un veterinario. Los crónicos se sacrifican: contagian toda la vida<\/td>\n<\/tr>\n<tr>\n<td><strong>Sarna de las orejas<\/strong><\/td>\n<td>Costras marrones dentro de la oreja, se rasca y sacude la cabeza<\/td>\n<td>Ablandar las costras con aceite vegetal tibio cada 2 o 3 días durante 3 semanas (asfixia a los ácaros), sin arrancarlas. Si se consigue, ivermectina por un veterinario. Desinfectar la jaula<\/td>\n<\/tr>\n<tr>\n<td><strong>Sarna del cuerpo y tiña (hongos)<\/strong><\/td>\n<td>Calvas redondas con costra, en la cara, las patas o el cuerpo<\/td>\n<td>Aislar, cortar el pelo alrededor, lavar con jabón y aplicar yodo o vinagre. <strong>La tiña se pasa a las personas:<\/strong> guantes y lavado de manos<\/td>\n<\/tr>\n<tr>\n<td><strong>Llagas en las patas (mal de patas)<\/strong><\/td>\n<td>Costras o úlceras bajo las patas traseras<\/td>\n<td>Reposapatas de madera, piso seco, limpiar con agua y jabón y yodo. Las razas grandes y pesadas sufren más<\/td>\n<\/tr>\n<tr>\n<td><strong>Mastitis<\/strong><\/td>\n<td>Mama caliente, roja o azulada, la hembra no deja mamar, fiebre<\/td>\n<td>Pasar los gazapos a otra madre. Compresas tibias. Si se consigue, antibiótico. Si se repite, retirar la hembra<\/td>\n<\/tr>\n<tr>\n<td><strong>Dientes que crecen torcidos<\/strong><\/td>\n<td>No puede comer, babea, adelgaza; dientes largos que no cierran<\/td>\n<td>Es hereditario: no usar ese animal para cría. Se pueden recortar con un alicate de corte, pero vuelven a crecer<\/td>\n<\/tr>\n<tr>\n<td><strong>Golpe de calor<\/strong><\/td>\n<td>Respira con la boca abierta, orejas muy calientes, tirado de costado, convulsiones<\/td>\n<td>Pasarlo enseguida a la sombra, mojar las orejas y las patas con agua fresca (no helada), darle agua. Ver cómo prevenirlo, abajo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Mixomatosis","h":"<h3>Mixomatosis<\/h3>\n<ul>\n<li><strong>Qué es:<\/strong> una enfermedad por virus, presente en Argentina, que transmiten los mosquitos, las pulgas y los tábanos. Mata a casi todos los conejos que enferman.<\/li>\n<li><strong>Señales:<\/strong> párpados hinchados con pus, bultos en la cara, las orejas y los genitales, fiebre. Muerte en una o dos semanas.<\/li>\n<li><strong>No tiene cura.<\/strong> Los enfermos se sacrifican enseguida y se entierran hondo o se queman; no se comen ni se curten.<\/li>\n<li><strong>Prevenir:<\/strong> <strong>vacuna<\/strong> (existe en el país; se aplica antes de la temporada de mosquitos, en septiembre u octubre, y se refuerza según el laboratorio). Mientras haya veterinarias, vacunar el plantel. Sin vacuna: tela mosquitera en la conejera durante la temporada de mosquitos, nada de agua estancada cerca, controlar pulgas, y evitar contacto con conejos y liebres silvestres.<\/li>\n<li><strong>No pasa a las personas<\/strong> ni a otros animales.<\/li>\n<\/ul>"},{"t":"Enfermedad hemorrágica viral","h":"<h3>Enfermedad hemorrágica viral<\/h3>\n<p>Es una enfermedad del conejo que mata a casi todo un plantel en dos o tres días, con muerte repentina y a veces sangre por la nariz. Argentina se declaraba libre de esta enfermedad, pero hubo brotes en Uruguay y en otros países de América. Si los conejos empiezan a morir de golpe, sin síntomas, varios por día: aislar la conejera, no mover animales a otros lugares, enterrar o quemar los muertos y avisar a las comunidades vecinas. Hay vacuna, pero hoy no se usa en el país. No pasa a las personas.<\/p>"},{"t":"Golpe de calor: prevenirlo","h":"<h3>Golpe de calor: prevenirlo<\/h3>\n<ul>\n<li>Conejera a la sombra, techo aislado o pintado con cal, paredes laterales abiertas en verano.<\/li>\n<li>Agua fresca siempre, cambiada dos veces por día.<\/li>\n<li>Mojar el techo y el piso de la conejera en las horas de más calor.<\/li>\n<li>Botellas de agua envueltas en arpillera mojada dentro de las jaulas: el conejo se recuesta contra ellas.<\/li>\n<li>Sin manipular ni trasladar conejos en las horas de calor; nada de montas ni faenas a la siesta.<\/li>\n<\/ul>"},{"t":"Enfermedades que pasan a las personas","h":"<h3>Enfermedades que pasan a las personas<\/h3>\n<ul>\n<li><strong>Tiña:<\/strong> manchas redondas con picazón en la piel de quien cuida a los conejos <span class=\"ref\">►<\/span> Manual médico T1 bloque 4.<\/li>\n<li><strong>Mordeduras y arañazos:<\/strong> pueden infectarse (pasteurela). Lavar bien con agua y jabón <span class=\"ref\">►<\/span> Manual médico T1 bloque 4.<\/li>\n<li><strong>Animales de caza:<\/strong> no tocar ni comer conejos o liebres silvestres que se ven enfermos, se dejan agarrar o aparecen muertos; manipular con guantes y cocinar siempre la carne completamente (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"10\" data-s=\"0\">cap. 11<\/a>).<\/li>\n<li><strong>Perros:<\/strong> nunca darles vísceras crudas de conejo: transmiten parásitos al perro, y el perro los pasa a otros animales y a las personas (<span class=\"ref\">►<\/span> Manual médico T1 bloque 4).<\/li>\n<\/ul>"}]},{"t":"Faena sin sufrimiento","s":[{"t":"","h":"<div class=\"atencion\">\n<p>Esta tarea la hacen personas entrenadas, con calma y siempre igual. El objetivo es que el animal <strong>no se dé cuenta<\/strong> de nada: un instante y pierde el conocimiento. Hacerlo mal es cruel y peligroso. Practicar primero viendo a alguien que sabe.<\/p>\n<\/div>"},{"t":"Preparación","h":"<h3>Preparación<\/h3>\n<ul>\n<li><strong>Ayuno:<\/strong> 12 horas sin comida antes de la faena, con agua. El intestino vacío se rompe menos y la carne sale más limpia.<\/li>\n<li><strong>Lugar:<\/strong> fuera de la vista y del oído de los demás conejos, de los chicos que no quieran verlo y de quien no quiera participar. Limpio, con agua, a la sombra y lejos de moscas.<\/li>\n<li><strong>Herramientas:<\/strong> un palo corto y pesado o un caño de 30 cm, un cuchillo muy afilado, un gancho o soga para colgar, baldes, agua con un poco de lavandina para las manos y la mesa, una tabla.<\/li>\n<li>Elegir animales sanos. Los enfermos se sacrifican, pero no se comen.<\/li>\n<\/ul>"},{"t":"Aturdir y matar","h":"<h3>Aturdir y matar<\/h3>\n<ol>\n<li><strong>Calma:<\/strong> tomar al conejo con firmeza y suavidad, sin perseguirlo ni levantarlo de las orejas. Hablar bajo.<\/li>\n<li><strong>Aturdimiento con golpe en la nuca:<\/strong> sostenerlo de las patas traseras, colgando, o apoyado en la mesa, y dar <strong>un golpe seco y fuerte<\/strong> con el palo en la nuca, justo detrás de las orejas. Pierde el conocimiento en el acto.<\/li>\n<li><strong>Alternativa, la dislocación del cuello:<\/strong> con una mano tomar las patas traseras y con la otra la cabeza, el pulgar detrás de las orejas; estirar con fuerza y de un tirón, llevando la cabeza hacia atrás. Requiere fuerza y práctica: en conejos grandes, mejor el golpe.<\/li>\n<li><strong>Desangrar enseguida,<\/strong> dentro del minuto: colgar de una pata trasera y cortar el cuello de lado a lado, o cortar la cabeza. Dejar escurrir la sangre en un balde (sirve como abono, <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"8\" data-s=\"0\">cap. 9<\/a>). Los movimientos de las patas después del golpe son reflejos: el animal ya no siente.<\/li>\n<\/ol>"},{"t":"Sacar el cuero","h":"<h3>Sacar el cuero<\/h3>\n<ol>\n<li>Colgarlo de las dos patas traseras, abiertas, de ganchos o atadas.<\/li>\n<li>Cortar el cuero en círculo alrededor de cada pata trasera, por encima del tobillo, y por la cara interna de los muslos hasta la cola.<\/li>\n<li>Cortar alrededor de la cola y del ano.<\/li>\n<li>Tirar del cuero hacia abajo, dándolo vuelta como una media. Sale con facilidad.<\/li>\n<li>Cortar las patas delanteras a la altura de la muñeca y la cabeza, si no se cortó antes. El cuero sale entero, del revés: es la forma ideal para curtirlo (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"8\" data-s=\"0\">cap. 9<\/a>).<\/li>\n<\/ol>"},{"t":"Sacar las vísceras","h":"<h3>Sacar las vísceras<\/h3>\n<ol>\n<li>Con la punta del cuchillo, un corte corto en la panza bajo la pelvis, con dos dedos debajo del filo levantando la piel para <strong>no pinchar los intestinos ni la vejiga.<\/strong><\/li>\n<li>Abrir hacia abajo hasta el pecho.<\/li>\n<li>Cortar alrededor del ano y separar el recto sin romperlo; sacar la vejiga entera, sin derramar orina.<\/li>\n<li>Sacar estómago e intestinos juntos, tirando hacia abajo.<\/li>\n<li>Separar el <strong>hígado<\/strong> y sacar con cuidado la <strong>vesícula<\/strong> (la bolsita verde): si se rompe, amarga la carne. Separar corazón, pulmones y riñones.<\/li>\n<li><strong>Revisar el hígado:<\/strong> liso, rojo oscuro y parejo = sano. <strong>Con manchas blancas o amarillas, quistes o puntos = se tira<\/strong> (coccidiosis o parásitos) y se revisa el resto de los animales.<\/li>\n<li>Revisar también la panza: quistes como globitos de agua en el intestino o la grasa → descartar esas vísceras y <strong>no dárselas al perro<\/strong>.<\/li>\n<li>Lavar la carcasa con agua limpia y fría.<\/li>\n<\/ol>"},{"t":"Orear y enfriar","h":"<h3>Orear y enfriar<\/h3>\n<ul>\n<li>Colgar la carcasa en un lugar fresco, seco y protegido de moscas (una bolsa de tela de algodón o tul alrededor) <strong>de 6 a 12 horas<\/strong> antes de cocinarla o conservarla. La carne recién faenada queda dura; oreada, se ablanda.<\/li>\n<li>Sin heladera: faenar al atardecer o temprano a la mañana, en invierno o en días frescos, y cocinar o conservar en las 24 horas (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"9\" data-s=\"0\">cap. 10<\/a>).<\/li>\n<li><strong>Higiene:<\/strong> lavar manos, cuchillo, tabla y baldes con agua y jabón, y después con agua con lavandina. Enterrar o compostar lo que no se usa.<\/li>\n<\/ul>"},{"t":"Hablarlo con los chicos","h":"<h3>Hablarlo con los chicos<\/h3>\n<p>En una familia que comió siempre sin carne, la primera faena puede ser difícil para todos, sobre todo para los chicos que vieron nacer a los gazapos. Conviene:<\/p>\n<ul>\n<li>Explicarles antes, con palabras simples y sin mentir, por qué se hace y que el animal no sufre.<\/li>\n<li>No obligar a ningún chico a mirar ni a participar.<\/li>\n<li>No poner nombre a los gazapos de engorde: los nombres quedan para los reproductores.<\/li>\n<li>Darles un lugar en el cuidado de los conejos que no se comen (madres y machos).<\/li>\n<li>Estar atentos a miedos o tristeza en los días siguientes <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"1\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 2<\/a>, <em>Miedo, estrés y duelo<\/em>.<\/li>\n<\/ul>"}]},{"t":"Aprovechar todo el animal","s":[{"t":"Carne y vísceras","h":"<h3>Carne y vísceras<\/h3>\n<ul>\n<li><strong>Carne:<\/strong> magra, tierna, de sabor suave. Se cocina como el pollo.<\/li>\n<li><strong>Hígado, corazón y riñones<\/strong> (sanos): fritos, en guiso o en paté. El hígado es de los alimentos con más hierro y vitamina B12.<\/li>\n<li><strong>Cabeza, huesos y carcasa:<\/strong> caldo (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CON\" data-c=\"9\" data-s=\"0\">cap. 10<\/a>).<\/li>\n<li><strong>Grasa:<\/strong> el conejo tiene muy poca; la que hay alrededor de los riñones se derrite y se usa para cocinar.<\/li>\n<\/ul>"},{"t":"Curtir la piel con pelo","h":"<h3>Curtir la piel con pelo<\/h3>\n<p>La piel de conejo es fina y delicada, pero da abrigo: forro de guantes, gorros, chalecos, botas y bolsas de dormir, mantas para bebés cosidas de a varias. <strong>Las pieles de invierno<\/strong> tienen el pelo más denso y se sueltan menos.<\/p>\n<p><strong>Conservar la piel cruda hasta curtir:<\/strong> estirarla del revés sobre una tabla en forma de U o un alambre doblado, raspar la grasa y la carne, y dejarla secar a la sombra con aire. Seca, dura meses en un lugar seco, protegida de polillas y ratones. También se puede salar: frotar el lado de la carne con sal fina y dejar escurrir.<\/p>\n<p><strong>Curtido con alumbre y sal (el más simple)<\/strong><\/p>\n<ol>\n<li><strong>Remojar<\/strong> la piel seca en agua fresca hasta que se ablande (unas horas).<\/li>\n<li><strong>Descarnar:<\/strong> raspar del lado de adentro con el lomo de un cuchillo o una cuchara, sobre una tabla redondeada, toda la carne, la grasa y la telita. Es lo que más importa: lo que queda se pudre.<\/li>\n<li><strong>Baño de curtido:<\/strong> por cada 4 litros de agua, 250 g de alumbre y 250 g de sal gruesa, disueltos en agua tibia. Sumergir las pieles, que floten sueltas, en un recipiente de plástico o vidrio (nunca de metal).<\/li>\n<li><strong>Dejar 3 a 7 días,<\/strong> revolviendo una vez por día. Está curtida cuando, al doblar un pedazo de piel del lado de adentro, queda una marca blanca que tarda en irse.<\/li>\n<li><strong>Enjuagar<\/strong> en agua limpia y escurrir sin retorcer.<\/li>\n<li><strong>Secar a medias<\/strong> a la sombra, estirada.<\/li>\n<li><strong>Ablandar (sobado):<\/strong> cuando está casi seca pero todavía fresca al tacto, estirarla en todas direcciones, pasarla sobre el borde de una tabla o el respaldo de una silla, frotarla entre las manos. Hay que hacerlo hasta que esté seca del todo: si se deja secar sola, queda dura como cartón.<\/li>\n<li><strong>Engrasar<\/strong> del lado de adentro con un poco de aceite vegetal o una pasta de yema de huevo y aceite, y volver a sobar.<\/li>\n<\/ol>\n<p>El curtido con alumbre no aguanta el agua: si la piel se moja mucho, se endurece y hay que volver a sobarla.<\/p>\n<p><strong>Curtido vegetal:<\/strong> más resistente al agua. En lugar del alumbre, un baño de corteza de sauce, quebracho, roble o cáscara de granada, hervida y colada, durante 2 a 4 semanas, cambiando por baños más concentrados. Es el método de los curtidores tradicionales; aprenderlo con quien lo sepa.<\/p>"},{"t":"Estiércol y orina","h":"<h3>Estiércol y orina<\/h3>\n<ul>\n<li>El estiércol de conejo es de los mejores abonos de la huerta: rico en nitrógeno y fósforo, en bolitas secas que se pueden poner directamente al pie de las plantas sin quemarlas.<\/li>\n<li><strong>Lombricompuesto bajo las jaulas:<\/strong> una cama de lombrices californianas debajo de la conejera convierte el estiércol y la orina en abono, sin olor ni moscas (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 1<\/a>).<\/li>\n<li>La cama de paja con estiércol y orina va al compost.<\/li>\n<\/ul>"},{"t":"Huesos, sangre y restos","h":"<h3>Huesos, sangre y restos<\/h3>\n<ul>\n<li><strong>Sangre:<\/strong> mezclada con aserrín o paja, al compost; es un abono muy fuerte.<\/li>\n<li><strong>Huesos:<\/strong> después de hacer caldo, quemados en el fuego hasta que se ponen blancos y molidos, dan <strong>harina de hueso<\/strong>: abono de fósforo para frutales y calcio para las gallinas.<\/li>\n<li><strong>Vísceras que no se comen:<\/strong> enterradas al pie de los frutales a 40 cm de hondo (que los perros no las saquen) o al compost en el centro de la pila.<\/li>\n<li><strong>Patas y cabeza:<\/strong> caldo, o a las gallinas cocidas y picadas.<\/li>\n<\/ul>"}]},{"t":"Cocinar y conservar","s":[{"t":"La carne de conejo sola no alcanza","h":"<h3>La carne de conejo sola no alcanza<\/h3>\n<p>La carne de conejo es muy magra: tiene mucha proteína y casi nada de grasa. Si una persona come <strong>solo<\/strong> carne magra durante semanas, sin grasa ni hidratos, enferma: diarrea, debilidad, náuseas, hambre que no se calma. Los cazadores y exploradores de otros tiempos lo llamaban \"hambre de conejo\".<\/p>\n<p><strong>Siempre acompañarla<\/strong> con grasa (aceite, manteca, frutos secos, queso, huevos) y con hidratos (pan, papas, arroz, polenta, legumbres). En una comunidad que ya tiene aceite y lácteos, el conejo es un complemento ideal de la dieta, no un reemplazo.<\/p>"},{"t":"Seguridad","h":"<h3>Seguridad<\/h3>\n<ul>\n<li><strong>Cocinar siempre la carne hasta que no queden partes rosadas<\/strong> y los jugos salgan claros, sobre todo la de conejos y liebres de caza.<\/li>\n<li>Lavar las manos y la tabla después de tocar la carne cruda, antes de tocar otra comida (<span class=\"ref\">►<\/span> Manual médico T2 18.8).<\/li>\n<li>Carne cruda sin heladera: cocinarla en el día. Carne cocida: no dejarla más de 2 horas a temperatura ambiente en verano.<\/li>\n<\/ul>"},{"t":"Recetas básicas","h":"<h3>Recetas básicas<\/h3>\n<p><strong>Conejo al disco o a la olla con verduras (para 4)<\/strong><\/p>\n<p>Un conejo de 1,2 kg cortado en presas (las 4 patas, el lomo en 2 o 3 trozos), sal, pimienta, 3 cucharadas de aceite, 2 cebollas, 1 morrón, 2 dientes de ajo, 2 zanahorias, 4 papas, 1 vaso de vino blanco o de agua con una cucharada de vinagre, laurel y romero o tomillo. Dorar las presas en el aceite y reservar. Rehogar las verduras, volver a poner el conejo, agregar el vino y las hierbas, tapar y cocinar a fuego bajo 45 minutos a 1 hora, agregando agua si hace falta, hasta que la carne se separe del hueso. En la caja térmica: hervir 10 minutos y 3 horas adentro (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"5\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 6<\/a>).<\/p>\n<p><strong>Guiso de conejo con porotos o lentejas<\/strong><\/p>\n<p>Rinde el doble con la misma carne: la mitad de un conejo alcanza para 6 personas. Dorar las presas, agregar cebolla, ajo, pimentón, 500 g de legumbres remojadas desde la noche anterior y agua para cubrir. Cocinar hasta que estén tiernas (1 a 2 horas según la legumbre). Desmenuzar la carne y volver a la olla.<\/p>\n<p><strong>Escabeche de conejo<\/strong><\/p>\n<p>Plato tradicional del campo argentino, que además conserva la carne unos días. Dorar las presas en aceite, agregar cebollas y zanahorias en rodajas, 1 cabeza de ajo, laurel, pimienta en grano, y cubrir con partes iguales de vinagre y aceite. Cocinar tapado a fuego mínimo una hora. Pasar a un frasco limpio con la carne <strong>siempre cubierta<\/strong> por el líquido. Guardado en un lugar fresco (un sótano o una alacena fría), comerlo dentro de la semana. <strong>No es una conserva para guardar meses a temperatura ambiente<\/strong>: para eso, el envasado a presión.<\/p>\n<p><strong>Caldo<\/strong><\/p>\n<p>Cabeza, huesos, patas y carcasa, con verduras y agua fría, a fuego bajo 2 a 3 horas. Colar. Es la base de sopas y guisos, y alimento de enfermos y convalecientes (<span class=\"ref\">►<\/span> Manual médico T2 bloque 16).<\/p>\n<p><strong>Paté de hígado<\/strong><\/p>\n<p>Hígados sanos rehogados en manteca con cebolla y ajo, pisados con un tenedor o pasados por un colador con más manteca. Comer en 2 días.<\/p>"},{"t":"Conservar sin heladera","h":"<h3>Conservar sin heladera<\/h3>\n<table>\n<thead>\n<tr>\n<th>Método<\/th>\n<th>Cómo<\/th>\n<th>Cuánto dura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Envasado a presión<\/strong><\/td>\n<td>El único método seguro para conservar carne en frascos. <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"2\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 3<\/a><\/td>\n<td>1 año o más<\/td>\n<\/tr>\n<tr>\n<td><strong>Charqui (carne seca)<\/strong><\/td>\n<td>Ver abajo<\/td>\n<td>Meses, seco y protegido<\/td>\n<\/tr>\n<tr>\n<td><strong>Ahumado y salado<\/strong><\/td>\n<td><span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"3\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 4<\/a><\/td>\n<td>Semanas a meses<\/td>\n<\/tr>\n<tr>\n<td><strong>Escabeche<\/strong><\/td>\n<td>Ver arriba<\/td>\n<td>Unos días al fresco<\/td>\n<\/tr>\n<tr>\n<td><strong>Faenar según la necesidad<\/strong><\/td>\n<td>El conejo vivo es la mejor heladera: faenar solo lo que se come en el día<\/td>\n<td>Mientras haya conejos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Envasado a presión de carne de conejo.<\/strong> La carne es un alimento poco ácido: <strong>solo con envasadora a presión<\/strong> (con manómetro o con pesa), nunca a baño María ni en olla a presión común (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"1\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 2<\/a> y 3, botulismo). Presas crudas o cocidas a medias, en frascos limpios y calientes, con agua o caldo hirviendo hasta 3 cm del borde, sal opcional. Tiempos de la guía del USDA, con pesa de 10 libras hasta 300 m de altura (Alto Valle):<\/p>\n<table>\n<thead>\n<tr>\n<th>Frasco<\/th>\n<th>Con hueso<\/th>\n<th>Sin hueso<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Medio litro (pinta)<\/td>\n<td>65 minutos<\/td>\n<td>75 minutos<\/td>\n<\/tr>\n<tr>\n<td>Un litro (cuarto)<\/td>\n<td>75 minutos<\/td>\n<td>90 minutos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A más altura, ajustar la presión según la tabla de <a class=\"x\" data-b=\"DES\" data-c=\"2\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 3<\/a>. Antes de comer, <strong>hervir el contenido 10 minutos<\/strong>. Tapas abombadas, olor raro o líquido turbio con burbujas: tirar sin probar.<\/p>\n<p><strong>Charqui de conejo<\/strong><\/p>\n<ol>\n<li>Cortar la carne de las patas y el lomo en tiras de 5 mm de grosor, sin grasa ni hueso.<\/li>\n<li>Frotar con sal fina (o sumergir 30 minutos en salmuera fuerte: agua con toda la sal que se disuelva).<\/li>\n<li>Colgar al sol y al viento, cubierto con tul contra las moscas, de 3 a 7 días según el clima, o en el secadero solar (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"3\" data-s=\"0\"><em>Despensa y cocina<\/em>, cap. 4<\/a>). Entrar de noche si hay rocío.<\/li>\n<li>Está lista cuando está dura, oscura y se quiebra al doblarla sin quedar húmeda adentro.<\/li>\n<li>Guardar en bolsas de tela o frascos bien secos, al fresco y a oscuras. Se come hidratada en guisos, o machacada en un mortero y mezclada con la sopa.<\/li>\n<\/ol>"}]},{"t":"Si hay que cazar","s":[{"t":"","h":"<p>En el norte de la Patagonia y Cuyo hay conejos silvestres europeos y liebres europeas: especies exóticas que dañan cultivos y monte nativo. En Río Negro, la autoridad provincial de fauna permite su caza durante todo el año y sin límite de piezas. Consultar las normas vigentes mientras existan.<\/p>"},{"t":"Dónde y cuándo","h":"<h3>Dónde y cuándo<\/h3>\n<ul>\n<li><strong>Conejo silvestre:<\/strong> vive en colonias, en cuevas en suelos arenosos y blandos, con matorrales cerca. Se ven sus bolitas y senderos marcados entre las cuevas. Sale al amanecer y al atardecer.<\/li>\n<li><strong>Liebre:<\/strong> no hace cuevas; descansa de día echada en un hueco del pasto (la cama) y corre en campo abierto. Más grande (3 a 5 kg) y de carne más oscura.<\/li>\n<\/ul>"},{"t":"Trampas de jaula (las más seguras)","h":"<h3>Trampas de jaula (las más seguras)<\/h3>\n<p>Una jaula de alambre de 70 a 80 cm de largo con una puerta que cae cuando el animal pisa una plancha o tira del cebo. Cebo: zanahoria, manzana, alfalfa fresca. Se pone en los senderos o en las bocas de las cuevas, se revisa <strong>todos los días<\/strong> temprano. Ventajas: el animal queda vivo y sin lastimar, y se puede soltar a lo que no se busca (un gato, un zorrino, un pichón de animal nativo).<\/p>"},{"t":"Lazos","h":"<h3>Lazos<\/h3>\n<p>Un lazo de alambre fino y flexible (de 0,5 a 0,8 mm) con un ojal corredizo de 10 a 12 cm de diámetro, con el borde inferior a una mano del piso, colocado en un sendero donde se angosta, atado a una estaca firme. <strong>Se revisan todos los días<\/strong> a la madrugada: un animal atrapado sufre. Los lazos atrapan también perros, zorros y animales nativos: marcarlos, ponerlos lejos de casas y caminos, y levantarlos cuando no se usan.<\/p>"},{"t":"Al agarrar uno","h":"<h3>Al agarrar uno<\/h3>\n<ul>\n<li><strong>Con guantes<\/strong>, siempre. Un animal silvestre que se deja agarrar, está flaco, tiene bultos o llagas, o aparece muerto, <strong>no se toca ni se come<\/strong>: se entierra.<\/li>\n<li>Faenar como se explica en el cap. 8. Revisar el hígado y las vísceras igual que en los domésticos.<\/li>\n<li>Pulgas y garrapatas: colgar el animal unos minutos antes de cuerearlo (las pulgas dejan el cuerpo frío) y lavarse después <span class=\"ref\">►<\/span> Manual médico T1 bloque 4.<\/li>\n<li><strong>Cocinar siempre bien cocida<\/strong> la carne de caza.<\/li>\n<\/ul>\n<p><span class=\"ref\">►<\/span> Armas, licencias y seguridad para cazar: <a class=\"x\" data-b=\"ARM\" data-c=\"0\" data-s=\"0\"><em>Armas, caza y pesca<\/em><\/a>.<\/p>"}]},{"t":"Registros y calendario","s":[{"t":"Ficha de la coneja","h":"<h3>Ficha de la coneja<\/h3>\n<p>Una ficha por coneja, clavada en su jaula o en el cuaderno de la conejera.<\/p>\n<table>\n<thead>\n<tr>\n<th>Monta (fecha)<\/th>\n<th>Macho<\/th>\n<th>Palpación (fecha y resultado)<\/th>\n<th>Parto (fecha)<\/th>\n<th>Nacidos vivos<\/th>\n<th>Muertos<\/th>\n<th>Destetados<\/th>\n<th>Observaciones<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"blank\"><\/span><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Calendario de un ciclo","h":"<h3>Calendario de un ciclo<\/h3>\n<table>\n<thead>\n<tr>\n<th>Día<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>Monta. Anotar<\/td>\n<\/tr>\n<tr>\n<td>10 a 14<\/td>\n<td>Palpar. Si está vacía, volver a servir<\/td>\n<\/tr>\n<tr>\n<td>27 a 28<\/td>\n<td>Poner el nido con paja limpia<\/td>\n<\/tr>\n<tr>\n<td>31 (30 a 32)<\/td>\n<td>Parto. No molestar<\/td>\n<\/tr>\n<tr>\n<td>32<\/td>\n<td>Revisar el nido: sacar muertos y paja sucia, contar vivos<\/td>\n<\/tr>\n<tr>\n<td>32 a 35<\/td>\n<td>Igualar camadas entre madres si hace falta<\/td>\n<\/tr>\n<tr>\n<td>45 a 60<\/td>\n<td>Nueva monta (2 a 4 semanas después del parto)<\/td>\n<\/tr>\n<tr>\n<td>66 a 73<\/td>\n<td>Destete (5 a 6 semanas de vida). Gazapos a jaulas de engorde<\/td>\n<\/tr>\n<tr>\n<td>100 a 130<\/td>\n<td>Faena de los gazapos (10 a 14 semanas de vida). Elegir hembras de reposición<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"Datos de bolsillo","h":"<h3>Datos de bolsillo<\/h3>\n<table>\n<thead>\n<tr>\n<th>Dato<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gestación<\/td>\n<td>31 días (30 a 32)<\/td>\n<\/tr>\n<tr>\n<td>Destete<\/td>\n<td>5 a 6 semanas<\/td>\n<\/tr>\n<tr>\n<td>Faena<\/td>\n<td>10 a 14 semanas, 2 a 2,5 kg vivo<\/td>\n<\/tr>\n<tr>\n<td>Carne limpia por conejo<\/td>\n<td>1,1 a 1,4 kg<\/td>\n<\/tr>\n<tr>\n<td>Carne por coneja y año (a pasto)<\/td>\n<td>unos 30 kg<\/td>\n<\/tr>\n<tr>\n<td>Machos<\/td>\n<td>1 cada 8 a 10 hembras, más uno de repuesto<\/td>\n<\/tr>\n<tr>\n<td>Temperatura peligrosa<\/td>\n<td>más de 30 °C<\/td>\n<\/tr>\n<tr>\n<td>Agua por día<\/td>\n<td>½ litro adulto; más de 1 litro hembra con cría en verano<\/td>\n<\/tr>\n<tr>\n<td>Forraje por coneja y sus crías<\/td>\n<td>200 a 300 m² de alfalfa regada<\/td>\n<\/tr>\n<tr>\n<td>Envasado a presión, frasco de 1 litro sin hueso<\/td>\n<td>90 minutos a 10 libras<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}]},{"id":"RIE","title":"Riesgos y recursos del Alto Valle","sub":"Riego, represas, ríos, ceniza, petróleo, leña","color":"#3c6a8a","kind":"md","c":[{"t":"Cómo usar este libro","s":[{"t":"","h":"<p>Los otros libros de la biblioteca sirven en cualquier lugar del país. Este es distinto: trata los riesgos y los recursos <strong>propios del Alto Valle de Río Negro y Neuquén<\/strong>, donde vive la comunidad para la que se escribió la biblioteca. Mucho sirve igual para el Valle Medio, el Valle Inferior y las ciudades de la confluencia.<\/p>\n<p>El valle es un oasis artificial: un desierto convertido en chacras por un dique, un canal de 130 km y miles de kilómetros de canales y desagües. Lo que hace posible vivir aquí (el agua regulada por represas, el riego, la fruta, el petróleo y el gas) es también lo que lo hace frágil cuando el Estado y las empresas dejan de funcionar.<\/p>\n<p><strong>Qué hacer con este libro, antes de que haga falta<\/strong><\/p>\n<ol>\n<li>Leer el cap. 2 (riego) y el cap. 3 (represas): son los dos riesgos que pueden cambiar todo en semanas.<\/li>\n<li>Completar con la comunidad la planilla del cap. 10 (recursos de la zona) y guardarla con la biblioteca.<\/li>\n<li>Ubicar en un mapa en papel la casa, las zonas altas más cercanas, los canales, los desagües, los pozos petroleros y los gasoductos de la zona.<\/li>\n<li>Llevar a cada casa los avisos del cap. 4 (agua) y el cap. 5 (ceniza).<\/li>\n<\/ol>\n<p>Lo que se repite en otros libros se remite con <strong><span class=\"ref\">►<\/span><\/strong>: la ropa, el agua segura y la casa están en <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em><\/a>; la organización y la seguridad en <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\"><em>Familia y comunidad<\/em><\/a>; lo médico en el Manual médico.<\/p>"}]},{"t":"El agua del valle: el sistema de riego","s":[{"t":"Cómo funciona [VITAL]","h":"<h3>Cómo funciona <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>El sistema nace en el <strong>dique Ballester<\/strong>, sobre el río Neuquén (Barda del Medio y Contralmirante Cordero), que embalsa el río y lo deriva al <strong>Canal Principal<\/strong>: una conducción de unos 130 km que corre al pie de la barda norte hasta Chichinales y riega alrededor de 60.000 hectáreas, entre ellas las chacras de Villa Regina.<\/p>\n<ul>\n<li><strong>El dique y el Canal Principal<\/strong> los opera el Estado provincial (Departamento Provincial de Aguas) junto con un consorcio de segundo grado.<\/li>\n<li><strong>Los canales secundarios, terciarios y los desagües<\/strong> los mantienen los <strong>consorcios de riego<\/strong> de cada zona, formados por los productores.<\/li>\n<li><strong>Los desagües (drenes)<\/strong>, más de 500 km de canales colectores, son tan importantes como el riego: bajan la napa freática. Si se tapan, la napa sube, los suelos se encharcan y se salinizan (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir alimentos<\/em>, cap. 1<\/a>, suelo salitroso).<\/li>\n<li><strong>La temporada de riego<\/strong> va de fines de agosto a fines de abril. <strong>En invierno el canal se corta y se vacía<\/strong> para el mantenimiento: de mayo a agosto no hay agua en los canales.<\/li>\n<\/ul>"},{"t":"Lo que significa en un colapso","h":"<h3>Lo que significa en un colapso<\/h3>\n<ul>\n<li><strong>Invierno sin agua de canal:<\/strong> quien depende del canal para el agua de la casa, los animales o la huerta de invierno necesita <strong>reservas o un pozo<\/strong> (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 1<\/a>). Calcular hoy cuánta agua hace falta de mayo a agosto.<\/li>\n<li><strong>El canal también se puede cortar en temporada:<\/strong> roturas de taludes, compuertas trabadas, el dique sin operar. Ya pasó con roturas del Canal Principal que dejaron sin riego a todo el valle durante días.<\/li>\n<li><strong>Sin mantenimiento, el sistema se degrada en pocas temporadas:<\/strong> los canales se llenan de sedimento, juncos y basura, los taludes se desmoronan, las compuertas se oxidan, y los desagües tapados levantan la napa. Un valle sin riego vuelve a ser estepa: los frutales mueren en uno o dos veranos.<\/li>\n<\/ul>"},{"t":"Mantener el riego entre todos [VITAL]","h":"<h3>Mantener el riego entre todos <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Si los organismos y los consorcios dejan de funcionar, el riego solo sigue si <strong>los vecinos de cada canal se organizan<\/strong> como lo hacían los primeros colonos.<\/p>\n<p><strong>Organización<\/strong><\/p>\n<ul>\n<li>Una <strong>comisión de riego<\/strong> por canal secundario o por grupo de chacras, con un responsable (el \"tomero\" o \"canalero\") que conoce las compuertas y los turnos.<\/li>\n<li><strong>Padrón de regantes:<\/strong> quién riega, cuántas hectáreas o canteros, qué cultiva.<\/li>\n<li><strong>Turnos escritos<\/strong> (días y horas por chacra, en proporción a la superficie) y un cuaderno de riego.<\/li>\n<li><strong>Trabajo comunitario obligatorio<\/strong> para la limpieza, en proporción al agua que cada uno usa. Quien no limpia, no riega: es la norma más antigua de los regadíos.<\/li>\n<li><strong>Conflictos de agua<\/strong> a la asamblea (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 4<\/a>). En los regadíos de todo el mundo, el agua es la primera causa de peleas entre vecinos.<\/li>\n<\/ul>\n<p><strong>Mantenimiento de canales y acequias<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Tarea<\/th>\n<th>Cuándo<\/th>\n<th>Cómo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Limpieza de fondo (sedimento)<\/td>\n<td>Invierno, con el canal seco<\/td>\n<td>Pala y carretilla; sacar el barro a los costados, no al talud<\/td>\n<\/tr>\n<tr>\n<td>Corte de juncos, totora y malezas<\/td>\n<td>Fin de invierno y a mitad de temporada<\/td>\n<td>Guadaña, machete; las raíces se sacan con pala<\/td>\n<\/tr>\n<tr>\n<td>Basura y obstrucciones<\/td>\n<td>Todo el año<\/td>\n<td>Rejas en las tomas; recorrer el canal después de cada viento<\/td>\n<\/tr>\n<tr>\n<td>Reparar taludes<\/td>\n<td>Apenas aparece una pérdida<\/td>\n<td>Tierra arcillosa apisonada en capas, bolsas de tierra, estacas y ramas trenzadas<\/td>\n<\/tr>\n<tr>\n<td>Compuertas<\/td>\n<td>Invierno<\/td>\n<td>Engrasar guías y tornillos, cambiar tablas podridas, pintar con aceite o brea<\/td>\n<\/tr>\n<tr>\n<td>Desagües<\/td>\n<td>Invierno<\/td>\n<td>Igual que los canales; son los que primero se abandonan y los que más daño hacen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Seguridad en los canales:<\/strong> se trabaja de a dos, con el canal cortado o con poca agua, y nunca dentro de un canal con corriente (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"RIE\" data-c=\"3\" data-s=\"0\">cap. 4<\/a>).<\/p>\n<p><strong>Si el canal principal deja de traer agua<\/strong><\/p>\n<ul>\n<li>Las chacras cercanas al río pueden <strong>bombear<\/strong> (bomba de soga no alcanza la altura; hace falta motor o rueda hidráulica en una toma del río, <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"6\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 7<\/a>).<\/li>\n<li><strong>Pozos:<\/strong> en buena parte del valle la napa está a pocos metros. Un pozo por grupo de casas para agua de consumo y huerta chica.<\/li>\n<li><strong>Concentrar el riego:<\/strong> priorizar la huerta de alimentos y los frutales más productivos; dejar de regar parques y frutales viejos.<\/li>\n<li><strong>Toma comunitaria del río:<\/strong> una obra grande; requiere conocimiento hidráulico y mucha mano de obra. Vale la pena solo si el corte va a ser largo.<\/li>\n<\/ul>"},{"t":"El agua del canal no es agua de beber","h":"<h3>El agua del canal no es agua de beber<\/h3>\n<p>El agua de los canales arrastra restos de agroquímicos de las chacras, excrementos de animales y basura. Se trata siempre como agua de río: decantar, filtrar y desinfectar (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 1<\/a>). En época de pulverizaciones de los frutales, tomarla lo menos posible.<\/p>"}]},{"t":"Represas y crecidas","s":[{"t":"Lo que hay río arriba [VITAL]","h":"<h3>Lo que hay río arriba <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Sobre los ríos Limay y Neuquén hay unas diez represas y diques compensadores: en el Limay, Alicurá, Piedra del Águila, Pichi Picún Leufú, El Chocón y Arroyito; en el Neuquén, Portezuelo Grande, Loma de la Lata (Los Barreales y Mari Menuco), El Chañar y el dique Ballester. Además de dar energía, <strong>regulan las crecidas<\/strong>: antes de las represas, el valle se inundaba periódicamente.<\/p>\n<p>La Autoridad Interjurisdiccional de Cuencas (AIC) y las defensas civiles tienen planes y mapas de inundación para tres escenarios: una crecida grande de los ríos, un desembalse controlado de alguna represa y la rotura de una o varias. Los estudios difundidos indican que una rotura de El Chocón inundaría el valle en cuestión de horas.<\/p>"},{"t":"Qué cambia en un colapso","h":"<h3>Qué cambia en un colapso<\/h3>\n<ul>\n<li><strong>Represas sin operar:<\/strong> si no se manejan las compuertas y los vertederos, una crecida grande puede pasar río abajo sin regular. El valle volvería a tener inundaciones como las de antes de las grandes represas.<\/li>\n<li><strong>Represas sin mantenimiento por años:<\/strong> el riesgo de falla aumenta con el tiempo. No es algo que pase en semanas, pero sí en una crisis muy larga.<\/li>\n<li><strong>Sequía hídrica:<\/strong> también puede pasar lo contrario: años de poca nieve y embalses bajos, con poca agua para el riego (la cuenca ya pasó más de una década de sequía).<\/li>\n<\/ul>"},{"t":"Saber dónde estás","h":"<h3>Saber dónde estás<\/h3>\n<ol>\n<li><strong>¿La casa está en zona inundable?<\/strong> Preguntar hoy a Defensa Civil del municipio o buscar los mapas de la AIC. Como regla general en el Alto Valle, las zonas bajas cercanas al río y las islas son las primeras en inundarse; las <strong>bardas<\/strong> (las mesetas al norte y al sur del valle) son la zona segura.<\/li>\n<li><strong>Ruta a lo alto:<\/strong> el camino más corto desde la casa hasta la barda, a pie, sin cruzar el río ni puentes. Recorrerlo una vez con toda la familia. Tener una segunda ruta.<\/li>\n<li><strong>Punto de encuentro en altura<\/strong> acordado con la familia y los vecinos (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 1<\/a>).<\/li>\n<\/ol>"},{"t":"Señales de alerta","h":"<h3>Señales de alerta<\/h3>\n<ul>\n<li>Aviso oficial, sirenas o radio (mientras existan).<\/li>\n<li><strong>El río sube rápido sin haber llovido<\/strong> en el valle, o el agua se pone de golpe muy turbia y con troncos.<\/li>\n<li>Ruido fuerte y continuo río arriba, animales que huyen.<\/li>\n<li>Crecidas que siguen después de lluvias muy fuertes o deshielos tempranos en la cordillera.<\/li>\n<\/ul>"},{"t":"Qué hacer","h":"<h3>Qué hacer<\/h3>\n<p><strong>Ante un aviso o una señal clara: irse a lo alto enseguida, a pie si hace falta.<\/strong> En una onda de crecida no hay tiempo para cargar el auto ni salvar los muebles.<\/p>\n<ul>\n<li>Llevar solo la mochila de evacuación (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 1<\/a>), agua, abrigo y los chicos.<\/li>\n<li>Ayudar a los vecinos ancianos o con discapacidad: es la tarea de cada familia para con sus vecinos asignados.<\/li>\n<li>Nunca cruzar caminos o puentes con agua corriendo: 30 cm de agua en movimiento arrastran a un adulto y 60 cm a un auto.<\/li>\n<li>No volver hasta que el agua baje del todo y alguien haya revisado las construcciones.<\/li>\n<li>Después: limpiar y desinfectar (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"1\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 2<\/a>, <em>Limpiar la casa después de una inundación<\/em>).<\/li>\n<\/ul>\n<p><strong>Para la comunidad:<\/strong> guardar en altura (en la barda o en la parte más alta) una reserva de semillas, herramientas, mantas y comida: si el valle se inunda, eso es lo que permite volver a empezar.<\/p>"}]},{"t":"Ríos, canales y agua: no ahogarse","s":[{"t":"Los canales son la trampa del valle [VITAL]","h":"<h3>Los canales son la trampa del valle <span class=\"b vital\">VITAL<\/span><\/h3>\n<p>Cada verano se ahogan en el Alto Valle chicos y jóvenes en canales de riego. Los canales parecen tranquilos pero tienen <strong>corriente fuerte, paredes lisas de cemento o tierra resbalosa<\/strong> y compuertas o alcantarillas que chupan. Quien cae no puede salir solo.<\/p>\n<ul>\n<li><strong>Chicos:<\/strong> prohibido acercarse a los canales sin un adulto. Cercar los tramos cerca de las casas y las escuelas.<\/li>\n<li><strong>Nadie se baña en canales,<\/strong> ni adultos: para bañarse, playas del río conocidas, con corriente suave y fondo visible, nunca solos.<\/li>\n<li><strong>Dejar en cada tramo cercano a las casas<\/strong> una soga con un bidón vacío atado, o una rama larga, para tirarle a quien cae.<\/li>\n<li><strong>Compuertas y alcantarillas:<\/strong> nunca acercarse con agua corriendo: la succión atrapa contra la reja.<\/li>\n<\/ul>"},{"t":"Rescatar a alguien en el agua","h":"<h3>Rescatar a alguien en el agua<\/h3>\n<p>El que se mete al agua a rescatar sin saber suele ahogarse con la víctima. El orden es:<\/p>\n<ol>\n<li><strong>Gritar<\/strong> y pedir ayuda. Indicarle a la persona que se ponga boca arriba y flote.<\/li>\n<li><strong>Alcanzar<\/strong> desde la orilla: una rama, un palo, una campera, acostado en el suelo para no ser arrastrado.<\/li>\n<li><strong>Tirar<\/strong> algo que flote: bidón vacío, rueda, tabla, con una soga atada si se puede.<\/li>\n<li><strong>Ir a buscarla<\/strong> solo si se sabe nadar bien, con algo que flote para dárselo, y nunca dejarse agarrar del cuello.<\/li>\n<li>Después: <span class=\"ref\">►<\/span> Manual médico T1 3.28 (ahogamiento).<\/li>\n<\/ol>"},{"t":"Cruzar un río a pie","h":"<h3>Cruzar un río a pie<\/h3>\n<ul>\n<li><strong>Primero, buscar otra forma:<\/strong> un puente, un vado conocido, esperar a que baje (los ríos de deshielo bajan a la mañana temprano).<\/li>\n<li>No cruzar si el agua pasa la rodilla con corriente, si está turbia y no se ve el fondo, o si arrastra ramas.<\/li>\n<li>Elegir un tramo ancho y poco profundo, nunca una curva ni un angostamiento.<\/li>\n<li>Desabrocharse la mochila (para poder soltarla), cruzar en diagonal río abajo, con un palo como tercer apoyo, de cara a la corriente.<\/li>\n<li>En grupo: tomados de los brazos o de un palo horizontal, el más fuerte río arriba.<\/li>\n<li>Con chicos: a hombros de un adulto, o pasar primero una soga fija entre dos árboles.<\/li>\n<\/ul>"},{"t":"Aprender a nadar","h":"<h3>Aprender a nadar<\/h3>\n<p>Que todos en la comunidad sepan flotar y nadar es la mejor prevención. Enseñarles a los chicos en verano, en aguas tranquilas, con adultos en el agua (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"2\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 3<\/a>).<\/p>"}]},{"t":"Ceniza volcánica","s":[{"t":"Por qué en el Alto Valle","h":"<h3>Por qué en el Alto Valle<\/h3>\n<p>Los volcanes de la cordillera chilena entran en erupción cada pocos años. Con viento del oeste, la ceniza cruza a la Argentina: en 2011, la del Puyehue-Cordón Caulle cubrió Bariloche, Villa La Angostura, Ingeniero Jacobacci y gran parte de la Línea Sur, y llegó al norte de Río Negro y La Pampa. El Alto Valle puede recibir desde un polvillo fino hasta varios centímetros.<\/p>"},{"t":"Durante la caída [VITAL]","h":"<h3>Durante la caída <span class=\"b vital\">VITAL<\/span><\/h3>\n<ul>\n<li><strong>Quedarse adentro,<\/strong> con puertas y ventanas cerradas y trapos húmedos en las rendijas.<\/li>\n<li><strong>Respirar:<\/strong> si hay que salir, barbijo, o un pañuelo húmedo doblado sobre nariz y boca. Anteojos o antiparras; no usar lentes de contacto. Personas con asma, enfermedades del pulmón o del corazón, bebés y ancianos, adentro siempre <span class=\"ref\">►<\/span> Manual médico T1 3.32.<\/li>\n<li><strong>Agua:<\/strong> tapar tanques, cisternas, baldes y la cosecha de lluvia; <strong>desconectar las bajadas de lluvia<\/strong> para que la ceniza no entre a la cisterna.<\/li>\n<li><strong>Animales:<\/strong> encerrados en galpones o bajo techo, con agua tapada.<\/li>\n<li><strong>Vehículos:<\/strong> no usarlos; la ceniza tapa los filtros y raya los motores.<\/li>\n<\/ul>"},{"t":"Después","h":"<h3>Después<\/h3>\n<p><strong>Techos primero.<\/strong> La ceniza mojada pesa como el barro: unos centímetros pueden hundir un techo liviano o un invernadero. Sacarla apenas para de caer, antes de que llueva.<\/p>\n<ul>\n<li>Humedecerla apenas (rociar, no baldear) para que no vuele, y barrer o palear empezando por lo más alto.<\/li>\n<li>Subir al techo con soga de seguridad y de a dos; no subir a techos de chapa fina o de fibrocemento sin tablones.<\/li>\n<li><strong>No tirarla a las cloacas ni a los desagües:<\/strong> los tapa como cemento. Juntarla en bolsas o en montones, lejos de los canales.<\/li>\n<li>La ceniza se puede usar después: mezclada con tierra en canteros, como abrasivo para limpiar ollas, o en la construcción (en el revoque y el adobe, en proporción chica).<\/li>\n<\/ul>\n<p><strong>Agua:<\/strong> dejar que la ceniza decante en un balde un día, sacar el agua clara de arriba, filtrar y desinfectar como siempre (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 1<\/a>). Para los animales, mejor agua de ríos o arroyos que de charcos o bebederos quietos.<\/p>\n<p><strong>Huerta:<\/strong> sacudir las plantas, lavar muy bien las verduras antes de comerlas. A largo plazo, poca ceniza mejora el suelo; mucha, lo endurece y hay que mezclarla.<\/p>\n<p><strong>Animales:<\/strong> la ceniza en la lana mojada pesa mucho y voltea a las ovejas débiles; esquilar o sacudir. Dar heno y agua limpia; el pasto cubierto de ceniza les gasta los dientes y les obstruye el estómago. Las abejas sufren mucho: tapar las piqueras durante la caída (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"ABE\" data-c=\"0\" data-s=\"0\"><em>Abejas y miel<\/em><\/a>).<\/p>\n<p><strong>Motores, bombas y paneles solares:<\/strong> limpiar con agua y un trapo suave, sin frotar en seco (raya el vidrio). Cambiar o lavar filtros de aire.<\/p>"}]},{"t":"Petróleo, gas y accidentes químicos","s":[{"t":"Lo que hay en la zona","h":"<h3>Lo que hay en la zona<\/h3>\n<p>El Alto Valle está rodeado por la cuenca neuquina, con Vaca Muerta: pozos de petróleo y gas, piletas de residuos, plantas de tratamiento, gasoductos, oleoductos y camiones con combustibles y químicos por las rutas 22 y 151. Funcionando, están controlados. En un colapso, quedan instalaciones sin mantenimiento y gente que intenta sacar combustible de ellas.<\/p>"},{"t":"Gases peligrosos [VITAL]","h":"<h3>Gases peligrosos <span class=\"b vital\">VITAL<\/span><\/h3>\n<table>\n<thead>\n<tr>\n<th>Gas<\/th>\n<th>Cómo se reconoce<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sulfhídrico (ácido sulfhídrico)<\/strong><\/td>\n<td>Olor a huevo podrido. <strong>A concentración alta deja de olerse<\/strong> porque paraliza el olfato: que el olor desaparezca de golpe es una señal de peligro, no de alivio<\/td>\n<td>Es más pesado que el aire y se junta en lo bajo (pozos, zanjas, sótanos). Alejarse enseguida hacia arriba y en dirección perpendicular al viento. Nunca bajar a un pozo o una zanja a rescatar a alguien desmayado: se muere el rescatador también<\/td>\n<\/tr>\n<tr>\n<td><strong>Gas natural (metano)<\/strong><\/td>\n<td>Sin olor en los gasoductos de alta (el olor de la garrafa y la red domiciliaria es un agregado); silbido de una pérdida<\/td>\n<td>Más liviano que el aire, sube. Explota con cualquier chispa: no prender fuego, no encender motores ni linternas viejas cerca, alejarse<\/td>\n<\/tr>\n<tr>\n<td><strong>Vapores de combustibles<\/strong><\/td>\n<td>Olor a nafta o solvente<\/td>\n<td>Inflamables y tóxicos: ventilar, nada de fuego<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Intoxicación por gases: <span class=\"ref\">►<\/span> Manual médico T1 3.32.<\/p>"},{"t":"Pozos, piletas y ductos abandonados","h":"<h3>Pozos, piletas y ductos abandonados<\/h3>\n<ul>\n<li><strong>No acercarse a pozos con pérdidas,<\/strong> piletas con líquidos negros, ni a válvulas con silbido u olor.<\/li>\n<li><strong>No usar el agua<\/strong> de napas, arroyos o canales que pasan cerca de pozos, piletas o derrames: puede tener hidrocarburos, sal y metales. Hervirla no la limpia.<\/li>\n<li><strong>No intentar abrir válvulas ni cortar caños<\/strong> para sacar combustible o gas: es la causa de las explosiones e incendios más graves. Un gasoducto de alta presión que se rompe hace una llamarada de cientos de metros.<\/li>\n<li><strong>No hacer huerta ni pastoreo<\/strong> en terrenos con manchas de petróleo o donde hubo piletas.<\/li>\n<li>Marcar en el mapa de la comunidad (cap. 10) todas las instalaciones de la zona y una distancia de seguridad alrededor.<\/li>\n<\/ul>"},{"t":"Accidente químico en la ruta o en una planta","h":"<h3>Accidente químico en la ruta o en una planta<\/h3>\n<ol>\n<li>Alejarse <strong>perpendicular al viento<\/strong> y hacia lo alto (mirar hacia dónde va el humo).<\/li>\n<li>Si la nube ya está encima y no se puede salir: <strong>refugiarse adentro<\/strong>, cerrar puertas y ventanas, tapar rendijas con trapos húmedos, apagar estufas y fuegos que toman aire de afuera, ir a la habitación más alta y del lado contrario al viento.<\/li>\n<li>No tocar líquidos derramados ni rescatar a personas desmayadas sin protección.<\/li>\n<li>Quitar la ropa y lavarse con mucha agua si hubo contacto <span class=\"ref\">►<\/span> Manual médico T1 3.33.<\/li>\n<\/ol>"}]},{"t":"Leña y madera para siempre","s":[{"t":"El problema [AÑOS]","h":"<h3>El problema <span class=\"b anos\">AÑOS<\/span><\/h3>\n<p>En la Patagonia no hay monte nativo que alcance: la leña y la madera del valle vienen de las <strong>cortinas de álamo<\/strong> y de la <strong>poda de frutales<\/strong>, que plantó la gente. Si se cortan sin replantar, en pocos inviernos no queda nada. Una casa que se calienta y cocina con leña en estufas comunes gasta varias toneladas por año; con estufas rocket, buena aislación y caja térmica, la mitad o menos (<span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"2\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 3<\/a>).<\/p>"},{"t":"El bosquete de leña de la comunidad","h":"<h3>El bosquete de leña de la comunidad<\/h3>\n<p><strong>Qué plantar
