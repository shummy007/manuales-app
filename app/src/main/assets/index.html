<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuales</title>
<style>
/* Plan: manual de campo para leer sin conexión. Barra fija arriba, lectura en columna de ~65 caracteres,
   cada libro con su color de lomo, rojo reservado para emergencias. Tipografías del sistema: funcionan sin internet. */
:root{
  --paper:#f6f4ef; --card:#ffffff; --ink:#1e2420; --muted:#5f665f; --line:#dcd8cc;
  --accent:#2f6a8f; --sos:#b3261e; --sos-ink:#ffffff; --mark:#ffe08a; --chip:#ece8dd;
  --display: ui-serif, Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs: 17px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151816; --card:#1d211e; --ink:#e6e8e3; --muted:#a3aaa2; --line:#323833;
    --accent:#7fb3d5; --sos:#d9473c; --sos-ink:#ffffff; --mark:#6b5a12; --chip:#262b27; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151816; --card:#1d211e; --ink:#e6e8e3; --muted:#a3aaa2; --line:#323833;
  --accent:#7fb3d5; --sos:#d9473c; --sos-ink:#ffffff; --mark:#6b5a12; --chip:#262b27; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 12px}
.bar h1{font-family:var(--display);font-size:20px;margin:0 6px 0 2px;font-weight:700;letter-spacing:.01em;flex:0 0 auto;cursor:pointer}
.bar .sp{flex:1}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.ib:hover{background:var(--chip)}
.ib.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.sos{display:flex;gap:12px;align-items:center;background:var(--sos);color:var(--sos-ink);border-radius:12px;padding:14px 16px;cursor:pointer;border:0;width:100%;text-align:left;font-size:18px;font-weight:700}
.sos small{display:block;font-weight:400;font-size:14px;opacity:.95}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:15px}
.chipbtn:hover{background:var(--chip)}
h2.sec{font-family:var(--body);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.book{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;cursor:pointer;text-align:left;overflow:hidden;min-height:78px}
.book:hover{border-color:var(--muted)}
.book .spine{width:10px;flex:0 0 10px}
.book .bt{padding:10px 12px 10px 0;color:var(--ink)}
.book b{display:block;font-family:var(--display);font-size:17px;line-height:1.25}
.book .bt > span{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:3px}
.head{border-left:6px solid var(--bc,var(--accent));padding:4px 0 4px 12px;margin:4px 0 16px}
.head .k{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head h2{font-family:var(--display);font-size:26px;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.toc details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 8px}
.toc summary{cursor:pointer;padding:12px 14px;font-weight:650;list-style:none;display:flex;gap:10px;align-items:baseline}
.toc summary::-webkit-details-marker{display:none}
.toc summary .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2.2em;font-weight:700}
.toc ul{list-style:none;margin:0;padding:0 8px 10px 14px}
.toc li button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 8px;border-radius:6px;cursor:pointer;font-size:15.5px}
.toc li button:hover{background:var(--chip)}
.toc .open-ch{margin:2px 14px 10px;font-size:14px}
article{font-size:var(--fs)}
article h2{font-family:var(--display);font-size:1.5em;line-height:1.2;margin:.2em 0 .6em;text-wrap:balance}
article h3{font-family:var(--display);font-size:1.22em;line-height:1.25;margin:1.6em 0 .5em;text-wrap:balance;scroll-margin-top:70px}
article p,article li{max-width:68ch}
article table{border-collapse:collapse;font-size:.88em;margin:.6em 0 1.2em;min-width:100%}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
article th{background:var(--bc,var(--accent));color:#fff;text-align:left;padding:7px 9px;vertical-align:bottom;font-weight:600}
article td{border-bottom:1px solid var(--line);padding:7px 9px;vertical-align:top}
article tbody tr:nth-child(even) td{background:var(--chip)}
.atencion{border-left:4px solid var(--sos);background:color-mix(in srgb,var(--sos) 9%,var(--card));padding:10px 14px;margin:1em 0;border-radius:0 8px 8px 0}
.b{font-size:.62em;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:4px;vertical-align:.25em;color:#fff;white-space:nowrap;font-family:var(--body)}
.b.vital{background:#b3261e}.b.anos{background:#b07a1a}.b.mejora{background:#4f7a46}
.ref{color:var(--bc,var(--accent));font-weight:700}
a.x{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.formula{text-align:center;background:var(--chip);padding:10px;border-radius:8px;margin:.6em 0 1em}
.pre{font-size:.86em;background:var(--chip);border-radius:8px;padding:10px 12px;margin:.6em 0 1em;overflow-x:auto;line-height:1.5}
.pg{font-size:12px;color:var(--muted);text-align:right;border-top:1px dashed var(--line);margin:1.2em 0 .6em;padding-top:2px}
.blank{display:inline-block;min-height:1.6em}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pager{display:flex;gap:10px;justify-content:space-between;margin:28px 0 0;border-top:1px solid var(--line);padding-top:14px}
.pager button{flex:1;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.pager button.nx{text-align:right}
.crumb{font-size:14px;color:var(--muted);margin:0 0 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:14px;text-decoration:underline}
.sbox{display:flex;gap:8px;margin:0 0 12px}
.sbox input{flex:1;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.res{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--bc);border-radius:8px;padding:10px 12px;margin:0 0 8px;cursor:pointer;display:block;width:100%;text-align:left}
.res .w{font-size:12.5px;color:var(--muted)}
.res b{display:block;font-size:16px;margin:2px 0 4px}
.res .sn{font-size:14.5px;color:var(--ink);line-height:1.45}
.note{color:var(--muted);font-size:14.5px}
.mk{display:flex;gap:8px;align-items:center}
.mk .res{flex:1;margin:0}
.del{border:1px solid var(--line);background:var(--card);border-radius:8px;height:40px;min-width:40px;cursor:pointer}
.fab{position:fixed;right:16px;bottom:16px;z-index:6}
.fab button{box-shadow:0 2px 10px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media (max-width:480px){.bar h1{font-size:18px}.ib{min-width:38px;padding:0 8px}.head h2{font-size:23px}}
</style>
</head>

  <button class="ib" id="back" aria-label="Volver" title="Volver">←</button>

<script type="application/json" id="data">[{"id":"GUÍA","title":"Guía de la biblioteca","sub":"Qué libro abrir para cada tema","color":"#9a7426","kind":"md","c":[{"t":"Cómo está armada la biblioteca","s":[{"t":"","h":"<p>La biblioteca reúne trece libros que se complementan: dos tomos médicos, uno de nutrición, cuatro de cría de animales (gallinas, cabras, abejas y, como último recurso, conejos para carne), cuatro de autosuficiencia (producción, despensa, casa y comunidad), uno de riesgos y recursos propios del Alto Valle y uno de armas, caza y pesca. Ninguno repite lo que otro explica mejor: cada uno remite a los demás con el signo <strong><span class=\"ref\">►<\/span><\/strong>. Esta guía dice qué libro abrir para cada tema, cómo prepararse por etapas y cómo conservar la biblioteca sin internet ni electricidad.<\/p>"},{"t":"Si es una emergencia","h":"<h3>Si es una emergencia<\/h3>\n<p>No busque en esta guía. Abra el <strong>Manual médico, Tomo 1<\/strong>, en la hoja de emergencias del principio.<\/p>"},{"t":"Orden de lectura recomendado, antes de que haga falta","h":"<h3>Orden de lectura recomendado, antes de que haga falta<\/h3>\n<ol>\n<li><a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\"><em>Familia y comunidad<\/em><\/a>, capítulo 1 (primeras 72 horas, mochila de evacuación) y capítulo 2 (niños).<\/li>\n<li><a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em><\/a>, capítulos 1 a 4 (agua, saneamiento, fuego, incendios), y <a class=\"x\" data-b=\"RIE\" data-c=\"0\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em><\/a>, capítulos 2 y 3 (riego y represas).<\/li>\n<li><em>Nutrición ovolactovegetariana<\/em>, completo (es corto) y <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em><\/a>, capítulos 1 y 2.<\/li>\n<li>Manual médico, Tomo 1, bloques 1 y 2 (cómo usarlo, examen y triage) y Tomo 2, bloque 20 (entrenar).<\/li>\n<li><a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir alimentos<\/em><\/a>, capítulos 1 a 4 (huerta, fichas, calendario, semillas).<\/li>\n<li>El resto, por tema, a medida que se empieza cada actividad.<\/li>\n<\/ol>"},{"t":"Quién lee qué en una comunidad","h":"<h3>Quién lee qué en una comunidad<\/h3>\n<table>\n<thead>\n<tr>\n<th>Responsable<\/th>\n<th>Libros de cabecera<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Salud<\/td>\n<td>Manual médico T1 y T2 completos; Nutrición<\/td>\n<\/tr>\n<tr>\n<td>Agua y saneamiento<\/td>\n<td><a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa<\/em>, cap. 1<\/a> y 2; Manual médico T2 15.2 y bloque 18<\/td>\n<\/tr>\n<tr>\n<td>Huerta y semillas<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir<\/em>, cap. 1<\/a> a 4, 6 y 9 (plagas); banco de semillas<\/td>\n<\/tr>\n<tr>\n<td>Granos y campo<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"2\" data-s=\"0\"><em>Producir<\/em>, cap. 3<\/a> y 5<\/td>\n<\/tr>\n<tr>\n<td>Animales<\/td>\n<td>Manual de gallinas ponedoras; Cabras lecheras y queso; <a class=\"x\" data-b=\"ABE\" data-c=\"0\" data-s=\"0\"><em>Abejas y miel<\/em><\/a>; <a class=\"x\" data-b=\"PRO\" data-c=\"6\" data-s=\"0\"><em>Producir<\/em>, cap. 7<\/a>; <a class=\"x\" data-b=\"CON\" data-c=\"0\" data-s=\"0\"><em>Conejos<\/em><\/a>, solo si la asamblea decide usarlo<\/td>\n<\/tr>\n<tr>\n<td>Riego y agua del valle<\/td>\n<td><a class=\"x\" data-b=\"RIE\" data-c=\"1\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em>, cap. 2<\/a> a 4; <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa<\/em>, cap. 1<\/a><\/td>\n<\/tr>\n<tr>\n<td>Armas, caza y pesca (si la comunidad las tiene)<\/td>\n<td><a class=\"x\" data-b=\"ARM\" data-c=\"0\" data-s=\"0\"><em>Armas, caza y pesca<\/em><\/a> completo<\/td>\n<\/tr>\n<tr>\n<td>Despensa y cocina comunitaria<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em><\/a> completo; Nutrición<\/td>\n<\/tr>\n<tr>\n<td>Construcción y taller<\/td>\n<td><a class=\"x\" data-b=\"CAS\" data-c=\"4\" data-s=\"0\"><em>Casa<\/em>, cap. 5<\/a> a 7<\/td>\n<\/tr>\n<tr>\n<td>Escuela<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"2\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 3<\/a>; todos los libros para leer en voz alta<\/td>\n<\/tr>\n<tr>\n<td>Seguridad, comunicaciones, incendios y emergencias del valle<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 6<\/a> y 7; <a class=\"x\" data-b=\"CAS\" data-c=\"3\" data-s=\"0\"><em>Casa<\/em>, cap. 4<\/a>; <a class=\"x\" data-b=\"RIE\" data-c=\"0\" data-s=\"0\"><em>Riesgos y recursos del Alto Valle<\/em><\/a><\/td>\n<\/tr>\n<tr>\n<td>Registro y asamblea<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\"><em>Familia y comunidad<\/em>, cap. 4<\/a> y 8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},{"t":"¿Qué libro abro? Índice general de temas","s":[{"t":"","h":"<p>Ordenado alfabéticamente. Las abreviaturas son: <strong>MM T1 / MM T2<\/strong> = Manual médico, tomos 1 y 2 (número de entrada); <strong><a class=\"x\" data-b=\"NUT\" data-c=\"0\" data-s=\"0\">NUT<\/a><\/strong> = Nutrición ovolactovegetariana (número de sección); <strong><a class=\"x\" data-b=\"GAL\" data-c=\"0\" data-s=\"0\">GAL<\/a><\/strong> = Manual de gallinas ponedoras; <strong><a class=\"x\" data-b=\"CAB\" data-c=\"0\" data-s=\"0\">CAB<\/a><\/strong> = Cabras lecheras y queso; <strong>PRO<\/strong> = <a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\"><em>Producir alimentos<\/em><\/a>; <strong>DES<\/strong> = <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em><\/a>; <strong>CAS<\/strong> = <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em><\/a>; <strong>CON<\/strong> = <a class=\"x\" data-b=\"CON\" data-c=\"0\" data-s=\"0\"><em>Conejos: cría de último recurso<\/em><\/a>; <strong>RIE<\/strong> = <a class=\"x\" data-b=\"RIE\" data-c=\"0\" data-s=\"0\"><em>Riesg r>\n<td>Torno de pértiga<\/td>\n<td><a class=\"x\" data-b=\"CAS\" data-c=\"5\" data-s=\"0\">CAS 6<\/a><\/td>\n<\/tr>\n<tr>\n<td>Trabajo pesado sin lesionarse<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">COM 4<\/a><\/td>\n<\/tr>\n<tr>\n<td>Trabajo: turnos y reparto<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">COM 4<\/a> · <a class=\"x\" data-b=\"COM\" data-c=\"7\" data-s=\"0\">COM 8<\/a><\/td>\n<\/tr>\n<tr>\n<td>Trigo: variedades<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"4\" data-s=\"0\">PRO 5<\/a><\/td>\n<\/tr>\n<tr>\n<td>Triquinosis y jabalí<\/td>\n<td><a class=\"x\" data-b=\"ARM\" data-c=\"4\" data-s=\"0\">ARM 5<\/a> · MM T1 4.40<\/td>\n<\/tr>\n<tr>\n<td>Tucuras y langostas<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"8\" data-s=\"0\">PRO 9<\/a><\/td>\n<\/tr>\n<tr>\n<td>Vaca lechera, ovejas<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"6\" data-s=\"0\">PRO 7<\/a><\/td>\n<\/tr>\n<tr>\n<td>Vacunas<\/td>\n<td>MM T2 18.11<\/td>\n<\/tr>\n<tr>\n<td>Varroa y enfermedades de las abejas<\/td>\n<td><a class=\"x\" data-b=\"ABE\" data-c=\"6\" data-s=\"0\">ABE 7<\/a><\/td>\n<\/tr>\n<tr>\n<td>Verduras y hierbas en sal<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"3\" data-s=\"0\">DES 4<\/a><\/td>\n<\/tr>\n<tr>\n<td>Viento fuerte, Zonda y polvo<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"6\" data-s=\"0\">COM 7<\/a><\/td>\n<\/tr>\n<tr>\n<td>Yogur, kéfir y ricota<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"7\" data-s=\"0\">DES 8<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},{"t":"Prepararse por etapas","s":[{"t":"","h":"<p>La preparación se hace de a poco y en orden. Esta lista junta lo que piden todos los libros de la biblioteca, por etapas.<\/p>"},{"t":"Esta semana","h":"<h3>Esta semana<\/h3>\n<ul>\n<li>☐ Agua: bidones aptos para alimentos con 4 litros por persona por día para 2 semanas; lavandina apta para agua.<\/li>\n<li>☐ Imprimir esta biblioteca, o por lo menos el Manual médico T1 y <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\"><em>Familia y comunidad<\/em> cap. 1<\/a>.<\/li>\n<li>☐ Mochila de evacuación por persona <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\">COM 1<\/a>.<\/li>\n<li>☐ Fósforos, encendedores y dos varillas de ferrocerio; linternas y pilas.<\/li>\n<li>☐ Medicación crónica de cada persona para por lo menos un mes <span class=\"ref\">►<\/span> MM T2 14.6.<\/li>\n<li>☐ Plan familiar: punto de encuentro, contacto lejano, quién busca a los chicos <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\">COM 1<\/a>.<\/li>\n<\/ul>"},{"t":"Este mes","h":"<h3>Este mes<\/h3>\n<ul>\n<li>☐ Despensa para 3 meses según <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\">DES 1<\/a>, con vitamina B12, vitamina D y sal yodada.<\/li>\n<li>☐ Semillas de polinización abierta de todas las verduras, más legumbres y papas para semilla <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"3\" data-s=\"0\">PRO 4<\/a>.<\/li>\n<li>☐ Botiquín básico <span class=\"ref\">►<\/span> MM T1 bloque 10.<\/li>\n<li>☐ Molino manual de granos y olla a presión.<\/li>\n<li>☐ Radio a pilas o a manivela; mapas en papel de la zona; brújula.<\/li>\n<li>☐ Filtro de agua o materiales para el filtro de arena <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\">CAS 1<\/a>.<\/li>\n<li>☐ Conocer a los vecinos: quién sabe qué <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">COM 4<\/a>.<\/li>\n<\/ul>"},{"t":"En seis meses","h":"<h3>En seis meses<\/h3>\n<ul>\n<li>☐ Huerta funcionando y primer banco de semillas propio.<\/li>\n<li>☐ Gallinas <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"GAL\" data-c=\"0\" data-s=\"0\">GAL<\/a>.<\/li>\n<li>☐ Despensa para un año.<\/li>\n<li>☐ Herramientas manuales con cabos de repuesto, piedras de afilar, kit de costura <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"5\" data-s=\"0\">CAS 6<\/a> y 8.<\/li>\n<li>☐ Frascos, tapas, ácido cítrico y, si se puede, una envasadora a presión <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"DES\" data-c=\"2\" data-s=\"0\">DES 3<\/a>.<\/li>\n<li>☐ Un curso de primeros auxilios y uno de huerta <span class=\"ref\">►<\/span> MM T2 20.9.<\/li>\n<li>☐ Simulacros en familia <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\">COM 1<\/a>.<\/li>\n<\/ul>"},{"t":"En un año","h":"<h3>En un año<\/h3>\n<ul>\n<li>☐ Frutales plantados <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"PRO\" data-c=\"5\" data-s=\"0\">PRO 6<\/a>.<\/li>\n<li>☐ Cabras o acuerdo con quien las tenga <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAB\" data-c=\"0\" data-s=\"0\">CAB<\/a>.<\/li>\n<li>☐ Captación de agua de lluvia, pozo o acceso seguro a agua sin red <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\">CAS 1<\/a>.<\/li>\n<li>☐ Baño seco armado <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"1\" data-s=\"0\">CAS 2<\/a>.<\/li>\n<li>☐ Estufa o cocina de bajo consumo <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"2\" data-s=\"0\">CAS 3<\/a>.<\/li>\n<li>☐ Equipo solar de 12 V <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"6\" data-s=\"0\">CAS 7<\/a>.<\/li>\n<li>☐ Comunidad organizada con asamblea, responsables y banco de semillas común <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">COM 4<\/a>.<\/li>\n<\/ul>"}]},{"t":"Conservar la biblioteca sin internet ni electricidad","s":[{"t":"","h":"<p>Una biblioteca que solo existe en una computadora o en la nube desaparece el día que se corta la luz. Estos libros se pensaron para el papel.<\/p>"},{"t":"Imprimir","h":"<h3>Imprimir<\/h3>\n<ul>\n<li><strong>Prioridad de impresión:<\/strong> 1) Manual médico T1; 2) <a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\"><em>Familia y comunidad<\/em><\/a>; 3) <a class=\"x\" data-b=\"CAS\" data-c=\"0\" data-s=\"0\"><em>Casa, agua, energía y oficios<\/em>, cap. 1<\/a> a 4; 4) Nutrición y <a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\"><em>Despensa y cocina<\/em><\/a>; 5) el resto.<\/li>\n<li><strong>Papel:<\/strong> de 80 g o más, impreso a doble faz. Tinta de impresora láser (tóner): no se corre con la humedad como la de chorro de tinta.<\/li>\n<li><strong>Encuadernación:<\/strong> anillado o carpeta de anillos, para que el libro quede abierto sobre la mesa y se puedan sacar las plantillas para fotocopiar. Tapas de cartón grueso o de plástico.<\/li>\n<li><strong>Plantillas:<\/strong> imprimir varias copias en blanco de cada una.<\/li>\n<\/ul>"},{"t":"Guardar","h":"<h3>Guardar<\/h3>\n<ul>\n<li>En una caja plástica con tapa hermética, con bolsitas de sílice o de arroz tostado contra la humedad, lejos del piso y de las goteras.<\/li>\n<li><strong>Dos copias:<\/strong> una en uso y otra guardada en otra casa o en el banco de semillas común. Una inundación o un incendio no pueden llevarse las dos.<\/li>\n<li>Las hojas más usadas (tablas de agua, botulismo, emergencias) se pueden plastificar o meter en folios.<\/li>\n<\/ul>"},{"t":"Copias digitales","h":"<h3>Copias digitales<\/h3>\n<ul>\n<li>Mientras haya electricidad, guardar los PDF en dos o tres pendrives o tarjetas de memoria, en distintos lugares, y en un teléfono o lector de libros electrónicos viejo que se cargue con un panel solar chico <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"CAS\" data-c=\"6\" data-s=\"0\">CAS 7<\/a>.<\/li>\n<li>Revisar una vez por año que los archivos abran.<\/li>\n<li>Imprimir también las guías gratuitas que recomiendan los libros: cartillas del INTA, la guía de envasado del USDA, el Manual Esfera, Donde no hay doctor <span class=\"ref\">►<\/span> <a class=\"x\" data-b=\"NUT\" data-c=\"9\" data-s=\"0\">NUT 9<\/a>.<\/li>\n<\/ul>"}]},{"t":"Medidas y equivalencias","s":[{"t":"","h":"<table>\n<thead>\n<tr>\n<th>Medida casera<\/th>\n<th>Equivale aproximadamente a<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>20 gotas<\/td>\n<td>1 ml<\/td>\n<\/tr>\n<tr>\n<td>1 cucharadita<\/td>\n<td>5 ml<\/td>\n<\/tr>\n<tr>\n<td>1 cuchara sopera<\/td>\n<td>10 a 15 ml<\/td>\n<\/tr>\n<tr>\n<td>1 taza<\/td>\n<td>250 ml<\/td>\n<\/tr>\n<tr>\n<td>1 taza de harina<\/td>\n<td>130 g<\/td>\n<\/tr>\n<tr>\n<td>1 taza de azúcar<\/td>\n<td>200 g<\/td>\n<\/tr>\n<tr>\n<td>1 cucharadita de sal<\/td>\n<td>6 g<\/td>\n<\/tr>\n<tr>\n<td>1 litro de agua<\/td>\n<td>1 kg (sirve para controlar una balanza)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Para jabón, conservas acidificadas, quesos y medicamentos, usar siempre balanza o jeringa: las cucharas varían mucho <span class=\"ref\">►<\/span> MM T2 15.17.<\/p>\n<table>\n<thead>\n<tr>\n<th>Cómo se ve o se siente el agua<\/th>\n<th>Temperatura aproximada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No se siente ni fría ni caliente en la muñeca<\/td>\n<td>37 °C (tibia, para bebés y fermentos)<\/td>\n<\/tr>\n<tr>\n<td>Se aguanta el dedo adentro unos segundos<\/td>\n<td>43 a 45 °C (yogur, jabón)<\/td>\n<\/tr>\n<tr>\n<td>Burbujitas en el fondo, el dedo no se aguanta<\/td>\n<td>65 a 75 °C (pasteurizar)<\/td>\n<\/tr>\n<tr>\n<td>Vapor y burbujas que suben sin romper el hervor<\/td>\n<td>85 a 90 °C (ricota)<\/td>\n<\/tr>\n<tr>\n<td>Hervor fuerte<\/td>\n<td>100 °C al nivel del mar (menos en altura)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Otras equivalencias<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 hectárea<\/td>\n<td>10.000 m² (un cuadrado de 100 × 100 m)<\/td>\n<\/tr>\n<tr>\n<td>1 mm de lluvia sobre 1 m²<\/td>\n<td>1 litro<\/td>\n<\/tr>\n<tr>\n<td>1 m³<\/td>\n<td>1.000 litros<\/td>\n<\/tr>\n<tr>\n<td>1 libra por pulgada cuadrada (psi)<\/td>\n<td>0,07 bar · 6,9 kPa<\/td>\n<\/tr>\n<tr>\n<td>1 pulgada<\/td>\n<td>2,54 cm<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]},{"t":"Las 200 habilidades: dónde está cada una","s":[{"t":"","h":"<p>La biblioteca nació de una lista de 200 habilidades de autosuficiencia, adaptada a una dieta ovolactovegetariana y a lo que se consigue en Argentina. Esta tabla dice dónde quedó cada una.<\/p>\n<table>\n<thead>\n<tr>\n<th>Habilidades<\/th>\n<th>Tema<\/th>\n<th>Dónde<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 a 12, 14<\/td>\n<td>Conservas, fermentos, secado y ahumado<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"2\" data-s=\"0\">DES 3<\/a> y 4<\/td>\n<\/tr>\n<tr>\n<td>13, 16 a 18<\/td>\n<td>Ghee, guardar sin heladera, huevos<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"4\" data-s=\"0\">DES 5<\/a><\/td>\n<\/tr>\n<tr>\n<td>19, 20<\/td>\n<td>Harina de legumbres, despensa y rotación<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"3\" data-s=\"0\">DES 4<\/a> y 1<\/td>\n<\/tr>\n<tr>\n<td>21 a 23, 38, 40<\/td>\n<td>Pan, masa madre, tortas fritas, pasta<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"6\" data-s=\"0\">DES 7<\/a><\/td>\n<\/tr>\n<tr>\n<td>24 a 27<\/td>\n<td>Lácteos y quesos<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"7\" data-s=\"0\">DES 8<\/a> · <a class=\"x\" data-b=\"CAB\" data-c=\"0\" data-s=\"0\">CAB<\/a><\/td>\n<\/tr>\n<tr>\n<td>28 a 31, 32<\/td>\n<td>Horno de barro, cocina solar, olla de hierro, caja térmica, legumbres<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"5\" data-s=\"0\">DES 6<\/a><\/td>\n<\/tr>\n<tr>\n<td>33 a 37, 73, 74<\/td>\n<td>Seitán, hamburguesas, pastas de maní, vinagre, sidra y vino, brotes, tofu<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"8\" data-s=\"0\">DES 9<\/a><\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>Moler granos<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"4\" data-s=\"0\">PRO 5<\/a><\/td>\n<\/tr>\n<tr>\n<td>41 a 53, 57 a 60<\/td>\n<td>Huerta<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"0\" data-s=\"0\">PRO 1<\/a> a 3<\/td>\n<\/tr>\n<tr>\n<td>44<\/td>\n<td>Semillas<\/td>\n<td><a class=\"x\" data-b=\"PRO\" data-c=\"3\" data-s=\"0\">PRO 4<\/a><\/td>\n<\/tr>\n<tr>\n<td>54 a 56<\/td>\n<td>Injert d>167 a 171<\/td>\n<td>Ropa, lana, tejido y calzado<\/td>\n<td><a class=\"x\" data-b=\"CAS\" data-c=\"7\" data-s=\"0\">CAS 8<\/a><\/td>\n<\/tr>\n<tr>\n<td>181, 182, 197, 198<\/td>\n<td>Plan de emergencia, mochila, mascotas, evacuación<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"0\" data-s=\"0\">COM 1<\/a><\/td>\n<\/tr>\n<tr>\n<td>183<\/td>\n<td>Despensa para 3 meses<\/td>\n<td><a class=\"x\" data-b=\"DES\" data-c=\"0\" data-s=\"0\">DES 1<\/a><\/td>\n<\/tr>\n<tr>\n<td>184, 185, 188 a 190<\/td>\n<td>Orientación, clima, inundaciones y sequías<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"6\" data-s=\"0\">COM 7<\/a><\/td>\n<\/tr>\n<tr>\n<td>186, 187, 191<\/td>\n<td>Comunicaciones, señales, seguridad<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"5\" data-s=\"0\">COM 6<\/a><\/td>\n<\/tr>\n<tr>\n<td>192, 194<\/td>\n<td>Trueque y economía<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"4\" data-s=\"0\">COM 5<\/a><\/td>\n<\/tr>\n<tr>\n<td>193, 195, 196<\/td>\n<td>Red de vecinos, inventario, documentos<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"3\" data-s=\"0\">COM 4<\/a><\/td>\n<\/tr>\n<tr>\n<td>199<\/td>\n<td>Enseñar a los chicos<\/td>\n<td><a class=\"x\" data-b=\"COM\" data-c=\"2\" data-s=\"0\">COM 3<\/a><\/td>\n<\/tr>\n<tr>\n<td>200<\/td>\n<td>Manejar el estrés<\/td>\n<td>MM T1 bloque 8 · MM T2 18.13<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}]}]},{"id":"NUT","title":"Nutrición ovolactovegetariana","sub":"Requerimientos, nutrientes críticos, despensa","color":"#7a8a2e","kind":"pdf","c":[{"t":"Portada y contenido","s":[{"t":"Primeras páginas","h":"<div class=\"pg\">pág. 1<\/div>\n<p>BIBLIOTECA DE SUPERVIVENCIA · NUTRICIÓN<\/p>\n<p>Nutrición ovolactovegetariana en escenario de colapso Compilado científico: requerimientos, carencias, despensa, producción propia y bibliografía para la biblioteca offline<\/p>\n<p>Hernán · Villa Regina, Río Negro · Noviembre 2026<\/p>\n<div class=\"pg\">pág. 2<\/div>\n<p>Índice<\/p>\n<p>1. Resumen: las siete reglas .............................................................................................................................. 3<\/p>\n<p>2. Base científica.................................................................................................................................................... 4 Requerimientos de planificación ............................................................................................................................... 4 Cómo armar la proteína ............................................................................................................................................... 4<\/p>\n<p>3. Nutrientes críticos y dónde conseguirlos .............................................................................................. 5<\/p>\n<p>4. Enfermedades carenciales: reconocerlas y evitarlas ...................................................................... 6<\/p>\n<p>5. Despensa de largo plazo .............................................................................................................................. 7 Herramientas que hacen comestible la despensa .................................................................................................. 7<\/p>\n<p>6. Producción propia en el Alto Valle ........................................................................................................... 8 Cultivos base ................................................................................................................................................................... 8 Animales para huevo y leche ...................................................................................................................................... 8 Conservar sin heladera ................................................................................................................................................ 8<\/p>\n<p>7. Grupos con necesidades especiales ..................................................................................................... 10<\/p>\n<p>8. Seguridad alimentaria: lo que mata más rápido que la carencia ............................................11<\/p>\n<p>9. Bibliografía para la biblioteca offline ..................................................................................................... 12 Descarga gratuita ......................................................................................................................................................... 12 Libros para comprar .................................................................................................................................................... 12<\/p>\n<div class=\"pg\">pág. 3<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"1. Resumen: las siete reglas","s":[{"t":"1. Resumen: las siete reglas","n":"1","h":"<p>Una dieta ovolactovegetariana puede sostener a una familia sana durante un colapso largo, siempre que se cumplan estas reglas. Las secciones siguientes explican el porqué y el cómo de cada una.<\/p>\n<p>1. Almacenar B12 (cianocobalamina), vitamina D y sal yodada. Son las tres carencias que la comida ovolacto no cubre con seguridad.<br>2. Vitamina C fresca todas las semanas: rosa mosqueta, brotes, papa, chucrut. El escorbuto llega en 2–3 meses.<br>3. Cereal + legumbre todos los días, en proporción aproximada 3:1, más huevo y lácteos para la proteína completa.<br>4. Despensa mínima por adulto y año: 180 kg de granos, 40–50 kg de legumbres, 25–35 kg de leche en polvo, 10 L de aceite, 27 kg de azúcar o miel, 5 kg de sal yodada. También molino manual y olla a presión.<br>5. Producir lo que dura: papa, zapallo, porotos, maíz, gallinas y, si se puede, cabras.<br>6. Los huevos y la leche van primero a embarazadas, bebés y niños.<br>7. Seguridad antes que nutrición: hervir la leche y el agua, envasar verduras solo con olla a presión, no comer plantas dudosas.<\/p>\n<p>No reemplaza a un médico ni a un nutricionista: las cifras son valores de referencia para planificar, no indicaciones individuales.<\/p>\n<div class=\"pg\">pág. 4<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"2. Base científica","s":[{"t":"2. Base científica","n":"2","h":"<p>Una dieta ovolactovegetariana bien planificada es nutricionalmente adecuada para adultos: es la posición vigente (2025–2032) de la Academy of Nutrition and Dietetics, la mayor organización de nutricionistas del mundo. El riesgo en un colapso no es la dieta en sí, sino la monotonía y la falta de suplementos: los brotes de escorbuto, pelagra y beriberi aparecen en poblaciones que dependen de pocos alimentos (OMS).<\/p>\n<p>Requerimientos de planificación<\/p>\n<div class=\"pre\">Parámetro   ·   Valor de referencia   ·   Nota para colapso<\/div>\n<div class=\"pre\">Energía   ·   2.100 kcal/persona/día (cifra de   ·   Trabajo físico pesado: 3.000–3.500 kcal. Frío: sumar ~100 kcal<br>planificación OMS/Esfera)   ·   por cada 5 °C bajo 20 °C<\/div>\n<div class=\"pre\">Proteína   ·   0,8 g/kg/día (adulto)   ·   Usar 0,9–1,0 g/kg en ovolacto por menor digestibilidad vegetal:<br>~60–75 g/día para 70 kg<\/div>\n<div class=\"pre\">Grasa   ·   ≥17 % de las kcal en emergencia; ideal 20–   ·   Aceite almacenado + lácteos enteros + frutos secos<br>35 %<\/div>\n<div class=\"pre\">Agua   ·   2,5–3 L bebida; 15 L/día totales (Esfera)   ·   Más con calor o trabajo<\/div>\n<p>Cómo armar la proteína<\/p>\n<p>• Cereales son pobres en lisina; legumbres son pobres en metionina. Combinarlos durante el día (no hace falta en el mismo plato) da proteína completa: guiso de lentejas con arroz, polenta con porotos, pan con hummus.<br>• Huevo y lácteos tienen la proteína de mayor calidad (PDCAAS ≈1,0). Uno o dos huevos y medio litro de leche o equivalente cubren buena parte de la lisina diaria.<br>• Proporción práctica de la despensa: 3–4 partes de cereal por 1 de legumbre, en peso seco.<\/p>\n<p>Valores de energía y agua tomados del Manual Esfera y el manual OMS de emergencias; el resto son referencias estándar (IOM/OMS) y conviene verificarlas contra la bibliografía de la última sección.<\/p>\n<div class=\"pg\">pág. 5<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"3. Nutrientes críticos y dónde conseguirlos","s":[{"t":"3. Nutrientes críticos y dónde conseguirlos","n":"3","h":"<p>La vitamina B12 es el punto más débil: un estudio clásico advierte que lácteos y huevos no alcanzan por sí solos para cubrirla, y otros reportan déficit en cerca de la mitad de los ovolactovegetarianos estudiados (Pawlak). Todo lo demás se resuelve con comida variada y bien preparada.<\/p>\n<div class=\"pre\">Fuentes ovolacto en<br>Nutriente   ·   Meta diaria adulto   ·   Truco práctico<br>colapso<\/div>\n<div class=\"pre\">Vitamina   ·   2,4 µg   ·   Leche (~1 µg/250 ml),   ·   Almacenar cianocobalamina: es la forma más<br>B12   ·   queso, huevo (absorción   ·   estable. Pauta habitual: 50 µg/día o 2.000 µg/<br>baja)   ·   semana. Un frasco de 1.000 comprimidos dura<br>años<\/div>\n<div class=\"pre\">Hierro   ·   Hombre 14 mg, mujer   ·   Lentejas, porotos,   ·   Comer con vitamina C (mosqueta, tomate,<br>fértil 33 mg (1,8× lo   ·   garbanzos, avena,   ·   morrón). Nada de té, mate ni café una hora antes<br>estándar por el hierro   ·   semillas de zapallo,   ·   o después. Remojar, germinar y fermentar baja<br>vegetal)   ·   acelga, espinaca   ·   los fitatos<\/div>\n<div class=\"pre\">Zinc   ·   Hasta 50 % más que lo   ·   Legumbres, granos   ·   Pan de masa madre y legumbres germinadas<br>estándar (~12–16 mg)   ·   integrales, queso,   ·   mejoran la absorción<br>semillas, huevo<\/div>\n<div class=\"pre\">Proteína   ·   60–75 g   ·   Legumbres, huevo, leche,   ·   Ver combinación cereal + legumbre en la sección<br>(lisina)   ·   queso   ·   anterior<\/div>\n<div class=\"pre\">Omega-3   ·   1,1–1,6 g   ·   Lino molido, chía, nueces,   ·   Moler el lino en el momento: entero no se absorbe<br>(ALA)   ·   aceite de canola   ·   y molido se enrancia. Gallinas alimentadas con<br>lino dan huevos con más omega-3<\/div>\n<div class=\"pre\">Yodo   ·   150 µg (embarazo 220–   ·   Sal yodada, lácteos,   ·   Almacenar sal yodada en frasco hermético y<br>250)   ·   huevo   ·   oscuro: pierde yodo con humedad y luz. ~5 g de<br>sal yodada/día cubre la meta<\/div>\n<div class=\"pre\">Vitamina D   ·   15 µg (600 UI)   ·   Sol en piel, yema de   ·   En Villa Regina (39 °S) la síntesis cae mucho de<br>huevo, manteca   ·   mayo a agosto. Suplemento almacenado o 15–30<br>min de sol de mediodía en brazos y cara en<br>verano<\/div>\n<div class=\"pre\">Calcio   ·   1.000 mg   ·   Leche, yogur, queso,   ·   Medio litro de leche + 30 g de queso cubren ~80 %<br>semillas de sésamo,<br>acelga, mosqueta<\/div>\n<div class=\"pre\">Vitamina C   ·   75–90 mg   ·   Rosa mosqueta (500–   ·   Ver escorbuto en la sección siguiente<br>2.200 mg/100 g), brotes,<br>papa, repollo, morrón<\/div>\n<div class=\"pre\">Riboflavina   ·   1,1–1,3 mg   ·   Lácteos, huevo, brotes   ·   Guardar la leche al oscuro: la luz la destruye<br>(B2)<\/div>\n<p>Los datos de rosa mosqueta salen del currículum de Chile y de Alimentos Argentinos; las metas diarias son ingestas de referencia IOM/OMS.<\/p>\n<div class=\"pg\">pág. 6<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"4. Enfermedades carenciales: reconocerlas y","s":[{"t":"4. Enfermedades carenciales: reconocerlas y","n":"4","h":"<p>evitarlas<\/p>\n<p>El escorbuto aparece 2–3 meses después de cortar la vitamina C y, sin tratar, mata; es la amenaza más rápida en una despensa de granos secos. Las demás tardan más, pero todas se previenen con variedad.<\/p>\n<div class=\"pre\">Riesgo en<br>Enfermedad   ·   Falta   ·   Primeros signos   ·   Prevención con lo que hay<br>ovolacto<\/div>\n<div class=\"pre\">Escorbuto   ·   Vitamina C   ·   Cansancio, encías que   ·   Alto si solo hay   ·   Rosa mosqueta (fresca o seca a la<br>sangran, moretones,   ·   granos,   ·   sombra), brotes de lenteja o alfalfa<br>heridas que no cierran,   ·   legumbres y leche   ·   (3–5 días), papa con cáscara,<br>puntos rojos alrededor del   ·   en polvo   ·   chucrut crudo, malezas como<br>vello   ·   diente de león y verdolaga<\/div>\n<div class=\"pre\">Pelagra   ·   Niacina /   ·   Piel quemada y oscura   ·   Bajo con huevo y   ·   Nixtamalizar el maíz con cal o<br>triptófano   ·   donde da el sol, diarrea,   ·   lácteos; alto si la   ·   ceniza; sumar huevo, queso, maní,<br>confusión (&quot;las 3 D&quot;)   ·   base es maíz sin   ·   legumbres (OMS)<br>tratar<\/div>\n<div class=\"pre\">Beriberi   ·   Tiamina   ·   Piernas pesadas,   ·   Medio si se come   ·   Granos integrales, avena,<br>(B1)   ·   hormigueo, hinchazón,   ·   arroz blanco o   ·   legumbres, semillas de girasol; no<br>palpitaciones   ·   harina blanca   ·   tirar el agua de cocción<\/div>\n<div class=\"pre\">Xeroftalmía   ·   Vitamina A   ·   Ceguera nocturna, ojo seco   ·   Bajo con   ·   Zapallo, zanahoria, hojas verde<br>manteca, yema y   ·   oscuro, yema, manteca<br>zapallo<\/div>\n<div class=\"pre\">Anemia   ·   Hierro, B12,   ·   Palidez, cansancio, falta de   ·   Medio (mujeres,   ·   Ver tabla de hierro y B12<br>folato   ·   aire   ·   niños)<\/div>\n<div class=\"pre\">Bocio /   ·   Yodo   ·   Cuello agrandado; en   ·   Alto si se acaba la   ·   Reserva generosa de sal yodada<br>cretinismo   ·   embarazo, daño cerebral al   ·   sal yodada   ·   bien cerrada<br>feto<\/div>\n<div class=\"pre\">Raquitismo /   ·   Vitamina D,   ·   Dolor de huesos, piernas   ·   Medio en invierno   ·   Sol, yema, lácteos<br>osteomalacia   ·   calcio   ·   arqueadas en niños<\/div>\n<div class=\"pre\">Desnutrición   ·   Calorías y   ·   Pérdida de peso, en niños:   ·   Depende de la   ·   Medir perímetro de brazo en niños;<br>proteico-   ·   proteína   ·   hinchazón (kwashiorkor) o   ·   cantidad total   ·   priorizar huevo y leche para ellos<br>energética   ·   emaciación (marasmo)<\/div>\n<p>Los manuales OMS sobre escorbuto, pelagra y tiamina tienen el tratamiento detallado; también los capítulos 13–22 del libro de Latham (FAO).<\/p>\n<div class=\"pg\">pág. 7<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"5. Despensa de largo plazo","s":[{"t":"5. Despensa de largo plazo","n":"5","h":"<p>Para un adulto durante un año, la base clásica de almacenamiento es 181 kg de granos, 27 kg de legumbres, 7 kg de leche en polvo, 9 L de aceite, 27 kg de azúcar o miel y 3,6 kg de sal, que rinde unas 2.500 kcal/día. Para ovolacto conviene subir legumbres y leche, porque reemplazan la carne de esa lista.<\/p>\n<div class=\"pre\">Cantidad<br>Vida útil bien<br>Alimento   ·   básica/   ·   Ajuste ovolacto recomendado   ·   Cómo guardarlo<br>almacenado<br>adulto/año<\/div>\n<div class=\"pre\">Trigo en grano, arroz   ·   181 kg   ·   Igual; mezclar tipos para evitar   ·   Trigo y arroz blanco:   ·   Baldes alimentarios con<br>blanco, maíz seco,   ·   monotonía   ·   25–30 años; avena:   ·   bolsa metálica y<br>avena, fideos   ·   20–30; fideos: 20+   ·   absorbedor de oxígeno;<br>humedad menor a 12 %<\/div>\n<div class=\"pre\">Legumbres secas   ·   27 kg   ·   Subir a 40–50 kg   ·   10–30 años; con los   ·   Igual que granos. Las<br>(lentejas, porotos,   ·   años se ponen duras   ·   viejas se ablandan con<br>garbanzos, arvejas   ·   olla a presión y una<br>partidas)   ·   pizca de bicarbonato<\/div>\n<div class=\"pre\">Leche en polvo   ·   7 kg   ·   Subir a 25–35 kg (~1 vaso diario   ·   Descremada   ·   Lata o bolsa sellada,<br>descremada   ·   ya es la cifra básica)   ·   envasada al vacío:   ·   fresco y oscuro<br>15–20 años; entera:<br>menos de 1 año<\/div>\n<div class=\"pre\">Aceite   ·   9L   ·   10–12 L + frutos secos   ·   1–2 años (rotar)   ·   Oscuro y fresco; rancio<br>= descartar<\/div>\n<div class=\"pre\">Azúcar o miel   ·   27 kg   ·   Igual   ·   Indefinida   ·   Seco, cerrado<\/div>\n<div class=\"pre\">Sal yodada   ·   3,6 kg   ·   5 kg (también sirve para   ·   Sal: indefinida; yodo:   ·   Frasco hermético<br>conservar)   ·   baja con humedad   ·   oscuro<\/div>\n<div class=\"pre\">Semillas para   ·   —   ·   5–10 kg   ·   3–5 años   ·   Fresco y seco<br>germinar (alfalfa,<br>lenteja, trigo, poroto<br>mung)<\/div>\n<div class=\"pre\">Semillas de huerta   ·   —   ·   Un kit completo por familia   ·   2–5 años según   ·   Frío, seco, frascos<br>de polinización   ·   especie<br>abierta<\/div>\n<div class=\"pre\">Lino, chía   ·   —   ·   3–5 kg   ·   Entero: 1–2 años   ·   Moler al usar<\/div>\n<div class=\"pre\">Suplementos   ·   —   ·   B12 (cianocobalamina),   ·   2–5 años; pierden   ·   Oscuro y seco<br>vitamina D, vitamina C,   ·   potencia lentamente<br>multivitamínico prenatal si hay<br>mujeres fértiles<\/div>\n<p>Herramientas que hacen comestible la despensa<\/p>\n<p>• Molino manual de grano: sin él, 181 kg de trigo valen poco.<br>• Olla a presión: reduce 60–70 % el combustible para legumbres.<br>• Fuente de cocción sin red: cocina solar, cocina rocket, horno de barro.<br>• Gorgojos: congelar el grano 72 horas antes de envasar, o usar absorbedores de oxígeno.<\/p>\n<p>Las vidas útiles son las que informan los estudios de almacenamiento de la Universidad Brigham Young y las guías de extensión de UC; son aproximadas y dependen de mantener la temperatura por debajo de 20 °C.<\/p>\n<div class=\"pg\">pág. 8<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"6. Producción propia en el Alto Valle","s":[{"t":"6. Producción propia en el Alto Valle","n":"6","h":"<p>La despensa compra tiempo; la producción es lo que sostiene. Según un técnico del INTA, una hectárea regada del Alto Valle puede alimentar a unas 60 personas, con la estacionalidad de la zona. Para una dieta ovolacto, la científica Carol Deppe propone cinco pilares de autosuficiencia: papa, maíz, porotos, zapallo y huevos.<\/p>\n<p>Cultivos base<\/p>\n<div class=\"pre\">Cultivo   ·   Por qué   ·   Notas para la zona<\/div>\n<div class=\"pre\">Papa   ·   Más calorías y proteína por hora de   ·   Guardar en lugar oscuro, fresco y<br>trabajo; aporta vitamina C   ·   ventilado; papa verde = tóxica<\/div>\n<div class=\"pre\">Zapallo (anco, plomo, cabutía)   ·   Vitamina A; dura 6+ meses sin   ·   Cosechar maduro antes de la primera<br>heladera   ·   helada<\/div>\n<div class=\"pre\">Porotos, lentejas, arvejas, habas   ·   Proteína y hierro; fijan nitrógeno   ·   Habas y arvejas se siembran en otoño y<br>aguantan frío<\/div>\n<div class=\"pre\">Maíz   ·   Calorías; alimento de gallinas   ·   Nixtamalizar para consumo humano<br>(evita pelagra)<\/div>\n<div class=\"pre\">Trigo, avena, cebada   ·   Cereal base   ·   Menos rinde por m² que papa y maíz; útil<br>a escala de chacra<\/div>\n<div class=\"pre\">Hojas (acelga, kale, repollo,   ·   Folato, calcio, vitamina C y A   ·   Repollo en chucrut = vitamina C todo el<br>espinaca)   ·   invierno<\/div>\n<div class=\"pre\">Frutales (manzana, pera,   ·   Ya están en el Valle   ·   Fruta seca al sol; nueces = grasa y<br>membrillo, nogal, almendro)   ·   omega-3<\/div>\n<div class=\"pre\">Rosa mosqueta   ·   Vitamina C en cantidad extrema   ·   Silvestre en la región; secar el fruto a la<br>sombra<\/div>\n<p>El tomate y otros cultivos sensibles se trasplantan en octubre–noviembre, con túnel o protección por las heladas tardías de septiembre. Los calendarios de siembra exactos están en el repositorio INTA (EEA Valle Inferior y Alto Valle).<\/p>\n<p>Animales para huevo y leche<\/p>\n<p>• Gallinas: una ponedora rinde 200–280 huevos el primer año y menos después. Calcular 4–6 gallinas por persona para un huevo diario. Comen ~120 g de alimento por día: compiten por grano, así que sumar pastoreo, restos de huerta y lombrices.<br>• Cabras lecheras: 2–3 L/día durante unos 10 meses, con menos forraje que una vaca. Necesitan preñarse cada año: hay que decidir qué hacer con los machos (trueque es lo usual para quien no come carne).<br>• Vaca: 10–20 L/día pero mucho forraje y agua. Tiene sentido entre varias familias.<\/p>\n<p>Conservar sin heladera<\/p>\n<p>• Quesos duros: guardan la leche por meses. El cuajo tradicional es animal; la flor de cardo (Cynara cardunculus) es un cuajo vegetal usado hace siglos en la península ibérica.<\/p>\n<div class=\"pg\">pág. 9<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>\n<p>• Ghee (manteca clarificada): dura meses a temperatura ambiente.<br>• Yogur y kéfir: alargan la leche unos días y aportan probióticos.<br>• Fermentados: chucrut, pickles, masa madre (además mejoran la absorción de hierro y zinc).<br>• Deshidratado solar: frutas, tomates, zapallo, hierbas.<br>• Brotes: lenteja, alfalfa, trigo en 3–5 días, con agua y un frasco. Es la vitamina C fresca más rápida en pleno invierno.<br>• Malezas comestibles: diente de león, verdolaga, ortiga, malva, quinoa silvestre. El libro de Rapoport describe 237 especies del Cono Sur.<\/p>\n<div class=\"pg\">pág. 10<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"7. Grupos con necesidades especiales","s":[{"t":"7. Grupos con necesidades especiales","n":"7","h":"<p>Embarazadas, bebés y niños pequeños son los primeros en sufrir una carencia y los que sufren el daño más permanente; los huevos y la leche disponibles deben ir primero a ellos. Las cifras son ingestas de referencia estándar (IOM/OMS), aproximadas.<\/p>\n<div class=\"pre\">Grupo   ·   Qué cambia   ·   Prioridad práctica<\/div>\n<div class=\"pre\">Embarazo   ·   +340 kcal (2.º trimestre), +450 (3.º); proteína ~71 g;   ·   Ácido fólico desde antes de concebir; B12 y yodo no<br>folato 600 µg; hierro 27 mg (más en   ·   negociables: su falta daña el cerebro del bebé<br>vegetarianas); yodo 220 µg; B12 2,6 µg<\/div>\n<div class=\"pre\">Lactancia   ·   +500 kcal; B12 2,8 µg; yodo 290 µg   ·   La leche materna con poca B12 deja al bebé sin B12:<br>suplementar a la madre<\/div>\n<div class=\"pre\">Bebé 0–6   ·   Solo leche materna   ·   Es el alimento de emergencia más seguro; la<br>meses   ·   fórmula exige agua segura y combustible<\/div>\n<div class=\"pre\">Bebé 6–12   ·   Alimentos ricos en hierro y densos en energía   ·   Puré de legumbres, yema, papilla de cereal con<br>meses   ·   manteca. Nada de miel (botulismo infantil) ni leche<br>de vaca como bebida principal<\/div>\n<div class=\"pre\">Niños 1–5   ·   Estómago chico: la dieta vegetal es voluminosa   ·   Sumar grasa (aceite, manteca, maní), huevo y<br>años   ·   leche; 5–6 comidas diarias; menos fibra gruesa<\/div>\n<div class=\"pre\">Adultos   ·   Proteína 1,0–1,2 g/kg; absorben peor la B12 de la   ·   B12 suplementada siempre; vitamina D; textura<br>mayores   ·   comida   ·   blanda si faltan dientes<\/div>\n<div class=\"pre\">Trabajo físico   ·   3.000–3.500 kcal o más   ·   Aumentar cereal y grasa, no solo legumbre; comer<br>pesado   ·   varias veces al día<\/div>\n<div class=\"pre\">Diarrea   ·   Pérdida de agua y sales   ·   Suero casero OMS: 1 L de agua segura + 6<br>cucharaditas rasas de azúcar + ½ cucharadita de<br>sal; seguir comiendo<\/div>\n<p>El capítulo de nutrición de Donde no hay doctor y Donde no hay doctor para mujeres explica estos casos en lenguaje simple.<\/p>\n<div class=\"pg\">pág. 11<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"8. Seguridad alimentaria: lo que mata más rápido","s":[{"t":"8. Seguridad alimentaria: lo que mata más rápido","n":"8","h":"<p>que la carencia<\/p>\n<p>En un colapso, una conserva mal hecha o un vaso de leche cruda pueden matar en días, mucho antes que cualquier déficit. Estas reglas no admiten atajos.<\/p>\n<div class=\"pre\">Riesgo   ·   Por qué importa   ·   Regla<\/div>\n<div class=\"pre\">Botulismo en   ·   Toxina invisible, sin olor ni sabor;   ·   Verduras, legumbres y caldos: solo con olla a presión según la<br>conservas   ·   las conservas caseras de verduras   ·   guía USDA. Tomate: agregar 20 g de ácido cítrico o 400 cm³ de<br>poco ácidas son la causa principal   ·   vinagre cada 10 kg (Mendoza). Antes de comer cualquier<br>(Gobierno de Río Negro)   ·   conserva casera, calentar a 80 °C por 10–20 minutos. Frasco con<br>tapa abombada: tirar sin probar<\/div>\n<div class=\"pre\">Leche cruda   ·   Brucelosis, tuberculosis, E. coli   ·   Hervir siempre, o 63 °C durante 30 minutos. Los quesos de leche<br>productora de toxina (síndrome   ·   cruda necesitan maduración larga<br>urémico hemolítico, muy frecuente<br>en Argentina en niños)<\/div>\n<div class=\"pre\">Huevos   ·   Salmonella   ·   No lavarlos hasta usarlos (conservan su cutícula protectora);<br>cocinar bien para niños, embarazadas y ancianos<\/div>\n<div class=\"pre\">Agua   ·   Diarrea, cólera, hepatitis   ·   Hervir 1 minuto; o 2 gotas de lavandina por litro y esperar 30<br>minutos; o botella PET transparente 6 horas al sol fuerte<\/div>\n<div class=\"pre\">Micotoxinas   ·   Granos y maní con moho   ·   Grano con olor a humedad o moho visible: no comer ni dar a las<br>producen aflatoxinas (dañan el   ·   gallinas. Secar bien antes de guardar<br>hígado)<\/div>\n<div class=\"pre\">Porotos crudos   ·   Lectinas que provocan vómitos   ·   Remojar y hervir a fuego fuerte al menos 10 minutos; nunca<br>o mal cocidos   ·   fuertes   ·   cocción lenta sin hervor previo<\/div>\n<div class=\"pre\">Papa verde o   ·   Solanina   ·   Pelar profundo y descartar lo verde<br>brotada<\/div>\n<div class=\"pre\">Plantas   ·   La cicuta (Conium maculatum) se   ·   Comer solo lo identificado con certeza total; ante la duda, no.<br>silvestres   ·   confunde con perejil o zanahoria   ·   Hongos silvestres: solo con experto<br>silvestre y es mortal<\/div>\n<p>La guía USDA de envasado casero (2015) tiene tiempos y presiones probados para cada alimento, con ajuste por altitud.<\/p>\n<div class=\"pg\">pág. 12<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>"}]},{"t":"9. Bibliografía para la biblioteca offline","s":[{"t":"9. Bibliografía para la biblioteca offline","n":"9","h":"<p>Los primeros doce títulos son descargas gratuitas y legales: bajarlos ya al pendrive. Los demás son libros comerciales que vale la pena comprar en papel o digital.<\/p>\n<p>Descarga gratuita<\/p>\n<div class=\"pre\">Título   ·   Autor / organismo   ·   Qué aporta   ·   Idioma<\/div>\n<div class=\"pre\">Vegetarian Dietary Patterns   ·   Academy of Nutrition   ·   La revisión científica vigente sobre dietas   ·   Inglés<br>for Adults (2025)   ·   and Dietetics   ·   vegetarianas<\/div>\n<div class=\"pre\">Vitamin B12 among   ·   Rizzo et al., Nutrients   ·   B12 en ovolacto: estado, diagnóstico,   ·   Inglés<br>Vegetarians   ·   2016   ·   suplementación<\/div>\n<div class=\"pre\">The Management of   ·   OMS / ACNUR / PMA /   ·   El manual técnico de referencia: requerimientos,   ·   Inglés<br>Nutrition in Major   ·   FICR   ·   raciones, carencias<br>Emergencies<\/div>\n<div class=\"pre\">Escorbuto y pelagra en   ·   OMS   ·   Prevención y tratamiento de cada enfermedad   ·   Inglés<br>emergencias<\/div>\n<div class=\"pre\">Manual Esfera 2018   ·   Asociación Esfera   ·   Normas mínimas de agua, alimentación y salud;   ·   Inglés /<br>hay versión en español en spherestandards.org   ·   español<\/div>\n<div class=\"pre\">Human Nutrition in the   ·   Michael Latham, FAO   ·   Tratado completo de nutrición en pobreza y   ·   Inglés<br>Developing World   ·   1997   ·   escasez, con tablas<\/div>\n<div class=\"pre\">Donde no hay doctor   ·   Hesperian   ·   Salud y nutrición sin médico; capítulos sueltos en   ·   Español<br>PDF<\/div>\n<div class=\"pre\">Donde no hay doctor para   ·   Hesperian   ·   Embarazo, lactancia, anemia   ·   Español<br>mujeres<\/div>\n<div class=\"pre\">Manual de aplicación de las   ·   Ministerio de Salud de   ·   Porciones y grupos de alimentos adaptados al país   ·   Español<br>Guías Alimentarias   ·   Argentina<\/div>\n<div class=\"pre\">Complete Guide to Home   ·   USDA   ·   Envasado seguro con tiempos probados   ·   Inglés<br>Canning (2015)<\/div>\n<div class=\"pre\">Malezas comestibles del   ·   Rapoport, Marzocca y   ·   237 plantas silvestres comestibles de la región   ·   Español<br>Cono Sur   ·   Drausal, INTA 2009<\/div>\n<div class=\"pre\">Calendarios de siembra   ·   INTA Patagonia Norte   ·   Qué sembrar y cuándo en los valles de Río Negro   ·   Español<br>INTA<\/div>\n<p>Libros para comprar<\/p>\n<div class=\"pre\">Título   ·   Autor   ·   Qué aporta<\/div>\n<div class=\"pre\">The Dietitian&#x27;s Guide to   ·   Reed Mangels, Virginia   ·   El texto técnico más completo sobre nutrición<br>Vegetarian Diets   ·   Messina, Mark Messina   ·   vegetariana<\/div>\n<div class=\"pre\">Becoming Vegetarian   ·   Vesanto Melina, Brenda Davis   ·   Versión práctica y accesible, con planes de comidas<br>ovolacto<\/div>\n<div class=\"pre\">The Resilient Gardener   ·   Carol Deppe   ·   Autosuficiencia con papa, maíz, porotos, zapallo y<br>huevos<\/div>\n<div class=\"pre\">How to Grow More Vegetables   ·   John Jeavons   ·   Cultivo biointensivo: calorías por m², plan de huerta<br>para alimentar a una persona<\/div>\n<div class=\"pg\">pág. 13<\/div>\n<p>Nutrición ovolactovegetariana en colapso<\/p>\n<div class=\"pre\">Título   ·   Autor   ·   Qué aporta<\/div>\n<div class=\"pre\">The Encyclopedia of Country   ·   Carla Emery   ·   La enciclopedia de vida rural: granos, lácteos,<br>Living   ·   gallinas, conservas<\/div>\n<div class=\"pre\">Making the Best of Basics   ·   James Talmage Stevens   ·   Despensa de largo plazo y cómo cocinarla<\/div>\n<div class=\"pre\">The Art of Fermentation   ·   Sandor Katz   ·   Fermentados: chucrut, masa madre, yogur, quesos<br>simples<\/div>\n<div class=\"pre\">Root Cellaring   ·   Mike y Nancy Bubel   ·   Guardar papa, zapallo y fruta sin electricidad<\/div>\n<div class=\"pre\">Home Cheese Making   ·   Ricki Carroll   ·   Quesos para conservar la leche<\/div>\n<div class=\"pre\">Storey&#x27;s Guide to Raising   ·   Gail Damerow / Jerry Belanger   ·   Manejo de gallinas y cabras lecheras<br>Chickens / Dairy Goats<\/div>\n<div class=\"pre\">Seed to Seed   ·   Suzanne Ashworth   ·   Guardar semillas propias, especie por especie<\/div>\n<div class=\"pg\">pág. 14<\/div>"}]}],"found":9},{"id":"GAL","title":"Gallinas ponedoras","sub":"Manual completo de cría","color":"#b07a2a","kind":"pdf","c":[{"t":"Portada y contenido","s":[{"t":"Primeras páginas","h":"<div class=\"pg\">pág. 1<\/div>\n<p>PROYECTO GRANJA · ALTO VALLE DE RÍO NEGRO<\/p>\n<p>Manual completo de cría de gallinas ponedoras De la pollita al huevo: instalaciones, alimentación, sanidad, reproducción e integración con la huerta<\/p>\n<p>Compilación del mejor material gratuito INTA · ProHuerta · SENASA · Código Alimentario Argentino · FAO · Universidades<\/p>\n<p>Incluye índice, planillas imprimibles, calendario anual y biblioteca de fuentes con enlaces<\/p>\n<p>Villa Regina, Río Negro · Noviembre de 2026<\/p>\n<div class=\"pg\">pág. 2<\/div>\n<div class=\"pre\">Manual completo de cría de gallinas<br>ponedoras<br>​Nov 17, 2026   ·   ·   ·   ​@Hernan<\/div>\n<p>Índice Introducción y cómo usar este manual<br>1. Planificación: cuántas gallinas, cuánto espacio y cuánto alimento<br>2. Razas e híbridos: cuál elegir<br>3. Instalaciones: gallinero, parques y equipamiento<br>4. Cría y recría de pollitas (0 a 20 semanas)<br>5. Alimentación y agua<br>6. Manejo de la postura<br>7. Sanidad: bioseguridad, vacunas y enfermedades<br>8. Los huevos: recolección, conservación y venta<br>9. Reproducción: gallo, incubación y renovación del plantel<br>10. Integración con huerta, compost y frutales<br>11. Planillas, rutinas y calendario para imprimir<br>12. Fuentes y biblioteca gratuita<\/p>\n<p>Con 10 gallinas bien manejadas se obtiene media docena de huevos por día casi todo el año; este manual explica, paso a paso, cómo lograrlo y cómo escalar a una granja de 50 o más aves en el Alto Valle de Río Negro.<\/p>\n<p>Cómo usar este manual El manual reúne y ordena el mejor material gratuito disponible: cartillas del INTA y del Programa ProHuerta, el modelo agroecológico para 50 ponedoras del INTA San Martín de los Andes (pensado para clima patagónico), la normativa de SENASA y del Código Alimentario Argentino, y manuales de universidades y la FAO. Todas las fuentes, con enlace, están al final.<\/p>\n<p>Para empezar ya: leé las secciones 1 a 6 y usá las planillas de la sección 11. Para la ampliación de la chacra: sumá las secciones 9 (reproducción) y 10 (integración con huerta y frutales). Para imprimir: exportá el documento a PDF desde el menú; las planillas de la sección 11 están pensadas para imprimirse sueltas y colgarse en el gallinero.<\/p>\n<p>Page 1 of 30<\/p>\n<div class=\"pg\">pág. 3<\/div>\n<p>Contacto local clave: INTA Agencia de Extensión Rural Villa Regina (EEA Alto Valle), tel. 02941-461127, referente del ProHuerta en la zona para pollitas, vacunas y asesoramiento (cartilla ProHuerta Río Negro).<\/p>"}]},{"t":"1. Planificación: cuántas gallinas, cuánto espacio y cuánto","s":[{"t":"1. Planificación: cuántas gallinas, cuánto espacio y cuánto","n":"1","h":"<p>alimento Definí primero el objetivo (autoconsumo, venta de excedente o venta regular), porque de eso dependen el tamaño del plantel, el gallinero y los trámites. El INTA recomienda empezar con un mínimo de 10 ponedoras.<\/p>\n<p>Dimensionamiento rápido<\/p>\n<div class=\"pre\">Plantel Huevos/día   ·   Galpón o caseta (4   ·   Parque fijo   ·   Pastoreo con   ·   Alimento por   ·   Agua<br>esperables (60–85   ·   aves/m² en zona   ·   rotativo (~6   ·   gallinero móvil   ·   año (35   ·   por día<br>% de postura)   ·   de descanso)   ·   m²/ave)   ·   (12–14 m²/ave)   ·   kg/ave)<\/div>\n<div class=\"pre\">10   ·   6–8   ·   2,5–3 m²   ·   60 m²   ·   120–140 m²   ·   350 kg   ·   2–3 L<\/div>\n<div class=\"pre\">25   ·   15–21   ·   6–7 m²   ·   150 m²   ·   300–350 m²   ·   875 kg   ·   5–8 L<\/div>\n<div class=\"pre\">50   ·   30–42   ·   12–15 m² (40 m² si   ·   300 m²   ·   600–700 m²   ·   1.750 kg   ·   10–15 L<br>incluye cría)<\/div>\n<div class=\"pre\">100   ·   60–85   ·   25–30 m²   ·   600 m²   ·   1.200–1.400 m²   ·   3.500 kg   ·   20–30<br>L<\/div>\n<p>El agua se calcula a razón de 1 litro cada 0,5 kg de alimento y sube en verano. Un lote de 10 × 30 m (300 m²) alcanza para unas 25 gallinas con parques rotativos, o 50 si se dedica todo a gallinas.<\/p>\n<p>Pollita BB o pollita recriada<\/p>\n<div class=\"pre\">Opción   ·   Ventajas   ·   Desventajas   ·   Cuándo conviene<\/div>\n<div class=\"pre\">Pollita BB (1 día)   ·   Más barata; se cría a   ·   Necesita criadora con   ·   Primavera, si tenés<br>tu manera   ·   calor 3 semanas; 5   ·   tiempo y luz<br>meses sin huevos; más   ·   eléctrica<br>riesgo de pérdidas<\/div>\n<div class=\"pre\">Pollita recriada   ·   Empieza a poner en   ·   Más cara por unidad   ·   Para arrancar rápido<br>(16–20 semanas)   ·   pocas semanas; ya   ·   o en otoño–invierno<br>vacunada<\/div>\n<p>Page 2 of 30<\/p>\n<div class=\"pg\">pág. 4<\/div>\n<p>Exigí siempre aves con certificado de vacuna contra Marek. El ProHuerta entrega Negra y Rubia INTA vacunadas contra Marek, Newcastle y Bronquitis.<\/p>\n<p>Costos: dónde se va la plata La alimentación representa entre el 70 y el 80 % del costo total en producciones familiares. Por eso, lo que más mueve el número es: balanceado casero con granos de la zona (hasta 46 % más barato que el comercial, según el INTA Río Turbio), pastoreo y restos de huerta. Una gallina consume unos 35 kg de alimento por año; multiplicá por el precio local del kilo para tener tu costo base. Inversión inicial: aves, galpón, cercos, comederos, bebederos, criadora. La lista de materiales para 50 aves está en la sección 3.<\/p>\n<p>Normativa y trámites RENSPA (SENASA): la inscripción es obligatoria para todo productor pecuario, sin importar la cantidad de animales (Res. SENASA 423/2014). Se tramita en la oficina local de SENASA o por web, y hay que actualizar los datos periódicamente. Granja comercial: si vas a producir para venta regular, la Res. SENASA 1699/2019 fija requisitos de bioseguridad, higiene e instalaciones para habilitar el establecimiento. Venta de huevos: el Código Alimentario Argentino regula clasificación y manipulación (ver sección 8). Para vender en ferias o comercios consultá además Bromatología de la Municipalidad de Villa Regina. Influenza aviar: en 2026 hubo focos en aves de traspatio, incluido uno en Valcheta (Río Negro) en mayo. Ante mortandad o síntomas compatibles hay que avisar de inmediato al SENASA (ver sección 7).<\/p>\n<p>Calendario de arranque recomendado para el Alto Valle Agosto–septiembre: construir o acondicionar el gallinero y los parques. Septiembre–octubre: recibir pollitas BB (los días se alargan y bajan las heladas). Febrero–marzo: las pollitas entran en postura a los 5 meses, antes de que se acorten los días. Si comprás recriadas, el mejor momento es fin de invierno o primavera.<\/p>\n<p>Page 3 of 30<\/p>\n<div class=\"pg\">pág. 5<\/div>"}]},{"t":"2. Razas e híbridos: cuál elegir","s":[{"t":"2. Razas e híbridos: cuál elegir","n":"2","h":"<p>Para una chacra familiar en el Alto Valle la mejor elección es la Negra INTA: es rústica, dócil, aguanta el frío, está adaptada a la cría sin jaula y en ensayos de la UNL tuvo la curva de postura más persistente frente a Rhode Island Red y Campero Casilda.<\/p>\n<div class=\"pre\">Ave   ·   Origen   ·   Huevo   ·   Aptitud   ·   Observaciones<\/div>\n<div class=\"pre\">Negra INTA   ·   Gallo Rhode   ·   Castaño,   ·   Ponedora   ·   Autosexante: los<br>Island Red ×   ·   grande (78 %   ·   semipesada   ·   pollitos machos<br>gallina   ·   extra grande a   ·   son negros con<br>Plymouth Rock   ·   la semana 43)   ·   mancha amarilla en<br>Barrada   ·   la cabeza. La<br>entrega ProHuerta<\/div>\n<div class=\"pre\">Rubia INTA   ·   Rhode Island   ·   Castaño   ·   Ponedora   ·   Autosexante:<br>Red × Rhode   ·   semipesada   ·   hembras doradas,<br>Island White   ·   machos blancos.<br>Similar a la Negra<\/div>\n<div class=\"pre\">Rhode Island   ·   Raza pura   ·   Castaño, algo   ·   Doble   ·   Rústica; sirve para<br>Red   ·   más chico   ·   propósito   ·   reproducir en la<br>granja<\/div>\n<div class=\"pre\">Plymouth Rock   ·   Raza pura   ·   Castaño   ·   Doble   ·   Rústica, tranquila;<br>Barrada   ·   propósito   ·   base de la Negra<br>INTA<\/div>\n<div class=\"pre\">Campero   ·   Cruzas INTA   ·   Castaño,   ·   Doble   ·   Pone algo menos;<br>Casilda /   ·   grande   ·   propósito /   ·   buena para pollos<br>Campero INTA   ·   carne   ·   camperos<\/div>\n<div class=\"pre\">Híbridos   ·   Empresas   ·   Castaño   ·   Alta postura   ·   Más de 300<br>comerciales   ·   genéticas   ·   huevos/año con<br>castaños (Isa   ·   alimento<br>Brown, Hy-Line   ·   balanceado<br>Brown, Lohmann   ·   completo; menos<br>Brown)   ·   rústicas y no se<br>reproducen fieles<\/div>\n<div class=\"pre\">Leghorn blanca   ·   Raza liviana   ·   Blanco   ·   Alta postura   ·   Come menos, pero<br>es nerviosa y sufre<br>más el frío y el<br>pastoreo<\/div>\n<p>Page 4 of 30<\/p>\n<div class=\"pg\">pág. 6<\/div>\n<div class=\"pre\">Ave   ·   Origen   ·   Huevo   ·   Aptitud   ·   Observaciones<\/div>\n<div class=\"pre\">Criollas y   ·   Locales   ·   Variado (la   ·   Rústicas   ·   Gallinas<br>Araucana   ·   Araucana,   ·   autóctonas sin<br>verde-azulado)   ·   selección ponen<br>entre 40 y 60<br>huevos/año;<br>valiosas para<br>empollar<\/div>\n<p>Recomendación de plantel Base productiva: Negra INTA (o Rubia INTA) para huevos. Si vas a reproducir: sumá un gallo Rhode Island Red o Plymouth y algunas criollas buenas incubadoras (sección 9). Evitá mezclar edades en el mismo galpón: facilita la sanidad y el recambio &quot;todo adentro, todo afuera&quot;.<\/p>"}]},{"t":"3. Instalaciones: gallinero, parques y equipamiento","s":[{"t":"3. Instalaciones: gallinero, parques y equipamiento","n":"3","h":"<p>El gallinero tiene que ser seco, sin corrientes de aire a la altura de las aves, ventilado arriba, fácil de limpiar y a prueba de predadores; en el Alto Valle, además, protegido del viento del oeste y de las heladas.<\/p>\n<p>Ubicación Terreno alto, no inundable y bien drenado. Frente abierto al norte (sol de invierno) y techo a un agua con caída al sur. Cortina de árboles perennes contra el viento (pinos, cipreses) y de hoja caduca para sombra de verano (álamos, arces, frutales). Lejos de la vivienda para olores y moscas, pero a la vista para vigilar.<\/p>\n<p>Medidas clave<\/p>\n<div class=\"pre\">Elemento   ·   Medida recomendada   ·   Fuente<\/div>\n<div class=\"pre\">Densidad en zona de alimentación y   ·   2–3 aves/m²   ·   INTA<br>tránsito   ·   SMA<\/div>\n<div class=\"pre\">Densidad en zona de postura y   ·   4 aves/m²   ·   INTA<br>descanso   ·   SMA<\/div>\n<p>Page 5 of 30<\/p>\n<div class=\"pg\">pág. 7<\/div>\n<div class=\"pre\">Elemento   ·   Medida recomendada   ·   Fuente<\/div>\n<div class=\"pre\">Altura del galpón (techo a un agua)   ·   1,80 m al frente, 2,30 m al fondo   ·   INTA<br>SMA<\/div>\n<div class=\"pre\">Ponederos   ·   1 cada 5 gallinas; cajón de 40 × 30 × 30 cm   ·   INTA<br>con paja o viruta   ·   SMA<\/div>\n<div class=\"pre\">Perchas   ·   3 aves por metro lineal; palos de 3 cm o   ·   INTA<br>listón de 2&quot; × 2&quot; (17 m para 50 aves)   ·   SMA<\/div>\n<div class=\"pre\">Perchas en caseta chica   ·   Listones de 40 cm separados 35 cm entre   ·   INTA<br>sí<\/div>\n<div class=\"pre\">Comedero lineal   ·   60 cm de largo para 10 gallinas, acceso   ·   INTA<br>por ambos lados<\/div>\n<div class=\"pre\">Comederos tolva (50 aves)   ·   3 tolvas de 10 kg   ·   INTA<br>SMA<\/div>\n<div class=\"pre\">Bebederos (50 aves)   ·   4 de 4 L   ·   INTA<br>SMA<\/div>\n<div class=\"pre\">Altura de comederos y bebederos   ·   Entre el ojo y el buche del ave   ·   INTA<\/div>\n<div class=\"pre\">Cama   ·   Mínimo 10 cm, ideal 15–20 cm de viruta,   ·   INTA<br>paja o pasto seco<\/div>\n<div class=\"pre\">Ventana norte   ·   Zócalo de 80 cm + ventana 1,50 × 1,50 m   ·   INTA<br>con alambre hexagonal de 25 mm   ·   SMA<\/div>\n<div class=\"pre\">Abertura de salida al parque   ·   Unos 40 cm de alto, con cierre nocturno   ·   INTA<\/div>\n<p>Construcción del galpón (modelo INTA para 50 aves, 10 × 4 m)<br>1. Piso: carpeta de cemento de 10–15 cm con malla SIMA de 6 mm y leve pendiente hacia la puerta; alternativa económica, suelo-cemento 1:10. Un piso firme impide que zorros y ratas caven.<br>2. Paredes: material, madera o adobe. Tabiques internos de 1,50 m separan cría, recría y postura.<br>3. Techo: chapa de zinc sobre tirantes de 2&quot; × 4&quot; cada 1,50 m, con aislación de telgopor o lana de vidrio (unos 40 m²). Sin aislación la chapa congela en invierno y cocina en verano.<br>4. Abrigo de invierno: cortina de polietileno de 150–200 micrones sobre la ventana norte.<\/p>\n<p>Page 6 of 30<\/p>\n<div class=\"pg\">pág. 8<\/div>\n<p>5. Ventilación: aberturas altas, bajo el alero, para sacar humedad y amoníaco sin generar corriente sobre las perchas.<br>6. Puertas: 2 de 0,80 × 2 m; malla en todas las aberturas.<\/p>\n<p>Parques y pastoreo Dividir el exterior en 3 parques rotativos: invierno (el más grande y reparado), primavera–verano y verano–otoño. En el modelo INTA para 50 aves: 150 + 75 + 75 m². Rotar cuando el pasto baja a 5 cm. Cerco: malla romboidal de 1,50 m de alto, con 20–30 cm enterrados o una pollera de alambre hacia afuera contra zorros y perros. Sembrar los parques con alfalfa, trébol, festuca, avena o cebada de invierno: aportan verde, vitaminas y bajan el consumo de grano.<\/p>\n<p>Gallinero móvil El ProHuerta e INTA difunden gallineros móviles (casetas livianas con ruedas o patines) para 6 a 10 gallinas en huertas chicas y modelos de 200 aves para pastoreo. Ventajas: reparten el estiércol, cortan el ciclo de parásitos y bajan hasta un 30 % el consumo de grano. Calculá 12–14 m² de pastura por gallina, con red o boyero eléctrico, y movelo seguido. El manual de INTA trae el paso a paso para armar una caseta móvil (INTA, Gallinas).<\/p>\n<p>Materiales para el modelo de 50 aves Parques: 90 m de malla romboidal de 1,50 m; 270 m de alambre liso galvanizado N.º 14; 40 postes de 3&quot; × 3&quot; × 2 m y 26 puntales; 1 portón de 2 m y 3 puertas de 1 m. Galpón: 10 chapas de zinc de 4,40 m (calibre 25); 40 m² de malla SIMA; 36 bolsas de cemento, ½ bolsón de arena, 1 bolsón de piedra; 8 m de malla hexagonal; polietileno de 150 micrones; 40 m² de aislante. Equipamiento: 3 tolvas de 10 kg, 2 comederos de 4 L, 6 bebederos de 4 L, campana de cría de 90 cm con lámpara infrarroja de 250 W, 6 planchas de cartón de 3 mm para el cerco de cría.<\/p>\n<p>Predadores de la zona y cómo frenarlos<\/p>\n<div class=\"pre\">Predador   ·   Señal   ·   Prevención<\/div>\n<div class=\"pre\">Zorro gris   ·   Aves desaparecidas, plumas en   ·   Encierro nocturno obligatorio,<br>el cerco, de noche   ·   piso firme, malla enterrada<\/div>\n<p>Page 7 of 30<\/p>\n<div class=\"pg\">pág. 9<\/div>\n<div class=\"pre\">Predador   ·   Señal   ·   Prevención<\/div>\n<div class=\"pre\">Perros   ·   Muchas aves muertas sin comer   ·   Cerco alto y firme, portón<br>cerrado<\/div>\n<div class=\"pre\">Hurón y comadreja   ·   Aves mordidas en cuello o   ·   Malla hexagonal de 25 mm en<br>cabeza, huevos rotos   ·   todas las aberturas, sin huecos<br>mayores a 3 cm<\/div>\n<div class=\"pre\">Ratas   ·   Huevos comidos, alimento   ·   Comederos cerrados de<br>faltante, pollitos muertos   ·   noche, orden, cebos fuera del<br>alcance de las aves<\/div>\n<div class=\"pre\">Aves rapaces   ·   Pollitos y pollas faltantes de día   ·   Parque con árboles o arbustos<br>(chimango, aguilucho)   ·   de refugio; techar con red el<br>sector de pollitas<\/div>"}]},{"t":"4. Cría y recría de pollitas (0 a 20 semanas)","s":[{"t":"4. Cría y recría de pollitas (0 a 20 semanas)","n":"4","h":"<p>La pollita necesita calor constante hasta emplumar (unas 3 semanas), alimento iniciador los 2 primeros meses y, después, una recría sin excesos de luz ni de peso, para entrar en postura a los 5 meses.<\/p>\n<p>Etapas<\/p>\n<div class=\"pre\">Etapa   ·   Edad   ·   Alimento   ·   Consumo   ·   Objetivo<br>orientativo<\/div>\n<div class=\"pre\">Cría   ·   0–8   ·   Balanceado iniciador   ·   2 kg por pollita en   ·   Calor, agua limpia,<br>semanas   ·   para pollitas (cerca de   ·   toda la etapa   ·   vacunas<br>20 % de proteína)<\/div>\n<div class=\"pre\">Recría   ·   9–20   ·   Recría + cereales,   ·   7 kg por pollita en   ·   Esqueleto y peso<br>semanas   ·   verdeo, insectos   ·   3 meses (33–77   ·   parejo, sin engorde<br>g/día)<\/div>\n<div class=\"pre\">Pre-   ·   18–20   ·   Pasar a ponedora;   ·   80–100 g/día   ·   Llegar con buen<br>postura   ·   semanas   ·   sumar conchilla aparte   ·   desarrollo al<br>primer huevo<\/div>\n<p>Preparar la criadora (antes de que lleguen)<br>1. Limpiar y desinfectar el sector 1 semana antes; cama nueva de 5–10 cm de viruta (nunca aserrín fino: lo comen).<\/p>\n<p>Page 8 of 30<\/p>\n<div class=\"pg\">pág. 10<\/div>\n<p>2. Armar un cerco circular de cartón o chapa de 50 cm de alto alrededor de la campana, sin rincones donde se amontonen. Se amplía a medida que crecen, hasta el tercer mes.<br>3. Fuente de calor: campana de 90 cm a gas (3.000 kcal con pantalla infrarroja) o lámpara infrarroja de 250 W. Para pocas pollitas sirve un foco incandescente o cerámico de 40– 100 W; los focos LED no calientan y no sirven.<br>4. Encender 24 horas antes para que la cama esté tibia.<br>5. Bebederos y comederos chicos (botellas, latas, bandejas bajas) cerca, pero no debajo del calor.<\/p>\n<p>Temperatura bajo la campana (a la altura de las pollitas)<\/p>\n<div class=\"pre\">Semana   ·   Temperatura orientativa<\/div>\n<div class=\"pre\">1   ·   32–33 °C<\/div>\n<div class=\"pre\">2   ·   29–30 °C<\/div>\n<div class=\"pre\">3   ·   26–27 °C<\/div>\n<div class=\"pre\">4   ·   23–24 °C<\/div>\n<div class=\"pre\">5 en adelante   ·   Retirar calor de día si el ambiente supera 20 °C;<br>mantener de noche en otoño–invierno<\/div>\n<p>El INTA indica 33 °C promedio hasta el emplume; el descenso semanal de 2–3 °C es la práctica habitual. Lo que manda es el comportamiento de las pollitas:<\/p>\n<p>Amontonadas bajo la fuente y piando fuerte: tienen frío. Bajar la lámpara o sumar calor. Alejadas, contra el cerco, con alas abiertas y jadeo: tienen calor. Subir la lámpara. Agrupadas de un solo lado: hay corriente de aire. Tapar. Repartidas, comiendo y durmiendo en todo el círculo: temperatura correcta.<\/p>\n<p>Primer día Agua templada con azúcar (2 cucharadas por litro) para el estrés del viaje. Mojar el pico de algunas pollitas para que aprendan a tomar. Alimento esparcido sobre papel o bandeja los 2–3 primeros días. Revisar cloacas: si están tapadas con excremento, limpiar con agua tibia.<\/p>\n<p>Espacio orientativo 0–3 semanas: 20–25 pollitas por m² dentro del cerco.<\/p>\n<p>Page 9 of 30<\/p>\n<div class=\"pg\">pág. 11<\/div>\n<p>4–8 semanas: 10–15 por m². Recría (9–20 semanas): 6–8 por m² bajo techo, con salida al parque desde que emplumaron y el día está templado.<\/p>\n<p>Recría: errores que retrasan la postura Engordarlas: el exceso de maíz da pollas gordas que ponen poco y tarde. Alargar la luz antes de tiempo: durante la recría la luz no debe aumentar; el estímulo de luz (sección 6) se da cuando llegan al peso, cerca de las 18–20 semanas. Juntarlas con gallinas adultas: contagio de parásitos y picoteo. Saltarse vacunas: las de los primeros 35 días son las fundamentales (sección 7). Colocar perchas bajas desde la semana 4 y los ponederos 2–3 semanas antes del primer huevo, para que no aprendan a poner en el piso.<\/p>"}]},{"t":"5. Alimentación y agua","s":[{"t":"5. Alimentación y agua","n":"5","h":"<p>Una gallina en postura come unos 100 g de alimento por día con alrededor de 15 % de proteína y necesita calcio extra para la cáscara; con maíz y verdeo solos no alcanza para formar bien el huevo.<\/p>\n<p>Requerimientos de la ponedora<\/p>\n<div class=\"pre\">Nutriente   ·   Valor   ·   Fuente<\/div>\n<div class=\"pre\">Alimento   ·   100 g/ave/día (unos 35 kg/año)   ·   INTA<\/div>\n<div class=\"pre\">Proteína bruta   ·   15 % (15 g de cada 100 g)   ·   INTA; FAO/NRC<\/div>\n<div class=\"pre\">Energía   ·   2.900 kcal/kg   ·   FAO/NRC<br>metabolizable<\/div>\n<div class=\"pre\">Calcio   ·   3,5–4 % de la ración, más conchilla a voluntad   ·   Práctica<br>habitual<\/div>\n<div class=\"pre\">Agua   ·   1 L cada 0,5 kg de alimento; 2–3 L/día cada 10   ·   INTA<br>gallinas, más en verano<\/div>\n<p>Los cereales (maíz, trigo) aportan solo unos 10 g de proteína cada 100 g; por eso hay que sumar una fuente proteica (soja desactivada, expeller, arveja, porotos cocidos).<\/p>\n<p>Page 10 of 30<\/p>\n<div class=\"pg\">pág. 12<\/div>\n<p>Fórmulas caseras del INTA (kg por cada 100 kg de mezcla)<\/p>\n<div class=\"pre\">Ingrediente   ·   Cría   ·   Recría   ·   Postura<\/div>\n<div class=\"pre\">Maíz, trigo, sorgo o cebada molidos   ·   70   ·   78   ·   70<\/div>\n<div class=\"pre\">Soja desactivada (o expeller de soja)   ·   27   ·   20   ·   20<\/div>\n<div class=\"pre\">Ceniza de hueso   ·   3   ·   2   ·   2<\/div>\n<div class=\"pre\">Conchilla   ·   0   ·   0   ·   6<\/div>\n<div class=\"pre\">Sal de cocina   ·   0,2   ·   0,2   ·   0,2<\/div>\n<p>Nota: la cartilla original del INTA muestra &quot;7&quot; en el grano de postura; por la suma total corresponde a 70 kg.<\/p>\n<p>Fórmulas agroecológicas con sal mineralizada (Cartilla AFCI)<\/p>\n<div class=\"pre\">Categoría   ·   Maíz   ·   Expeller de soja   ·   Sal mineralizada<\/div>\n<div class=\"pre\">Iniciador   ·   60 kg   ·   37 kg   ·   3 kg<\/div>\n<div class=\"pre\">Ponedora   ·   70 kg   ·   26 kg   ·   4 kg<\/div>\n<div class=\"pre\">Reproductora   ·   70 kg   ·   26 kg   ·   4 kg<\/div>\n<p>Sal mineralizada casera (9 kg): 6 kg de ceniza de hueso, 1,5 kg de sal común, 1,5 kg de ceniza de leña y 45 g de azufre en polvo. La ceniza de hueso se obtiene calcinando huesos a más de
