 600 °C (por ejemplo, en un tambor de 200 L) y aporta 24–28 % de calcio y 8–14 % de fósforo. Se puede reemplazar parte del grano por afrechillo de trigo o harina de girasol.<\/p>\n<p>Ración mínima &quot;ponedora casera&quot; para 4 gallinas durante 1 mes (10 kg) Maíz, trigo o sorgo: 8 kg Legumbres (arveja partida, porotos hervidos 20 minutos): 1,67 kg Conchilla: 0,2 kg Hueso calcinado: 0,1 kg Sal: 0,03 kg (la cartilla imprime 0,300 kg, diez veces la proporción de sus otras fórmulas; usá la cantidad menor)<\/p>\n<p>Acopio anual por gallina: 24 kg de maíz, 5 kg de porotos o sustitutos, 0,6 kg de conchilla y 0,3 kg de harina de hueso.<\/p>\n<p>Page 11 of 30<\/p>\n<div class=\"pg\">pág. 13<\/div>\n<p>Usar lo que da la chacra Cebada y arveja locales: el INTA Río Turbio reemplazó parte del maíz y la soja con cebada y arveja y mantuvo 82–89 % de postura, con un costo cerca de 46 % menor que el balanceado comercial. Verdes: alfalfa, trébol, acelga, hojas de repollo, malezas tiernas. Colgar atados para que piquen. Restos de huerta y cocina: frescos, sin moho ni olor ácido. Nada podrido ni con sal en exceso. Frutas de descarte de la chacra (manzana, pera): en pequeñas cantidades, picadas. Insectos y lombrices: el pastoreo y el compost los aportan; una lombricera es una fábrica de proteína. Cáscaras de huevo: secarlas al horno, molerlas y ofrecerlas con la conchilla.<\/p>\n<p>Reglas de oro<br>1. Soja siempre desactivada (tostada o extrusada) y porotos siempre cocidos: crudos tienen factores antinutricionales.<br>2. Conchilla en un comedero aparte, a voluntad, desde el primer huevo.<br>3. Descartar alimento con olor a humedad o acidez: los hongos dan micotoxinas.<br>4. Guardar grano y balanceado en tachos cerrados, lejos de ratas.<br>5. Reponer el comedero cada 1–3 días y no dejar que se vacíe.<br>6. Cambios de alimento siempre graduales, durante 5–7 días.<br>7. Agua limpia y fresca todo el día; en invierno, romper el hielo a primera hora o usar bebedero calefaccionado.<\/p>\n<p>Señales de carencia<\/p>\n<div class=\"pre\">Señal   ·   Causa probable<\/div>\n<div class=\"pre\">Plumas pobres o emplume lento   ·   Faltan minerales o aminoácidos azufrados<\/div>\n<div class=\"pre\">Patas débiles, cresta pálida, cáscara rugosa o   ·   Falta calcio o fósforo<br>frágil, huevos deformes<\/div>\n<div class=\"pre\">Caída de postura   ·   Revisar energía, proteína, calcio o luz<\/div>\n<div class=\"pre\">Apatía o picaje   ·   Estrés o carencias (sobre todo proteína y<br>sal)<\/div>\n<p>Page 12 of 30<\/p>\n<div class=\"pg\">pág. 14<\/div>"}]},{"t":"6. Manejo de la postura","s":[{"t":"6. Manejo de la postura","n":"6","h":"<p>La postura depende ante todo de la luz: las ponedoras necesitan 14 horas de luz constantes, y en Villa Regina (39° de latitud sur) el día natural baja a menos de 10 horas en junio, así que entre abril y septiembre hay que completar con luz artificial.<\/p>\n<p>Programa de luz Meta: 14 horas de luz total (natural + artificial) todos los días, sin variaciones. Los cambios bruscos del ciclo luz-oscuridad alteran la ovulación y cortan la postura. Cómo: encender la luz de madrugada con un temporizador (por ejemplo, de 5:00 a la salida del sol) y dejar que oscurezca naturalmente, así las gallinas se suben solas a las perchas. Cantidad: una lámpara LED de 20 W cada 5 m² de galpón. Estimulación de pollas: pasar de la luz natural a 14 horas de a poco (30–60 minutos por semana) cuando las pollas tienen 18–20 semanas y buen peso. Nunca aumentar la luz durante la recría ni disminuirla en postura. Temperatura de confort: 20–22 °C. Por debajo de 10 °C comen más y ponen menos; por encima de 28 °C comen menos y la cáscara se adelgaza.<\/p>\n<p>Ciclo productivo Primer huevo: alrededor de los 5 meses (20–22 semanas). Los primeros son chicos. Pico de postura: 2 a 3 meses después del inicio. A partir del pico la postura baja lentamente y el huevo se agranda. Vida productiva conveniente: unos 2 años; después se repone el plantel. Muda natural: cada otoño la gallina renueva plumas y deja de poner 6–10 semanas. Ayudala con más proteína (legumbres, insectos) y sin cambios de lugar.<\/p>\n<p>Medir: índice de postura<\/p>\n<p>\\text{Postura (\\%)} = \\frac{\\text{huevos de la semana} \\times 100} {\\text{gallinas} \\times 7}<\/p>\n<p>Ejemplo: 42 huevos en una semana con 10 gallinas = 60 %. Anotá los huevos todos los días en la planilla de la sección 11. Un 60–75 % sostenido es bueno en un sistema familiar; si cae de golpe, revisá en este orden: luz, agua, alimento y calcio, parásitos, estrés (predadores, ruido, mudanza).<\/p>\n<p>Page 13 of 30<\/p>\n<div class=\"pg\">pág. 15<\/div>\n<p>Qué gallina pone y cuál no<\/p>\n<div class=\"pre\">Rasgo   ·   Gallina en postura   ·   Gallina que no<br>pone<\/div>\n<div class=\"pre\">Cresta y barbillas   ·   Grandes, rojo intenso, cálidas   ·   Chicas, pálidas,<br>secas<\/div>\n<div class=\"pre\">Abdomen   ·   Profundo, blando y flexible   ·   Chico, duro o con<br>grasa<\/div>\n<div class=\"pre\">Huesos de la pelvis (a cada lado   ·   Separados, entran 2–3 dedos   ·   Juntos, entra 1<br>de la cloaca)   ·   dedo<\/div>\n<div class=\"pre\">Cloaca   ·   Amplia, húmeda, pálida   ·   Chica, seca,<br>amarillenta<\/div>\n<div class=\"pre\">Pico y patas   ·   Pálidos: el pigmento amarillo se   ·   Amarillos intensos<br>va a la yema<\/div>\n<p>Revisá las aves al anochecer, cuando están tranquilas en las perchas.<\/p>\n<p>Recolección Juntar los huevos al menos 2 veces por día (media mañana y tarde); en verano y con heladas, 3 veces. Huevos limpios se recogen secos; los sucios se apartan (sección 8). Si aparecen huevos rotos o comidos: más recolecciones, más calcio y proteína, ponederos más oscuros y un huevo de yeso o madera como señuelo.<\/p>\n<p>Page 14 of 30<\/p>\n<div class=\"pg\">pág. 16<\/div>\n<p>Problemas frecuentes de manejo<\/p>\n<div class=\"pre\">Problema   ·   Qué hacer<\/div>\n<div class=\"pre\">Gallina clueca (se queda en el nido)   ·   Si no querés pollitos: sacarla del nido varias veces<br>por día y pasarla 2–3 días a una jaula con piso de<br>alambre, con agua y comida<\/div>\n<div class=\"pre\">Huevos en el piso   ·   Ponederos colocados antes del primer huevo, en<br>lugar oscuro y más bajos que las perchas; levantar<br>rápido los huevos del piso<\/div>\n<div class=\"pre\">Picaje y canibalismo   ·   Bajar densidad, sumar proteína y sal, colgar verdes<br>para picotear, aislar a la herida y curarla<\/div>\n<div class=\"pre\">Huevos sin cáscara o blandos   ·   Conchilla a voluntad, revisar calor y edad del ave<\/div>\n<p>Descarte y renovación Sacar del plantel las gallinas que no ponen (tabla de arriba), enfermas crónicas o con defectos. Planificar la reposición escalonada: por ejemplo, renovar la mitad del plantel por año, para no quedarse nunca sin huevos. Las gallinas de descarte se aprovechan para caldo o se venden; definí el destino antes de empezar.<\/p>"}]},{"t":"7. Sanidad: bioseguridad, vacunas y enfermedades","s":[{"t":"7. Sanidad: bioseguridad, vacunas y enfermedades","n":"7","h":"<p>La mejor manera de tratar una enfermedad es no dejarla entrar: aves de origen conocido y vacunadas, contacto mínimo con aves silvestres, limpieza regular y aviso inmediato al SENASA ante mortandad.<\/p>\n<p>Bioseguridad: las 12 reglas<br>1. Comprar aves solo de origen confiable, con certificado de vacuna contra Marek.<br>2. Cuarentena de 2–3 semanas para toda ave nueva, en un lugar separado.<br>3. No criar patos, gansos ni pavos junto a las gallinas.<br>4. Impedir que aves silvestres lleguen al agua y al alimento: comederos bajo techo, malla en aberturas.<br>5. Ropa y calzado exclusivos para el gallinero; lavarse las manos al entrar y al salir.<br>6. Pocas visitas; nadie que venga de otro gallinero el mismo día.<\/p>\n<p>Page 15 of 30<\/p>\n<div class=\"pg\">pág. 17<\/div>\n<p>7. Lavar y desinfectar comederos y bebederos cada semana (2 cucharadas de lavandina concentrada por litro, enjuagar).<br>8. Remover la cama día por medio y renovarla cada 15–30 días, o cuando se apelmaza o huele a amoníaco.<br>9. Desinfección completa 2 veces por año: lavar con agua y detergente y luego aplicar lavandina (1 cucharadita de lavandina concentrada por litro) o yodo.<br>10. Control de roedores: orden, pasto corto alrededor, grano en tachos cerrados, cebos en cajas fuera del alcance de las aves.<br>11. Aislar enseguida a toda gallina decaída.<br>12. Retirar las aves muertas el mismo día.<\/p>\n<p>Plan de vacunación de referencia (INTA)<\/p>\n<div class=\"pre\">Día de   ·   Vacuna   ·   Vía<br>vida<\/div>\n<div class=\"pre\">1   ·   Marek + Newcastle + Bronquitis   ·   En planta de incubación<\/div>\n<div class=\"pre\">15   ·   Gumboro + Newcastle + Bronquitis   ·   1 gota en el ojo<\/div>\n<div class=\"pre\">35   ·   Gumboro + Newcastle + Bronquitis   ·   1 gota en el ojo<\/div>\n<div class=\"pre\">50   ·   Viruela   ·   Punción en la membrana del<br>ala<\/div>\n<div class=\"pre\">70   ·   Laringotraqueítis   ·   1 gota en el ojo<\/div>\n<div class=\"pre\">84   ·   Tifus aviar   ·   Inyectable<\/div>\n<div class=\"pre\">120   ·   Triple: síndrome de caída de postura +   ·   Inyectable<br>Newcastle + Bronquitis<\/div>\n<p>Las vacunas hasta el día 35 son las fundamentales. Las vacunas vienen en dosis para cientos de aves: para planteles chicos conviene coordinar con el INTA AER Villa Regina, el ProHuerta o un veterinario y vacunar entre varios productores. Si comprás pollitas recriadas, pedí la planilla de vacunas aplicadas.<\/p>\n<p>Parásitos Internos (lombrices): desparasitar en la recría, 2 veces con 1 mes de intervalo (piperazina en el agua, 1,5 kg cada 1.000 L durante un día, repitiendo a las 3 semanas). En gallinas en postura, consultar con el veterinario un producto autorizado y su tiempo de espera para huevos. No consumir carne de aves tratadas en los 14 días posteriores al tratamiento.<\/p>\n<p>Page 16 of 30<\/p>\n<div class=\"pg\">pág. 18<\/div>\n<p>Externos (piojos y ácaros): dejar en el parque 3–4 cajones con ceniza de leña mezclada con tierra de diatomeas fina para que las gallinas se bañen. Revisar de noche con linterna perchas y grietas: el ácaro rojo se esconde de día y chupa sangre de noche. Si hay, limpiar, encalar o pintar las perchas y tratar grietas. Rotar los parques corta el ciclo de los parásitos del suelo.<\/p>\n<p>Enfermedades frecuentes<\/p>\n<div class=\"pre\">Enfermedad   ·   Señales principales   ·   Prevención / qué hacer<\/div>\n<div class=\"pre\">Influenza aviar   ·   Muerte súbita de muchas aves,   ·   Notificación obligatoria al<br>cresta y barbillas violetas,   ·   SENASA. No mover aves; aislar el<br>hinchazón de cabeza, caída   ·   gallinero<br>brusca de postura<\/div>\n<div class=\"pre\">Newcastle   ·   Respiración con ruidos, diarrea   ·   Vacunación; notificación<br>verde, cuello torcido, parálisis,   ·   obligatoria al SENASA<br>alta mortalidad<\/div>\n<div class=\"pre\">Bronquitis   ·   Tos, estertores, ojos llorosos;   ·   Vacunación<br>infecciosa   ·   huevos deformes y de cáscara<br>fina; nunca síntomas nerviosos<\/div>\n<div class=\"pre\">Marek   ·   Parálisis de patas o alas (una pata   ·   Vacuna al día 1; no tiene<br>adelante, otra atrás),   ·   tratamiento<br>adelgazamiento, ojos grises; aves<br>jóvenes<\/div>\n<div class=\"pre\">Gumboro   ·   Pollitas de 3–11 semanas decaídas,   ·   Vacunación; el virus resiste los<br>plumas erizadas, diarrea   ·   desinfectantes<br>blanquecina<\/div>\n<div class=\"pre\">Viruela aviar   ·   Costras en cresta, barbillas y   ·   Vacunación; control de<br>alrededor de los ojos (forma seca)   ·   mosquitos<br>o placas en la boca (forma<br>húmeda)<\/div>\n<div class=\"pre\">Coriza infecciosa   ·   Cara hinchada, secreción nasal   ·   Bioseguridad, no mezclar<br>con mal olor, ojos cerrados   ·   edades; tratamiento veterinario<\/div>\n<div class=\"pre\">Laringotraqueítis   ·   Tos con sangre, estiran el cuello   ·   Vacunación en zonas con casos<br>para respirar<\/div>\n<div class=\"pre\">Coccidiosis   ·   Diarrea con sangre, pollitas   ·   Cama seca, bebederos limpios,<br>decaídas; peor con cama húmeda   ·   no hacinar<\/div>\n<p>Page 17 of 30<\/p>\n<div class=\"pg\">pág. 19<\/div>\n<div class=\"pre\">Enfermedad   ·   Señales principales   ·   Prevención / qué hacer<\/div>\n<div class=\"pre\">Tifus /   ·   Diarrea amarillo-verdosa,   ·   Vacuna de tifus, higiene, control<br>salmonelosis   ·   decaimiento, mortalidad en   ·   de roedores<br>adultas<\/div>\n<div class=\"pre\">Parásitos externos   ·   Plumas comidas, costras, anemia   ·   Baños de tierra, revisión<br>(cresta pálida), caída de postura   ·   nocturna<\/div>\n<p>Este cuadro sirve para reconocer el problema, no para diagnosticar: ante mortandad o síntomas en varias aves, consultá a un veterinario. La Guía práctica de enfermedades del INTA Cerro Azul y el Manual de enfermedades de las aves de la UNL (fuentes) traen fotos y detalle.<\/p>\n<p>Ante sospecha de influenza aviar o Newcastle<br>1. No sacar ni vender aves, huevos ni cama del predio.<br>2. Encerrar a las aves y separarlas de aves silvestres.<br>3. No tocar aves muertas sin guantes; no abrirlas.<br>4. Avisar de inmediato al SENASA: oficina local más cercana, la app &quot;Notificaciones SENASA&quot; o notificaciones@senasa.gob.ar.<\/p>\n<p>Aves muertas y vacío sanitario Compostaje (método preferido): en un sector techado lejos de la vivienda, 3 partes de cama o paja seca por cada parte de aves, humedad sin encharcar; reposar 20 días, voltear y esperar otros 20–30. Alternativa: fosa con cal viva en el fondo y tapada, lejos de pozos de agua. No quemar. Vacío sanitario: entre un lote y otro, dejar el galpón vacío al menos 10 días después de lavar y desinfectar; sacar comederos y bebederos al sol. Analizar el agua de pozo al menos una vez al año y mantener los tanques tapados.<\/p>\n<p>Bienestar animal Gallinas sin miedo, con espacio, baño de tierra, perchas, nido oscuro y luz natural ponen más y se enferman menos. El SENASA publica Recomendaciones para el Bienestar Animal de Aves de Raza (SENASA Aves).<\/p>"}]},{"t":"8. Los huevos: recolección, conservación y venta","s":[{"t":"8. Los huevos: recolección, conservación y venta","n":"8","h":"<p>El huevo se junta seco y limpio, no se lava hasta el momento de usarlo y se guarda fresco (por debajo de 15 °C, sin congelar); para venderlo rige el Código Alimentario Argentino.<\/p>\n<p>Page 18 of 30<\/p>\n<div class=\"pg\">pág. 20<\/div>\n<p>Del nido a la mesa<br>1. Recolectar 2–3 veces por día en una canasta o maple limpio.<br>2. Separar los sucios, rotos o fisurados. Los rotos no se venden ni se guardan.<br>3. Limpiar en seco: cepillo suave, esponja seca o lija fina sobre la mancha. No lavarlos: el agua arrastra la cutícula protectora y deja entrar bacterias. El CAA prohíbe lavar huevos para consumo directo salvo que después se les aplique un revestimiento protector.<br>4. Lavar el huevo recién en la cocina, justo antes de cascarlo.<br>5. Guardar con la punta hacia abajo (cámara de aire arriba), en lugar fresco, seco y sin olores, entre 8 y 15 °C.<br>6. Rotar: primero se usa lo más viejo. Anotar la fecha de postura en el maple.<\/p>\n<p>Según el CAA, solo puede llamarse &quot;huevo fresco&quot; el que no fue sometido a ningún método de conservación ni expuesto intencionalmente a menos de 8 °C.<\/p>\n<p>Clasificación por peso (CAA, art. 492)<\/p>\n<div class=\"pre\">Grado   ·   Mínimo por unidad   ·   Mínimo por docena<\/div>\n<div class=\"pre\">Extra grande (IS)   ·   62 g   ·   744 g<\/div>\n<div class=\"pre\">Grande (1)   ·   54 g   ·   648 g<\/div>\n<div class=\"pre\">Mediano (2)   ·   48 g   ·   576 g<\/div>\n<div class=\"pre\">Chico (3)   ·   42 g   ·   504 g<\/div>\n<p>Una balanza de cocina digital alcanza para clasificar.<\/p>\n<p>Control de calidad casero Ovoscopía (mirar al trasluz): con una linterna fuerte en un cuarto oscuro se ven fisuras, manchas de sangre y el tamaño de la cámara de aire. A mayor cámara, más viejo. Prueba del agua: el huevo fresco se va al fondo y queda acostado; uno de 1–2 semanas se inclina; el que flota no se consume. Al cascarlo: yema alta y clara espesa = huevo fresco. Clara muy líquida = viejo o gallinas con problemas respiratorios. Color de yema: depende del alimento; pasto, alfalfa y maíz amarillo dan yemas intensas.<\/p>\n<p>Page 19 of 30<\/p>\n<div class=\"pg\">pág. 21<\/div>\n<p>Defectos y causas<\/p>\n<div class=\"pre\">Defecto   ·   Causa probable<\/div>\n<div class=\"pre\">Cáscara fina, rugosa o blanda   ·   Falta calcio o vitamina D, calor, gallina vieja,<br>bronquitis<\/div>\n<div class=\"pre\">Manchas de sangre   ·   Estrés, sustos, exceso de luz; normal en pocos<br>huevos<\/div>\n<div class=\"pre\">Huevo deforme   ·   Bronquitis, edad, susto durante la formación<\/div>\n<div class=\"pre\">Doble yema   ·   Pollas al inicio de la postura; normal<\/div>\n<div class=\"pre\">Huevos sucios   ·   Nidos sin cama limpia, pocas recolecciones,<br>gallinas durmiendo en el nido<\/div>\n<p>Vender excedente Inscribirse en el RENSPA (sección 1) y consultar en Bromatología de la Municipalidad los requisitos para ferias y comercios locales. Usar maples nuevos o limpios y una etiqueta con nombre, lugar, fecha de postura y grado. Vender solo huevos enteros, limpios en seco y clasificados. El &quot;huevo de gallinas libres de jaula&quot; o &quot;pastoril&quot; tiene buena demanda en ferias de la zona; dejalo claro en la etiqueta solo si es verdad.<\/p>"}]},{"t":"9. Reproducción: gallo, incubación y renovación del plantel","s":[{"t":"9. Reproducción: gallo, incubación y renovación del plantel","n":"9","h":"<p>Para huevos de consumo no hace falta gallo; para producir tus propias pollitas necesitás 1 gallo cada 7 a 10 gallinas, huevos bien elegidos y 21 días de incubación, natural o artificial.<\/p>\n<p>Ojo con la Negra y la Rubia INTA: son cruzas (híbridos simples). Sus hijas no repiten el color autosexante ni la misma postura. Si querés autoabastecerte de pollitas, mantené un núcleo de raza pura (Rhode Island Red o Plymouth Rock Barrada) o seguí comprando pollitas al INTA.<\/p>\n<p>Selección de reproductores<\/p>\n<div class=\"pre\">Aspecto   ·   Qué buscar<\/div>\n<div class=\"pre\">Conformación   ·   Cuerpo triangular visto de costado, cloaca amplia y<br>húmeda, abdomen blando, patas firmes<\/div>\n<p>Page 20 of 30<\/p>\n<div class=\"pg\">pág. 22<\/div>\n<div class=\"pre\">Aspecto   ·   Qué buscar<\/div>\n<div class=\"pre\">Historial   ·   Postura sostenida, pausas cortas, sin cloquez<br>persistente, madurez cerca de los 5 meses<\/div>\n<div class=\"pre\">Salud   ·   Sin lesiones ni signos de enfermedad, tranquila,<br>resistente al patio abierto<\/div>\n<div class=\"pre\">Gallo   ·   Proporción 1:7 a 1:10, sin defectos de pico ni patas,<br>activo y no agresivo con las personas<\/div>\n<p>No elegir por un solo rasgo. Clasificá cada ave como Apta, Revisar o Descartar. Cambiá el gallo cada 2 años o traé uno de otra granja para evitar la consanguinidad.<\/p>\n<p>Huevos para incubar De gallinas de 8 meses a 2 años, con el gallo hace al menos 2 semanas. Tamaño mediano a grande, forma normal, cáscara lisa y sin fisuras. Limpios en seco; nunca lavados. Guardar máximo 7 días, a 12–15 °C (por debajo de 24 °C el embrión se detiene), con la punta fina hacia abajo, girándolos una vez por día.<\/p>\n<p>Incubación natural (gallina clueca)<br>1. Elegir una clueca mansa (criollas y Plymouth son buenas madres).<br>2. Nido en lugar tranquilo, oscuro y aislado de las ponedoras, con agua y alimento a mano.<br>3. Poner 10–14 huevos según el tamaño de la gallina, preferentemente de noche.<br>4. Espolvorear el nido con ceniza o tierra de diatomeas contra piojos.<br>5. Al día 7, mirar al trasluz y retirar los huevos claros (infértiles).<br>6. Nacen al día 21. Dejar que la madre los críe, con alimento iniciador en un comedero bajo y un bebedero en el que no se ahoguen.<\/p>\n<p>Incubación artificial<\/p>\n<div class=\"pre\">Parámetro   ·   Días 1–18   ·   Días 19–21<br>(nacimiento)<\/div>\n<div class=\"pre\">Temperatura (incubadora de   ·   37,5–37,8 °C   ·   36,5–37,2 °C<br>aire forzado)<\/div>\n<div class=\"pre\">Humedad relativa   ·   50–55 %   ·   65–70 %<\/div>\n<p>Page 21 of 30<\/p>\n<div class=\"pg\">pág. 23<\/div>\n<div class=\"pre\">Parámetro   ·   Días 1–18   ·   Días 19–21<br>(nacimiento)<\/div>\n<div class=\"pre\">Volteo   ·   Al menos 3–5 veces por día (o cada   ·   Sin volteo<br>3 h, 45°); siempre número impar si<br>es manual<\/div>\n<div class=\"pre\">Ventilación   ·   Orificios abiertos de a poco   ·   Ventilación plena<\/div>\n<p>Encender y estabilizar la incubadora 24 horas antes de cargarla. Ovoscopía: día 7 (retirar los claros, que se ven transparentes) y día 18 (retirar los que no se mueven o tienen anillo de sangre). No abrir la incubadora durante el nacimiento; dejar a los pollitos secarse adentro 12–24 horas. Si la fertilidad fue alta pero nacieron pocos, el problema está en la temperatura, la humedad o el volteo.<\/p>\n<p>Plan de renovación Mantener dos lotes de distinta edad en galpones o sectores separados: mientras uno pone, el otro se cría. Ejemplo con 50 gallinas: cada primavera entran 25 pollitas y salen las 25 gallinas más viejas. Los machos que nazcan se recrían para carne (pollo campero) y se faenan a los 3–4 meses.<\/p>"}]},{"t":"10. Integración con huerta, compost y frutales","s":[{"t":"10. Integración con huerta, compost y frutales","n":"10","h":"<p>En una chacra permacultural la gallina trabaja: desmaleza, come insectos, remueve la tierra y abona; a cambio, la huerta y los frutales le dan alimento y sombra. La clave es moverlas con un plan y compostar su estiércol antes de usarlo.<\/p>\n<p>Dónde ubicar el gallinero en el diseño Zona 2 del diseño: cerca de la casa y de la huerta para visitas diarias, pero no pegado a la vivienda. Entre la huerta y el monte frutal, para que los parques conecten con ambos. Del lado de la cortina de árboles, protegido del viento. Con la compostera al lado: la cama usada va directo a la pila.<\/p>\n<p>Page 22 of 30<\/p>\n<div class=\"pg\">pág. 24<\/div>\n<p>Rotación huerta-gallinas<br>1. Cosecha terminada: el gallinero móvil (para 6–10 gallinas) se pone sobre el cantero.<br>2. 1–2 semanas de gallinas: comen restos, malezas, semillas y larvas; escarban y abonan.<br>3. Retirar las gallinas y cubrir con mantillo o compost.<br>4. Esperar al menos 3–4 semanas antes de sembrar hortalizas de hoja o raíz que se comen crudas.<br>5. Sembrar el cultivo siguiente y mover el gallinero al próximo cantero.<\/p>\n<p>Con 8–10 canteros, el gallinero recorre la huerta en un ciclo de 2–3 meses.<\/p>\n<p>Gallinas bajo frutales Comen fruta caída (donde invernan larvas de plagas como la carpocapsa), insectos y malezas, y abonan el pie de los árboles. Usar parques rotativos bajo el monte, con sombra de verano. Precaución en el Alto Valle: no pastorear bajo montes recién pulverizados ni en chacras vecinas con deriva de agroquímicos. Respetar los tiempos de carencia del producto o mantener a las gallinas fuera durante la temporada de tratamientos. Proteger el tronco de árboles jóvenes: escarban y dejan raíces expuestas.<\/p>\n<p>Gallinaza y compost El estiércol crudo no se usa directo en la huerta: quema plantas y puede llevar microorganismos. El ProHuerta del INTA recomienda compostarlo siempre. Mezclar la cama usada (rica en carbono) con restos de huerta y pasto; mantener húmeda como esponja escurrida y voltear cada 2–3 semanas. Está lista en 2–3 meses cuando huele a tierra de bosque. Cama profunda: en invierno, agregar viruta o paja sobre la cama sin retirarla; en primavera, todo va a la compostera. Las gallinas pueden voltear la compostera por vos: soltarlas un rato sobre la pila, que además les da insectos y lombrices.<\/p>\n<p>Cultivos para alimentar a las gallinas<\/p>\n<div class=\"pre\">Cultivo   ·   Qué aporta   ·   Uso<\/div>\n<div class=\"pre\">Maíz, sorgo, cebada, trigo   ·   Energía   ·   Grano entero o molido<\/div>\n<div class=\"pre\">Arveja, poroto, haba   ·   Proteína   ·   Partida o cocida<\/div>\n<p>Page 23 of 30<\/p>\n<div class=\"pg\">pág. 25<\/div>\n<div class=\"pre\">Cultivo   ·   Qué aporta   ·   Uso<\/div>\n<div class=\"pre\">Girasol   ·   Energía, grasa, proteína   ·   Cabezas secas<br>colgadas<\/div>\n<div class=\"pre\">Alfalfa, trébol   ·   Proteína, vitaminas, pigmento de   ·   Pastoreo o fardos<br>yema   ·   picados<\/div>\n<div class=\"pre\">Zapallo, calabaza   ·   Energía, vitaminas   ·   Partido, con semillas<\/div>\n<div class=\"pre\">Acelga, repollo, lechuga de   ·   Vitaminas   ·   Colgado entero<br>descarte<\/div>\n<div class=\"pre\">Amaranto, quinoa   ·   Grano y hoja   ·   Panojas secas<\/div>\n<p>Lombricultura Una lombricera alimentada con restos de cocina y gallinaza compostada da lombrices para ofrecer como proteína fresca (un puñado por día cada 10 gallinas) y humus para la huerta.<\/p>"}]},{"t":"11. Planillas, rutinas y calendario para imprimir","s":[{"t":"11. Planillas, rutinas y calendario para imprimir","n":"11","h":"<p>Estas páginas están pensadas para imprimirse sueltas y colgarse en el gallinero.<\/p>\n<p>Rutina diaria Abrir el gallinero y revisar que estén todas Agua limpia y fresca (romper hielo en invierno) Alimento y conchilla repuestos Recolectar huevos (mañana y tarde) y anotarlos Mirar comportamiento: aves decaídas, cojas o aisladas Cerrar al anochecer, con todas adentro<\/p>\n<p>Rutina semanal Lavar y desinfectar comederos y bebederos Remover la cama y agregar donde haga falta Revisar cercos, mallas y cierres Calcular el índice de postura de la semana Revisar de noche perchas y grietas por ácaros<\/p>\n<p>Page 24 of 30<\/p>\n<div class=\"pg\">pág. 26<\/div>\n<p>Rutina mensual y semestral Renovar parcialmente la cama y llevarla a la compostera Rotar parque o mover el gallinero móvil Revisar a cada gallina en la percha (cresta, abdomen, pelvis, plumas) Control de roedores Desinfección completa del galpón (2 veces por año) Análisis de agua de pozo (1 vez por año) Actualizar datos del RENSPA cuando corresponda<\/p>\n<p>Calendario anual para el Alto Valle<\/p>\n<div class=\"pre\">Mes   ·   Tareas principales<\/div>\n<div class=\"pre\">Enero   ·   Sombra y agua extra; recolectar 3 veces por día;<br>parque verano–otoño<\/div>\n<div class=\"pre\">Febrero   ·   Pollitas de primavera entran en postura; conchilla a<br>voluntad<\/div>\n<div class=\"pre\">Marzo   ·   Revisar plantel y descartar las que no ponen;<br>sembrar verdeos de invierno (avena, cebada)<\/div>\n<div class=\"pre\">Abril   ·   Encender luz artificial para mantener 14 h; muda<br>natural: más proteína<\/div>\n<div class=\"pre\">Mayo   ·   Pasar al parque de invierno; poner la cortina de<br>polietileno<\/div>\n<div class=\"pre\">Junio   ·   Días más cortos: verificar temporizador; bebederos<br>sin hielo<\/div>\n<div class=\"pre\">Julio   ·   Cama profunda contra el frío; reparar instalaciones<\/div>\n<div class=\"pre\">Agosto   ·   Desinfección completa; preparar criadora;<br>encargar pollitas<\/div>\n<div class=\"pre\">Septiembre   ·   Recibir pollitas BB; empezar vacunación; ir<br>apagando la luz artificial<\/div>\n<div class=\"pre\">Octubre   ·   Parque primavera–verano; desparasitar recría;<br>mejor época para incubar<\/div>\n<div class=\"pre\">Noviembre   ·   Recría al parque; segunda desparasitación de<br>pollas<\/div>\n<p>Page 25 of 30<\/p>\n<div class=\"pg\">pág. 27<\/div>\n<div class=\"pre\">Mes   ·   Tareas principales<\/div>\n<div class=\"pre\">Diciembre   ·   Sombra, agua fresca; control de ácaros (más<br>activos con calor)<\/div>\n<p>Planilla de postura (una por mes) Mes: __________ · Gallinas en el plantel: ______<\/p>\n<div class=\"pre\">Día   ·   Huevos   ·   Rotos/sucios   ·   Alimento (kg)   ·   Observaciones<\/div>\n<div class=\"pre\">Total semana 1   ·   Postura %:<\/div>\n<div class=\"pre\">Total semana 2   ·   Postura %:<\/div>\n<p>Page 26 of 30<\/p>\n<div class=\"pg\">pág. 28<\/div>\n<div class=\"pre\">Día   ·   Huevos   ·   Rotos/sucios   ·   Alimento (kg)   ·   Observaciones<\/div>\n<div class=\"pre\">Total semana 3   ·   Postura %:<\/div>\n<div class=\"pre\">Total semana 4   ·   Postura %:<\/div>\n<p>29–31<\/p>\n<div class=\"pre\">Total del mes   ·   Postura %:<\/div>\n<p>Planilla sanitaria y de movimientos<\/p>\n<div class=\"pre\">Fecha   ·   Lote /   ·   Acción (vacuna, desparasitación,   ·   Producto y   ·   Responsable<br>aves   ·   compra, baja, venta)   ·   dosis<\/div>\n<p>Resolución rápida de problemas<\/p>\n<div class=\"pre\">Síntoma   ·   Revisar primero   ·   Luego<\/div>\n<div class=\"pre\">Caída brusca de   ·   Luz (temporizador, lámpara   ·   Alimento, calcio, parásitos,<br>postura   ·   quemada), agua   ·   susto por predador<\/div>\n<div class=\"pre\">Caída lenta en otoño   ·   Muda natural, días cortos   ·   Sumar luz y proteína<\/div>\n<div class=\"pre\">Pollitas amontonadas   ·   Temperatura de la criadora   ·   Corrientes de aire<\/div>\n<p>Page 27 of 30<\/p>\n<div class=\"pg\">pág. 29<\/div>\n<div class=\"pre\">Síntoma   ·   Revisar primero   ·   Luego<\/div>\n<div class=\"pre\">Huevos rotos o   ·   Recolecciones, calcio   ·   Ponederos oscuros, proteína<br>comidos<\/div>\n<div class=\"pre\">Plumas comidas, cresta   ·   Ácaros y piojos   ·   Proteína y minerales<br>pálida<\/div>\n<div class=\"pre\">Diarrea con sangre en   ·   Cama húmeda (coccidiosis)   ·   Veterinario<br>pollitas<\/div>\n<div class=\"pre\">Varias aves muertas de   ·   Aislar, no mover aves   ·   Avisar al SENASA de inmediato<br>golpe<\/div>\n<div class=\"pre\">Aves desaparecidas   ·   Cierres y malla   ·   Encierro nocturno<\/div>"}]},{"t":"12. Fuentes y biblioteca gratuita","s":[{"t":"12. Fuentes y biblioteca gratuita","n":"12","h":"<p>Todo el material es gratuito y descargable. Los marcados con ★ son la base de este manual y conviene tenerlos impresos.<\/p>\n<p>Argentina: INTA, ProHuerta y universidades<\/p>\n<div class=\"pre\">Material   ·   Institución   ·   Para qué sirve<\/div>\n<div class=\"pre\">★ Cría casera de gallinas   ·   INTA   ·   Razas INTA, caseta móvil paso a<br>(manual completo)   ·   paso, fórmulas, vacunas<\/div>\n<div class=\"pre\">★ Modelo agroecológico para   ·   INTA AER San Martín   ·   Galpón, parques y materiales<br>50 ponedoras   ·   de los Andes   ·   para clima patagónico<\/div>\n<div class=\"pre\">★ Cría de gallinas ponedoras   ·   INTA–ProHuerta Río   ·   Comederos, bebederos,<br>(tríptico Río Negro)   ·   Negro   ·   contactos locales<\/div>\n<div class=\"pre\">Un pequeño plantel de   ·   INTA Rama Caída   ·   Etapas de cría, recría y postura<br>ponedoras para la familia<\/div>\n<div class=\"pre\">Apuntes para construir un   ·   ProHuerta–INTA   ·   Gallinero móvil para huerta<br>gallinero móvil<\/div>\n<div class=\"pre\">Centro de Multiplicación de   ·   INTA   ·   Origen y características de la<br>Aves   ·   Negra y Rubia INTA<\/div>\n<div class=\"pre\">Balanceado casero para Negra   ·   INTA AER Río Turbio   ·   Cebada y arveja locales; costos<br>INTA<\/div>\n<p>Page 28 of 30<\/p>\n<div class=\"pg\">pág. 30<\/div>\n<div class=\"pre\">Material   ·   Institución   ·   Para qué sirve<\/div>\n<div class=\"pre\">★ Cartilla agroecológica de   ·   AFCI   ·   Raciones, sal mineralizada,<br>alimentación avícola   ·   probióticos, selección de<br>reproductoras<\/div>\n<div class=\"pre\">Guía práctica de enfermedades   ·   INTA Cerro Azul   ·   Síntomas y control por<br>de aves de corral   ·   enfermedad<\/div>\n<div class=\"pre\">Manual de enfermedades de   ·   UNL   ·   Referencia veterinaria<br>las aves   ·   detallada<\/div>\n<div class=\"pre\">Manual de bioseguridad avícola   ·   Sitio Argentino de   ·   Roedores, visitas, desinfección,<br>Producción Animal   ·   mortandad<\/div>\n<div class=\"pre\">Curvas de postura: Negra INTA,   ·   UNL–INTA   ·   Comparación de razas<br>Campero Casilda y RIR y<br>tamaño de huevo<\/div>\n<div class=\"pre\">Biblioteca de producción   ·   Sitio Argentino de   ·   Cientos de artículos y cartillas<br>avícola   ·   Producción Animal   ·   gratuitas<\/div>\n<p>Normativa<\/p>\n<div class=\"pre\">Norma   ·   Tema<\/div>\n<div class=\"pre\">Res. SENASA 423/2014 (RENSPA)   ·   Inscripción obligatoria de todo productor<br>pecuario<\/div>\n<div class=\"pre\">Res. SENASA 1699/2019   ·   Habilitación de granjas avícolas comerciales<\/div>\n<div class=\"pre\">Res. Conjunta 2-E/2017 (CAA, huevos)   ·   Definición de huevo fresco, grados por peso,<br>prohibición de lavado<\/div>\n<div class=\"pre\">SENASA: aves, bienestar animal, influenza   ·   Vigilancia, folletos y recomendaciones<br>aviar<\/div>\n<div class=\"pre\">Caso de influenza aviar en Valcheta, Río   ·   Recomendaciones para traspatio<br>Negro (mayo 2026)<\/div>\n<p>Internacionales en español<\/p>\n<div class=\"pre\">Material   ·   Institución<\/div>\n<div class=\"pre\">Revisión del desarrollo avícola: nutrición   ·   FAO<\/div>\n<p>Page 29 of 30<\/p>\n<div class=\"pg\">pág. 31<\/div>\n<div class=\"pre\">Material   ·   Institución<\/div>\n<div class=\"pre\">Manual de producción y manejo de aves de patio   ·   CATIE, Costa Rica<\/div>\n<div class=\"pre\">Manual de gallinas de patio   ·   Universidad Nacional Agraria,<br>Nicaragua<\/div>\n<div class=\"pre\">Manual de explotación de gallinas ponedoras   ·   Zamorano, Honduras<\/div>\n<div class=\"pre\">Manual de aves de postura   ·   Helvetas, Guatemala<\/div>\n<div class=\"pre\">Cría práctica de aves   ·   Peace Corps<\/div>\n<div class=\"pre\">Buenas prácticas para pequeños productores de   ·   INDAP, Chile<br>huevo<\/div>\n<p>Notas sobre los datos Las temperaturas semanales de criadora, el calcio de la ración, los parámetros de incubación y las densidades de pollitas son valores de práctica habitual en avicultura; las cartillas del INTA solo dan 32–33 °C hasta el emplume y no fijan densidades de cría. Se corrigieron dos errores evidentes de las cartillas originales: el grano de la fórmula de postura (7 → 70 kg) y la sal de la ración casera. Vacunas, antiparasitarios y dosis: confirmalos siempre con un veterinario o con el INTA AER Villa Regina.<\/p>\n<p>Page 30 of 30<\/p>\n<div class=\"pg\">pág. 32<\/div>"}]}],"found":12},{"id":"CAB","title":"Cabras lecheras y queso","sub":"Guía práctica completa","color":"#6b7d5a","kind":"pdf","c":[{"t":"Portada y contenido","s":[{"t":"Primeras páginas","h":"<div class=\"pg\">pág. 1<\/div>\n<div class=\"pre\">PROYECTO GRANJA   ·   VILLA REGINA · RÍO NEGRO<\/div>\n<p>Cabras lecheras y queso Guía práctica completa<\/p>\n<p>Cría · Ordeñe · Sanidad · Leche segura · Quesería · Recetas<\/p>\n<div class=\"pre\">Compilado a partir de INTA, SENASA y las mejores guías prácticas de cría   ·   Noviembre 2026<br>caprina y quesería artesanal.<\/div>\n<div class=\"pg\">pág. 2<\/div>\n<div class=\"pre\">Cabras lecheras y queso: guía práctica<br>completa<br>​Nov 17, 2026   ·   ·   ·   ​@Hernan<\/div>\n<p>Índice<br>1. Antes de empezar: la realidad<br>2. Razas y compra de animales<br>3. Instalaciones y espacio<br>4. Alimentación<br>5. Reproducción, preñez y parto<br>6. Crianza de chivitos<br>7. Ordeñe paso a paso<br>8. Sanidad<br>9. Calendario anual<br>10. La leche: higiene, enfriado y pasteurización<br>11. Quesería: equipo, insumos y principios<br>12. Recetas probadas<br>13. Problemas comunes y soluciones<br>14. Plan para tu escala (Villa Regina)<br>15. Fuentes<\/p>"}]},{"t":"1. Antes de empezar: la realidad","s":[{"t":"1. Antes de empezar: la realidad","n":"1","h":"<p>Lo que casi ningún instructivo dice al principio:<\/p>\n<p>Es un compromiso diario. Durante la lactancia (8 a 10 meses por cabra) se ordeña cada 12 horas, todos los días, feriados incluidos. Se puede pasar a un solo ordeñe diario y se pierde entre un 20 y un 30 % de leche, pero es la forma realista de sostenerlo si trabajás afuera. Nunca una cabra sola. Son animales de manada: una sola grita, se estresa y produce menos. Mínimo dos. Para que haya leche, tiene que parir todos los años. Eso implica servicio (macho o inseminación), partos, y chivitos que hay que criar, vender o faenar. Los machos nacidos son, en la práctica, cabrito para carne.<\/p>\n<p>Page 1 of 23<\/p>\n<div class=\"pg\">pág. 3<\/div>\n<p>El tiempo real: 1 a 1,5 h por día (dos ordeñes con limpieza, comida, agua, limpieza de corral) más 1 a 3 h de quesería cada 2 o 3 días. Cuánta leche esperar:<\/p>\n<div class=\"pre\">Tipo de cabra   ·   Litros/día en pico   ·   Litros por lactancia<\/div>\n<div class=\"pre\">Saanen buena   ·   3a4   ·   700 a 1.000<\/div>\n<div class=\"pre\">Anglo Nubian   ·   2a3   ·   500 a 700 (más grasa)<\/div>\n<div class=\"pre\">Cruza criolla × lechera   ·   1,5 a 2,5   ·   300 a 600<\/div>\n<div class=\"pre\">Criolla   ·   0,5 a 1,5   ·   150 a 300<\/div>\n<p>Cuánto queso sale: queso fresco/untable ≈ 1 kg cada 5–6 L; queso de campo semiblando ≈ 1 kg cada 7–9 L; semiduro para estacionar ≈ 1 kg cada 9–10 L. La leche de cabra rinde algo menos que la de vaca. Lo legal en Argentina (mínimo): inscribir el establecimiento en el RENSPA (SENASA) aunque sean pocos animales; los movimientos de caprinos se controlan con RENSPA. La brucelosis caprina tiene un Plan Nacional de Control (Res. SENASA 372/2017) y los tambos deben hacer diagnóstico de tuberculosis (Res. 128/2012). Para autoconsumo alcanza con animales sanos y análisis; para vender queso hace falta sala de elaboración habilitada por bromatología y registro del producto. Además, verificá la ordenanza municipal: en zona urbana suele estar prohibido tener ganado.<\/p>"}]},{"t":"2. Razas y compra de animales","s":[{"t":"2. Razas y compra de animales","n":"2","h":"<p>Qué raza Saanen (blanca): la que más leche da, mansa. Sufre sol fuerte (piel clara): necesita sombra. Leche con menos grasa (~3,5 %). Anglo Nubian (orejas caídas): menos litros pero más sólidos (grasa 4,5–5 %+), mejor rendimiento quesero, tolera calor. Más ruidosa. Alpina / Toggenburg: intermedias, buenas lecheras, rústicas. Criolla: muy rústica, poca leche y muy estacional. Cruzas Saanen × Nubian o criolla × lechera: la opción más realista para empezar: aguantan, son baratas y dan leche razonable.<\/p>\n<p>Para el Alto Valle (veranos secos y calurosos, inviernos fríos): Saanen con buena sombra, o cruza Saanen × Nubian.<\/p>\n<p>Page 2 of 23<\/p>\n<div class=\"pg\">pág. 4<\/div>\n<p>Cómo comprar (lo más importante de toda la guía) El 80 % de los problemas sanitarios entra con el animal comprado.<\/p>\n<p>Comprá en tambos o cabañas con análisis, nunca en feria ni a intermediarios. Pedí resultados negativos de brucelosis y tuberculosis; idealmente también CAEV (artritis-encefalitis caprina), paratuberculosis y que no haya historia de linfadenitis caseosa (bultos con pus en cuello, detrás de la mandíbula, delante de la paleta). Lo ideal para arrancar: 2 cabras de 2º o 3º parto, ya en ordeñe y acostumbradas a la tarima. Ves cuánta leche dan, cómo es la ubre, y no aprendés a ordeñar con una cabra que nunca fue ordeñada. Las primerizas dan menos y son más nerviosas. Pedí ver un ordeñe.<\/p>\n<p>Checklist en el lugar Ubre simétrica, bien pegada al cuerpo, que quede blanda y arrugada después del ordeñe (si sigue dura o con nudos: mastitis crónica o CAEV). Dos pezones de buen tamaño, apuntando hacia abajo, sin pezones extra. Leche sin grumos (probá los primeros chorros en un fondo oscuro). Rodillas sin hinchazón (CAEV). Sin bultos en ganglios del cuello y la paleta. Mucosa del ojo rosada o roja, no pálida (anemia por parásitos). Pezuñas recortadas, no renga. Ni flaca (costillas y columna marcadas) ni gorda; ojos vivos, pelo brillante, rumia tranquila. Dientes completos (edad): cabras de 2 a 5 años. Preguntá fecha del último parto, si está preñada, qué come y qué vacunas tiene.<\/p>"}]},{"t":"3. Instalaciones y espacio","s":[{"t":"3. Instalaciones y espacio","n":"3","h":"<div class=\"pre\">Elemento   ·   Medida / criterio<\/div>\n<div class=\"pre\">Refugio techado   ·   1,5 a 2 m² por cabra; seco, sin corrientes de aire a la<br>altura del animal pero ventilado arriba<\/div>\n<div class=\"pre\">Patio/corral   ·   Mínimo 5 a 10 m² por cabra (más es mejor)<\/div>\n<div class=\"pre\">Cerco   ·   1,20 a 1,50 m; malla romboidal o electrosoldada<br>firme, o eléctrico de 4–5 hilos. Saltan, trepan y se<br>apoyan en todo<\/div>\n<p>Page 3 of 23<\/p>\n<div class=\"pg\">pág. 5<\/div>\n<div class=\"pre\">Elemento   ·   Medida / criterio<\/div>\n<div class=\"pre\">Cama   ·   Paja o viruta sobre tierra compactada; agregar<br>cama limpia encima y sacar todo cada 1–3 meses<br>(va al compost)<\/div>\n<div class=\"pre\">Comedero de heno   ·   Elevado, con rejilla: no comen lo que tocó el piso y<br>desperdician hasta un 30 % si lo tirás al suelo<\/div>\n<div class=\"pre\">Bebedero   ·   Agua limpia y fresca siempre. Una cabra en ordeñe<br>toma 4 a 8 L/día, más en verano. Sin agua no hay<br>leche<\/div>\n<div class=\"pre\">Sombra   ·   Imprescindible en verano (árboles, media sombra)<\/div>\n<div class=\"pre\">Sala de ordeñe   ·   Separada del corral, piso y paredes lavables, agua<br>cerca<\/div>\n<div class=\"pre\">Tarima de ordeñe   ·   40–50 cm de alto, con cepo para la cabeza y<br>comedero: la cabra come su ración mientras la<br>ordeñás<\/div>\n<div class=\"pre\">Corral de parición   ·   2 × 2 m, aparte, con cama limpia<\/div>\n<div class=\"pre\">Macho (si hay)   ·   Corral propio, lejos de la sala de ordeñe (el olor<br>pasa a la leche)<\/div>\n<div class=\"pre\">Extras   ·   Plataformas o troncos para trepar; bloque de sal<br>mineral; depósito de heno seco y protegido de<br>roedores<\/div>\n<p>Regla clave: las cabras odian el agua y el barro. Refugio seco es más importante que refugio abrigado: aguantan bien el frío si están secas y sin viento.<\/p>"}]},{"t":"4. Alimentación","s":[{"t":"4. Alimentación","n":"4","h":"<p>La cabra es un rumiante ramoneador: la base de su dieta es fibra (heno, pasto, ramas). El grano es un complemento para sostener la leche.<\/p>\n<p>Ración práctica de una cabra en ordeñe (60 kg) Heno de alfalfa de buena calidad a voluntad: come unos 2 a 3 kg por día. La alfalfa es ideal en lactancia por proteína y calcio. Concentrado (maíz partido, avena, balanceado lechero): regla práctica ~300 g por cada litro que da, repartido entre los ordeñes, sin pasar de 1–1,2 kg/día. Ejemplo: cabra de 3 L → ~900 g/día.<\/p>\n<p>Page 4 of 23<\/p>\n<div class=\"pg\">pág. 6<\/div>\n<p>Sal mineral para cabras a libre disposición (no uses la de ovinos: es baja en cobre y las cabras lo necesitan). Ramoneo: ramas de poda (manzano, peral, sauce, álamo, morera), restos de huerta, malezas. Les encanta y ahorra heno. Agua limpia siempre.<\/p>\n<p>Por etapa Seca (los 2 meses antes del parto): heno y muy poco grano. No engordarlas. Último mes de preñez: subir el grano de a poco hasta 300–500 g/día (evita la toxemia de preñez, sobre todo con mellizos). Inicio de lactancia: subir gradualmente hasta la ración completa en 2–3 semanas. 2–3 semanas antes del servicio: subir un poco la comida (&quot;flushing&quot;) mejora la ovulación y los mellizos.<\/p>\n<p>Reglas que evitan muertes<br>1. Todo cambio de dieta, gradual (7 a 10 días). El cambio brusco o un atracón de grano causa acidosis o enterotoxemia (muerte súbita).<br>2. Alfalfa verde con cuidado: riesgo de empaste (timpanismo). Entrar al alfalfar con la panza llena de heno, nunca hambrientas ni con rocío, al principio pocos minutos.<br>3. Grano guardado bajo llave: una cabra que se escapa al bolso de maíz puede morir.<br>4. Silaje: mejor no en escala casera (listeriosis, clostridios que arruinan el queso).<\/p>\n<p>Plantas tóxicas a sacar o vigilar Laurel de jardín / adelfa (Nerium oleander): muy común en el Alto Valle y mortal con pocas hojas. Hojas marchitas de frutales de carozo (durazno, ciruelo, cerezo, damasco): cianuro. Las frescas en poca cantidad, mejor evitarlas también. Rebrotes de sorgo o sorgo helado (cianuro). Chamico (Datura), mio-mio / romerillo (Baccharis coridifolia), tejo, azalea/rododendro, papa verde, palta (hojas).<\/p>\n<p>Condición corporal Palpá el lomo detrás de las costillas: si sentís cada vértebra filosa, está flaca; si no sentís nada, gorda. Buscá el punto medio. Una cabra flaca no da leche; una gorda tiene problemas de parto.<\/p>\n<p>Page 5 of 23<\/p>\n<div class=\"pg\">pág. 7<\/div>"}]},{"t":"5. Reproducción, preñez y parto","s":[{"t":"5. Reproducción, preñez y parto","n":"5","h":"<p>Datos básicos Estacionales: entran en celo en otoño (marzo a junio en el hemisferio sur). Partos en invierno-primavera (agosto a octubre). Ciclo: celo cada ~21 días (18–22), dura 1 a 2 días. Gestación: ~150 días (145–155). Fecha de parto ≈ fecha de servicio + 5 meses − 3 días. Chivitas: primer servicio a los 7–10 meses si alcanzaron ~60–70 % del peso adulto (35– 40 kg en Saanen). Si no, esperar al año siguiente. Mellizos son lo normal (1 a 3 crías).<\/p>\n<p>Signos de celo Mueve la cola rápido de lado a lado, bala mucho, vulva roja e hinchada, moco claro, se monta con otras, baja un poco la leche, se pega al cerco si hay un macho cerca.<\/p>\n<p>El macho: cómo resolverlo con pocas cabras Con menos de 5–6 cabras no conviene tener macho propio (come todo el año, huele fuerte, es peligroso y ese olor pasa a la leche). Opciones: servicio a domicilio o llevar las cabras a un macho de un tambo con sanidad controlada (exigí análisis: la brucelosis se transmite por servicio), o inseminación artificial con un veterinario. Efecto macho: si las cabras no vieron ni olieron un macho por un mes, su llegada sincroniza los celos en 5–10 días. Un macho alcanza para 25–40 cabras. Dejalo con ellas ~45 días (dos ciclos). Confirmá preñez con ecografía a los 35–45 días.<\/p>\n<p>Tener leche todo el año Con dos cabras, servilas con 2–3 meses de diferencia (una al principio y otra al final de la temporada). Así nunca están las dos secas a la vez. También hay cabras que con buen manejo siguen ordeñándose 18–24 meses sin volver a parir (&quot;lactancia extendida&quot;): vale la pena probar con las más lecheras.<\/p>\n<p>Señales de parto inminente (12–48 h antes) Los ligamentos a los lados de la cola se aflojan y casi desaparecen al tacto (la señal más confiable). Ubre llena, tensa y brillante.<\/p>\n<p>Page 6 of 23<\/p>\n<div class=\"pg\">pág. 8<\/div>\n<p>Moco colgando, inquietud, se aparta, rasca la cama, se echa y se levanta.<\/p>\n<p>El parto<br>1. Llevala al corral de parición limpio. Observá sin intervenir: la mayoría pare sola.<br>2. Aparece la bolsa de agua; luego, en una presentación normal, dos patas delanteras con la cabeza apoyada encima (&quot;posición de zambullida&quot;).<br>3. Cuándo ayudar o llamar al vet: más de 30–45 minutos de pujo fuerte sin avance; solo se ve la cabeza, una pata, la cola o patas con las plantas hacia arriba (puede venir de atrás, que es posible pero hay que sacarlo rápido); más de 1 hora entre un chivito y otro con la cabra pujando.<br>4. Si ayudás: uñas cortas, guantes largos, mucho lubricante, acompañá el pujo tirando hacia abajo y afuera, nunca a la fuerza.<br>5. Limpiá la nariz y la boca del chivito; si no respira, frotalo fuerte con una toalla.<br>6. Ombligo: sumergilo en yodo al 7 % (o povidona).<br>7. Ofrecele a la cabra agua tibia con un poco de melaza o azúcar.<br>8. Placenta: sale en 1–6 h. Si a las 12–24 h no salió, veterinario. No tirar de ella.<br>9. Asegurá que cada chivito tome calostro en la primera hora (ver sección 6).<\/p>\n<p>Kit de parto Guantes largos de examen y gel lubricante Yodo al 7 % y un frasquito para el ombligo Toallas viejas Pera de goma para aspirar mocos Calostro congelado de reserva (de tus cabras o de un tambo sano) Mamadera con tetina para chivitos y sonda para alimentar a chivitos débiles Termómetro, linterna, tijera limpia, hilo Teléfono del veterinario anotado<\/p>"}]},{"t":"6. Crianza de chivitos","s":[{"t":"6. Crianza de chivitos","n":"6","h":"<p>Calostro: lo que define si vive El chivito nace sin defensas: las recibe del calostro. Tiene que tomar en la primera hora y alrededor del 10 % de su peso en las primeras 24 h (un chivito de 3,5 kg: ~350 ml repartidos en 3–4 tomas). Si no succiona, se da con sonda. Congelá calostro sobrante en botellas de 250 ml: es tu seguro de vida.<\/p>\n<p>Page 7 of 23<\/p>\n<div class=\"pg\">pág. 9<\/div>\n<p>La leche de los primeros 3–5 días posparto es calostro y transición: no sirve para queso; va a los chivitos o se congela.<\/p>\n<p>Dos sistemas A. Con la madre + ordeñe compartido (el más simple para la casa)<\/p>\n<p>Las primeras 2 semanas, chivitos con la madre todo el día. Después: separás los chivitos de noche (en un corral pegado, que se vean), ordeñás a la mañana y los juntás de día. Tenés un ordeñe diario sin mamaderas. Requisito: que las madres estén libres de CAEV (se contagia por calostro y leche).<\/p>\n<p>B. Crianza artificial (control total de la leche y de CAEV)<\/p>\n<p>Separás al nacer. Calostro tratado a 56 °C por 60 min (no más: se coagula) y leche pasteurizada. Leche: 15–20 % del peso vivo por día, 3–4 tomas al principio y 2 después de las 3 semanas. Tibia (~39 °C), utensilios limpios. Desde la semana 1–2: heno fino, balanceado de inicio y agua a disposición.<\/p>\n<p>Destete Entre las 8 y 12 semanas, cuando comen bien sólido y pesan ~2,5 veces el peso al nacer. Bajar la leche de a poco en una semana.<\/p>\n<p>Tareas Descornado (opcional pero recomendado para ordeñe: los cuernos lastiman ubres y personas): entre los 3 y 10 días de vida con descornador eléctrico. La primera vez, que te enseñe un veterinario. Machos: castrar los que no se van a quedar, o faenar como cabrito a los 45–60 días (10–12 kg). Es el destino realista de la mitad de los nacimientos. Vacuna clostridial a los 1–2 meses + refuerzo a las 3–4 semanas. Coccidiosis (3 a 8 semanas de edad): diarrea, a veces con sangre, retraso. Prevención: corrales secos, comederos y bebederos donde no puedan pisar ni defecar. Tratamiento con el veterinario.<\/p>\n<p>Page 8 of 23<\/p>\n<div class=\"pg\">pág. 10<\/div>"}]},{"t":"7. Ordeñe paso a paso","s":[{"t":"7. Ordeñe paso a paso","n":"7","h":"<p>Equipo mínimo Balde de acero inoxidable (ideal: con tapa semicerrada que deja solo una boca), taza de fondo negro para el despunte, filtros descartables de leche y colador, frascos de vidrio con tapa, toallas de papel, solución de sellado de pezones (yodo 0,5–1 % o clorhexidina) en vasito, alcohol en gel. Evitá el plástico: se raya y acumula bacterias.<\/p>\n<p>Rutina (cada 12 h, siempre a la misma hora)<br>1. Cabra a la tarima con su ración de concentrado. Lugar tranquilo, sin perros ni gritos.<br>2. Manos lavadas, uñas cortas.<br>3. Cepillar flancos y ubre para que no caigan pelos ni polvo. Recortá los pelos largos de la ubre cada tanto.<br>4. Limpiar pezones: presellador o paño con agua tibia (uno por cabra) y secar bien con papel. Pezón mojado = leche sucia.<br>5. Despunte: 2–3 chorros de cada pezón en la taza de fondo negro. Si hay grumos, hilos, sangre o leche aguada → mastitis: esa cabra se ordeña al final y su leche se descarta.<br>6. Ordeñar (siempre de costado, nunca desde atrás, para que no caiga orina ni bosta al balde): Rodeá la base del pezón con pulgar e índice y cerrá para atrapar la leche. Cerrá los demás dedos uno a uno, de arriba hacia abajo, empujando la leche hacia afuera. Abrí la mano, dejá que el pezón se llene, repetí. Alterná manos con ritmo. No tires del pezón ni lo &quot;ordenes&quot; deslizando los dedos.<br>7. Apurar: al final, dos o tres empujoncitos suaves en la ubre hacia arriba (imita al chivito) y sacá lo último. Vaciar bien previene mastitis y sostiene la producción.<br>8. Sellar: sumergí cada pezón en el vaso de sellador. El canal queda abierto ~30 min: dale heno para que no se eche.<br>9. Filtrar al instante y enfriar (sección 10).<\/p>\n<p>Una persona con práctica ordeña una cabra en 5–8 minutos. Las primeras semanas vas a tardar 20 y te van a doler las manos: es normal.<\/p>\n<p>Lavado del equipo (todos los ordeñes)<br>1. Enjuague con agua tibia, no caliente (el agua caliente cocina la proteína y la pega).<br>2. Lavado con detergente y agua caliente, cepillo exclusivo.<br>3. Enjuague.<\/p>\n<p>Page 9 of 23<\/p>\n<div class=\"pg\">pág. 11<\/div>\n<p>4. 1–2 veces por semana, enjuague con solución ácida (vinagre o ácido para tambos) para sacar la &quot;piedra de leche&quot;.<br>5. Secado boca abajo en rejilla.<br>6. Antes de usar: enjuague con agua clorada (1 cucharada de lavandina por 4 L) o agua hirviendo.<\/p>\n<p>Problemas típicos al ordeñar Patea o se sienta: rutina fija, comida rica en la tarima, sostener la pata trasera contra tu antebrazo, maneas suaves en las primeras semanas. Paciencia: se acostumbran. Pezón chico: ordeñá con pulgar y dos dedos. Ordeñadora: con más de 4–6 cabras vale la pena una ordeñadora portátil de un balde (o una de vacío manual). Para 2 cabras, a mano. Antibióticos: si una cabra está en tratamiento, su leche se descarta durante todo el tiempo de retiro que indique el producto. Además, la leche con antibiótico no cuaja bien porque mata los fermentos.<\/p>"}]},{"t":"8. Sanidad","s":[{"t":"8. Sanidad","n":"8","h":"<p>Antes de comprar las cabras, conseguí un veterinario que atienda pequeños rumiantes. Consultá en la oficina local de SENASA y en el INTA EEA Alto Valle (Allen) y sus agencias de extensión: suelen saber quién trabaja con caprinos en la zona. Todo lo que sigue se ajusta con él.<\/p>\n<p>Page 10 of 23<\/p>\n<div class=\"pg\">pág. 12<\/div>\n<p>Rutina preventiva<\/p>\n<div class=\"pre\">Qué   ·   Cuándo<\/div>\n<div class=\"pre\">Análisis de brucelosis (y TBC si ordeñás)   ·   Al comprar y luego una vez por año<\/div>\n<div class=\"pre\">Vacuna clostridial polivalente   ·   Primera vez: 2 dosis con 3–4 semanas de<br>(enterotoxemia, tétanos, mancha, gangrena)   ·   diferencia. Luego refuerzo anual 3–4<br>semanas antes del parto (protege a los<br>chivitos por el calostro)<\/div>\n<div class=\"pre\">Control de parásitos internos (FAMACHA +   ·   Cada 2–4 semanas en época cálida y bajo<br>análisis de bosta)   ·   riego; mensual el resto<\/div>\n<div class=\"pre\">Recorte de pezuñas   ·   Cada 6–8 semanas<\/div>\n<div class=\"pre\">CMT (test de mastitis)   ·   Mensual<\/div>\n<div class=\"pre\">Condición corporal y peso   ·   Mensual<\/div>\n<p>Parásitos internos: el problema n.º 1 de las cabras El más peligroso es Haemonchus: chupa sangre, produce anemia, edema bajo la mandíbula (&quot;cuello de botella&quot;) y muerte. Método FAMACHA: bajá el párpado inferior y mirá el color: rojo/rosado fuerte = bien; rosado pálido = vigilar; blanco = tratar ya. Desparasitá solo a las que lo necesitan (pálidas o con conteo alto de huevos en bosta), no a todas &quot;por calendario&quot;. La resistencia a los antiparasitarios en cabras es enorme. Las cabras metabolizan más rápido los antiparasitarios que las ovejas: muchas drogas requieren dosis mayores. Nunca calcules la dosis vos: veterinario. Tiempos de retiro en leche: muchos productos no están aprobados para cabras en ordeñe. Preguntá siempre. Manejo que ayuda: rotar potreros, no pastorear al ras, comederos elevados, ramoneo (las larvas están en los primeros 5 cm del pasto).<\/p>\n<p>Enfermedades que tenés que conocer Brucelosis (Brucella melitensis): abortos en el último tercio, inflamación de testículos en machos. Zoonosis grave (fiebre de Malta): se contagia por leche cruda y por contacto con partos y abortos. Por eso: análisis y pasteurización. Tuberculosis: también zoonosis, se controla con diagnóstico.<\/p>\n<p>Page 11 of 23<\/p>\n<div class=\"pg\">pág. 13<\/div>\n<p>CAEV: artritis (rodillas hinchadas), &quot;ubre de madera&quot; dura y con poca leche. Se transmite por calostro y leche; no tiene cura. Prevención: comprar negativos. Linfadenitis caseosa: abscesos con pus espeso en ganglios. Muy contagiosa. Aislar al animal; que el absceso lo abra el veterinario y no se derrame en el corral. Enterotoxemia: muerte súbita o diarrea fuerte tras cambio de comida o atracón de grano. Vacuna + cambios graduales. Toxemia de preñez: últimas semanas, cabra con mellizos que deja de comer, se aísla, tiembla, aliento a acetona. Urgencia: propilenglicol (60 ml dos veces por día por boca) y veterinario. Hipocalcemia (alrededor del parto): debilidad, se cae, fría. Calcio inyectable con el vet. Mastitis: ubre caliente, dura, dolorosa, leche con grumos o aguada. Si la ubre se pone azulada y fría, es gangrenosa: emergencia. Empaste (timpanismo): flanco izquierdo hinchado como tambor, se queja. Urgencia: 100–200 ml de aceite vegetal por boca, hacerla caminar, veterinario. Ectima contagioso (boquera): costras en labios; se contagia a las personas (guantes). Machos castrados: cálculos urinarios si comen mucho grano (pujan sin orinar = urgencia).<\/p>\n<p>Señales de alarma No come, no rumia, se aísla, cabeza gacha, rechina dientes, fiebre (normal rectal: 38,5 a 40 °C), diarrea, cojera, baja brusca de leche. Una cabra enferma se muere rápido: no esperes al día siguiente.<\/p>\n<p>Botiquín básico Termómetro digital Jeringas y agujas descartables Yodo 7 %, spray cicatrizante/curabichera Tijera de pezuñas (sirve tijera de podar) Propilenglicol Aceite vegetal o mineral (empaste) Sales de rehidratación Sonda para chivitos Reactivo CMT y paleta Vacuna clostridial (heladera) Lo que indique tu veterinario (antiinflamatorio, antibiótico, calcio, vitamina B1)<\/p>\n<p>Page 12 of 23<\/p>\n<div class=\"pg\">pág. 14<\/div>\n<p>Cuaderno de registro: nacimientos, servicios, partos, tratamientos, litros<\/p>"}]},{"t":"9. Calendario anual (hemisferio sur, Alto Valle)","s":[{"t":"9. Calendario anual (hemisferio sur, Alto Valle)","n":"9","h":"<div class=\"pre\">Mes   ·   Qué pasa   ·   Qué hacer<\/div>\n<div class=\"pre\">Enero–Febrero   ·   Fin de lactancia,   ·   Sombra y agua; FAMACHA seguido; recorte de<br>calor   ·   pezuñas; análisis anual de brucelosis; flushing<br>2–3 semanas antes del servicio; conseguir<br>macho o turno de inseminación<\/div>\n<div class=\"pre\">Marzo–Mayo   ·   Temporada de celo   ·   Servicios (escalonados si querés leche<br>continua); anotar fechas; ecografía 35–45 días<br>después<\/div>\n<div class=\"pre\">Junio–Julio   ·   Frío; preñez   ·   Secado 2 meses antes del parto: cortar el<br>grano, pasar a un ordeñe diario y después día<br>por medio hasta cortar en ~1 semana; refugio<br>seco; comprar heno para todo el invierno<\/div>\n<div class=\"pre\">Julio–Agosto   ·   Último mes de   ·   Vacuna clostridial 3–4 semanas antes del parto;<br>preñez   ·   subir el grano de a poco; recortar pelos de ubre<br>y cola; armar corral de parición y kit<\/div>\n<div class=\"pre\">Agosto–Octubre   ·   Partos   ·   Calostro; yodo al ombligo; congelar calostro;<br>empezar ordeñe a los 4–5 días para queso<\/div>\n<div class=\"pre\">Octubre–   ·   Pico de leche   ·   Quesería a full: hacer semiduros para guardar<br>Diciembre   ·   todo el año; destete a las 8–12 semanas;<br>vacunar chivitos; faena o venta de machos; ojo<br>parásitos bajo riego<\/div>\n<p>Una lactancia normal dura ~280–305 días. El pico llega a las 4–8 semanas del parto y después baja de a poco.<\/p>"}]},{"t":"10. La leche: higiene, enfriado y pasteurización","s":[{"t":"10. La leche: higiene, enfriado y pasteurización","n":"10","h":"<p>La calidad del queso se decide en el ordeñe, no en la olla.<\/p>\n<p>Por qué pasteurizar (en serio) La leche cruda puede transmitir brucelosis (fiebre de Malta), Listeria, tuberculosis, Campylobacter y E. coli productora de toxina Shiga, que causa el síndrome urémico hemolítico (Argentina tiene una de las tasas más altas del mundo en niños).<\/p>\n<p>Page 13 of 23<\/p>\n<div class=\"pg\">pág. 15<\/div>\n<p>Recomendación realista:<\/p>\n<p>Quesos frescos, untables, ricota, feta y yogur: siempre con leche pasteurizada. Quesos de leche cruda solo si: animales con análisis negativos, higiene impecable, y maduración de 60 días o más (reduce, no elimina, el riesgo). Nunca para niños, embarazadas, mayores o inmunodeprimidos.<\/p>\n<p>Pasteurización casera lenta<br>1. Leche filtrada en olla de acero inoxidable, a baño maría (olla dentro de otra con agua) para no quemarla.<br>2. Calentar revolviendo hasta 63–65 °C y mantener 30 minutos (tapada, controlando con termómetro).<br>3. Enfriar rápido: pasar la olla a una pileta con agua fría y hielo, revolviendo, hasta la temperatura de la receta o hasta 4 °C para guardar.<br>4. No pasar de 72–75 °C si es para queso: la proteína se daña, la cuajada queda blanda y rinde menos.<br>5. Después de pasteurizar, para quesos de cuajo, agregá cloruro de calcio (~1/4 cucharadita de solución al 30 % cada 4 L, diluido en un poco de agua sin cloro). Devuelve la firmeza a la cuajada.<\/p>\n<p>Enfriado Filtrar y bajar la leche a menos de 4 °C en 1–2 horas. Frasco o balde de acero en agua con hielo, revolviendo; después a la heladera. Usar para queso en 2–3 días como máximo. Para juntar leche de varios días, mejor hacer un queso cada 2 días. La leche se puede congelar para yogur, dulce de leche o jabón; para queso de cuajo no es lo ideal.<\/p>\n<p>¿Por qué la leche de cabra &quot;tiene gusto a chivo&quot;? Una leche bien manejada casi no tiene olor. El gusto fuerte viene de: macho cerca de las cabras o de la sala de ordeñe, leche mal enfriada o vieja, agitarla mucho (romper la grasa la enrancia), cabras en fin de lactancia o con mastitis, y algunas plantas. Arreglá eso y desaparece.<\/p>\n<p>Termómetro Comprate uno digital de pincho y calibralo: en un vaso con mucho hielo y poca agua tiene que marcar 0 °C.<\/p>\n<p>Page 14 of 23<\/p>\n<div class=\"pg\">pág. 16<\/div>"}]},{"t":"11. Quesería: equipo, insumos y principios","s":[{"t":"11. Quesería: equipo, insumos y principios","n":"11","h":"<p>Equipo Olla de acero inoxidable de 10–20 L + otra más grande para baño maría Termómetro digital calibrado Cuchillo largo o lira para cortar la cuajada; espumadera; cucharón Lienzo de quesería (tela de trama abierta, se hierve antes de cada uso) Moldes perforados de plástico alimentario (casas de insumos queseros) Prensa: casera de palanca o tornillo, o simplemente un plato con bidones de agua como peso Balanza de cocina y una de precisión (0,01 g) para fermentos Recipiente para salmuera Cava: una heladera vieja con termostato externo enchufado (tipo controlador de temperatura) a 10–13 °C, con un recipiente con agua para humedad (85–90 %). Opcional: higrómetro Opcional pero muy útil: medidor de pH<\/p>\n<p>Insumos Cuajo: líquido o en polvo (quimosina). Siempre la dosis del fabricante; disolverlo en agua fría sin cloro justo antes de usar. Referencia típica de cuajo líquido estándar: 0,2– 0,3 ml por litro para quesos de cuajo; unas gotas para el chèvre. Fermentos: Mesófilos (trabajan a 20–32 °C): quesos frescos, chèvre, queso de campo, semiduros, feta. Termófilos (trabajan a 37–45 °C): yogur, quesos de pasta cocida. Alternativa tradicional: suero del queso del día anterior, o yogur natural / leche cultivada. Funciona, pero es menos parejo. Cloruro de calcio (para leche pasteurizada). Sal sin yodo (gruesa o fina). Agua sin cloro (hervida y enfriada, o reposada 24 h destapada).<\/p>\n<p>Los 8 pasos de cualquier queso (entendé esto y entendés todos)<br>1. Acidificar: el fermento convierte la lactosa en ácido láctico. Da sabor y ayuda a que salga el suero.<br>2. Cuajar: el cuajo (o el ácido) convierte la leche en un gel.<\/p>\n<p>Page 15 of 23<\/p>\n<div class=\"pg\">pág. 17<\/div>\n<p>3. Cortar: el tamaño del grano define la humedad. Grano grande (2 cm) = queso blando; grano chico (arroz o maíz) = queso duro.<br>4. Batir y cocinar: más tiempo y más temperatura = más suero sale = queso más seco y de más duración.<br>5. Desuerar y moldear.<br>6. Prensar: une los granos y forma la corteza.<br>7. Salar: en seco (1,5–2 % del peso) o en salmuera al ~20 % (200 g de sal por litro).<br>8. Orear y madurar: secar la superficie 1–3 días y luego cava.<\/p>\n<p>Punto de corte Quiebre limpio: meté un cuchillo en ángulo y levantá. Si la cuajada se abre limpia y el suero que aparece es verdoso y claro, está lista. Si se rompe como yogur, esperá 5 min más. Método de floculación (más preciso): al poner el cuajo, apoyá una tapita plástica en la leche y hacela girar cada tanto. Cuando deja de girar libre, anotá el tiempo. Multiplicá por 3 para quesos semiduros, por 4–5 para blandos. Eso es el tiempo total hasta el corte.<\/p>\n<p>Particularidades de la leche de cabra La cuajada es más frágil que la de vaca: cortá y revolvé con suavidad. Rinde un poco menos y la grasa se pierde fácil en el suero si se maltrata la cuajada. Leche de fin de lactancia cuaja peor y da más rendimiento; la de inicio de lactancia (post-calostro) cuaja raro: esperá una semana desde el parto. La crema de cabra sube muy lento: para manteca hace falta descremadora.<\/p>"}]},{"t":"12. Recetas probadas (de la más fácil a la más difícil)","s":[{"t":"12. Recetas probadas (de la más fácil a la más difícil)","n":"12","h":"<p>Orden recomendado para aprender: yogur → chèvre → ricota → queso de campo → feta → semiduro para estacionar. Todas con leche pasteurizada salvo que se indique.<\/p>\n<p>A. Yogur y labneh<br>1. Calentar 1 L de leche a 85 °C y mantener 10–20 min (el yogur de cabra sale líquido; este paso lo espesa. También ayuda agregar 2–3 cucharadas de leche en polvo).<br>2. Enfriar a 43 °C.<br>3. Agregar fermento termófilo de yogur o 2 cucharadas de un yogur natural sin aditivos.<br>4. Mantener a 42–43 °C durante 6–8 h (conservadora térmica con agua tibia, horno con la luz prendida).<\/p>\n<p>Page 16 of 23<\/p>\n<div class=\"pg\">pág. 18<\/div>\n<p>5. Heladera.<\/p>\n<p>Labneh: yogur con una pizca de sal, colgado en lienzo 12–24 h en la heladera → queso untable. Hecho bolitas y guardado en aceite de oliva con hierbas dura semanas.<\/p>\n<p>B. Chèvre / queso fresco untable (EL queso para empezar) 4 L de leche → ~700 g de queso<\/p>\n<p>1. Leche pasteurizada a 22–25 °C.<br>2. Agregar fermento mesófilo (dosis del sobre para 4 L; o 1/2 taza de suero de un chèvre anterior). Revolver 1 min.<br>3. Cuajo: solo 2–3 gotas diluidas en 50 ml de agua fría sin cloro. Revolver 1 min.<br>4. Tapar y dejar quieto 12–18 h a temperatura ambiente (20–24 °C). Está lista cuando es un bloque como yogur firme, despegado de los bordes y con suero amarillento arriba.<br>5. Pasar con cucharón a un lienzo o a moldes. Colgar 6–12 h (menos tiempo = más cremoso).<br>6. Salar: 1–1,5 % del peso (10–15 g de sal por kg), mezclar.<br>7. Versiones: con ciboulette, ajo, pimienta, pimientón ahumado, hierbas de la huerta; en rollo cubierto de ceniza vegetal; en bolitas en aceite.<br>8. Heladera: 1–2 semanas. Se congela muy bien.<\/p>\n<p>C. Ricota de suero (aprovecha lo que tirás)<br>1. Usar el suero fresco (de menos de 3 h) de un queso de cuajo (el del chèvre es muy ácido y no rinde).<br>2. Calentar a 85–90 °C revolviendo. Para más rendimiento, agregar 10–20 % de leche entera.<br>3. Agregar de a poco vinagre o jugo de limón (~30–50 ml cada 10 L) hasta que aparezcan copos blancos y el suero se vea verdoso claro.<br>4. Reposar 10 min sin revolver, recoger con espumadera en un lienzo, escurrir 30 min a 2 h.<br>5. Rinde poco (2–5 %) pero es gratis. Dura 4–5 días.<br>6. El suero final: excelente para gallinas y cerdos, o diluido para compost.<\/p>\n<p>D. Queso de campo / criollo semiblando (estilo del NOA) 10 L de leche → 1,1 a 1,4 kg. Listo en 1 semana, dura 1 mes en heladera.<\/p>\n<p>1. Leche a 32–34 °C. Opcional (mejor sabor y seguridad): fermento mesófilo y esperar 30–45 min.<br>2. Cloruro de calcio si la leche fue pasteurizada.<\/p>\n<p>Page 17 of 23<\/p>\n<div class=\"pg\">pág. 19<\/div>\n<p>3. Cuajo según fabricante. Revolver 1 min y dejar quieto 40–50 min hasta quiebre limpio.<br>4. Cortar en cubos de 1,5–2 cm. Reposar 5 min.<br>5. Revolver suave 15–20 min subiendo de a poco a 36–38 °C. Los granos se achican y se ponen más firmes.<br>6. Dejar decantar, sacar el suero y juntar la cuajada en el molde con lienzo, apretando con las manos.<br>7. Prensar liviano (peso de 3–5 veces el del queso) 4–6 h, dándolo vuelta 2–3 veces.<br>8. Salar: salmuera al 20 % durante ~8–12 h por kg, o frotar sal gruesa por todas las caras dos días seguidos.<br>9. Orear 2–3 días en heladera o lugar fresco, dándolo vuelta. Consumir desde los 7 días.<\/p>\n<p>Es el queso tradicional de los productores de Salta, Tucumán y Jujuy: blanco, compacto, sin agujeros.<\/p>\n<p>E. Feta / queso en salmuera (no necesita cava) 8 L → ~1,2 kg. Dura meses en la heladera.<\/p>\n<p>1. Leche a 32 °C + fermento mesófilo. Madurar 1 h.<br>2. Cloruro de calcio + cuajo. Quieto 40–60 min hasta quiebre limpio.<br>3. Cortar en cubos de 2 cm, reposar 10 min, revolver muy suave 15–20 min a 32 °C.<br>4. Pasar a moldes o lienzo y dejar escurrir 12–24 h a temperatura ambiente, dando vuelta varias veces. Tiene que quedar firme y algo ácido.<br>5. Cortar en bloques, salar en seco (cubrir de sal fina) y dejar 1–2 días en la heladera.<br>6. Guardar sumergido en salmuera al 7–8 % (70–80 g de sal por litro de agua hervida fría, o mejor, de suero) con una pizca de cloruro de calcio.<br>7. Listo a las 2–4 semanas. Si queda muy salado, remojar en leche o agua antes de comer.<\/p>\n<p>F. Semiduro para estacionar (para guardar la leche de primavera) 15–20 L → 1,5 a 2 kg. Estacionado 2 a 6 meses. Tipo tomme/gouda de cuajada lavada, ideal para leche de cabra porque queda dulce y no ácido.<\/p>\n<p>1. Leche a 32 °C + fermento mesófilo. Madurar 45–60 min.<br>2. Cloruro de calcio + cuajo. Medir floculación y multiplicar × 3 (~35–45 min).<br>3. Cortar a 1 cm (granos tipo maíz). Reposar 5 min.<br>4. Revolver suave 10 min.<br>5. Lavado: sacar 1/3 del suero y reemplazarlo de a poco con agua a 55–60 °C hasta llevar la cuajada a 36–38 °C.<\/p>\n<p>Page 18 of 23<\/p>\n<div class=\"pg\">pág. 20<\/div>\n<p>6. Revolver 30–40 min hasta que el grano esté firme: un puñado apretado en la mano se mantiene unido y al frotarlo con el pulgar se separa en granos.<br>7. Juntar la cuajada bajo el suero, pasarla al molde con lienzo.<br>8. Prensado progresivo (dando vuelta y reacomodando el lienzo entre etapas): 5 kg 30 min → 10 kg 1 h → 15–20 kg 6–12 h.<br>9. Salmuera al 20 % (saturada a medias, a 10–15 °C): ~3–4 h por kg de queso, dándolo vuelta a mitad.<br>10. Orear 2–3 días hasta que la superficie esté seca.<br>11. Cava a 10–13 °C y 85–90 % de humedad. Dar vuelta todos los días la primera semana, después 2–3 veces por semana. Limpiar mohos con un paño humedecido en salmuera o salmuera con vinagre. Opción: después de 2–3 semanas, encerar con cera para quesos o envasar al vacío y madurar en la cava sin tanto cuidado.<br>12. Comer desde los 60 días. A los 4–6 meses es otro queso.<\/p>\n<p>Variantes: frotar la corteza con aceite y pimentón; agregar comino o ají molido a la cuajada antes de moldear; mezclar hasta un 30 % de leche de vaca para suavizar el sabor si a la familia le cuesta.<\/p>\n<p>G. Dulce de leche de cabra<br>1. 4 L de leche + 800 g a 1 kg de azúcar + 1/2 cucharadita de bicarbonato + una vaina de vainilla.<br>2. Hervir y después cocinar a fuego medio revolviendo seguido 2–3 h hasta que tome color y al poner una gota en un plato frío no corra.<br>3. Envasar caliente en frascos esterilizados. Rinde ~1,3 kg.<\/p>\n<p>Es el mejor destino para la leche de fin de lactancia y la que sobra.<\/p>"}]},{"t":"13. Problemas comunes y soluciones","s":[{"t":"13. Problemas comunes y soluciones","n":"13","h":"<p>En la quesería<\/p>\n<div class=\"pre\">Problema   ·   Causa probable   ·   Solución<\/div>\n<div class=\"pre\">No cuaja o cuaja muy   ·   Leche calentada de más,   ·   No pasar de 65 °C al<br>blando   ·   cuajo vencido o diluido en   ·   pasteurizar; cuajo nuevo en<br>agua con cloro, falta de   ·   heladera; agua sin cloro;<br>cloruro de calcio, leche con   ·   CaCl₂ siempre con leche<br>antibiótico, temperatura baja   ·   pasteurizada; descartar<br>leche de cabras tratadas<\/div>\n<p>Page 19 of 23<\/p>\n<div class=\"pg\">pág. 21<\/div>\n<div class=\"pre\">Problema   ·   Causa probable   ·   Solución<\/div>\n<div class=\"pre\">Mucha grasa y cuajada   ·   Corte apurado o revolver   ·   Esperar el quiebre limpio; los<br>perdida en el suero   ·   brusco   ·   primeros 5 min revolver casi<br>sin tocar<\/div>\n<div class=\"pre\">Queso amargo   ·   Exceso de cuajo, poca sal,   ·   Bajar el cuajo; salar bien;<br>mucha humedad   ·   cortar más chico<\/div>\n<div class=\"pre\">Queso inflado en los   ·   Coliformes: contaminación   ·   Higiene de ordeñe, enfriado<br>primeros días, con   ·   en el ordeñe o en la leche   ·   rápido, pasteurizar, fermento<br>agujeritos y olor feo   ·   suficiente. Ese queso se tira<\/div>\n<div class=\"pre\">Queso que se agrieta o   ·   Clostridios (silaje, bosta en la   ·   Nada de silaje; pezones<br>hincha a los 1–2 meses   ·   leche)   ·   limpios y secos<\/div>\n<div class=\"pre\">Muy ácido y desmigable   ·   Mucho fermento o mucho   ·   Menos fermento, desuerar<br>tiempo antes de desuerar   ·   antes, lavar la cuajada<br>(receta F)<\/div>\n<div class=\"pre\">Muy seco y duro   ·   Grano muy chico,   ·   Cortar más grande, cocinar<br>temperatura o prensado   ·   menos<br>excesivos<\/div>\n<div class=\"pre\">Corteza pegajosa con moho   ·   Demasiada humedad en la   ·   Limpiar con salmuera,<br>negro o &quot;pelos&quot;   ·   cava   ·   ventilar, bajar la humedad<\/div>\n<div class=\"pre\">Corteza agrietada   ·   Aire muy seco   ·   Subir la humedad, encerar o<br>envasar al vacío<\/div>\n<div class=\"pre\">Gusto fuerte &quot;a chivo&quot;   ·   Macho cerca, leche vieja o   ·   Ver sección 10<br>agitada<\/div>\n<p>Con las cabras<\/p>\n<div class=\"pre\">Problema   ·   Revisar<\/div>\n<div class=\"pre\">Baja la leche de golpe   ·   Agua (¿había?), calor, cambio de comida, celo,<br>mastitis (CMT), parásitos (FAMACHA), dolor de<br>pezuñas, estrés<\/div>\n<div class=\"pre\">Se escapan   ·   Cerco: altura, tensión, puntos para trepar cerca del<br>alambre. Una vez que aprenden, insisten<\/div>\n<div class=\"pre\">Se comen los árboles   ·   Las cabras descortezan y matan frutales:<br>protegelos con malla o eléctrico; nunca sueltas en<br>la huerta<\/div>\n<p>Page 20 of 23<\/p>\n<div class=\"pg\">pág. 22<\/div>\n<div class=\"pre\">Problema   ·   Revisar<\/div>\n<div class=\"pre\">Pelean y lastiman   ·   Jerarquía normal; dar varios puntos de comida;<br>descornar<\/div>\n<div class=\"pre\">No queda preñada   ·   Condición corporal, macho apto, fechas (fuera de<br>temporada no entran en celo)<\/div>\n<div class=\"pre\">Tos, moco   ·   Corrientes de aire, cama sucia con amoníaco, polvo<br>del heno<\/div>"}]},{"t":"14. Plan para tu escala (Villa Regina)","s":[{"t":"14. Plan para tu escala (Villa Regina)","n":"14","h":"<p>Qué entra en cada terreno<\/p>\n<div class=\"pre\">Terreno   ·   Cabras realistas   ·   Cómo<\/div>\n<div class=\"pre\">Lote 10 × 30 m   ·   No recomendable   ·   Probablemente lo prohíbe la ordenanza<br>(300 m²)   ·   urbana, no hay espacio para corral +<br>huerta, y vecinos + olor + ruido. Usalo<br>para aprender quesería con leche de<br>cabra comprada a un tambo<\/div>\n<div class=\"pre\">~1/4 ha (2.500 m²)   ·   2 a 3 cabras + sus crías   ·   Corral con refugio de ~50–100 m² + un<br>del año   ·   potrero chico para ramoneo; casi todo el<br>heno comprado<\/div>\n<div class=\"pre\">1 ha bajo riego   ·   6 a 10 cabras   ·   0,5–0,7 ha de alfalfa bajo riego te pueden<br>dar la mayor parte del forraje (pastoreo<br>rotativo con eléctrico o corte y acarreo)<\/div>\n<p>Arranque recomendado (año 1)<br>1. Antes de los animales: aprender a hacer chèvre, queso de campo y feta con leche de cabra comprada a un tambo. Te ahorra el error de tener leche y no saber qué hacer.<br>2. Conseguir veterinario, sacar el RENSPA y verificar la normativa municipal.<br>3. Armar refugio, corral, tarima de ordeñe, cerco y depósito de heno.<br>4. Comprar en primavera 2 cabras paridas, en ordeñe, con análisis. Si es posible, una recién parida y otra a mitad de lactancia (o una preñada) para escalonar.<br>5. En el primer otoño: servicio escalonado con macho prestado o inseminación.<br>6. Decidir de antemano qué vas a hacer con los chivitos (quedarte con 1 hembra, vender o faenar el resto).<\/p>\n<p>Page 21 of 23<\/p>\n<div class=\"pg\">pág. 23<\/div>\n<p>Números de referencia por cabra adulta y por año Heno: ~2,5 kg/día → ~900 kg/año (unos 45 fardos chicos de 20 kg). Grano/balanceado: ~200–300 kg por lactancia. Cama: 1–2 m³ de paja o viruta. Estiércol: ~0,5 t por año de excelente abono (con la cama, directo a la pila de compost). Producción esperable con 2 cabras Saanen bien manejadas: ~1.200–1.600 L/año → 120–180 kg de queso (o una mezcla de queso, yogur y dulce de leche) + 2–4 cabritos.<\/p>\n<p>Integración con el resto del proyecto Estiércol + cama → compost para la huerta (y para el biodigestor si lo armás). Suero → gallinas y cerdos, o diluido para compost. Poda de frutales del valle → ramoneo: las chacras vecinas tiran ramas de manzano y peral todos los inviernos. Huerta y frutales siempre cercados contra las cabras. La cortina forestal puede incluir especies forrajeras (sauce, álamo, morera, acacia negra) para cortar ramas en verano.<\/p>\n<p>Costos a presupuestar (sin cifras porque cambian todo el tiempo) Animales con análisis · cerco · refugio · tarima · balde inoxidable y filtros · heno anual · grano · vacunas y veterinario · análisis anuales · servicio o inseminación · equipo de quesería (olla, moldes, prensa, termómetro, heladera-cava, insumos).<\/p>"}]},{"t":"15. Fuentes (las mejores para seguir aprendiendo)","s":[{"t":"15. Fuentes (las mejores para seguir aprendiendo)","n":"15","h":"<p>Argentina (INTA, SENASA y afines) INTA – Conceptos básicos en el ganado caprino — manual de manejo para productores. Martínez, G. M. y Suárez, V. H. (2015). Lechería Caprina: producción, manejo, sanidad y calidad de leche y productos. INTA Ediciones. El libro de referencia en el país. INTA Manfredi – Manejo sanitario del hato caprino INTA – Manejo alimenticio en cabras lecheras INTA – Valorización del queso caprino de Taco Ralo — cómo se hace el queso criollo tradicional. Gobierno de Córdoba – Prácticas para la elaboración de queso de cabra artesanal<\/p>\n<p>Page 22 of 23<\/p>\n<div class=\"pg\">pág. 24<\/div>\n<p>Sitio Argentino de Producción Animal – sección leche caprina — decenas de documentos técnicos gratis. SENASA – Res. 372/2017, Plan Nacional de Control de Brucelosis Caprina MAGyP – Informe de zoonosis caprina 2022<\/p>\n<p>Internacionales (prácticas y muy probadas) Fias Co Farm – cuidado de cabras — uno de los sitios más completos sobre cabras lecheras a escala casera. Fias Co Farm – quesería casera y su receta de chèvre. NC State – Best Management Practices for Dairy Goat Farmers ATTRA – Dairy Goats: Sustainable Production Alabama Extension – Milking dairy goats Embrapa – Kit de ordeñe manual para caprinos (en portugués)<\/p>\n<p>Libros que valen la pena Gianaclis Caldwell, Mastering Artisan Cheesemaking — el mejor para entender el porqué de cada paso. Ricki Carroll, Home Cheese Making — recetario clásico. Gail Damerow / Jerry Belanger, Storey&#x27;s Guide to Raising Dairy Goats.<\/p>\n<p>Dosis de medicamentos, antiparasitarios y vacunas: siempre con un veterinario. Lo de esta guía es para entender y organizarse, no reemplaza la consulta.<\/p>\n<p>Page 23 of 23<\/p>\n<div class=\"pg\">pág. 25<\/div>"}]}],"found":15},{"id":"PRO","title":"Producir alimentos","sub":"Huerta, semillas, granos, frutales, animales, plagas","color":"#5b7a2e","kind":"md","c":[{"t":"La huerta","s":[{"t":"","h":"<p>La huerta da verduras frescas desde los 40 días y no depende de ningún insumo externo si se guardan las propias semillas. Una huerta intensiva de 50 a 100 m² por persona cubre las verduras del año; los cereales y las legumbres de base necesitan campo (capítulo siguiente).<\/p>\n<p>La referencia técnica gratuita en Argentina son las cartillas del programa ProHuerta del INTA (<em>La huerta orgánica<\/em>, <em>Control de plagas en la huerta<\/em>, <em>Fabricación casera de herramientas para la huerta<\/em>). Conviene imprimirlas hoy.<\/p>"},{"t":"Planificar
