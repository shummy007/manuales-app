plugins { id "com.android.application" }

android {
    namespace "ar.biblioteca.manuales"
    compileSdk 34
    defaultConfig {
        applicationId "ar.biblioteca.manuales"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    signingConfigs {
        // Clave fija dentro del repo: así cada versión nueva se instala encima de la anterior.
        fija {
            storeFile file("manuales.keystore")
            storePassword "manuales"
            keyAlias "manuales"
            keyPassword "manuales"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release { minifyEnabled false; signingConfig signingConfigs.fija }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions { noCompress "html" }
}
