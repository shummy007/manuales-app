plugins { id "com.android.application" }

android {
    namespace "ar.biblioteca.manuales"
    compileSdk 34
    defaultConfig {
        applicationId "ar.biblioteca.manuales"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions { noCompress "html" }
}
